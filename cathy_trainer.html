    const S = o.bhR, R = o.bh.K.R; if (!S) return true; S.t += dt;
    const k = clamp(S.t / R.leap, 0, 1); o.pos = V.lerp(S.from, S.to, k); o.facing = V.ang(V.sub(S.to, S.from));
    o.lift = Math.sin(Math.PI * k) * 2.2;   // 3D 높이(보이는 것만): 포물선 도약
    if (S.t < R.leap) return false;
    o.bhR = null; o.lift = 0; const l = o.bh.L('R');
    FX.ring(S.to, 0.5, R.r, '#ff6b9d', 0.45, 0.2); FX.ring(S.to, 0.2, R.core, '#ffd166', 0.35, 0.14); FX.burst(S.to, '#ff6b9d', 24, 7); FX.addShake(8); Sfx.play('slam', S.to);
    for (const u of o.bh.foes()) {
      const d = V.dist(u.pos, S.to); if (d > R.r + u.r) continue;
      const mul = d <= R.core + u.r ? R.coreMul : 1;
      this.skillHit(o, u, (lv(R.base, l) + (o.bonusAd || 0) * R.bad + u.maxHp * R.hpPct) * mul, 'R'); u.addSlow(R.slow * mul, R.slowDur);
    }
    return true;
  },
  // ---------- D 풀스윙 (방망이 무기 스킬) ----------
  dAim(o, dir) { o.bhD = { dir: V.copy(dir), t: 0 }; },   // 0.42초 준비: 휘두를 부채꼴이 차오름
  dSwing(o, dir) {
    const D = o.bh.K.D, l = o.bh.L('D'); o.bhD = null; o.bhSwing = (o.bhSwing || 0) + 1;
    if (o.bh.foes().some(u => u.taunt > 0 && u.tauntBy === o && Geo.inSector(o.pos, V.ang(dir), D.range + o.r, D.angle / 2 * Math.PI / 180, u.pos, u.r))) o.bh.S.count('bhTauntD');   // 코칭: 도발 중인 적을 풀스윙
    FX.slash(o.pos, V.ang(dir), D.range + o.r + 0.3, D.angle / 2 * Math.PI / 180, '#ffd166', 0.3, o.r + 0.2); Sfx.play('slash', o.pos);
    for (const u of o.bh.foes()) {
      if (!Geo.inSector(o.pos, V.ang(dir), D.range + o.r, D.angle / 2 * Math.PI / 180, u.pos, u.r)) continue;
      this.skillHit(o, u, lv(D.base, l) + (o.bonusAd || 0) * D.bad + (o.sp || 0) * lv(D.sp, l), 'D');
      if (u.dead) continue;
      FX.burst(u.pos, '#ffd166', 12, 6); FX.trail(u.pos, V.add(u.pos, V.mul(dir, D.knock)), '#ffd166', 0.5, 0.3);   // 밀려나는 길
      KU.knock(u, dir, D.knock, D.knockTime, () => {   // 벽꿍: 추가 피해 + 기절
        this.skillHit(o, u, lv(D.wallBase, l) + (o.bonusAd || 0) * D.wallBad + (o.sp || 0) * D.wallSp, 'D');
        if (u.applyCC('stun', lv(D.stun, l))) FX.text(u.pos, '벽꿍 기절!', '#ffffff', 15, { bold: true }); FX.addShake(7); FX.ring(u.pos, 0.2, 1.6, '#ffffff', 0.35, 0.16); FX.burst(u.pos, '#ffffff', 16, 6);
      });
    }
  },
  // ---------- 매 스텝 ----------
  update(o, dt) {
    const K = o.bh.K, l = o.bh.L('P');
    for (const q of o.bhT) if ((q.t -= dt) <= 0 && !q.done) { q.done = true; if (!o.dead) q.fn(); }
    o.bhT = o.bhT.filter(q => !q.done);
    for (const w of o.bhW) if ((w.t -= dt) <= 0 && !w.done) { w.done = true; if (!o.dead) this.wBlow(o, w); }
    o.bhW = o.bhW.filter(w => !w.done);
    if (o.bhD && (o.bhD.t += dt) > K.D.windup + 0.2) o.bhD = null;
    // Q: 강화 평타 대기 · 재사용 창 — 끝나면 쿨 시작
    if (o.bhQ && (o.bhQ.t -= dt) <= 0) { o.bhQ = null; o.bh.cdStart('Q'); }
    if (o.bhQ2 && (o.bhQ2.t += dt) > K.Q.recastAfter + K.Q.window) { o.bhQ2 = null; o.bh.cdStart('Q'); }
    // P 장판: 초당 피해 · 둔화 저항
    o.slowRes = o.bhAura > 0 ? lv(K.P.slowRes, l) : 0;
    if (o.bhAura > 0) {
      const C = o.bh.S.counts; if (C) C.bhAuraT = (C.bhAuraT || 0) + dt;   // 코칭: 장판 유지 시간
      o.bhAura -= dt; o.bhAuraAcc += dt;
      if (o.bhAuraAcc >= K.P.tick) {
        o.bhAuraAcc -= K.P.tick;
        FX.ring(o.pos, K.P.r * 0.5, K.P.r, '#3fd0c9', 0.35, 0.08);   // 장판 피해 맥박
        for (const u of o.bh.foes()) if (V.dist(u.pos, o.pos) <= K.P.r + u.r) o.bh.hit(u, (lv(K.P.base, l) + (o.bonusAd || 0) * K.P.bad + u.maxHp * lv(K.P.hpPct, l)) * K.P.tick, 'P', { tick: true });
      }
      if (o.bhAura <= 0) o.bhAura = 0;
    }
    // R 추가 체력 끝
    if (o.bhHp && (o.bhHp.t -= dt) <= 0) { o.maxHp -= o.bhHp.amt; o.hp = Math.min(o.hp, o.maxHp); o.bhHp = null; }
  },
  draw(o, ctx) {
    const K = o.bh.K, T = Game.time, CY = '#3fd0c9', PK = '#ff6b9d', top = -Math.PI / 2;
    const arc = (c, r, k, col, w, al) => { ctx.save(); ctx.strokeStyle = col; ctx.globalAlpha = al; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.beginPath(); ctx.arc(c.x, c.y, r, top, top + Math.PI * 2 * k); ctx.stroke(); ctx.restore(); };
    // P: 장판(굵은 경계 + 바깥으로 번지는 고리) · 평소엔 발밑 신력 게이지(0~100)
    if (o.bhAura > 0) {
      KU.fill(ctx, o.pos, K.P.r, CY, 0.08 + 0.05 * Math.sin(T * 9));
      ctx.save(); ctx.strokeStyle = CY; ctx.globalAlpha = 0.75; ctx.lineWidth = 0.12; Draw.circle(ctx, o.pos.x, o.pos.y, K.P.r); ctx.stroke();
      const f = (T * 1.2) % 1; ctx.globalAlpha = 0.4 * (1 - f); ctx.lineWidth = 0.07; Draw.circle(ctx, o.pos.x, o.pos.y, K.P.r * (0.35 + 0.65 * f)); ctx.stroke(); ctx.restore();
      arc(o.pos, o.r + 0.42, o.bhAura / K.P.dur, CY, 0.1, 0.9);
    } else if (o.bhG > 0) { arc(o.pos, o.r + 0.42, 1, CY, 0.08, 0.18); arc(o.pos, o.r + 0.42, o.bhG / K.P.max, CY, 0.08, 0.75); }
    // Q: 강화 평타 대기 = 분홍 고리(맥동) · 2단계 대기 = 남은 시간 · 재사용 창 = 점선 + 남은 창
    if (o.bhQ) { KU.ring(ctx, o.pos, o.r + 0.2, PK, 0.6 + 0.35 * Math.sin(T * 10), false); arc(o.pos, o.r + 0.2, o.bhQ.t / K.Q.buffDur, PK, 0.12, 0.9); if (o.bhQ.stage === 2) KU.ring(ctx, o.pos, o.r + 0.32, PK, 0.6, false); }
    else if (o.bhQ2) { const ready = o.bhQ2.t >= K.Q.recastAfter; KU.ring(ctx, o.pos, o.r + 0.2, PK, ready ? 0.5 : 0.2, true); if (ready) arc(o.pos, o.r + 0.2, 1 - (o.bhQ2.t - K.Q.recastAfter) / K.Q.window, PK, 0.1, 0.85); }
    // W: 떨어질 자리 — 굵은 경계 + 차오르는 원 · 비형이 범위 안이면 밝게(보호막 받는 자리)
    for (const w of o.bhW) {
      const inside = V.dist(o.pos, w.pos) <= K.W.r + o.r, k = 1 - w.t / K.W.delay;
      ctx.save(); ctx.strokeStyle = '#5ff0e6'; ctx.globalAlpha = inside ? 0.95 : 0.65; ctx.lineWidth = inside ? 0.16 : 0.1; Draw.circle(ctx, w.pos.x, w.pos.y, K.W.r); ctx.stroke(); ctx.restore();
      KU.fill(ctx, w.pos, K.W.r * k, '#5ff0e6', 0.12 + 0.12 * k);
    }
    // E 도발: 도발당한 적과 이어진 선
    for (const u of o.bh.foes()) if (u.taunt > 0 && u.tauntBy === o) {
      ctx.save(); ctx.strokeStyle = '#ffd166'; ctx.globalAlpha = 0.5 + 0.3 * Math.sin(T * 14); ctx.lineWidth = 0.08; ctx.setLineDash([0.2, 0.12]); ctx.beginPath(); ctx.moveTo(o.pos.x, o.pos.y); ctx.lineTo(u.pos.x, u.pos.y); ctx.stroke(); ctx.restore();
      KU.ring(ctx, u.pos, u.r + 0.25, '#ffd166', 0.8, false);
    }
    // R: 착지 자리 — 경계 + 가운데(30% 더) + 도약 진행만큼 차오름 · 지금 있는 자리의 그림자
    if (o.bhR) {
      const k = clamp(o.bhR.t / K.R.leap, 0, 1);
      ctx.save(); ctx.strokeStyle = PK; ctx.globalAlpha = 0.85; ctx.lineWidth = 0.14; Draw.circle(ctx, o.bhR.to.x, o.bhR.to.y, K.R.r); ctx.stroke(); ctx.restore();
      KU.fill(ctx, o.bhR.to, K.R.r * k, PK, 0.15); KU.ring(ctx, o.bhR.to, K.R.core, '#ffd166', 0.8, false); KU.fill(ctx, o.bhR.to, K.R.core, '#ffd166', 0.1 + 0.15 * k);
      KU.fill(ctx, o.pos, o.r * (1 - 0.4 * Math.sin(Math.PI * k)), '#000000', 0.35);
    }
    // D 풀스윙 준비(0.42초): 휘두를 부채꼴이 차오름
    if (o.bhD) {
      const D = K.D, a0 = V.ang(o.bhD.dir), h = D.angle / 2 * Math.PI / 180, R = D.range + o.r, k = clamp(o.bhD.t / D.windup, 0, 1);
      ctx.save(); ctx.fillStyle = '#ffd166'; ctx.strokeStyle = '#ffd166';
      ctx.globalAlpha = 0.12; ctx.beginPath(); ctx.moveTo(o.pos.x, o.pos.y); ctx.arc(o.pos.x, o.pos.y, R, a0 - h, a0 + h); ctx.closePath(); ctx.fill();
      ctx.globalAlpha = 0.6; ctx.lineWidth = 0.06; ctx.stroke();
      ctx.globalAlpha = 0.3; ctx.beginPath(); ctx.moveTo(o.pos.x, o.pos.y); ctx.arc(o.pos.x, o.pos.y, R * k, a0 - h, a0 + h); ctx.closePath(); ctx.fill(); ctx.restore();
    }
  },
};

// ============================== 플레이어 키트 ==============================
PKits.bihyung = {
  short: { Q: '뚝딱', W: '천벌', E: '내기', R: '신명', D: '풀스윙' },
  noAim: ['Q'],   // Q: 다음 평타 강화(재입력 = 2단계)
  def: { E: { moveCancel: false }, R: { moveCancel: false }, D: { moveCancel: false } },
  label(p, k) { if (k === 'Q' && BihyungCore.qReady2(p)) return '뚝딱 2'; return this.short[k]; },
  init(p) {
    p.melee = true;
    p.bh = { K: p.K, color: p.color, L: k => p.L(k), hit: (u, amt, k, o) => p.hitS(u, amt, k, o), foes: () => p.foes(), level: () => p.build.level || 1,
      cdStart: k => p.startCd(k), cdSet: (k, v) => { p.skills[k].cd = v; } };
    Object.defineProperty(p.bh, 'S', { get: () => p.S });
    BihyungCore.attach(p);
  },
  // 근접 평타: 투사체 없이 즉시
  fireAA(p, t) { p.aaLand(t); return true; },
  onAAHit(p, u) { BihyungCore.onAA(p, u); },
  reset(p) { if (p.bhHp) { p.maxHp -= p.bhHp.amt; p.hp = Math.min(p.hp, p.maxHp); } Object.assign(p, { bhG: 0, bhAura: 0, bhAuraAcc: 0, bhQ: null, bhQ2: null, bhW: [], bhR: null, bhHp: null, bhT: [], bhD: null, lift: 0, slowRes: 0 }); },
  recast(p, k) { return k === 'Q' && BihyungCore.qReady2(p); },
  instant(p, k) { if (k === 'Q' && BihyungCore.qReady2(p)) { BihyungCore.qCast(p); p.instantUsed('Q'); return true; } return false; },
  update(p, dt) {
    BihyungCore.update(p, dt);
    if (p.bhR && !(p.cast && p.cast.k === 'R')) BihyungCore.rStep(p, 99);   // 도약 시전이 끊기면(저지 불가 0.9초 뒤 기절 등) 남은 도약을 바로 마무리(착지) — 면역·피해 감소·공중 상태가 남지 않게
  },
  cast: {
    Q(p) { if (!BihyungCore.qCast(p)) return false; p.instantUsed('Q'); if (p.attackTarget == null) { const e = Game.nearestEnemy(p.pos, p.aaCfg().range + p.r + 0.8, p); if (e) p.attackTarget = e; } return true; },
    // W: 7m 안 지점 → 1.5초 뒤 폭발
    W(p, aim) {
      const W = p.K.W, pt = p.ptIn(aim, W.range);
      p.beginCast('W', pt, { windup: () => W.windup, recovery: () => 0.05, fire(q) { BihyungCore.wCast(q, pt); Sfx.play('throw'); } }, {});
      return true;
    },
    // E: 커서 방향 2.5~5.3m 돌진 → 처음 부딪힌 적 도발
    E(p, aim) {
      const E = p.K.E, dir = p.dirTo(aim), dist = V.dist(p.pos, aim);
      p.beginCast('E', aim, { windup: () => E.windup, recovery: () => 0.1,
        fire(q, c) { q.startCd('E'); c.data.st = BihyungCore.eStart(q, dir, dist); Sfx.play('dash'); },
        tick(q, c, dt) { return BihyungCore.eStep(q, c.data.st, dt) || c.t > 1; } }, {});
      return true;
    },
    // R: 5m 안 지점으로 도약
    R(p, aim) {
      p.beginCast('R', aim, { windup: () => 0, recovery: () => 0.15,
        fire(q) { BihyungCore.rStart(q, aim); },
        tick(q, c, dt) { return BihyungCore.rStep(q, dt); } }, {});
      return true;
    },
    // D 풀스윙: 0.42초 뒤 커서 방향 180°
    D(p, aim) {
      const D = p.K.D, dir = p.dirTo(aim); BihyungCore.dAim(p, dir);
      p.beginCast('D', aim, { windup: () => D.windup, recovery: () => 0.1, fire(q) { q.startCd('D'); q.facing = V.ang(dir); BihyungCore.dSwing(q, dir); } }, {});
      return true;
    },
  },
  shape(p, k) {
    const K = p.K;
    if (k === 'W') return { kind: 'circle', range: K.W.range, r: K.W.r };
    if (k === 'E') return { kind: 'line', len: K.E.max, width: K.E.width };
    if (k === 'R') return { kind: 'circle', range: K.R.range, r: K.R.r };
    if (k === 'D') return { kind: 'cone', len: K.D.range + p.r, angle: K.D.angle };
    return null;
  },
  draw(p, ctx) { BihyungCore.draw(p, ctx); },
  hud(p) {
    const K = p.K, b = [[p.bhAura > 0 ? `도깨비 불 ${fmt(p.bhAura, 1)}초` : `신력 ${Math.round(p.bhG)}/${K.P.max}`, p.bhAura > 0 ? '#3fd0c9' : '#8a93a6']];
    if (p.bhQ) b.push([p.bhQ.stage === 2 ? '뚝딱! 2단계 — 다음 평타' : '뚝딱! — 다음 평타', '#ff6b9d']);
    else if (p.bhQ2) b.push([BihyungCore.qReady2(p) ? `Q 재사용 ${fmt(K.Q.recastAfter + K.Q.window - p.bhQ2.t, 1)}초` : `Q 재사용 대기 ${fmt(K.Q.recastAfter - p.bhQ2.t, 1)}`, '#ff6b9d']);
    if (p.bhHp) b.push([`도깨비 감투 +${p.bhHp.amt} (${fmt(p.bhHp.t, 0)}초)`, p.color]);
    return b;
  },
};

// ============================== 플레이어블: 클로에 (암기) + 인형 니나 ==============================
// 클로에 = 원거리 실험체 틀(RangedPlayer + PKits.chloe) · AI 클로에 = RangedDuelist + Kits.chloe(4_d_chloe_ai.js)
// 니나 = 클로에를 따라다니는 별도 유닛(Doll, kind 'doll' — 실험체 판정 아님). 니나·스킬 효과는 ChloeCore를 플레이어·AI가 함께 씀
//   주인(o)은 o.ch(어댑터)로 쿨·피해·대상만 알려 줌 → 같은 규칙으로 동작
// 수치: CONFIG.rangedKits.chloe (나무위키 2026-10-05 + 12.2 버프) · 근거 docs/er_notes_playables.md 10장 · ⚠ = 출처 없는 추정값
// 니나 조종(플레이어): Alt + 우클릭(또는 휠 클릭) — 적 = 그 적 공격 · 클로에 = 따라다니기만(공격 안 함) · 바닥 = 그 지점으로(도착 전엔 클로에 명령 무시)
//   기본: 클로에가 평타하는 대상을 같이 공격 · 클로에에게서 10m 넘게 떨어지면 클로에 옆으로 순간이동
//   소멸: 일정 시간 뒤 클로에 현재 체력 20%를 써서 니나 최대 체력 80%로 부활 · 죽어 있는 동안 Q·R 불가, E 재사용 불가, W 에어본 없음

class Doll extends Unit {
  constructor(owner) {
    const K = CONFIG.rangedKits.chloe;
    super({ team: owner.team, x: owner.pos.x - 0.6, y: owner.pos.y + 0.8, r: K.P.r, hp: 1000, def: 0, ms: owner.baseMs, color: '#f7c6dc', name: '니나', kind: 'doll', facing: owner.facing });
    Geo.pushOut(this.pos, this.r);
    Object.assign(this, { owner, K, mode: 'follow', goal: null, order: null, aaCd: 0, swing: null, dash: null, asB: 0, msB: 0, respawnT: 0, busyT: 0 });
    this.refresh(true);
  }
  // 통계: 니나의 공격은 클로에 이름으로 넣으므로(클로에 기록) 니나 자체 통계(받은 피해 등)는 버림 — Unit 기본(NullStats)
  // 니나 능력치 = 클로에의 (60% + 레벨당 2%) + 패시브 레벨별 추가
  ratio() { const P = this.K.P; return Math.min(1, P.ratio + P.ratioLv * this.owner.ch.level()); }
  refresh(full) {
    const o = this.owner, P = this.K.P, k = this.ratio(), L = o.ch.L('P'), hp0 = this.maxHp;
    this.ad = o.ad * k + lv(P.bonusAd, L); this.def = o.def * k + lv(P.bonusDef, L);
    this.critChance = (o.critChance || 0) * k; this.sp = (o.sp || 0) * k; this.penPct = o.ch.pen() * k;
    this.maxHp = Math.round(o.maxHp * k + lv(P.bonusHp, L)); this.regen = o.regen || 0;
    if (full) this.hp = this.maxHp; else if (hp0 && hp0 !== this.maxHp) this.hp = Math.min(this.maxHp, this.hp * this.maxHp / hp0);
  }
  speed() { const o = this.owner; return (o.baseMs + ItemFx.msFlat(o)) * (1 + this.msB) * this.msMul(); }   // 클로에 이속에 비례
  atkSpd() { return this.K.P.as * (1 + this.asB); }
  canMove() { return super.canMove() && !this.dash && !(this.busyT > 0); }   // busyT: W 내려찍기 준비(제자리)
  foes() { return Game.units.filter(u => u.team !== this.team && u.team !== 2 && !u.dead && u.kind !== 'ward' && !(u.untargetable > 0)); }
  // 클로에 옆(약간 뒤) 자리
  followSpot() {
    const o = this.owner, back = V.fromAng(o.facing + Math.PI * 0.75);
    return Geo.pushOut(V.add(o.pos, V.mul(back, this.K.P.follow)), this.r);
  }
  teleportNear() { this.pos = this.followSpot(); this.moveTarget = null; this.swing = null; FX.ring(this.pos, 0.2, 0.9, this.color, 0.35); }
  update(dt) {
    this.tickStatus(dt); if (this.dead) return;
    const o = this.owner, P = this.K.P;
    if (o.dead) { this.hp = 0; this.dead = true; return; }
    if (this.aaCd > 0) this.aaCd -= dt;
    if (this.busyT > 0) { this.busyT -= dt; this.vel = { x: 0, y: 0 }; return; }
    // E2 돌진: 클로에 쪽으로 날아가며 경로의 적에게 피해 (지형 통과)
    const D = this.dash;
    if (D) {
      D.t += dt; const k = Math.min(1, D.t / D.dur), prev = V.copy(this.pos); this.pos = V.lerp(D.from, D.to, k);
      for (const u of this.foes()) if (!D.hit.has(u.id) && Geo.segDist(u.pos, prev, this.pos) <= u.r + D.width / 2) { D.hit.add(u.id); if (D.onHit) D.onHit(u); }
      if (k >= 1) { this.dash = null; Geo.pushOut(this.pos, this.r); }
      return;
    }
    if (V.dist(this.pos, o.pos) > P.leash) { this.teleportNear(); if (this.mode === 'point') this.mode = 'idle'; }   // 10m 넘게 떨어지면 클로에 옆으로
    // 평타 휘두르기(선딜 → 타격)
    if (this.swing) {
      const S = this.swing; S.t += dt;
      if (!this.canAct() || S.target.dead) this.swing = null;
      else if (S.t >= P.windup / Math.max(0.5, this.atkSpd())) { this.swing = null; this.aaCd = 1 / this.atkSpd(); if (V.dist(this.pos, S.target.pos) - S.target.r - this.r <= P.range + 0.6) ChloeCore.ninaHit(o, this, S.target); }
    }
    // 대상: 명령한 적 > 클로에가 평타하는 대상 (지점 이동 중·클로에 지정이면 공격 안 함)
    let tgt = null;
    if (this.mode === 'enemy') { const t = this.order; if (!t || t.dead || t.untargetable > 0 || !Vision.visible(o, t)) this.mode = 'idle'; else tgt = t; }
    if (this.mode === 'follow' || this.mode === 'idle') tgt = o.ch.target();
    if (this.mode === 'point') { this.moveTarget = this.goal; if (V.dist(this.pos, this.goal) < 0.2) { this.mode = 'idle'; this.moveTarget = null; } }
    else if (tgt) {
      const d = V.dist(this.pos, tgt.pos) - tgt.r - this.r; this.facing = V.ang(V.sub(tgt.pos, this.pos));
      if (d <= P.range) { this.moveTarget = null; if (!this.swing && this.aaCd <= 0 && this.canAct()) this.swing = { t: 0, target: tgt }; }
      else this.moveTarget = V.copy(tgt.pos);
    } else if (this.mode === 'follow' || this.mode === 'self') {
      const s = this.followSpot(); this.moveTarget = V.dist(this.pos, s) > 0.5 ? s : null;
    } else this.moveTarget = null;
    this.moveStep(dt);
  }
}

// ============================== 클로에 공통 규칙 (플레이어·AI) ==============================
// 주인 o의 어댑터 o.ch: K · L(k) · hit(u, 양, 키, 옵션) · foes() · cdStart(k) · cdMul(k, 배) · cdSet(k, 값) · level() · pen() · target() · noAA(초) · color · S
const ChloeCore = {
  attach(o) {
    Object.assign(o, { nina: null, spin: null, eRe: null, link: null, chPick: null, traps: [], lastAAT: null, chT: [], chSeq: 0 });
    o.nina = new Doll(o); Game.units.push(o.nina);
    o.linkFn = () => o.link && o.nina && !o.nina.dead ? { u: o.nina, hit: o.ch.K.R.hitShare, share: o.ch.K.R.linkShare } : null;
    o.nina.linkFn = () => o.link && !o.dead ? { u: o, hit: o.ch.K.R.hitShare, share: o.ch.K.R.linkShare } : null;
  },
  up(o) { return !!(o.nina && !o.nina.dead); },
  later(o, t, fn) { o.chT.push({ t, fn }); },
  // 니나 평타: 클로에가 2번 이상 평타한 대상이면 찌르기 추가 피해(표식 터뜨림)
  ninaHit(o, n, u) {
    const crit = rnd() < n.critChance, mul = o.diff ? o.diff.dmgMul : 1;
    Combat.damage(o, u, n.ad * (crit ? 1.75 : 1) * mul, { type: 'normal', source: o.diff ? '적 니나' : 'Nina', crit, pen: n.penPct });
    FX.burst(u.pos, n.color, 4, 3);
    const P = o.ch.K.P;
    if (u.chloeBy === o && u.chloeMarks >= P.marks && Game.time - u.chloeT < 5) { u.chloeMarks = 0; o.ch.hit(u, lv(P.stab, o.ch.L('P')) + n.ad * P.stabAd, 'P', { pen: n.penPct }); FX.text(u.pos, '찌르기', n.color, 12, { bold: true }); }
  },
  onAAHit(o, u) {
    o.lastAAT = { u, t: Game.time };
    u.chloeMarks = (u.chloeBy === o && Game.time - (u.chloeT || -99) < 5 ? u.chloeMarks || 0 : 0) + 1; u.chloeBy = o; u.chloeT = Game.time;
  },
  e2Ready(o) { return !!(o.eRe && Game.time - o.eRe.t0 >= o.ch.K.E.recastAfter && this.up(o)); },
  // ---------- 스킬 효과 ----------
  // Q 공격 명령: 니나 주변 반경 2.5m 베기 + 둔화 (0.2초 뒤 판정, 클로에 행동은 막지 않음, 니나 평타 초기화)
  q(o) {
    const n = o.nina, Q = o.ch.K.Q; if (!this.up(o)) return false;
    o.ch.cdStart('Q'); n.swing = null; n.aaCd = 0; const l = o.ch.L('Q');
    FX.ring(n.pos, 0.3, Q.radius, n.color, 0.25);
    this.later(o, Q.delay, () => {
      if (n.dead) return; FX.ring(n.pos, Q.radius * 0.6, Q.radius, '#ffffff', 0.25); let hit = false;
      for (const u of n.foes()) if (V.dist(u.pos, n.pos) <= Q.radius + u.r) { hit = true; o.ch.hit(u, lv(Q.base, l) + n.ad * Q.ninaAd, 'Q', { pen: n.penPct }); u.addSlow(lv(Q.slow, l), Q.slowDur); }
      o.ch.S.resolveShot('Q', hit);
    });
    return true;
  },
  // W 1단계: 3초 회전 (주변 고정 피해 · 둔화, 평타 불가 · Q·E만 사용 가능)
  w1(o) { o.spin = { t: o.ch.K.W.spin, acc: 0, t0: Game.time }; FX.text(o.pos, o.ch.K.W.name, o.ch.color, 12, { bold: true }); Sfx.play('spool', o.pos); },
  // W 2단계: 지점(6.5m)에 칼날 자수 → 니나 순간이동 내려찍기(에어본) → 자수가 클로에 쪽으로 튕김
  w2(o, aim) {
    const W = o.ch.K.W, l = o.ch.L('W'), d = Math.min(W.range, V.dist(o.pos, aim)), dir = d > 0.05 ? V.norm(V.sub(aim, o.pos)) : V.fromAng(o.facing);
    const pt = Geo.pushOut(V.add(o.pos, V.mul(dir, d)), 0.2); o.spin = null; o.ch.cdStart('W'); Sfx.play('throw'); o.facing = V.ang(dir);
    FX.text(pt, '칼날 자수', o.ch.color, 12, { bold: true });
    this.later(o, W.throwTime, () => {
      FX.ring(pt, 0.3, W.r, o.ch.color, 0.3); let hit = false;
      for (const u of o.ch.foes()) if (V.dist(u.pos, pt) <= W.r + u.r) { hit = true; o.ch.hit(u, lv(W.base, l) + o.ad * W.ad, 'W'); u.addSlow(lv(W.slow, l), W.slowDur); }
      o.ch.S.resolveShot('W', hit);
      const n = o.nina; if (!this.up(o) || n.root > 0 || n.stun > 0) return;   // 니나가 이동 방해를 받았으면 내려찍기 없음
      n.pos = V.copy(pt); n.dash = null; n.swing = null; n.moveTarget = null; n.busyT = W.slamDelay; FX.ring(pt, 0.2, 1, n.color, 0.3);
      this.later(o, W.slamDelay, () => {
        if (n.dead) return; FX.ring(n.pos, 0.5, W.slamR, '#ffffff', 0.35); Sfx.play('slam', n.pos);
        for (const u of n.foes()) if (V.dist(u.pos, n.pos) <= W.slamR + u.r) { o.ch.hit(u, lv(W.slam, l) + n.ad * W.slamAd, 'W', { pen: n.penPct }); if (u.applyCC('stun', W.airborne)) { u.airborneT = Game.time + W.airborne; FX.text(u.pos, '에어본', '#ffd166', 12, { bold: true }); } }
        const back = V.dist(o.pos, n.pos) > 0.1 ? V.norm(V.sub(o.pos, n.pos)) : { x: 1, y: 0 };
        o.chPick = { pos: Geo.pushOut(V.add(n.pos, V.mul(back, Math.min(W.bounce, V.dist(o.pos, n.pos)))), 0.2), t: W.pickLife };
      });
    });
  },
  // E 1단계 경로 피해 (돌진 시작점 → 끝점)
  e1Hits(o, from, to) { const E = o.ch.K.E; for (const u of o.ch.foes()) if (Geo.segDist(u.pos, from, to) <= u.r + E.width / 2) o.ch.hit(u, lv(E.base, o.ch.L('E')) + o.ad * E.ad, 'E'); },
  // E 2단계: 니나가 클로에 쪽으로 최대 7m 돌진 · 적중 시 Q 쿨 초기화
  e2(o) {
    const E = o.ch.K.E, l = o.ch.L('E'), n = o.nina; o.eRe = null; o.ch.cdStart('E');
    const d = Math.min(E.ninaDist, V.dist(n.pos, o.pos)), dir = d > 0.05 ? V.norm(V.sub(o.pos, n.pos)) : V.fromAng(o.facing); let reset = false;
    n.swing = null; n.dash = { from: V.copy(n.pos), to: V.add(n.pos, V.mul(dir, Math.max(0.5, d))), t: 0, dur: Math.max(0.05, d / E.ninaSpeed), width: E.ninaWidth, hit: new Set(),
      onHit: u => { o.ch.hit(u, lv(E.ninaBase, l) + n.ad * E.ninaAd, 'E', { pen: n.penPct }); if (!reset && (isHero(u) || u.kind === 'dummy')) { reset = true; o.ch.cdSet('Q', 0); FX.text(o.pos, 'Q 초기화', '#ffd166', 12, { bold: true }); } } };
    FX.text(n.pos, '니나 돌진', n.color, 12, { bold: true });
  },
  // R 생명 공유: 5초 링크 — 피해 분담(맞은 쪽 70% + 다른 쪽 60%) · 둘 다 체력이 다 떨어져야 사망 · 연결선 고정 피해 · W·E 남은 쿨 30% 감소
  r(o) {
    const R = o.ch.K.R; o.ch.cdStart('R'); o.link = { t: R.dur, acc: 0, contact: {} };
    for (const k of ['W', 'E']) o.ch.cdMul(k, 1 - R.cdCut);
    FX.text(o.pos, R.name, '#ffd166', 14, { bold: true }); Sfx.play('ult');
  },
  // D 마름쇠 투척: 지점(5m)에 6초 마름쇠
  d(o, aim) {
    const D = o.ch.K.D, l = o.ch.L('D'), dd = Math.min(D.range, V.dist(o.pos, aim)), dir = dd > 0.05 ? V.norm(V.sub(aim, o.pos)) : V.fromAng(o.facing), pos = Geo.pushOut(V.add(o.pos, V.mul(dir, dd)), 0.2);
    o.traps.push({ pos, r: D.r, life: D.life, n: {}, last: {}, id: ++o.chSeq, dmg: lv(D.base, l) + (o.bonusAd || 0) * D.bad + (o.sp || 0) * lv(D.sp, l) });
    FX.ring(pos, 0.3, D.r, o.ch.color, 0.3); Sfx.play('throw');
  },
  // ---------- 매 스텝 ----------
  update(o, dt) {
    const K = o.ch.K, n = o.nina;
    for (const q of o.chT) if ((q.t -= dt) <= 0 && !q.done) { q.done = true; if (!o.dead) q.fn(); }
    o.chT = o.chT.filter(q => !q.done);
    // 니나 소멸 → 부활 (클로에 현재 체력 20% 소모, 니나 최대 체력 80%)
    if (n && n.dead && !o.dead) {
      n.respawnT += dt;
      if (n.respawnT >= lv(K.P.respawn, o.ch.L('P'))) {
        n.respawnT = 0; n.resetState(); n.refresh(true); n.hp = n.maxHp * K.P.respawnHp; n.mode = 'follow'; n.order = null; n.teleportNear();
        o.hp = Math.max(1, o.hp - o.hp * K.P.respawnCost); FX.text(n.pos, '니나 부활', n.color, 13, { bold: true }); Sfx.play('revive', n.pos);
      }
    }
    if (n && !n.dead && Math.floor(Game.time * 2) !== Math.floor((Game.time - dt) * 2)) n.refresh(false);   // 0.5초마다 능력치 갱신(버프 반영)
    // W 인형극 회전: 주변 고정 피해 + 둔화, 평타 불가 · 3초 안에 안 던지면 쿨 50% 반환
    const S = o.spin;
    if (S) {
      const W = K.W; S.t -= dt; S.acc += dt; o.ch.noAA(0.15);
      if (S.acc >= W.tickEvery) {
        S.acc -= W.tickEvery; const amt = (lv(W.tick, o.ch.L('W')) + o.ad * W.tickAd) * W.tickEvery;
        for (const u of o.ch.foes()) if (V.dist(u.pos, o.pos) <= W.spinR + u.r) { o.ch.hit(u, amt, 'W', { type: 'true', tick: true }); u.addSlow(W.spinSlow, W.tickEvery + 0.1); }
      }
      if (S.t <= 0 || o.stun > 0 || o.silence > 0 || o.dead) { o.spin = null; o.ch.cdStart('W'); o.ch.cdMul('W', W.refund); }
    }
    if (o.chPick && ((o.chPick.t -= dt) <= 0 || V.dist(o.chPick.pos, o.pos) <= K.W.pickR)) {   // 튕겨 나온 칼날 자수 줍기 → 이속
      if (o.chPick.t > 0) { o.addMsBuff(K.W.ms, K.W.msDur, false, 'chloeW'); FX.text(o.pos, '자수 회수', o.ch.color, 11); }
      o.chPick = null;
    }
    // E 재사용 시간 끝 → 쿨 시작
    if (o.eRe && (Game.time > o.eRe.until || o.dead)) { o.eRe = null; o.ch.cdStart('E'); }
    // R 생명 공유: 니나 공속·이속 · 연결선 고정 피해(오래 닿을수록 증가) · 한쪽이 죽으면 체력이 바닥난 다른 쪽도
    const L = o.link, R = K.R, lr = o.ch.L('R');
    if (n) { n.asB = L ? lv(R.as, lr) : 0; n.msB = L ? lv(R.ms, lr) : 0; }
    if (L) {
      L.t -= dt; L.acc += dt;
      if (L.acc >= R.tick && n && !n.dead) {
        L.acc -= R.tick;
        for (const u of o.ch.foes()) {
          if (Geo.segDist(u.pos, o.pos, n.pos) <= u.r + 0.15) { const c = (L.contact[u.id] = (L.contact[u.id] || 0) + R.tick), dps = lerp(lv(R.lineMin, lr), lv(R.lineMax, lr), clamp(c / R.ramp, 0, 1)); o.ch.hit(u, dps * R.tick, 'R', { type: 'true', tick: true }); }
          else L.contact[u.id] = 0;
        }
      }
      if (n && o.dead !== n.dead) { const alive = o.dead ? n : o; if (alive.hp <= 1.01) Combat.kill(null, alive); }
      if (L.t <= 0 || !n || n.dead || o.dead) o.link = null;
    }
    // D 마름쇠: 밟은 적에게 피해(밟을 때마다 45% 감소) + 둔화
    const Dk = K.D;
    for (const z of o.traps) {
      z.life -= dt;
      for (const u of o.ch.foes()) {
        if (u.kind === 'ward' || V.dist(u.pos, z.pos) > z.r + u.r * 0.5) continue;
        if (Game.time - (z.last[u.id] ?? -99) < Dk.rehit) continue;
        const cnt = z.n[u.id] || 0; z.n[u.id] = cnt + 1; z.last[u.id] = Game.time;
        o.ch.hit(u, z.dmg * Math.pow(1 - Dk.decay, cnt), 'D'); u.addSlow(lv(Dk.slow, o.ch.L('D')), Dk.slowDur);
      }
    }
    o.traps = o.traps.filter(z => z.life > 0);
  },
  // ---------- 그리기 (2D 세계) ----------
  draw(o, ctx) {
    const K = o.ch.K, n = o.nina, col = o.ch.color;
    for (const z of o.traps) { ctx.save(); ctx.globalAlpha = 0.25 * Math.min(1, z.life); ctx.fillStyle = '#c9cfd8'; Draw.circle(ctx, z.pos.x, z.pos.y, z.r); ctx.fill(); ctx.restore(); for (let i = 0; i < 7; i++) { const a = i * 2.4 + z.id, q = V.add(z.pos, V.mul(V.fromAng(a), z.r * (0.25 + (i % 3) * 0.25))); KU.fill(ctx, q, 0.07, '#e6e9ef', 0.9); } }
    if (o.spin) { KU.ring(ctx, o.pos, K.W.spinR, col, 0.6, true); ctx.save(); ctx.strokeStyle = '#ffe9a8'; ctx.lineWidth = 0.05; ctx.globalAlpha = 0.7; ctx.beginPath(); ctx.arc(o.pos.x, o.pos.y, K.W.spinR * 0.8, Game.time * 9, Game.time * 9 + 1.2); ctx.stroke(); ctx.restore(); }
    if (o.chPick) KU.fill(ctx, o.chPick.pos, 0.22, '#ffd166', 0.9);
    if (n && !n.dead && (n.team === myTeam() || Vision.visible(Game.player, n))) {
      if (o.link) { ctx.save(); ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 0.12; ctx.globalAlpha = 0.6 + 0.3 * Math.sin(Game.time * 12); ctx.beginPath(); ctx.moveTo(o.pos.x, o.pos.y); ctx.lineTo(n.pos.x, n.pos.y); ctx.stroke(); ctx.restore(); }
      else { ctx.save(); ctx.strokeStyle = 'rgba(255,190,220,.25)'; ctx.lineWidth = 0.025; ctx.setLineDash([0.12, 0.12]); ctx.beginPath(); ctx.moveTo(o.pos.x, o.pos.y); ctx.lineTo(n.pos.x, n.pos.y); ctx.stroke(); ctx.restore(); }   // 재봉실(조종 줄)
      if (this.e2Ready(o) && o === Game.player) { ctx.save(); ctx.globalAlpha = 0.25; ctx.fillStyle = n.color; Draw.oRect(ctx, n.pos, V.ang(V.sub(o.pos, n.pos)), Math.min(K.E.ninaDist, V.dist(n.pos, o.pos)), K.E.ninaWidth); ctx.restore(); }
      if (n.mode === 'point' && n.goal && o === Game.player) KU.ring(ctx, n.goal, 0.3, n.color, 0.6);
    }
    for (const u of Game.units) if (u.chloeBy === o && u.chloeMarks > 0 && !u.dead && Game.time - u.chloeT < 5) for (let i = 0; i < Math.min(K.P.marks, u.chloeMarks); i++) { const at = V.add(u.pos, { x: -0.18 + i * 0.36, y: -u.r - 0.3 }); KU.fill(ctx, at, 0.13, '#ff8ab8', 0.95); KU.ring(ctx, at, 0.17, '#ffffff', 0.7, false); }   // 2타 표식
  },
};

// ============================== 플레이어 키트 ==============================
PKits.chloe = {
  short: { Q: '공격', W: '인형극', E: '리퍼', R: '생명', D: '마름쇠' },
  noAim: ['Q', 'W', 'R'],   // W 재입력(던지기)은 커서 지점
  def: { E: { dash: true }, D: { moveCancel: false } },
  label(p, k) { if (k === 'W' && p.spin) return '던지기'; if (k === 'E' && ChloeCore.e2Ready(p)) return '니나!'; return this.short[k]; },
  init(p) {
    p.ch = { K: p.K, color: p.color,
      L: k => p.L(k), hit: (u, amt, k, o) => p.hitS(u, amt, k, o), foes: () => p.foes(), level: () => p.build.level || 1, pen: () => p.penPct || 0,
      cdStart: k => p.startCd(k), cdMul: (k, m) => { const s = p.skills[k]; s.cd *= m; if (k === 'W' && m < 1 && !p.link) s.cdMax = s.cd; }, cdSet: (k, v) => { p.skills[k].cd = v; },
      noAA: t => { p.noAA = Math.max(p.noAA, t); }, target: () => this.target(p) };
    Object.defineProperty(p.ch, 'S', { get: () => p.S });
    ChloeCore.attach(p);
    p.petCmd = (pt, t) => this.command(p, pt, t);
  },
  // 니나가 같이 칠 대상: 클로에의 평타 대상(또는 방금 평타한 대상)
  target(p) {
    const ok = u => u && !u.dead && u.team !== p.team && u.kind !== 'ward' && !(u.untargetable > 0) && Vision.visible(p, u);
    if (ok(p.attackTarget)) return p.attackTarget;
    if (p.lastAAT && Game.time - p.lastAAT.t < 2.5 && ok(p.lastAAT.u)) return p.lastAAT.u;
    return null;
  },
  // 니나 명령 (Alt + 우클릭)
  command(p, pt, t) {
    const n = p.nina; if (!n || n.dead) { FX.toastFor(p, '니나가 없습니다 (부활 대기)', '#aaa'); return; }
    if (t && t.team !== p.team && !t.dead) { n.mode = 'enemy'; n.order = t; FX.mark(t.pos, '#ff8ab8'); }
    else if (V.dist(pt, p.pos) < p.r + 0.4) { n.mode = 'self'; n.order = null; FX.text(p.pos, '니나: 따라와', n.color, 11); }
    else { n.mode = 'point'; n.goal = Geo.pushOut(V.copy(pt), n.r); n.order = null; FX.mark(n.goal, '#ff8ab8'); }
  },
  onAAHit(p, u) { ChloeCore.onAAHit(p, u); },
  // 콤보 트레이너 초기화: 스킬 상태 + 니나 되살림(새로 만들지 않음)
  reset(p) { Object.assign(p, { spin: null, eRe: null, link: null, chPick: null, traps: [], chT: [], lastAAT: null }); const n = p.nina; if (n) { n.resetState(); n.refresh(true); n.respawnT = 0; n.mode = 'follow'; n.order = null; n.dash = null; n.busyT = 0; n.teleportNear(); } },
  recast(p, k) { return (k === 'W' && !!p.spin) || (k === 'E' && ChloeCore.e2Ready(p)); },
  busy(p, k) { if (p.spin && !['Q', 'E', 'W', 'D'].includes(k)) { FX.toastFor(p, '인형극 중에는 Q·E·무기 스킬만 쓸 수 있습니다', '#aaa'); return true; } return false; },   // 나무위키 콤보 W1 → E1 → 무기 스킬 → W2
  update(p, dt) { ChloeCore.update(p, dt); },
  cast: {
    Q(p) { if (!ChloeCore.up(p)) { FX.toastFor(p, '니나가 없어 공격 명령을 쓸 수 없습니다', '#aaa'); return false; } ChloeCore.q(p); p.instantUsed('Q'); return true; },
    W(p, aim) { if (p.spin) { ChloeCore.w2(p, aim); p.instantUsed('W'); return true; } ChloeCore.w1(p); p.instantUsed('W'); return true; },
    E(p, aim) {
      const E = p.K.E;
      if (p.eRe) {
        if (!ChloeCore.e2Ready(p)) { FX.toastFor(p, ChloeCore.up(p) ? '니나 돌진 준비 중' : '니나가 없어 재사용할 수 없습니다', '#aaa'); return false; }
        ChloeCore.e2(p); p.instantUsed('E'); return true;
      }
      const dir = p.dirTo(aim), from = V.copy(p.pos);
      p.dash('E', dir, E.dist, E.time, 0.99, q => ChloeCore.e1Hits(q, from, q.pos));
      p.eRe = { t0: Game.time, until: Game.time + E.window }; FX.text(p.pos, E.name, p.color, 12, { bold: true }); Sfx.play('blink'); return true;
    },
    R(p) {
      if (PKits.chloe.busy(p, 'R')) return false;
      if (!ChloeCore.up(p)) { FX.toastFor(p, '니나가 없어 생명 공유를 쓸 수 없습니다', '#aaa'); return false; }
      ChloeCore.r(p); p.instantUsed('R'); return true;
    },
    D(p, aim) {
      const D = p.K.D;
      p.beginCast('D', aim, { windup: () => D.windup, recovery: () => 0.05, fire(q, c) { q.startCd('D'); ChloeCore.d(q, c.aim); } }, {});
      return true;
    },
  },
  shape(p, k) {
    const K = p.K;
    if (k === 'W') return p.spin ? { kind: 'circle', range: K.W.range, r: K.W.r } : { kind: 'self', r: K.W.spinR };
    if (k === 'E') return p.eRe ? null : { kind: 'dash', len: K.E.dist };
    if (k === 'D') return { kind: 'circle', range: K.D.range, r: K.D.r };
    return null;
  },
  draw(p, ctx) { ChloeCore.draw(p, ctx); },
  hud(p) {
    const n = p.nina, b = [];
    if (!n || n.dead) b.push([`니나 부활 ${fmt(Math.max(0, lv(p.K.P.respawn, p.L('P')) - (n ? n.respawnT : 0)), 1)}초`, '#8a93a6']);
    else b.push([`니나 ${Math.round(n.hp)}/${n.maxHp}${n.mode === 'self' ? ' · 따라오기' : n.mode === 'point' ? ' · 이동' : n.mode === 'enemy' ? ' · 공격' : ''}`, n.color]);
    if (p.spin) b.push([`인형극 ${fmt(p.spin.t, 1)} (W: 던지기)`, p.color]);
    if (p.eRe) b.push([ChloeCore.e2Ready(p) ? `E: 니나 돌진 ${fmt(p.eRe.until - Game.time, 1)}` : 'E 재사용 준비…', '#ffffff']);
    if (p.link) b.push([`생명 공유 ${fmt(p.link.t, 1)}`, '#ffd166']);
    if (p.chPick) b.push(['자수 줍기 → 이속', '#ffd166']);
    return b;
  },
};

// ============================== 플레이어블: 쇼이치 (단검 · 암살자) ==============================
// 플레이어 = 실험체 키트 틀(RangedPlayer + PKits.shoichi, 근접 평타) · AI = RangedDuelist + Kits.shoichi(4_d_shoichi_ai.js)
// 스킬 효과는 ShoichiCore를 플레이어·AI가 함께 씀 (주인 o의 어댑터 o.sh: K · L · hit · foes · cdStart · cdSet · cdGet · shot · level · color · S)
// 수치: CONFIG.rangedKits.shoichi (나무위키 + 공식 스킬 영상) · 근거 docs/er_notes_playables.md 15장 · ⚠ = 출처 없는 추정값
//   핵심 = 바닥 단검: 스킬(일반 Q·W 제외)이 단검을 남김 → 주우면(걸어서·W 경로) 5m 안 적에게 투척(협상 표식 대상 우선) · W로 주우면 W 쿨 초기화
//   P 부당거래: 스킬 적중마다 5초 중첩(최대 5) → 다음 평타 추가 피해 + 적 뒤에 단검
//   Q 표리: 앞 찌르기 → 적중 시 쿨 3초 감소 + 10초 동안 다음 Q 강화(부채꼴 + 정면에 단검)
//   W 비약: 적(등 뒤로) 또는 내 단검으로 순간 이동, 경로의 적에게 피해 · 단검을 주우면 쿨 초기화
//   E 협상: 뒤로 물러나며 단검 투척 → 피해 + 둔화 + 5초 표식(던진 단검 피해 +25%, 맞을 때마다 E 쿨 1초 감소, 처치 시 쿨 90% 감소) · 대상 뒤에 단검(0.75초 뒤 떨어짐)
//   R 무자비: 0.3초 휘두르기 → 주변 2.5m 피해 + 둔화 → 고정 방향 4곳에 단검 투척(경로 피해) → 단검 4개
//   D 망토와 단검(단검 무기 스킬): 1차 이속 → 3초 안 2차 대상 뒤로 이동 + 현재 체력 비례 피해 + 둔화

const ShoichiCore = {
  attach(o) {
    Object.assign(o, { shDags: [], shSeq: 0, shStk: 0, shStkT: 0, shQ2: 0, shMark: null, shD: null, shT: [] });
  },
  later(o, t, fn) { o.shT.push({ t, fn }); },
  isFoeUnit(u) { return isHero(u) || u.kind === 'dummy'; },
  // ---------- P 부당거래 중첩 ----------
  stack(o, u) {
    if (!u || !this.isFoeUnit(u)) return;
    const P = o.sh.K.P, was = o.shStk; o.shStk = Math.min(P.max, o.shStk + 1); o.shStkT = P.stackDur;
    if (was < P.max && o.shStk >= P.max) FX.ring(o.pos, o.r, o.r + 0.6, '#ff4d4d', 0.3, 0.1);
  },
  // 스킬 피해 + 중첩 (투척 단검은 중첩 X)
  skillHit(o, u, amt, k, opt, stack = true) { if (!u || u.dead) return; o.sh.hit(u, amt, k, opt); if (stack) this.stack(o, u); },
  // ---------- 바닥 단검 ----------
  spawn(o, pos, fall = 0) {
    const D = o.sh.K.dagger, p = Geo.pushOut(V.copy(pos), 0.25);
    p.x = clamp(p.x, 0.4, CONFIG.world.w - 0.4); p.y = clamp(p.y, 0.4, CONFIG.world.h - 0.4);
    o.shDags.push({ pos: p, land: fall, t: D.life + fall, id: ++o.shSeq }); o.sh.S.count('shDagOn');   // 코칭: 깔린 단검 수
    if (fall <= 0) FX.ring(p, 0.1, D.pickR, '#ff6b6b', 0.25, 0.08);
  },
  landed(d) { return d.land <= 0; },
  // 줍기: W 쿨 초기화 + 5m 안 적에게 투척(표식 대상 우선)
  pick(o, d) {
    const i = o.shDags.indexOf(d); if (i < 0) return; o.shDags.splice(i, 1);
    const DK = o.sh.K.dagger, P = o.sh.K.P, lP = o.sh.L('P');
    o.sh.cdSet('W', 0); o.sh.S.count('shPick');
    FX.burst(d.pos, '#ff9f9f', 6, 3);
    const foes = o.sh.foes().filter(u => V.dist(u.pos, o.pos) <= DK.throwR + u.r && Vision.visible(o, u));
    const M = o.shMark, t = (M && foes.includes(M.u)) ? M.u : foes.sort((a, b) => V.dist(a.pos, o.pos) - V.dist(b.pos, o.pos))[0];
    if (!t) return;
    const amt = lv(P.dagger, lP) + (o.sp || 0) * P.daggerSp;
    const pr = o.sh.shot({ from: V.copy(d.pos), dir: V.norm(V.sub(t.pos, d.pos)), speed: DK.throwSpeed, range: 99, home: t, only: t, width: 0.3, len: 0.6, color: '#ff6b6b', onHit: u => {
      const marked = o.shMark && o.shMark.u === u;
      this.skillHit(o, u, amt * (marked ? 1 + o.sh.K.E.markAmp : 1), 'P', { name: '부당거래 단검' }, false);
      if (marked) { o.shMark.t = o.sh.K.E.markDur; o.sh.cdSet('E', Math.max(0, o.sh.cdGet('E') - o.sh.K.E.markCut)); }
    } });
    if (pr) pr.look = 'knife';
  },
  // ---------- 평타 적중: 5중첩이면 추가 피해 + 적 뒤 단검 ----------
  aaHit(o, u) {
    const P = o.sh.K.P; if (o.shStk < P.max || !this.isFoeUnit(u) || u.dead) return;
    const l = o.sh.L('P'); o.shStk = 0; o.shStkT = 0; o.sh.S.count('shPassive');
    o.sh.hit(u, lv(P.base, l) + (o.sp || 0) * P.sp + u.maxHp * lv(P.hpPct, l), 'P', { name: '부당거래' });
    FX.ring(u.pos, 0.2, 1.1, '#ff4d4d', 0.3, 0.12); FX.text(u.pos, '부당거래', '#ff6b6b', 12, { bold: true });
    this.spawn(o, V.add(u.pos, V.mul(V.norm(V.sub(u.pos, o.pos)), u.r + P.behind)), P.fall);
  },
  // ---------- Q 표리 ----------
  qCast(o, dir) {
    const Q = o.sh.K.Q, l = o.sh.L('Q'), enh = o.shQ2 > 0, a = V.ang(dir), amt = lv(Q.base, l) + (o.sp || 0) * Q.sp; let hit = false;
    for (const u of o.sh.foes()) {
      const inA = enh ? Geo.inSector(o.pos, a, Q.len2 + o.r, Q.angle2 / 2 * Math.PI / 180, u.pos, u.r)
        : (() => { const rel = V.sub(u.pos, o.pos), al = V.dot(rel, dir), s = Math.abs(rel.x * dir.y - rel.y * dir.x); return al >= -u.r && al <= Q.len + o.r + u.r && s <= Q.width / 2 + u.r; })();
      if (!inA) continue; this.skillHit(o, u, amt, 'Q'); if (this.isFoeUnit(u)) hit = true;
    }
    if (enh) FX.slash(o.pos, a, Q.len2 + o.r, Q.angle2 / 2 * Math.PI / 180, '#ff4d4d', 0.22, o.r * 0.5);
    else FX.slash(o.pos, a, Q.len + o.r, 0.3, '#ff9f9f', 0.16, o.r * 0.5);
    o.sh.cdStart('Q');
    if (enh) { o.shQ2 = 0; this.spawn(o, V.add(o.pos, V.mul(dir, Q.front))); }   // 강화 Q: 정면에 단검(얇은 벽 너머 가능 — 벽 안이면 밖으로 밀어냄)
    if (hit) { o.sh.cdSet('Q', Math.max(0, o.sh.cdGet('Q') - Q.cut)); o.shQ2 = Q.enhDur; }
    return hit;
  },
  // ---------- W 비약: 순간 이동 + 경로 피해 + 경로의 단검 줍기 ----------
  // to = { dagger } 또는 { unit }
  wGo(o, to) {
    const W = o.sh.K.W, l = o.sh.L('W'), from = V.copy(o.pos);
    let dest;
    if (to.dagger) dest = V.copy(to.dagger.pos);
    else { const u = to.unit, dir = V.dist(u.pos, from) > 0.05 ? V.norm(V.sub(u.pos, from)) : V.fromAng(o.facing); dest = Geo.pushOut(V.add(u.pos, V.mul(dir, u.r + o.r + W.behind - 0.5)), o.r); }
    o.sh.cdStart('W'); o.sh.S.count('shW');
    const amt = lv(W.base, l) + (o.sp || 0) * W.sp; let hitHero = false;
    for (const u of o.sh.foes()) if (Geo.segDist(u.pos, from, dest) <= W.width / 2 + u.r) { this.skillHit(o, u, amt, 'W'); if (isHero(u) || u.kind === 'dummy') hitHero = true; }
    if (hitHero) o.sh.S.count('shWHit');
    o.pos = dest; o.facing = V.ang(V.sub(dest, from)); o.moveTarget = null;
    FX.trail(from, dest, '#7fa8ff', 0.6, 0.3); FX.burst(dest, '#9fc0ff', 8, 4);
    for (const d of o.shDags.slice()) if (this.landed(d) && Geo.segDist(d.pos, from, dest) <= o.sh.K.dagger.pickR + 0.2) this.pick(o, d);
    return hitHero;
  },
  // ---------- E 협상 ----------
  eFire(o, dir) {
    const E = o.sh.K.E, l = o.sh.L('E'), amt = lv(E.base, l) + (o.sp || 0) * E.sp;
    o.sh.cdStart('E');
    const pr = o.sh.shot({ dir, speed: E.speed, range: E.range, width: E.width, len: 0.7, color: '#ff6b6b', onHit: u => {
      this.skillHit(o, u, amt, 'E'); u.addSlow(lv(E.slow, l), E.slowDur);
      if (this.isFoeUnit(u)) { o.shMark = { u, t: E.markDur }; FX.text(u.pos, '협상', '#ff6b6b', 12, { bold: true }); o.sh.S.count('shE'); }
      this.spawn(o, V.add(u.pos, V.mul(dir, u.r + E.behind)), E.fall);
    } });
    if (pr) pr.look = 'knife';
  },
  // ---------- R 무자비 ----------
  rFire(o) {
    const R = o.sh.K.R, l = o.sh.L('R'), c = V.copy(o.pos);
    FX.ring(c, 0.4, R.r, '#ff4d4d', 0.35, 0.16); FX.slash(c, o.facing, R.r, Math.PI, '#ff6b6b', 0.25, 0.5);
    if (o === Game.player) FX.addShake(4);
    for (const u of o.sh.foes()) if (V.dist(u.pos, c) <= R.r + u.r) { this.skillHit(o, u, lv(R.base, l) + (o.sp || 0) * R.sp, 'R'); u.addSlow(R.slow, R.slowDur); }
    R.angles.forEach((deg, i) => this.later(o, R.gap * i, () => {
      const dir = V.fromAng(deg * Math.PI / 180), len = Geo.clampDash(c, dir, R.dRange, 0.2), blocked = len < R.dRange - 0.1, end = V.add(c, V.mul(dir, len));
      FX.trail(c, end, '#ff6b6b', 0.25, 0.2);
      for (const u of o.sh.foes()) if (Geo.segDist(u.pos, c, end) <= R.dWidth / 2 + u.r) this.skillHit(o, u, lv(R.dBase, l) + (o.sp || 0) * R.dSp, 'R', { name: '무자비 단검' });
      this.spawn(o, blocked ? V.copy(o.pos) : end, 0.12);   // 벽에 막히면 발밑에(벽궁)
    }));
  },
  // ---------- D 망토와 단검 2차: 대상 뒤로 + 현재 체력 비례 ----------
  dHit(o, u) {
    const D = o.sh.K.D, l = o.sh.L('D'), from = V.copy(o.pos), dir = V.dist(u.pos, from) > 0.05 ? V.norm(V.sub(u.pos, from)) : V.fromAng(o.facing);
    o.pos = Geo.pushOut(V.add(u.pos, V.mul(dir, u.r + o.r + 0.2)), o.r); o.facing = V.ang(V.mul(dir, -1));
    FX.trail(from, o.pos, '#b18cff', 0.3, 0.25);
    this.skillHit(o, u, lv(D.dmg, l) + (o.bonusAd || 0) * D.bad + (o.sp || 0) * D.sp + u.hp * D.curHp, 'D');
    u.addSlow(lv(D.slow, l), D.slowDur);
    for (const d of o.shDags.slice()) if (this.landed(d) && V.dist(d.pos, o.pos) <= o.sh.K.dagger.pickR + o.r) this.pick(o, d);   // 대상 뒤 단검 바로 줍기
  },
  // ---------- 매 스텝 ----------
  update(o, dt) {
    const K = o.sh.K;
    for (const q of o.shT) if ((q.t -= dt) <= 0 && !q.done) { q.done = true; if (!o.dead) q.fn(); }
    o.shT = o.shT.filter(q => !q.done);
    if (o.shStkT > 0 && (o.shStkT -= dt) <= 0) o.shStk = 0;
    if (o.shQ2 > 0) o.shQ2 = Math.max(0, o.shQ2 - dt);
    const M = o.shMark;
    if (M) { if (M.u.dead) { o.sh.cdSet('E', o.sh.cdGet('E') * (1 - K.E.killCut)); o.shMark = null; } else if ((M.t -= dt) <= 0) o.shMark = null; }
    if (o.shD && (o.shD.t -= dt) <= 0) { o.shD = null; o.sh.cdStart('D'); }
    for (const d of o.shDags) { if (d.land > 0 && (d.land -= dt) <= 0) FX.ring(d.pos, 0.1, K.dagger.pickR, '#ff6b6b', 0.25, 0.08); d.t -= dt; }
    o.shDags = o.shDags.filter(d => d.t > 0);
    if (!o.dead) for (const d of o.shDags.slice()) if (this.landed(d) && V.dist(d.pos, o.pos) <= K.dagger.pickR + o.r * 0.5) this.pick(o, d);   // 걸어서 줍기
  },
  // ---------- 그리기 ----------
  draw(o, ctx, mine) {
    const K = o.sh.K, T = Game.time;
    for (const d of o.shDags) {
      if (!mine && !Vision.pointVisible(d.pos)) continue;
      if (!this.landed(d)) { const k = clamp(1 - d.land / 0.75, 0, 1); ctx.save(); ctx.strokeStyle = '#ff6b6b'; ctx.globalAlpha = 0.5; ctx.lineWidth = 0.06; ctx.setLineDash([0.12, 0.1]); Draw.circle(ctx, d.pos.x, d.pos.y, K.dagger.pickR * (1.6 - 0.6 * k)); ctx.stroke(); ctx.restore(); continue; }   // 떨어지는 중
      if (mine) { ctx.save(); ctx.strokeStyle = '#7fa8ff'; ctx.globalAlpha = 0.16; ctx.lineWidth = 0.05; Draw.circle(ctx, d.pos.x, d.pos.y, K.W.range); ctx.stroke(); ctx.restore(); }   // 이 단검에서 W가 닿는 거리
      const fade = d.t < 1.5 ? 0.4 + 0.4 * Math.sin(T * 14) : 0.9;
      KU.fill(ctx, d.pos, K.dagger.pickR, '#3d6dff', 0.18); KU.ring(ctx, d.pos, K.dagger.pickR, '#7fa8ff', fade, false);
      ctx.save(); ctx.strokeStyle = '#ff4d4d'; ctx.lineWidth = 0.08; ctx.beginPath(); ctx.moveTo(d.pos.x - 0.12, d.pos.y + 0.18); ctx.lineTo(d.pos.x + 0.12, d.pos.y - 0.18); ctx.stroke(); ctx.restore();   // 꽂힌 단검
    }
    if (o.shStk >= K.P.max) KU.ring(ctx, o.pos, o.r + 0.18, '#ff4d4d', 0.55 + 0.35 * Math.sin(T * 10), false);   // 5중첩: 발밑 붉은 오라(다음 평타 강화)
    if (o.shQ2 > 0) KU.ring(ctx, o.pos, o.r + 0.32, '#ff9f9f', 0.5, true);   // 강화 Q 준비(가방이 붉게)
    const M = o.shMark;
    if (M && !M.u.dead && (mine || Vision.visible(Game.player, M.u))) { const u = M.u; KU.ring(ctx, u.pos, u.r + 0.3, '#ff6b6b', 0.85, false); ctx.save(); ctx.strokeStyle = '#ff6b6b'; ctx.lineWidth = 0.1; ctx.beginPath(); ctx.arc(u.pos.x, u.pos.y, u.r + 0.45, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * clamp(M.t / K.E.markDur, 0, 1)); ctx.stroke(); ctx.restore(); }
  },
};

// ============================== 플레이어 키트 ==============================
PKits.shoichi = {
  short: { Q: '표리', W: '비약', E: '협상', R: '무자비', D: '망토' },
  noAim: ['R'],
  def: { W: { moveCancel: false }, E: { moveCancel: false }, R: { moveCancel: false }, D: { moveCancel: false } },
  label(p, k) { if (k === 'Q' && p.shQ2 > 0) return '표리 강화'; if (k === 'D' && p.shD) return '단검'; return this.short[k]; },
  init(p) {
    p.melee = true;
    p.sh = { K: p.K, color: p.color, L: k => p.L(k), hit: (u, amt, k, o) => p.hitS(u, amt, k, o), foes: () => p.foes(), level: () => p.build.level || 1,
      cdStart: k => p.startCd(k), cdSet: (k, v) => { p.skills[k].cd = v; }, cdGet: k => p.skills[k].cd, shot: o => p.shot(o) };
    Object.defineProperty(p.sh, 'S', { get: () => p.S });
    ShoichiCore.attach(p);
  },
  fireAA(p, t) { p.aaLand(t); return true; },   // 근접 평타
  onAAHit(p, u) { ShoichiCore.aaHit(p, u); },
  reset(p) { ShoichiCore.attach(p); },
  recast(p, k) { return k === 'D' && !!p.shD; },
  // E 뒤로 빠지는 동작(0.3초 뒤) 중 W·R·D = 캔슬
  instant(p, k, aim) {
    if (p.cast && p.cast.k === 'E' && p.cast.phase === 'recovery' && ['W', 'R', 'D'].includes(k)) { p.cast = null; return false; }
    return false;
  },
  update(p, dt) { ShoichiCore.update(p, dt); },
  // W 대상: 커서 근처(1.2m) 내 단검 우선 → 커서 위 적
  wTarget(p, aim) {
    const W = p.K.W, ds = p.shDags.filter(d => ShoichiCore.landed(d) && V.dist(d.pos, p.pos) <= W.range + 0.3 && V.dist(d.pos, aim) <= W.pickAim).sort((a, b) => V.dist(a.pos, aim) - V.dist(b.pos, aim));
    if (ds.length) return { dagger: ds[0] };
    const u = Game.pickEnemyAt(aim, CONFIG.input.pickRadius, p);
    if (u && u.kind !== 'ward' && !(u.untargetable > 0) && Vision.visible(p, u) && V.dist(p.pos, u.pos) - u.r <= W.range) return { unit: u };
    return null;
  },
  cast: {
    Q(p, aim) {
      const Q = p.K.Q;
      p.beginCast('Q', aim, { windup: () => Q.windup, recovery: () => 0.1, fire(q, c) { ShoichiCore.qCast(q, c.dir); Sfx.play('slash', q.pos); } }, {});
      return true;
    },
    // W: 단검(커서 근처) 또는 적에게 순간 이동 — 시전 시간 없음
    W(p, aim) {
      const to = PKits.shoichi.wTarget(p, aim);
      if (!to) { FX.toastFor(p, '비약: 사거리(5.5m) 안의 단검이나 적을 지정하세요', '#aaa'); Sfx.playFor(p, 'error'); return false; }
      ShoichiCore.wGo(p, to); p.instantUsed('W'); Sfx.play('blink'); return true;
    },
    // E: 커서 방향 투척 → 뒤로 물러남(0.3초 뒤 다른 스킬로 캔슬)
    E(p, aim) {
      const E = p.K.E;
      p.beginCast('E', aim, { windup: () => E.windup, recovery: () => E.lock,
        fire(q, c) { ShoichiCore.eFire(q, c.dir); Sfx.play('throw'); const back = V.mul(c.dir, -1); c.data.from = V.copy(q.pos); c.data.to = V.add(q.pos, V.mul(back, Geo.clampDash(q.pos, back, E.back, q.r))); },
        tick(q, c) { const k = Math.min(1, c.t / E.backTime); q.pos = V.lerp(c.data.from, c.data.to, k); return k >= 1; } }, {});
      return true;
    },
    // R: 제자리 0.3초 휘두르기 → 주변 피해 + 단검 4개
    R(p) {
      const R = p.K.R;
      p.beginCast('R', p.pos, { windup: () => R.windup, recovery: () => 0.1, start(q) { FX.text(q.pos, R.name, q.color, 14, { bold: true }); }, fire(q) { q.startCd('R'); ShoichiCore.rFire(q); Sfx.play('ult'); } }, {});
      return true;
    },
    // D 망토와 단검: 1차 = 이속 1초(3초 안 재입력) · 2차 = 대상(2.5m) 뒤로
    D(p, aim) {
      const D = p.K.D;
      if (!p.shD) { p.shD = { t: D.window }; p.addMsBuff(lv(D.ms, p.L('D')), D.msDur, false, 'shD'); p.instantUsed('D'); FX.text(p.pos, '망토', p.color, 12, { bold: true }); Sfx.play('blink'); return true; }
      const t = p.targetAt(aim, 'D'); if (!t) return false;
      return p.chaseCast('D', t, D.range, () => {
        p.beginCast('D', t.pos, { windup: () => D.windup, recovery: () => 0.1, fire(q) { if (t.dead) return; ShoichiCore.dHit(q, t); q.shD = null; q.startCd('D'); Sfx.play('aa'); } }, {});
      });
    },
  },
  shape(p, k) {
    const K = p.K;
    if (k === 'Q') return p.shQ2 > 0 ? { kind: 'cone', len: K.Q.len2 + p.r, angle: K.Q.angle2 } : { kind: 'line', len: K.Q.len + p.r, width: K.Q.width };
    if (k === 'W') return { kind: 'circle', range: K.W.range, r: 0.5 };
    if (k === 'E') return { kind: 'line', len: K.E.range, width: K.E.width };
    if (k === 'R') return { kind: 'self', r: K.R.r };
    if (k === 'D') return p.shD ? { kind: 'target', range: K.D.range } : null;
    return null;
  },
  draw(p, ctx) { ShoichiCore.draw(p, ctx, true); },
  hud(p) {
    const K = p.K, b = [[p.shStk >= K.P.max ? '부당거래 5 — 다음 평타 강화' : `부당거래 ${p.shStk}/${K.P.max}`, p.shStk >= K.P.max ? '#ff6b6b' : '#8a93a6']];
    const n = p.shDags.filter(d => ShoichiCore.landed(d)).length; if (n) b.push([`단검 ${n}개 (W로 주우면 쿨 초기화)`, '#7fa8ff']);
    if (p.shQ2 > 0) b.push([`표리 강화 ${fmt(p.shQ2, 1)}`, '#ff9f9f']);
    if (p.shMark) b.push([`협상 표식 ${fmt(p.shMark.t, 1)}`, '#ff6b6b']);
    if (p.shD) b.push([`망토 → 단검(D) ${fmt(p.shD.t, 1)}`, '#b18cff']);
    return b;
  },
};

// ============================== 휴식 (X) — 시즌 12 규칙 ==============================
// 공식 12.0 패치노트(2026-08-06) "휴식 시스템 개편":
//  · 전투 상태와 무관하게 언제든 시작 · 3단계 캐스팅 — 각 단계가 끝날 때 회복량이 한 번에 적용, 도중 취소 시 진행 중 단계는 회복 없음
//    1단계 3초: 최대 체력 15% / 2단계 3초: 15% / 3단계 4초: 50%  · 모든 단계가 끝나도 휴식 모션은 유지(추가 회복 없음)
//  · 단계가 끝나기 0.25초 이내에 이동을 입력하면 그 단계 회복을 마친 뒤 이동
//  · 취소: X 재입력·이동 명령·피해·군중 제어 → 1초 재사용 대기
//  · 휴식 중 체력바에 캐스팅 바·예상 회복량 표시(적에게도 보임) / 시야 감소: 낮 8.5→7.5m, 밤 0.4m (공식 1.0.0)
const Rest = {
  stageOf(u) { return Math.min(u.rest.stage, CONFIG.rest.stages.length - 1); },
  done(u) { return u.rest && u.rest.stage >= CONFIG.rest.stages.length; },
  inCombat(u) { return Game.time - (u.combatT ?? -99) < CONFIG.rest.combatDur; },
  can(u) { return !u.dead && !u.rest && (u.restCd || 0) <= 0 && u.canAct() && u.canMove() && !u.cast && !(u.act && u.act.type !== 'aa'); },
  // 다음 단계 완료 시 회복량(예상)
  nextHeal(u) { if (!u.rest || Rest.done(u)) return 0; return Math.min(u.maxHp - u.hp, u.maxHp * CONFIG.rest.stages[Rest.stageOf(u)].hp); },
  start(u, quiet) {
    if (!Rest.can(u)) { if (!quiet && (u.restCd || 0) > 0) FX.toastFor(u, `휴식 재사용 대기 ${fmt(u.restCd, 1)}초`, '#aaa'); return false; }
    u.rest = { stage: 0, t: 0 };
    u.moveTarget = null; u.vel = { x: 0, y: 0 }; if (u.act) u.act = null;
    if (u.attackTarget !== undefined) u.attackTarget = null; if (u.attackMove !== undefined) u.attackMove = null; if (u.aa) u.aa.phase = 'none';
    FX.textFor(u, '휴식', '#9fe0ff', 12, { bold: true }, quiet ? 'owner' : 'all');
    return true;
  },
  // 단계 완료: 그 단계 회복량을 한 번에
  complete(u) {
    const S = CONFIG.rest.stages[u.rest.stage], h = u.heal(u.maxHp * S.hp, true);
    if (h > 0.5) FX.textFor(u, `+${Math.round(h)} (휴식 ${u.rest.stage + 1}단계)`, '#5dff9a', 12, { bold: true });
    u.rest.stage++; u.rest.t = 0;
  },
  // voluntary = 본인이 이동·공격·스킬·X로 끝냄 (0.25초 유예 적용)
  stop(u, why, voluntary) {
    const R = u.rest; if (!R) return;
    if (voluntary && !Rest.done(u) && CONFIG.rest.stages[R.stage].dur - R.t <= CONFIG.rest.grace) Rest.complete(u);   // 단계 끝나기 직전 입력 → 회복 후 이동
    u.rest = null; u.restCd = CONFIG.rest.cd;
    if (why) FX.textFor(u, '휴식 취소 · ' + why, '#ffb347', 11);
  },
  // 피해를 받으면 전투 상태 + 휴식 취소 (패치노트: "피해를 받으면 휴식이 취소")
  onDamage(src, tgt, o) {
    if (!o.tick) { tgt.combatT = Game.time; if (src) src.combatT = Game.time; }
    if (tgt.rest) Rest.stop(tgt, '피격');
  },
  update(u, dt) {
    if (u.restCd > 0) u.restCd = Math.max(0, u.restCd - dt);
    const R = u.rest; if (!R) return;
    if (u.dead) { u.rest = null; return; }
    if (u.stun > 0 || u.root > 0 || u.fear > 0 || u.forced || u.silence > 0 || (u.slows && u.slows.length)) { Rest.stop(u, '군중 제어'); return; }
    if (Rest.done(u)) return;   // 모든 단계 완료 — 모션만 유지
    R.t += dt;
    if (R.t >= CONFIG.rest.stages[R.stage].dur) Rest.complete(u);
  },
  // 체력바 아래 캐스팅 바 + 예상 회복량 (아군·적 모두 보임)
  draw(ctx, u) {
    const R = u.rest; if (!R) return;
    const done = Rest.done(u), S = done ? null : CONFIG.rest.stages[R.stage], k = done ? 1 : clamp(R.t / S.dur, 0, 1);
    const w = 1.5, x = u.pos.x - w / 2, y = u.pos.y + u.r + 0.22;
    ctx.save();
    ctx.strokeStyle = 'rgba(159,224,255,.35)'; ctx.lineWidth = 0.06; Draw.circle(ctx, u.pos.x, u.pos.y, u.r + 0.18); ctx.stroke();
    ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(x - 0.03, y - 0.03, w + 0.06, 0.2);
    ctx.fillStyle = done ? '#5d7d8c' : '#9fe0ff'; ctx.fillRect(x, y, w * k, 0.14);
    ctx.font = 'bold 0.3px sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#9fe0ff';
    ctx.fillText(done ? '휴식 완료' : `휴식 ${R.stage + 1}단계  +${Math.round(Rest.nextHeal(u))}`, u.pos.x, y + 0.48);
    ctx.restore();
  },
};

// ============================== 전술 스킬 (F) ==============================
// 수치: 나무위키 「이터널 리턴/전술 스킬」 (2026-10, 시즌 12). 모두 쿨다운 고정. 레벨 = 빌드별 전술 스킬 레벨(CONFIG.skills.F.lvByBuild)
// 'L' = 캐릭터 레벨, '추가 체력' = 현재 최대 체력 − 레벨 기본 체력
const TACTICAL_ORDER = ['blink', 'repulser', 'redstorm', 'lightwing', 'truthblade', 'plasmadash', 'quake', 'transcend', 'artifact', 'nullify'];
const Tactical = {
  def(key) { return CONFIG.tactical[key] || CONFIG.tactical.blink; },
  key() { return CONFIG.tactical[Settings.tactical] ? Settings.tactical : 'blink'; },
  L(p) { return (p.build && p.build.level) || 12; },
  bonusHp(p) { return Math.max(0, p.maxHp - (p.baseHpAtLv || p.maxHp)); },
  foes(p, pos, r) { return Game.enemies(p).concat(Game.units.filter(u => u.kind === 'animal' && !u.dead)).filter(u => !u.dead && !(u.untargetable > 0) && V.dist(u.pos, pos) - u.r <= r); },
  hit(p, u, amt) { Combat.damage(p, u, amt, { type: 'skill', source: 'F', trauma: true }); Events.emit('skillHit', { k: 'F', target: u }); },
  // 짧은 돌진 (벽 못 넘음)
  dash(p, aim, dist, speed, onEnd) {
    const dir = V.dist(aim, p.pos) > 0.05 ? V.norm(V.sub(aim, p.pos)) : V.fromAng(p.facing), len = Geo.clampDash(p.pos, dir, dist, p.r);
    p.facing = V.ang(dir); p.moveTarget = null;
    p.forced = { from: V.copy(p.pos), to: V.add(p.pos, V.mul(dir, len)), t: 0, dur: Math.max(0.05, len / speed), onEnd: () => onEnd && onEnd(dir) };
    FX.trail(p.pos, V.add(p.pos, V.mul(dir, len)), '#9fd8ff', 0.25, 0.25);
    return dir;
  },
  use(p, aim) {
    const k = this.key(), D = this.def(k), lv = p.skills.F.lv, L = this.L(p), at = i => (Array.isArray(i) ? i[clamp(lv - 1, 0, i.length - 1)] : i);
    p.interruptForCast(); p.S.cast('F'); Vision.act(p, 'skill'); if (p.breakStealth) p.breakStealth();
    FX.text(p.pos, D.name, '#9fd8ff', 12, { bold: true });
    switch (k) {
      case 'blink': p.blink(aim); return true;
      case 'repulser': {   // 3m 이동 후 가장 가까운 적 실험체에게 미사일 5발(2레벨 8발), 발당 10+L+최대 체력 0.6% 고정 피해
        this.dash(p, aim, D.dist, D.speed, () => {
          const t = Game.enemies(p).filter(u => u.kind !== 'animal' && Vision.visible(p, u) && V.dist(u.pos, p.pos) <= D.range).sort((a, b) => V.dist(a.pos, p.pos) - V.dist(b.pos, p.pos))[0];
          if (!t) return;
          const n = at(D.missiles);
          for (let i = 0; i < n; i++) {
            const pr = new Projectile({ team: p.team, owner: p, kind: 'shot', color: '#9fd8ff', len: 0.35, pos: V.copy(p.pos), dir: V.fromAng(V.ang(V.sub(t.pos, p.pos)) + (i - (n - 1) / 2) * 0.22), speed: D.mSpeed, range: 99, width: 0.2,
              onUnit: (pr2, u) => { if (u !== t) return 'continue'; Combat.damage(p, u, D.mBase + L * D.mLv + u.maxHp * D.mHp, { type: 'true', source: 'F', noShake: true }); return 'stop'; } });
            pr.homeTarget = t; pr.homeTurn = 14; pr.ignoreWalls = !(p instanceof Cathy); Game.projectiles.push(pr);   // 플라즈마 유도탄: 기존 규칙 유지(내 캐릭터는 벽에 막힘)
          }
        });
        break;
      }
      case 'redstorm':   // 0.1초 2.5m 이동 + 기본 공격 사거리 10%(15%) 증가 10(12)초
        this.dash(p, aim, D.dist, D.dist / D.time); p.rangeBuff = { pct: at(D.range), t: at(D.dur) }; break;
      case 'lightwing':  // 둔화 제거, 7초 이속 15/20%+L%·공속 20% / 2레벨: 적 실험체 평타 시 +0.5초
        p.slows = []; p.addMsBuff(at(D.ms) + L * D.msLv, D.dur, false, 'lightwing'); p.lightWing = { t: D.dur }; break;
      case 'truthblade': {   // 주변 2.5m 140+L×20 스킬 피해, 2.5초 이속 20% + 추가 대상당 5/10%(최대 30/40%) / 2레벨: 칼날 하나 더 50+L×10
        const hit = this.foes(p, p.pos, D.r);
        for (const u of hit) { this.hit(p, u, D.base + L * D.lv); if (lv >= 2 && !u.dead) this.hit(p, u, D.base2 + L * D.lv2); }
        const cnt = hit.length * (lv >= 2 ? 2 : 1);
        p.addMsBuff(Math.min(at(D.msMax), D.ms + Math.max(0, cnt - 1) * at(D.msPer)), D.msDur, false, 'truthblade');
        FX.ring(p.pos, 0.3, D.r, '#ffe08a', 0.35, 0.1); for (let i = 0; i < 6; i++) FX.slash(p.pos, i * Math.PI / 3, D.r, 0.4, '#ffe08a', 0.25);
        break;
      }
      case 'plasmadash': {   // 2.5m 이동 + 전방 60° 투사체(사거리 7m·17m/s), 대상당 1회 120/150+L×5/10 피해 + 1초 30% 둔화
        const done = new Set();
        this.dash(p, aim, D.dist, D.speed, dir => {
          for (let i = 0; i < D.shots; i++) {
            const a = V.ang(dir) + (i / (D.shots - 1) - 0.5) * D.angle * Math.PI / 180;
            Game.projectiles.push(new Projectile({ team: p.team, owner: p, kind: 'shot', color: '#c79bff', len: 0.5, pos: V.copy(p.pos), dir: V.fromAng(a), speed: D.pSpeed, range: D.pRange, width: 0.35,
              onUnit: (pr, u) => { if (done.has(u.id)) return 'stop'; done.add(u.id); this.hit(p, u, at(D.base) + L * at(D.lv)); u.addSlow(D.slow, D.slowDur); return 'stop'; } }));
          }
        });
        break;
      }
      case 'quake': {   // 주변 4m 50/100+L×10+추가 체력 10% 스킬 피해 + 2초 40/50% 둔화 / 2레벨: 6초간 0.5초마다 3.5m 10+L×2+추가 체력 2.5%
        for (const u of this.foes(p, p.pos, D.r)) { this.hit(p, u, at(D.base) + L * D.lv + this.bonusHp(p) * D.hp); u.addSlow(at(D.slow), D.slowDur); }
        FX.ring(p.pos, 0.3, D.r, '#d9a066', 0.45, 0.14); FX.addShake(5);
        if (lv >= 2) p.quakeAura = { t: D.auraDur, tick: 0 };
        break;
      }
      case 'transcend':   // 3초 보호막 150/200 + 추가 체력 80/100%
        p.shield = Math.max(p.shield, at(D.base) + this.bonusHp(p) * at(D.hp)); p.shieldT = D.dur; FX.ring(p.pos, 0.5, 1.2, '#e9eef7', 0.4); break;
      case 'artifact':   // 2.5초 경직: 무적·대상 지정 불가, 행동 불가 / 2레벨: 경직 중 쿨다운 150% 빠르게
        p.stasis = { t: D.dur, fast: lv >= 2 }; p.invuln = p.untargetable = D.dur; p.moveTarget = null; p.attackTarget = null; p.vel = { x: 0, y: 0 };
        if (p.rest) Rest.stop(p, null, true);
        FX.ring(p.pos, 1, 0.4, '#ffd27a', 0.6); break;
      case 'nullify': {   // 해로운 상태 해제(에어본·넉백·붙잡힘·경직 제외) + 1초 이속 20/30%, 해제했다면 1초 30% 추가
        const had = p.stun > 0 || p.root > 0 || p.fear > 0 || p.silence > 0 || p.blindT > 0 || p.slows.length > 0;
        p.stun = p.root = p.fear = p.silence = p.blindT = 0; p.slows = [];
        p.addMsBuff(at(D.ms) + (had ? D.bonus : 0), D.msDur, false, 'nullify');
        FX.ring(p.pos, 0.3, 1.6, '#a6ffcf', 0.4); break;
      }
    }
    p.startCd('F'); Events.emit('action', { k: 'F' });
    return true;
  },
  // 매 스텝: 붉은 폭풍·라이트 윙·퀘이크 2레벨·아티팩트
  update(p, dt) {
    if (p.rangeBuff && (p.rangeBuff.t -= dt) <= 0) p.rangeBuff = null;
    if (p.lightWing && (p.lightWing.t -= dt) <= 0) p.lightWing = null;
    if (p.quakeAura) {
      const A = p.quakeAura, D = CONFIG.tactical.quake; A.t -= dt; A.tick += dt;
      while (A.tick >= D.auraEvery) { A.tick -= D.auraEvery; for (const u of this.foes(p, p.pos, D.auraR)) Combat.damage(p, u, D.auraBase + this.L(p) * D.auraLv + this.bonusHp(p) * D.auraHp, { type: 'skill', source: 'F', noShake: true, trauma: true }); }
      if (A.t <= 0) p.quakeAura = null;
    }
    if (p.stasis) {
      const S = p.stasis; S.t -= dt;
      if (S.fast) for (const k in p.skills) if (k !== 'F') p.skills[k].cd = Math.max(0, p.skills[k].cd - dt * 1.5);   // 2레벨: 쿨다운 2.5배 속도
      if (S.t <= 0) p.stasis = null;
    }
  },
  // 라이트 윙 2레벨: 적 실험체 평타 적중 시 지속 +0.5초
  onAA(p, t) { if (p.lightWing && p.skills.F.lv >= 2 && t && t.kind !== 'animal' && t.kind !== 'dummy' && t.team !== p.team) { p.lightWing.t += CONFIG.tactical.lightwing.extend; const m = p.msBuffs.find(x => x.tag === 'lightwing'); if (m) m.t += CONFIG.tactical.lightwing.extend; } },
  draw(ctx, p) {
    if (p.quakeAura) KU.ring(ctx, p.pos, CONFIG.tactical.quake.auraR, '#d9a066', 0.35 + 0.15 * Math.sin(Game.time * 12));
    if (p.stasis) { KU.fill(ctx, p.pos, p.r + 0.25, '#ffd27a', 0.35); KU.ring(ctx, p.pos, p.r + 0.3, '#ffe9b0', 0.9); }
    if (p.rangeBuff && Settings.showRange) KU.ring(ctx, p.pos, p.aaCfg().range + p.r, '#ff6b6b', 0.35, true);
  },
};

// ============================== 시야 아이템: 망원 카메라 · 정찰 드론 ==============================
// 나무위키: 망원 카메라 = 설치 거리 안 지점에 던져 설치(벽 너머 가능), 반경 13m 시야(벽에 가려짐), 60초, 최대 2개 설치(초과 시 가장 먼저 설치한 것 파괴), 재사용 3초, 은신 감지,
//          상대가 기본 공격 한 번으로 파괴 / 정찰 드론 = 목표 지점 5초 시야(벽 무시), 상대는 드론이 자기 시야 안에 있어야 범위가 보임
class Ward extends Unit {
  constructor(x, y, owner) {
    const C = CONFIG.vision.camera;
    super({ x, y, team: owner.team, kind: 'ward', name: C.name, hp: 1, def: 0, ms: 0, r: 0.28 });
    this.owner = owner; this.life = C.dur; this.detect = true; this.born = Game.time;
  }
  // 색은 보는 사람 기준(내 편 파랑·적 빨강) — 저장하지 않고 그릴 때 계산
  get color() { return this.team === myTeam() ? '#7fd1ff' : '#ff8a8a'; }
  set color(v) { /* 무시 */ }
  sightR() { return CONFIG.vision.camera.r * (Vision.night ? CONFIG.vision.cameraNightMul : 1); }
  update(dt) { this.tickStatus(dt); if ((this.life -= dt) <= 0 && !this.dead) { this.dead = true; } }
}

const VisionItems = {
  give(u) { const V0 = CONFIG.vision; u.items = { camera: V0.camera.stock, drone: V0.drone.stock }; u.itemCd = { camera: 0, drone: 0 }; },
  tick(u, dt) { if (!u.itemCd) return; for (const k in u.itemCd) u.itemCd[k] = Math.max(0, u.itemCd[k] - dt); },
  can(u, k) { return Vision.fogOn && u.items && u.items[k] > 0 && u.itemCd[k] <= 0 && !u.dead; },
  // 망원 카메라 설치: 커서 방향 설치 거리 안
  camera(u, pt, quiet) {
    const C = CONFIG.vision.camera;
    if (!this.can(u, 'camera')) { if (!quiet) this.fail(u, 'camera'); return false; }
    const d = Math.min(C.range, V.dist(u.pos, pt)), dir = d > 1e-3 ? V.norm(V.sub(pt, u.pos)) : V.fromAng(u.facing || 0);
    // 원작: 던져서 설치 — 벽 너머도 설치 가능(벽은 넘음). 지점이 벽 속이면 가장 가까운 벽 밖으로
    const pos = Geo.pushOut(V.add(u.pos, V.mul(dir, d)), 0.3);
    const mine = Game.units.filter(w => w.kind === 'ward' && !w.dead && w.owner === u).sort((a, b) => a.born - b.born);
    if (mine.length >= C.max) { mine[0].dead = true; FX.ring(mine[0].pos, 0.2, 0.8, '#8a93a6', 0.3); }   // 최대 2개: 가장 먼저 설치한 것 파괴
    const w = new Ward(pos.x, pos.y, u); Game.units.push(w);
    u.items.camera--; u.itemCd.camera = C.cd;
    FX.ringFor(w, pos, 0.3, 1.2, 'team', 0.4); FX.textFor(w, C.name, 'team', 11, { bold: true }, 'all'); Sfx.play('throw');   // 색은 보는 사람 기준
    return w;
  },
  // 정찰 드론: 목표 지점으로 날아가 5초간 원형 시야(벽 무시)
  drone(u, pt, quiet) {
    const D = CONFIG.vision.drone;
    if (!this.can(u, 'drone')) { if (!quiet) this.fail(u, 'drone'); return false; }
    const d = Math.min(D.range, V.dist(u.pos, pt)), dir = d > 1e-3 ? V.norm(V.sub(pt, u.pos)) : V.fromAng(u.facing || 0);
    const to = V.add(u.pos, V.mul(dir, d)); to.x = clamp(to.x, 0.3, CONFIG.world.w - 0.3); to.y = clamp(to.y, 0.3, CONFIG.world.h - 0.3);
    u.items.drone--; u.itemCd.drone = D.cd; Sfx.play('throw');
    const fly = { from: V.copy(u.pos), to, t: 0, dur: d / D.speed + 0.05, team: u.team };
    (Game.drones = Game.drones || []).push(fly);
    FX.textFor(u, D.name, 'team', 11, { bold: true }, quiet ? 'owner' : 'all');
    return true;
  },
  fail(u, k) {
    if (!Vision.fogOn) { FX.toastFor(u, '시야 아이템은 1:1 결투(시야 시스템)에서만 쓸 수 있습니다', '#aaa'); return; }
    if (!u.items || u.items[k] <= 0) FX.toastFor(u, `${CONFIG.vision[k].name}: 이번 라운드 보유량을 다 썼습니다`, '#aaa');
    else { FX.toastFor(u, `${CONFIG.vision[k].name}: 재사용 대기 ${fmt(u.itemCd[k], 1)}초`, '#aaa'); Sfx.playFor(u, 'error'); }
  },
  update(dt) {
    const D = CONFIG.vision.drone;
    for (const f of Game.drones || []) {
      f.t += dt;
      if (!f.done && f.t >= f.dur) {
        f.done = true; Vision.reveals.push({ team: f.team, pos: f.to, r: D.r, t: D.dur, drone: true });
        const b = Vision.bushAt(f.to); if (b >= 0) Vision.rustle(b, f.to, f.team);
      }
    }
    Game.drones = (Game.drones || []).filter(f => !f.done);
  },
};

// ============================== AI: 공통 (투사체 위협 판정 · 배회) ==============================
function threatens(u, pr, range) {
  const rel = V.sub(u.pos, pr.pos), along = V.dot(rel, pr.dir);
  if (along < 0 || along > range) return false;
  return Math.abs(rel.x * pr.dir.y - rel.y * pr.dir.x) < u.r + pr.width / 2 + 0.35;
}
const AI = {
  wander(u, dt) { const a = u.ai; a.t = (a.t || 0) - dt; if (a.t <= 0) { a.t = rand(0.8, 1.6); u.moveTarget = Geo.pushOut({ x: u.spawn.x + rand(-1.3, 1.3), y: u.spawn.y + rand(-1.3, 1.3) }, u.r); } },
};

// ============================== AI: 1:1 결투 상대 ==============================
class Duelist extends Unit {
  // 쿨 감소: 장비 쿨감 = 쿨 × 100/(100+쿨감) · R은 궁 쿨감(현자의 로브)도 더함
  cdTick(dt) { for (const k in this.cds) this.cds[k] = Math.max(0, this.cds[k] - dt * (1 + ((this.cdrAi || 0) + (k === 'R' ? this.ultCdrAi || 0 : 0)) / 100)); }
  constructor(x, y, diffKey) {
    const E = CONFIG.enemy, p = Game.player || { maxHp: 2000, build: { def: 100 }, ad: 200 };
    super({ team: 1, x, y, r: E.r, hp: Math.round(p.maxHp * E.hpMul), def: p.build.def * E.defMul, ms: E.ms, color: E.color, name: E.name, kind: 'duelist', facing: Math.PI });
    this.diff = E.difficulty[diffKey]; this.diffKey = diffKey; this.ad = p.ad * E.adMul; this.as = E.as;
    this.cds = { s1: 2, s2: 4, s3: 0 }; this.aaCd = 0; this.act = null; this.thinkT = 0.5; this.dodgeQ = null;
    this.healing = null; this.healAcc = 0; this.healTxtT = 0; this.attacking = false;
    this.stats = { dodges: 0, s1Hits: 0, s1Casts: 0 };
  }
  update(dt) {
    this.tickStatus(dt); if (this.dead) return;
    this.cdTick(dt);
    this.aaCd -= dt;
    if (this.healing) {   // 재생 — 치명적 외상의 치유 감소 적용
      const h = Math.min(dt, this.healing.t); this.healing.t -= dt;
      this.healAcc += this.heal(this.healing.rate * h, true);
      if (this.healing.t <= 0) this.healing = null;
    }
    this.healTxtT -= dt;
    if (this.healTxtT <= 0 && this.healAcc > 1) { FX.text(this.pos, '+' + Math.round(this.healAcc) + (this.healRed > 0 ? ' (치유감소)' : ''), '#5dff9a', 12); this.healAcc = 0; this.healTxtT = 0.5; }
    if (this.forced || this.stun > 0) { this.act = null; this.vel = { x: 0, y: 0 }; return; }
    if (this.act) { this.updateAct(dt); return; }
    this.watchThreats(dt);
    this.thinkT -= dt;
    if (this.thinkT <= 0) { this.thinkT = this.diff.react * (0.7 + rnd() * 0.6); this.think(); if (this.act) return; }
    const p = this.foe || Game.player;
    if (this.attacking && p && !p.dead) {
      const d = V.dist(this.pos, p.pos) - p.r - this.r;
      if (d <= CONFIG.enemy.range) { this.moveTarget = null; if (this.aaCd <= 0) { this.act = { type: 'aa', t: 0, dur: CONFIG.enemy.aaWindup }; return; } }
      else if (this.canMove()) this.moveTarget = V.copy(p.pos);
    }
    this.moveStep(dt);
  }
  // 날아오는 수쳐를 감지 → 반응 시간 후 회피
  watchThreats(dt) {
    for (const pr of Game.projectiles) {
      if (pr.team === this.team || pr.dead || pr.seen.has(this.id)) continue;
      if (threatens(this, pr, 9)) { pr.seen.add(this.id); if (!this.dodgeQ && rnd() < this.diff.dodge) this.dodgeQ = { t: this.diff.react * 0.9, pr }; }
    }
    if (!this.dodgeQ) return;
    this.dodgeQ.t -= dt;
    if (this.dodgeQ.t > 0) return;
    const pr = this.dodgeQ.pr; this.dodgeQ = null;
    if (pr.dead || !this.canMove()) return;
    const rel = V.sub(this.pos, pr.pos), side = (pr.dir.x * rel.y - pr.dir.y * rel.x) >= 0 ? 1 : -1, pd = V.mul(V.perp(pr.dir), side);
    this.stats.dodges++; this.attacking = false;
    if (this.cds.s2 <= 0 && (this.diffKey === 'hard' || rnd() < 0.3)) this.startDash(pd, 3);
    else { this.moveTarget = Geo.pushOut(V.add(this.pos, V.mul(pd, 2.2)), this.r); this.thinkT = 0.5; }
  }
  think() {
    const p = this.foe || Game.player; if (!p || p.dead) return;
    const E = CONFIG.enemy, d = V.dist(this.pos, p.pos), hpR = this.hp / this.maxHp, pR = p.hp / p.maxHp;
    if (hpR < 0.4 && this.cds.s3 <= 0 && !this.healing) {
      this.healing = { t: E.s3.dur, rate: this.maxHp * E.s3.healPct / E.s3.dur }; this.cds.s3 = E.s3.cd; FX.text(this.pos, E.s3.name, '#5dff9a', 14, { bold: true });
    }
    // 어려움: 캐시의 이동기(Q/블링크)·E 쿨타임을 보고 진입 여부 결정
    let engage = true;
    if (this.diff.kite) {
      engage = foeCd(p, 'Q') > 1.5 || foeCd(p, 'F') > 1.5 || foeCd(p, 'E') > 2 || pR < 0.4 || hpR > pR + 0.3;
      this.kiteT = (this.kiteT || 0) + this.diff.react;   // 너무 오래 견제만 하면 4초간 진입
      if (this.kiteT > 8) { this.commitT = 4; this.kiteT = 0; }
      if (this.commitT > 0) { this.commitT -= this.diff.react; engage = true; }
      if (engage) this.kiteT = 0;
    }
    if (this.diffKey === 'hard' && hpR < 0.25 && pR > 0.5 && this.cds.s2 <= 0 && this.canMove()) { this.startDash(V.norm(V.sub(this.pos, p.pos)), E.s2.dist); return; }
    if (this.cds.s1 <= 0 && d < E.s1.range && rnd() < 0.85) { this.startS1(p); return; }
    if (engage) {
      if (d > E.range + this.r + p.r + 0.1) {
        if (this.cds.s2 <= 0 && d > 3 && d < E.s2.dist + 1.5 && this.canMove() && (this.diffKey !== 'easy' || rnd() < 0.4)) { this.startDash(V.norm(V.sub(p.pos, this.pos)), Math.min(E.s2.dist, d - 1.2)); return; }
        this.moveTarget = V.copy(p.pos);
      }
      this.attacking = true;
    } else {   // 카이팅: 수쳐 사거리 바깥 유지
      this.attacking = false;
      const want = CONFIG.skills.E.range + 1.0, away = V.norm(V.sub(this.pos, p.pos)), side = rnd() < 0.5 ? 1 : -1;
      if (d < want - 0.4) this.moveTarget = Geo.pushOut(V.add(this.pos, V.add(V.mul(away, 2), V.mul(V.perp(away), side * 1.2))), this.r);
      else if (d > want + 1.5) this.moveTarget = Geo.pushOut(V.add(p.pos, V.mul(away, want)), this.r);
      else this.moveTarget = Geo.pushOut(V.add(this.pos, V.mul(V.perp(away), side * 1.5)), this.r);
    }
  }
  startS1(p) {
    const E = CONFIG.enemy.s1, tt = E.windup + V.dist(this.pos, p.pos) / E.speed;
    const pred = V.add(p.pos, V.mul(p.vel, tt * this.diff.lead));
    const ang = V.ang(V.sub(pred, this.pos)) + (rnd() - 0.5) * 2 * this.diff.aimErr;
    this.act = { type: 's1', t: 0, dur: E.windup, dir: V.fromAng(ang) }; this.cds.s1 = E.cd; this.stats.s1Casts++; this.moveTarget = null;
  }
  startDash(dir, dist) {
    const len = Geo.clampDash(this.pos, dir, dist, this.r);
    this.act = { type: 'dash', t: 0, dur: CONFIG.enemy.s2.time, from: V.copy(this.pos), to: V.add(this.pos, V.mul(dir, len)) };
    this.cds.s2 = CONFIG.enemy.s2.cd; this.moveTarget = null;
  }
  updateAct(dt) {
    const a = this.act, p = this.foe || Game.player, E = CONFIG.enemy; a.t += dt;
    if (a.type === 'aa') {
      if (p && !p.dead) this.facing = V.ang(V.sub(p.pos, this.pos));
      if (a.t >= a.dur) {
        this.act = null; this.aaCd = 1 / this.as;
        if (p && !p.dead && V.dist(this.pos, p.pos) - p.r - this.r <= E.range + 0.4) { Combat.damage(this, p, this.ad * this.diff.dmgMul, { type: 'normal', source: '적 평타' }); FX.burst(p.pos, '#b56cff', 6, 3); }
      }
    } else if (a.type === 's1') {
      this.facing = V.ang(a.dir);

  think() {

    const close = d < (this.diffKey === 'hard' ? 3.6 : 2.8) + (dan && p.shadowT > 0 ? 1.2 : 0), diving = p.cast && (p.cast.k === 'Q' || p.cast.k === 'R' || (dan && p.cast.k === 'E')) && d < 7;
    if (!this.melee && (close || (diving && this.diffKey !== 'easy')) && (this.diffKey !== 'easy' || rnd() < 0.5)) {

    if (Game.mode && Game.mode.teamThink && Game.mode.teamThink(this, p, d)) return;   // 팀 대전: 후퇴·합류

    const used = this.canAct() && this.silence <= 0 && this.kit.think && this.kit.think(this, p, d);

  }
  // ---------- 안 보일 때: 위치 추론 ----------

  initBelief(p0) {

  estimate() {

  }
  // 추정 위치에서 캐시 진입 거리(Q 4m + E 사거리) 밖을 유지하며 계속 움직이고, 다른 부쉬 근처(매복)도 피함

  // 시야 아이템: 오래 안 보이면 정찰 드론으로 추정 지점(부쉬)을 확인하고, 그래도 못 찾으면 망원 카메라를 설치

    if (this.diffKey === 'easy' && rnd() < 0.6) return false;
    if (this.unseenT > H.checkAfter + 0.4 && VisionItems.can(this, 'drone') && d <= VI.drone.range && (B.bush >= 0 || this.unseenT > 3) && !Vision.zoneSees(this.team, est)) {

    }

  }
  // 캐시의 카메라가 보이면 부숴서 시야를 끊음(캐시가 멀거나 안 보일 때)
  killWard(p) {
    if (!Vision.fogOn || this.act || !this.canAct()) return false;
    const engaged = this.seesP && p && !p.dead && V.dist(this.pos, p.pos) < 7.5;
    if (engaged || (this.mode === 'engage')) return false;
    const w = Game.units.filter(x => x.kind === 'ward' && !x.dead && x.team !== this.team).filter(x => Vision.visible(this, x) && V.dist(x.pos, this.pos) < 9).sort((a, b) => V.dist(a.pos, this.pos) - V.dist(b.pos, this.pos))[0];
    if (!w) return false;
    const reach = (this.melee ? this.motif.aaRange : this.aaRange()) + w.r + this.r;
    if (V.dist(this.pos, w.pos) <= reach && this.aaCd <= 0) { this.aaTarget = w; this.act = { type: 'aa', t: 0, dur: CONFIG.rangedAI.aaWindup }; this.moveTarget = null; return true; }
    this.moveTarget = Geo.pushOut(V.add(w.pos, V.mul(V.norm(V.sub(this.pos, w.pos)), reach * 0.8)), this.r); return true;
  }
  hunt() {
    const H = CONFIG.rangedAI.hunt, B = this.belief; B.t += H.think;
    const back = Sphere.urgent(this); if (back) { this.moveTarget = back; this.kiteT = 0; return; }   // 폭발 타이머: 수색 중에도 먼저 안으로
    const est = this.estimate();
    if (this.canAct() && this.useVisionItem(est, B)) return;
    // 일정 시간 안 보이면 스킬로 부쉬 체크(정찰 다트·곡사·연사 등) — 맞히면 피격 노출로 다시 보임

  huntSpot(est) {
    const H = CONFIG.rangedAI.hunt, RA = CONFIG.rangedAI, B = this.belief, base = V.ang(V.sub(this.pos, est)); let best = null, bs = -Infinity;
    const safe = Game.mode && Game.mode.huntDist ? Game.mode.huntDist(this) : H.safeDist;   // 팀 대전: 수적 우위면 파고들어 찾음

      const q = Geo.pushOut(V.add(this.pos, V.mul(V.fromAng(base + i * Math.PI / 8), H.step)), this.r);

  // 후보 지점 점수화: 원하는 거리 유지 + 벽 회피 + 좌우 무빙 선호
  pickSpot(p, want, step) {
    const RA = CONFIG.rangedAI, base = V.ang(V.sub(this.pos, p.pos)); let best = null, bs = -Infinity;

  // ① 쏜 직후 무빙: ③ 캐시 E·Q가 준비돼 있으면 E 사거리 밖으로(앞뒤), 아니면 좌우로

    const meleeFoe = !((p.ranged && !p.melee) || (p.motif && !p.motif.melee));   // 원거리 상대(플레이어·AI)와는 서로 사거리에서 맞딜 — 진입 거리 밖으로 빠지는 건 근접(캐시·다니엘) 상대일 때만

  // 플레이어의 진입 거리: 캐시 = E(수쳐) 사거리 / 다니엘 = E 돌진 3m + 그림자 평타 3m

  aaLand(u, ratio = 1) {
