  drawWorld(ctx) { if (this.sphere) Sphere.draw(ctx); if (this.enemy && this.enemy.drawExtra) this.enemy.drawExtra(ctx); },
  side() {
    const e = this.enemy; if (!e) return '';
    const M = this.motif;
    if (e.melee && this.motifKey === 'daniel') {   // 근거리 암살자(다니엘): 상태·표식 + 대응 팁 (알론소·비형은 아래 공통 패널)
      const st = { stalk: '서성이며 각 재는 중', engage: '진입!', retreat: '후퇴' }[e.mode] + (e.stealthT > 0 ? ' · 은신' : '') + (e.shadow ? ' · 걸작(대상 지정 불가)' : '');
      const mk = e.mark ? kv('영감 표식', e.mark.t >= e.kitCfg.W.ready ? `<b style="color:#ffd1ff">활성 — 공격받으면 폭발 ${Math.round(e.mark.acc)}</b>` : `${fmt(e.kitCfg.W.ready - e.mark.t, 1)}s 후 활성 (축적 ${Math.round(e.mark.acc)})`) : '';
      const gi2 = e.gearInfo ? `<div style="color:#9fd8ff;margin:4px 0">🛠 ${esc(e.gearInfo.label)}</div>` : '';
      return `<h4>⚔ vs ${M.name} Lv${e.level} (${M.weapon})</h4>${gi2}${kv('적 체력', `${Math.round(Math.max(0, e.hp))} / ${e.maxHp}`)}${kv('공격력 / 공속', `${e.ad} / ${fmt(e.curAs(), 2)}`)}${kv('치명 / 평타 증폭 / 방관', `${Math.round(e.critChance * 100)}% / ${Math.round(e.aaAmp * 100)}% / ${Math.round(e.pen * 100)}%`)}${kv('방어력', e.def)}${kv('상태', st)}${mk}${['Q', 'W', 'E', 'R', 'D'].map(k => kv(`${k === 'D' ? '무기' : k} ${e.kitCfg[k].name}`, e.cds[k] > 0 ? fmt(e.cds[k], 1) + 's' : (k === 'D' && e.cloakT > 0 ? '단검 재사용 가능' : '준비'))).join('')}
      <h5>팁</h5><div style="color:#8a93a6;line-height:1.5">다니엘은 정면으로 싸우지 않습니다. 6m 근처(부쉬 선호)에서 서성이다가 <b>캐시의 E(수쳐)·Q가 빠지거나 체력이 깎이면</b> 망토 → E 은신 돌진 → 건너편 순간이동 평타 → 가위(Q)+영감(W) → 단검 → R 걸작으로 들어옵니다. 은신 연기를 보면 바로 대비하고 <b>E 수쳐는 진입 순간을 위해 아껴 두세요</b>. 걸작(R) 중엔 대상 지정 불가 + 0.5초 침묵 — 빠져나오는 위치를 노리세요. 보라색 링(영감)이 밝아지면 맞는 순간 축적 피해가 터집니다.</div>`;
    }
    const gi = e.gearInfo ? `<div style="color:#9fd8ff;margin:4px 0">🛠 ${esc(e.gearInfo.label)}</div>` : '';
    return `<h4>⚔ vs ${M.name} Lv${e.level} (${M.weapon})</h4>${gi}${kv('적 체력', `${Math.round(Math.max(0, e.hp))} / ${e.maxHp}`)}${kv('공격력 / 스킬 증폭', `${e.ad} / ${e.sp}`)}${kv('공속 / 치명 / 방관', `${e.as} / ${Math.round(e.critChance * 100)}% / ${Math.round(e.pen * 100)}%`)}${kv('방어력', e.def)}${kv('평타 사거리', fmt(e.aaRange(), 2) + 'm' + (e.stance ? (e.stance === 'short' ? ' (단궁)' : ' (화궁)') : ''))}${['Q', 'W', 'E', 'R', 'D'].filter(k => e.kitCfg[k]).map(k => kv(`${k === 'D' ? '무기' : k} ${e.kitCfg[k].name}`, e.cds[k] > 0 ? fmt(e.cds[k], 1) + 's' : '준비')).join('')}
      <h5>팁</h5><div style="color:#8a93a6;line-height:1.5">${this.TIPS[this.motifKey] || this.TIPS.ranged}</div>`;
  },
  result() {
    const t = this.wins.p + this.wins.e;
    const rows = this.history.map(s => `<tr><td>R${s.round}</td><td>${s.winner === 'p' ? '<b style="color:#ffc857">승</b>' : '<b style="color:#ff3b5c">패</b>'}</td><td>${fmt(s.time, 1)}s</td><td>${Math.round(s.dealt)}</td><td>${Math.round(s.taken)}</td><td>${SKILL_KEYS.filter(k => s.casts[k] > 0).map(k => `${k} ${s.hits[k]}/${s.casts[k]}`).join(' ')}</td><td>${s.eDodge}</td></tr>`).join('');
    return { key: 'duel:' + this.diff, recTitle: this.title, score: this.wins.p * 100 - this.wins.e * 50, scoreLabel: `점수 (${this.wins.p}승 ${this.wins.e}패)`,
      modeRatio: t ? this.wins.p / t : 0, modeLabel: '라운드 승률', weights: { acc: 35, waste: 15, mistake: 15, mode: 30 },
      extraHtml: `<h3>라운드 요약</h3><table><tr><th>라운드</th><th>결과</th><th>시간</th><th>가한 피해</th><th>받은 피해</th><th>스킬 적중</th><th>적 회피</th></tr>${rows}</table>` };
  },
};

// ============================== 5. AI 팀 대전 (3:3) ==============================
// 나 + 아군 AI vs 상대 AI 팀. 맵 기본 = 원형 투기장(LoL 아레나풍), 라운드제(3판 2선승) — 한 팀이 모두 쓰러지면 라운드 끝
// AI는 1:1 결투와 같은 실험체 AI(RangedDuelist + 키트)를 쓰고, 팀 판단만 이 모드가 더함:
//   팀 판단(역할·대상 점수·후퇴·핑퐁·추격 한계)은 TeamAI (src/5_x_teamai.js, 근거 docs/er_notes_teamfight.md)
Modes.team = {
  name: 'AI 팀 대전',
  start(o) {
    this.diff = o.diff || 'normal'; this.size = 3; this.need = o.rounds === 1 ? 1 : 2;
    const keys = Object.keys(CONFIG.rangedMotifs).filter(k => !CONFIG.rangedMotifs[k].playerOnly);
    // 팀 구성: 지정한 칸은 그대로, 비운 칸은 무작위(같은 팀 안에서는 겹치지 않게)
    const fill = (want, n) => { const out = [], pool = keys.slice(); for (let i = 0; i < n; i++) { let k = want && want[i] && CONFIG.rangedMotifs[want[i]] ? want[i] : null; if (!k) { const free = pool.filter(x => !out.includes(x)); k = free[Math.floor(rnd() * free.length)] || keys[0]; } out.push(k); } return out; };
    this.allyKeys = fill(o.allies, this.size - 1); this.enemyKeys = fill(o.enemies, this.size);
    const eb = o.enemyBuild && o.enemyBuild !== 'same' ? o.enemyBuild : Game.buildId;
    this.stage = CONFIG.rangedAI.stages[eb] ? eb : 'mid'; this.stageInfo = CONFIG.rangedAI.stages[this.stage];
    this.sphere = SPHERE_KIND(o.sphere);
    this.title = `AI 팀 대전 ${this.size}:${this.size} (${CONFIG.enemy.difficulty[this.diff].label})` + ` · ${Game.map.name}` + (this.sphere ? (this.sphere === 'final' ? ' · 최종 안전지대' : ' · 크로노 스피어') : '');
    TeamAI.reset();
    Events.on('kill', a => { if (a.unit && isHero(a.unit) && !this.ended) this.kills[a.unit.team === 0 ? 'e' : 'p']++; });   // 처치 수 (Game.start마다 이벤트 초기화)
    this.wins = { p: 0, e: 0 }; this.round = 0; this.history = []; this.newRound();
  },
  // 시작 위치: 스폰 지점을 가운데로 앞뒤(맵 중심 쪽 수직 방향)로 벌림
  spot(base, i) {
    const c = { x: CONFIG.world.w / 2, y: CONFIG.world.h / 2 }, to = V.norm(V.sub(c, base)), side = V.perp(V.len(to) > 0.01 ? to : { x: 1, y: 0 });
    const off = [0, -1, 1][i] * CONFIG.teamAI.spread;
    return Geo.pushOut(V.add(base, V.mul(side, off)), 0.6);
  },
  newRound() {
    this.round++; Game.units = []; Game.projectiles = []; Game.zones = [];
    const sp = Game.map.spawns, P = this.spot(sp.p, 0);
    Scene.player(P.x, P.y); VisionItems.give(Game.player); Game.drones = []; Vision.reveals = []; Vision.noises = []; Vision.ghosts = {};
    this.allies = this.allyKeys.map((k, i) => { const q = this.spot(sp.p, i + 1), u = new RangedDuelist(q.x, q.y, this.diff, k, this.stage, 0); u.facing = 0; Game.units.push(u); return u; });
    this.enemies = this.enemyKeys.map((k, i) => { const q = this.spot(sp.e, i), u = new RangedDuelist(q.x, q.y, this.diff, k, this.stage, 1); Game.units.push(u); return u; });
    TeamAI.reset(); TeamAI.assign(0); TeamAI.assign(1);   // 역할: 앞라인·측면·견제·딜러
    if (this.sphere) Sphere.start(this.sphere); else Sphere.stop();
    this.snap = Stats.snapshot(); this.roundStart = Game.time; this.inter = null; this.ended = false; this.kills = { p: 0, e: 0 };
    Game.freeze = 1.6; this.banner = { t: 1.6, text: `ROUND ${this.round}`, sub: `${this.size}:${this.size} · ${this.enemyKeys.map(k => CONFIG.rangedMotifs[k].name).join(' · ')}` };
  },
  team(t) { return Game.units.filter(u => isHero(u) && u.team === t); },
  alive(t) { return this.team(t).filter(u => !u.dead); },
  update(dt, frozen) {
    if (this.banner && (this.banner.t -= dt) <= 0) this.banner = null;
    if (this.inter) { if ((this.inter.t -= dt) <= 0) this.newRound(); return; }
    if (frozen || this.ended) return;
    if (this.sphere) {
      Sphere.update(dt);
      if (!this.alive(0).length && !this.alive(1).length) {   // 같은 순간 양 팀 모두 폭사 → 남은 체력 비율로 판정
        const T = Sphere.tie || { 0: 1, 1: 1 };
        FX.toast(`동시 폭사 — 체력 판정 (${Math.round(T[0] * 100)}% vs ${Math.round(T[1] * 100)}%)`, '#9fe0ff');
        this.roundEnd(Sphere.tieWin()); return;
      }
    }
    if (!this.alive(1).length) this.roundEnd('p'); else if (!this.alive(0).length) this.roundEnd('e');
  },
  roundEnd(w) {
    this.ended = true; this.wins[w]++;
    const St = Stats, s0 = this.snap, casts = {}, hits = {}, p = Game.player;
    for (const k of SKILL_KEYS) { casts[k] = (St.casts[k] || 0) - (s0.casts[k] || 0); hits[k] = (St.hits[k] || 0) - (s0.hits[k] || 0); }
    const sum = { round: this.round, winner: w, time: Game.time - this.roundStart, dealt: St.dealtTotal - s0.dealt, taken: St.takenTotal - s0.taken, casts, hits,
      kills: Object.assign({}, this.kills), survived: this.alive(0).length, pAlive: !p.dead };
    this.history.push(sum);
    if (w === 'p') Events.emit('roundWin');
    Sfx.play(w === 'p' ? 'win' : 'fail');
    if (this.wins.p >= this.need || this.wins.e >= this.need) { Game.finish('duelEnd'); return; }
    this.inter = { t: 4.5, sum }; Game.freeze = 999;
  },
  // 팀 AI(대상 고르기·움직임)는 5_x_teamai.js (TeamAI)
  drawWorld(ctx) { if (this.sphere) Sphere.draw(ctx); for (const u of Game.units) if (u.drawExtra && u !== Game.player) u.drawExtra(ctx); },
  drawScreen(ctx, L, oy = 0) {

      }
      if (ai.lastHitBy && ai.lastHitBy.u === u && now - ai.lastHitBy.t < 2.5) s += W.revenge;
      if (pressedMate && (pressedMate.dmgLog || []).some(e => e.src === u && now - e.t < T.pingpong.window)) s += W.pingpong;   // 핑퐁: 아군을 치던 적의 어그로를 가져옴
      return s;
    };
    let best = null, bs = -Infinity; for (const u of vis) { const s = score(u); if (s > bs) { bs = s; best = u; } }
    // 대상 유지: 지금 대상이 보이고 살아 있으면 15점 이상 높거나 1.2초가 지나야 전환 — 근접이 붙음·킬각은 즉시
    if (cur && best !== cur && vis.includes(cur)) {
      const cs = score(cur), urgent = (!melee && this.isMelee(best) && V.dist(ai.pos, best.pos) < T.threatDist + best.r) || est(best) >= best.hp;
      if (!urgent && (now - (ai.foeSince || 0) < T.hold || bs < cs + T.switchMargin)) return cur;
    }
    if (best !== cur) ai.foeSince = now;
    return best;
  },
  // ---------- 팀 움직임 (6장) — RangedDuelist.think에서 키트 스킬 판단 전에 ----------
  think(ai, p, d) {
    const T = CONFIG.teamAI, easy = ai.diffKey === 'easy', mates = this.mates(ai);
    if (!mates.length || ai.kiteT > 0) return false;
    const foes = Game.units.filter(u => isHero(u) && u.team !== ai.team && u.team !== 2 && !u.dead && Vision.visible(ai, u));
    const c = this.center(mates), hpR = ai.hp / ai.maxHp, melee = this.isMelee(ai);
    const fc = foes.length ? this.center(foes) : null;
    const back = () => { const away = fc ? V.norm(V.sub(c, fc)) : V.norm(V.sub(c, ai.pos)); return Geo.pushOut(V.add(c, V.mul(away, T.regroupBack)), ai.r); };
    const go = (q, t, why) => { ai.moveTarget = q; ai.kiteT = t; ai.teamMove = why; ai.stats[why] = (ai.stats[why] || 0) + 1; return true; };
    // 플레이어 핑: 집중 = 끝까지 붙음(빈사만 예외) — 후퇴·여기로는 pingMove(행동 맨 앞)에서
    const O = this.order(ai.team); if (O && O.kind === 'focus' && hpR > 0.2) return false;
    // ① 개인 후퇴: 체력이 낮고 적이 사거리 안 → 아군 쪽(뒤)으로
    if (Sphere.stance(ai) === 'push' && hpR > 0.15) return false;   // 타이머가 적은 팀: 물러나면 먼저 터짐 → 끝까지 교전
    const stall = Sphere.stance(ai) === 'stall', low = (melee ? T.lowHp.melee : T.lowHp.ranged) + (stall ? 0.15 : 0);   // 버팀: 일찍 빠짐
    if (hpR < low && foes.some(f => V.dist(f.pos, ai.pos) < (this.isMelee(f) ? 4 : (f.aaRange ? f.aaRange() : 6)) + 1)) return go(back(), 0.7, 'retreats');
    if (easy) return false;
    // ② 팀 후퇴: 체크리스트 ≤ 1 이고 수적 열세
    const CL = this.checklist(ai.team);
    if (CL.score <= T.retreatScore && CL.us < CL.them && hpR < 0.7 && fc && V.dist(ai.pos, fc) < 9) return go(back(), 0.6, 'retreats');
    // ②-2 핵심 스킬을 다 쓴 상태(R·E 쿨)에서 멀쩡한 적이 가까이 → 빠짐
    const SR = T.spentRetreat, spent = foeCd(ai, 'R') > 3 && foeCd(ai, 'E') > 2;
    if (spent && hpR < SR.myHp && foes.some(f => f.hp / f.maxHp > SR.foeHp && V.dist(f.pos, ai.pos) < 7)) return go(back(), 0.6, 'spentRetreats');
    // ③ 혼자 싸우지 않기: 아군이 멀고 적 2명 이상이 가까움
    const nearest = Math.min(...mates.map(a => V.dist(a.pos, ai.pos)));
    if (nearest > T.spacingMax && foes.filter(f => V.dist(f.pos, ai.pos) < 6).length >= 2) return go(Geo.pushOut(V.lerp(ai.pos, c, 0.7), ai.r), 0.5, 'regroups');
    // ④ 추격 한계: 아군 중심에서 8m 넘게 도망간 적은 쫓지 않음(사거리 밖일 때)
    const fleeing = p && p.vel && V.dot(p.vel, V.sub(p.pos, c)) > 0.5;   // 아군 중심에서 멀어지는 쪽으로 움직이는 중
    if (p && !p.dead && fleeing && stall && d > (melee ? 3 : ai.aaRange()) + 0.5) return go(Geo.pushOut(V.lerp(ai.pos, c, 0.5), ai.r), 0.5, 'chaseStops');   // 버팀: 도망가는 적은 안 쫓음(시간은 우리 편)
    if (p && !p.dead && fleeing && V.dist(p.pos, c) > T.chaseDist && d > (melee ? 3 : ai.aaRange()) + 1 && p.hp / p.maxHp > 0.2) return go(Geo.pushOut(V.lerp(ai.pos, c, 0.5), ai.r), 0.5, 'chaseStops');
    // ⑤ 재집결: 근처에 적이 없는데 혼자 멀리 떨어짐
    if (V.dist(ai.pos, c) > T.regroup && (!p || p.dead || d > 9)) return go(Geo.pushOut(V.lerp(ai.pos, c, 0.6), ai.r), 0.5, 'regroups');
    return false;
  },
  // 안 보이는 적 찾기: 수적 우위면 추정 위치로 파고듦(3:1로 대치만 하다 끝나지 않게)
  huntDist(ai) {
    const H = CONFIG.teamAI.huntDist, us = this.heroes(ai.team).length, them = this.heroes(1 - ai.team).length;
    return us > them ? H.ahead : us === them ? H.even : CONFIG.rangedAI.hunt.safeDist;
  },
  // 팀 자세: 팔 길이(살아 있는 실험체의 최대 사거리)가 짧은 팀은 먼저 진입(dive), 긴 팀은 받아침(hold)
  reach(t) { return Math.max(0, ...this.heroes(t).map(u => this.isMelee(u) ? 3 : (u.aaRange ? u.aaRange() : u.aaCfg ? u.aaCfg().range : 5))); },
  stance(t) { return this.reach(t) < this.reach(1 - t) - CONFIG.teamAI.reachMargin ? 'dive' : 'hold'; },
  // 궁 아끼기: 아군이 대상 근처에 없으면(마무리·위기 아니면) R을 쓰지 않음
  holdUlt(ai, p) {
    if (ai.diffKey === 'easy' || !p || p.dead || Sphere.stance(ai) === 'push') return false;
    const O = this.order(ai.team); if (O && O.kind === 'focus' && O.u === p) return false;   // 핑 집중 대상엔 궁 아끼지 않음
    const mates = this.mates(ai); if (!mates.length) return false;
    if (p.hp / p.maxHp < 0.35 || ai.hp / ai.maxHp < 0.4) return false;
    return !mates.some(a => V.dist(a.pos, p.pos) < CONFIG.teamAI.ultHoldDist);
  },
  // 측면(다니엘) 진입 허락: 아군이 먼저 교전 중 · 수적 우위 · 대상 고립 · 대상 빈사 · 팔이 짧은 팀(dive) (쉬움은 항상)
  mayEngage(ai, p) {
    if (ai.diffKey === 'easy' || !this.mates(ai).length) return true;
    const O = this.order(ai.team); if (O && O.kind === 'focus' && O.u === p) return true; if (O && O.kind === 'back') return false;   // 플레이어 핑
    const ss = Sphere.stance(ai); if (ss === 'push') return true; if (ss === 'stall' && p.hp / p.maxHp > 0.3) return false;   // 폭발 타이머 운영
    const now = Game.time, mates = this.mates(ai), CL = this.checklist(ai.team);
    if (this.stance(ai.team) === 'dive' && CL.score >= CONFIG.teamAI.diveScore) return true;
    if (mates.some(a => now - (a.lastFight || -99) < 2 && V.dist(a.pos, p.pos) < 8)) return true;
    if (CL.us > CL.them || p.hp / p.maxHp < 0.4) return true;
    const pm = this.heroes(p.team).filter(u => u !== p), pc = this.center(pm);
    return !pc || V.dist(p.pos, pc) > CONFIG.teamAI.isolate;
  },
  // 자리 점수 감점: 원딜은 원형 투기장 가장자리(중심 12m 밖)로 밀리지 않기
  spotPenalty(ai, q) {
    const rd = Geo.round(); if (!rd || this.isMelee(ai)) return 0;
    const r = V.dist(q, rd.c); return r > CONFIG.teamAI.edgeLimit ? (r - CONFIG.teamAI.edgeLimit) * 2.5 : 0;
  },
};
// 팀 대전 모드에 연결
Object.assign(Modes.team, {
  pickFoe(ai, es, cur) { return TeamAI.pickFoe(ai, es, cur); },
  teamThink(ai, p, d) { return TeamAI.think(ai, p, d); },
  pingMove(ai) { return TeamAI.pingMove(ai); },
  onDamage(src, tgt, dmg) { TeamAI.onDamage(src, tgt, dmg); },
  mayEngage(ai, p) { return TeamAI.mayEngage(ai, p); },
  spotPenalty(ai, q) { return TeamAI.spotPenalty(ai, q); },
  holdUlt(ai, p) { return TeamAI.holdUlt(ai, p); },
  huntDist(ai) { return TeamAI.huntDist(ai); },
});

// ---------- 입문 튜토리얼 (로드맵 F) ----------
// 처음 온 사람용: 허수아비 하나를 두고 이동 → 평타 → 스킬 → 실험체별 리듬 → 궁극기 → 전술 스킬 순서로 직접 해 보며 익힘
// 각 단계는 해내면 자동으로 넘어가고(화면 위 안내 + 진행도), 끝나면 콤보 연습·쉬운 결투로 이어줌. 메뉴의 「처음이세요?」 버튼으로 시작
Modes.tutorial = {
  name: '입문 튜토리얼',
  MARKS: [[13, 5], [19, 13], [8, 12.5]],
  start(o) {
    this.title = this.name;
    Scene.player(8, 9); Scene.dummy(15, 9, { hp: 999999, def: 0, infinite: true });
    const p = Game.player, ch = p.charKey || 'cathy';
    this.kind = ch === 'cathy' ? 'cathy' : p.ranged && !(p.motif && p.motif.melee) ? 'ranged' : 'melee';
    this.steps = this.makeSteps(p); this.i = 0; this.wait = 0; this.done = false; this.begin();
  },
  castHow() { return { smart: '키를 누르면 바로 커서 방향으로', release: '키를 누르고 있다가 떼면', normal: '키를 누른 뒤 좌클릭으로' }[Settings.castMode] || '키를 누른 뒤 좌클릭으로'; },
  key(a) { return ((Settings.keys || {})[a] || a).toUpperCase(); },
  makeSteps(p) {
    const K = this.key.bind(this), skillName = k => (p.skillDef && p.skillDef(k) && p.skillDef(k).name) || k;
    const rhythm = {
      cathy: { title: '스킬 → 강화 평타', text: '캐시는 스킬을 쓴 직후 평타가 「강화 평타」가 됩니다. 스킬 하나 쓰고 바로 허수아비를 우클릭 — 2번', goal: 2, count: (s, b) => s.enhAA - b.enhAA },
      ranged: { title: '쏘고 움직이기', text: '평타가 손을 떠나면 바로 우클릭으로 옆으로 한 걸음 → 다시 허수아비 우클릭. 평타 사이에 움직이기 3번', goal: 3, count: () => this.kite },
      melee: { title: '평타 사이에 스킬', text: '붙어서 평타 → 스킬 → 평타 순서로 이어 치기. 평타를 쉬지 않는 게 핵심 — 2번', goal: 2, count: () => this.weave },
    }[this.kind];
    return [
      { title: '이동', text: '바닥의 노란 원을 우클릭해서 차례로 밟으세요 (마우스 오른쪽 = 이동)', goal: 3, count: () => this.mark },
      { title: '평타', text: '허수아비를 우클릭하면 다가가서 기본 공격(평타)을 합니다 — 3번', goal: 3, count: (s, b) => s.aaHits - b.aaHits },
      { title: '스킬', text: `${K('Q')} ${skillName('Q')} · ${K('W')} ${skillName('W')} · ${K('E')} ${skillName('E')} — 허수아비 쪽으로 하나씩 써 보세요 (${this.castHow()} 사용 · 설정에서 바꿀 수 있음)`, goal: 3, count: (s, b) => ['Q', 'W', 'E'].filter(k => (s.casts[k] || 0) > (b.casts[k] || 0)).length },
      rhythm,
      { title: '궁극기', text: `${K('R')} ${skillName('R')} — 허수아비에게 궁극기를 써 보세요${p.charKey === 'daniel' ? ' (다니엘 걸작: 4초 안에 때린 3m 안의 적에게만 — 먼저 평타 후 붙어서)' : ''}`, goal: 1, count: (s, b) => (s.casts.R || 0) - (b.casts.R || 0) },
      { title: '전술 스킬', text: `${K('F')} 전술 스킬(지금: ${(CONFIG.tactical[Settings.tactical] || CONFIG.tactical.blink).name}) — 메뉴에서 다른 전술 스킬로 바꿀 수 있어요`, goal: 1, count: (s, b) => (s.casts.F || 0) - (b.casts.F || 0) },
    ];
  },
  snap() { const S = Stats; return { aaHits: S.aaHits, enhAA: S.enhAA, casts: Object.assign({}, S.casts) }; },
  begin() { this.base = this.snap(); this.mark = 0; this.kite = 0; this.weave = 0; this.lastAA = null; this.seq = 0; this.prevAA = Stats.aaHits; this.prevCast = this.castSum(); },
  castSum() { return ['Q', 'W', 'E', 'R', 'D'].reduce((a, k) => a + (Stats.casts[k] || 0), 0); },
  cur() { return this.steps[this.i]; },
  progress() { const s = this.cur(); return s ? Math.min(s.goal, Math.max(0, s.count(Stats, this.base))) : 0; },
  update(dt) {
    const p = Game.player; if (!p || this.done) return;
    if (this.wait > 0) { if ((this.wait -= dt) <= 0) { this.i++; if (this.i >= this.steps.length) return this.finish(); this.begin(); } return; }
    // 단계별 직접 세는 것: 원 밟기 · 쏘고 움직이기 · 평타-스킬-평타
    if (this.i === 0 && this.mark < 3 && V.dist(p.pos, { x: this.MARKS[this.mark][0], y: this.MARKS[this.mark][1] }) < 0.9) { this.mark++; Sfx.play('click'); }
    const aa = Stats.aaHits, cs = this.castSum();
    if (aa > this.prevAA) {
      if (this.lastAA && V.dist(this.lastAA, p.pos) > 0.4) this.kite++;
      this.lastAA = V.copy(p.pos);
      if (this.seq === 2) { this.weave++; this.seq = 1; } else this.seq = 1;
    }
    if (cs > this.prevCast && this.seq === 1) this.seq = 2;
    this.prevAA = aa; this.prevCast = cs;
    if (this.progress() >= this.cur().goal) { this.wait = 0.8; Sfx.play('combo'); FX.toast(`✔ ${this.cur().title} 완료`, '#5dff9a'); }
  },
  finish() {
    this.done = true; Settings.tutorialDone = true; saveSettings(); Game.paused = true;
    UI.showTutorialDone();
  },
  drawWorld(ctx) {
    if (this.i !== 0 || this.done) return;
    this.MARKS.forEach(([x, y], k) => {
      if (k < this.mark) return; ctx.save(); ctx.globalAlpha = k === this.mark ? 0.9 : 0.35; ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 0.08;
      Draw.circle(ctx, x, y, 0.7 + (k === this.mark ? 0.08 * Math.sin(Game.time * 6) : 0)); ctx.stroke(); ctx.restore();
    });
  },
  drawScreen(ctx, L, oy = 0) {
    const s = this.cur(); if (!s || this.done) return;
    const side = Settings.side && Side.el && Side.el.classList.contains('show') ? (Side.el.offsetWidth || 280) + 24 : 0, room = L.W - side;   // 오른쪽 정보 패널을 피해서
    const w = Math.min(620, room - 40), x = room / 2 - w / 2, y = 62 + oy, pr = this.progress();   // 왼쪽 위 상태 글자 아래
    ctx.save(); ctx.globalAlpha = 0.86; ctx.fillStyle = '#12151c'; ctx.fillRect(x, y, w, 74); ctx.globalAlpha = 1; ctx.strokeStyle = '#3fd0c9'; ctx.lineWidth = 1; ctx.strokeRect(x + 0.5, y + 0.5, w - 1, 73);
    ctx.fillStyle = '#3fd0c9'; ctx.fillRect(x, y + 70, w * (this.i + pr / s.goal) / this.steps.length, 4); ctx.restore();
    Draw.text(ctx, `🎓 입문 튜토리얼 ${this.i + 1}/${this.steps.length} · ${s.title}  (${pr}/${s.goal})`, x + 12, y + 20, { size: 15, bold: true, color: '#3fd0c9' });
    const words = s.text, max = Math.floor((w - 24) / 13); const lines = []; let cur = '';
    for (const part of words.split(' ')) { if ((cur + ' ' + part).trim().length > max) { lines.push(cur.trim()); cur = part; } else cur += ' ' + part; } if (cur.trim()) lines.push(cur.trim());
    lines.slice(0, 2).forEach((ln, k) => Draw.text(ctx, ln, x + 12, y + 42 + k * 18, { size: 13, color: '#e6e9ef' }));
  },
  side() {
    return `<h4>🎓 입문 튜토리얼</h4>${this.steps.map((s, k) => kv(`${k < this.i || this.done ? '✔' : k === this.i ? '▶' : '·'} ${s.title}`, k === this.i && !this.done ? `${this.progress()}/${s.goal}` : '')).join('')}
      <div class="sub" style="margin-top:6px">Esc: 일시정지 → 메뉴로 나가기</div>`;
  },
  result() { return { key: 'tutorial', score: this.i, scoreLabel: '완료한 단계', modeRatio: this.i / Math.max(1, this.steps.length), modeLabel: '튜토리얼 진행' }; },
};

// ============================== 크로노 스피어 (시즌 12 임시 안전지대) ==============================
// 두 가지 규칙: temp = 임시 안전지대(차단벽 — 못 나감, 활성화 순간 밖은 즉사) · final = 최종 안전지대(벽 없음 — 밖에 나가면 폭발 타이머가 줄어듦)
// 공식 12.0 패치노트 스케줄(임시): 반경 30m로 5초 대기 → 20초에 걸쳐 10m → 10초간 이동 목표 표시 → 이동 → 15초에 걸쳐 5m → 40초 유지 → 5초에 걸쳐 0m
// 활성화 후에는 차단벽을 넘을 수 없음(이동기도 벽에 부딪혀 종료). 활성화 순간 차단벽 밖의 실험체는 즉사
// 금지구역 폭발 타이머: 시작 30초(20 + 6일차 밤 +10), 처치 관여 +7초(최대 30), 스피어가 소멸하면 전 지역이 금지구역 → 타이머가 많이 남은 쪽이 이김
//   같은 순간 양 팀이 모두 폭사하면(처치 없는 결투 등) 남은 체력 비율로 판정
const Sphere = {
  active: false,
  start(kind) {
    const S = CONFIG.sphere, W = CONFIG.world;
    this.kind = kind === 'final' ? 'final' : 'temp'; this.wall = this.kind === 'temp';
    this.active = true; this.done = false; this.t = 0; this.i = 0;
    this.c = { x: W.w / 2, y: W.h / 2 }; this.r = this.phases()[0].r; this.from = { c: V.copy(this.c), r: this.r };
    this.target = null; this.armed = false; this.tie = null;
    const B = CONFIG.sphere.boom;
    for (const u of Game.units) if (isHero(u)) { u.boom = Math.min(B.start, B.max) + B.night; u.boomWarn = false; u.hitBy = null; }
  },
  stop() { this.active = false; for (const u of Game.units) if (isHero(u)) u.boom = null; },
  heroes() { return Game.units.filter(u => isHero(u) && !u.dead && u.boom != null); },
  // 지금 금지구역에 있나: 차단벽 밖, 또는 스피어 소멸 후 전 지역
  inZone(u) { return this.done || V.dist(u.pos, this.c) > this.r + 0.05; },
  draining(u) { return this.active && u.boom != null && !u.dead && this.inZone(u) && !u.stasis; },
  // 처치 관여: 처치자 + 최근 피해를 준 적 실험체 → +7초(최대 30초, 이미 넘으면 그대로)
  onKill(src, tgt) {
    if (!isHero(tgt)) return;
    const B = CONFIG.sphere.boom, who = new Set();
    if (src && isHero(src)) who.add(src);
    if (tgt.hitBy) for (const [u, t] of tgt.hitBy) if (Game.time - t <= B.assist) who.add(u);
    for (const u of who) {
      if (u.dead || u.boom == null || u.team === tgt.team) continue;
      const nb = Math.max(u.boom, Math.min(B.max, u.boom + B.kill));
      if (nb > u.boom) { FX.text(u.pos, `폭발 타이머 +${fmt(nb - u.boom, 1)}초`, '#9fe0ff', 12, { bold: true }); u.boom = nb; if (u.boom > B.warn) u.boomWarn = false; }
    }
  },
  // 폭사: 빈사·보호막과 무관하게 즉사
  explode(u, why) {
    if (u.dead) return;
    u.boom = 0; u.infinite = false; u.shield = 0;
    FX.burst(u.pos, '#ff5d5d', 34, 9, 0.9, 0.14); FX.ring(u.pos, 0.4, 3, '#ffb347', 0.6);
    FX.text(u.pos, why || '폭사', '#ff5d5d', 16, { bold: true });
    Combat.kill(null, u);
  },
  tieWin() { return this.tie && this.tie[1] > this.tie[0] ? 'e' : 'p'; },
  phases() { return this.kind === 'final' ? CONFIG.sphere.finalPhases : CONFIG.sphere.phases; },
  phase() { return this.phases()[this.i]; },
  // 이동 목표: 반경 10m 원이 아레나 안쪽에 오도록
  pickTarget() {
    const W = CONFIG.world, m = CONFIG.sphere.targetMargin, rd = Geo.round();
    for (let k = 0; k < 30; k++) {
      const q = { x: rand(m, W.w - m), y: rand(m * 0.5, W.h - m * 0.5) };
      if (rd && V.dist(q, rd.c) > rd.r - 3) continue;   // 원형 맵: 이동 목표는 원 안쪽(경계에서 3m 이상)
      if (V.dist(q, this.c) > 3 && !Geo.inWall(q, 0.6)) return q;
    }
    return V.copy(this.c);
  },
  update(dt) {
    if (!this.active) return;
    if (!this.armed) {   // 활성화: 차단벽 밖에 있는 실험체는 즉사 (임시 안전지대만)
      this.armed = true;
      if (this.wall) for (const u of this.heroes()) if (V.dist(u.pos, this.c) > this.r) this.explode(u, '차단벽 밖 — 즉사');
    }
    this.tickBoom(dt);
    if (this.done) return;
    const P = this.phase(); this.t += dt;
    const k = P.dur > 0 ? clamp(this.t / P.dur, 0, 1) : 1;
    if (P.type === 'shrink') this.r = lerp(this.from.r, P.r, k);
    if (P.type === 'show' && !this.target) this.target = this.pickTarget();
    if (P.type === 'move' && this.target) this.c = V.lerp(this.from.c, this.target, k);
    if (this.t >= P.dur) {
      this.i++; this.t = 0; this.from = { c: V.copy(this.c), r: this.r };
      if (P.type === 'move') this.target = null;
      if (this.i >= this.phases().length) { this.done = true; this.r = 0; FX.toastAll('크로노 스피어 소멸 — 전 지역 금지구역! 폭발 타이머 감소', '#ff8a8a'); return; }
      const N = this.phase(); if (N.label) FX.toastAll(`${this.name()}: ${N.label}`, '#9fe0ff');
    }
    // 차단벽: 모든 유닛을 원 안으로 (이동기·강제 이동 포함) — 임시 안전지대만. 최종 안전지대는 밖으로 나갈 수 있음(폭발 타이머 감소)
    if (this.wall) for (const u of Game.units) {
      if (u.dead || u.kind === 'ward') continue;
      const d = V.dist(u.pos, this.c), lim = Math.max(0, this.r - u.r);
      if (d > lim) {
        const dir = d > 1e-6 ? V.mul(V.sub(u.pos, this.c), 1 / d) : { x: 1, y: 0 };
        u.pos = V.add(this.c, V.mul(dir, lim));
        if (u.forced) { u.forced.to = V.copy(u.pos); }   // 돌진은 차단벽에 부딪혀 종료
        if (u.act && u.act.type === 'dash') u.act.to = V.copy(u.pos);
      }
    }
  },
  // 폭발 타이머: 금지구역에 있으면 감소, 0이면 폭사. 같은 순간 양 팀이 다 터지면 남은 체력 비율 기록(판정용)
  tickBoom(dt) {
    const B = CONFIG.sphere.boom, live = this.heroes(), gone = [];
    for (const u of live) {
      if (!this.draining(u)) continue;
      u.boom = Math.max(0, u.boom - dt);
      if (u.boom <= B.warn && !u.boomWarn) { u.boomWarn = true; if (u === Game.player) FX.toast(`폭발 ${B.warn}초 전!`, '#ff5d5d'); }
      if (u.boom <= 0) gone.push(u);
    }
    if (!gone.length) return;
    const left = t => live.filter(u => u.team === t && !gone.includes(u)).length;
    if (!left(0) && !left(1)) { const r = t => { const a = gone.filter(u => u.team === t); return a.reduce((s, u) => s + Math.max(0, u.hp) / u.maxHp, 0) / Math.max(1, a.length); }; this.tie = { 0: r(0), 1: r(1) }; }
    for (const u of gone) this.explode(u, '폭사');
  },
  // 화면 위: 스피어 단계 + 내 폭발 타이머
  drawHud(ctx, L, oy = 0) {
    if (!this.active) return;
    Draw.text(ctx, this.label(), L.W / 2, 46 + oy, { size: 12, bold: true, align: 'center', color: this.done ? '#ff8a8a' : '#9fe0ff', stroke: true });
    const p = Game.player; if (!p || p.boom == null || p.dead) return;
    const dr = this.draining(p), low = p.boom <= CONFIG.sphere.boom.warn;
    Draw.text(ctx, `폭발 타이머 ${fmt(p.boom, 1)}초${dr ? (p.stasis ? '' : ' ▼') : ''}${p.stasis && this.inZone(p) ? ' (경직 — 정지)' : ''}`, L.W / 2, 66 + oy,
      { size: low ? 17 : 14, bold: true, align: 'center', color: low && dr && Math.floor(Game.time * 4) % 2 ? '#ffffff' : dr ? '#ff5d5d' : '#ffd27a', stroke: true });
  },
  name() { return this.kind === 'final' ? '최종 안전지대' : '크로노 스피어'; },
  // AI 이동 후보 점수용: 차단벽 근처·밖은 감점 — 최종 안전지대(벽 없음)는 타이머가 적을수록 밖을 더 피함 · 소멸 뒤(전 지역 금지구역)는 감점 없음
  penalty(q, u) {
    if (!this.active || this.done) return 0; const d = V.dist(q, this.c), m = this.r - 1.2; if (d <= m) return 0;
    const w = this.wall || !u || u.boom == null ? 4 : 4 * clamp((25 - u.boom) / 10, 0.4, 3);
    return (d - m) * w;
  },
  // ---------- AI 운영 (폭발 타이머) ----------
  // 급히 복귀: 밖(최종 안전지대)에서 남은 타이머가 돌아오는 시간 + 여유보다 적으면 안쪽 지점
  urgent(u) {
    if (!this.active || this.done || this.wall || u.boom == null || u.dead) return null;
    const d = V.dist(u.pos, this.c); if (d <= this.r - 0.3) return null;
    const eta = (d - this.r + 0.8) / Math.max(1, u.speed ? u.speed() : 3.5);
    if (u.boom > eta + CONFIG.sphere.ai.safe) return null;
    return Geo.pushOut(V.add(this.c, V.mul(V.norm(V.sub(u.pos, this.c)), Math.max(0, this.r * 0.55))), u.r);
  },
  teamBoom(t) { const a = Game.units.filter(u => isHero(u) && u.team === t && !u.dead && u.boom != null); return a.length ? a.reduce((s, u) => s + u.boom, 0) / a.length : null; },
  // 타이머가 승부를 가르는 때인가 (소멸 뒤 · 또는 내 타이머가 적음)
  pressing(u) { return this.active && u && u.boom != null && (this.done || u.boom < CONFIG.sphere.ai.press); },
  // 팀 자세: push = 타이머가 적은 쪽(교전을 걸어야 함) · stall = 많은 쪽(버팀) · null = 상관없음
  stance(u) {
    if (!this.pressing(u)) return null;
    const me = this.teamBoom(u.team), them = this.teamBoom(1 - u.team); if (me == null || them == null) return null;
    const e = me - them, E = CONFIG.sphere.ai.edge; return e < -E ? 'push' : e > E ? 'stall' : null;
  },
  // AI 이동 후보 점수용: 차단벽 근처·밖은 감점
  label() {
    if (!this.active) return '';
    const P = this.phase(); if (!P || this.done) return `${this.name()} 소멸 · 전 지역 금지구역 — 폭발 타이머가 많이 남은 쪽이 승리`;
    return `${this.name()}${this.wall ? '' : ' (밖 = 금지구역)'} · ${P.label || ''} · 반경 ${fmt(this.r, 1)}m · ${Math.ceil(P.dur - this.t)}초`;
  },
  draw(ctx) {
    if (!this.active) return;
    const W = CONFIG.world;
    // 바깥(차단벽 밖)을 붉게
    const rd = Geo.round();   // 원형 맵: 원 안에만
    ctx.save(); if (rd) { ctx.beginPath(); ctx.arc(rd.c.x, rd.c.y, rd.r, 0, Math.PI * 2); ctx.clip(); }
    ctx.beginPath(); ctx.rect(0, 0, W.w, W.h); ctx.arc(this.c.x, this.c.y, Math.max(0.01, this.r), 0, Math.PI * 2, true);
    ctx.fillStyle = 'rgba(160,30,50,.22)'; ctx.fill('evenodd');
    ctx.strokeStyle = this.wall ? '#9fe0ff' : '#ff8a8a'; ctx.lineWidth = 0.1; ctx.setLineDash(this.wall ? [0.5, 0.25] : [0.25, 0.25]); ctx.lineDashOffset = -Game.time * 2;
    ctx.beginPath(); ctx.arc(this.c.x, this.c.y, Math.max(0.01, this.r), 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
    // 다음 이동 지점
    if (this.target) { ctx.globalAlpha = 0.6; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 0.06; ctx.beginPath(); ctx.arc(this.target.x, this.target.y, this.r, 0, Math.PI * 2); ctx.stroke(); ctx.beginPath(); ctx.moveTo(this.c.x, this.c.y); ctx.lineTo(this.target.x, this.target.y); ctx.stroke(); }
    ctx.restore();
  },
};

// ============================== 명령 계층 ==============================
// 플레이어 입력(키·마우스)을 「명령」으로 바꿔 한 곳에서 적용하고 기록함
//   명령 = { k: 틱, t: 종류, x, y, id, s } — 좌표·대상 id(판 시작 기준)·스킬 키만 담은 순수 데이터
//   · 지금: 바로 적용 + Cmd.log에 기록 → 같은 시드로 다시 재생하면 같은 판(리플레이·결정성 검사)
// 이벤트 처리는 항상 스텝과 스텝 사이에 실행되므로, 「지금까지 끝난 스텝 수(Game.tick)」에 기록하면 재생 때 같은 시점에 적용됨
const Cmd = {
  log: [], play: null, playI: 0,
  reset() { this.log = []; this.play = null; this.playI = 0; },
  rel(u) { return u ? u.id - Game.uid0 : null; },   // 판 시작 기준 id (UID는 판마다 계속 늘어남)
  unit(rid) { return rid === null || rid === undefined ? null : Game.units.find(u => u.id - Game.uid0 === rid) || null; },
  // 입력 → 명령 (내 캐릭터)
  send(c, u = Game.player) {
    if (!u || this.play) return;   // 재생 중엔 실제 입력 무시
    c.k = Game.tick; if (c.x !== undefined) { c.x = +c.x; c.y = +c.y; }
    this.log.push(c); this.apply(u, c);
  },
  move(pt) { this.send({ t: 'move', x: pt.x, y: pt.y }); },
  attack(t) { this.send({ t: 'atk', id: this.rel(t) }); },
  amove(pt) { this.send({ t: 'amove', x: pt.x, y: pt.y }); },
  stop() { this.send({ t: 'stop' }); },
  skill(k, pt) { this.send({ t: 'sk', s: k, x: pt.x, y: pt.y }); },
  rest() { this.send({ t: 'rest' }); },
  camera(pt) { this.send({ t: 'cam', x: pt.x, y: pt.y }); },
  drone(pt) { this.send({ t: 'drone', x: pt.x, y: pt.y }); },
  cursor(pt) { this.send({ t: 'cur', x: pt.x, y: pt.y }); },
  ping(kind, pt, t) { this.send({ t: 'ping', s: kind, x: pt.x, y: pt.y, id: t ? this.rel(t) : null }); },   // 팀 대전: 아군 AI에 지시(focus 집중 · go 여기로 · back 후퇴)
  pet(pt, t) { this.send({ t: 'pet', x: pt.x, y: pt.y, id: t ? this.rel(t) : null }); },   // 클로에: 니나 조종(Alt + 우클릭)   // 커서 위치가 결과에 영향을 줄 때만(다니엘 걸작 탈출 방향)
  apply(u, c) {
    const pt = c.x !== undefined ? { x: c.x, y: c.y } : null;
    if (pt) u.cursor = pt;   // 마지막으로 가리킨 지점
    switch (c.t) {
      case 'move': u.cmdMove(pt); break;
      case 'atk': { const t = this.unit(c.id); if (t) u.cmdAttack(t); break; }
      case 'amove': u.cmdAttackMove(pt); break;
      case 'stop': u.cmdStop(); break;
      case 'sk': u.cmdSkill(c.s, pt); break;
      case 'rest': if (u.rest) Rest.stop(u, null, true); else Rest.start(u); break;
      case 'cam': VisionItems.camera(u, pt); break;
      case 'drone': VisionItems.drone(u, pt); break;
      case 'cur': break;
      case 'pet': if (u.petCmd) u.petCmd(pt, this.unit(c.id)); break;
      case 'ping': TeamAI.ping(u, c.s, pt, this.unit(c.id)); break;
    }
  },
  // 명령 형식 검사 (리플레이 파일 읽기)
  CMD_T: ['move', 'atk', 'amove', 'stop', 'sk', 'rest', 'cam', 'drone', 'cur', 'pet', 'ping'], SKILL_K: ['Q', 'W', 'E', 'R', 'D', 'F'],
  valid(c) {
    if (!c || !this.CMD_T.includes(c.t)) return false;
    if (c.x !== undefined && !(Number.isFinite(c.x) && Number.isFinite(c.y) && Math.abs(c.x) < 1e4 && Math.abs(c.y) < 1e4)) return false;
    if (c.t === 'sk' && !this.SKILL_K.includes(c.s)) return false;
    if (c.t === 'atk' && !Number.isInteger(c.id)) return false;
    if (c.t === 'ping' && !['focus', 'go', 'back'].includes(c.s)) return false;
    if (['move', 'amove', 'sk', 'cam', 'drone', 'cur', 'pet', 'ping'].includes(c.t) && c.x === undefined) return false;
    return true;
  },
  // ---------- 재생 ----------
  //   Game.start(같은 모드·옵션·seed) 직후 Cmd.replay(기록) → 매 스텝 시작에 그 틱의 명령을 적용
  replay(log) { this.play = log.map(c => Object.assign({}, c)); this.playI = 0; this.log = []; },
  feed() {
    if (!this.play) return;
    const L = this.play, u = Game.player;
    while (this.playI < L.length && L[this.playI].k <= Game.tick) {
      const c = L[this.playI++];
      this.log.push(c); if (u && !c.p) this.apply(u, c);
    }
  },
  // 판 하나를 다시 만들 수 있는 정보 (모드·옵션·시드·설정·명령)
  record() {
    return { v: 1, mode: Game.modeId, opts: Object.assign({}, Game.opts, { seed: Game.seed }), seed: Game.seed, ticks: Game.tick, step: CONFIG.sim.step,
      settings: { character: Settings.character, weapon: Settings.weapon, build: Settings.build, tactical: Settings.tactical, fog: Settings.fog, duelTime: Settings.duelTime },
      log: this.log.map(c => Object.assign({}, c)) };
  },
  // 판 상태 요약(결정성 검사용): 유닛 위치·체력·쿨, 투사체 수, 시간
  hash() {
    const r = v => Math.round(v * 1e5) / 1e5, out = [Game.tick, r(Game.time), Game.projectiles.length];
    for (const u of Game.units) {
      out.push(u.id - Game.uid0, u.kind, r(u.pos.x), r(u.pos.y), r(u.hp), u.dead ? 1 : 0);
      if (u.skills) for (const k of Object.keys(u.skills).sort()) out.push(r(u.skills[k].cd));
    }
    let h = 2166136261; const s = out.join('|'); for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return (h >>> 0).toString(16);
  },
};

// ============================== 리플레이 (저장·다시 보기) ==============================
// 같은 시드 + 같은 명령 = 같은 판(결정성, 6_a_cmd.js) → 파일에는 시드·옵션·설정·명령만 담음 (보통 수십 KB)
//   저장: 판이 끝날 때 기록을 잡아 두고(Replay.last) 결과 화면 「리플레이 저장」으로 내려받음
//   보기: 메뉴 「리플레이 열기」 → 저장할 때의 설정을 잠시 적용하고 그 판을 다시 진행 (실제 입력은 막힘, 기록에 안 남음)
const Replay = {
  V: 1, active: null, last: null,
  KEEP: ['character', 'weapon', 'build', 'tactical', 'fog', 'duelTime'],   // 판정에 영향을 주는 설정
  capture() {
    const r = Cmd.record();
    return Object.assign(r, { kind: 'cathy-replay', rv: this.V, buildId: BUILD_ID, title: (Game.mode && Game.mode.title) || Game.modeId, date: Date.now() });
  },
  fileName(r) { const d = new Date(r.date || Date.now()), p = n => String(n).padStart(2, '0'); return `cathy-replay-${r.mode}-${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}.json`; },
  // 파일 내용 검사 (잘못된 파일로 게임이 깨지지 않게)
  check(r) {
    if (!r || r.kind !== 'cathy-replay') throw new Error('캐시 수련장 리플레이 파일이 아닙니다');
    if (r.rv !== this.V) throw new Error('지원하지 않는 리플레이 형식입니다');
    if (!Modes[r.mode] || r.mode === 'combo' && !(r.opts && r.opts.combo)) throw new Error('알 수 없는 모드: ' + r.mode);
    if (!Array.isArray(r.log) || !Number.isInteger(r.ticks) || r.ticks < 0 || r.ticks > 120 * 60 * 60) throw new Error('리플레이 내용이 올바르지 않습니다');
    if (r.step !== CONFIG.sim.step) throw new Error('시뮬레이션 간격이 다른 리플레이입니다');
    for (const c of r.log) if (!c || !Number.isInteger(c.k) || !Cmd.valid(c)) throw new Error('리플레이 명령이 올바르지 않습니다');
    return r;
  },
  download(r = this.last) {
    if (!r) return false;
    const url = URL.createObjectURL(new Blob([JSON.stringify(r)], { type: 'application/json' })), a = document.createElement('a');
    a.href = url; a.download = this.fileName(r); document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 5000);
    return true;
  },
  // 다시 보기 시작
  start(r) {
    this.check(r);
    if (this.active) this.restore();
    const backup = {}; for (const k of this.KEEP) backup[k] = Settings[k];
    Object.assign(Settings, r.settings || {});
    this.active = { r, backup, warn: r.buildId !== BUILD_ID };
    Game.start(r.mode, Object.assign({}, r.opts, { seed: r.seed }));
    Cmd.replay(r.log);
    if (this.active.warn) FX.toast('다른 버전에서 저장한 리플레이 — 결과가 다를 수 있습니다', '#ffb347');
    return true;
  },
  restore() { if (!this.active) return; Object.assign(Settings, this.active.backup); },
  // 매 스텝 뒤: 기록 끝에 닿으면 종료
  afterStep() { if (this.active && !this.analyzing && Game.state === 'play' && Game.tick >= this.active.r.ticks) this.end(); },   // 분석·이동 중엔 끝내지 않음
  end() {
    if (!this.active) return;
    const r = this.active.r; Game.state = 'result'; this.restore(); this.active = null; this.paused = false; Game.paused = false; this.bar && this.bar();   // 타임라인 닫기
    UI.show(`<h2>📼 리플레이 끝</h2><div class="sub">${esc(r.title || r.mode)} · ${fmt(r.ticks * r.step, 1)}초</div>
      <div class="row" style="margin-top:14px"><button class="btn primary" data-a="again">다시 보기 <kbd>R</kbd></button><button class="btn" data-a="menu">메인 메뉴 <kbd>M</kbd></button></div>`,
      { again: () => (this.markers && this.markers.length ? this.watch(r) : this.start(r)), menu: () => UI.showMenu() }, { r: 'again', m: 'menu', Escape: 'menu' });
  },
  stop() { if (this.active) { this.restore(); this.active = null; } this.paused = false; this.markers = []; if (this.bar) this.bar(); },
  label() { const A = this.active; if (!A) return ''; const t = A.r.ticks * A.r.step; return `📼 리플레이 ${fmt(Math.min(Game.tick * A.r.step, t), 1)} / ${fmt(t, 1)}초${A.warn ? ' · ⚠ 다른 버전' : ''}`; },
};

// ============================== 리플레이 분석 (실수 타임라인) ==============================
// 리플레이를 열면 화면 없이 먼저 끝까지 돌려 「표시할 지점」을 모음 → 화면 아래 타임라인에 점으로 → 누르면 그 장면으로
//   ⚠ 실수(코칭과 같은 실수 기록) · ✕ 빗나간 스킬 · ▼ 큰 피격(최대 체력 12% 이상 한 번에) · ★ 치명적 외상 · ☠ 쓰러짐 · ⚔ 처치 · 🏁 라운드 끝
//   이동(seek): 결정성 덕분에 처음부터 그 틱까지 화면 없이 다시 계산 → 정확히 그 장면 (뒤로 가면 처음부터)
//   조작: 일시정지 P · 이전/다음 표시 [ ] · 속도 − = (0.5×·1×·2×·4×) · 점 클릭 = 그 2초 전 · 막대 클릭 = 그 시점
Object.assign(Replay, {
  SPEEDS: [0.5, 1, 2, 4], speed: 1, paused: false, markers: [], analyzing: false,
  KIND: { mistake: { icon: '⚠', color: '#ffb347', label: '실수' }, miss: { icon: '✕', color: '#ff6b6b', label: '빗나감' }, hurt: { icon: '▼', color: '#ff3b5c', label: '큰 피격' },
    crit: { icon: '★', color: '#ffd166', label: '치명적 외상' }, death: { icon: '☠', color: '#c0c4cc', label: '쓰러짐' }, kill: { icon: '⚔', color: '#5dff9a', label: '처치' }, round: { icon: '🏁', color: '#9fd8ff', label: '라운드 끝' } },
  // ---------- 분석: 끝까지 돌리며 지점 수집 (관찰만 — 판 결과는 그대로) ----------
  analyze(r) {
    this.check(r);
    const marks = [], push = (kind, text) => { const last = marks[marks.length - 1]; if (last && last.kind === kind && last.text === text && Game.tick - last.tick < 30) return; marks.push({ tick: Game.tick, kind, text }); };
    const orig = { mistake: Stats.mistake, shot: Stats.resolveShot, damage: Combat.damage, kill: Combat.kill, critical: Passive.critical, sound: Settings.sound };
    let roundN = 0;
    Stats.mistake = function (txt) { if (this === Stats) push('mistake', txt); return orig.mistake.apply(this, arguments); };
    Stats.resolveShot = function (k, hit) { if (this === Stats && ['Q', 'W', 'E'].includes(k) && !hit) push('miss', `${k} 빗나감`); return orig.shot.apply(this, arguments); };
    Combat.damage = function (src, tgt, amount, o = {}) { const before = tgt && tgt.hp; const d = orig.damage.apply(this, arguments); if (tgt === Game.player && !o.tick && d >= tgt.maxHp * 0.12) push('hurt', `큰 피격 ${Math.round(d)}${src && src.name ? ' ← ' + src.name : ''}`); return d; };
    Combat.kill = function (src, tgt) { const r2 = orig.kill.apply(this, arguments); if (tgt === Game.player) push('death', '쓰러짐'); else if (src === Game.player && !tgt.infinite && tgt.kind !== 'ward') push('kill', `처치: ${tgt.name || tgt.kind}`); return r2; };
    Passive.critical = function (t, by, p = Game.player) { const was = t && t.crit > 0; const r2 = orig.critical.apply(this, arguments); if (p === Game.player && !was && t && t.crit > 0) push('crit', '치명적 외상'); return r2; };
    Settings.sound = false; this.analyzing = true;
    try {
      this.start(r); const S = CONFIG.sim.step;
      let lastRound = Game.mode && Game.mode.history ? Game.mode.history.length : 0;
      while (Game.tick < r.ticks && Game.state === 'play') {
        Game.step(S);
        const H = Game.mode && Game.mode.history; if (H && H.length > lastRound) { lastRound = H.length; const s = H[H.length - 1]; push('round', `R${s.round} ${s.winner === 'p' ? '승' : '패'}`); roundN++; }
      }
    } finally {
      Object.assign(Stats, { mistake: orig.mistake, resolveShot: orig.shot }); Combat.damage = orig.damage; Combat.kill = orig.kill; Passive.critical = orig.critical;
      Settings.sound = orig.sound; this.analyzing = false; this.restore(); this.active = null; FX.reset();
    }
    return marks;
  },
  // ---------- 보기: 분석 → 처음부터 재생 + 타임라인 ----------
  watch(r) {
    const marks = this.analyze(r);
    this.markers = marks; this.speed = 1; this.paused = false;
    this.start(r); this.bar(); return marks;
  },
  // 그 틱으로 이동 (뒤면 처음부터 다시 계산)
  seek(tick) {
    const A = this.active; if (!A) return;
    const r = A.r, keepMarks = this.markers, keepSpeed = this.speed, snd = Settings.sound;
    tick = clamp(Math.round(tick), 0, r.ticks);
    if (tick < Game.tick || Game.state !== 'play') { this.analyzing = true; this.start(r); this.analyzing = false; }
    Settings.sound = false; this.analyzing = true;
    try { const S = CONFIG.sim.step; while (Game.tick < tick && Game.state === 'play') Game.step(S); }
    finally { this.analyzing = false; Settings.sound = snd; }
    FX.reset(); this.markers = keepMarks; this.speed = keepSpeed;
    if (Game.tick >= r.ticks) this.end(); else this.bar();
  },
  jump(dir) {   // 이전(-1)/다음(+1) 표시
    const t = Game.tick, list = this.markers;
    const m = dir > 0 ? list.find(x => x.tick - 120 * 2 > t + 5) : [...list].reverse().find(x => x.tick - 120 * 2 < t - 30);
    if (m) this.seek(m.tick - 120 * 2);
  },
  setSpeed(dir) { const i = clamp(this.SPEEDS.indexOf(this.speed) + dir, 0, this.SPEEDS.length - 1); this.speed = this.SPEEDS[i]; this.bar(); },
  togglePause() { if (!this.active) return; this.paused = !this.paused; Game.paused = this.paused; this.bar(); },
  key(k) {
    if (!this.active) return false;
    if (k === 'p') { this.togglePause(); return true; }
    if (k === '[') { this.jump(-1); return true; }
    if (k === ']') { this.jump(1); return true; }
    if (k === '-') { this.setSpeed(-1); return true; }
    if (k === '=' || k === '+') { this.setSpeed(1); return true; }
    return false;
  },
  // ---------- 타임라인 (화면 아래 DOM) ----------
  bar() {
    const A = this.active; let el = document.getElementById('replay-bar');
    if (!A) { if (el) el.remove(); return; }
    if (!el) { el = document.createElement('div'); el.id = 'replay-bar'; document.body.appendChild(el); }
    el.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:118px;width:min(760px,94vw);z-index:40;background:rgba(14,17,24,.92);border:1px solid #2a3140;border-radius:10px;padding:8px 10px;font:12px ' + FONT + ';color:#e6e9ef;box-sizing:border-box';
    const T = A.r.ticks || 1, counts = {};
    for (const m of this.markers) counts[m.kind] = (counts[m.kind] || 0) + 1;
    const dots = this.markers.map((m, i) => { const K = this.KIND[m.kind]; return `<span data-rm="${i}" title="${fmt(m.tick * A.r.step, 1)}초 · ${esc(m.text)}" style="position:absolute;left:${(m.tick / T * 100).toFixed(2)}%;top:-1px;transform:translateX(-50%);cursor:pointer;color:${K.color};font-size:12px;line-height:14px">${K.icon}</span>`; }).join('');
    const legend = Object.entries(counts).map(([k, n]) => `<span style="color:${this.KIND[k].color}">${this.KIND[k].icon} ${this.KIND[k].label} ${n}</span>`).join(' · ') || '<span style="color:#8a93a6">표시할 지점 없음</span>';
    el.innerHTML = `<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px">
        <button class="btn" data-rb="prev" title="이전 표시 [">⏮</button><button class="btn" data-rb="pause" title="일시정지 P">${this.paused ? '▶' : '⏸'}</button><button class="btn" data-rb="next" title="다음 표시 ]">⏭</button>
        <button class="btn" data-rb="slow" title="느리게 −">−</button><b>${this.speed}×</b><button class="btn" data-rb="fast" title="빠르게 =">+</button>
        <span id="replay-now" style="margin-left:6px;color:#9fd8ff"></span><span style="margin-left:auto">${legend}</span></div>
      <div id="replay-track" style="position:relative;height:16px;background:#1b2130;border-radius:6px;cursor:pointer">${dots}<i id="replay-head" style="position:absolute;top:0;bottom:0;width:2px;background:#fff;left:0"></i></div>`;
    el.onclick = e => {
      const rm = e.target.closest('[data-rm]'), rb = e.target.closest('[data-rb]'), tr = e.target.closest('#replay-track');
      if (rm) { const m = this.markers[+rm.dataset.rm]; this.seek(Math.max(0, m.tick - 120 * 2)); return; }
      if (rb) { ({ prev: () => this.jump(-1), next: () => this.jump(1), pause: () => this.togglePause(), slow: () => this.setSpeed(-1), fast: () => this.setSpeed(1) })[rb.dataset.rb](); return; }
      if (tr) { const b = tr.getBoundingClientRect(); this.seek((e.clientX - b.left) / Math.max(1, b.width) * T); }
    };
    this.updateBar();
  },
  // 매 프레임: 재생 위치·지금 지점 설명
  updateBar() {
    const A = this.active; if (!A) return;
    const head = document.getElementById('replay-head'), now = document.getElementById('replay-now'); if (!head) return;
    head.style.left = (Game.tick / Math.max(1, A.r.ticks) * 100).toFixed(2) + '%';
    const near = this.markers.filter(m => Math.abs(m.tick - Game.tick) < 120 * 1.5).pop();
    if (now) now.textContent = `${fmt(Game.tick * A.r.step, 1)} / ${fmt(A.r.ticks * A.r.step, 1)}초` + (near ? ` · ${this.KIND[near.kind].icon} ${near.text}` : '');
  },
});

// ============================== 게임 ==============================
const Game = {
  state: 'menu', paused: false, mode: null, modeId: null, opts: null, units: [], projectiles: [], zones: [], player: null,
  time: 0, tick: 0, seed: 1, uid0: 0, freeze: 0, cdMul: 1, buildId: 'late',
  start(id, opts = {}) {
    Events.clear(); FX.reset(); Stats.reset();
    Object.assign(this, { units: [], projectiles: [], zones: [], player: null, time: 0, freeze: 0, cdMul: 1, modeId: id, opts, buildId: opts.build || Settings.build, demoLock: false });
    this.mode = Modes[id]; Input.reset();
    // 시드·틱: 같은 시드 + 같은 명령 기록(Cmd.log) = 같은 판 (리플레이·결정성 검사)
    this.seed = opts.seed !== undefined ? opts.seed >>> 0 : (Math.random() * 4294967296) >>> 0; Rng.seed(this.seed); this.tick = 0; this.uid0 = UID; Cmd.reset();
    // 맵 적용 (지형·부쉬). 지정이 없으면 기본 아레나
    this.mapKey = CONFIG.maps[opts.map] ? opts.map : 'basic'; this.map = CONFIG.maps[this.mapKey];
    { const nw = this.map.world || CONFIG.worldBase || CONFIG.world; if (nw.w !== CONFIG.world.w || nw.h !== CONFIG.world.h) { CONFIG.world = Object.assign({}, nw); if (Render.cv) Renderer.resize(); } }   // 맵마다 공간 크기(원형 투기장 = 별개 공간)
    CONFIG.walls = this.map.walls.map(w => Object.assign({}, w)); CONFIG.bushes = (this.map.bushes || []).map(b => Object.assign({}, b)); Vision.reveals = []; Vision.ghosts = {}; Vision.noises = []; Vision.rustles = []; this.drones = []; Sphere.stop();
    Vision.fogOn = (id === 'duel' || id === 'team') && Settings.fog !== false; Vision.setTime(Vision.fogOn ? (opts.time || Settings.duelTime || 'day') : 'day');
    this.mode.start(opts);
    this.state = 'play'; this.paused = false; UI.hide();
  },
  restart() { this.start(this.modeId, this.opts); },
  step(dt) { this._step(dt); Replay.afterStep(); },
  _step(dt) {
    Cmd.feed(); this.tick++;
    if (this.freeze > 0) { this.freeze -= dt; this.mode.update(dt, true); FX.update(dt); return; }
    this.time += dt; Stats.tick(dt); Vision.update(dt);
    Sfx.tick(dt);
    for (const u of this.units.slice()) u.update(dt);
    VisionItems.update(dt); for (const u of this.units) VisionItems.tick(u, dt);
    this.units = this.units.filter(u => !(u.dead && u.kind === 'ward'));   // 파괴·만료된 카메라 제거
    for (const pr of this.projectiles) pr.update(dt);
    this.projectiles = this.projectiles.filter(p => !p.dead);
    this.updateZones(dt);
    for (const u of this.units) if (u.dead && u.respawn && (u.deathT += dt) >= (u.respawnDelay || CONFIG.modes.dummy.respawn)) u.revive();
    this.mode.update(dt, false);
    FX.update(dt);
  },
  updateZones(dt) {
    const p = this.player;
    for (const z of this.zones) {
      z.t -= dt;
      if (z.type === 'heal' && p && !p.dead && Geo.inORect(z.from, z.dir, z.len, z.width / 2, p.pos, p.r)) {
        const R = CONFIG.skills.R; z.acc += p.heal(p.maxHp * (R.zoneHealPct + p.sp * R.zoneHealSp) / 100 * dt, true);
      }
      if (Math.random() < dt * 12) { const pt = V.add(V.add(z.from, V.mul(z.dir, Math.random() * z.len)), V.mul(V.perp(z.dir), (Math.random() - 0.5) * z.width)); FX.text(pt, '+', '#5dff9a', 12, { life: 0.7 }); }
      if ((z.accT -= dt) <= 0) { if (z.acc > 1) FX.text(p.pos, '+' + Math.round(z.acc), '#5dff9a', 12); z.acc = 0; z.accT = 0.5; }
    }
    this.zones = this.zones.filter(z => z.t > 0);
  },
  finish(reason) {
    if (this.state !== 'play') return;
    if (Replay.active) { Replay.end(); return; }   // 다시 보기 중엔 기록·결과 화면 없이 끝
    this.state = 'result';
    Replay.last = Replay.capture();   // 결과 화면 「리플레이 저장」용
    const r = this.mode.result(reason) || {}; r.title = r.title || this.mode.title;
    if (this.opts && this.opts.gear && r.key) { r.key += '|g' + Builds.sig(this.opts.gear); r.recTitle = (r.recTitle || r.title) + ' · 장비'; }   // 장비별 최고 기록
    if (this.player && this.player.ranged && r.key) { r.key += '|c' + this.player.charKey; r.recTitle = `[${this.player.name}] ` + (r.recTitle || r.title); }   // 원거리 실험체별 최고 기록
    if (this.opts && Number.isInteger(this.opts.enemyGear) && r.key) { r.key += '|eg' + this.opts.enemyGear; r.recTitle = (r.recTitle || r.title) + ` · 상대 장비 ${this.opts.enemyGear + 1}`; }
    Grade.compute(r); Records.save(r); UI.showResults(r);
  },
  togglePause() {
    if (this.state !== 'play') return;
    this.paused = !this.paused;
    if (this.paused) { Input.unlock(); Input.rDown = false; UI.showPause(); } else UI.hide();
  },
  // 적 목록은 「누구 기준」인지(of)에 따라 — 기본 내 캐릭터(AI·팀 대전에선 그 유닛 기준)
  enemies(of = this.player) { const tm = of ? of.team : 0; return this.units.filter(u => u.team !== tm && !u.dead && !(u.untargetable > 0) && u.kind !== 'ward'); },   // 대상 지정 불가(다니엘 걸작)·카메라 제외
  visibleEnemies(of = this.player) { return this.enemies(of).filter(e => Vision.visible(of, e)); },
  nearestEnemy(pos, range, of = this.player) { let best = null, bd = range; for (const e of this.visibleEnemies(of)) { const d = V.dist(pos, e.pos) - e.r; if (d <= bd) { bd = d; best = e; } } return best; },
  pickEnemyAt(pt, rad, of = this.player) { let best = null, bd = Infinity; const tm = of ? of.team : 0, wards = this.units.filter(u => u.kind === 'ward' && !u.dead && u.team !== tm && Vision.visible(of, u));   // 상대 카메라는 평타로 파괴
    for (const e of this.visibleEnemies(of).concat(wards)) { const d = V.dist(pt, e.pos); if (d <= rad + e.r && d < bd) { bd = d; best = e; } } return best; },
};

// ============================== 등급/기록 ==============================
const Grade = {
  compute(r) {
    const St = Stats, { c, h } = St.totalCasts();
    const wasteTot = Object.values(St.waste).reduce((a, b) => a + b, 0), mistakeCount = Object.values(St.mistakes).reduce((a, b) => a + b, 0);
    const comps = [
      { k: 'acc', label: '스킬 적중률', v: c ? h / c : 0.5 },
      { k: 'waste', label: '쿨타임 관리', v: St.t > 5 ? clamp(1 - wasteTot / (St.t * 4) * 2.5, 0, 1) : 1 },
      { k: 'mistake', label: '실수 관리', v: clamp(1 - mistakeCount / Math.max(0.5, St.t / 60) / 12, 0, 1) },
      { k: 'mode', label: r.modeLabel || '모드 목표', v: clamp(r.modeRatio ?? 0.5, 0, 1) },
    ];
    const w = Object.assign({ acc: 35, waste: 20, mistake: 20, mode: 25 }, r.weights || {});
    let sum = 0, ws = 0; for (const cp of comps) { cp.w = w[cp.k]; sum += cp.v * cp.w; ws += cp.w; }
    r.gradeScore = ws ? Math.round(sum / ws * 100) : 0;
    r.grade = r.gradeScore >= 85 ? 'S' : r.gradeScore >= 70 ? 'A' : r.gradeScore >= 55 ? 'B' : r.gradeScore >= 40 ? 'C' : 'D';
    r.components = comps;
    const weak = comps.filter(cp => cp.w > 0).sort((a, b) => a.v - b.v)[0];
    const p100 = v => Math.round(v * 100);
    const tips = {
      acc: v => `스킬 적중률 ${p100(v)}% → ${Math.min(100, p100(v) + 10)}% 목표. ` + (!Game.player || !Game.player.charKey || Game.player.charKey === 'cathy' ? 'E는 상대 진행 방향 앞쪽을, W는 바깥 범위(3~4m) 거리를 맞추세요.' : '스킬샷은 상대 진행 방향 앞쪽이나 멈춘 순간을 노리세요.'),   // 캐시 외 실험체는 일반 요령
      waste: () => `교전 중 쿨이 돌아온 스킬을 오래 묵혔습니다. 콤보 사이클을 줄여 쿨 낭비 시간을 절반으로 줄여 보세요.`,
      mistake: () => `실수가 잦습니다. 아래 실수 분석에서 가장 많은 항목 하나만 집중 교정해 보세요.`,
      mode: () => `${r.modeLabel || '모드 목표'} 수치를 끌어올리는 것이 다음 목표입니다. 게임 속도를 0.7x로 낮춰 연습한 뒤 1.0x로 돌아오세요.`,
    };
    r.nextGoal = weak ? tips[weak.k](weak.v) : '';
  },
};
const Records = {
  all() { return Store.get('records', {}); },
  save(r) {
    if (!r.key) return;
    const all = this.all(), rec = all[r.key] || { best: null, hist: [] };
    r.prevBest = rec.best; r.isBest = rec.best === null || r.score > rec.best;
    if (r.isBest) rec.best = r.score;
    rec.hist.push({ s: r.score, g: r.grade, d: Date.now() }); rec.hist = rec.hist.slice(-10);
    rec.title = r.recTitle || r.title; rec.label = r.scoreLabel;

// ============================== 입력 ==============================
const Input = {
  screen: { x: 0, y: 0 }, world: { x: 16, y: 9 }, aiming: null, amove: false,
  rDown: false, rLast: 0, locked: false, lockLostT: 0,
  reset() { this.aiming = null; this.amove = false; this.rDown = false; },
  // 우클릭 이동/공격 (누르고 있으면 계속 커서를 따라감 — 실제 게임처럼)
  rightCmd(hold) {
    const p = Game.player, w = this.world; if (!p) return;
    const t = Game.pickEnemyAt(w, 0.35);
    if (t) { if (p.attackTarget !== t) Cmd.attack(t); } else if (!hold || !p.attackTarget) Cmd.move(w);
  },
  tick() {   // 매 프레임: 우클릭 유지 이동 · 걸작 중 커서 위치 전달
    const p = Game.player;
    if (p && p.shadow && Game.state === 'play' && !Game.paused && !Game.demoLock && (!p.cursor || V.dist(p.cursor, this.world) > 0.25) && performance.now() - (this.curLast || 0) > 80) { this.curLast = performance.now(); Cmd.cursor(this.world); }
    if (!this.rDown || Game.state !== 'play' || Game.paused || !Game.player || Game.demoLock) return;
    const now = performance.now(); if (now - this.rLast < 90) return;
    this.rLast = now; this.rightCmd(true);
  },
  moveBtn() { return Settings.moveButton === 'left' ? 0 : 2; },   // 이동 버튼: 우클릭(기본) / 좌클릭(웨일 등 브라우저 마우스 제스처 회피)
  setPos(x, y) { this.screen = { x, y }; this.world = Renderer.toWorld(x, y); },
  // 마우스 잠금(Pointer Lock): 웨일·비발디 등 브라우저의 우클릭 드래그 '마우스 제스처'가 게임 입력을 가로채지 않도록 커서를 캔버스에 가둠
  wantLock() { return Settings.pointerLock && Game.state === 'play' && !Game.paused; },
  lock(cv) { if (this.wantLock() && !this.locked && cv.requestPointerLock) { try { const r = cv.requestPointerLock(); if (r && r.catch) r.catch(() => {}); } catch (e) { /* 미지원 */ } } },
  unlock() { if (document.pointerLockElement && document.exitPointerLock) document.exitPointerLock(); },
  init(cv) {
    const block = e => { e.preventDefault(); e.stopPropagation(); };
    cv.addEventListener('contextmenu', block);
    window.addEventListener('contextmenu', e => { if (Game.state === 'play') block(e); });
    document.addEventListener('pointerlockchange', () => {
      this.locked = document.pointerLockElement === cv;
      if (!this.locked) { this.rDown = false; if (Game.state === 'play' && !Game.paused && Settings.pointerLock) { this.lockLostT = performance.now(); Game.togglePause(); } }   // Esc로 잠금이 풀리면 일시정지
    });
    cv.addEventListener('mousemove', e => {
      if (e.buttons & 2) block(e);   // 우클릭 드래그를 페이지가 소비 (제스처 확장 프로그램 대응)
      if (this.locked) this.setPos(clamp(this.screen.x + e.movementX, 0, window.innerWidth - 1), clamp(this.screen.y + e.movementY, 0, window.innerHeight - 1));
      else this.setPos(e.clientX, e.clientY);
    });
    window.addEventListener('mouseup', e => { if (e.button === this.moveBtn()) this.rDown = false; if (e.button === 2 && Game.state === 'play') block(e); });
    cv.addEventListener('mousedown', e => {
      Sfx.init(); if (!this.locked) this.setPos(e.clientX, e.clientY);
      if (e.button === 2) block(e);
      if (Game.state !== 'play' || Game.paused || !Game.player || Game.demoLock) return;
      this.lock(cv);
      const p = Game.player;
      const w = this.world, mb = this.moveBtn();
      if (p.petCmd && ((e.button === 2 && e.altKey) || e.button === 1)) { block(e); this.aiming = null; this.amove = false; Cmd.pet(w, Game.pickEnemyAt(w, 0.35, p)); return; }   // 클로에: 니나 조종
      if (e.button === 0 && (this.aiming || this.amove)) {   // 스킬 조준·공격 이동 확정은 항상 좌클릭
        if (this.aiming) { Cmd.skill(this.aiming, w); this.aiming = null; } else { Cmd.amove(w); this.amove = false; }
      } else if (e.button === mb) {   // 이동/공격 (누르고 있으면 계속 따라감)
        this.aiming = null; this.amove = false; this.rDown = true; this.rLast = performance.now();
        this.rightCmd(false);
        if (mb === 2 && !Settings.whaleHint && /Whale\//.test(navigator.userAgent)) { Settings.whaleHint = true; saveSettings(); FX.toast("웨일 마우스 제스처가 뜨면: 설정 → 마우스 → 이동 버튼 '좌클릭'", '#4aa3ff'); }
      } else if (e.button === 2) { this.aiming = null; this.amove = false; }   // 좌클릭 이동 모드: 우클릭 = 조준 취소
      
    });
    cv.addEventListener('wheel', e => { if (Renderer.mode === '3d' && Game.state === 'play') { e.preventDefault(); Render3D.onWheel(e); } }, { passive: false });   // 3D 카메라 줌
    window.addEventListener('keydown', e => this.onKey(e));
    window.addEventListener('keyup', e => this.onKeyUp(e));
  },
  onKey(e) {
    if (e.key === 'Alt' && Game.state === 'play') e.preventDefault();   // Alt(니나 조종)를 눌러도 브라우저 메뉴로 포커스가 가지 않게
    if (UI.waitKey) {
      e.preventDefault();
      if (e.key === 'Escape') { UI.waitKey = null; UI.showSettings(UI.settingsBack); return; }
      const k = e.key.toLowerCase(); if (k.length !== 1 || k === ' ') return;
      for (const a in Settings.keys) if (Settings.keys[a] === k) Settings.keys[a] = Settings.keys[UI.waitKey];   // 충돌 시 맞바꿈
      Settings.keys[UI.waitKey] = k; UI.waitKey = null; saveSettings(); UI.showSettings(UI.settingsBack); return;
    }
    if (e.key === 'Tab') { e.preventDefault(); Settings.side = !Settings.side; saveSettings(); Side.update(); return; }
    if (e.key === 'Escape') {
      if (Game.state !== 'play') return;
      if (performance.now() - Input.lockLostT < 400) return;   // 마우스 잠금 해제용 Esc는 이미 일시정지로 처리됨
      if (!Game.paused && this.aiming) { this.aiming = null; return; }
      if (!Game.paused && this.amove) { this.amove = false; return; }
      Game.togglePause(); return;
    }
    if (e.key === ' ' && Game.state === 'play') { e.preventDefault(); this.spaceHeld = true; return; }
    if (Replay.active && Game.state === 'play' && !e.repeat && Replay.key(e.key.toLowerCase())) { e.preventDefault(); return; }   // 리플레이: P · [ ] · − =   // 스페이스(누르고 있기): 카메라를 내 캐릭터로
    if (Game.state !== 'play' || Game.paused || e.repeat || !Game.player) return;
    if (Game.modeId === 'combo' && e.key.toLowerCase() === 'g' && !Object.values(Settings.keys).includes('g')) { e.preventDefault(); Modes.combo.startDemo(); return; }   // 콤보 시범 보기
    if (Game.demoLock) return;   // 시범 중엔 입력 막음
    const k = e.key.toLowerCase(), act = Object.keys(Settings.keys).find(a => Settings.keys[a] === k);
    if (!act) return;
    e.preventDefault(); Sfx.init();
    const p = Game.player, w = this.world;
    if (act === 'S') { Cmd.stop(); this.aiming = null; return; }
    if (act === 'X') { this.aiming = null; this.amove = false; Cmd.rest(); return; }   // 휴식 (다시 누르면 일어남)
    if (act === 'C') { Cmd.camera(w); return; }   // 망원 카메라: 커서 방향(최대 4m)에 즉시 설치
    if (act === 'V') { Cmd.drone(w); return; }    // 정찰 드론: 커서 지점(최대 24m)으로 발사
    if (act === 'A') { this.amove = true; this.aiming = null; return; }
    if (act === 'T' || act === 'B') {   // 팀 대전 핑: T = 커서 위 적 집중 / 땅이면 여기로 · B = 내 쪽으로 후퇴
      if (Game.modeId !== 'team') { FX.toast('핑은 AI 팀 대전에서 아군 AI에게 지시합니다', '#9fd8ff'); return; }
      if (act === 'B') { Cmd.ping('back', p.pos); return; }
      const t = Game.pickEnemyAt(w, CONFIG.input.pickRadius * 1.6, p); Cmd.ping(t && isHero(t) ? 'focus' : 'go', w, t && isHero(t) ? t : null); return;
    }
    if (act === 'Y') { Settings.camLock = Settings.camLock === false; saveSettings(); FX.toast(Settings.camLock ? '카메라 잠금' : '카메라 잠금 해제 — 화면 가장자리로 이동, 스페이스로 내 캐릭터', '#9fd8ff'); return; }   // 이터널 리턴과 같은 카메라 잠금 전환
    if (act === 'R' && p.shadow) { Cmd.skill('R', w); this.aiming = null; return; }   // 다니엘 걸작 중 R = 즉시 탈출
    // 즉시 발동형: 단검 1차(유틸)
    if (act === 'D' && p.weapon === 'dagger' && p.daggerReady <= 0) { Cmd.skill('D', w); return; }
    if (p.instantKey && p.instantKey(act)) { Cmd.skill(act, w); this.aiming = null; return; }   // 원거리 실험체: 자기 자신 스킬·재입력(나딘 Q 발사 등)은 조준 없이
    const mode = castModeOf(act);
    if (mode === 'smart') { Cmd.skill(act, w); this.aiming = null; return; }           // 누르면 즉시 발동
    if (mode === 'release') { this.aiming = act; this.amove = false; this.holdKey = act; return; }   // 떼면 발동
    if (this.aiming === act) { Cmd.skill(act, w); this.aiming = null; return; }   // 같은 키 두 번 = 시전
    this.aiming = act; this.amove = false;
  },
  onKeyUp(e) {
    if (e.key === 'Alt' && Game.state === 'play') e.preventDefault();
    if (e.key === ' ') this.spaceHeld = false;
    if (!this.holdKey || Game.state !== 'play' || Game.paused || !Game.player) { this.holdKey = null; return; }
    const act = Object.keys(Settings.keys).find(a => Settings.keys[a] === e.key.toLowerCase());
    if (act !== this.holdKey) return;
    this.holdKey = null;
    if (this.aiming === act) { Cmd.skill(act, this.world); this.aiming = null; }
  },
};

// ============================== 그리기 도우미 ==============================
const FONT = "'Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif";
const Draw = {
  rr(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); },

    if (o.stroke) { ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,.85)'; ctx.strokeText(s, x, y); }
    ctx.fillStyle = o.color || '#e6e9ef'; ctx.fillText(s, x, y);
  },
  panel(ctx, x, y, w, h) { Draw.rr(ctx, x, y, w, h, 10); ctx.fillStyle = 'rgba(14,17,24,.92)'; ctx.fill(); ctx.lineWidth = 1; ctx.strokeStyle = '#2a3140'; ctx.stroke(); },
  oRect(ctx, s, ang, len, w) { ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(ang); ctx.fillRect(0, -w / 2, len, w); ctx.strokeRect(0, -w / 2, len, w); ctx.restore(); },
  circle(ctx, x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); },
};

// ============================== 렌더러 (표시 계층) ==============================
// 게임 로직은 월드 좌표(m)만 다루고, 그리기와 화면↔월드 좌표 변환은 Renderer가 담당
// 구현: Render(2D 캔버스). 이후 3D 구현을 같은 인터페이스로 추가 — init / frame / toWorld / toScreen / pxPerMeter / inputCanvas
// 그래픽 품질: auto(기본 높음 — 3D에서 FPS가 4초 넘게 40 아래면 낮음으로 바꾸고 알림) / high / low
//   낮음 = 해상도 배율 1(고해상도 화면에서 픽셀 수 1/4) · 3D 그림자 끔 · 비 절반. 판정은 그대로
const Gfx = {
  autoLow: false, slowT: 0,
  low() { const q = Settings.gfxQ || 'auto'; return q === 'low' || (q === 'auto' && this.autoLow); },
  dpr() { return this.low() ? 1 : Math.min(2, window.devicePixelRatio || 1); },
  hidden() { return document.hidden; },   // 탭이 가려지면 FPS가 떨어지므로 판단하지 않음
  apply() { Renderer.resize(); },
  watch(dt, fps) {
    if ((Settings.gfxQ || 'auto') !== 'auto' || this.autoLow || Renderer.mode !== '3d' || Game.state !== 'play' || this.hidden()) { this.slowT = 0; return; }
    this.slowT = fps < 40 ? this.slowT + dt : 0;
    if (this.slowT > 4) { this.autoLow = true; this.apply(); FX.toast('프레임이 낮아 그래픽 품질을 「낮음」으로 바꿨습니다 (설정 → 그래픽)', '#9fd8ff'); }
  },
};
const Renderer = {
  impl: null, mode: '2d',
  init() { Render.init(); this.impl = Render; this.setMode(Settings.gfx, true); },
  // 그래픽 전환: '3d'는 Three.js·WebGL이 가능할 때만, 실패하면 2D로 되돌리고 알림
  setMode(m, quiet) {
    if (m === '3d') {
      try { if (!Render3D.ready) Render3D.init(); Render3D.resize(); Render3D.show(true); this.impl = Render3D; this.mode = '3d'; return true; }
      catch (e) { console.warn('3D 렌더러 사용 불가:', e); if (!quiet) FX.toast('3D 그래픽을 사용할 수 없어 2D로 표시합니다', '#ffb347'); Settings.gfx = '2d'; saveSettings(); }
    }
    if (Render3D.ready) Render3D.show(false);
    this.impl = Render; this.mode = '2d'; return m !== '3d';
  },
  resize() { Render.resize(); if (Render3D.ready) Render3D.resize(); },
  frame() { Input.tick(); this.impl.frame(); },
  toWorld(sx, sy) { return this.impl.toWorld(sx, sy); },
  toScreen(p, h = 0) { return this.impl.toScreen(p, h); },   // h: 지면에서의 높이(m) — 2D는 무시
  pxPerMeter(p) { return this.impl.pxPerMeter(p); },
  overhead(u) { return this.impl.overhead(u); },               // 머리 위 체력바 위치 {x, top, bottom}
  inputCanvas() { return this.impl.inputCanvas(); },
};

// ============================== 2D 렌더 ==============================
const HUD_H = 118;
const Render = {
  init() { this.cv = document.getElementById('game'); this.ctx = this.cv.getContext('2d'); this.resize(); window.addEventListener('resize', () => Renderer.resize()); },
  resize() {
    const dpr = Gfx.dpr(), W = innerWidth, H = innerHeight;
    this.cv.width = W * dpr; this.cv.height = H * dpr;
    // 기본 공간보다 큰 맵(원형 투기장): 화면 배율은 기본 공간 기준 그대로, 카메라가 내 캐릭터를 따라감
    const B = CONFIG.worldBase || CONFIG.world, big = CONFIG.world.w > B.w || CONFIG.world.h > B.h, F = big ? B : CONFIG.world;
    const ppm = Math.min((W - 20) / F.w, (H - HUD_H - 20) / F.h);
    this.L = { W, H, dpr, ppm, ox: (W - CONFIG.world.w * ppm) / 2, oy: Math.max(10, (H - HUD_H - CONFIG.world.h * ppm) / 2), follow: big };
    this.cam = null;
  },
  // 따라가는 카메라: 내 캐릭터(없으면 공간 가운데)를 화면 가운데로 — 커서의 월드 좌표도 다시 계산
  followCam() {
    const L = this.L; if (!L.follow) return;
    const p0 = Game.player, p = p0 && p0.dead ? Vision.allies(p0)[0] || p0 : p0, t = p && !p.dead && Game.state !== 'menu' ? p.pos : { x: CONFIG.world.w / 2, y: CONFIG.world.h / 2 };
    if (!this.cam) this.cam = V.copy(t); else { const k = Math.min(1, ((performance.now() - (this.camT || 0)) / 1000) * 8); this.cam = V.lerp(this.cam, t, k); }
    this.camT = performance.now();
    L.ox = L.W / 2 - this.cam.x * L.ppm; L.oy = (L.H - HUD_H) / 2 - this.cam.y * L.ppm;
    if (Input.screen) Input.world = this.toWorld(Input.screen.x, Input.screen.y);
  },
  toWorld(sx, sy) { const L = this.L; return { x: (sx - L.ox) / L.ppm, y: (sy - L.oy) / L.ppm }; },
  toScreen(p) { const L = this.L; return { x: L.ox + p.x * L.ppm + (this.shx || 0), y: L.oy + p.y * L.ppm + (this.shy || 0) }; },
  pxPerMeter() { return this.L.ppm; },
  inputCanvas() { return this.cv; },
  frame() {
    this.followCam();
    const { ctx, L } = this, T = CONFIG.theme;
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#07090d'; ctx.fillRect(0, 0, this.cv.width, this.cv.height);
    const sh = Settings.reduceShake ? 0 : FX.shake; this.shx = (Math.random() - 0.5) * sh; this.shy = (Math.random() - 0.5) * sh;
    ctx.setTransform(L.dpr * L.ppm, 0, 0, L.dpr * L.ppm, L.dpr * (L.ox + this.shx), L.dpr * (L.oy + this.shy));
    this.drawWorld(ctx, T);
    ctx.setTransform(L.dpr, 0, 0, L.dpr, 0, 0);
    ScreenLayer.draw(ctx, L);   // 체력바·글자·HUD — 렌더러와 무관한 화면 좌표 층
  },
  // layer: 'all' = 2D 전체 / 'ground' = 3D 렌더러의 바닥 데칼(예고 범위·이펙트·상태 표시·안개만 — 바닥·벽·부쉬·유닛 몸체·투사체는 3D 메시)
  drawWorld(ctx, T, layer = 'all') {
    const W = CONFIG.world.w, H = CONFIG.world.h, all = layer === 'all', rd = Geo.round();
    if (all && rd) {   // 원형 맵: 별개 공간 — 원 안에만 바닥·격자, 바깥은 빈 공간
      ctx.save(); ctx.beginPath(); ctx.arc(rd.c.x, rd.c.y, rd.r, 0, Math.PI * 2); ctx.fillStyle = T.floor; ctx.fill(); ctx.clip();
      ctx.lineWidth = 0.02;
      for (let x = 0; x <= W; x++) { ctx.strokeStyle = x % 4 ? T.grid : '#1f2636'; ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
      for (let y = 0; y <= H; y++) { ctx.strokeStyle = y % 4 ? T.grid : '#1f2636'; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
      ctx.restore();
    } else if (all) {
      ctx.fillStyle = T.floor; ctx.fillRect(0, 0, W, H);
      ctx.lineWidth = 0.02;
      for (let x = 0; x <= W; x++) { ctx.strokeStyle = x % 4 ? T.grid : '#1f2636'; ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
      for (let y = 0; y <= H; y++) { ctx.strokeStyle = y % 4 ? T.grid : '#1f2636'; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
      ctx.strokeStyle = '#2f3850'; ctx.lineWidth = 0.08; ctx.strokeRect(0, 0, W, H);
    }
    // 치유 영역
    for (const z of Game.zones) {
      ctx.save(); ctx.globalAlpha = 0.18 + 0.12 * Math.sin(Game.time * 6); ctx.fillStyle = '#5dff9a'; ctx.strokeStyle = 'rgba(93,255,154,.6)'; ctx.lineWidth = 0.04;
      Draw.oRect(ctx, z.from, V.ang(z.dir), z.len, z.width); ctx.restore();
    }
    if (Game.mode && Game.mode.drawWorld && Game.state !== 'menu') Game.mode.drawWorld(ctx);
    // 벽
    if (all && rd) {   // 원형 맵: 테두리
      ctx.save(); ctx.beginPath(); ctx.arc(rd.c.x, rd.c.y, rd.r, 0, Math.PI * 2); ctx.strokeStyle = '#5a6a8a'; ctx.lineWidth = 0.14; ctx.stroke(); ctx.strokeStyle = 'rgba(255,200,87,.35)'; ctx.lineWidth = 0.05; ctx.beginPath(); ctx.arc(rd.c.x, rd.c.y, rd.r - 0.12, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
    }

    if (u.act && u.act.type === 's1') { ctx.save(); ctx.globalAlpha = 0.15 + 0.35 * (u.act.t / u.act.dur); ctx.fillStyle = '#b56cff'; ctx.strokeStyle = '#b56cff'; ctx.lineWidth = 0.03; Draw.oRect(ctx, u.pos, V.ang(u.act.dir), CONFIG.enemy.s1.range, CONFIG.enemy.s1.width); ctx.restore(); }
    if (decal) { this.drawUnitDecal(ctx, u, T); ctx.restore(); return; }
    ctx.fillStyle = u.color; Draw.circle(ctx, u.pos.x, u.pos.y, u.r); ctx.fill();
    ctx.lineWidth = 0.06; ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.stroke();
    ctx.save(); ctx.translate(u.pos.x, u.pos.y);
    if (u.kind === 'player') {
      ctx.fillStyle = '#fff'; ctx.fillRect(-0.06, -0.22, 0.12, 0.44); ctx.fillRect(-0.22, -0.06, 0.44, 0.12);   // 의료 십자
      ctx.rotate(u.facing); ctx.fillStyle = '#e6e9ef'; ctx.fillRect(u.r * 0.7, -0.08, 0.55, 0.16);           // 톱날
      ctx.fillStyle = '#c4c9d4'; for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.moveTo(u.r * 0.75 + i * 0.13, 0.08); ctx.lineTo(u.r * 0.81 + i * 0.13, 0.17); ctx.lineTo(u.r * 0.87 + i * 0.13, 0.08); ctx.fill(); }

    } else if (u.kind === 'target') {
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 0.05; Draw.circle(ctx, 0, 0, u.r * 0.55); ctx.stroke(); Draw.circle(ctx, 0, 0, u.r * 0.18); ctx.fillStyle = '#fff'; ctx.fill();

      ctx.rotate(u.facing); ctx.strokeStyle = '#e1d4ff'; ctx.lineWidth = 0.08; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(u.r + 0.5, 0); ctx.stroke();

    }

    if (u.shield > 0) {

      g.addColorStop(0, 'rgba(90,120,255,0)'); g.addColorStop(0.75, 'rgba(90,120,255,.28)'); g.addColorStop(1, 'rgba(150,175,255,.55)');
      ctx.fillStyle = g; Draw.circle(ctx, u.pos.x, u.pos.y, u.r + 0.45); ctx.fill();

      for (const [rr, sp] of [[u.r + 0.22, 4], [u.r + 0.34, -3]]) { ctx.beginPath(); ctx.ellipse(u.pos.x, u.pos.y, rr, rr * 0.8, Game.time * sp, 0.3, Math.PI * 2 - 0.3); ctx.stroke(); }
    }
    if (u.stun > 0) for (let i = 0; i < 3; i++) { const a = Game.time * 5 + i * 2.09; ctx.fillStyle = T.gold; Draw.circle(ctx, u.pos.x + Math.cos(a) * 0.35, u.pos.y - u.r - 0.2 + Math.sin(a) * 0.12, 0.07); ctx.fill(); }
    if (Settings.showHitbox) { ctx.strokeStyle = '#5dff9a'; ctx.lineWidth = 0.03; Draw.circle(ctx, u.pos.x, u.pos.y, u.r); ctx.stroke(); }

  },
  // 3D 모드의 바닥 표시: 보호막·속박·히트박스 (기절 별·몸체는 3D)
  drawUnitDecal(ctx, u, T) {
    if (u.shield > 0) { ctx.strokeStyle = 'rgba(170,190,255,.85)'; ctx.lineWidth = 0.07; Draw.circle(ctx, u.pos.x, u.pos.y, u.r + 0.3); ctx.stroke(); }
    if (u.root > 0) { ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 0.05; for (const [rr, sp] of [[u.r + 0.22, 4], [u.r + 0.34, -3]]) { ctx.beginPath(); ctx.ellipse(u.pos.x, u.pos.y, rr, rr * 0.8, Game.time * sp, 0.3, Math.PI * 2 - 0.3); ctx.stroke(); } }
    if (Settings.showHitbox) { ctx.strokeStyle = '#5dff9a'; ctx.lineWidth = 0.03; Draw.circle(ctx, u.pos.x, u.pos.y, u.r); ctx.stroke(); }
  },
  // 머리 위 표시 위치(2D): 몸 원 위
  overhead(u) { const s = this.toScreen(u.pos), R = u.r * this.L.ppm; return { x: s.x, top: s.y - R - 16, bottom: s.y + R + 13 }; },
  drawProjectile(ctx, pr, T) {
    if (pr.team !== myTeam() && !Vision.pointVisible(pr.pos)) return;   // 시야 밖 적 투사체는 안 보임
    ctx.save();
    if (pr.kind === 'needle') {
      if (pr.owner && !pr.owner.dead) { ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 0.03; ctx.beginPath(); ctx.moveTo(pr.owner.pos.x, pr.owner.pos.y); ctx.lineTo(pr.pos.x, pr.pos.y); ctx.stroke(); }   // 실
      ctx.translate(pr.pos.x, pr.pos.y); ctx.rotate(V.ang(pr.dir)); ctx.shadowColor = T.accent2; ctx.shadowBlur = 10; ctx.fillStyle = T.accent2; ctx.fillRect(-0.45, -0.05, 0.6, 0.1);

      const look = pr.look === 'knife' ? 'bolt' : Render3D.projLook(pr), col = pr.color || '#c79bff', ln = pr.len || 0.6, big = clamp(ln / 0.6, 1, 3.5);
      ctx.translate(pr.pos.x, pr.pos.y); ctx.rotate(V.ang(pr.dir)); ctx.shadowColor = col; ctx.shadowBlur = 10;
      const tl = look === 'sniper' ? 2.2 * big : look === 'blade' ? 0.6 : 0.9 * big, tw = (look === 'sniper' ? 0.11 : 0.09) * big;
      const gr = ctx.createLinearGradient(-tl, 0, 0, 0); gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(1, col);
      ctx.globalAlpha = 0.6; ctx.fillStyle = gr; ctx.beginPath(); ctx.moveTo(0, -tw); ctx.lineTo(-tl, 0); ctx.lineTo(0, tw); ctx.fill(); ctx.globalAlpha = 1;
      if (look === 'arrow' || look === 'bolt') { const L = (look === 'arrow' ? 0.9 : 0.6) * Math.min(big, 2); ctx.strokeStyle = look === 'arrow' ? '#d8c39a' : '#8a6a48'; ctx.lineWidth = 0.06; ctx.beginPath(); ctx.moveTo(-L / 2, 0); ctx.lineTo(L / 2, 0); ctx.stroke(); ctx.fillStyle = '#e8eef5'; ctx.beginPath(); ctx.moveTo(L / 2 + 0.16, 0); ctx.lineTo(L / 2, -0.07); ctx.lineTo(L / 2, 0.07); ctx.fill(); }
      else if (look === 'blade') { ctx.rotate(Game.time * 30); ctx.fillStyle = '#e8eef5'; ctx.beginPath(); for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, rr = i % 2 ? 0.06 : 0.2; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } ctx.fill(); }
