}

// ============================== 통계 ==============================
const Stats = {
  reset() {
    Object.assign(this, {
      t: 0, inputs: 0, casts: {}, hits: {}, hitKeys: new Set(), dmgBy: {}, dealtTotal: 0, takenTotal: 0, timeline: [],
      aaHits: 0, waste: {}, mistakes: {}, criticals: 0, eDouble: 0, eWall: 0, enhAA: 0,
      comboAtt: 0, comboOk: 0, streak: 0, bestStreak: 0, shots: 0, shotHits: 0, movingHits: 0, leadHits: 0,
      hitPositions: [], kills: 0, playerHits: 0,
      combatT: 0, aaIdle: 0, heroAA: 0, kiteAA: 0, rangeSum: 0, closeAA: 0, lastAAPos: null,   // 원거리 실험체 코칭(7_a_coach.js)
      counts: {},   // 실험체 연계 기록(알론소 자력 연결 linkOn·linkPop · 다니엘 영감 표식 markOn·markPop)
    });
  },
  tick(dt) { this.t += dt; },
  input() { this.inputs++; },
  cast(k) { this.casts[k] = (this.casts[k] || 0) + 1; },
  // 적중은 시전 수를 넘지 않음(적중률 ≤ 100%)
  hit(k, id) { const key = k + ':' + id; if (this.hitKeys.has(key)) return false; this.hitKeys.add(key); if ((this.hits[k] || 0) < (this.casts[k] || 0)) this.hits[k] = (this.hits[k] || 0) + 1; return true; },
  // 시전 1회당 적중 1회: 여러 번 때리는 스킬(틱·다단·인형)은 마지막 시전 기준
  hitCast(k) { return this.hit(k, '#' + (this.casts[k] || 0)); },
  dealt(src, d) { this.dmgBy[src] = (this.dmgBy[src] || 0) + d; this.dealtTotal += d; const i = Math.floor(this.t); this.timeline[i] = (this.timeline[i] || 0) + d; },
  mistake(txt) {
    this.mistakes[txt] = (this.mistakes[txt] || 0) + 1;
    FX.toast('⚠ ' + txt, '#ffb347');
  },
  // 스킬샷 연속 명중 (Q/W/E)
  resolveShot(k, hit) {
    if (!['Q', 'W', 'E'].includes(k)) return;
    this.shots++;
    if (hit) { this.shotHits++; this.streak++; this.bestStreak = Math.max(this.bestStreak, this.streak); Events.emit('streak', { n: this.streak }); }
    else this.streak = 0;
  },
  // 교전 중(적 8m 이내)인데 쿨이 돌아 있는 스킬을 안 쓴 시간
  trackWaste(p, dt) {
    if (!Game.nearestEnemy(p.pos, 8, p)) return;   // p 기준 적
    for (const k of SKILL_KEYS) {
      const s = p.skills[k];
      if (s.lv <= 0 || s.cd > 0 || (p.cast && p.cast.k === k)) continue;
      if (k === 'D' && (p.daggerReady > 0 || p.dualRecast > 0)) continue;
      this.waste[k] = (this.waste[k] || 0) + dt;
    }
  },
  count(k) { this.counts[k] = (this.counts[k] || 0) + 1; },
  // 평타 공백(사거리 안 · 평타 준비 · 행동 가능인데 안 침) — 교전 = 보이는 적(실험체·허수아비)이 사거리 + 3m 안 · 원거리·근접 키트 실험체 공통
  trackRanged(p, dt) {
    if (p.dead) return;
    const range = p.aaCfg().range; let e = null, bd = range + 3;
    for (const u of Game.enemies(p)) if (!u.dead && (isHero(u) || u.kind === 'dummy') && !(u.untargetable > 0) && Vision.visible(p, u)) { const d = V.dist(p.pos, u.pos) - u.r - p.r; if (d < bd) { bd = d; e = u; } }   // 평타 판정과 같은 가장자리 거리
    if (!e) return;
    this.combatT += dt;
    if (bd <= range && p.aaCd <= 0 && p.aa.phase === 'none' && !p.cast && !(p.noAA > 0) && p.canAct()) this.aaIdle += dt;
  },
  // 원거리 실험체 평타 발사: 실험체 대상만 — 직전 평타 뒤 움직였는가(쏘고 움직이기) · 사거리 대비 거리
  aaShot(p, t) {
    if (!isHero(t) || p.motif.melee) return;
    const range = p.aaCfg().range, k = clamp((V.dist(p.pos, t.pos) - t.r) / range, 0, 1);
    this.heroAA++; this.rangeSum += k; if (k < 0.6) this.closeAA++;
    if (this.lastAAPos && V.dist(this.lastAAPos, p.pos) > 0.4) this.kiteAA++;
    this.lastAAPos = V.copy(p.pos);
  },
  recentDps(sec = 5) { const i1 = Math.floor(this.t); let s = 0; for (let i = Math.max(0, i1 - sec + 1); i <= i1; i++) s += this.timeline[i] || 0; return s / Math.min(sec, Math.max(1, this.t)); },
  totalCasts() { let c = 0, h = 0; for (const k of SKILL_KEYS) { c += this.casts[k] || 0; h += this.hits[k] || 0; } return { c, h }; },
  apm() { return this.inputs / Math.max(1 / 60, this.t / 60); },
  snapshot() { return JSON.parse(JSON.stringify({ casts: this.casts, hits: this.hits, dealt: this.dealtTotal, taken: this.takenTotal, mistakes: this.mistakes })); },
};
// 기록을 버리는 통계 (내 캐릭터가 아닌 유닛용): 함수는 아무 일도 안 하고, 숫자는 0으로 읽히며 쓰기는 무시
const NullStats = new Proxy({}, { get: (t, k) => typeof Stats[k] === 'function' ? () => false : 0, set: () => true });
Stats.reset();

// ============================== 원딜 캐릭터 키트 (실제 스킬, 수치는 CONFIG.rangedKits) ==============================
// 각 키트: init / update / think(스킬 판단) / escape(위협 시 이탈) / dodge(투사체 회피) / aaRange / aaDamage / fireAA / onAAHit / onHit / draw
const KU = {
  inCone(ai, dir, range, angleDeg, u) { return Geo.inSector(ai.pos, V.ang(dir), range, angleDeg / 2 * Math.PI / 180, u.pos, u.r); },
  // 캐시를 dir 방향으로 밀어냄 — 벽에 닿으면 onWall 호출 (리오 연사 넉백)
  knock(u, dir, dist, time, onWall) {
    if (u.dead || u.unstoppable > 0) return;
    if (u.forced && u.forced.onEnd && !onWall) return;   // 벽꿍 판정이 있는 넉백을 작은 밀침이 덮어쓰지 않게
    const t = Geo.rayHit(u.pos, dir, dist, u.r), len = t === Infinity ? dist : Math.max(0, t - 0.02);
    u.forced = { from: V.copy(u.pos), to: V.add(u.pos, V.mul(dir, len)), t: 0, dur: time * len / Math.max(0.1, dist) + 0.01, onEnd: t === Infinity ? null : onWall };
  },
  // 사다리꼴(카티야 R): 중심 c, 축 dir, 길이 len, 앞(시전자 쪽) 폭 w0 → 뒤 폭 w1. 안에 든 유닛을 시전 지점 쪽부터(가까운 순)
  inTrap(c, dir, T, units) {
    const n = V.perp(dir), out = [];
    for (const u of units) { const rel = V.sub(u.pos, c), a = V.dot(rel, dir), s = Math.abs(V.dot(rel, n)), k = clamp((a + T.len / 2) / T.len, 0, 1);
      if (Math.abs(a) <= T.len / 2 + u.r && s <= lerp(T.w0, T.w1, k) / 2 + u.r) out.push({ u, a }); }
    return out.sort((x, y) => x.a - y.a).map(o => o.u);
  },
  trapPts(c, dir, T) { const n = V.perp(dir), h = T.len / 2; return [V.add(V.sub(c, V.mul(dir, h)), V.mul(n, T.w0 / 2)), V.add(V.add(c, V.mul(dir, h)), V.mul(n, T.w1 / 2)), V.sub(V.add(c, V.mul(dir, h)), V.mul(n, T.w1 / 2)), V.sub(V.sub(c, V.mul(dir, h)), V.mul(n, T.w0 / 2))]; },
  segCross(a1, a2, b1, b2) {   // 선분 교차
    const d = (a2.x - a1.x) * (b2.y - b1.y) - (a2.y - a1.y) * (b2.x - b1.x); if (Math.abs(d) < 1e-9) return false;
    const u = ((b1.x - a1.x) * (b2.y - b1.y) - (b1.y - a1.y) * (b2.x - b1.x)) / d, v = ((b1.x - a1.x) * (a2.y - a1.y) - (b1.y - a1.y) * (a2.x - a1.x)) / d;
    return u >= 0 && u <= 1 && v >= 0 && v <= 1;
  },
  ring(ctx, pos, r, col, alpha, dash) { ctx.save(); ctx.globalAlpha = alpha; ctx.strokeStyle = col; ctx.lineWidth = 0.06; if (dash) ctx.setLineDash([0.2, 0.12]); Draw.circle(ctx, pos.x, pos.y, r); ctx.stroke(); ctx.restore(); },
  fill(ctx, pos, r, col, alpha) { ctx.save(); ctx.globalAlpha = alpha; ctx.fillStyle = col; Draw.circle(ctx, pos.x, pos.y, r); ctx.fill(); ctx.restore(); },
};

// 부쉬 체크용: 추정 지점 방향(약간의 오차)
KU.aimAt = (ai, pt) => V.fromAng(V.ang(V.sub(pt, ai.pos)) + (rnd() - 0.5) * 2 * ai.diff.aimErr);

const Kits = {
  // ---------------- 카티야 (저격총) ----------------
  katja: {
    init(ai) { ai.psT = 0; },
    update(ai, dt) { if (ai.psT > 0) ai.psT -= dt; },
    // P 잿빛 사신: Q·E 후 5초 안의 다음 평타에 추가 스킬 피해
    onAAHit(ai, u) {
      if (ai.psT <= 0) return; ai.psT = 0; const P = ai.kitCfg.P;
      ai.hitP(u, (ai.pick(P.base, 'P') + ai.ad * ai.pick(P.ad, 'P')) * ai.diff.dmgMul, { name: P.name, noPassive: true });
    },
    think(ai, p, d) {
      const K = ai.kitCfg;
      // R 정밀 조준: 캐시가 멀고 진입이 어려울 때 — 0.8초 스캔(제자리 고정) 후 회피 불가 탄
      if (ai.cds.R <= 0 && d > 7.5 && d < K.R.range && (foeCd(p, 'Q') > 1 || d > 9.5)) {
        const pos = Geo.pushOut(ai.predict(p, K.R.scan), 0.3);
        ai.cds.R = ai.pick(K.R.cd, 'R');
        const axis = V.norm(V.sub(pos, ai.pos));
        ai.startChannel(K.R.scan, { tele: { kind: 'trap', pos, dir: axis, len: K.R.len, w0: K.R.w0, w1: K.R.w1, color: '#ff4d4d' }, cancelIfClose: 3.5,
          onEnd: (a, cancelled) => {
            const hit = cancelled ? [] : KU.inTrap(pos, axis, K.R, Game.units.filter(u => isHero(u) && u.team !== ai.team && u.team !== 2 && !u.dead)).slice(0, K.R.max);
            if (!hit.length) { ai.cds.R = ai.pick(K.R.cd, 'R') * (1 - K.R.refund); FX.text(ai.pos, '스캔 실패', '#8a93a6', 12); return; }
            Sfx.play('ult');
            hit.forEach((u, i) => ai.pendingShots.push({ t: i * 0.15, fn: () => { const S = K.R.shots[i] || K.R.shots[0];
              ai.shoot({ dir: V.norm(V.sub(u.pos, ai.pos)), speed: K.R.speed, range: 99, width: 0.5, len: 1.8, color: '#ff4d4d', home: u,
                onHit: v => { ai.hitP(v, (ai.pick(S.base, 'R') + ai.ad * S.ad) * ai.diff.dmgMul, { name: K.R.name }); FX.burst(v.pos, '#ff4d4d', 18, 7); FX.addShake(6); } }); } }));
          } });
        FX.text(ai.pos, K.R.name, ai.motif.color, 13, { bold: true });
        return true;
      }
      // 무기 스킬 저격: 멀리서 제자리 고정 저격 모드 (저지 사격 2발 → 데드아이)
      if (ai.cds.D <= 0 && d > 7.5 && d < K.D.range - 1 && (foeCd(p, 'Q') > 1 || d > 9)) { this.snipe(ai, p); return true; }
      // Q 조준 사격
      if (ai.cds.Q <= 0 && d <= K.Q.range - 0.5) {
        const dir = ai.aimDir(p, K.Q.windup, K.Q.speed); ai.cds.Q = ai.pick(K.Q.cd, 'Q');
        ai.startCast(K.Q.windup, () => {
          Sfx.play('throw'); ai.psT = ai.kitCfg.P.window;
          ai.shoot({ dir, speed: K.Q.speed, range: K.Q.range, width: K.Q.width, len: 1.1, onHit: (u, pr) => {
            const k = clamp(pr.traveled / K.Q.range, 0, 1), amt = lerp(ai.pick(K.Q.min, 'Q') + ai.ad * K.Q.minAd, ai.pick(K.Q.max, 'Q') + ai.ad * K.Q.maxAd, k) * ai.diff.dmgMul;
            ai.hitP(u, amt, { name: K.Q.name }); ai.addAs(ai.pick(K.Q.asBuff, 'Q'), K.Q.asDur, 'katjaQ'); FX.burst(u.pos, ai.motif.color, 10, 5);
          } });
        }, { kind: 'line', dir, len: K.Q.range, width: K.Q.width });
        return true;
      }
      return false;
    },
    snipe(ai, p) {
      const K = ai.kitCfg.D; let fired = 0, phase = 'aim', t = 0, dir = ai.aimDir(p, K.aim, K.speed);
      ai.cds.D = ai.pick(K.cd, 'D'); FX.text(ai.pos, K.name, ai.motif.color, 13, { bold: true });
      ai.startChannel(K.shots * (K.aim + K.gap) + 0.1, { cancelIfClose: 4.5, tele: { kind: 'line', dir, len: K.range, width: K.width, color: '#ff4d4d' },
        onTick: (dt, a) => {
          t += dt;
          if (phase === 'aim') { dir = V.norm(V.lerp(dir, ai.aimDir(p, K.aim - t, K.speed), 0.15)); a.tele.dir = dir; a.tele.width = K.width * (1.6 - t / K.aim); }
          if (phase === 'aim' && t >= K.aim) {
            const dead = fired === K.shots - 1, S = dead ? K.dead : K.shot; fired++; phase = 'gap'; t = 0; Sfx.play(dead ? 'ult' : 'throw');
            ai.shoot({ dir, speed: K.speed, range: K.range, width: K.width, len: 1.6, color: dead ? '#ff4d4d' : ai.motif.color, onHit: u => {
              let amt = ai.calc(S, 'D'); if (dead) amt *= 1 + clamp(1 - u.hp / u.maxHp, 0, 1) * (K.dead.missMax - 1);   // 데드아이: 잃은 체력 비례 최대 2배
              ai.hitP(u, amt, { name: dead ? '데드아이' : '저지 사격' }); if (!dead) u.addSlow(K.shot.slow, K.shot.slowDur);
            } });
          }
          if (phase === 'gap' && t >= K.gap) { phase = 'aim'; t = 0; if (fired >= K.shots) a.stop = true; }
        },
        onEnd: (a, cancelled) => { if (cancelled && fired === 0) ai.cds.D *= 0.5; } });   // 한 발도 못 쏘고 풀리면 쿨 50% 반환
    },
    checkBush(ai, est) {
      const K = ai.kitCfg, d = V.dist(ai.pos, est);
      if (ai.cds.W <= 0 && d <= K.W.range) {   // 정찰 다트: 착탄 지점 반경 4.5m 시야 3초
        const W = K.W, to = V.copy(est); ai.cds.W = ai.pick(W.cd, 'W');
        ai.startCast(0.2, () => {
          Sfx.play('throw'); FX.trail(ai.pos, to, '#9fd8ff', 0.12, d / W.speed + 0.2);
          ai.pendingShots.push({ t: d / W.speed, fn: () => { Vision.reveals.push({ team: ai.team, pos: to, r: W.radius, t: W.dur }); FX.ring(to, 0.5, W.radius, '#9fd8ff', 0.5, 0.08); } });
        }, { kind: 'line', dir: V.norm(V.sub(to, ai.pos)), len: d, width: 0.3, color: '#9fd8ff' });
        FX.text(ai.pos, W.name, ai.motif.color, 12, { bold: true }); return true;
      }
      if (ai.cds.Q <= 0 && d <= K.Q.range - 0.5) {   // 조준 사격으로 부쉬 찌르기
        const dir = KU.aimAt(ai, est); ai.cds.Q = ai.pick(K.Q.cd, 'Q');
        ai.startCast(K.Q.windup, () => { Sfx.play('throw'); ai.psT = K.P.window;
          ai.shoot({ dir, speed: K.Q.speed, range: K.Q.range, width: K.Q.width, len: 1.1, onHit: (u, pr) => {
            const k = clamp(pr.traveled / K.Q.range, 0, 1); ai.hitP(u, lerp(ai.pick(K.Q.min, 'Q') + ai.ad * K.Q.minAd, ai.pick(K.Q.max, 'Q') + ai.ad * K.Q.maxAd, k) * ai.diff.dmgMul, { name: K.Q.name }); } });
        }, { kind: 'line', dir, len: K.Q.range, width: K.Q.width });
        return true;
      }
      return false;
    },
    // E 접근 금지: 전방 부채꼴 사격(둔화) 후 뒤로 4m 도약(벽 넘기 가능, 시전 후 CC 무시)
    escape(ai, p, dir) {
      const K = ai.kitCfg.E; if (ai.cds.E > 0) return false;
      const fwd = V.norm(V.sub(p.pos, ai.pos)); ai.cds.E = ai.pick(K.cd, 'E'); ai.unstoppable = K.windup + K.leapTime;
      ai.startCast(K.windup, () => {
        Sfx.play('throw'); ai.psT = ai.kitCfg.P.window;
        if (KU.inCone(ai, fwd, K.range, K.angle, p)) { ai.hitP(p, (ai.pick(K.base, 'E') + ai.ad * K.ad) * ai.diff.dmgMul, { name: K.name }); p.addSlow(ai.pick(K.slow, 'E'), K.slowDur); ai.addMsBuff(K.msBuff, K.msDur, false, 'katjaE'); }
        FX.slash(ai.pos, V.ang(fwd), K.range, K.angle / 2 * Math.PI / 180, ai.motif.color, 0.25);
        ai.dashTo(V.mul(fwd, -1), K.leap, K.leapTime, true, K.name);
      }, { kind: 'cone', dir: fwd, len: K.range, angle: K.angle });
      return true;
    },
  },

  // ---------------- 리오 (활) ----------------
  rio: {
    init(ai) { ai.stance = 'long'; ai.kc = 0; ai.kcReady = false; ai.zones = []; },
    // P 카이: 방관 = 기본 + 치명확률×10%
    pen(ai) { const P = ai.kitCfg.P; return ai.pick(P.pen, 'P') + ai.critChance * P.penPerCrit; },
    asFlat(ai) { return ai.stance === 'long' ? -ai.kitCfg.Q.long.asPenalty : 0; },
    aaRange(ai) { const Q = ai.kitCfg.Q; return ai.stance === 'short' ? Q.short.range : Q.long.range + (ai.kcReady ? Q.longRange : 0); },
    gainKc(ai) { if (ai.kcReady) return; if (++ai.kc >= ai.kitCfg.Q.stacks) { ai.kcReady = true; ai.kc = 0; FX.text(ai.pos, '카이츄', ai.motif.color, 11, { bold: true }); } },
    // 평타: 치명 없음, ×(1.02 + 치명확률×0.75) × 활 계수 — 단궁은 3발(36% + 35%×2), 화궁은 1발(102%)
    fireAA(ai, p, dir) {
      const Q = ai.kitCfg.Q, M = (1.02 + ai.critChance * 0.75) * ai.diff.dmgMul, ready = ai.kcReady;
      if (ready) {   // 카이츄 발동
        ai.kcReady = false;
        if (ai.stance === 'short') { ai.addMsBuff(ai.pick(Q.shortMs, 'Q'), Q.buffDur, true, 'rioQ'); ai.addAs(ai.pick(Q.shortAs, 'Q'), Q.buffDur, 'rioQ'); }
      }
      const land = (u, ratio, main) => {
        let amt = ai.ad * ratio * M;
        if (main && ready && ai.stance === 'long') amt *= 1 + clamp(1 - u.hp / u.maxHp, 0, 1) * 100 * Q.longMissing / 100;   // 잃은 체력 1%당 0.3%
        Combat.damage(ai, u, amt, { type: 'normal', source: '적 평타', pen: this.pen(ai) });
        if (main) this.gainKc(ai);
      };
      if (ai.stance === 'short') {
        ai.shoot({ dir, speed: 26, range: Q.short.range + 1.5, width: 0.3, len: 0.5, onHit: u => land(u, Q.short.ratio, true) });
        for (const s of [-1, 1]) ai.shoot({ dir: V.fromAng(V.ang(dir) + s * 0.06), speed: 26, range: Q.short.range + 1.5, width: 0.3, len: 0.4, onHit: u => land(u, Q.short.extraRatio, false) });
      } else ai.shoot({ dir, speed: 24, range: this.aaRange(ai) + 1.5, width: 0.3, len: 0.8, onHit: u => land(u, Q.long.ratio, true) });
      return true;
    },
    onHit(ai, u, o) { if (o.kc !== false) this.gainKc(ai); if (o.hanare) for (const k of ['Q', 'E', 'R', 'D']) ai.cds[k] = Math.max(0, ai.cds[k] - ai.kitCfg.W.cdReduce); },
    update(ai, dt) {
      const foes = Game.units.filter(u => isHero(u) && u.team !== ai.team && u.team !== 2 && !u.dead);
      for (const z of ai.zones) {   // 단궁 하나레 둔화 바람 / 곡사 착탄
        z.t += dt;
        if (z.type === 'wind') for (const p of foes) if (V.dist(p.pos, z.pos) <= z.r + p.r * 0.5) p.addSlow(z.slow, 0.1);
        if (z.type === 'arc' && !z.hit && z.t >= z.delay) {
          z.hit = true; const D = ai.kitCfg.D;
          for (const p of foes) { const dd = V.dist(p.pos, z.pos); if (dd <= D.radius + p.r * 0.5) { const inner = dd <= D.innerR; ai.hitP(p, ai.calc(inner ? { base: D.inner, bad: D.innerBad, sp: D.innerSp } : D, 'D'), { name: D.name }); p.addSlow(D.slow, D.slowDur); } }
          FX.ring(z.pos, 0.5, D.radius, ai.motif.color, 0.35, 0.12); FX.burst(z.pos, ai.motif.color, 16, 5);
        }
      }
      ai.zones = ai.zones.filter(z => z.type === 'wind' ? z.t < z.dur : !z.hit);
    },
    think(ai, p, d) {
      const K = ai.kitCfg;
      // Q 활 교체: 가까우면 단궁(지속 딜·카이팅), 멀면 화궁(긴 사거리 견제)
      const want = d <= 5.0 ? 'short' : 'long';
      if (ai.stance !== want && ai.cds.Q <= 0) { ai.stance = want; ai.cds.Q = K.Q.cd; FX.text(ai.pos, want === 'short' ? '단궁' : '화궁', ai.motif.color, 12, { bold: true }); }
      // R: 단궁 연사(붙은 캐시를 밀쳐냄, 벽꿍 기절) / 화궁 정사필중(장거리 둔화)
      if (ai.cds.R <= 0 && ai.stance === 'long' && d > 7 && (foeCd(p, 'Q') > 1 || d > 9)) { this.rLong(ai, p); return true; }
      // 무기 스킬 곡사
      if (ai.cds.D <= 0 && d > 6 && d < K.D.range) {
        const pos = Geo.pushOut(ai.predict(p, K.D.windup + K.D.delay), 0.2); ai.cds.D = ai.pick(K.D.cd, 'D');
        ai.startCast(K.D.windup, () => { ai.zones.push({ type: 'arc', pos, t: 0, delay: K.D.delay }); Sfx.play('throw'); }, { kind: 'circle', pos, r: K.D.radius });
        return true;
      }
      // W 하나레
      if (ai.cds.W <= 0) {
        const W = K.W, S = ai.stance === 'short' ? W.short : W.long;
        if (d <= S.range - 0.5) {
          const dir = ai.aimDir(p, 0.2, ai.stance === 'short' ? 30 : W.long.speed); ai.cds.W = ai.pick(W.cd, 'W');
          ai.startCast(0.2, () => {
            Sfx.play('throw');

  // ---------------- 나딘 (석궁) ----------------
  nadine: {

    onAAHit(ai, u) {

        }

    },
    think(ai, p, d) {
      const K = ai.kitCfg;
      // E 원숭이 와이어: 교전 전 뒤쪽에 걸어 두기(공속 증가, 위급하면 재사용으로 이탈)

      // 강노: 부채꼴 사격 + 둔화 + 폭발 표식

          onEnd: c => {
            const k = clamp(c.t / Q.charge, 0, 1), rng = lerp(Q.range[0], Q.range[1], k), dir = ai.aimDir(p, 0, Q.speed);
            const base = ai.pick(Q.min, 'Q') + ai.bonusAd * Q.minBad + ai.sp * Q.minSp, amt = (base * lerp(1, Q.maxMul, k) + ai.stacks) * ai.diff.dmgMul;
            Sfx.play('throw'); ai.shoot({ dir, speed: Q.speed, range: rng, width: Q.width, len: 1.2 + k, onHit: u => ai.hitP(u, amt, { name: Q.name }) });

    checkBush(ai, est) {
      const K = ai.kitCfg, d = V.dist(ai.pos, est);
      if (ai.cds.W <= 0 && ai.traps.length < K.W.sets * 2 && d < K.W.range + 4) {   // 캐시가 나올 길목(부쉬→나딘 방향)에 덫
        const W = K.W, toMe = V.norm(V.sub(ai.pos, est)), mid = V.add(est, V.mul(toMe, Math.min(2.2, d * 0.5))), side = V.perp(toMe);
        ai.traps.push({ a: Geo.pushOut(V.add(mid, V.mul(side, W.link / 2)), 0.2), b: Geo.pushOut(V.sub(mid, V.mul(side, W.link / 2)), 0.2), life: W.life });
        ai.cds.W = ai.pick(W.cd, 'W'); Sfx.play('click'); FX.text(mid, W.name, ai.motif.color, 12, { bold: true }); return true;
      }
      if (ai.cds.Q <= 0 && d < K.Q.range[1] - 0.5 && !ai.chans.some(c => c.charge)) {
        const Q = K.Q, need = clamp((d + 0.8 - Q.range[0]) / (Q.range[1] - Q.range[0]), 0, 1), dur = Math.max(0.6, need * Q.charge), to = V.copy(est);
        ai.cds.Q = Q.cd; ai.noAA = dur; FX.text(ai.pos, Q.name, ai.motif.color, 12, { bold: true });
        ai.chans.push({ t: 0, dur, charge: true, onTick: (dt, c) => ai.addMsBuff(-Q.chargeSlow * Math.min(1, c.t / Q.charge), 0.1, false, 'charge'),
          onEnd: c => { const k = clamp(c.t / Q.charge, 0, 1), base = ai.pick(Q.min, 'Q') + ai.bonusAd * Q.minBad + ai.sp * Q.minSp, amt = (base * lerp(1, Q.maxMul, k) + ai.stacks) * ai.diff.dmgMul;
            Sfx.play('throw'); ai.shoot({ dir: KU.aimAt(ai, to), speed: Q.speed, range: lerp(Q.range[0], Q.range[1], k), width: Q.width, len: 1.2 + k, onHit: u => ai.hitP(u, amt, { name: Q.name }) }); } });
        return true;
      }
      return false;
    },
    // 위급하면 와이어로 이탈 (없으면 와이어를 걸고 바로 이동)
    escape(ai, p, dir) {
      const E = ai.kitCfg.E;
      if (ai.wire) { const to = ai.wire.pos, dd = V.dist(ai.pos, to); if (dd < 1.5 || V.dist(to, p.pos) < V.dist(ai.pos, p.pos)) return false;
        ai.wire = null; this.wireAs(ai); ai.act = { type: 'dash', t: 0, dur: E.zipTime, from: V.copy(ai.pos), to: Geo.pushOut(V.copy(to), ai.r) }; FX.text(ai.pos, '와이어 이동', ai.motif.color, 12, { bold: true }); return true; }
      if (ai.cds.E <= 0) { ai.cds.E = ai.pick(E.cd, 'E'); this.wireAs(ai); ai.dashTo(dir, E.range, E.zipTime + 0.15, false, E.name); return true; }
      return false;
    },
    draw(ai, ctx) {
      for (const tr of ai.traps) { ctx.save(); ctx.strokeStyle = ai.motif.color; ctx.lineWidth = 0.07; ctx.setLineDash([0.25, 0.15]); ctx.beginPath(); ctx.moveTo(tr.a.x, tr.a.y); ctx.lineTo(tr.b.x, tr.b.y); ctx.stroke(); ctx.restore(); KU.fill(ctx, tr.a, 0.25, ai.motif.color, 0.8); KU.fill(ctx, tr.b, 0.25, ai.motif.color, 0.8); }
      if (ai.wire) { ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 0.03; ctx.beginPath(); ctx.moveTo(ai.pos.x, ai.pos.y); ctx.lineTo(ai.wire.pos.x, ai.wire.pos.y); ctx.stroke(); ctx.restore(); KU.ring(ctx, ai.wire.pos, 0.35, '#ffffff', 0.8); }
      if (ai.mark && !ai.mark.u.dead) { const u = ai.mark.u, k = clamp(ai.mark.t / ai.kitCfg.D.mark.time, 0, 1); ctx.save(); ctx.strokeStyle = ai.motif.color; ctx.lineWidth = 0.1; ctx.beginPath(); ctx.arc(u.pos.x, u.pos.y, u.r + 0.4, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * k); ctx.stroke(); ctx.restore(); }
      if (ai.wolfT > 0) KU.ring(ctx, ai.pos, ai.r + 0.3, '#d0d0d0', 0.5, true);
    },
  },
};

// ============================== 근거리 암살자 키트: 다니엘 (단검) ==============================
// 스킬 수치: CONFIG.rangedKits.daniel (나무위키) / 판단: CONFIG.meleeAI (네브짱 '장인초대석' 다니엘 랭킹 1위 강의)
//  stalk  : 정면 싸움 금지 — Q 사거리 근처(6m)에서 서성이며(부쉬 선호) 캐시의 E(수쳐)·Q가 빠지거나 체력이 깎이길 기다림
//  engage : 망토(이속) → E 은신 돌진 → 그림자 평타(건너편 순간이동) → Q(중앙) + W 표식 → 단검(뒤로 순간이동) → 평타 → R 걸작
//           궁 이후 도망치는 캐시를 쫓을 수 있게 E는 가능하면 아낌 · E 사거리가 모자라면 늑대를 그림자 평타로 경유
//  retreat: 체력이 낮고 궁이 빠졌으면 빠졌다가 다시 서성이기
Kits.daniel = {
  init(ai) {
    Object.assign(ai, { mode: 'stalk', modeT: 0, qShots: 0, shadowT: 0, cloakT: 0, lastHitT: 99, mark: null, shadow: null, aaTarget: null, engageHits: 0 });
    Object.assign(ai.stats, { engages: 0, rUses: 0, wolfHops: 0, markPops: 0 });
  },
  K(ai) { return ai.kitCfg; },
  aaRange(ai) { return ai.shadowT > 0 ? ai.kitCfg.E.aaRange : ai.motif.aaRange; },
  setMode(ai, m) { if (ai.mode !== m) { ai.mode = m; ai.modeT = 0; if (m === 'engage') ai.stats.engages++; } },

  // ---------- 매 스텝 ----------
  update(ai, dt) {
    const K = ai.kitCfg;
    ai.modeT += dt; ai.lastHitT += dt;
    // P 고독한 예술가: 밤에 시야·이동 속도 증가
    ai.sightMul = Vision.night ? 1 + ai.pick(K.P.sight, 'P') : 1;
    if (Vision.night) ai.addMsBuff(ai.pick(K.P.ms, 'P'), 0.25, false, 'danP');
    if (ai.shadowT > 0) { ai.shadowT -= dt; if (ai.shadowT <= 0) ai.stealthT = 0; }
    if (ai.cloakT > 0) { ai.cloakT -= dt; if (ai.cloakT <= 0) ai.cds.D = ai.pick(K.D.cd, 'D'); }   // 단검(2차) 안 쓰면 쿨 시작
    if (ai.qShots > 0 && !ai.asBuffs.some(a => a.tag === 'danQ')) ai.qShots = 0;
    if (ai.mark) {
      const M = ai.mark, was = M.t; M.t += dt;
      if (was < K.W.ready && M.t >= K.W.ready && !M.target.dead && (M.target === Game.player || Vision.visible(Game.player, M.target))) DanFx.markReady(M.target);
      if (M.target.dead || M.t > K.W.ready + K.W.popWindow) ai.mark = null;
      else Vision.reveals.push({ team: ai.team, pos: V.copy(M.target.pos), r: 2, t: 0.05 });   // 표식 대상 주변 2m 시야 (부쉬·암시야 속도 보임)
    }
    for (const o of ai.objs) { o.t += dt; if (!o.done && o.t >= o.dur) { o.done = true; this.qLand(ai, o); } }
    ai.objs = ai.objs.filter(o => o.t < o.dur + 0.25);
    if (ai.mode === 'engage' && ai.thinkT > ai.diff.react * 0.5) ai.thinkT = ai.diff.react * 0.5;   // 콤보 중에는 판단을 빠르게
  },
  // R 걸작: 그림자 속(대상에 붙어 대상 지정 불가) — 일반 행동을 대신함
  preempt(ai, dt) {
    const S = ai.shadow; if (!S) return false;
    const K = ai.kitCfg.R, u = S.target; S.t += dt;
    if (!u.dead) ai.pos = V.copy(u.pos);
    ai.untargetable = ai.invuln = 0.1; ai.stealthT = 0.05; ai.vel = { x: 0, y: 0 };
    const every = K.dur / K.ticks;
    while (S.n < K.ticks && S.t >= every * (S.n + 1) - 1e-6) { S.n++; if (!u.dead) { ai.hitP(u, ai.calc(K.tick, 'R'), { name: K.name, noShake: true }); DanFx.rTick(u, S.n, '#b07cff'); } }
    if (S.t >= K.dur || u.dead) this.exitShadow(ai);
    return true;
  },
  exitShadow(ai) {
    const S = ai.shadow, K = ai.kitCfg.R, u = S.target; ai.shadow = null;
    if (!u.dead) { ai.hitP(u, ai.calc(K.last, 'R'), { name: K.name + ' (마무리)' }); FX.xslash(u.pos, ai.motif.color, 3); Sfx.play('ult'); }
    // 빠져나오는 방향: 계속 싸울 거면 캐시 등 뒤(벽 반대), 도망칠 거면 반대쪽
    const away = ai.hp / ai.maxHp < CONFIG.meleeAI.lowHp && u.hp / u.maxHp > 0.35;
    let best = null, bs = -Infinity;
    for (let i = 0; i < 12; i++) {
      const dir = V.fromAng(i * Math.PI / 6), q = V.add(u.pos, V.mul(dir, K.exit));
      const sc = wallClearance(q) * 1.2 + (away ? V.dist(q, u.pos) : -Math.abs(angDiff(i * Math.PI / 6, (u.facing ?? 0) + Math.PI))) + rnd() * 0.2;
      if (sc > bs) { bs = sc; best = dir; }
    }
    ai.untargetable = ai.invuln = K.exitTime; ai.stealthT = 0;
    ai.dashTo(best, K.exit, K.exitTime, false);
    if (away) this.setMode(ai, 'retreat');
  },

  // ---------- 피해 훅: 영감 축적·폭발, 최근 피해(궁 조건) ----------
  dealt(ai, u, dmg, o) {
    if (!isHero(u) || u.team === ai.team) return;
    ai.lastHitT = 0; u.blindT = 0;   // 다니엘에게 맞으면 시야 감소 해제
    const M = ai.mark, W = ai.kitCfg.W; if (!M || M.target !== u || (o && o.markPop)) return;
    if (M.t >= W.ready) {   // 영감의 대상 공격 → 폭발
      ai.mark = null; ai.stats.markPops++;
      const acc = M.acc; Combat.damage(ai, u, acc, { type: 'true', source: '적 영감 (축적)' });
      ai.hitP(u, ai.calc(W, 'W'), { name: W.name + ' 폭발', markPop: true }); u.addSlow(W.slow, W.slowDur);
      FX.burst(u.pos, '#d9a8ff', 24, 7, 0.6); FX.ring(u.pos, 0.3, 1.8, '#d9a8ff', 0.4); FX.text(u.pos, '영감 폭발 ' + Math.round(acc), '#d9a8ff', 14, { bold: true });
    } else M.acc += dmg * (ai.pick(W.acc, 'W') + ai.bonusAd * W.accBad) / 100;
  },
  onHit(ai, u, o, dmg) { this.dealt(ai, u, dmg || 0, o); },
  onAAHit(ai, u, dmg) {
    this.dealt(ai, u, dmg || 0);
    if (ai.qShots > 0 && --ai.qShots <= 0) ai.asBuffs = ai.asBuffs.filter(a => a.tag !== 'danQ');
  },

  // ---------- 평타: 근접 즉시 판정 / 그림자 돌진 중이면 대상 건너편으로 순간이동 ----------
  fireAA(ai, p) {
    const t = ai.aaTarget && !ai.aaTarget.dead ? ai.aaTarget : p; ai.aaTarget = null;
    const K = ai.kitCfg.E, d = V.dist(ai.pos, t.pos) - t.r - ai.r;
    if (ai.shadowT > 0 && d <= K.aaRange + 0.3) {
      const dir = V.norm(V.sub(t.pos, ai.pos)), from = V.copy(ai.pos);
      ai.pos = Geo.pushOut(V.add(t.pos, V.mul(dir, t.r + ai.r + 0.15)), ai.r);
      FX.burst(from, '#4b3a66', 14, 2.5, 0.6, 0.14); FX.trail(from, ai.pos, '#7d5cb8', 0.25, 0.25);
      ai.shadowT = 0; ai.stealthT = 0;
      if (t === p) { ai.aaLand(t); ai.hitP(t, ai.calc(K, 'E'), { name: K.name }); }
      else { Combat.damage(ai, t, ai.ad, { type: 'normal', source: '적 평타' }); ai.stats.wolfHops++; FX.text(ai.pos, '그림자 경유', ai.motif.color, 11); }
      return true;
    }
    if (d <= ai.motif.aaRange + 0.35) { ai.aaLand(t); FX.slash(ai.pos, V.ang(V.sub(t.pos, ai.pos)), 1.3, 0.6, ai.motif.color, 0.15); }
    return true;
  },
  kite(ai, p) {   // 근접: 쏘고 빠지기 대신 계속 붙어 있음 (도망 모드 제외)
    if (ai.mode === 'retreat') { ai.moveTarget = ai.pickSpot(p, 9, 2.2); return; }
    ai.moveTarget = Geo.pushOut(ai.predict(p, 0.15), ai.r);
  },

  // ---------- 스킬 ----------
  castQ(ai, pt) {
    const K = ai.kitCfg.Q, dir = V.norm(V.sub(pt, ai.pos)), dist = Math.min(K.range, V.dist(ai.pos, pt));
    const pos = V.add(ai.pos, V.mul(dir, dist));
    ai.cds.Q = ai.pick(K.cd, 'Q'); ai.stealthT = 0;   // 다른 스킬을 쓰면 은신 해제
    ai.objs.push({ kind: 'scissor', pos, dir, t: 0, dur: K.windup });   // 무빙 캐스팅: 시전 중에도 계속 이동
    Vision.act(ai, 'skill');
    FX.text(ai.pos, K.name, ai.motif.color, 12, { bold: true }); Sfx.play('throw');
  },
  qLand(ai, o) {
    const K = ai.kitCfg.Q, apex = V.sub(o.pos, V.mul(o.dir, K.front)); let hit = false;
    for (const u of Game.units) {
      if (u.dead || u.team === ai.team || u.untargetable > 0) continue;
      if (!Geo.inSector(apex, V.ang(o.dir), K.len, K.angle / 2 * Math.PI / 180, u.pos, u.r)) continue;
      const center = V.dist(u.pos, o.pos) <= K.centerR + u.r;
      if (isHero(u)) { ai.hitP(u, ai.calc(center ? K.center : K, 'Q'), { name: K.name + (center ? ' (중앙)' : '') }); hit = true; }
      else Combat.damage(ai, u, ai.calc(K, 'Q'), { type: 'skill', source: '적 ' + K.name });
      if (center) u.addSlow(K.slow, K.slowDur);
    }
    FX.slash(apex, V.ang(o.dir), K.len, K.angle / 2 * Math.PI / 180, '#9d6bff', 0.3);
    if (hit) { ai.addAs(ai.pick(K.asBuff, 'Q'), K.asDur, 'danQ'); ai.qShots = K.asShots; }
  },
  castW(ai, u) {
    const K = ai.kitCfg.W; ai.cds.W = K.cd; ai.stealthT = 0;
    ai.mark = { target: u, t: 0, acc: 0 }; u.blindT = K.blind; u.blindR = K.blindR;
    FX.text(u.pos, '영감 표식', '#d9a8ff', 13, { bold: true }); FX.ring(u.pos, 1.2, 0.4, '#d9a8ff', 0.4); Sfx.play('throw');
    Vision.act(ai, 'skill');
  },
  castE(ai, dir, dist) {
    const K = ai.kitCfg.E; ai.cds.E = ai.pick(K.cd, 'E');
    FX.burst(ai.pos, '#4b3a66', 18, 2.5, 0.7, 0.16); Vision.noise(ai, 'skill');   // 은신 연기 + 시전 소리(상대는 이것으로 진입을 눈치챔)
    ai.dashTo(dir, K.dist, K.time, true);   // 앞으로 3m 고정, 돌진 거리로 닿는 벽은 넘음(벽 중심 규칙)
    ai.stealthT = ai.pick(K.stealth, 'E'); ai.shadowT = K.shadowDur; ai.revealT = 0;
    FX.text(ai.pos, K.name, ai.motif.color, 12, { bold: true });
  },
  cloak(ai) {   // 망토와 단검 1차: 1초 이속
    const K = ai.kitCfg.D; ai.cloakT = K.recast; ai.addMsBuff(ai.pick(K.ms, 'D'), K.msDur, false, 'danD');
    FX.text(ai.pos, '망토', ai.motif.color, 12, { bold: true }); FX.burst(ai.pos, '#6e5a99', 8, 3, 0.4);
  },
  dagger(ai, u) {   // 2차: 대상 뒤로 순간이동 + 피해·둔화
    const K = ai.kitCfg.D, dir = V.norm(V.sub(u.pos, ai.pos)), from = V.copy(ai.pos);
    ai.cloakT = 0; ai.cds.D = ai.pick(K.cd, 'D'); ai.stealthT = 0; ai.shadowT = 0;
    ai.pos = Geo.pushOut(V.add(u.pos, V.mul(dir, K.behind)), ai.r);   // 대상 건너 1.5m 착지(지형 통과)
    FX.trail(from, ai.pos, '#b07cff', 0.2, 0.25);
    ai.hitP(u, ai.calc(K, 'D') + u.hp * K.curHp * ai.diff.dmgMul, { name: '단검' }); u.addSlow(ai.pick(K.slow, 'D'), K.slowDur);
  },
  canR(ai, p, d) { const K = ai.kitCfg.R; return ai.cds.R <= 0 && ai.lastHitT <= K.recent && d - p.r - ai.r <= K.range && !p.dead; },
  castR(ai, p) {
    const K = ai.kitCfg.R; ai.cds.R = ai.pick(K.cd, 'R'); ai.act = null; ai.moveTarget = null; ai.shadowT = 0;
    ai.shadow = { target: p, t: 0, n: 0 }; p.silence = Math.max(p.silence, K.silence); ai.stats.rUses++;
    if (p.cast && p.cast.phase === 'windup' && p.cancelCast) p.cancelCast(false);   // 침묵: 시전 중이던 스킬 취소
    if (p.act && (p.act.type === 'cast' || p.act.type === 'channel')) { if (p.act.onEnd) p.act.onEnd(p.act, true); p.act = null; }   // AI 상대: 시전·정신집중 취소
    FX.text(p.pos, K.name + ' — 침묵', ai.motif.color, 15, { bold: true }); FX.ring(p.pos, 1.5, 0.3, '#2a1840', 0.4); Sfx.play('ult');
  },

  // ---------- 판단 ----------
  burst(ai, p) {   // 지금 들어가면 넣을 수 있는 대략적인 피해(방어력 반영)
    const K = ai.kitCfg, mit = 100 / (100 + p.def * (1 - ai.pen)), aa = ai.ad * (1 + ai.critChance * 0.75) * (1 + ai.aaAmp) * ai.diff.dmgMul;
    let s = aa * 3;
    if (ai.cds.Q <= 1) s += ai.calc(K.Q.center, 'Q') + aa * 2;
    if (ai.cds.E <= 0) s += ai.calc(K.E, 'E');
    if (ai.cds.D <= 0 || ai.cloakT > 0) s += ai.calc(K.D, 'D') + p.hp * K.D.curHp;
    if (ai.cds.R <= 0) s += ai.calc(K.R.tick, 'R') * K.R.ticks + ai.calc(K.R.last, 'R');
    return s * mit;
  },
  think(ai, p, d) {
    const K = ai.kitCfg, MA = CONFIG.meleeAI, dk = ai.diffKey, gap = d - p.r - ai.r;
    const myHp = ai.hp / ai.maxHp, herHp = p.hp / p.maxHp;
    const herE = foeCd(p, 'E') <= 0.8, herQ = foeCd(p, 'Q') <= 0.8;
    // --- 모드 전환 ---
    if (ai.mode !== 'retreat' && myHp < MA.lowHp && ai.cds.R > 0 && herHp > myHp + 0.1 && dk !== 'easy') this.setMode(ai, 'retreat');
    if (ai.mode === 'retreat' && (myHp > MA.engageHp || (ai.modeT > 4 && gap > 8))) this.setMode(ai, 'stalk');
    if (ai.mode === 'stalk') {
      const killable = this.burst(ai, p) >= p.hp * (dk === 'hard' ? 0.85 : 1.0);
      const opening = !herE || (!herQ && dk !== 'easy') || herHp < 0.4;   // 캐시의 수쳐(E)·돌진(Q)이 빠진 순간 = 진입각
      const tools = ai.cds.E <= 0 || ai.cds.D <= 0;
      const forced = gap < 2.0;                                               // 캐시가 먼저 붙으면 맞받아침
      const allowed = !Game.mode || !Game.mode.mayEngage || Game.mode.mayEngage(ai, p);   // 팀 대전: 측면 대기 — 아군이 먼저 교전에 들어간 뒤 진입
      if (forced || (allowed && ((tools && (killable || (opening && (ai.cds.R <= 0 || herHp < 0.5)))) || (dk === 'easy' && ai.modeT > 6)))) this.setMode(ai, 'engage');
    }
    if (ai.mode === 'engage' && ai.modeT > 3 && gap > 6 && ai.cds.E > 0 && ai.cds.D > 0 && ai.cloakT <= 0) this.setMode(ai, 'stalk');   // 놓쳤으면 다시 서성이기
    if (!ai.canAct()) return false;

    // --- 공통: 걸작 회피(캐시 E·R 선딜을 대상 지정 불가로 피함) ---
    // 걸작은 사실상 2초 무적 → 캐시가 스킬(특히 E·R, 진입 중엔 Q·W도)을 시전하는 순간 들어가서 피함
    if (p.cast && p.cast.phase === 'windup' && this.canR(ai, p, d) && dk !== 'easy' &&
        (['E', 'R'].includes(p.cast.k) || (ai.mode === 'engage' && ['Q', 'W'].includes(p.cast.k) && rnd() < (dk === 'hard' ? 0.8 : 0.5)))) { this.castR(ai, p); return true; }

    if (ai.mode === 'engage') return this.combo(ai, p, d, gap);
    if (ai.mode === 'stalk') {
      // Q 견제: 캐시 E가 빠졌을 때만(맞받아치기 어려움), 사거리 7m + 가위 앞부분 1.75m
      // (진입 도구가 다 있으면 Q는 콤보용으로 아낌)
      if (ai.cds.Q <= 0 && (ai.cds.R > 8 || ai.cds.E > 3) && d <= K.Q.range + K.Q.front * 0.6 && d > 4 && (!herE || rnd() < 0.25) && rnd() < (dk === 'easy' ? 0.3 : 0.7)) { this.castQ(ai, ai.predict(p, K.Q.windup)); return true; }
      // 어려움: 난전용 W 선표식 — 4초 뒤 진입해서 터뜨림
      if (dk === 'hard' && ai.cds.W <= 0 && d <= K.W.range && !herE && ai.cds.R <= 0) { this.castW(ai, p); this.setMode(ai, 'engage'); return true; }
    }
    return false;
  },
  combo(ai, p, d, gap) {
    const K = ai.kitCfg;
    // 마무리/표식 폭발/위기 → 걸작
    if (this.canR(ai, p, d)) {
      const R = K.R, rDmg = (ai.calc(R.tick, 'R') * R.ticks + ai.calc(R.last, 'R')) * 100 / (100 + p.def);
      const markReady = ai.mark && ai.mark.t >= K.W.ready - 0.3;
      if (markReady || p.hp <= rDmg * 1.15 || ai.hp / ai.maxHp < 0.45 || ai.modeT > (ai.diffKey === 'hard' ? 2.2 : 2.8)) { this.castR(ai, p); return true; }
    }
    // 단검(2차): 망토 후 3초 안, 붙어 있을 때
    if (ai.cloakT > 0 && gap <= K.D.range && ai.lastHitT < 3) { this.dagger(ai, p); return true; }
    // 첫 타가 들어간 뒤: Q(중앙) + W 표식
    if (ai.lastHitT < 1.5 && gap <= 2.2) {
      if (ai.cds.Q <= 0) { this.castQ(ai, p.pos); return true; }
      if (ai.cds.W <= 0 && !ai.mark) { this.castW(ai, p); return true; }
      if (ai.cds.D <= 0 && ai.cloakT <= 0) { this.cloak(ai); return true; }   // 망토 → 다음 판단에 단검
    }
    // 진입: 망토(이속) → E 은신 돌진 → 그림자 평타
    if (gap > K.E.aaRange - 0.2 && ai.shadowT <= 0) {
      if (ai.cds.D <= 0 && ai.cloakT <= 0 && gap > 4) { this.cloak(ai); return true; }
      // E: 3m 돌진 + 그림자 평타 3m → 6m 안이면 닿음. 궁 이후 추격용으로 아끼라는 조언 → 이미 붙어 있으면 안 씀
      if (ai.cds.E <= 0 && gap <= K.E.dist + K.E.aaRange) { this.castE(ai, V.norm(V.sub(p.pos, ai.pos)), Math.max(0.5, gap - 1.5)); return true; }
      // 사거리가 모자라면 늑대를 그림자 평타로 경유(강의 팁)
      if (ai.cds.E <= 0 && gap <= K.E.dist + K.E.aaRange * 2 + 1) {
        const wolf = Game.units.find(u => u.kind === 'animal' && !u.dead && V.dist(u.pos, ai.pos) <= K.E.dist + K.E.aaRange && V.dist(u.pos, p.pos) < d - 1);
        if (wolf) { this.castE(ai, V.norm(V.sub(wolf.pos, ai.pos)), Math.max(0.5, V.dist(ai.pos, wolf.pos) - 1.5)); ai.hopWolf = wolf; return true; }
      }
    }
    return false;
  },
  // 이동: 서성이기(부쉬 선호, 캐시 E 사거리 밖) / 추격 / 후퇴
  move(ai, p, d) {
    const MA = CONFIG.meleeAI;
    if (ai.hopWolf && ai.shadowT > 0 && !ai.hopWolf.dead) {   // 늑대 경유 중: 늑대에게 그림자 평타
      const w = ai.hopWolf; if (V.dist(ai.pos, w.pos) - w.r - ai.r <= ai.kitCfg.E.aaRange && ai.aaCd <= 0) { ai.aaTarget = w; ai.act = { type: 'aa', t: 0, dur: 0.05 }; ai.hopWolf = null; return; }
      ai.moveTarget = V.copy(w.pos); return;
    }
    ai.hopWolf = null;
    if (ai.mode === 'engage') { ai.moveTarget = Geo.pushOut(ai.predict(p, 0.25), ai.r); return; }
    if (ai.mode === 'retreat') { ai.moveTarget = ai.pickSpot(p, 10, 2.4); return; }
    // stalk: 캐시와 6m 근처를 유지하며 좌우로 서성임, 근처 부쉬가 있으면 숨어서 기다림
    const gap = d - p.r - ai.r, safe = CONFIG.rangedAI.eThreatRange;
    if (gap < MA.stalk - MA.stalkBand) { ai.moveTarget = ai.pickSpot(p, MA.stalk + 0.5, 1.8); return; }   // 너무 가까우면 먼저 빠짐(수쳐 사거리 밖)
    let best = null, bs = -Infinity;
    (CONFIG.bushes || []).forEach(b => {
      const c = { x: b.x + b.w / 2, y: b.y + b.h / 2 }, dc = V.dist(c, p.pos);
      if (Geo.segDist(p.pos, ai.pos, c) < safe) return;   // 가는 길이 캐시 수쳐 사거리를 지나가면 제외
      const sc = -Math.abs(dc - MA.stalk) * 1.2 - V.dist(c, ai.pos) * 0.3;
      if (dc > safe && dc < MA.stalk + 4 && sc > bs) { bs = sc; best = c; }
    });
    if (best && bs > -MA.bushPrefer * 2 && V.dist(best, ai.pos) > 0.6) { ai.moveTarget = Geo.pushOut(V.add(best, { x: (rnd() - 0.5) * 0.6, y: (rnd() - 0.5) * 0.6 }), ai.r); return; }
    if (best && V.dist(best, ai.pos) <= 0.6) { ai.moveTarget = null; return; }   // 부쉬에서 대기
    ai.moveTarget = ai.pickSpot(p, MA.stalk, 1.4);
  },
  dodge(ai) {   // 투사체·수쳐 회피: 붙어 있고 궁이 되면 걸작으로 피함, 아니면 걸어서
    const p = ai.foe; if (!p) return false; const d = V.dist(ai.pos, p.pos);
    if (ai.diffKey !== 'easy' && this.canR(ai, p, d) && ai.mode === 'engage') { this.castR(ai, p); return true; }
    return false;
  },
  // 안 보일 때: 공통 추적(추정 위치에서 7m 유지 — 부쉬 속 캐시의 수쳐·Q 사거리 밖)을 쓰고, 그림자 가위로 부쉬를 찌름
  checkBush(ai, est) {
    const K = ai.kitCfg.Q;
    if (ai.cds.Q <= 0 && V.dist(ai.pos, est) <= K.range + K.front * 0.5) { this.castQ(ai, est); return true; }
    return false;
  },
  // ---------- 그리기 ----------
  draw(ai, ctx) {
    const K = ai.kitCfg.Q;
    for (const o of ai.objs) {   // 그림자 가위 예고: 지정 위치 부채꼴 + 중앙
      if (o.kind !== 'scissor' || o.done) continue;
      const apex = V.sub(o.pos, V.mul(o.dir, K.front)), an = V.ang(o.dir), h = K.angle / 2 * Math.PI / 180, k = clamp(o.t / o.dur, 0, 1);
      ctx.save(); ctx.globalAlpha = 0.12 + 0.3 * k; ctx.fillStyle = '#9d6bff';
      ctx.beginPath(); ctx.moveTo(apex.x, apex.y); ctx.arc(apex.x, apex.y, K.len, an - h, an + h); ctx.closePath(); ctx.fill();
      ctx.globalAlpha = 0.5; ctx.fillStyle = '#d9a8ff'; Draw.circle(ctx, o.pos.x, o.pos.y, K.centerR * k); ctx.fill(); ctx.restore();
    }
    if (ai.mark && !ai.mark.target.dead) DanFx.mark(ctx, ai.mark, ai.kitCfg.W);   // 영감 표식: 4초 뒤 활성(밝아짐)
    if (ai.shadow && ai.shadow.phase !== 'out') DanFx.shadow(ctx, ai.shadow.target, ai.shadow.t / ai.kitCfg.R.dur, '#b07cff');   // 걸작: 캐시 그림자 속
  },
};

// ============================== AI 알론소 (퓨어 탱커 · 결투·팀 대전 상대·아군) ==============================
// 스킬 효과는 플레이어와 같은 AlonsoCore(3_z_rangedy_alonso.js). 여기서는 「언제 쓰나」만 정함 — 근거: 나무위키 알론소 콤보·평가(docs/er_notes_playables.md 11장)
//   · 기본 콤보 E → Q → 평타(무기 스킬): 속박된 동안 Q를 맞히고 평타로 기절 → 상황 봐서 R로 진형 붕괴 / W로 받아치기
//   · Q는 견제·추격용(맞힌 적을 바라보면 빨라짐) · E는 대상이 4.75m 안이고 이동기로 빠지기 어려울 때
//   · W: 앞에서 집중 공격을 받을 때(원딜 포화) — 뒤는 못 막음 · R: 주변 적 2명 이상 또는 근접전에서 체력이 깎일 때(회복 + 당기기)
//   · 팀 대전: 앞라인(frontline) — 아군 원딜에게 붙은 적을 먼저 잡음(TeamAI 필)
Kits.alonso = {
  init(ai) {
    const K = ai.kitCfg;
    ai.al = { K, color: ai.motif.color, S: NullStats, L: k => ai.L(k), level: () => ai.level || 1,
      hit: (u, amt, k, o) => ai.hitP(u, amt * ai.diff.dmgMul, Object.assign({ name: (K[k] && K[k].name) || k }, o)),
      foes: () => Game.units.filter(u => u.team !== ai.team && u.team !== 2 && !u.dead && u.kind !== 'ward' && !(u.untargetable > 0)),
      cdStart: k => { ai.cds[k] = ai.pick(K[k].cd, k); }, cdSet: (k, v) => { ai.cds[k] = v; } };
    AlonsoCore.attach(ai);
  },
  // 근접 평타: 투사체 없이 즉시 · 연결된 적이면 기절
  fireAA(ai, p) { ai.aaLand(p); return true; },
  aaDamage(ai) { return { amount: ai.ad * ai.diff.dmgMul, crit: false }; },
  onAAHit(ai, u) { AlonsoCore.aaHit(ai, u); },
  onDamaged(ai) { AlonsoCore.onDamaged(ai); },
  update(ai, dt) {
    AlonsoCore.update(ai, dt);
    if (ai.alR && (ai.stun > 0 || ai.fear > 0 || ai.silence > 0 || !ai.act || ai.act.type !== 'channel')) { AlonsoCore.rEnd(ai, true); if (ai.act && ai.act.type === 'channel') ai.act = null; }
  },
  think(ai, p, d) {
    const K = ai.kitCfg, hpR = ai.hp / ai.maxHp, foes = ai.al.foes().filter(u => isHero(u)), near = foes.filter(u => V.dist(u.pos, ai.pos) <= K.R.r + u.r);
    if (ai.alW && (ai.alW.t > 1.9 || d > K.W.len + 1)) { AlonsoCore.wEnd(ai); return false; }   // 방패 마무리(파동을 다 쏜 뒤)
    // D 어퍼컷: 연결된 적이 가까우면 바로 기절
    if (ai.cds.D <= 0 && ai.alMark && ai.alMark.u === p && d <= K.D.range + K.D.hop + p.r + ai.r) { this.uppercut(ai, p); return false; }
    // R: 주변 적 2명 이상 · 혼자라도 근접전에서 체력이 깎였을 때
    if (ai.cds.R <= 0 && (near.length >= 2 || (near.length === 1 && hpR < 0.55 && d < 3))) {
      ai.cds.R = ai.pick(K.R.cd, 'R'); AlonsoCore.rStart(ai);
      ai.startChannel(K.R.dur, { onTick: (dt, a) => { if (!ai.alR) { a.stop = true; return; } if (AlonsoCore.rTick(ai, dt)) a.stop = true; else if (ai.diffKey !== 'easy' && a.t > 1.2 && !ai.al.foes().some(u => isHero(u) && V.dist(u.pos, ai.alR.c) <= K.R.r + u.r)) a.stop = true; },
        onEnd: (a, cancelled) => { if (ai.alR) AlonsoCore.rEnd(ai, cancelled); }, tele: { kind: 'circle', pos: V.copy(ai.pos), r: K.R.r } });
      return true;
    }
    // E: 4.75m 안 → 0.8초 뒤 돌진 + 속박 (바로 다음에 Q → 평타 기절)
    if (ai.cds.E <= 0 && d <= K.E.range + p.r && !(p.unstoppable > 0)) {
      const E = K.E; ai.cds.E = ai.pick(E.cd, 'E'); FX.text(p.pos, E.name, ai.motif.color, 13, { bold: true }); AlonsoCore.eAim(ai, p);
      ai.startCast(E.windup, () => {
        if (!AlonsoCore.eValid(ai, p)) { ai.cds.E *= 1 - E.refund; FX.text(ai.pos, '슬램 취소', '#aaa', 11); ai.alE = null; return; }
        const to = V.sub(p.pos, ai.pos), dd = V.len(to), reach = ai.r + p.r + 0.05;
        ai.unstoppable = Math.max(ai.unstoppable, 0.35);
        ai.act = { type: 'dash', t: 0, dur: Math.max(0.05, (dd - reach) / E.dashSpeed), from: V.copy(ai.pos), to: Geo.pushOut(V.sub(p.pos, V.mul(V.norm(to), reach)), ai.r) };
        AlonsoCore.eGo(ai, ai.pos, ai.act.to); AlonsoCore.eLand(ai, p);
      }, { kind: 'circle', pos: V.copy(ai.pos), r: E.cancel, color: ai.motif.color });
      return true;
    }
    // Q: 견제·추격 (속박·기절 중인 적엔 거의 확정)
    if (ai.cds.Q <= 0 && d <= K.Q.range - 0.3 && !ai.alMark) {
      const Q = K.Q, dir = ai.aimDir(p, Q.windup, Q.speed); ai.cds.Q = ai.pick(Q.cd, 'Q');
      ai.startCast(Q.windup, () => { Sfx.play('throw'); ai.shoot({ dir, speed: Q.speed, range: Q.range, width: Q.width, len: 0.8, color: '#7fd7ff', onHit: u => AlonsoCore.qHit(ai, u) }).look = 'fist'; }, { kind: 'line', dir, len: Q.range, width: Q.width });
      return true;
    }
    // W: 앞에서 맞고 있을 때 (원거리 상대에게 다가가는 중이거나 체력이 깎일 때)
    if (ai.cds.W <= 0 && !ai.alW && d < K.W.len + 2 && (hpR < 0.8 || !TeamAI.isMelee(p))) { AlonsoCore.wStart(ai, V.norm(V.sub(p.pos, ai.pos))); return false; }
    return false;
  },
  uppercut(ai, p) {
    const D = ai.kitCfg.D; ai.cds.D = ai.pick(D.cd, 'D'); const to = V.sub(p.pos, ai.pos), d = V.len(to);
    if (d > ai.r + p.r + D.range) ai.pos = Geo.pushOut(V.add(ai.pos, V.mul(to, (d - ai.r - p.r - 0.2) / d)), ai.r);
    ai.facing = V.ang(to); AlonsoCore.dHit(ai, p); Sfx.play('aa');
  },
  kite() {},   // 탱커는 평타 뒤 물러나지 않음
  // 탱커: 떨어지지 않고 붙음 (평타 거리까지)
  move(ai, p, d) { if (d > ai.aaRange() + p.r + ai.r - 0.1) ai.moveTarget = Geo.pushOut(V.copy(p.pos), ai.r); else ai.moveTarget = null; },
  draw(ai, ctx) { if (Vision.visible(Game.player, ai) || ai.team === myTeam()) AlonsoCore.draw(ai, ctx); },
};

// ============================== AI 비형 (브루저 · 결투·팀 대전 상대·아군) ==============================
// 스킬 효과는 플레이어와 같은 BihyungCore(3_z_rangedy_bihyung.js). 여기서는 「언제 쓰나」만 정함 — 근거: 나무위키 콤보·평가 + Yutility 비형 가이드(docs/er_notes_playables.md 14장)
//   · 진입 W → E: W로 둔화·보호막(내가 범위 안)을 먼저 깔고 E 도발 → 도발 중 평타 · Q · 풀스윙(벽 쪽이면 벽꿍 기절)
//   · Q는 평타 강화라 붙어 있을 때 바로 · Q2는 재사용 창(1.5초 뒤)에 · 패시브(신력)를 끊기지 않게 평타를 쉬지 않음
//   · R은 단독 진입기로 아끼고: 주변 적 2명 이상 착지 · 결투에서 상대 빈사·내 체력 낮을 때 마무리·버티기(추가 체력 · 피해 감소)
Kits.bihyung = {
  init(ai) {
    const K = ai.kitCfg;
    ai.bh = { K, color: ai.motif.color, S: NullStats, L: k => ai.L(k), level: () => ai.level || 1,
      hit: (u, amt, k, o) => ai.hitP(u, amt * ai.diff.dmgMul, Object.assign({ name: (K[k] && K[k].name) || k }, o)),
      foes: () => Game.units.filter(u => u.team !== ai.team && u.team !== 2 && !u.dead && u.kind !== 'ward' && !(u.untargetable > 0)),
      cdStart: k => { ai.cds[k] = ai.pick(K[k].cd, k); }, cdSet: (k, v) => { ai.cds[k] = v; } };
    BihyungCore.attach(ai);
  },
  fireAA(ai, p) { ai.aaLand(p); return true; },   // 근접 평타
  onAAHit(ai, u) { BihyungCore.onAA(ai, u); },
  update(ai, dt) { BihyungCore.update(ai, dt); },
  // 풀스윙 방향 뒤에 벽이 가까운가(벽꿍 각)
  wallBehind(p, dir, dist) { const t = Geo.rayHit(p.pos, dir, dist, p.r); return t !== Infinity; },
  think(ai, p, d) {
    const K = ai.kitCfg, hpR = ai.hp / ai.maxHp, pHp = p.hp / p.maxHp, gap = d - ai.r - p.r;
    const foes = ai.bh.foes().filter(u => isHero(u)), taunted = p.taunt > 0 && p.tauntBy === ai, easy = ai.diffKey === 'easy';
    // 쉬움: 수치는 그대로 두고 연계만 줄임 — Q 2단계 안 씀 · W 예측 없이 지금 위치 · E 가끔(40%) · 도발 뒤 풀스윙은 벽꿍 각일 때만 (2026-10-16 점검: 쉬움인데 보통과 거의 같은 세기)
    // Q2: 재사용 창이 열리면 바로(다음 평타 3연타)
    if (!easy && BihyungCore.qReady2(ai) && gap <= ai.aaRange() + 0.6) { BihyungCore.qCast(ai); return false; }
    // R: 착지 지점 주변 적 2명 이상 · 결투 마무리(상대 빈사) · 내가 몰릴 때(추가 체력·피해 감소)
    if (ai.cds.R <= 0 && d <= K.R.range + K.R.core) {
      const land = V.copy(p.pos), around = foes.filter(u => V.dist(u.pos, land) <= K.R.r + u.r).length;
      if (around >= 2 || (pHp < 0.4 && ai.diffKey !== 'easy') || (hpR < 0.35 && gap < 2)) {
        BihyungCore.rStart(ai, land);
        ai.startChannel(K.R.leap, { onTick: (dt, a) => { if (BihyungCore.rStep(ai, dt)) a.stop = true; }, onEnd: () => { if (ai.bhR) BihyungCore.rStep(ai, 99); ai.lift = 0; }, tele: { kind: 'circle', pos: land, r: K.R.r } });
        return true;
      }
    }
    // W: 사거리 7m — 상대 예측 위치에, 가까우면 내 쪽까지 덮어 보호막도 (도발·속박 중이면 확정)
    if (ai.cds.W <= 0 && d <= K.W.range + 0.5) {
      const pred = easy || taunted || p.root > 0 || p.stun > 0 ? V.copy(p.pos) : ai.predict(p, K.W.delay * 0.6);
      const pt = gap < 2 ? V.lerp(ai.pos, pred, 0.6) : pred;   // 붙어 있으면 둘 다 범위 안
      ai.startCast(K.W.windup, () => { BihyungCore.wCast(ai, Geo.pushOut(pt, 0.2)); Sfx.play('throw'); }, { kind: 'circle', pos: pt, r: K.W.r, color: ai.motif.color });
      return true;
    }
    // E: 2.5~5.3m 안 — 돌진해 처음 부딪힌 적 도발 (W 둔화 뒤면 거의 확정)
    if (ai.cds.E <= 0 && gap >= K.E.min - 0.8 && gap <= K.E.max - 0.3 && !(p.unstoppable > 0) && (!easy || rnd() < 0.4)) {
      const E = K.E, dir = ai.aimDir(p, E.windup, E.speed); ai.cds.E = ai.pick(E.cd, 'E');
      ai.startCast(E.windup, () => {
        const st = BihyungCore.eStart(ai, dir, d + 0.6); Sfx.play('dash');
        ai.startChannel(1, { onTick: (dt, a) => { if (BihyungCore.eStep(ai, st, dt)) a.stop = true; } });
      }, { kind: 'line', dir, len: E.max, width: E.width });
      return true;
    }
    // 풀스윙: 도발·속박 중이거나 뒤에 벽(벽꿍) · 붙어 있을 때
    if (ai.cds.D <= 0 && gap <= K.D.range + 0.2) {
      const dir = V.norm(V.sub(p.pos, ai.pos));
      if ((!easy && (taunted || p.root > 0)) || this.wallBehind(p, dir, K.D.knock) || (hpR < 0.4 && !easy)) {
        ai.cds.D = K.D.cd[0]; BihyungCore.dAim(ai, dir);   // 쿨 고정
        ai.startCast(K.D.windup, () => { ai.facing = V.ang(dir); BihyungCore.dSwing(ai, V.norm(V.sub(p.pos, ai.pos))); }, { kind: 'cone', dir, len: K.D.range + ai.r, angle: K.D.angle });
        return true;
      }
    }
    // Q: 붙으면 바로 강화 평타
    if (ai.cds.Q <= 0 && !ai.bhQ && !ai.bhQ2 && gap <= ai.aaRange() + 0.4) { BihyungCore.qCast(ai); return false; }
    return false;
  },
  kite() {},   // 브루저: 평타 뒤 물러나지 않음
  move(ai, p, d) { if (d > ai.aaRange() + p.r + ai.r - 0.1) ai.moveTarget = Geo.pushOut(V.copy(p.pos), ai.r); else ai.moveTarget = null; },
  draw(ai, ctx) { if (Vision.visible(Game.player, ai) || ai.team === myTeam()) BihyungCore.draw(ai, ctx); },
};

// ============================== AI 클로에 (결투·팀 대전 상대·아군) ==============================
// 니나·스킬 효과는 플레이어와 같은 ChloeCore(3_z_rangedy_chloe.js). 여기서는 「언제 쓰나」만 정함
// 판단 근거: 네브짱 「클로에 랭킹 1위 랭크 꿀팁 강의」(docs/er_notes_playables.md 10장)
//   · 평타 원딜: 기본은 평타 + 니나가 같은 대상을 침(Q는 니나 주변에 적이 있을 때)
//   · Q → E2 → Q: 니나–클로에–적 일렬이면 E2(적중 시 Q 초기화) → Q 한 번 더
//   · W1(회전) → 다가오면 W2(던지기 → 니나 내려찍기 에어본) · 도주 = E1 후 걷기(쫓아오는 적에게 E2)
//   · R 생명 공유: 위기(체력 낮음)·니나가 죽기 직전 — 광역 피해를 둘 다 맞으면 손해라 몰려 있을 땐 아낌 · 근접 상대가 붙으면 마름쇠
Kits.chloe = {
  init(ai) {
    const K = ai.kitCfg;
    ai.ch = { K, color: ai.motif.color, S: NullStats,
      L: k => ai.L(k), hit: (u, amt, k, o) => ai.hitP(u, amt * ai.diff.dmgMul, Object.assign({ name: (K[k] && K[k].name) || k }, o)),
      foes: () => Game.units.filter(u => u.team !== ai.team && u.team !== 2 && !u.dead && u.kind !== 'ward' && !(u.untargetable > 0)),
      level: () => ai.level || 1, pen: () => ai.pen || 0,
      cdStart: k => { ai.cds[k] = ai.pick(K[k].cd, k); }, cdMul: (k, m) => { ai.cds[k] *= m; }, cdSet: (k, v) => { ai.cds[k] = v; },
      noAA: t => { ai.noAA = Math.max(ai.noAA, t); }, target: () => this.target(ai) };
    ChloeCore.attach(ai);
  },
  // 니나가 칠 대상: 지금 싸우는 상대(보이고 가까우면)
  target(ai) { const f = ai.foe; return f && !f.dead && !(f.untargetable > 0) && Vision.visible(ai, f) && V.dist(ai.pos, f.pos) < 8 ? f : null; },
  onAAHit(ai, u) { ChloeCore.onAAHit(ai, u); },
  update(ai, dt) { ChloeCore.update(ai, dt); },
  think(ai, p, d) {
    const K = ai.kitCfg, n = ai.nina, up = ChloeCore.up(ai), hard = ai.diffKey === 'hard', hpR = ai.hp / ai.maxHp;
    // W2: 회전 중 상대가 사거리 안 → 예측 지점에 던지기 (자수 + 니나 내려찍기까지의 시간만큼 앞을 봄)
    if (ai.spin) {
      if (Game.time - ai.spin.t0 >= 0.35 && d <= K.W.range + 0.5) { const lead = K.W.throwTime + (up ? K.W.slamDelay * 0.6 : 0); ChloeCore.w2(ai, ai.predict(p, lead)); }
      return false;
    }
    // E2: 니나가 클로에에게 날아오는 길에 상대가 있으면 → 적중 시 Q 초기화
    if (ChloeCore.e2Ready(ai)) {
      const E = K.E, dist = Math.min(E.ninaDist, V.dist(n.pos, ai.pos)), end = V.add(n.pos, V.mul(V.norm(V.sub(ai.pos, n.pos)), dist));
      if (Geo.segDist(p.pos, n.pos, end) <= p.r + E.ninaWidth / 2 + 0.15 || Game.time > ai.eRe.until - 0.3) { ChloeCore.e2(ai); return false; }
    }
    // Q: 니나 주변에 상대 (클로에 행동은 막지 않음)
    if (up && ai.cds.Q <= 0 && V.dist(n.pos, p.pos) <= K.Q.radius + p.r - 0.15) { ChloeCore.q(ai); return false; }
    // R 생명 공유: 위기이거나 니나가 곧 죽을 때 (근거리 교전 중)
    if (up && ai.cds.R <= 0 && d < 6.5 && (hpR < 0.45 || n.hp / n.maxHp < 0.3 || (hard && p.hp / p.maxHp < 0.45 && d < 5))) { ChloeCore.r(ai); return false; }
    // W1 회전: 상대가 던지기 사거리 안
    if (ai.cds.W <= 0 && d < K.W.range - 0.3) { ChloeCore.w1(ai); return false; }
    // D 마름쇠: 근접 상대가 다가오면 앞길에 / 아니면 가끔 발밑에
    if (ai.cds.D <= 0 && d < K.D.range + 0.5 && (TeamAI.isMelee(p) ? d < 4.5 : rnd() < 0.35)) {
      const D = K.D, at = ai.predict(p, D.windup + 0.4);
      ai.startCast(D.windup, () => ChloeCore.d(ai, at), { kind: 'circle', pos: at, r: D.r });
      return true;
    }
    // E1 진입: 상대 체력이 낮고 평타 사거리 조금 밖이면 붙어서 마무리 (니나가 뒤에 있으면 E2가 따라옴)
    if (ai.cds.E <= 0 && !ai.eRe && up && hpR > 0.5 && p.hp / p.maxHp < 0.35 && d > ai.aaRange() && d < ai.aaRange() + K.E.dist - 0.5) {
      this.dashE(ai, V.norm(V.sub(p.pos, ai.pos))); return true;
    }
    return false;
  },
  dashE(ai, dir) {
    const E = ai.kitCfg.E, from = V.copy(ai.pos); ai.dashTo(dir, E.dist, E.time, true, E.name);
    ChloeCore.e1Hits(ai, from, ai.act && ai.act.to ? ai.act.to : from); ai.eRe = { t0: Game.time, until: Game.time + E.window }; Sfx.play('blink');
  },
  // 위급: E1로 빠지기 (쫓아오면 E2로 니나가 날아와 경로의 적을 침)
  escape(ai, p, dir) {
    if (ai.cds.E <= 0 && !ai.eRe) { this.dashE(ai, dir); return true; }
    if (ChloeCore.e2Ready(ai)) { ChloeCore.e2(ai); return false; }
    return false;
  },
  draw(ai, ctx) { if (Vision.visible(Game.player, ai) || ai.team === myTeam()) ChloeCore.draw(ai, ctx); },
};

// ============================== AI 쇼이치 (암살자 · 결투·팀 대전 상대·아군) ==============================
// 스킬 효과는 플레이어와 같은 ShoichiCore(3_z_rangedy_shoichi.js). 여기서는 「언제 쓰나」만 정함 — 근거: 나무위키 콤보·평가 + 유저 플레이(농루트 가이드·네브짱 랭크) (docs/er_notes_playables.md 15장)
//   · W는 단검을 줍는 기술: 적을 긁으며 지나가는 단검 → 적 근처(투척 5m) 단검 → 그다음에 적 몸으로 · 단검을 주우면 W 쿨 초기화라 연쇄
//   · 진입은 E(표식·둔화 + 대상 뒤 단검) → W, 붙으면 R(단검 4개) → 단검마다 W · 강화 Q는 미리 장전해 원하는 방향에 단검
//   · 혼자 먼저 궁 금지: R은 대상이 2.5m 안이고 내 체력이 충분하거나 상대가 빈사일 때
//   · 쉬움: 단검 연쇄를 거의 안 함(적에게 W만 · 단검은 걸어서) · R 가끔
Kits.shoichi = {
  init(ai) {
    const K = ai.kitCfg;
    ai.sh = { K, color: ai.motif.color, S: NullStats, L: k => ai.L(k), level: () => ai.level || 1,
      hit: (u, amt, k, o) => ai.hitP(u, amt * ai.diff.dmgMul, Object.assign({ name: (K[k] && K[k].name) || k }, o)),
      foes: () => Game.units.filter(u => u.team !== ai.team && u.team !== 2 && !u.dead && u.kind !== 'ward' && !(u.untargetable > 0)),
      cdStart: k => { ai.cds[k] = ai.pick(K[k].cd, k); }, cdSet: (k, v) => { ai.cds[k] = v; }, cdGet: k => ai.cds[k] || 0, shot: o => ai.shoot(o) };
    ShoichiCore.attach(ai);
  },
  fireAA(ai, p) { ai.aaLand(p); return true; },   // 근접 평타
  onAAHit(ai, u) { ShoichiCore.aaHit(ai, u); },
  update(ai, dt) { ShoichiCore.update(ai, dt); },
  // W 대상 고르기: 적을 긁는 단검 > 적 근처 단검(투척) > 적
  wPick(ai, p, easy) {
    const K = ai.kitCfg, W = K.W, ds = ai.shDags.filter(d => ShoichiCore.landed(d) && V.dist(d.pos, ai.pos) <= W.range);
    let best = null, bs = 0;
    if (!easy) for (const d of ds) {
      const through = Geo.segDist(p.pos, ai.pos, d.pos) <= W.width / 2 + p.r, near = V.dist(d.pos, p.pos) <= K.dagger.throwR;
      const s = (through ? 3 : 0) + (near ? 1 : 0) - V.dist(d.pos, p.pos) * 0.05;
      if (s > bs) { bs = s; best = d; }
    }
    if (best && bs >= 1) return { dagger: best };
    return null;
  },
  think(ai, p, d) {
    const K = ai.kitCfg, hpR = ai.hp / ai.maxHp, pHp = p.hp / p.maxHp, gap = d - ai.r - p.r, easy = ai.diffKey === 'easy';
    // W: 단검 연쇄(적을 긁는 단검 우선) → 아니면 적에게 진입(이미 붙어 있으면 아낌)
    if (ai.cds.W <= 0) {
      const to = this.wPick(ai, p, easy);
      if (to) { ShoichiCore.wGo(ai, to); return false; }
      if (gap <= K.W.range - 0.2 && gap > 1.6 && (hpR > 0.35 || pHp < 0.3) && Vision.visible(ai, p)) { ShoichiCore.wGo(ai, { unit: p }); return false; }
    }
    // R: 붙어 있고(2.5m) 버틸 체력이 있거나 상대 빈사 — 단검 4개를 깔아 W 연쇄
    if (ai.cds.R <= 0 && gap <= K.R.r - 0.4 && (hpR > 0.45 || pHp < 0.35) && (!easy || rnd() < 0.35)) {
      ai.cds.R = ai.pick(K.R.cd, 'R'); FX.text(ai.pos, K.R.name, ai.motif.color, 14, { bold: true });
      ai.startCast(K.R.windup, () => { ShoichiCore.rFire(ai); Sfx.play('ult'); }, { kind: 'circle', pos: V.copy(ai.pos), r: K.R.r });
      return true;
    }
    // E: 5.8m 직선 — 표식·둔화 + 대상 뒤 단검 (너무 붙으면 뒤로 빠지는 동작이 손해라 1.2m 밖)
    if (ai.cds.E <= 0 && gap <= K.E.range - 0.4 && gap >= 1.2) {
      const E = K.E, dir = ai.aimDir(p, E.windup, E.speed);
      ai.startCast(E.windup, () => {
        ShoichiCore.eFire(ai, dir); Sfx.play('throw');
        const back = V.mul(dir, -1), to = V.add(ai.pos, V.mul(back, Geo.clampDash(ai.pos, back, E.back, ai.r)));
        ai.act = { type: 'dash', t: 0, dur: E.backTime, from: V.copy(ai.pos), to };
      }, { kind: 'line', dir, len: E.range, width: E.width });
      return true;
    }
    // Q: 앞 찌르기(강화면 부채꼴 + 정면 단검)
    const qLen = ai.shQ2 > 0 ? K.Q.len2 : K.Q.len;
    if (ai.cds.Q <= 0 && gap <= qLen - 0.2) {
      const dir = V.norm(V.sub(p.pos, ai.pos));
      ai.startCast(K.Q.windup, () => { ShoichiCore.qCast(ai, V.norm(V.sub(p.pos, ai.pos))); }, ai.shQ2 > 0 ? { kind: 'cone', dir, len: K.Q.len2 + ai.r, angle: K.Q.angle2 } : { kind: 'line', dir, len: K.Q.len + ai.r, width: K.Q.width });
      return true;
    }
    // D 망토와 단검: 멀면 1차(이속)로 추격 · 2.5m 안이면 2차(대상 뒤로)
    if (ai.cds.D <= 0 && !easy) {
      if (!ai.shD && gap > 3 && gap < 8) { ai.shD = { t: K.D.window }; ai.addMsBuff(lv(K.D.ms, ai.L('D')), K.D.msDur, false, 'shD'); return false; }
      if (ai.shD && gap <= K.D.range) { ShoichiCore.dHit(ai, p); ai.shD = null; ai.cds.D = ai.pick(K.D.cd, 'D'); return false; }
    }
    return false;
  },
  kite() {},   // 암살자: 평타 뒤 물러나지 않음
  // 이동: W가 없으면 적 근처(투척 거리) 단검을 걸어서 주움 · 아니면 적에게 붙음
  move(ai, p, d) {
    const K = ai.kitCfg;
    if (ai.cds.W > 0) {
      const dg = ai.shDags.filter(x => ShoichiCore.landed(x) && V.dist(x.pos, ai.pos) <= 4.5 && V.dist(x.pos, p.pos) <= K.dagger.throwR).sort((a, b) => V.dist(a.pos, ai.pos) - V.dist(b.pos, ai.pos))[0];
      if (dg) { ai.moveTarget = V.copy(dg.pos); return; }
    }
    if (d > ai.aaRange() + p.r + ai.r - 0.1) ai.moveTarget = Geo.pushOut(V.copy(p.pos), ai.r); else ai.moveTarget = null;
  },
  draw(ai, ctx) { ShoichiCore.draw(ai, ctx, ai.team === myTeam()); },
};

// ============================== 씬 구성 도우미 ==============================
const Scene = {
  // 플레이어 실험체: 캐시(기본) / 다니엘 / 키트 실험체(아야·리오·나딘·카티야·클로에·알론소) — 콤보 트레이너는 그 콤보의 실험체
  player(x, y) {
    const ch = Game.modeId === 'combo' ? ((Game.opts && Game.opts.combo && Game.opts.combo.char) || 'cathy') : (Settings.character || 'cathy');
    const p = ch === 'daniel' ? new DanielPlayer(x, y) : PKits[ch] && CONFIG.rangedKits[ch] ? new RangedPlayer(x, y, ch) : new Cathy(x, y);
    Game.player = p; Game.units.push(p); return p;
  },
  dummy(x, y, o) {
    const u = new Unit({ team: 1, x, y, r: 0.55, hp: o.hp, def: o.def, ms: o.wander ? 1.2 : 0, color: '#8d96a8', name: '허수아비', kind: 'dummy', infinite: o.infinite, respawn: o.respawn !== false, brain: o.wander ? AI.wander : null });
    Game.units.push(u); return u;
  },
  // 야생동물: 중립(팀 2) — 공격하지 않고 배회, 처치되면 재생성
  animal(x, y, stage) {
    const W = CONFIG.wildlife, st = stage || Game.buildId;
    const u = new Unit({ team: 2, x, y, r: W.r, hp: W.hp[st] || W.hp.mid, def: W.def[st] || W.def.mid, ms: W.ms, color: W.color, name: W.name, kind: 'animal', respawn: true, brain: AI.wander });
    u.respawnDelay = W.respawn; Game.units.push(u); return u;
  },
};
const sideBar = (label, ratio, val, color) => `<div class="sbar"><i style="width:${clamp(ratio * 100, 0, 100)}%;background:${color}55;border-right:2px solid ${color}"></i><em>${esc(label)} · ${val}</em></div>`;
const kv = (k, v) => `<div class="kv"><span>${k}</span><b>${v}</b></div>`;
const pct = (a, b) => b > 0 ? Math.round(a / b * 100) + '%' : '-';

const Modes = {};

// ---------- 1. 허수아비 모드 ----------
Modes.dummy = {
  name: '허수아비 모드',
  start(o) {
    this.title = this.name;
    const layouts = {
      default: [[16.5, 9], [18.2, 9.6], [17, 7.4], [18.6, 7.8], [17.6, 11]],
      pair: [[15, 9], [16.6, 9]],
      wall: [[20.5, 9]],
    };
    Scene.player(8, 9);
    const pos = layouts[o.layout || 'default'], n = clamp(o.count | 0, 1, pos.length);
    for (let i = 0; i < n; i++) Scene.dummy(pos[i][0], pos[i][1], o);
  },
  update() {},
  side() {
    const St = Stats, t = Math.max(0.001, St.t), tot = St.dealtTotal || 1;
    const rows = Object.entries(St.dmgBy).sort((a, b) => b[1] - a[1]);
    const dm = Game.units.filter(u => u.kind === 'dummy');
    return `<h4>🎯 허수아비 통계</h4>${kv('총 피해', Math.round(St.dealtTotal))}${kv('DPS (전체)', fmt(St.dealtTotal / t))}${kv('DPS (최근 5초)', fmt(St.recentDps(5)))}
      ${kv('치명적 외상', St.criticals)}${kv('처치', St.kills)}${kv('강화 평타', St.enhAA)}
      <h5>스킬별 피해 비율</h5>${rows.map(([k, v]) => sideBar(SRC_LABEL[k] || k, v / tot, `${Math.round(v / tot * 100)}%`, SRC_COLOR[k] || '#999')).join('') || '<div class="kv"><span>아직 피해 없음</span></div>'}
      <h5>허수아비</h5>${dm.map((u, i) => kv('#' + (i + 1), u.dead ? '재생성 중' : u.infinite ? '∞' : `${Math.round(u.hp)} / ${u.maxHp}`)).join('')}`;
  },
  result() {
    const dps = Stats.dealtTotal / Math.max(1, Stats.t);
    return { key: 'dummy', score: Math.round(dps), scoreLabel: '평균 DPS', modeRatio: clamp(dps / Game.player.build.refDps, 0, 1), modeLabel: 'DPS 목표 대비', weights: { acc: 25, waste: 30, mistake: 20, mode: 25 } };
  },
};

// ---------- 2. 콤보 트레이너 ----------
Modes.combo = {
  name: '콤보 트레이너',
  parse(steps) {
    return steps.map(tok => {
      let s = String(tok).trim().toUpperCase(), gap = null, optional = false;
      const m = s.match(/~([\d.]+)$/); if (m) { gap = parseFloat(m[1]); s = s.slice(0, m.index); }
      if (s.endsWith('?')) { optional = true; s = s.slice(0, -1); }
      return { alts: s.split('|').map(x => x.trim()).filter(Boolean), optional, gap };
    });
  },
  start(o) {
    this.combo = o.combo; this.diff = o.diff || 'intro'; this.title = '콤보: ' + o.combo.name;
    this.steps = this.parse(o.combo.steps); this.state = 'idle'; this.idx = 0; this.marks = []; this.msg = null; this.resetT = 0; this.flags = {};
    this.demo = null; this.ideal = (Store.get('comboIdeal', {}))[o.combo.id + ':' + (o.combo.weapon || Settings.weapon)] || null;   // 시범으로 잰 모범 간격(초) — 콤보·무기별 저장
    const pl = Scene.player(10, 9);
    if (o.combo.weapon && pl.weapon !== o.combo.weapon) { pl.weapon = o.combo.weapon; FX.toast(`이 콤보는 ${CONFIG.basicAttack[o.combo.weapon].label} 기준입니다 (무기 자동 변경)`, CONFIG.theme.gold); }
    const C = CONFIG.modes.combo, pos = o.combo.setup === 'pair' ? [[14.6, 9], [16.2, 9]] : [[14.6, 9]];
    this.dummies = pos.map(([x, y]) => Scene.dummy(x, y, { hp: C.dummyHp, def: C.dummyDef, infinite: true }));
    Events.on('action', a => this.onAction(a));
    Events.on('eDouble', () => { if (this.state === 'run') this.flags.eDouble = true; });
  },
  limit(st) { const base = CONFIG.modes.combo.gap[this.diff]; if (!isFinite(base)) return Infinity; return st && st.gap ? st.gap : base; },
  onAction(a) {
    if (this.state === 'result') return;
    for (const nk of ['D1', 'D2', 'F']) if (a.k === nk && !this.steps.some(s => s.alts.includes(nk))) return;   // 콤보에 없는 보조 입력은 무시
    const now = Game.time, label = k => ({ AA: '평타', D1: 'D(1차)' }[k] || k);
    if (this.state === 'idle') {
      if (this.steps[0].alts.includes(a.k)) {
        this.state = 'run'; this.idx = 1; this.marks = [{ ok: true, gap: null }]; this.last = now; this.prevK = a.k; this.flags = {};
        Stats.comboAtt++; Sfx.play('click');
        if (this.idx >= this.steps.length) this.success();
      } else if (a.k !== 'AA') FX.toast(`콤보 시작 입력: ${this.steps[0].alts.join(' / ')}`, '#8a93a6');
      return;
    }
    let i = this.idx;
    while (i < this.steps.length && this.steps[i].optional && !this.steps[i].alts.includes(a.k)) { this.marks[i] = { skip: true }; i++; }
    const st = this.steps[i];
    if (!st || !st.alts.includes(a.k)) { this.fail(`${label(a.k)} 입력 (기대: ${st ? st.alts.map(label).join('/') : '-'})`); return; }
    const gap = now - this.last, lim = this.limit(st);
    if (gap > lim) { this.fail(`시간 초과 (${Math.round(gap * 1000)}ms > ${Math.round(lim * 1000)}ms)`); return; }
    this.marks[i] = { ok: true, gap }; this.idx = i + 1; this.last = now; this.prevK = a.k;
    if (this.steps.slice(this.idx).every(s => s.optional)) this.success();
  },
  success() {
    this.state = 'result'; this.resetT = CONFIG.modes.combo.resetDelay;
    if (this.demo) { this.endDemo(true); return; }
    if (this.combo.require === 'eDouble' && !this.flags.eDouble) { this.resultOk = false; this.msg = '실패: 2인 수쳐(관통 기절)가 발동하지 않음'; Stats.mistake('콤보 실패 - 2인 수쳐 미발동'); Sfx.play('fail'); return; }
    this.resultOk = true; Stats.comboOk++; this.msg = '콤보 성공!'; Sfx.play('combo');

    this.marks[this.idx] = { fail: true }; Sfx.play('fail'); Stats.mistake('콤보 실패 - ' + why.split(' (')[0]);
  },
  update(dt) {
    if (this.demo) this.driveDemo(dt);
    if (this.state === 'run' && Game.time - this.last > this.limit(this.steps[this.idx])) this.fail('시간 초과');
    if (this.state === 'result' && (this.resetT -= dt) <= 0) this.reset();
  },
  // ---------- 시범 보기(G): 게임이 직접 콤보를 가장 빠른 타이밍으로 실행 → 단계별 모범 간격을 재서 내 입력과 비교 ----------
  //   실제 판정과 같은 시뮬레이션 그대로(가짜 기준 아님). 평타 후딜은 다음 스킬로 끊고, 스킬은 후딜에 들어가면 바로 다음 입력
  //   시범 중엔 입력을 막고(Game.demoLock), 통계는 시범 전 상태로 되돌림
  startDemo() {
    if (this.demo) return;
    this.reset();
    const snap = {}; for (const k of Object.keys(Stats)) { const v = Stats[k]; if (typeof v === 'function') continue; snap[k] = v instanceof Set ? new Set(v) : JSON.parse(JSON.stringify(v === undefined ? null : v)); }
    this.demo = { step: 0, wait: 0, issuedAt: -1, snap, t: 0 }; Game.demoLock = true; Input.reset();
    this.msg = '▶ 시범 중 — 모범 타이밍을 재는 중'; this.resultOk = true;
  },
  driveDemo(dt) {

    if (D.t > 20) { this.endDemo(false, '시간 초과'); return; }
    if (this.state === 'result') return;
    const i = this.state === 'idle' ? 0 : this.idx, st = this.steps[i]; if (!st) return;
    if (D.issuedAt === i && D.wait > 0) { D.wait -= dt; return; }   // 같은 단계 재입력 대기
    const k = st.alts[0], skill = k === 'AA' ? null : (k === 'D1' || k === 'D2') ? 'D' : k;
    if (k !== 'AA' && p.attackTarget) { p.attackTarget = null; p.attackMove = null; }   // 다음이 스킬이면 자동 평타가 끼어들지 않게
    const busy = p.cast && p.cast.phase !== 'recovery', aaBusy = p.aa.phase === 'windup';
    if (busy || aaBusy || !p.canAct()) return;
    if (skill && p.skills[skill] && p.skills[skill].cd > 0 && !(p.recastReady && p.recastReady(skill))) return;   // 재사용형(비형 Q2·카티야 D 등)은 쿨 잠금 중에도 재입력
    if (k === 'D1' && p.daggerReady > 0) return;

    Input.aiming = null; D.issuedAt = i; D.wait = k === 'AA' ? 1.2 : 0.35;
  },
  endDemo(ok, why) {
    const D = this.demo; this.demo = null; Game.demoLock = false;
    for (const [k, v] of Object.entries(D.snap)) Stats[k] = v;   // 통계 되돌림
    if (ok) {
      this.ideal = this.marks.map(mk => mk && mk.ok ? mk.gap : null);
      const all = Store.get('comboIdeal', {}); all[this.combo.id + ':' + (this.combo.weapon || Game.player.weapon)] = this.ideal; Store.set('comboIdeal', all);

    this.state = 'result'; this.resetT = CONFIG.modes.combo.resetDelay * 1.5;
  },
  reset() {
    this.state = 'idle'; this.idx = 0; this.marks = []; this.msg = null;
    const p = Game.player;

    if (p.ranged) { Object.assign(p, { asBuffs: [], noAA: 0, chans: [], pend: [], chase: null }); if (p.kit.reset) p.kit.reset(p); else if (p.kit.init) p.kit.init(p); }   // 키트 실험체: 스킬 상태 초기화
    if (p.charKey === 'daniel') Object.assign(p, { qShots: 0, qT: 0, shadowT: 0, mark: null, shadow: null, pendingQ: [], untargetable: 0, stealthT: 0 });
    for (const d of this.dummies) d.resetState();
  },
  drawScreen(ctx, L) {
    const n = this.steps.length, cw = n > 7 ? 56 : 70, gap = n > 7 ? 5 : 8, total = n * cw + (n - 1) * gap, x0 = L.W / 2 - total / 2, y = 14;
    Draw.text(ctx, this.combo.name, L.W / 2, y + 2, { size: 15, bold: true, align: 'center' });
    this.steps.forEach((st, i) => {
      const x = x0 + i * (cw + gap), m = this.marks[i];
      let bg = '#1b2030', bd = '#2a3140';
      if (m && m.ok) { bg = '#163a37'; bd = CONFIG.theme.accent2; } else if (m && m.fail) { bg = '#3a1620'; bd = CONFIG.theme.accent; }
      else if (m && m.skip) { bg = '#15181f'; } else if (this.state === 'run' && i === this.idx) bd = '#ffffff';
      Draw.rr(ctx, x, y + 14, cw, 34, 7); ctx.fillStyle = bg; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = bd; ctx.stroke();
      const lab = st.alts.map(k => ({ AA: '평타', D1: 'D1' }[k] || k)).join('/');
      Draw.text(ctx, st.optional ? `(${lab})` : lab, x + cw / 2, y + 36, { size: 14, bold: true, align: 'center', color: m && m.skip ? '#666' : '#fff' });
      const ig = this.ideal && this.ideal[i];
      if (m && m.ok && m.gap != null) {
        const d = ig != null ? m.gap - ig : null, col = d == null ? CONFIG.theme.accent2 : d <= 0.08 ? '#4fe08a' : d <= 0.2 ? '#ffb347' : '#ff6b6b';   // 모범보다 80ms 이내 초록 · 200ms 이내 주황 · 그 이상 빨강
        Draw.text(ctx, Math.round(m.gap * 1000) + 'ms' + (d != null && !this.demo ? ` (${d >= 0 ? '+' : ''}${Math.round(d * 1000)})` : ''), x + cw / 2, y + 62, { size: 11, align: 'center', color: col });
      }
      if (ig != null) Draw.text(ctx, '모범 ' + Math.round(ig * 1000), x + cw / 2, y + 75, { size: 10, align: 'center', color: '#8a93a6' });
    });
    const lim = CONFIG.modes.combo.gap[this.diff], dl = { intro: '입문', skilled: '숙련', master: '마스터' }[this.diff];
    Draw.text(ctx, `성공 ${Stats.comboOk} / 시도 ${Stats.comboAtt} (${pct(Stats.comboOk, Stats.comboAtt)}) · 난이도 ${dl}${isFinite(lim) ? ` (간격 ≤ ${lim}s)` : ''} · G 시범 보기`, L.W / 2, y + 94, { size: 12, align: 'center', color: '#8a93a6' });
    if (this.msg) Draw.text(ctx, this.msg, L.W / 2, y + 120, { size: 18, bold: true, align: 'center', color: this.resultOk ? CONFIG.theme.gold : CONFIG.theme.accent, stroke: true });
  },
  side() {
    return `<h4>🧩 콤보 가이드</h4><div style="line-height:1.6;color:#c9cfdb">${esc(this.combo.tip || '')}</div>
      <h5>현황</h5>${kv('성공 / 시도', `${Stats.comboOk} / ${Stats.comboAtt}`)}${kv('완성률', pct(Stats.comboOk, Stats.comboAtt))}${kv('강화 평타', Stats.enhAA)}
      <h5>팁</h5><div style="color:#8a93a6;line-height:1.5">우클릭으로 허수아비를 지정하면 평타가 나갑니다. 성공/실패 후 쿨타임이 자동 초기화됩니다.</div>`;
  },
  result() {
    return { key: `combo:${this.combo.id}:${this.diff}`, recTitle: `콤보 ${this.combo.name} (${this.diff})`, score: Stats.comboOk, scoreLabel: '콤보 성공 횟수',

Modes.dodge = {
  name: '회피 수련',
  start(o) {
    this.title = this.name; Scene.player(16, 9); Game.cdMul = CONFIG.modes.dodge.cdMul;
    this.lives = this.maxLives = o.lives || CONFIG.modes.dodge.lives; this.t = 0; this.spawnT = 1.2; this.hz = []; this.k0 = o.startK || 0;
    this.turrets = [{ x: 1, y: 1 }, { x: 31, y: 1 }, { x: 1, y: 17 }, { x: 31, y: 17 }, { x: 16, y: 0.6 }, { x: 16, y: 17.4 }, { x: 0.6, y: 9 }, { x: 31.4, y: 9 }];
  },
  level() { return 1 + this.k0 + this.t / 25; },
  update(dt) {
    const p = Game.player, L = this.level(); this.t += dt;
    if ((this.spawnT -= dt) <= 0) {
      const r = rnd();
      if (r < 0.45) this.spawnLine(L); else if (r < 0.75) this.spawnCircle(L); else this.spawnDelayed(L);
      if (L > 2.2 && rnd() < 0.25) [-0.25, 0.25].forEach(o => this.spawnLine(L, o));
      this.spawnT = Math.max(0.28, 1.45 / L);
    }
    for (const h of this.hz) this.updH(h, dt, p);
    this.hz = this.hz.filter(h => !h.dead);
  },
  spawnLine(L, off = 0) {
    const p = Game.player, tu = this.turrets[Math.floor(rnd() * this.turrets.length)];
    const tgt = V.add(p.pos, V.mul(p.vel, Math.min(1, (L - 1) * 0.5) * 0.4));
    this.hz.push({ type: 'line', from: V.copy(tu), dir: V.fromAng(V.ang(V.sub(tgt, tu)) + off), tele: Math.max(0.35, 0.75 / Math.sqrt(L)), t: 0, speed: Math.min(20, 9 * Math.sqrt(L)), width: 0.7, pos: null, traveled: 0 });
  },
  spawnCircle(L) {
    const c = V.add(Game.player.pos, V.mul(V.fromAng(rnd() * 6.28), rnd() * 1.4));
    this.hz.push({ type: 'circle', c, r: rand(1.5, 2.3), tele: Math.max(CONFIG.modes.dodge.circleTeleMin, CONFIG.modes.dodge.circleTele / Math.pow(L, 0.45)), t: 0 });
  },
  spawnDelayed(L) { this.hz.push({ type: 'delayed', c: V.copy(Game.player.pos), follow: 0.5, r: 1.8, tele: Math.max(0.6, 1.3 / Math.pow(L, 0.35)), t: 0 }); },
  updH(h, dt, p) {
    h.t += dt;
    if (h.type === 'line') {
      if (h.t < h.tele) return;
      if (!h.pos) h.pos = V.copy(h.from);
      const prev = V.copy(h.pos), step = h.speed * dt; h.pos = V.add(h.pos, V.mul(h.dir, step)); h.traveled += step;
      if (Geo.segDist(p.pos, prev, h.pos) <= p.r + h.width / 2 && this.hitPlayer()) h.dead = true;
      if (h.traveled > 45) h.dead = true;
    } else if (h.type === 'circle') {
      if (h.t >= h.tele) { if (V.dist(p.pos, h.c) <= h.r + p.r * 0.5) this.hitPlayer(); FX.ring(h.c, h.r * 0.6, h.r, '#b56cff', 0.3, 0.15); h.dead = true; }
    } else {
      if (h.t < h.follow) h.c = V.copy(p.pos);
      if (h.t >= h.follow + h.tele) { if (V.dist(p.pos, h.c) <= h.r + p.r * 0.5) this.hitPlayer(); FX.burst(h.c, '#ff7b3b', 18, 6); FX.ring(h.c, 0.3, h.r, '#ff7b3b', 0.3, 0.15); h.dead = true; }
    }
  },
  hitPlayer() {
    const p = Game.player; if (p.invuln > 0) return false;
    p.invuln = 0.8; p.flash = 0.2; this.lives--; Stats.playerHits++; Stats.takenTotal += 1; Stats.hitPositions.push(V.copy(p.pos));
    Events.emit('playerHit'); FX.addShake(10); Sfx.play('hurt'); FX.text(p.pos, '피격!', '#ff5d5d', 17, { bold: true });
    if (this.lives <= 0) Game.finish('dead');
    return true;
  },
  drawWorld(ctx) {
    for (const t of this.turrets) { ctx.fillStyle = '#6b4bb3'; ctx.beginPath(); ctx.moveTo(t.x, t.y - 0.35); ctx.lineTo(t.x + 0.35, t.y); ctx.lineTo(t.x, t.y + 0.35); ctx.lineTo(t.x - 0.35, t.y); ctx.fill(); }
    for (const h of this.hz) {
      const k = clamp(h.t / (h.tele + (h.follow || 0)), 0, 1);
      if (h.type === 'line') {
        if (!h.pos) { ctx.save(); ctx.translate(h.from.x, h.from.y); ctx.rotate(V.ang(h.dir)); ctx.fillStyle = `rgba(255,70,90,${0.08 + 0.25 * k})`; ctx.fillRect(0, -h.width / 2, 45, h.width); ctx.restore(); }
        else { ctx.save(); ctx.translate(h.pos.x, h.pos.y); ctx.rotate(V.ang(h.dir)); ctx.fillStyle = '#ff5d7a'; ctx.shadowColor = '#ff5d7a'; ctx.shadowBlur = 12; ctx.fillRect(-0.7, -h.width / 2, 1.4, h.width); ctx.restore(); }
      } else {
        ctx.fillStyle = h.type === 'circle' ? `rgba(181,108,255,${0.1 + 0.2 * k})` : `rgba(255,123,59,${0.1 + 0.2 * k})`;
        ctx.beginPath(); ctx.arc(h.c.x, h.c.y, h.r, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = h.type === 'circle' ? '#b56cff' : '#ff7b3b'; ctx.lineWidth = 0.06;
        if (h.type === 'delayed') ctx.setLineDash([0.25, 0.15]);
        ctx.beginPath(); ctx.arc(h.c.x, h.c.y, h.type === 'circle' ? h.r * k : h.r * (1 - k * 0.85) + 0.05, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
      }
    }
  },
  drawScreen(ctx, L, oy = 0) {
    Draw.text(ctx, '♥'.repeat(Math.max(0, this.lives)) + '♡'.repeat(Math.max(0, this.maxLives - this.lives)), L.W / 2, 24 + oy, { size: 22, align: 'center', color: '#ff5d7a' });
    Draw.text(ctx, `생존 ${fmt(this.t, 1)}s · 단계 ${fmt(this.level(), 1)}`, L.W / 2, 48 + oy, { size: 14, bold: true, align: 'center', stroke: true });
  },
  side() { return `<h4>💨 회피 수련</h4>${kv('생존 시간', fmt(this.t, 1) + 's')}${kv('피격', Stats.playerHits)}${kv('난이도 단계', fmt(this.level(), 2))}<h5>패턴</h5><div style="color:#8a93a6;line-height:1.6">빨간 선: 직선 투사체<br>보라 원: 장판 (안쪽 원이 차면 폭발)<br>주황 점선: 지연 폭발 (0.5초 추적 후 고정)<br>Q·블링크·D로 회피 가능 (쿨 40% 감소)</div>`; },
  result() { return { key: 'dodge', score: Math.round(this.t * 10) / 10, scoreLabel: '생존 시간(초)', modeRatio: clamp(this.t / 90, 0, 1), modeLabel: '생존 시간', weights: { acc: 0, waste: 0, mistake: 10, mode: 90 }, heatmap: Stats.hitPositions.slice() }; },
};

  name: '1:1 결투',
  start(o) {

    const eb = o.enemyBuild && o.enemyBuild !== 'same' ? o.enemyBuild : Game.buildId;   // 상대 레벨: 캐시와 같게 / 직접 선택
    this.enemyStage = CONFIG.rangedAI.stages[eb] ? eb : 'mid';

    this.animals = !!o.animals; this.sphere = SPHERE_KIND(o.sphere);

    const sp = Game.map.spawns;

    this.enemy = new RangedDuelist(sp.e.x, sp.e.y, this.diff, this.motifKey, this.enemyStage); Game.units.push(this.enemy);
    if (this.animals) for (const a of Game.map.animals) Scene.animal(a.x, a.y, this.enemyStage);   // 야생동물(2인 수쳐 응용)

      if (this.enemy.dead && Game.player.dead) {   // 같은 순간 둘 다 폭사 → 남은 체력 비율로 판정

    const sum = { round: this.round, winner: w, time: Game.time - this.roundStart, dealt: St.dealtTotal - s0.dealt, taken: St.takenTotal - s0.taken, casts, hits,

      const lines = [

        ...s.mistakes.map(([k, v]) => `⚠ ${k} ×${v}`),
      ];
      lines.forEach((t, i) => Draw.text(ctx, t, L.W / 2, y + 70 + i * 24, { size: 13, align: 'center', color: i > 2 ? '#ffb347' : '#e6e9ef' }));
      Draw.text(ctx, `다음 라운드까지 ${Math.ceil(this.inter.t)}초`, L.W / 2, y + h - 16, { size: 12, align: 'center', color: '#8a93a6' });
