// ============================== 화면 층 (렌더러 공통) ==============================
// 월드 위치는 Renderer.toScreen으로 화면 좌표로 바꿔서 그림 — 2D·3D 렌더러가 같이 사용
const ScreenLayer = {
  draw(ctx, L) {
    if (Game.state === 'menu') return;
    this.drawOverheads(ctx);
    this.drawTexts(ctx);
    if (Game.mode && Game.mode.drawScreen) Game.mode.drawScreen(ctx, L, 0);
    if (Replay.active && !document.getElementById('replay-bar')) Draw.text(ctx, Replay.label(), L.W / 2, 64, { size: 14, bold: true, align: 'center', color: '#9fd8ff', stroke: true });   // 타임라인이 없을 때만
    HUD.draw(ctx, L);
    this.drawTopInfo(ctx, L);
    this.drawToasts(ctx, L);
    if (Input.locked) {   // 마우스 잠금 중엔 OS 커서가 숨겨지므로 직접 그림
      const s = Input.screen; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(s.x - 9, s.y); ctx.lineTo(s.x - 3, s.y); ctx.moveTo(s.x + 3, s.y); ctx.lineTo(s.x + 9, s.y); ctx.moveTo(s.x, s.y - 9); ctx.lineTo(s.x, s.y - 3); ctx.moveTo(s.x, s.y + 3); ctx.lineTo(s.x, s.y + 9); ctx.stroke();
    }
    if (Input.amove) { Draw.circle(ctx, Input.screen.x, Input.screen.y, 10); ctx.strokeStyle = '#ffb347'; ctx.lineWidth = 2; ctx.stroke(); Draw.text(ctx, 'A', Input.screen.x + 13, Input.screen.y - 10, { size: 13, bold: true, color: '#ffb347' }); }
  },
  // 머리 위 체력바/외상 중첩/상태
  drawOverheads(ctx) {
    for (const u of Game.units) {
      if (u.dead || u.kind === 'ward' || (u.team !== myTeam() && !Vision.visible(Game.player, u))) continue;
      const o = Renderer.overhead(u), s = { x: o.x }, R = u.r * Renderer.pxPerMeter(u.pos), bw = clamp(R * 2.6, 44, 110), bh = 6, x = o.x - bw / 2, y = o.top;
      ctx.fillStyle = 'rgba(0,0,0,.65)'; ctx.fillRect(x - 1, y - 1, bw + 2, bh + 2);
      const total = Math.max(u.maxHp, u.hp + u.shield);
      ctx.fillStyle = u.team === myTeam() ? '#3fd07a' : '#e5484d'; ctx.fillRect(x, y, bw * Math.max(0, u.hp) / total, bh);
      if (u.shield > 0) { ctx.fillStyle = '#e9eef7'; ctx.fillRect(x + bw * Math.max(0, u.hp) / total, y, bw * u.shield / total, bh); }
      if (u.healRed > 0) { ctx.strokeStyle = '#ff3b5c'; ctx.lineWidth = 1; ctx.strokeRect(x - 1, y - 1, bw + 2, bh + 2); }
      Draw.text(ctx, u.kind === 'player' ? `${u.name || '캐시'} Lv${u.build.level}` : u.name + (u.infinite ? ' ∞' : ''), s.x, y - 7, { size: 11, align: 'center', color: '#c9cfdb', stroke: true });
      if (u.team !== myTeam()) {
        if (u.crit > 0) {
          Draw.rr(ctx, s.x - 46, y - 33, 92, 17, 8); ctx.fillStyle = 'rgba(255,59,92,.9)'; ctx.fill();
          Draw.text(ctx, `치명적 외상 ${fmt(u.crit, 1)}`, s.x, y - 24.5, { size: 11, bold: true, align: 'center', color: '#fff' });
        } else if (u.trauma > 0) {
          for (let i = 0; i < CONFIG.passive.stacks; i++) { Draw.circle(ctx, s.x - 14 + i * 14, y - 24, 5); ctx.fillStyle = i < u.trauma ? '#ff3b5c' : 'rgba(255,255,255,.15)'; ctx.fill(); ctx.strokeStyle = '#000'; ctx.lineWidth = 1; ctx.stroke(); }
          ctx.strokeStyle = '#ff9fb2'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(s.x + 30, y - 24, 5, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * u.traumaT / CONFIG.passive.traumaDur); ctx.stroke();
        }
      }
      if (typeof Sphere !== 'undefined' && Sphere.active && u.boom != null && isHero(u)) {   // 금지구역 폭발 타이머
        const dr = Sphere.draining(u);
        Draw.text(ctx, `⏱${Math.ceil(u.boom)}`, x + bw + 5, y + 3, { size: dr ? 12 : 10, bold: true, color: dr ? (u.boom <= CONFIG.sphere.boom.warn ? '#ff3b3b' : '#ff8a8a') : '#ffd27a', stroke: true });
      }
      const st = [];
      if (u.stun > 0) st.push('기절 ' + fmt(u.stun, 1)); if (u.root > 0) st.push('속박 ' + fmt(u.root, 1));
      if (u.slows.length) st.push('둔화'); if (u.fear > 0) st.push('공포 ' + fmt(u.fear, 1)); if (u.unstoppable > 0) st.push('저지 불가');
      if (st.length) Draw.text(ctx, st.join(' · '), s.x, o.bottom, { size: 11, bold: true, align: 'center', color: CONFIG.theme.gold, stroke: true });
    }
  },
  drawTexts(ctx) {
    for (const t of FX.texts) {
      const s = Renderer.toScreen(t, 1.5); ctx.globalAlpha = clamp(t.life / t.max * 1.6, 0, 1);   // 3D: 머리 높이쯤에 뜸
      Draw.text(ctx, t.str, s.x, s.y, { size: t.size, bold: t.bold, align: 'center', color: t.color, stroke: true });
    }
    ctx.globalAlpha = 1;
  },
  drawTopInfo(ctx, L) {
    const p = Game.player, b = (p && p.build) || CONFIG.builds[Game.buildId];   // 장비 빌드면 그 라벨
    // 가운데 점수판(약 ±190px)과 겹치지 않도록 왼쪽 정보는 폭을 넘으면 말줄임
    const maxW = Math.max(160, L.W / 2 - 200);
    const fit = (s, size, bold) => { ctx.font = `${bold ? '700 ' : ''}${size}px ${FONT}`; if (ctx.measureText(s).width <= maxW) return s; while (s.length > 4 && ctx.measureText(s + '…').width > maxW) s = s.slice(0, -1); return s + '…'; };
    Draw.text(ctx, fit(`${Game.mode.title}  ·  ${fmt(Game.time, 1)}s`, 13, true), 12, 16, { size: 13, bold: true, stroke: true });
    Draw.text(ctx, fit(`${b.label} · ${p ? (CONFIG.basicAttack[p.weapon] || {}).label || p.weapon : ''} · x${fmt(Settings.gameSpeed, 1)} · FPS ${Math.round(fps)}`, 11), 12, 34, { size: 11, color: '#8a93a6', stroke: true });
    Draw.text(ctx, fit(`ESC 일시정지 · Tab 패널 · 시전: ${CAST_MODES[Settings.castMode]}${Object.keys(Settings.castModes).length ? ' (스킬별 설정 있음)' : ''}`, 11), 12, 50, { size: 11, color: '#8a93a6', stroke: true });
  },
  drawToasts(ctx, L) {
    FX.toasts.forEach((t, i) => { ctx.globalAlpha = clamp(t.life, 0, 1); Draw.text(ctx, t.str, L.W / 2, L.H - HUD_H - 22 - (FX.toasts.length - 1 - i) * 20, { size: 13, bold: true, align: 'center', color: t.color, stroke: true }); });
    ctx.globalAlpha = 1;
  },
};

// ============================== HUD ==============================
const HUD = {
  flashUntil: {},
  flash(k) { this.flashUntil[k] = performance.now() + 250; },
  draw(ctx, L) {
    const p = Game.player; if (!p) return;
    const pw = Math.min(L.W - 16, 660), ph = 104, x0 = (L.W - pw) / 2, y0 = L.H - ph - 8, T = CONFIG.theme;
    Draw.panel(ctx, x0, y0, pw, ph);
    // 초상화 + 레벨
    const cx = x0 + 50, cy = y0 + 52;
    Draw.circle(ctx, cx, cy, 36); ctx.fillStyle = '#1b2030'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = p.charKey ? p.color : T.accent; ctx.stroke();
    Draw.text(ctx, p.name || '캐시', cx, cy, { size: 16, bold: true, align: 'center' });
    Draw.circle(ctx, cx + 27, cy + 25, 12); ctx.fillStyle = T.accent; ctx.fill();
    Draw.text(ctx, String(p.build.level), cx + 27, cy + 25, { size: 11, bold: true, align: 'center', color: '#fff' });
    // 체력/스태미나
    const slotsW = 6 * 52, bx = x0 + 98, bw = Math.max(100, pw - 98 - slotsW - 22), by = y0 + 14;
    const tot = Math.max(p.maxHp, p.hp + p.shield);
    ctx.fillStyle = '#0f131b'; ctx.fillRect(bx, by, bw, 18);
    ctx.fillStyle = '#3fd07a'; ctx.fillRect(bx, by, bw * Math.max(0, p.hp) / tot, 18);
    if (p.shield > 0) { ctx.fillStyle = '#e9eef7'; ctx.fillRect(bx + bw * Math.max(0, p.hp) / tot, by, bw * p.shield / tot, 18); }
    Draw.text(ctx, `${Math.round(Math.max(0, p.hp))} / ${p.maxHp}${p.shield > 0 ? ` (+${Math.round(p.shield)})` : ''}`, bx + bw / 2, by + 9.5, { size: 11, bold: true, align: 'center', stroke: true });
    ctx.fillStyle = '#0f131b'; ctx.fillRect(bx, by + 24, bw, 9); ctx.fillStyle = '#4aa3ff'; ctx.fillRect(bx, by + 24, bw * p.st / p.maxSt, 9);
    Draw.text(ctx, `SP ${Math.round(p.st)}`, bx + bw - 2, by + 40, { size: 10, align: 'right', color: '#8a93a6' });
    // 버프 표시
    const buffs = [];
    if (p.enhanced > 0) buffs.push(['강화 평타', '#ff9fb2']);
    if (p.shield > 0) buffs.push([`보호막 ${fmt(p.shieldT, 1)}`, '#e9eef7']);
    if (p.msBuffs.some(m => m.tag === 'pboost')) buffs.push(['이속↑', T.accent2]);
    if (p.daggerReady > 0) buffs.push([`단검 ${fmt(p.daggerReady, 1)}`, '#b18cff']);
    if (p.dualRecast > 0) buffs.push([`2식 ${fmt(p.dualRecast, 1)}`, '#ff8fa3']);
    if (p.unstoppable > 0 && !p.shadow) buffs.push(['저지 불가', T.gold]);
    if (p.charKey === 'daniel') {
      if (p.stealthT > 0) buffs.push([`은신 ${fmt(p.stealthT, 1)}`, '#b07cff']);
      if (p.shadowT > 0) buffs.push([`그림자 평타 ${fmt(p.shadowT, 1)}`, '#7d5cb8']);
      if (p.qShots > 0) buffs.push([`가위 공속 ×${p.qShots}`, '#d9a8ff']);
      if (p.mark) buffs.push([p.mark.t >= p.K.W.ready ? '영감 활성!' : `영감 ${fmt(p.K.W.ready - p.mark.t, 1)}`, p.mark.t >= p.K.W.ready ? '#ffd1ff' : '#b07cff']);
      if (p.shadow) buffs.push(['걸작 (R 재사용: 탈출)', p.color]);
      if (Vision.night) buffs.push(['밤: 고독한 예술가', '#8fa8ff']);
    }
    if (p.hudBuffs) buffs.push(...p.hudBuffs());
    if (p.rest) buffs.push([Rest.done(p) ? '휴식 완료' : `휴식 ${p.rest.stage + 1}단계 → +${Math.round(Rest.nextHeal(p))}`, '#9fe0ff']);
    else if (p.restCd > 0) buffs.push([`휴식 대기 ${fmt(p.restCd, 1)}`, '#8a93a6']);
    let bxx = bx;
    for (const [t, c] of buffs) { ctx.font = `700 10px ${FONT}`; const w = ctx.measureText(t).width + 12; Draw.rr(ctx, bxx, by + 50, w, 16, 8); ctx.fillStyle = c + '33'; ctx.fill(); ctx.strokeStyle = c; ctx.lineWidth = 1; ctx.stroke(); Draw.text(ctx, t, bxx + w / 2, by + 58, { size: 10, bold: true, align: 'center', color: c }); bxx += w + 4; if (bxx > bx + bw - 30) break; }
    Draw.text(ctx, `AD ${p.ad} · SP ${p.sp} · AS ${p.as} · CDR ${Math.round(p.cdr * 100)}%`, bx, by + 74, { size: 10, color: '#8a93a6' });
    if (Vision.fogOn && p.items) {   // 시야: 낮/밤 · 시야 거리 · 시야 아이템 보유량
      const it = (k, key) => `${(Settings.keys[key] || '').toUpperCase()} ${CONFIG.vision[k].name} ×${p.items[k]}${p.itemCd[k] > 0 ? ` (${fmt(p.itemCd[k], 1)})` : ''}`;
      Draw.text(ctx, `${Vision.night ? '🌙 밤' : '☀ 낮'} 시야 ${fmt(Vision.sightOf(p), 1)}m · ${it('camera', 'C')} · ${it('drone', 'V')}`, bx, by + 88, { size: 10, bold: true, color: Vision.night ? '#8fa8ff' : '#c9cfdb' });
    }
    // 스킬 슬롯
    const sx0 = x0 + pw - slotsW - 8;
    ['Q', 'W', 'E', 'R', 'D', 'F'].forEach((k, i) => this.slot(ctx, p, k, sx0 + i * 52, y0 + 12, 46));
  },
  slot(ctx, p, k, x, y, s) {
    const def = p.skillDef(k), st = p.skills[k], T = CONFIG.theme;
    const special = (k === 'D' && (p.daggerReady > 0 || p.dualRecast > 0)) || (p.recastReady && p.recastReady(k));
    const ready = st.lv > 0 && st.cd <= 0;
    Draw.rr(ctx, x, y, s, s, 8); ctx.fillStyle = '#1b2030'; ctx.fill();
    Draw.text(ctx, def.short, x + s / 2, y + s / 2 + 3, { size: 13, bold: true, align: 'center', color: ready || special ? '#fff' : '#9aa2b3' });
    if (st.lv <= 0) { Draw.rr(ctx, x, y, s, s, 8); ctx.fillStyle = 'rgba(0,0,0,.7)'; ctx.fill(); Draw.text(ctx, '잠김', x + s / 2, y + s / 2, { size: 11, align: 'center', color: '#666' }); }
    else if (st.cd > 0 && !special) {
      ctx.save(); Draw.rr(ctx, x, y, s, s, 8); ctx.clip();
      ctx.fillStyle = 'rgba(0,0,0,.68)'; ctx.beginPath(); ctx.moveTo(x + s / 2, y + s / 2);
      ctx.arc(x + s / 2, y + s / 2, s, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (st.cd / st.cdMax)); ctx.closePath(); ctx.fill(); ctx.restore();
      Draw.text(ctx, st.cd >= 1 ? String(Math.ceil(st.cd)) : fmt(st.cd, 1), x + s / 2, y + s / 2 + 3, { size: 16, bold: true, align: 'center', stroke: true });
    }
    const flash = (this.flashUntil[k] || 0) > performance.now();
    Draw.rr(ctx, x, y, s, s, 8); ctx.lineWidth = Input.aiming === k ? 3 : 2;
    ctx.strokeStyle = flash ? '#ff5d5d' : Input.aiming === k ? '#ffffff' : special ? T.gold : ready ? T.accent : '#2a3140'; ctx.stroke();
    Draw.text(ctx, (Settings.keys[k] || '').toUpperCase(), x + 5, y + 9, { size: 10, bold: true, color: '#c9cfdb' });
    const maxLv = k === 'R' || k === 'D' ? 3 : k === 'F' ? 0 : 5;
    for (let i = 0; i < maxLv; i++) { ctx.fillStyle = i < st.lv ? T.gold : '#2a3140'; ctx.fillRect(x + 4 + i * ((s - 8) / maxLv), y + s + 4, (s - 8) / maxLv - 2, 4); }
  },
};

  show(on) { this.cv.style.display = on ? 'block' : 'none'; },
};

// ============================== 3D 스킬 이펙트 ==============================
// 게임 로직이 만드는 FX 데이터(베기 slashes · 큰 베기 arcs · 궤적 trails · 파티클 parts)를 3D로 다시 그림 — 게임 로직은 그대로
//   베기·큰 베기: 가슴 높이에서 빛나는 초승달 / 궤적: 공중에 뜬 빛의 띠 / 파티클: 위로 튀었다 떨어지는 불꽃
//   칼 궤적: 플레이어 무기 날 끝이 지나간 길을 매 프레임 기록해 빛 리본으로 (빠르게 휘두를 때만 보임)
// 3D에서는 위 효과를 바닥(데칼)에 중복해서 그리지 않음(Render.drawWorld 'ground'). 충격파 고리·범위 표시는 바닥에 그대로
// 안개 속(시야 밖) 효과는 숨김
const VFX3D = {
  H: 1.0,   // 효과 높이(가슴)
  WIDE: 0.6,   // 이보다 넓은 궤적은 범위 표시(R 돌진 자리 등)라 바닥에 그대로 둠
  on() { return Settings.vfx3d !== false && Renderer.mode === '3d' && Render3D.ready; },
  init(scene) {
    const T3 = THREE;
    this.group = new T3.Group(); scene.add(this.group);
    this.meshes = new Map();   // FX 객체 → 메시
    this.add = { blending: T3.AdditiveBlending, transparent: true, depthWrite: false, side: T3.DoubleSide };
    // 파티클: 점 하나로 많은 불꽃
    this.maxP = 600;
    const g = new T3.BufferGeometry(); g.setAttribute('position', new T3.BufferAttribute(new Float32Array(this.maxP * 3), 3)); g.setAttribute('color', new T3.BufferAttribute(new Float32Array(this.maxP * 3), 3));
    this.points = new T3.Points(g, new T3.PointsMaterial(Object.assign({ size: 0.13, vertexColors: true, sizeAttenuation: true }, this.add)));
    this.points.frustumCulled = false; this.group.add(this.points);
    Render3D.noLine(this.points.material);
    this.blades = new Map();   // 유닛 id → 칼 궤적 리본들
  },
  mat(color, op) { const m = new THREE.MeshBasicMaterial(Object.assign({ color: new THREE.Color(color).convertSRGBToLinear(), opacity: op }, this.add)); Render3D.noLine(m); return m; },
  seen(x, y) { return !Vision.fogOn || Vision.pointVisible({ x, y }); },
  // ---------- 모양 ----------
  slashGeo(s, r0, r1) {   // 부채꼴 띠 (바닥과 평행)
    const g = new THREE.RingGeometry(Math.max(0.03, r0), r1, 24, 1, -s.half, s.half * 2);
    g.rotateX(Math.PI / 2); return g;
  },
  makeSlash(s) {   // 색 부채꼴 + 바깥쪽 밝은 칼날 테두리(흰 심)
    const m = new THREE.Group(), r0 = s.inner || s.R * 0.55;
    m.add(new THREE.Mesh(this.slashGeo(s, r0, s.R * 0.96), this.mat(s.color, 0.6)));
    m.add(new THREE.Mesh(this.slashGeo(s, s.R * 0.9, s.R * 1.02), this.mat('#ffffff', 0.95)));
    if (s.inner) m.add(new THREE.Mesh(this.slashGeo(s, s.inner * 0.97, s.inner * 1.04), this.mat('#ffffff', 0.8)));
    m.children[1].position.y = 0.008; return m;
  },
  ribbonGeo(pts, w) {   // 점들을 따라 가는 평평한 띠
    const T3 = THREE, pos = [], idx = [];
    for (let i = 0; i < pts.length; i++) {
      const p = pts[i], q = pts[Math.min(pts.length - 1, i + 1)], o = pts[Math.max(0, i - 1)], d = new T3.Vector2(q.x - o.x, q.y - o.y).normalize(), n = { x: -d.y * w / 2, y: d.x * w / 2 };
      pos.push(p.x + n.x, 0, p.y + n.y, p.x - n.x, 0, p.y - n.y);
      if (i < pts.length - 1) { const a = i * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
    }
    const g = new T3.BufferGeometry(); g.setAttribute('position', new T3.Float32BufferAttribute(pos, 3)); g.setIndex(idx); return g;
  },
  // ---------- 매 프레임 ----------
  frame(dt) {
    if (!this.group) return;
    const on = this.on(); this.group.visible = on; if (!on) return;
    const live = new Set();
    // 베기: 펼쳐지며 사라짐
    for (const s of FX.slashes) {
      live.add(s); let m = this.meshes.get(s);
      if (!m) { m = this.makeSlash(s); m.position.set(s.x, this.H, s.y); m.rotation.set(0, -s.ang, 0.12); this.group.add(m); this.meshes.set(s, m); }
      const k = s.life / s.max, e = 1 - k; m.children[0].material.opacity = 0.7 * k; m.children[1].material.opacity = Math.min(1, 1.4 * k); if (m.children[2]) m.children[2].material.opacity = 0.9 * k;
      m.scale.setScalar(0.8 + 0.3 * (1 - e * e)); m.visible = this.seen(s.x, s.y);   // 빠르게 펼쳐지며 사라짐
    }
    // 큰 베기(휘어진 궤적): 두 겹 (색 + 흰 심)
    for (const a of FX.arcs) {
      live.add(a); let m = this.meshes.get(a);
      if (!m) {
        const end = V.add(a.a, V.mul(a.dir, a.len)), ctrl = V.add(V.add(a.a, V.mul(a.dir, a.len * 0.5)), V.mul(V.perp(a.dir), a.bend)), pts = [];
        for (let i = 0; i <= 16; i++) { const t = i / 16, u = 1 - t; pts.push({ x: u * u * a.a.x + 2 * u * t * ctrl.x + t * t * end.x, y: u * u * a.a.y + 2 * u * t * ctrl.y + t * t * end.y }); }
        m = new THREE.Group();
        m.add(new THREE.Mesh(this.ribbonGeo(pts, a.width), this.mat(a.color, 0.7)), new THREE.Mesh(this.ribbonGeo(pts, a.width * 0.28), this.mat('#ffffff', 0.9)));
        m.children[1].position.y = 0.01; m.position.y = this.H; this.group.add(m); this.meshes.set(a, m);
      }
      const k = a.life / a.max; m.children[0].material.opacity = 0.75 * k; m.children[1].material.opacity = 0.95 * k; m.visible = this.seen(a.a.x, a.a.y);
    }
    // 궤적(돌진 잔상·X자 베기): 공중에 뜬 띠
    for (const t of FX.trails) {
      if (t.width > this.WIDE) continue;
      live.add(t); let m = this.meshes.get(t);
      if (!m) { m = new THREE.Mesh(this.ribbonGeo([t.a, t.b], t.width), this.mat(t.color, 0.6)); m.position.y = this.H * 0.85; this.group.add(m); this.meshes.set(t, m); }
      m.material.opacity = 0.65 * t.life / t.max; m.visible = this.seen(t.a.x, t.a.y) || this.seen(t.b.x, t.b.y);
    }
    for (const [k, m] of this.meshes) if (!live.has(k)) { this.group.remove(m); m.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose(); }); this.meshes.delete(k); }
    // 파티클: 높이를 붙여 위로 튀었다 떨어짐
    const P = this.points.geometry.attributes.position, C = this.points.geometry.attributes.color, col = new THREE.Color(); let n = 0;
    for (const p of FX.parts) {
      if (n >= this.maxP) break;
      if (p.h === undefined) { p.h = this.H * (0.6 + Math.random() * 0.6); p.vh = 1 + Math.random() * 2.5; }
      p.h = Math.max(0.03, p.h + p.vh * dt); p.vh -= 9 * dt;
      if (!this.seen(p.x, p.y)) continue;
      col.set(p.color).convertSRGBToLinear().multiplyScalar(Math.min(1, p.life / p.max * 1.3));
      P.setXYZ(n, p.x, p.h, p.y); C.setXYZ(n, col.r, col.g, col.b); n++;
    }
    this.points.geometry.setDrawRange(0, n); P.needsUpdate = true; C.needsUpdate = true;
    this.updateBlades(dt);
  },
  // ---------- 칼 궤적 ----------
  BLADE_N: 12,
  updateBlades(dt) {
    const T3 = THREE, seenIds = new Set();
    for (const u of Game.units) {
      const m = Render3D.unitMeshes.get(u.id), rig = m && m.userData.body.userData.rig;
      if (!rig || !rig.blades || !rig.blades.length || !m.visible) continue;
      seenIds.add(u.id);
      let B = this.blades.get(u.id);
      if (B && B.rig !== rig) { for (const b of B) { this.group.remove(b.mesh); b.mesh.geometry.dispose(); b.mesh.material.dispose(); } B = null; }   // 모델이 다시 만들어지면 새로
      if (!B) {
        const color = u.charKey === 'daniel' ? '#c9a4ff' : u.team === myTeam() ? '#ffe1ea' : '#ffb0b0';
        B = rig.blades.map(bl => {
          const g = new T3.BufferGeometry(), N = this.BLADE_N;
          g.setAttribute('position', new T3.BufferAttribute(new Float32Array(N * 2 * 3), 3)); g.setAttribute('color', new T3.BufferAttribute(new Float32Array(N * 2 * 3), 3));
          const idx = []; for (let i = 0; i < N - 1; i++) { const a = i * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); } g.setIndex(idx);
          const mesh = new T3.Mesh(g, Render3D.noLine(new T3.MeshBasicMaterial(Object.assign({ vertexColors: true }, this.add)))); mesh.frustumCulled = false; this.group.add(mesh);
          return { bl, mesh, hist: [], color: new T3.Color(color).convertSRGBToLinear() };
        });
        B.rig = rig; this.blades.set(u.id, B);
      }
      for (const b of B) {
        b.bl.mesh.updateWorldMatrix(true, false);
        const tip = new T3.Vector3(0, -b.bl.len / 2, 0).applyMatrix4(b.bl.mesh.matrixWorld), base = new T3.Vector3(0, b.bl.len / 2, 0).applyMatrix4(b.bl.mesh.matrixWorld);
        b.hist.unshift({ tip, base }); if (b.hist.length > this.BLADE_N) b.hist.pop();
        const P = b.mesh.geometry.attributes.position, C = b.mesh.geometry.attributes.color, N = this.BLADE_N;
        for (let i = 0; i < N; i++) {
          const h = b.hist[Math.min(i, b.hist.length - 1)], prev = b.hist[Math.min(i + 1, b.hist.length - 1)];
          const speed = h.tip.distanceTo(prev.tip) / Math.max(1e-3, dt), k = (1 - i / (N - 1)) * Math.min(1, Math.max(0, (speed - 2.5) / 6));   // 빠를수록 진하게, 오래된 점일수록 흐리게
          P.setXYZ(i * 2, h.tip.x, h.tip.y, h.tip.z); P.setXYZ(i * 2 + 1, h.base.x, h.base.y, h.base.z);
          C.setXYZ(i * 2, b.color.r * k, b.color.g * k, b.color.b * k); C.setXYZ(i * 2 + 1, b.color.r * k * 0.35, b.color.g * k * 0.35, b.color.b * k * 0.35);
        }
        P.needsUpdate = true; C.needsUpdate = true; b.mesh.geometry.computeBoundingSphere();
      }
    }
    for (const [id, B] of this.blades) if (!seenIds.has(id)) { for (const b of B) { this.group.remove(b.mesh); b.mesh.geometry.dispose(); b.mesh.material.dispose(); } this.blades.delete(id); }
  },
  clear() { if (!this.group) return; for (const [k, m] of this.meshes) { this.group.remove(m); } this.meshes.clear(); for (const [id, B] of this.blades) for (const b of B) this.group.remove(b.mesh); this.blades.clear(); },
};

      tip: '「평타 → 짧게 이동 → 평타」 리듬을 끊지 마세요. 스킬은 평타가 나간 직후(후딜)에 섞으면 평타를 덜 잃습니다.',

    if (St.heroAA >= 10 && St.kiteAA / St.heroAA < 0.35) out.push({ id: 'kite', w: 1.1, n: St.heroAA - St.kiteAA, unit: '회', title: `제자리 평타가 많음 (무빙 ${pct(St.kiteAA, St.heroAA)})`,
      why: '평타 사이에 움직이지 않으면 상대 스킬샷을 그대로 맞고, 근접 실험체에게 붙잡힙니다.',

      drill: { mode: 'duel', label: '결투에서 쏘고 움직이기 연습' } });
    if (St.heroAA >= 10 && St.rangeSum / St.heroAA < 0.65) out.push({ id: 'aaRange', w: 1.0, n: St.closeAA, unit: '회', title: `사거리를 못 살림 (평균 ${pct(St.rangeSum, St.heroAA)})`,
      why: `평타를 평균 ${fmt(St.rangeSum / St.heroAA * range, 1)}m(사거리 ${fmt(range, 1)}m의 ${pct(St.rangeSum, St.heroAA)})에서 쐈습니다. 가까울수록 상대 스킬·근접 공격 범위에 들어갑니다.`,
      tip: `사거리 원(${fmt(range, 1)}m) 끝에 상대를 두고 쏘세요. 상대가 다가오면 한 걸음 물러난 뒤 다시 쏩니다.`,
      drill: { mode: 'duel', label: '결투에서 최대 사거리 유지 연습' } });
    return out;
  },
  // 근접 키트 실험체(다니엘·알론소): 붙어 있는데 평타 쉼 · 실험체 핵심 연계(자력 연결 기절 · 영감 표식 폭발)

      why: `평타 사거리 안에 적이 있고 평타가 준비됐는데 치지 않은 시간이 ${fmt(St.aaIdle, 1)}초(교전의 ${pct(St.aaIdle, St.combatT)})입니다.`,

    if (W.ch === 'alonso' && (C.linkOn || 0) >= 3 && (C.linkPop || 0) / C.linkOn < 0.4) out.push({ id: 'linkPop', w: 1.3, n: C.linkOn - (C.linkPop || 0), unit: '회', title: `자력 연결을 기절로 못 이음 (${C.linkPop || 0}/${C.linkOn})`,
      why: 'Q로 연결된 적을 평타·어퍼컷(D)으로 쳐야 최대 체력 비례 추가 피해와 0.9초 기절이 터집니다. 연결이 끊기면 Q의 절반을 버린 셈입니다.',
      tip: 'Q 적중 → 대상을 바라보고 걸으면 이속이 붙음 → 평타 사거리에 들어가자마자 평타나 어퍼컷. 가장 확실한 건 E(속박) → Q → 평타입니다.',
      drill: { mode: 'combo', combo: this.comboWith('alonso', 'Q'), label: '자력 연결 → 기절 콤보 연습' } });
    if (W.ch === 'daniel' && (C.markOn || 0) >= 3 && (C.markPop || 0) / C.markOn < 0.4) out.push({ id: 'markPop', w: 1.3, n: C.markOn - (C.markPop || 0), unit: '회', title: `영감(W) 표식을 못 터뜨림 (${C.markPop || 0}/${C.markOn})`,
      why: 'W 표식은 4초가 지나 「영감의 대상」이 된 뒤 2.5초 안에 공격해야 쌓인 고정 피해와 폭발이 들어갑니다. 너무 일찍 치거나 늦으면 사라집니다.',
      tip: 'W를 건 뒤 바로 들어가지 말고, 표식이 밝아지는 4초 무렵 E(그림자 이동)나 평타로 진입해 터뜨리세요.',
      drill: { mode: 'combo', combo: 'dan2', label: 'W 표식 → 4초 → E → 평타 콤보 연습' } });
    if (W.ch === 'shoichi') {   // 쇼이치: W로 적 긁기 · 단검 회수 — 근거 er_notes_playables.md 15장(유저 플레이 학습)
      if ((C.shW || 0) >= 5 && (C.shWHit || 0) / C.shW < 0.4) out.push({ id: 'shWHit', w: 1.3, n: C.shW - (C.shWHit || 0), unit: '회', title: `W(비약)로 적을 못 긁음 (${C.shWHit || 0}/${C.shW})`,
        why: '쇼이치 딜의 절반 가까이가 W 경로 피해입니다. 단검만 줍고 적을 지나가지 않으면 패시브 투척만 들어가 딜이 크게 줄어듭니다.',
        tip: '적 – 단검 – 나 구도를 만들고 적을 관통하는 단검으로 W를 쓰세요(V자 타기). 궁 단검은 적을 사이에 둔 반대편 것부터.',

      if ((C.shDagOn || 0) >= 6 && (C.shPick || 0) / C.shDagOn < 0.4) out.push({ id: 'shPick', w: 1.0, n: C.shDagOn - (C.shPick || 0), unit: '개', title: `단검을 많이 버림 (${C.shPick || 0}/${C.shDagOn} 회수)`,

        tip: 'E·강화 Q·R을 쓴 뒤 단검 위치를 보고 W나 걸어서 주우세요. E·강화 평타 단검은 0.75초 뒤 떨어지니 그 뒤에 W.',

    if (W.ch === 'bihyung') {   // 비형: 도깨비 불 장판 유지 · 도발 → 풀스윙 · 뚝딱! 2단계 — 근거 er_notes_playables.md 14장(운영 요약)
      if (St.combatT > 10 && (C.bhAuraT || 0) / St.combatT < 0.25) out.push({ id: 'bhAura', w: 1.1, n: Math.round(St.combatT - (C.bhAuraT || 0)), unit: '초', title: `도깨비 불 장판 유지가 짧음 (교전의 ${pct(C.bhAuraT || 0, St.combatT)})`,
        why: '신력은 평타 10 · 스킬 30씩 차고, 장판은 적 실험체를 칠 때마다 4초로 초기화됩니다. 평타를 쉬거나 스킬을 아끼면 장판이 꺼져 지속 피해와 둔화 저항을 잃습니다.',
        tip: '붙은 뒤엔 평타를 쉬지 말고, Q(뚝딱!)로 평타를 강화해 신력을 빨리 채우세요. 장판이 켜지면 4초 안에 계속 때려 끊기지 않게 합니다.',
        drill: { mode: 'dummy', label: '허수아비에서 장판 끊지 않고 때리기' } });
      if ((C.bhTaunt || 0) >= 3 && (C.bhTauntD || 0) / C.bhTaunt < 0.3) out.push({ id: 'bhTauntD', w: 1.2, n: C.bhTaunt - (C.bhTauntD || 0), unit: '회', title: `도발 뒤 풀스윙으로 못 이음 (${C.bhTauntD || 0}/${C.bhTaunt})`,
        why: 'E(내기 한판!) 도발은 0.8~1초로 길어서, 상대가 나에게 걸어오는 동안 풀스윙(0.42초 준비)을 맞히기 쉽습니다. 뒤에 벽이 있으면 벽꿍 기절까지 이어집니다.',
        tip: 'E가 맞으면 바로 Q → 평타 → D(풀스윙). 상대 뒤에 벽이 있는 각도에서 E를 쓰면 풀스윙으로 벽에 박아 기절시킬 수 있습니다.',
        drill: { mode: 'combo', combo: 'bh2', label: 'E → Q → 평타 → 풀스윙 콤보 연습' } });
      if ((C.bhQ1 || 0) >= 3 && (C.bhQ2 || 0) / C.bhQ1 < 0.4) out.push({ id: 'bhQ2', w: 0.9, n: C.bhQ1 - (C.bhQ2 || 0), unit: '회', title: `뚝딱! 2단계를 놓침 (${C.bhQ2 || 0}/${C.bhQ1})`,
        why: 'Q로 강화한 평타가 맞으면 1.5초 뒤부터 4초 안에 Q를 다시 쓸 수 있습니다. 2단계는 강화 평타 + 추가 타격 2회(주변 2m)와 더 큰 회복이라 브루저 교전력의 핵심입니다.',
        tip: 'Q → 평타 뒤 HUD의 「Q 재사용」이 뜨면 바로 Q를 한 번 더 누르고 평타하세요. 발밑 분홍 점선 고리가 재사용 창입니다.',
        drill: { mode: 'dummy', label: '허수아비에서 Q → 평타 → Q → 평타 반복' } });
    }
    return out;
  },
  // 키트 실험체 스킬별 적중률(조준 스킬만)
  aimMetrics(St, W) {
    const out = [];
    for (const k of this.AIMED[W.ch] || []) {
      const c = St.casts[k] || 0, h = St.hits[k] || 0; if (c < 4 || h / c >= 0.4) continue;
      const name = W.p && W.p.skillDef ? W.p.skillDef(k).name : k, combo = this.comboWith(W.ch, k);
      out.push({ id: 'aim' + k, w: 1.0, n: c - h, unit: '회', title: `${k} ${name} 적중률 낮음 (${pct(h, c)})`,
        why: '빗나간 스킬은 쿨타임 동안 피해·견제 기회를 잃습니다.',
        tip: '움직이는 상대는 「지금 위치」가 아니라 0.3초 뒤 위치를, 또는 상대가 평타·스킬을 쓰며 멈춘 순간을 노리세요. 사거리 표시 안에서만 쓰세요.',
        drill: combo ? { mode: 'combo', combo, label: `${k}가 들어간 콤보 연습` } : { mode: 'duel', label: `결투에서 ${k} 맞히기 연습` } });
    }
    return out;
  },
  // 통계 → 분류 (판 길이에 맞춰 판단)
  metrics(St) {
    const W = this.who(), out = [], t = Math.max(1, St.t), waste = Object.values(St.waste).reduce((a, b) => a + b, 0);
    if (waste > 8 && waste / t > 0.25) out.push({ id: 'waste', w: 1.1, n: Math.round(waste), unit: '초', title: '교전 중 쿨타임이 놀았음',
      why: `적이 8m 안에 있는데 쓸 수 있는 스킬을 쓰지 않은 시간이 ${fmt(waste, 1)}초입니다.`,
      tip: W.cathy ? '교전 중엔 쿨이 돈 스킬을 바로 쓰는 습관을 들이세요. 특히 Q는 쿨이 짧아 자주 돌립니다.' : '교전 중엔 쿨이 돈 스킬을 바로 쓰는 습관을 들이세요. 궁극기·무기 스킬도 아끼다 판이 끝나면 손해입니다.',
      drill: { mode: 'dummy', label: '허수아비 DPS 측정으로 쿨 돌리기' } });
    if (!W.cathy) return out.concat(W.ranged ? this.rangedMetrics(St, W) : this.meleeMetrics(St, W), this.aimMetrics(St, W));   // 아래는 캐시 전용(수쳐·강화 평타)
    const e = St.casts.E || 0, eh = St.hits.E || 0;
    if (e >= 4 && eh / e < 0.45) out.push({ id: 'eAim', w: 1.2, n: e - eh, unit: '회', title: `수쳐(E) 적중률 낮음 (${pct(eh, e)})`,
      why: 'E는 캐시 교전의 시작입니다. 빗나가면 속박·기절 연계가 모두 사라집니다.',
      tip: '움직이는 상대는 「지금 위치」가 아니라 「0.3초 뒤 위치」를 노리세요. 상대가 스킬을 쓰는 순간(멈춘 순간)도 좋은 타이밍입니다.',
      drill: { mode: 'duel', label: '결투에서 E 예측샷 연습' } });
    const enhRate = St.aaHits ? St.enhAA / St.aaHits : 0, sk = ['Q', 'W', 'E', 'R', 'D'].reduce((a, k) => a + (St.casts[k] || 0), 0);
    if (sk >= 6 && St.enhAA < sk * 0.4 && !St.mistakes['강화 평타를 쓰지 않고 다음 스킬 연계']) out.push({ id: 'enhLow', w: 1.0, n: sk - St.enhAA, unit: '회', title: '스킬 뒤 강화 평타가 적음',
      why: `스킬 ${sk}번에 강화 평타는 ${St.enhAA}번(평타 중 ${Math.round(enhRate * 100)}%)입니다.`,
      tip: '스킬을 쓰고 나면 바로 평타로 이어 주세요.',
      drill: { mode: 'combo', combo: 'basic', label: '기본 콤보 연습' } });
    return out;
  },
  // 잘한 점
  strengths(St) {
    const out = [], { c, h } = St.totalCasts();
    if (c >= 5 && h / c >= 0.7) out.push(`스킬 적중률 ${pct(h, c)} — 조준이 정확합니다.`);
    if (St.heroAA >= 10 && St.kiteAA / St.heroAA >= 0.6) out.push(`쏘고 움직이기 ${pct(St.kiteAA, St.heroAA)} — 평타 사이 무빙이 좋습니다.`);
    if (St.heroAA >= 10 && St.rangeSum / St.heroAA >= 0.8) out.push(`평타 평균 거리 사거리의 ${pct(St.rangeSum, St.heroAA)} — 사거리 관리가 좋습니다.`);
    if (St.combatT > 8 && St.aaIdle / St.combatT < 0.05) out.push('교전 중 평타를 거의 쉬지 않았습니다.');
    const C = St.counts || {};
    if ((C.linkOn || 0) >= 3 && C.linkPop / C.linkOn >= 0.7) out.push(`자력 연결 기절 ${C.linkPop}/${C.linkOn} — Q 연계가 좋습니다.`);
    if ((C.markOn || 0) >= 3 && C.markPop / C.markOn >= 0.7) out.push(`영감 표식 폭발 ${C.markPop}/${C.markOn} — 진입 타이밍이 좋습니다.`);
    if ((C.shW || 0) >= 5 && C.shWHit / C.shW >= 0.7) out.push(`W 긁기 ${C.shWHit}/${C.shW} — 단검을 타며 적을 잘 지나갑니다.`);
    if ((C.shDagOn || 0) >= 6 && C.shPick / C.shDagOn >= 0.7) out.push(`단검 회수 ${C.shPick}/${C.shDagOn} — 단검을 거의 버리지 않습니다.`);
    if (St.combatT > 10 && (C.bhAuraT || 0) / St.combatT >= 0.5) out.push(`도깨비 불 장판 유지 ${pct(C.bhAuraT, St.combatT)} — 신력 관리가 좋습니다.`);
    if ((C.bhTaunt || 0) >= 3 && C.bhTauntD / C.bhTaunt >= 0.6) out.push(`도발 → 풀스윙 ${C.bhTauntD}/${C.bhTaunt} — 연계가 좋습니다.`);
    if ((C.bhQ1 || 0) >= 3 && C.bhQ2 / C.bhQ1 >= 0.7) out.push(`뚝딱! 2단계 ${C.bhQ2}/${C.bhQ1} — Q 재사용을 놓치지 않습니다.`);
    if (St.enhAA >= 3 && St.aaHits && St.enhAA / St.aaHits >= 0.5) out.push(`강화 평타 ${St.enhAA}회 — 스킬과 평타를 잘 섞고 있습니다.`);
    if (St.eDouble > 0) out.push(`2인 수쳐 ${St.eDouble}회 — 고급 기술을 쓰고 있습니다.`);
    if (St.eWall > 0) out.push(`벽꿍 수쳐 ${St.eWall}회 — 지형을 잘 활용합니다.`);
    if (St.criticals >= 3) out.push(`치명적 외상 ${St.criticals}회 — 외상 3중첩 관리가 좋습니다.`);
    if (St.bestStreak >= 4) out.push(`스킬샷 ${St.bestStreak}연속 명중.`);
    if (!Object.keys(St.mistakes).length && St.t > 15) out.push('기록된 실수가 없습니다.');
    return out.slice(0, 3);
  },
  analyze(St) {
    const items = new Map(), W = this.who();
    for (const [txt, n] of Object.entries(St.mistakes)) {
      const r = this.RULES.find(x => x.re.test(txt)); if (!r) continue;
      const cur = items.get(r.id) || Object.assign({ n: 0, unit: '회' }, r, W.cathy || r.drill.mode !== 'combo' ? {} : { drill: { mode: 'combo', label: '내 실험체 콤보로 입력 리듬 연습' } }); cur.n += n; items.set(r.id, cur);   // 캐시 외 실험체: 캐시 콤보 이름 대신
    }
    for (const m of this.metrics(St)) if (!items.has(m.id)) items.set(m.id, m);
    // 무게 × log(횟수) 순. 초 단위(쿨 낭비)는 4초 = 실수 1회로 환산
    const top = [...items.values()].map(x => Object.assign(x, { score: x.w * Math.log2(1 + (x.unit === '초' ? x.n / 4 : x.n)) })).sort((a, b) => b.score - a.score).slice(0, 3);
    return { top, good: this.strengths(St) };
  },
  // 연습하기: 알맞은 모드·콤보로 바로 시작
  startDrill(d) {

      const list = UI.allCombos(), cur = Modes.combo && Modes.combo.combo, mine = UI.combosFor(this.who().ch);

    const A = this.analyze(St); this.last = A;
    const items = A.top.map((x, i) => `<div class="coach">
        <div class="coach-h"><b>${i + 1}. ${esc(x.title)}</b><span>${x.n}${x.unit}</span></div>

    const good = A.good.length ? `<div class="coach-good">${A.good.map(g => `✔ ${esc(g)}`).join('<br>')}</div>` : '';

};

  paths(it) { return it.paths || [it.path]; },
  root(p) { const a = p.split('.'); return { obj: a[0] === 'CONFIG' ? CONFIG : a[0] === 'ItemFx' ? ItemFx : null, keys: a.slice(1) }; },
  get(p) { let { obj, keys } = this.root(p); for (const k of keys) { if (obj == null) return undefined; obj = obj[k]; } return obj; },
  set(p, v) { let { obj, keys } = this.root(p); for (const k of keys.slice(0, -1)) obj = obj[k]; obj[keys[keys.length - 1]] = v; },
  // 처음 한 번 기본(추정)값을 기억해 두고, 저장된 실측값을 덮어씀
  apply() {
    const M = Settings.measured || {};
    for (const it of this.ITEMS) for (const p of this.paths(it)) {
      if (!(p in this.defaults)) this.defaults[p] = this.get(p);
      const v = M[it.key]; this.set(p, typeof v === 'number' && isFinite(v) ? v : this.defaults[p]);
    }
  },
  value(it) { return this.get(this.paths(it)[0]); },
  base(it) { return this.defaults[this.paths(it)[0]]; },
  measured(it) { return typeof (Settings.measured || {})[it.key] === 'number'; },
  put(key, v) {
    const it = this.ITEMS.find(x => x.key === key); if (!it) return false;
    const M = Object.assign({}, Settings.measured);
    if (v === null || v === '' || !isFinite(+v)) delete M[key];
    else { let n = clamp(+v, it.min, it.max); if (it.int) n = Math.round(n); M[key] = n; }
    Settings.measured = M; saveSettings(); this.apply(); return true;
  },
  count() { return this.ITEMS.filter(it => this.measured(it)).length; },
};

const Charts = {
  setup(id, h) {
    const cv = document.getElementById(id); if (!cv) return null;
    const w = cv.clientWidth || 600, dpr = Math.min(2, devicePixelRatio || 1);
    cv.width = w * dpr; cv.height = h * dpr; cv.style.height = h + 'px';
    const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0); return { c, w, h };
  },
  empty(g, msg) { Draw.text(g.c, msg, g.w / 2, g.h / 2, { size: 12, align: 'center', color: '#8a93a6' }); },
  // 시간별 DPS (3초 이동 평균)
  dps(id) {
    const g = this.setup(id, 160); if (!g) return; const { c, w, h } = g;
    const n = Math.ceil(Stats.t), raw = Array.from({ length: n }, (_, i) => Stats.timeline[i] || 0);
    if (n < 2) return this.empty(g, '데이터 부족');
    const sm = raw.map((_, i) => { let s = 0, k = 0; for (let j = Math.max(0, i - 2); j <= i; j++) { s += raw[j]; k++; } return s / k; });
    const max = Math.max(1, ...sm), pl = 40, pb = 20, pt = 12;
    c.strokeStyle = '#2a3140'; c.lineWidth = 1;
    for (let i = 0; i <= 4; i++) { const y = pt + (h - pt - pb) * i / 4; c.beginPath(); c.moveTo(pl, y); c.lineTo(w - 8, y); c.stroke(); Draw.text(c, String(Math.round(max * (1 - i / 4))), pl - 4, y, { size: 10, align: 'right', color: '#8a93a6' }); }
    const X = i => pl + (w - pl - 8) * i / (n - 1), Y = v => pt + (h - pt - pb) * (1 - v / max);
    c.beginPath(); sm.forEach((v, i) => i ? c.lineTo(X(i), Y(v)) : c.moveTo(X(i), Y(v)));
    c.strokeStyle = CONFIG.theme.accent; c.lineWidth = 2; c.stroke();
    c.lineTo(X(n - 1), Y(0)); c.lineTo(X(0), Y(0)); c.closePath(); c.fillStyle = 'rgba(255,59,92,.12)'; c.fill();
    for (let s = 0; s < n; s += Math.max(5, Math.ceil(n / 8 / 5) * 5)) Draw.text(c, s + 's', X(s), h - 8, { size: 10, align: 'center', color: '#8a93a6' });
  },
  contrib(id) {
    const items = Object.entries(Stats.dmgBy).sort((a, b) => b[1] - a[1]);
    const g = this.setup(id, Math.max(60, items.length * 24 + 10)); if (!g) return; const { c, w } = g;
    if (!items.length) return this.empty(g, '가한 피해 없음');
    const tot = Stats.dealtTotal || 1, lw = 110;
    items.forEach(([k, v], i) => {
      const y = 8 + i * 24, bw = (w - lw - 70) * v / items[0][1];
      Draw.text(c, SRC_LABEL[k] || k, 8, y + 9, { size: 11, color: '#c9cfdb' });
      c.fillStyle = SRC_COLOR[k] || '#999'; Draw.rr(c, lw, y + 2, Math.max(2, bw), 14, 3); c.fill();
      Draw.text(c, `${Math.round(v)} (${Math.round(v / tot * 100)}%)`, lw + bw + 6, y + 9, { size: 11, color: '#e6e9ef' });
    });
  },
  trend(id, hist) {
    const g = this.setup(id, 120); if (!g) return; const { c, w, h } = g;
    if (!hist || hist.length < 2) return this.empty(g, '기록이 2판 이상 쌓이면 추이가 표시됩니다');
    const vals = hist.map(x => x.s), mn = Math.min(...vals), mx = Math.max(...vals), rg = mx - mn || 1, pl = 20, pr = 20, pt = 18, pb = 18;
    const X = i => pl + (w - pl - pr) * i / (hist.length - 1), Y = v => pt + (h - pt - pb) * (1 - (v - mn) / rg);
    c.beginPath(); vals.forEach((v, i) => i ? c.lineTo(X(i), Y(v)) : c.moveTo(X(i), Y(v))); c.strokeStyle = CONFIG.theme.accent2; c.lineWidth = 2; c.stroke();
    hist.forEach((x, i) => { Draw.circle(c, X(i), Y(x.s), 4); c.fillStyle = i === hist.length - 1 ? CONFIG.theme.gold : CONFIG.theme.accent2; c.fill(); Draw.text(c, `${x.s}`, X(i), Y(x.s) - 11, { size: 10, align: 'center', color: '#c9cfdb' }); Draw.text(c, x.g || '', X(i), h - 7, { size: 10, align: 'center', color: '#8a93a6' }); });
  },
  // 피격 위치 히트맵
  heat(id, pts) {
    const g = this.setup(id, 200); if (!g) return; const { c, w, h } = g;
    const sc = Math.min(w / CONFIG.world.w, h / CONFIG.world.h), ox = (w - CONFIG.world.w * sc) / 2, oy = (h - CONFIG.world.h * sc) / 2;
    c.fillStyle = CONFIG.theme.floor; c.fillRect(ox, oy, CONFIG.world.w * sc, CONFIG.world.h * sc);
    c.fillStyle = CONFIG.theme.wall; for (const wl of CONFIG.walls) c.fillRect(ox + wl.x * sc, oy + wl.y * sc, wl.w * sc, wl.h * sc);
    c.globalCompositeOperation = 'lighter';
    for (const p of pts) { const x = ox + p.x * sc, y = oy + p.y * sc, gr = c.createRadialGradient(x, y, 0, x, y, sc * 2.2); gr.addColorStop(0, 'rgba(255,80,60,.75)'); gr.addColorStop(1, 'rgba(255,80,60,0)'); c.fillStyle = gr; c.fillRect(x - sc * 2.2, y - sc * 2.2, sc * 4.4, sc * 4.4); }
    c.globalCompositeOperation = 'source-over';
    if (!pts.length) Draw.text(c, '피격 없음 — 완벽!', w / 2, h / 2, { size: 13, bold: true, align: 'center', color: CONFIG.theme.gold });
  },
};

      · <b>아야</b>: Q 2연발(대상 지정, 사거리 밖이면 다가가서) · W 고정 사격(방향 고정, 이동 가능, <kbd>W</kbd> 다시 = 중단) · E 무빙턴(4m, 벽 넘기, Q·W 쿨 감소) · R 공포탄(주변 4.5m 공포) · D 무빙 리로드(1초 이속, 다음 평타 2회 공속↑) · P 피격 시 보호막<br>

      · <b>나딘</b>: Q 황소의 눈(<kbd>Q</kbd> = 충전 시작, 다시 <kbd>Q</kbd> = 발사, 7→14m) · W 다람쥐 덫(두 번 던져 연결) · E 원숭이 와이어(설치 → <kbd>E</kbd> 다시 = 이동, 11m 넘게 멀어지면 끊김) · R 늑대 맹습(평타 3번마다 늑대, 첫 평타부터) · D 강노(부채꼴 + 폭발 표식) · P 야성 중첩만큼 Q·R 피해 증가<br>
      · <b>카티야</b>: Q 조준 사격(멀리 갈수록 강함) · W 목표물 포착(23m 시야 다트) · E 접근 금지(전방 사격 후 <b>커서 반대쪽</b>으로 도약) · R 정밀 조준(0.8초 스캔 → 사다리꼴 안 최대 3명) · D 저격(제자리 10초 모드, <kbd>D</kbd>를 누를 때마다 커서 방향 발사, 3발째 데드아이, 움직이면 해제) · P Q·E 후 다음 평타 추가 피해<br>
      · 수치는 12.5 라이브 기준(공식 패치노트·닥지지) — docs/er_notes_playables.md. ⚠ 출처 없는 시간·폭은 추정</div>
      <h3>알론소 (탱커)</h3><div class="sub">
      · <b>P</b> 플라즈마 배리어: 기절·속박·공포를 한 번 무효(파란 고리 = 준비), 피해를 안 받으면 다시 준비 · 스킬로 적을 묶으면 회복.<br>
      · <b>Q</b> 마그네틱 펀치(직선) → 맞힌 적과 연결(그쪽으로 가면 빨라짐) → <b>평타·D</b>로 치면 기절 · <b>W</b> 커서 방향 방패 2.5초(앞에서 받는 피해 60% 감소, <kbd>W</kbd> 다시 = 터뜨리기) · <b>E</b> 대상 지정 → 0.8초 뒤 돌진·속박(8.25m 밖으로 빠지면 취소) · <b>R</b> 제자리 3.5초 당기기·회복(<kbd>R</kbd> 다시 = 마무리, CC에 끊김) · <b>D</b> 어퍼컷.<br>
      · 콤보: <b>E → Q → 평타</b>(속박 중 Q 확정 → 기절). 팀 대전에서는 앞라인을 맡습니다.</div>
      <h3>쇼이치 (암살자)</h3><div class="sub">
      · <b>바닥 단검</b>: E·강화 Q·R·5중첩 강화 평타가 단검을 남김(파란 원 = 줍는 곳, 옅은 큰 원 = 그 단검에서 W가 닿는 거리) — 걸어가거나 <b>W로 지나가며 주우면</b> 근처 적(표식 우선)에게 투척 · <b>W로 주우면 W 쿨 초기화</b>.<br>
      · <b>P</b> 부당거래: 스킬 적중 5번 → 다음 평타 추가 피해 + 적 뒤에 단검 · <b>Q</b> 앞 찌르기 → 맞히면 쿨 −3초 + 다음 Q 강화(부채꼴 + 정면 단검) · <b>W</b> 커서 근처 단검 또는 적(등 뒤)으로 순간 이동, 경로의 적 피해 · <b>E</b> 직선 단검 투척(둔화 + 표식 + 적 뒤 단검) 후 뒤로 물러남(W·R·D로 캔슬) · <b>R</b> 0.3초 뒤 주변 2.5m 피해 + 사방 단검 4개 · <b>D</b> 망토(이속) → 3초 안 다시 = 대상 뒤로.<br>
      · 콤보: <b>E → W → W</b>(떨어진 단검 줍기), <b>W → R → W → W</b>(궁 단검을 적을 긁으며 타기). 혼자 먼저 궁 금지.</div>
      <h3>비형 (브루저)</h3><div class="sub">
      · <b>P</b> 도깨비 불: 평타·스킬로 신력을 모아 100이면 4초 장판(주변 3m 최대 체력 비례 피해 + 둔화 저항) — 적 실험체를 치면 시간 초기화.<br>
      · <b>Q</b> 다음 평타 강화 + 회복 → 1.5초 뒤 <kbd>Q</kbd> 다시 = 강화 평타 + 2회 추가 · <b>W</b> 7m 안 지점에 1.5초 뒤 폭발(둔화, 내가 안에 있으면 보호막·이속) · <b>E</b> 2.5~5.3m 돌진 → 처음 부딪힌 적 <b>도발</b>(나를 계속 공격) · <b>R</b> 5m 도약(오를 때 면역, 피해 30% 감소, 15초 추가 체력) → 착지 피해·둔화(가운데 더 셈) · <b>D</b> 풀스윙: 앞 180° 밀치기 → 벽에 부딪히면 기절.<br>
      · 콤보: <b>W → E</b> 진입, <b>E → Q → 평 → D</b>(도발 중 확정). 팀 대전에서는 측면 근딜을 맡습니다.</div>
      <h3>클로에 + 인형 니나</h3><div class="sub">
      · <b>니나 조종</b>: <b>Alt + 우클릭</b>(또는 <b>휠 클릭</b>) — 적 = 그 적 공격 · 클로에 = 옆에 붙어 따라오기(공격 안 함) · 바닥 = 그 지점으로 이동(도착 전엔 클로에 명령 무시). 기본은 클로에가 평타하는 대상을 같이 공격, 10m 넘게 떨어지면 클로에 옆으로 순간이동.<br>
      · <b>Q</b> 니나 주변 베기(클로에 행동을 막지 않음) · <b>W</b> 회전(Q·E·D만 가능) → <b>W</b> 다시 = 커서 지점에 던지기 → 니나 내려찍기 에어본 → 튕겨 나온 자수를 주우면 이속 · <b>E</b> 돌진 → 1초 뒤 <b>E</b> 다시 = 니나가 클로에에게 날아옴(적중 시 Q 초기화) · <b>R</b> 생명 공유 5초(피해 분담 70%/60%, 둘 다 체력이 다 떨어져야 사망) · <b>D</b> 마름쇠.<br>
      · 니나가 쓰러지면 Q·R 불가, E 재사용 불가, W 에어본 없음. 부활할 때 클로에 현재 체력 20%를 씁니다. 콤보: <b>Q → E2 → Q</b>(니나–클로에–적 일렬).</div>
      <h3>핵심 메커니즘</h3><div class="sub">
      · <b>평타</b>: 평타 선딜 중 이동하면 평타가 취소됩니다(실수로 기록).<br>
      · <b>선딜 캔슬</b>: 스킬 선딜 중 이동 입력을 하면 스킬이 끊깁니다(실수로 기록).<br>
      · <b>선입력</b>: 시전 중 누른 스킬은 ${CONFIG.input.bufferMs}ms 안에 시전이 끝나면 이어서 나갑니다. 너무 일찍 누르면 씹힙니다.<br>
      · <b>외과 전문의</b>: 스킬 피해마다 외상 1중첩(스킬당 1회, 4초간 스킬 증폭 25% 출혈) → 3중첩 시 치명적 외상(4초간 최대 체력 6%+스킬 증폭 25% 출혈, 치유 감소, 보호막, Q 쿨 감소). W 안쪽 범위와 E 충돌은 외상을 주지 않습니다.<br>
      · <b>강화 평타</b>: Q/W/E/R 사용 후 다음 평타가 추가 스킬 피해(외상 부여).<br>
      · <b>다니엘(메인 메뉴 → 실험체)</b>: Q 그림자 가위 — 지정 위치(7m) 부채꼴, 0.53초 뒤 적중(시전 중 이동 가능), 중앙은 강화 피해·둔화, 적중 시 다음 평타 3번 공속 증가 · W 영감 — 대상 지정(7m) 표식, 4초 뒤 활성 → 공격하면 축적 피해 폭발, 대상 시야 4.5m로 감소 · E 그림자 이동 — 앞으로 3m 은신 돌진, 3초간 평타 사거리 3m + 평타 시 대상 건너편 순간이동 · R 걸작 — 4초 안에 피해를 준 적(3m)의 그림자 속으로(침묵 0.5초, 2초 대상 지정 불가·지속 피해), R 재사용·종료 시 커서 쪽으로 탈출 · D 망토와 단검 · P 밤에 시야·이속 증가. 결투·허수아비·회피 모드에서 사용.<br>
      · <b>X 휴식 (시즌 12)</b>: 전투 중에도 시작 가능한 3단계 캐스팅 — 1단계 3초 → 최대 체력 15%, 2단계 3초 → 15%, 3단계 4초 → 50%가 <b>단계가 끝날 때 한 번에</b> 회복(도중 취소 시 그 단계는 회복 없음). 단계 종료 0.25초 이내 이동 입력은 회복 후 이동. 피격·군중 제어·이동/공격/스킬·X 재입력 시 취소, 취소 후 1초 대기. 휴식 중 시야 1m 감소(밤 0.4m). 체력바 아래에 캐스팅 바와 예상 회복량이 표시되며 상대 AI도 쉽니다.<br>
      · <b>F 블링크</b>: 커서 방향 3m 순간 이동(벽 중심을 넘으면 벽 너머로). 쿨 90초, Lv12·18 빌드는 2레벨 — 쿨 45초 + 2.5초 이속 15%.<br>
      · <b>시야(1:1 결투)</b>: 시야 낮 8.5m / 밤 3.4m→6.4m. 높은 벽은 시야를 가리고(암시야), 낮은 턱·창문 벽은 너머가 보입니다. 부쉬 안에선 밖이 보이고 밖에선 안이 안 보입니다. 시야 밖 상대의 스킬·평타는 빨간 <b>!</b>, 이동은 발자국(부쉬 안 제외)으로 표시됩니다. <b>C</b> 망원 카메라(커서 방향 4m 설치, 반경 13m, 60초, 은신 감지, 최대 2개, 평타 한 번에 파괴) · <b>V</b> 정찰 드론(커서 지점 5초 시야, 벽 무시).<br>
      · 수치는 코드 맨 위 <code>CONFIG</code>에서 바꿀 수 있습니다.</div>
      <h3>안내</h3><div class="sub">${NOTICE.long}</div>
      <div class="row"><button class="btn" data-a="back">← 뒤로 <kbd>Esc</kbd></button></div>`, { back: () => this.showMenu() }, { Escape: 'back' });

      <div class="row" style="margin-top:12px"><button class="btn" data-a="back">← 뒤로</button>${keys.length ? '<button class="btn" data-a="clear">기록 초기화</button>' : ''}</div>`, {

        ${stat('쿨타임 낭비', fmt(waste, 1) + 's')}${stat('콤보 완성률', St.comboAtt ? `${pct(St.comboOk, St.comboAtt)} (${St.comboOk}/${St.comboAtt})` : '-')}${stat('가한 피해', Math.round(St.dealtTotal))}
        ${stat(Game.modeId === 'dodge' ? '피격 횟수' : '받은 피해', Game.modeId === 'dodge' ? St.playerHits : Math.round(St.takenTotal))}
        ${rng ? stat('평타 거리(사거리 대비)', St.heroAA ? pct(St.rangeSum, St.heroAA) : '-') + stat('평타 공백', `${fmt(St.aaIdle, 1)}s / 교전 ${fmt(St.combatT, 1)}s`) : dan ? stat('평타 공백', `${fmt(St.aaIdle, 1)}s / 교전 ${fmt(St.combatT, 1)}s`) + (pl.charKey === 'alonso' ? stat('자력 연결 → 기절', `${(St.counts || {}).linkPop || 0} / ${(St.counts || {}).linkOn || 0}`) : pl.charKey === 'shoichi' ? stat('W로 적 긁기', `${(St.counts || {}).shWHit || 0} / ${(St.counts || {}).shW || 0}`) + stat('단검 회수', `${(St.counts || {}).shPick || 0} / ${(St.counts || {}).shDagOn || 0}`) + stat('부당거래 강화 평타', (St.counts || {}).shPassive || 0) : pl.charKey === 'bihyung' ? stat('도깨비 불 유지', St.combatT ? pct((St.counts || {}).bhAuraT || 0, St.combatT) : '-') + stat('도발 → 풀스윙', `${(St.counts || {}).bhTauntD || 0} / ${(St.counts || {}).bhTaunt || 0}`) + stat('뚝딱! 2단계', `${(St.counts || {}).bhQ2 || 0} / ${(St.counts || {}).bhQ1 || 0}`) : pl.charKey === 'daniel' ? stat('영감 표식 폭발', `${(St.counts || {}).markPop || 0} / ${(St.counts || {}).markOn || 0}`) : '') : stat('치명적 외상', St.criticals) + stat('2인 수쳐 / 벽꿍', `${St.eDouble} / ${St.eWall}`)}${stat('예측샷 성공률', pct(St.leadHits, St.movingHits))}</div>
      ${Game.player && Game.player.gear ? `<div class="sub" style="margin-top:6px">🛠 장비: ${esc(Builds.short(Game.player.gear))}</div>` : ''}${r.extraHtml || ''}
      <h3>🎯 다음 목표</h3><div class="sub" style="color:#e6e9ef">${esc(r.nextGoal)}</div>
      ${coach}
      <h3>실수 분석</h3>${mist.length ? `<ul class="mist">${mist.map(([k, v]) => `<li>${esc(k)} <b style="color:#ffb347">${v}회</b></li>`).join('')}</ul>` : '<div class="sub">기록된 실수가 없습니다. 👍</div>'}
      <h3>스킬별 기록</h3><table><tr><th>스킬</th><th>시전</th><th>적중</th><th>적중률</th><th>피해</th><th>쿨 낭비</th></tr>${skillRows}</table>
      <h3>시간별 DPS</h3><canvas class="chart" id="cv-dps"></canvas>
      <h3>스킬별 기여도</h3><canvas class="chart" id="cv-contrib"></canvas>
      ${r.heatmap ? '<h3>피격 위치 히트맵</h3><canvas class="chart" id="cv-heat"></canvas>' : ''}
      <h3>최근 10판 추이 (${esc(r.scoreLabel || '')})</h3><canvas class="chart" id="cv-trend"></canvas>
      <div class="row" style="margin-top:14px"><button class="btn primary" data-a="retry">다시 하기 <kbd>R</kbd></button><button class="btn" data-a="menu">메인 메뉴 <kbd>M</kbd></button></div>${NOTICE.html()}`, H, { r: 'retry', Enter: 'retry', m: 'menu', Escape: 'menu' });
    Charts.dps('cv-dps'); Charts.contrib('cv-contrib'); Charts.trend('cv-trend', r.hist); if (r.heatmap) Charts.heat('cv-heat', r.heatmap);
  },
};

// ============================== 메인 루프 ==============================
let lastT = performance.now(), simT = lastT, acc = 0, fps = 60, sideT = 0;
// 게임 계산 진행 (흐른 실제 시간만큼 고정 스텝)
function advanceSim(now, maxDt = 0.1, maxSteps = CONFIG.sim.maxSteps) {
  const dt = Math.min(maxDt, Math.max(0, (now - simT) / 1000)); simT = now;
  if (Game.state === 'play' && !Game.paused) {
    acc += dt * (Replay.active ? Replay.speed : Settings.gameSpeed); let n = 0;   // 리플레이는 자체 속도
    while (acc >= CONFIG.sim.step && n < maxSteps && Game.state === 'play') { Game.step(CONFIG.sim.step); acc -= CONFIG.sim.step; n++; }
    if (n >= maxSteps) acc = 0;
  } else acc = 0;
}
function loop(now) {
  let dt = Math.min(0.1, (now - lastT) / 1000); lastT = now;
  fps = lerp(fps, 1 / Math.max(dt, 1e-4), 0.05); Gfx.watch(dt, fps);   // 품질 자동 낮춤
  advanceSim(now);
  try { Renderer.frame(); } catch (e) { console.error(e); }
  if (Replay.active) Replay.updateBar();   // 리플레이 타임라인 위치
  if ((sideT -= dt) <= 0) { sideT = 0.25; Side.update(); }
  requestAnimationFrame(loop);
}
Renderer.init(); Input.init(Renderer.inputCanvas()); UI.init(); UI.showMenu();
requestAnimationFrame(loop);
</script>
