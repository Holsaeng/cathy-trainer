  // ---------------- 나딘 (석궁) ----------------
  nadine: {
    init(ai) { ai.wire = null; ai.wolfT = 0; ai.wolfN = 0; ai.traps = []; ai.mark = null; ai.lastP = null; },
    wireAs(ai) { const E = ai.kitCfg.E; ai.addAs(ai.pick(E.as, 'E') + ai.sp * 0.0005, ai.wire ? E.life : E.after, 'wire'); },
    onAAHit(ai, u) {
      // R 늑대 맹습: 평타 3번마다 늑대
      if (ai.wolfT > 0 && ++ai.wolfN >= ai.kitCfg.R.every) { ai.wolfN = 0; const R = ai.kitCfg.R;
        ai.hitP(u, ai.calc(R, 'R') + ai.stacks * ai.diff.dmgMul, { name: '늑대' }); u.addSlow(R.slow, R.slowDur); FX.burst(u.pos, '#c9c9c9', 14, 6); FX.text(u.pos, '늑대!', '#e0e0e0', 13, { bold: true }); }
      this.markHit(ai);
    },
    onHit(ai, u, o) { if (!o.mark) this.markHit(ai); },
    markHit(ai) { const m = ai.mark; if (!m) return; const M = ai.kitCfg.D.mark; m.t -= M.cut; m.bonus += ai.pick(M.inc, 'D') + ai.bonusAd * ai.pick(M.incBad, 'D'); },
    update(ai, dt) {
      const p = Game.player, K = ai.kitCfg;
      if (ai.wolfT > 0) ai.wolfT -= dt;
      if (ai.wire && (ai.wire.t -= dt) <= 0) ai.wire = null;
      // 다람쥐 덫: 캐시가 연결선을 지나가면 발동
      if (p && !p.dead && ai.lastP) for (const tr of ai.traps) {
        if (tr.used || !tr.b) continue;
        if (KU.segCross(ai.lastP, p.pos, tr.a, tr.b) || Geo.segDist(p.pos, tr.a, tr.b) < p.r * 0.5) {
          tr.used = true; const W = K.W; ai.hitP(p, ai.calc(W, 'W'), { name: W.name }); p.addSlow(ai.pick(W.slow, 'W'), W.slowDur); FX.text(p.pos, '덫!', ai.motif.color, 15, { bold: true });
        }
      }
      ai.traps = ai.traps.filter(tr => !tr.used && (tr.life -= dt) > 0);
      if (p) ai.lastP = V.copy(p.pos);
      // 강노 표식 폭발
      if (ai.mark && (ai.mark.t -= dt) <= 0) { const M = K.D.mark, m = ai.mark, u = m.u; ai.mark = null;   // 적중마다 쌓인 추가 피해 포함
        if (!u.dead) { ai.hitP(u, ai.calc(M, 'D') + m.bonus * ai.diff.dmgMul, { name: '강노 폭발', mark: true }); FX.burst(u.pos, ai.motif.color, 18, 6); } }
    },
    think(ai, p, d) {
      const K = ai.kitCfg;
      // E 원숭이 와이어: 교전 전 뒤쪽에 걸어 두기(공속 증가, 위급하면 재사용으로 이탈)
      if (!ai.wire && ai.cds.E <= 0 && d < 9) {
        const away = V.norm(V.sub(ai.pos, p.pos)); let best = null, bs = -Infinity;
        for (let i = -2; i <= 2; i++) { const q = Geo.pushOut(V.add(ai.pos, V.mul(V.fromAng(V.ang(away) + i * 0.5), K.E.range)), 0.3); const sc = wallClearance(q) + V.dist(q, p.pos) * 0.3; if (sc > bs) { bs = sc; best = q; } }
        ai.wire = { pos: best, t: K.E.life }; ai.cds.E = ai.pick(K.E.cd, 'E'); this.wireAs(ai); FX.text(ai.pos, K.E.name, ai.motif.color, 12, { bold: true }); return false;
      }
      // R 늑대 맹습: 평타 교전이 시작되면
      if (ai.cds.R <= 0 && d <= ai.aaRange() + 0.5) { ai.cds.R = ai.pick(K.R.cd, 'R'); ai.wolfT = K.R.dur; ai.wolfN = K.R.every - 1; FX.text(ai.pos, K.R.name, ai.motif.color, 13, { bold: true }); return false; }
      // 강노: 부채꼴 사격 + 둔화 + 폭발 표식
      if (ai.cds.D <= 0 && d < K.D.range - 0.5) {
        const D = K.D, dir = V.norm(V.sub(p.pos, ai.pos)); ai.cds.D = ai.pick(D.cd, 'D');
        ai.startCast(D.windup, () => {
          Sfx.play('throw'); FX.slash(ai.pos, V.ang(dir), D.range, D.angle / 2 * Math.PI / 180, ai.motif.color, 0.25);
          if (KU.inCone(ai, dir, D.range, D.angle, p)) { ai.hitP(p, ai.calc(D, 'D'), { name: D.name, mark: true }); p.addSlow(D.slow, D.slowDur); ai.mark = { u: p, t: D.mark.time, bonus: 0 }; }
        }, { kind: 'cone', dir, len: D.range, angle: D.angle });
        return true;
      }
      // W 다람쥐 덫: 캐시가 다가오는 길목에 연결선 설치
      if (ai.cds.W <= 0 && d > 2.5 && d < K.W.range + 2 && ai.traps.length < K.W.sets * 2) {
        const W = K.W, toP = V.norm(V.sub(p.pos, ai.pos)), mid = V.add(ai.pos, V.mul(toP, Math.min(d * 0.55, W.range))), side = V.perp(toP);

          onEnd: c => {
            const k = clamp(c.t / Q.charge, 0, 1), rng = lerp(Q.range[0], Q.range[1], k), dir = ai.aimDir(p, 0, Q.speed);
            const base = ai.pick(Q.min, 'Q') + ai.bonusAd * Q.minBad + ai.sp * Q.minSp, amt = (base * lerp(1, Q.maxMul, k) + ai.stacks) * ai.diff.dmgMul;
            Sfx.play('throw'); ai.shoot({ dir, speed: Q.speed, range: rng, width: Q.width, len: 1.2 + k, onHit: u => ai.hitP(u, amt, { name: Q.name }) });
          } });
        return false;
      }
      return false;
    },
    checkBush(ai, est) {
      const K = ai.kitCfg, d = V.dist(ai.pos, est);
      if (ai.cds.W <= 0 && ai.traps.length < K.W.sets * 2 && d < K.W.range + 4) {   // 캐시가 나올 길목(부쉬→나딘 방향)에 덫
        const W = K.W, toMe = V.norm(V.sub(ai.pos, est)), mid = V.add(est, V.mul(toMe, Math.min(2.2, d * 0.5))), side = V.perp(toMe);
        ai.traps.push({ a: Geo.pushOut(V.add(mid, V.mul(side, W.link / 2)), 0.2), b: Geo.pushOut(V.sub(mid, V.mul(side, W.link / 2)), 0.2), life: W.life });

      }

        const Q = K.Q, need = clamp((d + 0.8 - Q.range[0]) / (Q.range[1] - Q.range[0]), 0, 1), dur = Math.max(0.6, need * Q.charge), to = V.copy(est);
        ai.cds.Q = Q.cd; ai.noAA = dur; FX.text(ai.pos, Q.name, ai.motif.color, 12, { bold: true });
        ai.chans.push({ t: 0, dur, charge: true, onTick: (dt, c) => ai.addMsBuff(-Q.chargeSlow * Math.min(1, c.t / Q.charge), 0.1, false, 'charge'),
          onEnd: c => { const k = clamp(c.t / Q.charge, 0, 1), base = ai.pick(Q.min, 'Q') + ai.bonusAd * Q.minBad + ai.sp * Q.minSp, amt = (base * lerp(1, Q.maxMul, k) + ai.stacks) * ai.diff.dmgMul;
            Sfx.play('throw'); ai.shoot({ dir: KU.aimAt(ai, to), speed: Q.speed, range: lerp(Q.range[0], Q.range[1], k), width: Q.width, len: 1.2 + k, onHit: u => ai.hitP(u, amt, { name: Q.name }) }); } });

      }

    },
    // 위급하면 와이어로 이탈 (없으면 와이어를 걸고 바로 이동)
    escape(ai, p, dir) {
      const E = ai.kitCfg.E;
      if (ai.wire) { const to = ai.wire.pos, dd = V.dist(ai.pos, to); if (dd < 1.5 || V.dist(to, p.pos) < V.dist(ai.pos, p.pos)) return false;
        ai.wire = null; this.wireAs(ai); ai.act = { type: 'dash', t: 0, dur: E.zipTime, from: V.copy(ai.pos), to: Geo.pushOut(V.copy(to), ai.r) }; FX.text(ai.pos, '와이어 이동', ai.motif.color, 12, { bold: true }); return true; }
      if (ai.cds.E <= 0) { ai.cds.E = ai.pick(E.cd, 'E'); this.wireAs(ai); ai.dashTo(dir, E.range, E.zipTime + 0.15, false, E.name); return true; }

      for (const tr of ai.traps) { ctx.save(); ctx.strokeStyle = ai.motif.color; ctx.lineWidth = 0.07; ctx.setLineDash([0.25, 0.15]); ctx.beginPath(); ctx.moveTo(tr.a.x, tr.a.y); ctx.lineTo(tr.b.x, tr.b.y); ctx.stroke(); ctx.restore(); KU.fill(ctx, tr.a, 0.25, ai.motif.color, 0.8); KU.fill(ctx, tr.b, 0.25, ai.motif.color, 0.8); }
      if (ai.wire) { ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 0.03; ctx.beginPath(); ctx.moveTo(ai.pos.x, ai.pos.y); ctx.lineTo(ai.wire.pos.x, ai.wire.pos.y); ctx.stroke(); ctx.restore(); KU.ring(ctx, ai.wire.pos, 0.35, '#ffffff', 0.8); }
      if (ai.mark && !ai.mark.u.dead) { const u = ai.mark.u, k = clamp(ai.mark.t / ai.kitCfg.D.mark.time, 0, 1); ctx.save(); ctx.strokeStyle = ai.motif.color; ctx.lineWidth = 0.1; ctx.beginPath(); ctx.arc(u.pos.x, u.pos.y, u.r + 0.4, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * k); ctx.stroke(); ctx.restore(); }
      if (ai.wolfT > 0) KU.ring(ctx, ai.pos, ai.r + 0.3, '#d0d0d0', 0.5, true);
    },
  },
};

// ============================== 근거리 암살자 키트: 다니엘 (단검) ==============================
// 스킬 수치: CONFIG.rangedKits.daniel (나무위키) / 판단: CONFIG.meleeAI (네브짱 '장인초대석' 다니엘 랭킹 1위 강의)
//  stalk  : 정면 싸움 금지 — Q 사거리 근처(6m)에서 서성이며(부쉬 선호) 캐시의 E(수쳐)·Q가 빠지거나 체력이 깎이길 기다림
//  engage : 망토(이속) → E 은신 돌진 → 그림자 평타(건너편 순간이동) → Q(중앙) + W 표식 → 단검(뒤로 순간이동) → 평타 → R 걸작
//           궁 이후 도망치는 캐시를 쫓을 수 있게 E는 가능하면 아낌 · E 사거리가 모자라면 늑대를 그림자 평타로 경유
//  retreat: 체력이 낮고 궁이 빠졌으면 빠졌다가 다시 서성이기
Kits.daniel = {
  init(ai) {
    Object.assign(ai, { mode: 'stalk', modeT: 0, qShots: 0, shadowT: 0, cloakT: 0, lastHitT: 99, mark: null, shadow: null, aaTarget: null, engageHits: 0 });
    Object.assign(ai.stats, { engages: 0, rUses: 0, wolfHops: 0, markPops: 0 });
  },
  K(ai) { return ai.kitCfg; },
  aaRange(ai) { return ai.shadowT > 0 ? ai.kitCfg.E.aaRange : ai.motif.aaRange; },
  setMode(ai, m) { if (ai.mode !== m) { ai.mode = m; ai.modeT = 0; if (m === 'engage') ai.stats.engages++; } },

  // ---------- 매 스텝 ----------
  update(ai, dt) {
    const K = ai.kitCfg, p = Game.player;
    ai.modeT += dt; ai.lastHitT += dt;
    if (ai.shadowT > 0) { ai.shadowT -= dt; if (ai.shadowT <= 0) ai.stealthT = 0; }
    if (ai.cloakT > 0) { ai.cloakT -= dt; if (ai.cloakT <= 0) ai.cds.D = ai.pick(K.D.cd, 'D'); }   // 단검(2차) 안 쓰면 쿨 시작
    if (ai.qShots > 0 && !ai.asBuffs.some(a => a.tag === 'danQ')) ai.qShots = 0;
    if (ai.mark) {
      const M = ai.mark; M.t += dt;
      if (M.target.dead || M.t > K.W.ready + K.W.popWindow) ai.mark = null;
      else if (M.target === p) p.revealT = Math.max(p.revealT, 0.05);   // 표식 대상 주변 시야 (부쉬 속도 보임)
    }
    for (const o of ai.objs) { o.t += dt; if (!o.done && o.t >= o.dur) { o.done = true; this.qLand(ai, o); } }
    ai.objs = ai.objs.filter(o => o.t < o.dur + 0.25);
    if (ai.mode === 'engage' && ai.thinkT > ai.diff.react * 0.5) ai.thinkT = ai.diff.react * 0.5;   // 콤보 중에는 판단을 빠르게
  },
  // R 걸작: 그림자 속(대상에 붙어 대상 지정 불가) — 일반 행동을 대신함
  preempt(ai, dt) {
    const S = ai.shadow; if (!S) return false;
    const K = ai.kitCfg.R, u = S.target; S.t += dt;
    if (!u.dead) ai.pos = V.copy(u.pos);
    ai.untargetable = ai.invuln = 0.1; ai.stealthT = 0.05; ai.vel = { x: 0, y: 0 };
    const every = K.dur / K.ticks;
    while (S.n < K.ticks && S.t >= every * (S.n + 1) - 1e-6) { S.n++; if (!u.dead) ai.hitP(u, ai.calc(K.tick, 'R'), { name: K.name, noShake: true }); }
    if (S.t >= K.dur || u.dead) this.exitShadow(ai);
    return true;
  },
  exitShadow(ai) {
    const S = ai.shadow, K = ai.kitCfg.R, u = S.target; ai.shadow = null;
    if (!u.dead) { ai.hitP(u, ai.calc(K.last, 'R'), { name: K.name + ' (마무리)' }); FX.xslash(u.pos, ai.motif.color, 3); Sfx.play('ult'); }
    // 빠져나오는 방향: 계속 싸울 거면 캐시 등 뒤(벽 반대), 도망칠 거면 반대쪽
    const away = ai.hp / ai.maxHp < CONFIG.meleeAI.lowHp && u.hp / u.maxHp > 0.35;
    let best = null, bs = -Infinity;
    for (let i = 0; i < 12; i++) {
      const dir = V.fromAng(i * Math.PI / 6), q = V.add(u.pos, V.mul(dir, K.exit));
      const sc = wallClearance(q) * 1.2 + (away ? V.dist(q, u.pos) : -Math.abs(angDiff(i * Math.PI / 6, (u.facing ?? 0) + Math.PI))) + Math.random() * 0.2;
      if (sc > bs) { bs = sc; best = dir; }
    }
    ai.untargetable = ai.invuln = K.exitTime; ai.stealthT = 0;
    ai.dashTo(best, K.exit, K.exitTime, false);
    if (away) this.setMode(ai, 'retreat');
  },

  // ---------- 피해 훅: 영감 축적·폭발, 최근 피해(궁 조건) ----------
  dealt(ai, u, dmg, o) {
    if (u !== Game.player) return;
    ai.lastHitT = 0; u.blindT = 0;   // 다니엘에게 맞으면 시야 감소 해제
    const M = ai.mark, W = ai.kitCfg.W; if (!M || M.target !== u || (o && o.markPop)) return;
    if (M.t >= W.ready) {   // 영감의 대상 공격 → 폭발
      ai.mark = null; ai.stats.markPops++;
      const acc = M.acc; Combat.damage(ai, u, acc, { type: 'true', source: '적 영감 (축적)' });
      ai.hitP(u, ai.calc(W, 'W'), { name: W.name + ' 폭발', markPop: true }); u.addSlow(W.slow, W.slowDur);
      FX.burst(u.pos, '#d9a8ff', 24, 7, 0.6); FX.ring(u.pos, 0.3, 1.8, '#d9a8ff', 0.4); FX.text(u.pos, '영감 폭발 ' + Math.round(acc), '#d9a8ff', 14, { bold: true });
    } else M.acc += dmg * (ai.pick(W.acc, 'W') + ai.bonusAd * W.accBad) / 100;
  },
  onHit(ai, u, o, dmg) { this.dealt(ai, u, dmg || 0, o); },
  onAAHit(ai, u, dmg) {
    this.dealt(ai, u, dmg || 0);
    if (ai.qShots > 0 && --ai.qShots <= 0) ai.asBuffs = ai.asBuffs.filter(a => a.tag !== 'danQ');
  },

  // ---------- 평타: 근접 즉시 판정 / 그림자 돌진 중이면 대상 건너편으로 순간이동 ----------
  fireAA(ai, p) {
    const t = ai.aaTarget && !ai.aaTarget.dead ? ai.aaTarget : p; ai.aaTarget = null;
    const K = ai.kitCfg.E, d = V.dist(ai.pos, t.pos) - t.r - ai.r;
    if (ai.shadowT > 0 && d <= K.aaRange + 0.3) {
      const dir = V.norm(V.sub(t.pos, ai.pos)), from = V.copy(ai.pos);
      ai.pos = Geo.pushOut(V.add(t.pos, V.mul(dir, t.r + ai.r + 0.15)), ai.r);
      FX.burst(from, '#4b3a66', 14, 2.5, 0.6, 0.14); FX.trail(from, ai.pos, '#7d5cb8', 0.25, 0.25);
      ai.shadowT = 0; ai.stealthT = 0;
      if (t === p) { ai.aaLand(t); ai.hitP(t, ai.calc(K, 'E'), { name: K.name }); }
      else { Combat.damage(ai, t, ai.ad, { type: 'normal', source: '적 평타' }); ai.stats.wolfHops++; FX.text(ai.pos, '그림자 경유', ai.motif.color, 11); }
      return true;
    }
    if (d <= ai.motif.aaRange + 0.35) { ai.aaLand(t); FX.slash(ai.pos, V.ang(V.sub(t.pos, ai.pos)), 1.3, 0.6, ai.motif.color, 0.15); }
    return true;
  },
  kite(ai, p) {   // 근접: 쏘고 빠지기 대신 계속 붙어 있음 (도망 모드 제외)
    if (ai.mode === 'retreat') { ai.moveTarget = ai.pickSpot(p, 9, 2.2); return; }
    ai.moveTarget = Geo.pushOut(ai.predict(p, 0.15), ai.r);
  },

  // ---------- 스킬 ----------
  castQ(ai, pt) {
    const K = ai.kitCfg.Q, dir = V.norm(V.sub(pt, ai.pos)), dist = Math.min(K.range, V.dist(ai.pos, pt));
    const pos = V.add(ai.pos, V.mul(dir, dist));
    ai.cds.Q = ai.pick(K.cd, 'Q'); ai.stealthT = 0;   // 다른 스킬을 쓰면 은신 해제
    ai.objs.push({ kind: 'scissor', pos, dir, t: 0, dur: K.windup });   // 무빙 캐스팅: 시전 중에도 계속 이동
    ai.revealT = Math.max(ai.revealT || 0, CONFIG.vision.actionReveal);
    FX.text(ai.pos, K.name, ai.motif.color, 12, { bold: true }); Sfx.play('throw');
  },
  qLand(ai, o) {
    const K = ai.kitCfg.Q, apex = V.sub(o.pos, V.mul(o.dir, K.front)); let hit = false;
    for (const u of Game.units) {
      if (u.dead || u.team === ai.team || u.untargetable > 0) continue;
      if (!Geo.inSector(apex, V.ang(o.dir), K.len, K.angle / 2 * Math.PI / 180, u.pos, u.r)) continue;
      const center = V.dist(u.pos, o.pos) <= K.centerR + u.r;
      if (u === Game.player) { ai.hitP(u, ai.calc(center ? K.center : K, 'Q'), { name: K.name + (center ? ' (중앙)' : '') }); hit = true; }
      else Combat.damage(ai, u, ai.calc(K, 'Q'), { type: 'skill', source: '적 ' + K.name });
      if (center) u.addSlow(K.slow, K.slowDur);
    }
    FX.slash(apex, V.ang(o.dir), K.len, K.angle / 2 * Math.PI / 180, '#9d6bff', 0.3);
    if (hit) { ai.addAs(ai.pick(K.asBuff, 'Q'), K.asDur, 'danQ'); ai.qShots = K.asShots; }
  },
  castW(ai, u) {
    const K = ai.kitCfg.W; ai.cds.W = K.cd; ai.stealthT = 0;
    ai.mark = { target: u, t: 0, acc: 0 }; u.blindT = K.blind; u.blindR = K.blindR;
    FX.text(u.pos, '영감 표식', '#d9a8ff', 13, { bold: true }); FX.ring(u.pos, 1.2, 0.4, '#d9a8ff', 0.4); Sfx.play('throw');
    ai.revealT = Math.max(ai.revealT || 0, CONFIG.vision.actionReveal);
  },
  castE(ai, dir, dist) {
    const K = ai.kitCfg.E; ai.cds.E = ai.pick(K.cd, 'E');
    FX.burst(ai.pos, '#4b3a66', 18, 2.5, 0.7, 0.16);   // 은신 연기(상대는 이 연기로 진입을 눈치챔)
    ai.dashTo(dir, Math.min(K.dist, dist ?? K.dist), K.time, false);
    ai.stealthT = ai.pick(K.stealth, 'E'); ai.shadowT = K.shadowDur; ai.revealT = 0;
    FX.text(ai.pos, K.name, ai.motif.color, 12, { bold: true });
  },
  cloak(ai) {   // 망토와 단검 1차: 1초 이속
    const K = ai.kitCfg.D; ai.cloakT = K.recast; ai.addMsBuff(ai.pick(K.ms, 'D'), K.msDur, false, 'danD');
    FX.text(ai.pos, '망토', ai.motif.color, 12, { bold: true }); FX.burst(ai.pos, '#6e5a99', 8, 3, 0.4);
  },
  dagger(ai, u) {   // 2차: 대상 뒤로 순간이동 + 피해·둔화
    const K = ai.kitCfg.D, dir = V.norm(V.sub(u.pos, ai.pos)), from = V.copy(ai.pos);
    ai.cloakT = 0; ai.cds.D = ai.pick(K.cd, 'D'); ai.stealthT = 0; ai.shadowT = 0;
    ai.pos = Geo.pushOut(V.add(u.pos, V.mul(dir, u.r + ai.r + K.behind * 0.3)), ai.r);
    FX.trail(from, ai.pos, '#b07cff', 0.2, 0.25);
    ai.hitP(u, ai.calc(K, 'D') + u.hp * K.curHp * ai.diff.dmgMul, { name: '단검' }); u.addSlow(ai.pick(K.slow, 'D'), K.slowDur);
  },
  canR(ai, p, d) { const K = ai.kitCfg.R; return ai.cds.R <= 0 && ai.lastHitT <= K.recent && d - p.r - ai.r <= K.range && !p.dead; },
  castR(ai, p) {
    const K = ai.kitCfg.R; ai.cds.R = ai.pick(K.cd, 'R'); ai.act = null; ai.moveTarget = null; ai.shadowT = 0;
    ai.shadow = { target: p, t: 0, n: 0 }; p.silence = Math.max(p.silence, K.silence); ai.stats.rUses++;
    if (p.cast && p.cast.phase === 'windup' && p.cancelCast) p.cancelCast(false);   // 침묵: 시전 중이던 스킬 취소
    FX.text(p.pos, K.name + ' — 침묵', ai.motif.color, 15, { bold: true }); FX.ring(p.pos, 1.5, 0.3, '#2a1840', 0.4); Sfx.play('ult');
  },

  // ---------- 판단 ----------
  burst(ai, p) {   // 지금 들어가면 넣을 수 있는 대략적인 피해(방어력 반영)
    const K = ai.kitCfg, mit = 100 / (100 + p.def * (1 - ai.pen)), aa = ai.ad * (1 + ai.critChance * 0.75) * (1 + ai.aaAmp) * ai.diff.dmgMul;
    let s = aa * 3;
    if (ai.cds.Q <= 1) s += ai.calc(K.Q.center, 'Q') + aa * 2;
    if (ai.cds.E <= 0) s += ai.calc(K.E, 'E');
    if (ai.cds.D <= 0 || ai.cloakT > 0) s += ai.calc(K.D, 'D') + p.hp * K.D.curHp;
    if (ai.cds.R <= 0) s += ai.calc(K.R.tick, 'R') * K.R.ticks + ai.calc(K.R.last, 'R');
    return s * mit;
  },
  think(ai, p, d) {
    const K = ai.kitCfg, MA = CONFIG.meleeAI, dk = ai.diffKey, gap = d - p.r - ai.r;
    const myHp = ai.hp / ai.maxHp, herHp = p.hp / p.maxHp;
    const herE = p.skills.E.lv > 0 && p.skills.E.cd <= 0.8, herQ = p.skills.Q.lv > 0 && p.skills.Q.cd <= 0.8;
    // --- 모드 전환 ---
    if (ai.mode !== 'retreat' && myHp < MA.lowHp && ai.cds.R > 0 && herHp > myHp + 0.1 && dk !== 'easy') this.setMode(ai, 'retreat');
    if (ai.mode === 'retreat' && (myHp > MA.engageHp || (ai.modeT > 4 && gap > 8))) this.setMode(ai, 'stalk');
    if (ai.mode === 'stalk') {
      const killable = this.burst(ai, p) >= p.hp * (dk === 'hard' ? 0.85 : 1.0);
      const opening = !herE || (!herQ && dk !== 'easy') || herHp < 0.4;   // 캐시의 수쳐(E)·돌진(Q)이 빠진 순간 = 진입각
      const tools = ai.cds.E <= 0 || ai.cds.D <= 0;
      const forced = gap < 2.0;                                               // 캐시가 먼저 붙으면 맞받아침
      if (forced || (tools && (killable || (opening && (ai.cds.R <= 0 || herHp < 0.5)))) || (dk === 'easy' && ai.modeT > 6)) this.setMode(ai, 'engage');
    }
    if (ai.mode === 'engage' && ai.modeT > 3 && gap > 6 && ai.cds.E > 0 && ai.cds.D > 0 && ai.cloakT <= 0) this.setMode(ai, 'stalk');   // 놓쳤으면 다시 서성이기
    if (!ai.canAct()) return false;

    // --- 공통: 걸작 회피(캐시 E·R 선딜을 대상 지정 불가로 피함) ---
    // 걸작은 사실상 2초 무적 → 캐시가 스킬(특히 E·R, 진입 중엔 Q·W도)을 시전하는 순간 들어가서 피함
    if (p.cast && p.cast.phase === 'windup' && this.canR(ai, p, d) && dk !== 'easy' &&
        (['E', 'R'].includes(p.cast.k) || (ai.mode === 'engage' && ['Q', 'W'].includes(p.cast.k) && Math.random() < (dk === 'hard' ? 0.8 : 0.5)))) { this.castR(ai, p); return true; }

    if (ai.mode === 'engage') return this.combo(ai, p, d, gap);
    if (ai.mode === 'stalk') {
      // Q 견제: 캐시 E가 빠졌을 때만(맞받아치기 어려움), 사거리 7m + 가위 앞부분 1.75m
      // (진입 도구가 다 있으면 Q는 콤보용으로 아낌)
      if (ai.cds.Q <= 0 && (ai.cds.R > 8 || ai.cds.E > 3) && d <= K.Q.range + K.Q.front * 0.6 && d > 4 && (!herE || Math.random() < 0.25) && Math.random() < (dk === 'easy' ? 0.3 : 0.7)) { this.castQ(ai, ai.predict(p, K.Q.windup)); return true; }
      // 어려움: 난전용 W 선표식 — 4초 뒤 진입해서 터뜨림
      if (dk === 'hard' && ai.cds.W <= 0 && d <= K.W.range && !herE && ai.cds.R <= 0) { this.castW(ai, p); this.setMode(ai, 'engage'); return true; }
    }
    return false;
  },
  combo(ai, p, d, gap) {
    const K = ai.kitCfg;
    // 마무리/표식 폭발/위기 → 걸작
    if (this.canR(ai, p, d)) {
      const R = K.R, rDmg = (ai.calc(R.tick, 'R') * R.ticks + ai.calc(R.last, 'R')) * 100 / (100 + p.def);
      const markReady = ai.mark && ai.mark.t >= K.W.ready - 0.3;
      if (markReady || p.hp <= rDmg * 1.15 || ai.hp / ai.maxHp < 0.45 || ai.modeT > (ai.diffKey === 'hard' ? 2.2 : 2.8)) { this.castR(ai, p); return true; }
    }
    // 단검(2차): 망토 후 3초 안, 붙어 있을 때
    if (ai.cloakT > 0 && gap <= K.D.range && ai.lastHitT < 3) { this.dagger(ai, p); return true; }
    // 첫 타가 들어간 뒤: Q(중앙) + W 표식
    if (ai.lastHitT < 1.5 && gap <= 2.2) {
      if (ai.cds.Q <= 0) { this.castQ(ai, p.pos); return true; }
      if (ai.cds.W <= 0 && !ai.mark) { this.castW(ai, p); return true; }
      if (ai.cds.D <= 0 && ai.cloakT <= 0) { this.cloak(ai); return true; }   // 망토 → 다음 판단에 단검
    }
    // 진입: 망토(이속) → E 은신 돌진 → 그림자 평타
    if (gap > K.E.aaRange - 0.2 && ai.shadowT <= 0) {
      if (ai.cds.D <= 0 && ai.cloakT <= 0 && gap > 4) { this.cloak(ai); return true; }
      // E: 3m 돌진 + 그림자 평타 3m → 6m 안이면 닿음. 궁 이후 추격용으로 아끼라는 조언 → 이미 붙어 있으면 안 씀
      if (ai.cds.E <= 0 && gap <= K.E.dist + K.E.aaRange) { this.castE(ai, V.norm(V.sub(p.pos, ai.pos)), Math.max(0.5, gap - 1.5)); return true; }
      // 사거리가 모자라면 늑대를 그림자 평타로 경유(강의 팁)
      if (ai.cds.E <= 0 && gap <= K.E.dist + K.E.aaRange * 2 + 1) {
        const wolf = Game.units.find(u => u.kind === 'animal' && !u.dead && V.dist(u.pos, ai.pos) <= K.E.dist + K.E.aaRange && V.dist(u.pos, p.pos) < d - 1);
        if (wolf) { this.castE(ai, V.norm(V.sub(wolf.pos, ai.pos)), Math.max(0.5, V.dist(ai.pos, wolf.pos) - 1.5)); ai.hopWolf = wolf; return true; }
      }
    }
    return false;
  },
  // 이동: 서성이기(부쉬 선호, 캐시 E 사거리 밖) / 추격 / 후퇴
  move(ai, p, d) {
    const MA = CONFIG.meleeAI;
    if (ai.hopWolf && ai.shadowT > 0 && !ai.hopWolf.dead) {   // 늑대 경유 중: 늑대에게 그림자 평타
      const w = ai.hopWolf; if (V.dist(ai.pos, w.pos) - w.r - ai.r <= ai.kitCfg.E.aaRange && ai.aaCd <= 0) { ai.aaTarget = w; ai.act = { type: 'aa', t: 0, dur: 0.05 }; ai.hopWolf = null; return; }
      ai.moveTarget = V.copy(w.pos); return;
    }
    ai.hopWolf = null;
    if (ai.mode === 'engage') { ai.moveTarget = Geo.pushOut(ai.predict(p, 0.25), ai.r); return; }
    if (ai.mode === 'retreat') { ai.moveTarget = ai.pickSpot(p, 10, 2.4); return; }
    // stalk: 캐시와 6m 근처를 유지하며 좌우로 서성임, 근처 부쉬가 있으면 숨어서 기다림
    const gap = d - p.r - ai.r, safe = CONFIG.rangedAI.eThreatRange;
    if (gap < MA.stalk - MA.stalkBand) { ai.moveTarget = ai.pickSpot(p, MA.stalk + 0.5, 1.8); return; }   // 너무 가까우면 먼저 빠짐(수쳐 사거리 밖)
    let best = null, bs = -Infinity;
    (CONFIG.bushes || []).forEach(b => {
      const c = { x: b.x + b.w / 2, y: b.y + b.h / 2 }, dc = V.dist(c, p.pos);
      if (Geo.segDist(p.pos, ai.pos, c) < safe) return;   // 가는 길이 캐시 수쳐 사거리를 지나가면 제외
      const sc = -Math.abs(dc - MA.stalk) * 1.2 - V.dist(c, ai.pos) * 0.3;
      if (dc > safe && dc < MA.stalk + 4 && sc > bs) { bs = sc; best = c; }
    });
    if (best && bs > -MA.bushPrefer * 2 && V.dist(best, ai.pos) > 0.6) { ai.moveTarget = Geo.pushOut(V.add(best, { x: (Math.random() - 0.5) * 0.6, y: (Math.random() - 0.5) * 0.6 }), ai.r); return; }
    if (best && V.dist(best, ai.pos) <= 0.6) { ai.moveTarget = null; return; }   // 부쉬에서 대기
    ai.moveTarget = ai.pickSpot(p, MA.stalk, 1.4);
  },
  dodge(ai) {   // 투사체·수쳐 회피: 붙어 있고 궁이 되면 걸작으로 피함, 아니면 걸어서
    const p = Game.player, d = V.dist(ai.pos, p.pos);
    if (ai.diffKey !== 'easy' && this.canR(ai, p, d) && ai.mode === 'engage') { this.castR(ai, p); return true; }
    return false;
  },
  // 안 보일 때: 공통 추적(추정 위치에서 7m 유지 — 부쉬 속 캐시의 수쳐·Q 사거리 밖)을 쓰고, 그림자 가위로 부쉬를 찌름
  checkBush(ai, est) {
    const K = ai.kitCfg.Q;
    if (ai.cds.Q <= 0 && V.dist(ai.pos, est) <= K.range + K.front * 0.5) { this.castQ(ai, est); return true; }
    return false;
  },
  // ---------- 그리기 ----------
  draw(ai, ctx) {
    const K = ai.kitCfg.Q;
    for (const o of ai.objs) {   // 그림자 가위 예고: 지정 위치 부채꼴 + 중앙
      if (o.kind !== 'scissor' || o.done) continue;
      const apex = V.sub(o.pos, V.mul(o.dir, K.front)), an = V.ang(o.dir), h = K.angle / 2 * Math.PI / 180, k = clamp(o.t / o.dur, 0, 1);
      ctx.save(); ctx.globalAlpha = 0.12 + 0.3 * k; ctx.fillStyle = '#9d6bff';
      ctx.beginPath(); ctx.moveTo(apex.x, apex.y); ctx.arc(apex.x, apex.y, K.len, an - h, an + h); ctx.closePath(); ctx.fill();
      ctx.globalAlpha = 0.5; ctx.fillStyle = '#d9a8ff'; Draw.circle(ctx, o.pos.x, o.pos.y, K.centerR * k); ctx.fill(); ctx.restore();
    }
    const p = Game.player;
    if (ai.mark && !ai.mark.target.dead) {   // 영감 표식: 4초 뒤 활성(밝아짐)
      const M = ai.mark, ready = M.t >= ai.kitCfg.W.ready, u = M.target;
      KU.ring(ctx, u.pos, u.r + 0.35, ready ? '#ffd1ff' : '#b07cff', ready ? 0.9 : 0.5, !ready);
      if (!ready) { ctx.save(); ctx.globalAlpha = 0.8; ctx.strokeStyle = '#d9a8ff'; ctx.lineWidth = 0.08; ctx.beginPath(); ctx.arc(u.pos.x, u.pos.y, u.r + 0.5, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * M.t / ai.kitCfg.W.ready); ctx.stroke(); ctx.restore(); }
    }
    if (ai.shadow) { KU.fill(ctx, p.pos, p.r + 0.3, '#2a1840', 0.55); KU.ring(ctx, p.pos, p.r + 0.3 + 0.1 * Math.sin(Game.time * 20), '#b07cff', 0.9); }   // 걸작: 캐시 그림자 속
  },
};

// ---------- 2. 콤보 트레이너 ----------
Modes.combo = {
  name: '콤보 트레이너',
  parse(steps) {
    return steps.map(tok => {
      let s = String(tok).trim().toUpperCase(), gap = null, optional = false;
      const m = s.match(/~([\d.]+)$/); if (m) { gap = parseFloat(m[1]); s = s.slice(0, m.index); }
      if (s.endsWith('?')) { optional = true; s = s.slice(0, -1); }
      return { alts: s.split('|').map(x => x.trim()).filter(Boolean), optional, gap };
    });
  },
  start(o) {
    this.combo = o.combo; this.diff = o.diff || 'intro'; this.title = '콤보: ' + o.combo.name;
    this.steps = this.parse(o.combo.steps); this.state = 'idle'; this.idx = 0; this.marks = []; this.msg = null; this.resetT = 0; this.flags = {};
    const pl = Scene.player(10, 9);
    if (o.combo.weapon && pl.weapon !== o.combo.weapon) { pl.weapon = o.combo.weapon; FX.toast(`이 콤보는 ${CONFIG.basicAttack[o.combo.weapon].label} 기준입니다 (무기 자동 변경)`, CONFIG.theme.gold); }
    const C = CONFIG.modes.combo, pos = o.combo.setup === 'pair' ? [[14.6, 9], [16.2, 9]] : [[14.6, 9]];
    this.dummies = pos.map(([x, y]) => Scene.dummy(x, y, { hp: C.dummyHp, def: C.dummyDef, infinite: true }));
    Events.on('action', a => this.onAction(a));
    Events.on('eDouble', () => { if (this.state === 'run') this.flags.eDouble = true; });
  },
  limit(st) { const base = CONFIG.modes.combo.gap[this.diff]; if (!isFinite(base)) return Infinity; return st && st.gap ? st.gap : base; },
  onAction(a) {
    if (this.state === 'result') return;
    for (const nk of ['D1', 'D2', 'F']) if (a.k === nk && !this.steps.some(s => s.alts.includes(nk))) return;   // 콤보에 없는 보조 입력은 무시
    const now = Game.time, label = k => ({ AA: '평타', D1: 'D(1차)' }[k] || k);
    if (this.state === 'idle') {
      if (this.steps[0].alts.includes(a.k)) {
        this.state = 'run'; this.idx = 1; this.marks = [{ ok: true, gap: null }]; this.last = now; this.prevK = a.k; this.flags = {};
        Stats.comboAtt++; Sfx.play('click');
        if (this.idx >= this.steps.length) this.success();
      } else if (a.k !== 'AA') FX.toast(`콤보 시작 입력: ${this.steps[0].alts.join(' / ')}`, '#8a93a6');
      return;
    }
    let i = this.idx;
    while (i < this.steps.length && this.steps[i].optional && !this.steps[i].alts.includes(a.k)) { this.marks[i] = { skip: true }; i++; }
    const st = this.steps[i];
    if (!st || !st.alts.includes(a.k)) { this.fail(`${label(a.k)} 입력 (기대: ${st ? st.alts.map(label).join('/') : '-'})`); return; }
    const gap = now - this.last, lim = this.limit(st);
    if (gap > lim) { this.fail(`시간 초과 (${Math.round(gap * 1000)}ms > ${Math.round(lim * 1000)}ms)`); return; }
    this.marks[i] = { ok: true, gap }; this.idx = i + 1; this.last = now; this.prevK = a.k;
    if (this.steps.slice(this.idx).every(s => s.optional)) this.success();
  },
  success() {
    this.state = 'result'; this.resetT = CONFIG.modes.combo.resetDelay;
    if (this.combo.require === 'eDouble' && !this.flags.eDouble) { this.resultOk = false; this.msg = '실패: 2인 수쳐(관통 기절)가 발동하지 않음'; Stats.mistake('콤보 실패 - 2인 수쳐 미발동'); Sfx.play('fail'); return; }
    this.resultOk = true; Stats.comboOk++; this.msg = '콤보 성공!'; Sfx.play('combo');
    FX.text(Game.player.pos, 'COMBO!', CONFIG.theme.gold, 24, { bold: true, life: 1.2 }); Events.emit('comboOk');
  },
  fail(why) {
    this.state = 'result'; this.resultOk = false; this.msg = '실패: ' + why; this.resetT = CONFIG.modes.combo.resetDelay;
    this.marks[this.idx] = { fail: true }; Sfx.play('fail'); Stats.mistake('콤보 실패 - ' + why.split(' (')[0]);
  },
  update(dt) {
    if (this.state === 'run' && Game.time - this.last > this.limit(this.steps[this.idx])) this.fail('시간 초과');
    if (this.state === 'result' && (this.resetT -= dt) <= 0) this.reset();
  },
  reset() {
    this.state = 'idle'; this.idx = 0; this.marks = []; this.msg = null;
    const p = Game.player;
    for (const k in p.skills) { p.skills[k].cd = 0; p.skills[k].reduced = false; }
    Object.assign(p, { st: p.maxSt, enhanced: 0, daggerReady: 0, dualRecast: 0, msBuffs: [], hp: p.maxHp, shield: 0 });
    for (const d of this.dummies) d.resetState();
  },
  drawScreen(ctx, L) {
    const n = this.steps.length, cw = n > 7 ? 56 : 70, gap = n > 7 ? 5 : 8, total = n * cw + (n - 1) * gap, x0 = L.W / 2 - total / 2, y = 14;
    Draw.text(ctx, this.combo.name, L.W / 2, y + 2, { size: 15, bold: true, align: 'center' });
    this.steps.forEach((st, i) => {
      const x = x0 + i * (cw + gap), m = this.marks[i];
      let bg = '#1b2030', bd = '#2a3140';
      if (m && m.ok) { bg = '#163a37'; bd = CONFIG.theme.accent2; } else if (m && m.fail) { bg = '#3a1620'; bd = CONFIG.theme.accent; }
      else if (m && m.skip) { bg = '#15181f'; } else if (this.state === 'run' && i === this.idx) bd = '#ffffff';
      Draw.rr(ctx, x, y + 14, cw, 34, 7); ctx.fillStyle = bg; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = bd; ctx.stroke();
      const lab = st.alts.map(k => ({ AA: '평타', D1: 'D1' }[k] || k)).join('/');
      Draw.text(ctx, st.optional ? `(${lab})` : lab, x + cw / 2, y + 36, { size: 14, bold: true, align: 'center', color: m && m.skip ? '#666' : '#fff' });
      if (m && m.ok && m.gap != null) Draw.text(ctx, Math.round(m.gap * 1000) + 'ms', x + cw / 2, y + 62, { size: 11, align: 'center', color: CONFIG.theme.accent2 });
    });
    const lim = CONFIG.modes.combo.gap[this.diff], dl = { intro: '입문', skilled: '숙련', master: '마스터' }[this.diff];
    Draw.text(ctx, `성공 ${Stats.comboOk} / 시도 ${Stats.comboAtt} (${pct(Stats.comboOk, Stats.comboAtt)}) · 난이도 ${dl}${isFinite(lim) ? ` (간격 ≤ ${lim}s)` : ''}`, L.W / 2, y + 82, { size: 12, align: 'center', color: '#8a93a6' });
    if (this.msg) Draw.text(ctx, this.msg, L.W / 2, y + 108, { size: 18, bold: true, align: 'center', color: this.resultOk ? CONFIG.theme.gold : CONFIG.theme.accent, stroke: true });
  },
  side() {
    return `<h4>🧩 콤보 가이드</h4><div style="line-height:1.6;color:#c9cfdb">${esc(this.combo.tip || '')}</div>
      <h5>현황</h5>${kv('성공 / 시도', `${Stats.comboOk} / ${Stats.comboAtt}`)}${kv('완성률', pct(Stats.comboOk, Stats.comboAtt))}${kv('강화 평타', Stats.enhAA)}
      <h5>팁</h5><div style="color:#8a93a6;line-height:1.5">우클릭으로 허수아비를 지정하면 평타가 나갑니다. 성공/실패 후 쿨타임이 자동 초기화됩니다.</div>`;
  },
  result() {
    return { key: `combo:${this.combo.id}:${this.diff}`, recTitle: `콤보 ${this.combo.name} (${this.diff})`, score: Stats.comboOk, scoreLabel: '콤보 성공 횟수',
      modeRatio: Stats.comboAtt ? Stats.comboOk / Stats.comboAtt : 0, modeLabel: '콤보 완성률', weights: { acc: 20, waste: 0, mistake: 20, mode: 60 } };
  },
};

// ---------- 4. 회피 수련 ----------
Modes.dodge = {
  name: '회피 수련',
  start(o) {
    this.title = this.name; Scene.player(16, 9); Game.cdMul = CONFIG.modes.dodge.cdMul;
    this.lives = this.maxLives = o.lives || CONFIG.modes.dodge.lives; this.t = 0; this.spawnT = 1.2; this.hz = []; this.k0 = o.startK || 0;
    this.turrets = [{ x: 1, y: 1 }, { x: 31, y: 1 }, { x: 1, y: 17 }, { x: 31, y: 17 }, { x: 16, y: 0.6 }, { x: 16, y: 17.4 }, { x: 0.6, y: 9 }, { x: 31.4, y: 9 }];
  },
  level() { return 1 + this.k0 + this.t / 25; },
  update(dt) {
    const p = Game.player, L = this.level(); this.t += dt;
    if ((this.spawnT -= dt) <= 0) {
      const r = Math.random();
      if (r < 0.45) this.spawnLine(L); else if (r < 0.75) this.spawnCircle(L); else this.spawnDelayed(L);
      if (L > 2.2 && Math.random() < 0.25) [-0.25, 0.25].forEach(o => this.spawnLine(L, o));
      this.spawnT = Math.max(0.28, 1.45 / L);
    }
    for (const h of this.hz) this.updH(h, dt, p);
    this.hz = this.hz.filter(h => !h.dead);
  },
  spawnLine(L, off = 0) {
    const p = Game.player, tu = this.turrets[Math.floor(Math.random() * this.turrets.length)];
    const tgt = V.add(p.pos, V.mul(p.vel, Math.min(1, (L - 1) * 0.5) * 0.4));
    this.hz.push({ type: 'line', from: V.copy(tu), dir: V.fromAng(V.ang(V.sub(tgt, tu)) + off), tele: Math.max(0.35, 0.75 / Math.sqrt(L)), t: 0, speed: Math.min(20, 9 * Math.sqrt(L)), width: 0.7, pos: null, traveled: 0 });
  },
  spawnCircle(L) {
    const c = V.add(Game.player.pos, V.mul(V.fromAng(Math.random() * 6.28), Math.random() * 1.4));
    this.hz.push({ type: 'circle', c, r: rand(1.5, 2.3), tele: Math.max(CONFIG.modes.dodge.circleTeleMin, CONFIG.modes.dodge.circleTele / Math.pow(L, 0.45)), t: 0 });
  },
  spawnDelayed(L) { this.hz.push({ type: 'delayed', c: V.copy(Game.player.pos), follow: 0.5, r: 1.8, tele: Math.max(0.6, 1.3 / Math.pow(L, 0.35)), t: 0 }); },
  updH(h, dt, p) {
    h.t += dt;
    if (h.type === 'line') {
      if (h.t < h.tele) return;
      if (!h.pos) h.pos = V.copy(h.from);
      const prev = V.copy(h.pos), step = h.speed * dt; h.pos = V.add(h.pos, V.mul(h.dir, step)); h.traveled += step;
      if (Geo.segDist(p.pos, prev, h.pos) <= p.r + h.width / 2 && this.hitPlayer()) h.dead = true;
      if (h.traveled > 45) h.dead = true;
    } else if (h.type === 'circle') {
      if (h.t >= h.tele) { if (V.dist(p.pos, h.c) <= h.r + p.r * 0.5) this.hitPlayer(); FX.ring(h.c, h.r * 0.6, h.r, '#b56cff', 0.3, 0.15); h.dead = true; }
    } else {
      if (h.t < h.follow) h.c = V.copy(p.pos);
      if (h.t >= h.follow + h.tele) { if (V.dist(p.pos, h.c) <= h.r + p.r * 0.5) this.hitPlayer(); FX.burst(h.c, '#ff7b3b', 18, 6); FX.ring(h.c, 0.3, h.r, '#ff7b3b', 0.3, 0.15); h.dead = true; }
    }
  },
  hitPlayer() {
    const p = Game.player; if (p.invuln > 0) return false;
    p.invuln = 0.8; p.flash = 0.2; this.lives--; Stats.playerHits++; Stats.takenTotal += 1; Stats.hitPositions.push(V.copy(p.pos));
    Events.emit('playerHit'); FX.addShake(10); Sfx.play('hurt'); FX.text(p.pos, '피격!', '#ff5d5d', 17, { bold: true });
    if (this.lives <= 0) Game.finish('dead');
    return true;
  },
  drawWorld(ctx) {
    for (const t of this.turrets) { ctx.fillStyle = '#6b4bb3'; ctx.beginPath(); ctx.moveTo(t.x, t.y - 0.35); ctx.lineTo(t.x + 0.35, t.y); ctx.lineTo(t.x, t.y + 0.35); ctx.lineTo(t.x - 0.35, t.y); ctx.fill(); }
    for (const h of this.hz) {
      const k = clamp(h.t / (h.tele + (h.follow || 0)), 0, 1);
      if (h.type === 'line') {
        if (!h.pos) { ctx.save(); ctx.translate(h.from.x, h.from.y); ctx.rotate(V.ang(h.dir)); ctx.fillStyle = `rgba(255,70,90,${0.08 + 0.25 * k})`; ctx.fillRect(0, -h.width / 2, 45, h.width); ctx.restore(); }
        else { ctx.save(); ctx.translate(h.pos.x, h.pos.y); ctx.rotate(V.ang(h.dir)); ctx.fillStyle = '#ff5d7a'; ctx.shadowColor = '#ff5d7a'; ctx.shadowBlur = 12; ctx.fillRect(-0.7, -h.width / 2, 1.4, h.width); ctx.restore(); }
      } else {
        ctx.fillStyle = h.type === 'circle' ? `rgba(181,108,255,${0.1 + 0.2 * k})` : `rgba(255,123,59,${0.1 + 0.2 * k})`;
        ctx.beginPath(); ctx.arc(h.c.x, h.c.y, h.r, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = h.type === 'circle' ? '#b56cff' : '#ff7b3b'; ctx.lineWidth = 0.06;
        if (h.type === 'delayed') ctx.setLineDash([0.25, 0.15]);
        ctx.beginPath(); ctx.arc(h.c.x, h.c.y, h.type === 'circle' ? h.r * k : h.r * (1 - k * 0.85) + 0.05, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
      }
    }
  },
  drawScreen(ctx, L, oy = 0) {
    Draw.text(ctx, '♥'.repeat(Math.max(0, this.lives)) + '♡'.repeat(Math.max(0, this.maxLives - this.lives)), L.W / 2, 24 + oy, { size: 22, align: 'center', color: '#ff5d7a' });
    Draw.text(ctx, `생존 ${fmt(this.t, 1)}s · 단계 ${fmt(this.level(), 1)}`, L.W / 2, 48 + oy, { size: 14, bold: true, align: 'center', stroke: true });
  },
  side() { return `<h4>💨 회피 수련</h4>${kv('생존 시간', fmt(this.t, 1) + 's')}${kv('피격', Stats.playerHits)}${kv('난이도 단계', fmt(this.level(), 2))}<h5>패턴</h5><div style="color:#8a93a6;line-height:1.6">빨간 선: 직선 투사체<br>보라 원: 장판 (안쪽 원이 차면 폭발)<br>주황 점선: 지연 폭발 (0.5초 추적 후 고정)<br>Q·점멸·D로 회피 가능 (쿨 40% 감소)</div>`; },
  result() { return { key: 'dodge', score: Math.round(this.t * 10) / 10, scoreLabel: '생존 시간(초)', modeRatio: clamp(this.t / 90, 0, 1), modeLabel: '생존 시간', weights: { acc: 0, waste: 0, mistake: 10, mode: 90 }, heatmap: Stats.hitPositions.slice() }; },
};

// ---------- 5. 1:1 결투 ----------
Modes.duel = {
  name: '1:1 결투',

    this.diff = o.diff || 'normal'; this.need = o.rounds === 1 ? 1 : 2;
    const keys = Object.keys(CONFIG.rangedMotifs);
    this.motifKey = o.motif && CONFIG.rangedMotifs[o.motif] ? o.motif : keys[Math.floor(Math.random() * keys.length)];   // 기본: 무작위
    this.motif = CONFIG.rangedMotifs[this.motifKey];
    const eb = o.enemyBuild && o.enemyBuild !== 'same' ? o.enemyBuild : Game.buildId;   // 상대 레벨: 캐시와 같게 / 직접 선택
    this.enemyStage = CONFIG.rangedAI.stages[eb] ? eb : 'mid';
    this.stageInfo = CONFIG.rangedAI.stages[this.enemyStage];
    this.title = `1:1 결투 vs ${this.motif.name} ${this.stageInfo.label} (${CONFIG.enemy.difficulty[this.diff].label})` + (Game.mapKey !== 'basic' ? ` · ${Game.map.name}` : '');
    this.animals = !!o.animals;
    this.wins = { p: 0, e: 0 }; this.round = 0; this.history = []; this.newRound();
  },
  newRound() {
    this.round++; Game.units = []; Game.projectiles = []; Game.zones = [];
    const sp = Game.map.spawns;
    Scene.player(sp.p.x, sp.p.y); this.enemy = new RangedDuelist(sp.e.x, sp.e.y, this.diff, this.motifKey, this.enemyStage); Game.units.push(this.enemy);
    if (this.animals) for (const a of Game.map.animals) Scene.animal(a.x, a.y, this.enemyStage);   // 야생동물(2인 수쳐 응용)
    this.snap = Stats.snapshot(); this.roundStart = Game.time; this.inter = null; this.ended = false;
    Game.freeze = 1.6; this.banner = { t: 1.6, text: `ROUND ${this.round}`, sub: `VS ${this.motif.name} ${this.stageInfo.label} · ${this.motif.weapon}` };
  },
  update(dt, frozen) {
    if (this.banner && (this.banner.t -= dt) <= 0) this.banner = null;
    if (this.inter) { if ((this.inter.t -= dt) <= 0) this.newRound(); return; }
    if (frozen || this.ended) return;
    if (this.enemy.dead) this.roundEnd('p'); else if (Game.player.dead) this.roundEnd('e');
  },
  roundEnd(w) {
    this.ended = true; this.wins[w]++;
    const St = Stats, s0 = this.snap, casts = {}, hits = {}, mist = {}, p = Game.player, e = this.enemy;
    for (const k of SKILL_KEYS) { casts[k] = (St.casts[k] || 0) - (s0.casts[k] || 0); hits[k] = (St.hits[k] || 0) - (s0.hits[k] || 0); }
    for (const k in St.mistakes) { const d = St.mistakes[k] - (s0.mistakes[k] || 0); if (d > 0) mist[k] = d; }
    const sum = { round: this.round, winner: w, time: Game.time - this.roundStart, dealt: St.dealtTotal - s0.dealt, taken: St.takenTotal - s0.taken, casts, hits,
      mistakes: Object.entries(mist).sort((a, b) => b[1] - a[1]).slice(0, 3), eDodge: e.stats.dodges, eS1: `${e.stats.s1Hits}/${e.stats.s1Casts}`, pHp: Math.max(0, p.hp / p.maxHp), eHp: Math.max(0, e.hp / e.maxHp) };
    this.history.push(sum);
    if (w === 'p') { Events.emit('roundWin'); Sfx.play('win'); } else Sfx.play('fail');
    if (this.wins.p >= this.need || this.wins.e >= this.need) { Game.finish('duelEnd'); return; }
    this.inter = { t: 4.5, sum }; Game.freeze = 999;
  },
  drawScreen(ctx, L, oy = 0) {
    Draw.text(ctx, `캐시 ${this.wins.p}  :  ${this.wins.e} ${this.motif.name}  ·  ROUND ${this.round}`, L.W / 2, 24 + oy, { size: 18, bold: true, align: 'center', stroke: true });
    if (this.banner) { Draw.text(ctx, this.banner.text, L.W / 2, L.H * 0.4, { size: 46, bold: true, align: 'center', color: CONFIG.theme.gold, stroke: true }); if (this.banner.sub) Draw.text(ctx, this.banner.sub, L.W / 2, L.H * 0.4 + 44, { size: 18, bold: true, align: 'center', color: this.motif.color, stroke: true }); }
    if (this.inter) {
      const s = this.inter.sum, w = 420, h = 230, x = L.W / 2 - w / 2, y = L.H * 0.22;
      Draw.panel(ctx, x, y, w, h);
      Draw.text(ctx, `ROUND ${s.round} — ${s.winner === 'p' ? '승리!' : '패배'}`, L.W / 2, y + 34, { size: 22, bold: true, align: 'center', color: s.winner === 'p' ? CONFIG.theme.gold : CONFIG.theme.accent });
      const lines = [
        `시간 ${fmt(s.time, 1)}s · 가한 피해 ${Math.round(s.dealt)} · 받은 피해 ${Math.round(s.taken)}`,
        `적중  ` + SKILL_KEYS.filter(k => s.casts[k] > 0).map(k => `${k} ${s.hits[k]}/${s.casts[k]}`).join('  ') || '-',
        `적 회피 시도 ${s.eDodge}회 · 적 스킬 적중 ${s.eS1}`,
        ...s.mistakes.map(([k, v]) => `⚠ ${k} ×${v}`),
      ];
      lines.forEach((t, i) => Draw.text(ctx, t, L.W / 2, y + 70 + i * 24, { size: 13, align: 'center', color: i > 2 ? '#ffb347' : '#e6e9ef' }));
      Draw.text(ctx, `다음 라운드까지 ${Math.ceil(this.inter.t)}초`, L.W / 2, y + h - 16, { size: 12, align: 'center', color: '#8a93a6' });
    }
  },
  drawWorld(ctx) { if (this.enemy && this.enemy.drawExtra) this.enemy.drawExtra(ctx); },
  side() {
    const e = this.enemy; if (!e) return '';
    const M = this.motif;
    if (e.melee) {   // 근거리 암살자(다니엘): 상태·표식 + 대응 팁
      const st = { stalk: '서성이며 각 재는 중', engage: '진입!', retreat: '후퇴' }[e.mode] + (e.stealthT > 0 ? ' · 은신' : '') + (e.shadow ? ' · 걸작(대상 지정 불가)' : '');
      const mk = e.mark ? kv('영감 표식', e.mark.t >= e.kitCfg.W.ready ? `<b style="color:#ffd1ff">활성 — 공격받으면 폭발 ${Math.round(e.mark.acc)}</b>` : `${fmt(e.kitCfg.W.ready - e.mark.t, 1)}s 후 활성 (축적 ${Math.round(e.mark.acc)})`) : '';
      return `<h4>⚔ vs ${M.name} Lv${e.level} (${M.weapon})</h4>${kv('적 체력', `${Math.round(Math.max(0, e.hp))} / ${e.maxHp}`)}${kv('공격력 / 공속', `${e.ad} / ${fmt(e.curAs(), 2)}`)}${kv('치명 / 평타 증폭 / 방관', `${Math.round(e.critChance * 100)}% / ${Math.round(e.aaAmp * 100)}% / ${Math.round(e.pen * 100)}%`)}${kv('방어력', e.def)}${kv('상태', st)}${mk}${['Q', 'W', 'E', 'R', 'D'].map(k => kv(`${k === 'D' ? '무기' : k} ${e.kitCfg[k].name}`, e.cds[k] > 0 ? fmt(e.cds[k], 1) + 's' : (k === 'D' && e.cloakT > 0 ? '단검 재사용 가능' : '준비'))).join('')}
      <h5>팁</h5><div style="color:#8a93a6;line-height:1.5">다니엘은 정면으로 싸우지 않습니다. 6m 근처(부쉬 선호)에서 서성이다가 <b>캐시의 E(수쳐)·Q가 빠지거나 체력이 깎이면</b> 망토 → E 은신 돌진 → 건너편 순간이동 평타 → 가위(Q)+영감(W) → 단검 → R 걸작으로 들어옵니다. 은신 연기를 보면 바로 대비하고 <b>E 수쳐는 진입 순간을 위해 아껴 두세요</b>. 걸작(R) 중엔 대상 지정 불가 + 0.5초 침묵 — 빠져나오는 위치를 노리세요. 보라색 링(영감)이 밝아지면 맞는 순간 축적 피해가 터집니다.</div>`;
    }
    return `<h4>⚔ vs ${M.name} Lv${e.level} (${M.weapon})</h4>${kv('적 체력', `${Math.round(Math.max(0, e.hp))} / ${e.maxHp}`)}${kv('공격력 / 스킬 증폭', `${e.ad} / ${e.sp}`)}${kv('공속 / 치명 / 방관', `${e.as} / ${Math.round(e.critChance * 100)}% / ${Math.round(e.pen * 100)}%`)}${kv('방어력', e.def)}${kv('평타 사거리', fmt(e.aaRange(), 2) + 'm' + (e.stance ? (e.stance === 'short' ? ' (단궁)' : ' (화궁)') : ''))}${['Q', 'W', 'E', 'R', 'D'].filter(k => e.kitCfg[k]).map(k => kv(`${k === 'D' ? '무기' : k} ${e.kitCfg[k].name}`, e.cds[k] > 0 ? fmt(e.cds[k], 1) + 's' : '준비')).join('')}
      <h5>팁</h5><div style="color:#8a93a6;line-height:1.5">원딜은 쏘고 움직이며(카이팅), 캐시의 E·Q가 준비돼 있으면 평타 사이사이 E 사거리(5.5m) 밖으로 빠집니다. 평타를 쏘려면 사거리(4.85~6m) 안으로 들어와야 하니 그 순간을 노리세요. E 예고선을 보면 좌우로 피하고, 벽 근처는 피합니다. 이동기가 빠진 순간이 진입 타이밍.</div>`;
  },
  result() {

    return { key: 'duel:' + this.diff, recTitle: this.title, score: this.wins.p * 100 - this.wins.e * 50, scoreLabel: `점수 (${this.wins.p}승 ${this.wins.e}패)`,
      modeRatio: t ? this.wins.p / t : 0, modeLabel: '라운드 승률', weights: { acc: 35, waste: 15, mistake: 15, mode: 30 },
      extraHtml: `<h3>라운드 요약</h3><table><tr><th>라운드</th><th>결과</th><th>시간</th><th>가한 피해</th><th>받은 피해</th><th>스킬 적중</th><th>적 회피</th></tr>${rows}</table>` };
  },
};

// ---------- 6. 챌린지 ----------
const ChallengeStore = { get() { return Store.get('challenges', {}); }, set(id, stars) { const a = this.get(); if (!a[id] || stars > a[id]) a[id] = stars; Store.set('challenges', a); } };
Modes.challenge = {
  name: '챌린지',
  start(o) {
    const ch = o.ch; this.ch = ch; this.title = '챌린지: ' + ch.name; this.count = 0; this.elapsed = 0; this.hits = 0;
    this.base = Modes[ch.scene.type]; this.base.start(Object.assign({}, ch.scene, { challenge: true }));
    if (ch.goal.event) Events.on(ch.goal.event, d => { if (ch.goal.event === 'streak') this.count = Math.max(this.count, d.n); else this.count++; });
    Events.on('playerHit', () => this.hits++);
  },
  update(dt, frozen) {
    this.base.update(dt, frozen);
    if (frozen || Game.state !== 'play') return;
    this.elapsed += dt; const g = this.ch.goal;
    if (g.survive) { if (this.hits > g.maxHits) Game.finish('fail'); else if (this.elapsed >= g.survive) Game.finish('clear'); return; }
    if (this.count >= (g.count || g.reach)) { Game.finish('clear'); return; }
    if (this.elapsed >= this.ch.limit) Game.finish('timeout');
  },
  drawWorld(ctx) { if (this.base.drawWorld) this.base.drawWorld(ctx); },
  drawScreen(ctx, L) {
    const ch = this.ch, g = ch.goal, w = 460, x = L.W / 2 - w / 2;
    Draw.panel(ctx, x, 8, w, 56);
    Draw.text(ctx, `🏆 ${ch.name} — ${ch.desc}`, L.W / 2, 30, { size: 14, bold: true, align: 'center' });
    const prog = g.survive ? `생존 ${fmt(this.elapsed, 1)} / ${g.survive}s · 피격 ${this.hits}/${g.maxHits}` : `진행 ${Math.min(this.count, g.count || g.reach)} / ${g.count || g.reach} · 남은 시간 ${fmt(Math.max(0, ch.limit - this.elapsed), 1)}s`;
    Draw.text(ctx, prog, L.W / 2, 52, { size: 13, align: 'center', color: CONFIG.theme.accent2 });
    if (this.base.drawScreen) this.base.drawScreen(ctx, L, 62);
  },
  side() { return this.base.side ? this.base.side() : ''; },
  result(reason) {
    const ch = this.ch, cleared = reason === 'clear' || (reason === 'duelEnd' && this.count >= 1);
    let stars = 0;
    if (cleared) {
      if (ch.stars.time) { const [a, b, c] = ch.stars.time; stars = this.elapsed <= c ? 3 : this.elapsed <= b ? 2 : 1; }
      else { const [a, b, c] = ch.stars.hits; stars = this.hits <= c ? 3 : this.hits <= b ? 2 : 1; }
      ChallengeStore.set(ch.id, stars);
    }
    const idx = CONFIG.challenges.indexOf(ch), next = CONFIG.challenges[idx + 1];
    return { key: 'challenge:' + ch.id, recTitle: '챌린지 ' + ch.name, score: stars, scoreLabel: cleared ? '획득한 별' : '실패', modeRatio: stars / 3, modeLabel: '챌린지 별',
      weights: { acc: 25, waste: 15, mistake: 10, mode: 50 }, stars, cleared, nextCh: cleared && next ? next : null,
      extraHtml: `<h3>챌린지 결과</h3><div style="font-size:28px" class="stars">${'★'.repeat(stars)}${'☆'.repeat(3 - stars)}</div>
        <div class="sub">${cleared ? `클리어! 기록 ${fmt(this.elapsed, 1)}s${ch.stars.time ? ` (★2 ≤ ${ch.stars.time[1]}s · ★3 ≤ ${ch.stars.time[2]}s)` : ` · 피격 ${this.hits}회`}` : `실패 (${{ timeout: '시간 초과', fail: '피격 초과', dead: '피격 초과', duelEnd: '결투 패배' }[reason] || reason})`}${cleared && next ? ` · 다음 챌린지 「${esc(next.name)}」 해금` : ''}</div>` };
  },
};

// ============================== 게임 ==============================
const Game = {
  state: 'menu', paused: false, mode: null, modeId: null, opts: null, units: [], projectiles: [], zones: [], player: null,
  time: 0, freeze: 0, cdMul: 1, buildId: 'late',
  start(id, opts = {}) {
    Events.clear(); FX.reset(); Stats.reset();
    Object.assign(this, { units: [], projectiles: [], zones: [], player: null, time: 0, freeze: 0, cdMul: 1, modeId: id, opts, buildId: opts.build || Settings.build });
    this.mode = Modes[id]; Input.reset();
    // 맵 적용 (지형·부쉬). 지정이 없으면 기본 아레나
    this.mapKey = CONFIG.maps[opts.map] ? opts.map : 'basic'; this.map = CONFIG.maps[this.mapKey];
    CONFIG.walls = this.map.walls.map(w => Object.assign({}, w)); CONFIG.bushes = (this.map.bushes || []).map(b => Object.assign({}, b)); Vision.reveals = [];
    this.mode.start(opts);
    this.state = 'play'; this.paused = false; UI.hide();
  },
  restart() { this.start(this.modeId, this.opts); },
  step(dt) {
    if (this.freeze > 0) { this.freeze -= dt; this.mode.update(dt, true); FX.update(dt); return; }
    this.time += dt; Stats.tick(dt); Vision.update(dt);
    for (const u of this.units.slice()) u.update(dt);
    for (const pr of this.projectiles) pr.update(dt);
    this.projectiles = this.projectiles.filter(p => !p.dead);
    this.updateZones(dt);
    for (const u of this.units) if (u.dead && u.respawn && (u.deathT += dt) >= (u.respawnDelay || CONFIG.modes.dummy.respawn)) u.revive();
    this.mode.update(dt, false);
    FX.update(dt);
  },
  updateZones(dt) {
    const p = this.player;
    for (const z of this.zones) {
      z.t -= dt;
      if (z.type === 'heal' && p && !p.dead && Geo.inORect(z.from, z.dir, z.len, z.width / 2, p.pos, p.r)) {
        const R = CONFIG.skills.R; z.acc += p.heal(p.maxHp * (R.zoneHealPct + p.sp * R.zoneHealSp) / 100 * dt, true);
      }
      if (Math.random() < dt * 12) { const pt = V.add(V.add(z.from, V.mul(z.dir, Math.random() * z.len)), V.mul(V.perp(z.dir), (Math.random() - 0.5) * z.width)); FX.text(pt, '+', '#5dff9a', 12, { life: 0.7 }); }
      if ((z.accT -= dt) <= 0) { if (z.acc > 1) FX.text(p.pos, '+' + Math.round(z.acc), '#5dff9a', 12); z.acc = 0; z.accT = 0.5; }
    }
    this.zones = this.zones.filter(z => z.t > 0);
  },
  finish(reason) {
    if (this.state !== 'play') return;
    this.state = 'result';
    const r = this.mode.result(reason) || {}; r.title = r.title || this.mode.title;
    Grade.compute(r); Records.save(r); UI.showResults(r);
  },
  togglePause() {
    if (this.state !== 'play') return;
    this.paused = !this.paused;
    if (this.paused) { Input.unlock(); Input.rDown = false; UI.showPause(); } else UI.hide();
  },
  enemies() { return this.units.filter(u => u.team !== 0 && !u.dead && !(u.untargetable > 0)); },   // 대상 지정 불가(다니엘 걸작) 제외
  visibleEnemies() { return this.enemies().filter(e => Vision.visible(this.player, e)); },
  nearestEnemy(pos, range) { let best = null, bd = range; for (const e of this.visibleEnemies()) { const d = V.dist(pos, e.pos) - e.r; if (d <= bd) { bd = d; best = e; } } return best; },
  pickEnemyAt(pt, rad) { let best = null, bd = Infinity; for (const e of this.visibleEnemies()) { const d = V.dist(pt, e.pos); if (d <= rad + e.r && d < bd) { bd = d; best = e; } } return best; },
};

// ============================== 등급/기록 ==============================
const Grade = {
  compute(r) {
    const St = Stats, { c, h } = St.totalCasts();
    const wasteTot = Object.values(St.waste).reduce((a, b) => a + b, 0), mistakeCount = Object.values(St.mistakes).reduce((a, b) => a + b, 0);
    const comps = [
      { k: 'acc', label: '스킬 적중률', v: c ? h / c : 0.5 },
      { k: 'waste', label: '쿨타임 관리', v: St.t > 5 ? clamp(1 - wasteTot / (St.t * 4) * 2.5, 0, 1) : 1 },
      { k: 'mistake', label: '실수 관리', v: clamp(1 - mistakeCount / Math.max(0.5, St.t / 60) / 12, 0, 1) },
      { k: 'mode', label: r.modeLabel || '모드 목표', v: clamp(r.modeRatio ?? 0.5, 0, 1) },
    ];
    const w = Object.assign({ acc: 35, waste: 20, mistake: 20, mode: 25 }, r.weights || {});
    let sum = 0, ws = 0; for (const cp of comps) { cp.w = w[cp.k]; sum += cp.v * cp.w; ws += cp.w; }
    r.gradeScore = ws ? Math.round(sum / ws * 100) : 0;
    r.grade = r.gradeScore >= 85 ? 'S' : r.gradeScore >= 70 ? 'A' : r.gradeScore >= 55 ? 'B' : r.gradeScore >= 40 ? 'C' : 'D';
    r.components = comps;
    const weak = comps.filter(cp => cp.w > 0).sort((a, b) => a.v - b.v)[0];
    const p100 = v => Math.round(v * 100);
    const tips = {
      acc: v => `스킬 적중률 ${p100(v)}% → ${Math.min(100, p100(v) + 10)}% 목표. E는 상대 진행 방향 앞쪽을, W는 바깥 범위(3~4m) 거리를 맞추세요.`,
      waste: () => `교전 중 쿨이 돌아온 스킬을 오래 묵혔습니다. 콤보 사이클을 줄여 쿨 낭비 시간을 절반으로 줄여 보세요.`,
      mistake: () => `실수가 잦습니다. 아래 실수 분석에서 가장 많은 항목 하나만 집중 교정해 보세요.`,
      mode: () => `${r.modeLabel || '모드 목표'} 수치를 끌어올리는 것이 다음 목표입니다. 게임 속도를 0.7x로 낮춰 연습한 뒤 1.0x로 돌아오세요.`,
    };
    r.nextGoal = weak ? tips[weak.k](weak.v) : '';
  },
};
const Records = {
  all() { return Store.get('records', {}); },
  save(r) {
    if (!r.key) return;
    const all = this.all(), rec = all[r.key] || { best: null, hist: [] };
    r.prevBest = rec.best; r.isBest = rec.best === null || r.score > rec.best;
    if (r.isBest) rec.best = r.score;
    rec.hist.push({ s: r.score, g: r.grade, d: Date.now() }); rec.hist = rec.hist.slice(-10);
    rec.title = r.recTitle || r.title; rec.label = r.scoreLabel;
    all[r.key] = rec; Store.set('records', all); r.hist = rec.hist;
  },
};

// ============================== 입력 ==============================
const Input = {
  screen: { x: 0, y: 0 }, world: { x: 16, y: 9 }, aiming: null, amove: false,
  rDown: false, rLast: 0, locked: false, lockLostT: 0,
  reset() { this.aiming = null; this.amove = false; this.rDown = false; },
  // 우클릭 이동/공격 (누르고 있으면 계속 커서를 따라감 — 실제 게임처럼)
  rightCmd(hold) {
    const p = Game.player, w = this.world; if (!p) return;
    const t = Game.pickEnemyAt(w, 0.35);
    if (t) { if (p.attackTarget !== t) p.cmdAttack(t); } else if (!hold || !p.attackTarget) p.cmdMove(w);
  },
  tick() {   // 매 프레임: 우클릭 유지 이동
    if (!this.rDown || Game.state !== 'play' || Game.paused || !Game.player) return;
    const now = performance.now(); if (now - this.rLast < 90) return;
    this.rLast = now; this.rightCmd(true);
  },
  moveBtn() { return Settings.moveButton === 'left' ? 0 : 2; },   // 이동 버튼: 우클릭(기본) / 좌클릭(웨일 등 브라우저 마우스 제스처 회피)
  setPos(x, y) { this.screen = { x, y }; this.world = Render.toWorld(x, y); },
  // 마우스 잠금(Pointer Lock): 웨일·비발디 등 브라우저의 우클릭 드래그 '마우스 제스처'가 게임 입력을 가로채지 않도록 커서를 캔버스에 가둠
  wantLock() { return Settings.pointerLock && Game.state === 'play' && !Game.paused; },
  lock(cv) { if (this.wantLock() && !this.locked && cv.requestPointerLock) { try { const r = cv.requestPointerLock(); if (r && r.catch) r.catch(() => {}); } catch (e) { /* 미지원 */ } } },
  unlock() { if (document.pointerLockElement && document.exitPointerLock) document.exitPointerLock(); },
  init(cv) {
    const block = e => { e.preventDefault(); e.stopPropagation(); };
    cv.addEventListener('contextmenu', block);
    window.addEventListener('contextmenu', e => { if (Game.state === 'play') block(e); });
    document.addEventListener('pointerlockchange', () => {
      this.locked = document.pointerLockElement === cv;
      if (!this.locked) { this.rDown = false; if (Game.state === 'play' && !Game.paused && Settings.pointerLock) { this.lockLostT = performance.now(); Game.togglePause(); } }   // Esc로 잠금이 풀리면 일시정지
    });
    cv.addEventListener('mousemove', e => {
      if (e.buttons & 2) block(e);   // 우클릭 드래그를 페이지가 소비 (제스처 확장 프로그램 대응)
      if (this.locked) this.setPos(clamp(this.screen.x + e.movementX, 0, window.innerWidth - 1), clamp(this.screen.y + e.movementY, 0, window.innerHeight - 1));
      else this.setPos(e.clientX, e.clientY);
    });
    window.addEventListener('mouseup', e => { if (e.button === this.moveBtn()) this.rDown = false; if (e.button === 2 && Game.state === 'play') block(e); });
    cv.addEventListener('mousedown', e => {
      Sfx.init(); if (!this.locked) this.setPos(e.clientX, e.clientY);
      if (e.button === 2) block(e);
      if (Game.state !== 'play' || Game.paused || !Game.player) return;
      this.lock(cv);
      const p = Game.player;
      const w = this.world, mb = this.moveBtn();
      if (e.button === 0 && (this.aiming || this.amove)) {   // 스킬 조준·공격 이동 확정은 항상 좌클릭
        if (this.aiming) { p.cmdSkill(this.aiming, w); this.aiming = null; } else { p.cmdAttackMove(w); this.amove = false; }
      } else if (e.button === mb) {   // 이동/공격 (누르고 있으면 계속 따라감)
        this.aiming = null; this.amove = false; this.rDown = true; this.rLast = performance.now();
        this.rightCmd(false);
        if (mb === 2 && !Settings.whaleHint && /Whale\//.test(navigator.userAgent)) { Settings.whaleHint = true; saveSettings(); FX.toast("웨일 마우스 제스처가 뜨면: 설정 → 마우스 → 이동 버튼 '좌클릭'", '#4aa3ff'); }
      } else if (e.button === 2) { this.aiming = null; this.amove = false; }   // 좌클릭 이동 모드: 우클릭 = 조준 취소
      
    });
    window.addEventListener('keydown', e => this.onKey(e));
    window.addEventListener('keyup', e => this.onKeyUp(e));
  },
  onKey(e) {
    if (UI.waitKey) {
      e.preventDefault();
      if (e.key === 'Escape') { UI.waitKey = null; UI.showSettings(UI.settingsBack); return; }
      const k = e.key.toLowerCase(); if (k.length !== 1 || k === ' ') return;
      for (const a in Settings.keys) if (Settings.keys[a] === k) Settings.keys[a] = Settings.keys[UI.waitKey];   // 충돌 시 맞바꿈
      Settings.keys[UI.waitKey] = k; UI.waitKey = null; saveSettings(); UI.showSettings(UI.settingsBack); return;
    }
    if (e.key === 'Tab') { e.preventDefault(); Settings.side = !Settings.side; saveSettings(); Side.update(); return; }
    if (e.key === 'Escape') {
      if (Game.state !== 'play') return;
      if (performance.now() - Input.lockLostT < 400) return;   // 마우스 잠금 해제용 Esc는 이미 일시정지로 처리됨
      if (!Game.paused && this.aiming) { this.aiming = null; return; }
      if (!Game.paused && this.amove) { this.amove = false; return; }
      Game.togglePause(); return;
    }
    if (Game.state !== 'play' || Game.paused || e.repeat || !Game.player) return;
    const k = e.key.toLowerCase(), act = Object.keys(Settings.keys).find(a => Settings.keys[a] === k);
    if (!act) return;
    e.preventDefault(); Sfx.init();
    const p = Game.player, w = this.world;
    if (act === 'S') { p.cmdStop(); this.aiming = null; return; }
    if (act === 'A') { this.amove = true; this.aiming = null; return; }
    // 즉시 발동형: 단검 1차(유틸)
    if (act === 'D' && p.weapon === 'dagger' && p.daggerReady <= 0) { p.cmdSkill('D', w); return; }
    const mode = castModeOf(act);
    if (mode === 'smart') { p.cmdSkill(act, w); this.aiming = null; return; }           // 누르면 즉시 발동
    if (mode === 'release') { this.aiming = act; this.amove = false; this.holdKey = act; return; }   // 떼면 발동
    if (this.aiming === act) { p.cmdSkill(act, w); this.aiming = null; return; }   // 같은 키 두 번 = 시전
    this.aiming = act; this.amove = false;
  },
  onKeyUp(e) {
    if (!this.holdKey || Game.state !== 'play' || Game.paused || !Game.player) { this.holdKey = null; return; }
    const act = Object.keys(Settings.keys).find(a => Settings.keys[a] === e.key.toLowerCase());
    if (act !== this.holdKey) return;
    this.holdKey = null;
    if (this.aiming === act) { Game.player.cmdSkill(act, this.world); this.aiming = null; }
  },
};

// ============================== 그리기 도우미 ==============================
const FONT = "'Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif";
const Draw = {
  rr(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); },
  text(ctx, s, x, y, o = {}) {
    ctx.font = `${o.bold ? '700 ' : ''}${o.size || 13}px ${FONT}`; ctx.textAlign = o.align || 'left'; ctx.textBaseline = 'middle';
    if (o.stroke) { ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,.85)'; ctx.strokeText(s, x, y); }
    ctx.fillStyle = o.color || '#e6e9ef'; ctx.fillText(s, x, y);
  },
  panel(ctx, x, y, w, h) { Draw.rr(ctx, x, y, w, h, 10); ctx.fillStyle = 'rgba(14,17,24,.92)'; ctx.fill(); ctx.lineWidth = 1; ctx.strokeStyle = '#2a3140'; ctx.stroke(); },
  oRect(ctx, s, ang, len, w) { ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(ang); ctx.fillRect(0, -w / 2, len, w); ctx.strokeRect(0, -w / 2, len, w); ctx.restore(); },
  circle(ctx, x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); },
};

// ============================== 렌더 ==============================
const HUD_H = 118;
const Render = {
  init() { this.cv = document.getElementById('game'); this.ctx = this.cv.getContext('2d'); this.resize(); window.addEventListener('resize', () => this.resize()); },
  resize() {
    const dpr = Math.min(2, window.devicePixelRatio || 1), W = innerWidth, H = innerHeight;
    this.cv.width = W * dpr; this.cv.height = H * dpr;
    const ppm = Math.min((W - 20) / CONFIG.world.w, (H - HUD_H - 20) / CONFIG.world.h);
    this.L = { W, H, dpr, ppm, ox: (W - CONFIG.world.w * ppm) / 2, oy: Math.max(10, (H - HUD_H - CONFIG.world.h * ppm) / 2) };
  },
  toWorld(sx, sy) { const L = this.L; return { x: (sx - L.ox) / L.ppm, y: (sy - L.oy) / L.ppm }; },
  toScreen(p) { const L = this.L; return { x: L.ox + p.x * L.ppm + this.shx, y: L.oy + p.y * L.ppm + this.shy }; },
  frame() {
    Input.tick();
    const { ctx, L } = this, T = CONFIG.theme;
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#07090d'; ctx.fillRect(0, 0, this.cv.width, this.cv.height);
    const sh = Settings.reduceShake ? 0 : FX.shake; this.shx = (Math.random() - 0.5) * sh; this.shy = (Math.random() - 0.5) * sh;
    ctx.setTransform(L.dpr * L.ppm, 0, 0, L.dpr * L.ppm, L.dpr * (L.ox + this.shx), L.dpr * (L.oy + this.shy));
    this.drawWorld(ctx, T);
    ctx.setTransform(L.dpr, 0, 0, L.dpr, 0, 0);
    if (Game.state === 'menu') return;
    this.drawOverheads(ctx);
    this.drawTexts(ctx);
    if (Game.mode && Game.mode.drawScreen) Game.mode.drawScreen(ctx, L, 0);
    HUD.draw(ctx, L);
    this.drawTopInfo(ctx, L);
    this.drawToasts(ctx, L);
    if (Input.locked) {   // 마우스 잠금 중엔 OS 커서가 숨겨지므로 직접 그림
      const s = Input.screen; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(s.x - 9, s.y); ctx.lineTo(s.x - 3, s.y); ctx.moveTo(s.x + 3, s.y); ctx.lineTo(s.x + 9, s.y); ctx.moveTo(s.x, s.y - 9); ctx.lineTo(s.x, s.y - 3); ctx.moveTo(s.x, s.y + 3); ctx.lineTo(s.x, s.y + 9); ctx.stroke();
    }
    if (Input.amove) { Draw.circle(ctx, Input.screen.x, Input.screen.y, 10); ctx.strokeStyle = '#ffb347'; ctx.lineWidth = 2; ctx.stroke(); Draw.text(ctx, 'A', Input.screen.x + 13, Input.screen.y - 10, { size: 13, bold: true, color: '#ffb347' }); }
  },
  drawWorld(ctx, T) {
    const W = CONFIG.world.w, H = CONFIG.world.h;
    ctx.fillStyle = T.floor; ctx.fillRect(0, 0, W, H);
    ctx.lineWidth = 0.02;
    for (let x = 0; x <= W; x++) { ctx.strokeStyle = x % 4 ? T.grid : '#1f2636'; ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = 0; y <= H; y++) { ctx.strokeStyle = y % 4 ? T.grid : '#1f2636'; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    ctx.strokeStyle = '#2f3850'; ctx.lineWidth = 0.08; ctx.strokeRect(0, 0, W, H);
    // 치유 영역
    for (const z of Game.zones) {
      ctx.save(); ctx.globalAlpha = 0.18 + 0.12 * Math.sin(Game.time * 6); ctx.fillStyle = '#5dff9a'; ctx.strokeStyle = 'rgba(93,255,154,.6)'; ctx.lineWidth = 0.04;
      Draw.oRect(ctx, z.from, V.ang(z.dir), z.len, z.width); ctx.restore();
    }
    if (Game.mode && Game.mode.drawWorld && Game.state !== 'menu') Game.mode.drawWorld(ctx);
    // 벽
    for (const w of CONFIG.walls) { ctx.fillStyle = T.wall; ctx.fillRect(w.x, w.y, w.w, w.h); ctx.strokeStyle = '#3c4660'; ctx.lineWidth = 0.06; ctx.strokeRect(w.x, w.y, w.w, w.h); }
    if (Game.state === 'menu') return;
    this.drawIndicators(ctx, T);
    for (const m of FX.marks) { const k = m.life / m.max; ctx.strokeStyle = m.color; ctx.globalAlpha = k; ctx.lineWidth = 0.05; Draw.circle(ctx, m.x, m.y, 0.15 + (1 - k) * 0.4); ctx.stroke(); ctx.globalAlpha = 1; }
    for (const t of FX.trails) { ctx.globalAlpha = (t.life / t.max) * 0.5; ctx.strokeStyle = t.color; ctx.lineWidth = t.width; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(t.a.x, t.a.y); ctx.lineTo(t.b.x, t.b.y); ctx.stroke(); }
    ctx.globalAlpha = 1; ctx.lineCap = 'butt';
    for (const u of Game.units.slice().sort((a, b) => a.pos.y - b.pos.y)) this.drawUnit(ctx, u, T);
    this.drawBushes(ctx);
    for (const pr of Game.projectiles) this.drawProjectile(ctx, pr, T);
    for (const s of FX.slashes) {
      const k = s.life / s.max; ctx.globalAlpha = k * 0.55; ctx.fillStyle = s.color;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.R, s.ang - s.half, s.ang + s.half); ctx.arc(s.x, s.y, s.inner || 0, s.ang + s.half, s.ang - s.half, true); ctx.closePath(); ctx.fill();
      if (s.inner) { ctx.globalAlpha = k * 0.9; ctx.strokeStyle = '#fff'; ctx.lineWidth = 0.05; ctx.beginPath(); ctx.arc(s.x, s.y, s.inner, s.ang - s.half, s.ang + s.half); ctx.stroke(); }
    }
    for (const a of FX.arcs) {
      const k = a.life / a.max, end = V.add(a.a, V.mul(a.dir, a.len)), ctrl = V.add(V.add(a.a, V.mul(a.dir, a.len * 0.5)), V.mul(V.perp(a.dir), a.bend));
      ctx.lineCap = 'round';
      for (const [col, w, al] of [[a.color, a.width, 0.6], ['#ffffff', a.width * 0.25, 0.9]]) {
        ctx.globalAlpha = k * al; ctx.strokeStyle = col; ctx.lineWidth = w * (0.5 + 0.5 * k);
        ctx.beginPath(); ctx.moveTo(a.a.x, a.a.y); ctx.quadraticCurveTo(ctrl.x, ctrl.y, end.x, end.y); ctx.stroke();
      }
      ctx.lineCap = 'butt';
    }
    ctx.globalAlpha = 1;
    for (const r of FX.rings) { const k = 1 - r.life / r.max; ctx.globalAlpha = 1 - k; ctx.strokeStyle = r.color; ctx.lineWidth = r.width; Draw.circle(ctx, r.x, r.y, lerp(r.r0, r.r1, k)); ctx.stroke(); }
    for (const p of FX.parts) { ctx.globalAlpha = p.life / p.max; ctx.fillStyle = p.color; ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size); }
    ctx.globalAlpha = 1;
  },
  // 스킬 사거리/범위 미리보기
  drawCastTelegraph(ctx, p) {
    const c = p.cast; if (!c || c.phase !== 'windup') return;
    const k = clamp(c.t / Math.max(0.01, c.windup), 0, 1);
    if (c.k === 'E') {
      const L = S.E.range, w = 0.85;
      ctx.save(); ctx.translate(p.pos.x, p.pos.y); ctx.rotate(c.ang);
      ctx.fillStyle = 'rgba(20,24,40,.75)'; ctx.fillRect(0, -w / 2, L, w);
      const g = ctx.createLinearGradient(0, 0, L * k, 0); g.addColorStop(0, 'rgba(70,110,255,.85)'); g.addColorStop(1, 'rgba(120,160,255,.45)');
      ctx.fillStyle = g; ctx.fillRect(0, -w / 2, L * k, w);

// ============================== HUD ==============================
const HUD = {
  flashUntil: {},
  flash(k) { this.flashUntil[k] = performance.now() + 250; },
  draw(ctx, L) {
    const p = Game.player; if (!p) return;
    const pw = Math.min(L.W - 16, 660), ph = 104, x0 = (L.W - pw) / 2, y0 = L.H - ph - 8, T = CONFIG.theme;

    Draw.circle(ctx, cx, cy, 36); ctx.fillStyle = '#1b2030'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = T.accent; ctx.stroke();

    Draw.circle(ctx, cx + 27, cy + 25, 12); ctx.fillStyle = T.accent; ctx.fill();
    Draw.text(ctx, String(p.build.level), cx + 27, cy + 25, { size: 11, bold: true, align: 'center', color: '#fff' });
    // 체력/스태미나
    const slotsW = 6 * 52, bx = x0 + 98, bw = Math.max(100, pw - 98 - slotsW - 22), by = y0 + 14;
    const tot = Math.max(p.maxHp, p.hp + p.shield);
    ctx.fillStyle = '#0f131b'; ctx.fillRect(bx, by, bw, 18);
    ctx.fillStyle = '#3fd07a'; ctx.fillRect(bx, by, bw * Math.max(0, p.hp) / tot, 18);
    if (p.shield > 0) { ctx.fillStyle = '#e9eef7'; ctx.fillRect(bx + bw * Math.max(0, p.hp) / tot, by, bw * p.shield / tot, 18); }
    Draw.text(ctx, `${Math.round(Math.max(0, p.hp))} / ${p.maxHp}${p.shield > 0 ? ` (+${Math.round(p.shield)})` : ''}`, bx + bw / 2, by + 9.5, { size: 11, bold: true, align: 'center', stroke: true });
    ctx.fillStyle = '#0f131b'; ctx.fillRect(bx, by + 24, bw, 9); ctx.fillStyle = '#4aa3ff'; ctx.fillRect(bx, by + 24, bw * p.st / p.maxSt, 9);
    Draw.text(ctx, `SP ${Math.round(p.st)}`, bx + bw - 2, by + 40, { size: 10, align: 'right', color: '#8a93a6' });
    // 버프 표시
    const buffs = [];
    if (p.enhanced > 0) buffs.push(['강화 평타', '#ff9fb2']);
    if (p.shield > 0) buffs.push([`보호막 ${fmt(p.shieldT, 1)}`, '#e9eef7']);
    if (p.msBuffs.some(m => m.tag === 'pboost')) buffs.push(['이속↑', T.accent2]);
    if (p.daggerReady > 0) buffs.push([`단검 ${fmt(p.daggerReady, 1)}`, '#b18cff']);
    if (p.dualRecast > 0) buffs.push([`2식 ${fmt(p.dualRecast, 1)}`, '#ff8fa3']);
    if (p.unstoppable > 0) buffs.push(['저지 불가', T.gold]);
    let bxx = bx;
    for (const [t, c] of buffs) { ctx.font = `700 10px ${FONT}`; const w = ctx.measureText(t).width + 12; Draw.rr(ctx, bxx, by + 50, w, 16, 8); ctx.fillStyle = c + '33'; ctx.fill(); ctx.strokeStyle = c; ctx.lineWidth = 1; ctx.stroke(); Draw.text(ctx, t, bxx + w / 2, by + 58, { size: 10, bold: true, align: 'center', color: c }); bxx += w + 4; if (bxx > bx + bw - 30) break; }
    Draw.text(ctx, `AD ${p.ad} · SP ${p.sp} · AS ${p.as} · CDR ${Math.round(p.cdr * 100)}%`, bx, by + 80, { size: 10, color: '#8a93a6' });
    // 스킬 슬롯
    const sx0 = x0 + pw - slotsW - 8;
    ['Q', 'W', 'E', 'R', 'D', 'F'].forEach((k, i) => this.slot(ctx, p, k, sx0 + i * 52, y0 + 12, 46));
  },
  slot(ctx, p, k, x, y, s) {
    const def = p.skillDef(k), st = p.skills[k], T = CONFIG.theme;
    const special = (k === 'D' && (p.daggerReady > 0 || p.dualRecast > 0));
    const ready = st.lv > 0 && st.cd <= 0;
    Draw.rr(ctx, x, y, s, s, 8); ctx.fillStyle = '#1b2030'; ctx.fill();
    Draw.text(ctx, def.short, x + s / 2, y + s / 2 + 3, { size: 13, bold: true, align: 'center', color: ready || special ? '#fff' : '#9aa2b3' });
    if (st.lv <= 0) { Draw.rr(ctx, x, y, s, s, 8); ctx.fillStyle = 'rgba(0,0,0,.7)'; ctx.fill(); Draw.text(ctx, '잠김', x + s / 2, y + s / 2, { size: 11, align: 'center', color: '#666' }); }
    else if (st.cd > 0 && !special) {
      ctx.save(); Draw.rr(ctx, x, y, s, s, 8); ctx.clip();
      ctx.fillStyle = 'rgba(0,0,0,.68)'; ctx.beginPath(); ctx.moveTo(x + s / 2, y + s / 2);
      ctx.arc(x + s / 2, y + s / 2, s, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (st.cd / st.cdMax)); ctx.closePath(); ctx.fill(); ctx.restore();
      Draw.text(ctx, st.cd >= 1 ? String(Math.ceil(st.cd)) : fmt(st.cd, 1), x + s / 2, y + s / 2 + 3, { size: 16, bold: true, align: 'center', stroke: true });
    }
    const flash = (this.flashUntil[k] || 0) > performance.now();
    Draw.rr(ctx, x, y, s, s, 8); ctx.lineWidth = Input.aiming === k ? 3 : 2;
    ctx.strokeStyle = flash ? '#ff5d5d' : Input.aiming === k ? '#ffffff' : special ? T.gold : ready ? T.accent : '#2a3140'; ctx.stroke();
    Draw.text(ctx, (Settings.keys[k] || '').toUpperCase(), x + 5, y + 9, { size: 10, bold: true, color: '#c9cfdb' });
    const maxLv = k === 'R' || k === 'D' ? 3 : k === 'F' ? 0 : 5;
    for (let i = 0; i < maxLv; i++) { ctx.fillStyle = i < st.lv ? T.gold : '#2a3140'; ctx.fillRect(x + 4 + i * ((s - 8) / maxLv), y + s + 4, (s - 8) / maxLv - 2, 4); }
  },
};

const Charts = {
  setup(id, h) {
    const cv = document.getElementById(id); if (!cv) return null;
    const w = cv.clientWidth || 600, dpr = Math.min(2, devicePixelRatio || 1);
    cv.width = w * dpr; cv.height = h * dpr; cv.style.height = h + 'px';
    const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0); return { c, w, h };
  },
  empty(g, msg) { Draw.text(g.c, msg, g.w / 2, g.h / 2, { size: 12, align: 'center', color: '#8a93a6' }); },
  // 시간별 DPS (3초 이동 평균)
  dps(id) {
    const g = this.setup(id, 160); if (!g) return; const { c, w, h } = g;
    const n = Math.ceil(Stats.t), raw = Array.from({ length: n }, (_, i) => Stats.timeline[i] || 0);
    if (n < 2) return this.empty(g, '데이터 부족');
    const sm = raw.map((_, i) => { let s = 0, k = 0; for (let j = Math.max(0, i - 2); j <= i; j++) { s += raw[j]; k++; } return s / k; });
    const max = Math.max(1, ...sm), pl = 40, pb = 20, pt = 12;
    c.strokeStyle = '#2a3140'; c.lineWidth = 1;
    for (let i = 0; i <= 4; i++) { const y = pt + (h - pt - pb) * i / 4; c.beginPath(); c.moveTo(pl, y); c.lineTo(w - 8, y); c.stroke(); Draw.text(c, String(Math.round(max * (1 - i / 4))), pl - 4, y, { size: 10, align: 'right', color: '#8a93a6' }); }
    const X = i => pl + (w - pl - 8) * i / (n - 1), Y = v => pt + (h - pt - pb) * (1 - v / max);
    c.beginPath(); sm.forEach((v, i) => i ? c.lineTo(X(i), Y(v)) : c.moveTo(X(i), Y(v)));
    c.strokeStyle = CONFIG.theme.accent; c.lineWidth = 2; c.stroke();
    c.lineTo(X(n - 1), Y(0)); c.lineTo(X(0), Y(0)); c.closePath(); c.fillStyle = 'rgba(255,59,92,.12)'; c.fill();
    for (let s = 0; s < n; s += Math.max(5, Math.ceil(n / 8 / 5) * 5)) Draw.text(c, s + 's', X(s), h - 8, { size: 10, align: 'center', color: '#8a93a6' });
  },
  contrib(id) {
    const items = Object.entries(Stats.dmgBy).sort((a, b) => b[1] - a[1]);
    const g = this.setup(id, Math.max(60, items.length * 24 + 10)); if (!g) return; const { c, w } = g;
    if (!items.length) return this.empty(g, '가한 피해 없음');
    const tot = Stats.dealtTotal || 1, lw = 110;
    items.forEach(([k, v], i) => {
      const y = 8 + i * 24, bw = (w - lw - 70) * v / items[0][1];
      Draw.text(c, SRC_LABEL[k] || k, 8, y + 9, { size: 11, color: '#c9cfdb' });
      c.fillStyle = SRC_COLOR[k] || '#999'; Draw.rr(c, lw, y + 2, Math.max(2, bw), 14, 3); c.fill();
      Draw.text(c, `${Math.round(v)} (${Math.round(v / tot * 100)}%)`, lw + bw + 6, y + 9, { size: 11, color: '#e6e9ef' });
    });
  },
  trend(id, hist) {
    const g = this.setup(id, 120); if (!g) return; const { c, w, h } = g;
    if (!hist || hist.length < 2) return this.empty(g, '기록이 2판 이상 쌓이면 추이가 표시됩니다');
    const vals = hist.map(x => x.s), mn = Math.min(...vals), mx = Math.max(...vals), rg = mx - mn || 1, pl = 20, pr = 20, pt = 18, pb = 18;
    const X = i => pl + (w - pl - pr) * i / (hist.length - 1), Y = v => pt + (h - pt - pb) * (1 - (v - mn) / rg);
    c.beginPath(); vals.forEach((v, i) => i ? c.lineTo(X(i), Y(v)) : c.moveTo(X(i), Y(v))); c.strokeStyle = CONFIG.theme.accent2; c.lineWidth = 2; c.stroke();
    hist.forEach((x, i) => { Draw.circle(c, X(i), Y(x.s), 4); c.fillStyle = i === hist.length - 1 ? CONFIG.theme.gold : CONFIG.theme.accent2; c.fill(); Draw.text(c, `${x.s}`, X(i), Y(x.s) - 11, { size: 10, align: 'center', color: '#c9cfdb' }); Draw.text(c, x.g || '', X(i), h - 7, { size: 10, align: 'center', color: '#8a93a6' }); });
  },
  // 피격 위치 히트맵
  heat(id, pts) {
    const g = this.setup(id, 200); if (!g) return; const { c, w, h } = g;
    const sc = Math.min(w / CONFIG.world.w, h / CONFIG.world.h), ox = (w - CONFIG.world.w * sc) / 2, oy = (h - CONFIG.world.h * sc) / 2;
    c.fillStyle = CONFIG.theme.floor; c.fillRect(ox, oy, CONFIG.world.w * sc, CONFIG.world.h * sc);
    c.fillStyle = CONFIG.theme.wall; for (const wl of CONFIG.walls) c.fillRect(ox + wl.x * sc, oy + wl.y * sc, wl.w * sc, wl.h * sc);
    c.globalCompositeOperation = 'lighter';
    for (const p of pts) { const x = ox + p.x * sc, y = oy + p.y * sc, gr = c.createRadialGradient(x, y, 0, x, y, sc * 2.2); gr.addColorStop(0, 'rgba(255,80,60,.75)'); gr.addColorStop(1, 'rgba(255,80,60,0)'); c.fillStyle = gr; c.fillRect(x - sc * 2.2, y - sc * 2.2, sc * 4.4, sc * 4.4); }
    c.globalCompositeOperation = 'source-over';
    if (!pts.length) Draw.text(c, '피격 없음 — 완벽!', w / 2, h / 2, { size: 13, bold: true, align: 'center', color: CONFIG.theme.gold });
  },
};
