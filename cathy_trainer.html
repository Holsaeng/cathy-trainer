<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>캐시 수련장</title>
<style>
:root{--bg:#0b0d12;--panel:#141821f2;--line:#2a3140;--text:#e6e9ef;--muted:#8a93a6;--accent:#ff3b5c;--accent2:#3fd0c9;--gold:#ffc857}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;user-select:none}
canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,6,10,.78);backdrop-filter:blur(3px);z-index:10;padding:16px}
.overlay.show{display:flex}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 26px;width:min(940px,100%);max-height:94vh;overflow:auto;box-shadow:0 20px 60px #000a}
h1{font-size:30px;letter-spacing:2px}h1 span{color:var(--accent)}
h2{font-size:20px;margin-bottom:10px}h3{font-size:14px;margin:16px 0 8px;color:var(--accent2)}
.sub{color:var(--muted);font-size:13px;margin:6px 0 16px;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.mode{background:#1b2030;border:1px solid var(--line);border-radius:10px;padding:14px;cursor:pointer;transition:.15s}
.mode:hover{border-color:var(--accent);transform:translateY(-2px)}
.mode b{display:block;font-size:16px;margin-bottom:5px}.mode small{color:var(--muted);font-size:12px;line-height:1.5}
.btn{background:#222a3b;border:1px solid var(--line);color:var(--text);padding:7px 13px;border-radius:8px;cursor:pointer;font-size:13px;font-family:inherit}
.btn:hover{border-color:var(--accent)}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.btn.sel{border-color:var(--accent2);color:var(--accent2);background:#16302f}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:7px 0}
label{font-size:13px;color:var(--muted)}
input[type=number],select,textarea{background:#0f131b;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-family:inherit;width:100px}
select{width:auto;min-width:190px}
textarea{width:100%;height:80px;font-family:Consolas,monospace;font-size:12px}
table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--muted);font-weight:400}
.combo{padding:9px 12px;border:1px solid var(--line);border-radius:8px;margin:5px 0;cursor:pointer;background:#181d2a}
.combo.sel{border-color:var(--accent2)}.combo small{display:block;color:var(--muted);margin-top:4px;line-height:1.5}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:10px 0}
.stat{background:#1b2030;border-radius:8px;padding:9px 11px}.stat span{display:block;color:var(--muted);font-size:11px}.stat b{font-size:18px}
.grade{font-size:70px;font-weight:900;line-height:1}
.mist li{margin:3px 0 3px 18px;font-size:13px}
canvas.chart{width:100%;display:block;background:#0f131b;border-radius:8px;margin:6px 0}
#side{position:fixed;top:12px;right:12px;width:240px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:12px;z-index:5;display:none;pointer-events:none}
#side.show{display:block}#side h4{font-size:13px;margin-bottom:6px;color:var(--accent2)}#side h5{font-size:11px;color:var(--muted);margin:8px 0 4px;font-weight:400}
.kv{display:flex;justify-content:space-between;margin:2px 0}.kv span{color:var(--muted)}
.sbar{height:13px;background:#0f131b;border-radius:3px;margin:2px 0;position:relative;overflow:hidden}
.sbar i{position:absolute;left:0;top:0;bottom:0}.sbar em{position:relative;font-style:normal;font-size:10px;padding-left:4px;line-height:13px}
.stars{color:var(--gold);letter-spacing:2px}.lock{color:var(--muted)}
kbd{background:#222a3b;border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:12px}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="side"></div>
<div id="overlay" class="overlay show"><div class="card" id="card"></div></div>
<script>
'use strict';

 *       → 전투(Combat/Passive) → 엔티티(Unit/Cathy) → 스킬(Impl) → 투사체
 *       → AI(표적/결투) → 통계(Stats) → 모드(Modes) → 게임(Game) → 입력(Input)
 *       → 렌더(Render/HUD) → UI(메뉴/결과/차트)
 * 단위: 거리 m, 시간 s, 속도 m/s.  스킬 상태: 대기 → 선딜 → 발동 → 후딜 → 쿨타임

// ============================== 유틸 ==============================
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const V = {
  add: (a, b) => ({ x: a.x + b.x, y: a.y + b.y }), sub: (a, b) => ({ x: a.x - b.x, y: a.y - b.y }),
  mul: (a, s) => ({ x: a.x * s, y: a.y * s }), len: a => Math.hypot(a.x, a.y), dist: (a, b) => Math.hypot(a.x - b.x, a.y - b.y),
  norm: a => { const l = Math.hypot(a.x, a.y); return l > 1e-9 ? { x: a.x / l, y: a.y / l } : { x: 1, y: 0 }; },
  dot: (a, b) => a.x * b.x + a.y * b.y, perp: a => ({ x: -a.y, y: a.x }), ang: a => Math.atan2(a.y, a.x),
  fromAng: t => ({ x: Math.cos(t), y: Math.sin(t) }), lerp: (a, b, t) => ({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t }),
  copy: a => ({ x: a.x, y: a.y }),
};
const angDiff = (a, b) => { let d = a - b; while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2; return d; };
const lv = (v, l) => Array.isArray(v) ? v[clamp(l - 1, 0, v.length - 1)] : v;   // 레벨별 수치 조회
const fmt = (n, d = 0) => Number(n).toFixed(d);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const SKILL_KEYS = ['Q', 'W', 'E', 'R', 'D'];
const SRC_LABEL = { Q: 'Q 동맥절제술', W: 'W 앰퓨테이션', E: 'E 수쳐', 'E충돌': 'E 충돌', R: 'R 이머전시 OP', D: 'D 무기 스킬', AA: '기본 공격', 'AA+': '강화 평타', P: '패시브 외상' };
const SRC_COLOR = { Q: '#ff3b5c', W: '#ff8f3b', E: '#3fd0c9', 'E충돌': '#7fe3dc', R: '#ffc857', D: '#b18cff', AA: '#d0d4dd', 'AA+': '#ff9fb2', P: '#ff6b9a' };

// ============================== 기하/충돌 ==============================
const Geo = {
  // 점-선분 거리
  segDist(p, a, b) {
    const abx = b.x - a.x, aby = b.y - a.y, l2 = abx * abx + aby * aby;
    let t = l2 ? ((p.x - a.x) * abx + (p.y - a.y) * aby) / l2 : 0; t = clamp(t, 0, 1);
    return Math.hypot(p.x - (a.x + abx * t), p.y - (a.y + aby * t));
  },
  // 부채꼴-원 판정
  inSector(c, ang, R, half, p, r) {
    const d = V.dist(c, p); if (d - r > R) return false; if (d < r + 0.01) return true;
    const a = Math.atan2(p.y - c.y, p.x - c.x);
    return Math.abs(angDiff(a, ang)) <= half + Math.asin(Math.min(1, r / d));
  },
  // 회전 사각형-원 판정 (시작점 s, 방향 dir, 길이 len, 반폭 halfW)
  inORect(s, dir, len, halfW, p, r) {
    const rx = p.x - s.x, ry = p.y - s.y, along = rx * dir.x + ry * dir.y, perp = Math.abs(-rx * dir.y + ry * dir.x);
    return along >= -r && along <= len + r && perp <= halfW + r;
  },
  _slab(o, d, x0, y0, x1, y1) {
    if (o.x > x0 && o.x < x1 && o.y > y0 && o.y < y1) return Infinity;   // 이미 내부면 무시
    let tmin = -Infinity, tmax = Infinity;
    if (Math.abs(d.x) < 1e-9) { if (o.x < x0 || o.x > x1) return Infinity; }
    else { let a = (x0 - o.x) / d.x, b = (x1 - o.x) / d.x; if (a > b) [a, b] = [b, a]; tmin = Math.max(tmin, a); tmax = Math.min(tmax, b); }
    if (Math.abs(d.y) < 1e-9) { if (o.y < y0 || o.y > y1) return Infinity; }
    else { let a = (y0 - o.y) / d.y, b = (y1 - o.y) / d.y; if (a > b) [a, b] = [b, a]; tmin = Math.max(tmin, a); tmax = Math.min(tmax, b); }
    if (tmax < tmin || tmax < 0) return Infinity;
    return tmin >= 0 ? tmin : Infinity;
  },
  // 광선이 벽/경계에 처음 닿는 거리 (dist 이내가 아니면 Infinity)
  rayHit(o, d, dist, pad) {
    let best = Infinity;
    for (const w of CONFIG.walls) { const t = Geo._slab(o, d, w.x - pad, w.y - pad, w.x + w.w + pad, w.y + w.h + pad); if (t < best) best = t; }
    const W = CONFIG.world.w, H = CONFIG.world.h;
    if (d.x > 1e-9) best = Math.min(best, (W - pad - o.x) / d.x); else if (d.x < -1e-9) best = Math.min(best, (pad - o.x) / d.x);
    if (d.y > 1e-9) best = Math.min(best, (H - pad - o.y) / d.y); else if (d.y < -1e-9) best = Math.min(best, (pad - o.y) / d.y);
    best = Math.max(0, best);
    return best <= dist ? best : Infinity;
  },
  // 간단한 길찾기: 목표까지 직선이 벽에 막히면 그 벽의 모서리를 경유
  detour(pos, target, r) {
    const dist = V.dist(pos, target); if (dist < 0.05) return target;
    const dir = V.norm(V.sub(target, pos)), pad = r - 0.05;
    let wall = null, bt = Infinity;
    for (const w of CONFIG.walls) { const t = Geo._slab(pos, dir, w.x - pad, w.y - pad, w.x + w.w + pad, w.y + w.h + pad); if (t < bt && t <= dist) { bt = t; wall = w; } }
    if (!wall) return target;
    const cp = r + 0.2, W = wall, corners = [{ x: W.x - cp, y: W.y - cp }, { x: W.x + W.w + cp, y: W.y - cp }, { x: W.x - cp, y: W.y + W.h + cp }, { x: W.x + W.w + cp, y: W.y + W.h + cp }];
    let best = null, bc = Infinity;
    for (const c of corners) {
      const cd = V.dist(pos, c); if (cd < 0.35) continue;   // 방금 도착한 모서리는 제외
      const t = Geo._slab(pos, V.norm(V.sub(c, pos)), W.x - pad, W.y - pad, W.x + W.w + pad, W.y + W.h + pad);
      if (t < cd - 0.05) continue;   // 모서리까지도 막힘
      const cost = cd + V.dist(c, target); if (cost < bc) { bc = cost; best = c; }
    }
    return best ? Geo.pushOut(V.copy(best), r) : target;
  },
  inWall(p, r) { return CONFIG.walls.some(w => p.x > w.x - r && p.x < w.x + w.w + r && p.y > w.y - r && p.y < w.y + w.h + r); },
  // 지형 통과 돌진의 착지점: 벽 안이면 진행 방향으로 빠져나간 지점, 그래도 안 되면 뒤로
  passLanding(o, d, dist, r) {
    const W = CONFIG.world.w, H = CONFIG.world.h, inB = p => p.x >= r && p.x <= W - r && p.y >= r && p.y <= H - r;
    let L = dist; const end = q => V.add(o, V.mul(d, q));
    while (!inB(end(L)) && L > 0) L -= 0.05;   // 아레나 경계
    if (!Geo.inWall(end(L), r)) return L;
    for (let x = L; x <= L + 2.5; x += 0.05) if (inB(end(x)) && !Geo.inWall(end(x), r)) return x;
    for (let x = L; x >= 0; x -= 0.05) if (!Geo.inWall(end(x), r)) return x;
    return 0;
  },
  clampDash(o, d, dist, pad) { const t = Geo.rayHit(o, d, dist, pad); return t === Infinity ? dist : Math.max(0, t - 0.02); },
  // 벽 밖으로 밀어내기
  pushOut(pos, r) {
    for (const w of CONFIG.walls) {
      const cx = clamp(pos.x, w.x, w.x + w.w), cy = clamp(pos.y, w.y, w.y + w.h);
      const dx = pos.x - cx, dy = pos.y - cy, d = Math.hypot(dx, dy);
      if (d < 1e-6) {
        const l = pos.x - w.x, rr = w.x + w.w - pos.x, t = pos.y - w.y, b = w.y + w.h - pos.y, m = Math.min(l, rr, t, b);
        if (m === l) pos.x = w.x - r; else if (m === rr) pos.x = w.x + w.w + r; else if (m === t) pos.y = w.y - r; else pos.y = w.y + w.h + r;
      } else if (d < r) { pos.x = cx + dx / d * r; pos.y = cy + dy / d * r; }
    }
    pos.x = clamp(pos.x, r, CONFIG.world.w - r); pos.y = clamp(pos.y, r, CONFIG.world.h - r);
    return pos;
  },
};

// ============================== 시야(부쉬) ==============================
const Vision = {
  reveals: [],   // 시야 확보 구역 {team, pos, r, t} — 카티야 정찰 다트 등
  bushAt(p) { return (CONFIG.bushes || []).findIndex(b => p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h); },
  // 점에서 부쉬 사각형까지 거리
  rectDist(p, b) { const dx = Math.max(b.x - p.x, 0, p.x - (b.x + b.w)), dy = Math.max(b.y - p.y, 0, p.y - (b.y + b.h)); return Math.hypot(dx, dy); },
  // viewer가 target을 볼 수 있는가: 부쉬 밖이면 보임 / 행동·피격으로 노출 중 / 같은 부쉬·가까움 / 아군 시야 구역 안
  visible(viewer, target) {
    if (!viewer || !target) return true;
    if (target.stealthT > 0) return false;                                                        // 은신(다니엘 E)
    if (viewer.blindT > 0 && V.dist(viewer.pos, target.pos) > (viewer.blindR || 4.5)) return false;   // 시야 감소(다니엘 W 영감)
    if (target.revealT > 0) return true;
    const b = Vision.bushAt(target.pos); if (b < 0) return true;
    if (Vision.bushAt(viewer.pos) === b || V.dist(viewer.pos, target.pos) <= CONFIG.vision.bushReveal) return true;
    return Vision.reveals.some(z => z.team === viewer.team && V.dist(z.pos, target.pos) <= z.r);
  },
  update(dt) { Vision.reveals = Vision.reveals.filter(z => (z.t -= dt) > 0); },
};

const Sfx = {
  ctx: null, master: null, last: {},
  init() {
    if (this.ctx) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      this.ctx = new AC(); this.master = this.ctx.createGain(); this.master.connect(this.ctx.destination);
      const len = this.ctx.sampleRate * 0.5; this.nb = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const ch = this.nb.getChannelData(0); for (let i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
    } catch (e) { this.ctx = null; }
  },
  ok() {
    if (!this.ctx || !Settings.sound) return false;
    if (this.ctx.state === 'suspended') this.ctx.resume();
    this.master.gain.value = Settings.volume; return true;
  },
  tone(f, dur, type, vol, f2, delay = 0) {
    const t = this.ctx.currentTime + delay, o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.05);
  },
  noise(dur, vol, freq, type = 'bandpass', delay = 0) {
    const t = this.ctx.currentTime + delay, s = this.ctx.createBufferSource(), f = this.ctx.createBiquadFilter(), g = this.ctx.createGain();
    s.buffer = this.nb; f.type = type; f.frequency.value = freq;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

      case 'win': [392, 523, 659, 784, 1046].forEach((f, i) => this.tone(f, 0.2, 'triangle', 0.09, null, i * 0.09)); break;

// ============================== 이벤트 버스 ==============================
const Events = {
  h: {},
  on(n, f) { (this.h[n] = this.h[n] || []).push(f); },
  emit(n, d) { const a = this.h[n]; if (a) for (const f of a.slice()) f(d || {}); },
  clear() { this.h = {}; },

// ============================== 이펙트 ==============================
const FX = {
  reset() { this.parts = []; this.texts = []; this.rings = []; this.slashes = []; this.trails = []; this.marks = []; this.arcs = []; this.toasts = []; this.shake = 0; this.toastLast = {}; },
  // 휘어진 큰 베기 궤적 (강화 평타의 내려찍기)
  arc(from, dir, len, bend, color, life = 0.4, width = 0.28) { this.arcs.push({ a: V.copy(from), dir: V.copy(dir), len, bend, color, life, max: life, width }); },
  // 대상 위에 교차하는 X자 베기 (R)
  xslash(pos, color = '#ff3b5c', n = 4) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI, d = V.fromAng(a), L = rand(1.6, 2.4);
      this.trail(V.sub(pos, V.mul(d, L / 2)), V.add(pos, V.mul(d, L / 2)), color, 0.14, 0.55);
      this.trail(V.sub(pos, V.mul(d, L / 2.4)), V.add(pos, V.mul(d, L / 2.4)), '#ffffff', 0.04, 0.4);
    }
  },
  // 피 튀김 (E 충돌)
  blood(pos) {
    this.burst(pos, '#ff2a3d', 34, 8, 0.7, 0.14); this.burst(pos, '#7a0010', 16, 5, 0.9, 0.18);
    this.ring(pos, 0.2, 2.0, '#ff2a3d', 0.4, 0.18);
  },
  burst(pos, color, n = 10, spd = 4, life = 0.5, size = 0.08) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = spd * (0.3 + Math.random() * 0.7);
      this.parts.push({ x: pos.x, y: pos.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life, max: life, color, size });
    }
  },
  text(pos, str, color = '#fff', size = 14, opt = {}) {
    const life = opt.life || 0.9;
    this.texts.push({ x: pos.x + (Math.random() - 0.5) * 0.5, y: pos.y - 0.6, vy: -1.3, str, color, size, life, max: life, bold: opt.bold });
  },
  ring(pos, r0, r1, color, life = 0.35, width = 0.06) { this.rings.push({ x: pos.x, y: pos.y, r0, r1, color, life, max: life, width }); },
  slash(pos, ang, R, half, color, life = 0.25, inner = 0) { this.slashes.push({ x: pos.x, y: pos.y, ang, R, half, color, life, max: life, inner }); },
  trail(a, b, color, width = 0.3, life = 0.25) { this.trails.push({ a: V.copy(a), b: V.copy(b), color, width, life, max: life }); },
  mark(pos, color) { this.marks.push({ x: pos.x, y: pos.y, color, life: 0.4, max: 0.4 }); },
  addShake(px) { this.shake = Math.min(14, Math.max(this.shake, px)); },
  toast(str, color = '#e6e9ef') {
    const now = performance.now(); if (this.toastLast[str] && now - this.toastLast[str] < 1200) return; this.toastLast[str] = now;
    this.toasts.push({ str, color, life: 1.8 }); if (this.toasts.length > 4) this.toasts.shift();
  },
  update(dt) {
    const dec = arr => arr.filter(o => (o.life -= dt) > 0);
    for (const p of this.parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.92; p.vy *= 0.92; }
    for (const t of this.texts) { t.y += t.vy * dt; t.vy *= 0.96; }

    this.trails = dec(this.trails); this.marks = dec(this.marks); this.toasts = dec(this.toasts); this.arcs = dec(this.arcs);

FX.reset();

// ============================== 전투 ==============================
const Combat = {
  // type: 'skill' | 'normal' | 'true'(고정 피해)
  damage(src, tgt, amount, o = {}) {
    if (!tgt || tgt.dead || tgt.invuln > 0) return 0;
    const type = o.type || 'skill';
    let dmg = amount;
    if (type !== 'true') dmg *= 100 / (100 + Math.max(0, tgt.def * (1 - (o.pen || 0))));   // 방어 관통(%) 반영
    if (o.min) dmg = Math.max(o.min, dmg);
    dmg = Math.max(0, dmg);
    let absorbed = 0;
    if (tgt.shield > 0) { absorbed = Math.min(tgt.shield, dmg); tgt.shield -= absorbed; }
    tgt.hp -= dmg - absorbed;
    tgt.flash = 0.12;
    const col = type === 'true' ? '#ffd1dc' : type === 'normal' ? (o.crit ? '#ff5d5d' : '#ffffff') : '#ffb347';
    FX.text(tgt.pos, (o.crit ? '✦' : '') + Math.round(dmg), col, o.crit ? 20 : type === 'true' ? 12 : 15, { bold: o.crit || type === 'skill' });
    if (src === Game.player) Stats.dealt(o.source || '?', dmg);
    if (tgt === Game.player) { Stats.takenTotal += dmg; Stats.playerHits++; Events.emit('playerHit', { dmg }); Sfx.play('hurt'); tgt.revealT = Math.max(tgt.revealT || 0, CONFIG.vision.hitReveal); }   // 피격 시 위치 노출
    else Sfx.play('hit');
    if (!o.noShake) FX.addShake(o.crit ? 6 : type === 'true' ? 0 : 2.5);
    if (tgt.onDamaged && !tgt.dead) tgt.onDamaged(dmg, src);   // 피격 반응(예: 아야 패시브 보호막)
    if (tgt.hp <= 0) this.kill(src, tgt);
    if (o.trauma && src === Game.player && !tgt.dead) Passive.applyTrauma(tgt, o.source);
    return dmg;
  },
  kill(src, tgt) {
    if (tgt.infinite) { tgt.hp = tgt.maxHp; FX.text(tgt.pos, '체력 리셋', '#8a93a6', 11); return; }
    tgt.hp = 0; tgt.dead = true; tgt.deathT = 0;
    FX.burst(tgt.pos, tgt.color, 26, 7, 0.8, 0.12); FX.ring(tgt.pos, 0.3, 2, '#ffffff', 0.5);
    if (src === Game.player) Stats.kills++;
    Events.emit('kill', { unit: tgt });
    if (Game.time - (tgt.rMaxMark ?? -99) < 0.3) { Events.emit('rKillMax'); FX.toast('응급 OP 최대 피해 처치!', CONFIG.theme.gold); }
  },
};

// ============================== 패시브: 외과 전문의 ==============================
const Passive = {
  lvl() { return Game.player.build.passiveLv + 1; },
  applyTrauma(t, src) {
    const p = Game.player, P = CONFIG.passive;
    if (!t || t.dead || t.crit > 0) return;
    if (P.traumaPerSkill) {   // 같은 스킬로는 한 번만 쌓임 — 지속시간만 갱신
      if (t.traumaT <= 0 || !t.traumaSrc) t.traumaSrc = new Set();
      if (src && t.traumaSrc.has(src)) { t.traumaT = P.traumaDur; return; }
      if (src) t.traumaSrc.add(src);
    }
    t.trauma = Math.min(P.stacks, t.trauma + 1); t.traumaT = P.traumaDur;
    Combat.damage(p, t, Math.max(P.traumaMin || 0, p.sp * P.traumaSp), { type: 'true', source: 'P', noShake: true });
    if (!t.dead && t.trauma >= P.stacks) this.critical(t, 'stack');
  },
  critical(t, by) {
    const p = Game.player, P = CONFIG.passive;
    if (!t || t.dead) return;
    if (t.crit > 0) {   // 이미 치명적 외상: 갱신. R로 다시 부여하면 Q 쿨 감소도 적용 (영상: R 직후 Q 재사용)
      t.crit = P.critDur; t.healRed = P.critDur;
      if (by === 'R' && CONFIG.passive.rReapplyQcdr) this.reduceQ(p);
      return;
    }
    t.trauma = 0; t.traumaT = 0; t.traumaSrc = null; t.crit = P.critDur; t.healRed = P.critDur;
    FX.ring(t.pos, 0.3, 1.8, CONFIG.theme.accent, 0.45, 0.12); FX.text(t.pos, '치명적 외상!', CONFIG.theme.accent, 17, { bold: true });
    Sfx.play('crit');
    Combat.damage(p, t, t.maxHp * P.critMaxHp + p.sp * P.critSp, { type: 'true', source: 'P' });
    // 보호막 + 이동 속도 증가 준비
    p.shield = Math.max(p.shield, lv(P.shield, this.lvl()) + p.sp * P.shieldSp); p.shieldT = P.shieldDur; p.shieldBoostUsed = false;
    if (CONFIG.skills.Q.cdrOnAnyCritical || by === 'Q') this.reduceQ(p);
    Stats.criticals++; Events.emit('critical', { target: t });
  },
  // Q 쿨다운 감소
  reduceQ(p) {
    const q = p.skills.Q; if (q.cd <= 0) return;
    q.cd *= 1 - lv(CONFIG.skills.Q.critCdr, q.lv); q.reduced = true; FX.text(p.pos, 'Q 쿨감', CONFIG.theme.accent2, 13, { bold: true });
  },
};

// ============================== 엔티티: 기본 유닛 ==============================
let UID = 0;
class Unit {
  constructor(o) {
    this.id = ++UID; this.team = o.team ?? 1; this.name = o.name || ''; this.kind = o.kind || 'unit';
    this.pos = { x: o.x, y: o.y }; this.spawn = { x: o.x, y: o.y }; this.r = o.r || 0.5;
    this.maxHp = o.hp || 1000; this.hp = this.maxHp; this.def = o.def || 0; this.baseMs = o.ms ?? 3.5;
    this.color = o.color || '#888'; this.facing = o.facing ?? Math.PI; this.infinite = !!o.infinite; this.respawn = !!o.respawn;
    this.brain = o.brain || null; this.ai = o.ai || {};
    this.resetState();
  }
  resetState() {
    this.hp = this.maxHp; this.dead = false; this.deathT = 0;
    this.moveTarget = null; this.vel = { x: 0, y: 0 }; this.root = 0; this.stun = 0; this.slows = []; this.msBuffs = [];
    this.unstoppable = 0; this.forced = null; this.shield = 0; this.shieldT = 0; this.trauma = 0; this.traumaT = 0;
    this.crit = 0; this.healRed = 0; this.flash = 0; this.invuln = 0; this.rMaxMark = -99; this.fear = 0; this.fearFrom = null; this.revealT = 0; this.stealthT = 0; this.silence = 0; this.blindT = 0; this.untargetable = 0;
  }
  revive() { this.resetState(); this.pos = V.copy(this.spawn); FX.ring(this.pos, 0.2, 1.2, '#8a93a6', 0.4); }
  msMul() {
    let s = 0; for (const sl of this.slows) s = Math.max(s, sl.p);
    let b = 0; for (const m of this.msBuffs) b += m.p * (m.decay ? m.t / m.dur : 1);
    return Math.max(0.1, (1 - s) * (1 + b));
  }
  speed() { return this.baseMs * this.msMul(); }
  applyCC(type, dur) {
    if (this.dead || this.unstoppable > 0) return false;
    this[type] = Math.max(this[type], dur);
    if (type === 'stun') this.moveTarget = null;
    return true;
  }
  addSlow(p, dur) { if (this.unstoppable > 0) return; this.slows.push({ p, t: dur }); }
  addMsBuff(p, dur, decay, tag) { if (tag) this.msBuffs = this.msBuffs.filter(m => m.tag !== tag); this.msBuffs.push({ p, t: dur, dur, decay, tag }); }
  canMove() { return !this.dead && this.stun <= 0 && this.root <= 0 && !this.forced && this.baseMs > 0; }
  canAct() { return !this.dead && this.stun <= 0 && this.fear <= 0 && !this.forced; }
  // 공포: 시전자 반대 방향으로 걸어서 도망, 평타·스킬 불가
  applyFear(dur, from) { if (this.dead || this.unstoppable > 0) return false; this.fear = Math.max(this.fear, dur); this.fearFrom = V.copy(from); return true; }
  heal(a, silent) {
    if (this.dead) return 0;
    if (this.healRed > 0) a *= 1 - CONFIG.passive.healReduction;
    const before = this.hp; this.hp = Math.min(this.maxHp, this.hp + a);
    const h = this.hp - before; if (!silent && h > 0.5) FX.text(this.pos, '+' + Math.round(h), '#5dff9a', 12);
    return h;
  }
  tickStatus(dt) {
    const dec = k => { if (this[k] > 0) this[k] = Math.max(0, this[k] - dt); };
    ['root', 'stun', 'unstoppable', 'invuln', 'flash', 'healRed', 'crit', 'fear', 'revealT', 'stealthT', 'silence', 'blindT', 'untargetable'].forEach(dec);
    if (this.traumaT > 0) { this.traumaT -= dt; if (this.traumaT <= 0) this.trauma = 0; }
    if (this.shieldT > 0) { this.shieldT -= dt; if (this.shieldT <= 0) this.shield = 0; }
    this.slows = this.slows.filter(s => (s.t -= dt) > 0);
    this.msBuffs = this.msBuffs.filter(m => (m.t -= dt) > 0);
    if (this.forced) {   // 강제 이동(끌려감)
      const f = this.forced; f.t += dt; const k = Math.min(1, f.t / f.dur);
      this.pos = V.lerp(f.from, f.to, k);
      if (k >= 1) { Geo.pushOut(this.pos, this.r); const cb = f.onEnd; this.forced = null; if (cb) cb(); }
    }
  }
  moveStep(dt) {
    if (!this.moveTarget || !this.canMove()) { this.vel = { x: 0, y: 0 }; return; }
    // 경유점(벽 모서리)은 도착할 때까지 유지 → 진동 방지
    if (this.wp && (!this.wpFor || V.dist(this.wpFor, this.moveTarget) > 0.8)) this.wp = null;
    if (!this.wp) { const g = Geo.detour(this.pos, this.moveTarget, this.r); if (g !== this.moveTarget) { this.wp = g; this.wpFor = V.copy(this.moveTarget); } }
    const goal = this.wp || this.moveTarget;
    const to = V.sub(goal, this.pos), d = V.len(to), sp = this.speed() * dt;
    if (d <= sp || d < 0.01) {
      this.pos = V.copy(goal); this.vel = { x: 0, y: 0 };
      if (this.wp) this.wp = null; else this.moveTarget = null;
    }
    else { const dir = V.mul(to, 1 / d); this.pos = V.add(this.pos, V.mul(dir, sp)); this.vel = V.mul(dir, this.speed()); this.facing = V.ang(dir); }
    Geo.pushOut(this.pos, this.r);
  }
  update(dt) {
    this.tickStatus(dt); if (this.dead) return;
    if (this.brain && this.canAct()) this.brain(this, dt);
    this.moveStep(dt);
  }
}

// ============================== 플레이어: 캐시 ==============================
class Cathy extends Unit {
  constructor(x, y) {
    const b = CONFIG.builds[Game.buildId];
    super({ team: 0, x, y, r: 0.5, hp: b.hp, def: b.def, ms: b.ms, color: CONFIG.theme.accent, name: '캐시', kind: 'player', facing: 0 });
    this.build = b; this.weapon = Settings.weapon;
    this.ad = b.ad; this.bonusAd = b.bonusAd; this.sp = b.sp; this.critChance = b.crit; this.cdr = b.cdr;
    this.as = +(b.as * (CONFIG.basicAttack[this.weapon].asMul || 1)).toFixed(2);   // 무기별 공속 보정(쌍검은 느림)
    this.pendingHits = [];
    this.maxSt = b.stamina; this.st = b.stamina;
    this.skills = {};
    for (const k of ['Q', 'W', 'E', 'R', 'D', 'F']) this.skills[k] = { lv: k === 'F' ? 1 : b.skill[k], cd: 0, cdMax: 1, reduced: false };
    this.cast = null; this.aa = { phase: 'none', t: 0, dur: 0 }; this.aaCd = 0;
    this.attackTarget = null; this.attackMove = null; this.enhanced = 0; this.buffer = null;
    this.daggerReady = 0; this.dualRecast = 0; this.lastAA = null; this.shieldBoostUsed = false; this.castSeq = 0; this.pendingMove = null;
  }
  skillDef(k) { return k === 'D' ? CONFIG.skills[this.weapon === 'dagger' ? 'D_dagger' : 'D_dual'] : CONFIG.skills[k]; }
  skillLabel(k) { return k + ' ' + this.skillDef(k).name; }
  startCd(k) {
    const def = this.skillDef(k), s = this.skills[k];
    s.cd = s.cdMax = lv(def.cd, s.lv) * (def.fixedCd ? 1 : 1 - this.cdr) * Game.cdMul; s.reduced = false;
  }
  aaCfg() { return CONFIG.basicAttack[this.weapon]; }
  aaWindupTime() { return this.enhanced > 0 ? CONFIG.basicAttack.enhanced.windup / Math.max(1, this.as) : this.aaCfg().windupRatio / this.as; }
  validTarget(t) { return t && !t.dead && Game.units.includes(t) && !(t.untargetable > 0) && (t.team === 0 || Vision.visible(this, t)); }   // 은신·대상 지정 불가면 평타 대상 해제

  // ---------- 명령 (Input에서 호출) ----------
  cmdMove(pt) {
    Stats.input(); FX.mark(pt, '#5dff9a');
    this.attackTarget = null; this.attackMove = null;
    const dest = Geo.pushOut(V.copy(pt), this.r);
    if (this.cast) {
      const c = this.cast;
      if (c.phase === 'windup') {
        const def = this.skillDef(c.k);
        if (def.channel) { FX.toast('정신집중 중에는 움직일 수 없습니다', '#8a93a6'); return; }   // R: 이동 입력 무시
        const canCancel = CONFIG.input.moveCancelsWindup && def.moveCancel !== false;
        if (canCancel) { this.cancelCast(true); this.moveTarget = dest; } else this.pendingMove = dest;   // 수쳐 등 발사형은 끊기지 않고 발사 후 이동
        return;
      }
      if (c.phase === 'active') { this.pendingMove = dest; return; }
      if (c.phase === 'recovery') this.endCast();
    }
    this.breakAA(true);
    this.moveTarget = dest;
  }
  cmdAttack(t) {
    Stats.input(); FX.mark(t.pos, '#ff5d5d');
    if (this.cast && this.cast.phase === 'recovery') this.endCast();
    if (this.attackTarget !== t && this.aa.phase === 'windup') this.aa.phase = 'none';
    this.attackTarget = t; this.attackMove = null; this.moveTarget = null;
  }
  cmdAttackMove(pt) {

    this.attackTarget = null; this.attackMove = Geo.pushOut(V.copy(pt), this.r); this.moveTarget = V.copy(this.attackMove);
  }

    this.tryCast(k, aim);
  }
  // 평타 모션 중단: 선딜(windup) 중 이동하면 평타가 취소됨
  breakAA(countMistake) {
    if (this.aa.phase === 'windup' && countMistake && this.aa.t > this.aa.dur * 0.35) Stats.mistake('평타 선딜 중 이동 → 평타 취소');

  }

  tryCast(k, aim) {
    const s = this.skills[k], def = this.skillDef(k);

    if (!this.canAct()) return false;
    if (k === 'F') { if (s.cd > 0) { this.cdError(k); return false; } this.interruptForCast(); this.blink(aim); return true; }
    if (this.silence > 0) { FX.toast('침묵 — 스킬 사용 불가', '#b07cff'); Sfx.play('error'); return false; }
    if (k === 'D') return this.tryWeapon(aim);
    if (s.cd > 0) { this.cdError(k); return false; }
    if ((k === 'Q' || k === 'R') && this.root > 0) { FX.toast('속박 중에는 돌진할 수 없습니다'); return false; }
    const cost = def.stamina || 0; if (this.st < cost) { FX.toast('스태미나 부족', '#4aa3ff'); return false; }
    this.st -= cost;
    this.beginCast(k, aim, Impl[k], { cost });
    return true;
  }
  cdError(k) { Sfx.play('error'); HUD.flash(k); }
  tryWeapon(aim) {
    const s = this.skills.D, def = this.skillDef('D');
    if (this.weapon === 'dagger') {
      if (this.daggerReady > 0) {   // 2차: 대상 지정 이동
        const t = Game.pickEnemyAt(aim, CONFIG.input.pickRadius);
        if (!t) { Stats.mistake('단검 D: 대상 지정 실패 (커서 위에 적 없음)'); Sfx.play('error'); return false; }
        if (V.dist(this.pos, t.pos) - t.r > def.range) { Stats.mistake('단검 D: 사거리 밖 시전'); Sfx.play('error'); FX.toast('사거리 밖 (2.5m)'); return false; }
        this.beginCast('D', t.pos, Impl.Ddagger, { target: t }); return true;
      }
      if (s.cd > 0) { this.cdError('D'); return false; }
      // 1차: 유틸 — 이동 속도 증가 + 3초 내 재사용 가능 (TODO: 실제 1차 효과 확인)
      this.daggerReady = def.duration; this.addMsBuff(lv(def.msBoost, s.lv), def.msDur || def.duration, false, 'dagger');   // 망토: 1초 이속 증가
      this.enhanced = CONFIG.basicAttack.enhanced.timeout;   // 무기 스킬 사용 → 강화 평타
      FX.ring(this.pos, 0.3, 1.5, '#5ff0e6', 0.45, 0.1);
      for (let i = 0; i < 4; i++) { const a = i * Math.PI / 2 + Math.random(); FX.slash(this.pos, a, 1.3, 0.7, '#5ff0e6', 0.4, 0.7); }
      FX.burst(this.pos, '#7fb2ff', 14, 3); Sfx.play('blink'); Events.emit('action', { k: 'D1' });
      return true;
    }
    if (this.dualRecast > 0) { this.beginCast('D', aim, Impl.Ddual2, {}); return true; }
    if (s.cd > 0) { this.cdError('D'); return false; }
    this.beginCast('D', aim, Impl.Ddual1, {}); return true;
  }
  blink(aim) {
    const def = CONFIG.skills.F, dir = V.norm(V.sub(aim, this.pos)), dist = Math.min(def.dist, V.dist(this.pos, aim));
    const from = V.copy(this.pos); this.pos = Geo.pushOut(V.add(this.pos, V.mul(dir, dist)), this.r);
    FX.burst(from, '#ffffff', 12, 3); FX.ring(this.pos, 0.2, 1, '#ffffff', 0.3); Sfx.play('blink');
    this.moveTarget = null; this.startCd('F'); Events.emit('action', { k: 'F' });
  }
  interruptForCast() {
    if (this.cast && this.cast.phase === 'recovery') this.endCast();
    this.aa.phase = 'none';
  }
  beginCast(k, aim, impl, extra) {
    this.interruptForCast();
    const dir = V.dist(aim, this.pos) > 0.05 ? V.norm(V.sub(aim, this.pos)) : V.fromAng(this.facing);
    const c = { k, impl, phase: 'windup', t: 0, aim: V.copy(aim), dir, ang: V.ang(dir), windup: impl.windup(this), recovery: impl.recovery(this),
      id: ++this.castSeq, hitAny: false, traumaSet: new Set(), data: Object.assign({}, extra), cost: extra.cost || 0 };
    this.cast = c; this.facing = c.ang; this.moveTarget = null; this.pendingMove = null;
    if (impl.start) impl.start(this, c);
    if (c.windup <= 0) this.fireCast();
  }
  fireCast() {
    const c = this.cast; c.phase = 'active'; c.t = 0; c.origin = V.copy(this.pos);
    c.data.snap = {}; for (const e of Game.enemies()) c.data.snap[e.id] = V.copy(e.pos);
    Stats.cast(c.k); this.revealT = Math.max(this.revealT, CONFIG.vision.actionReveal);
    const qwer = 'QWERD'.includes(c.k);   // 시즌 12: 무기 스킬 사용 후에도 강화 평타 발동
    if (qwer && this.enhanced > 0) Stats.mistake('강화 평타를 쓰지 않고 다음 스킬 연계');
    c.impl.fire(this, c);
    if (qwer) this.enhanced = CONFIG.basicAttack.enhanced.timeout;   // Q 지속 효과: 스킬 사용 후 다음 평타 강화
    Events.emit('action', { k: c.impl.action || c.k });
  }
  cancelCast(mistake) {
    const c = this.cast; if (!c) return;
    if (mistake) Stats.mistake(`${this.skillLabel(c.k)} 선딜 중 이동 입력으로 캔슬됨`);
    this.st = Math.min(this.maxSt, this.st + c.cost); this.cast = null;
  }
  endCast() {
    const c = this.cast; this.cast = null;
    if (c && c.impl.end && !c.ended) { c.ended = true; c.impl.end(this, c); }
    if (this.pendingMove) { this.moveTarget = this.pendingMove; this.pendingMove = null; }
  }
  updateCast(dt) {
    const c = this.cast; c.t += dt;
    if (c.phase === 'windup') { if (c.t >= c.windup) this.fireCast(); return; }
    if (c.phase === 'active') {
      const done = c.impl.tick ? c.impl.tick(this, c, dt) : true;
      if (done) { c.phase = 'recovery'; c.t = 0; if (c.impl.end) { c.ended = true; c.impl.end(this, c); } if (c.recovery <= 0 || this.pendingMove) this.endCast(); }   // 이동 입력이 대기 중이면 후딜 없이 바로 이동
      return;
    }
    if (c.phase === 'recovery' && c.t >= c.recovery) this.endCast();
  }

  // ---------- 기본 공격 ----------
  updateAA() {
    const a = this.aa, dt = CONFIG.sim.step;
    if (a.phase === 'windup') {
      if (!this.validTarget(this.attackTarget)) { a.phase = 'none'; return false; }
      this.facing = V.ang(V.sub(this.attackTarget.pos, this.pos)); a.t += dt;
      if (a.t >= a.dur) this.aaHit(this.attackTarget);
      return true;
    }
    if (a.phase === 'back') { a.t += dt; if (a.t >= a.dur) a.phase = 'none'; else return true; }
    if (this.attackMove && !this.validTarget(this.attackTarget)) {
      const e = Game.nearestEnemy(this.pos, CONFIG.input.attackMoveAcquire); if (e) this.attackTarget = e;
    }
    const t = this.attackTarget;
    if (this.validTarget(t)) {
      const d = V.dist(this.pos, t.pos) - t.r - this.r;
      if (d <= this.aaCfg().range) {
        this.moveTarget = null;
        if (this.aaCd <= 0 && this.canAct()) { a.phase = 'windup'; a.t = 0; a.dur = this.instantAA > 0 && this.enhanced > 0 ? 0.02 : this.aaWindupTime(); this.instantAA = 0; this.aaCd = 1 / this.as; }
        return true;
      }
      if (this.canMove()) this.moveTarget = V.copy(t.pos);
      return false;
    } else if (this.attackTarget) this.attackTarget = null;
    if (this.attackMove && !this.moveTarget) this.attackMove = null;
    return false;
  }
  aaHit(t) {
    const cfg = this.aaCfg(), crit = Math.random() < this.critChance, enh = this.enhanced > 0, Q = CONFIG.skills.Q;
    if (enh) {   // 강화 평타: 1회 (쌍검은 공격력 110%)
      Combat.damage(this, t, this.ad * (this.weapon === 'dual' ? Q.dualEnhAd : 1) * (crit ? cfg.critMul : 1), { type: 'normal', source: 'AA', crit });
    } else {     // 일반 평타: 쌍검은 공격력 80% × 2회 (2타는 잠시 뒤)
      Combat.damage(this, t, this.ad * cfg.hitRatio * (crit ? cfg.critMul : 1), { type: 'normal', source: 'AA', crit });
      for (let i = 1; i < (cfg.hits || 1); i++) this.pendingHits.push({ t: cfg.hitGap * i, target: t });
    }
    if (enh) {
      this.enhanced = 0;
      if (!t.dead) Combat.damage(this, t, Math.max(Q.enhMin, this.sp * Q.enhSp), { type: 'skill', source: 'AA+', trauma: true, min: Q.enhMin });
      Stats.enhAA++; Events.emit('enhAA');
      { const d = V.fromAng(this.facing); FX.arc(V.sub(this.pos, V.mul(d, 0.3)), d, 3.4, 0.7, CONFIG.theme.accent, 0.45); FX.burst(t.pos, '#ffffff', 10, 5); FX.addShake(4); }
    }
    Stats.aaHits++; this.lastAA = { time: Game.time }; this.revealT = Math.max(this.revealT, CONFIG.vision.actionReveal);
    Events.emit('action', { k: 'AA', enh });
    FX.burst(t.pos, enh ? '#ff9fb2' : '#ffffff', 6, 3); Sfx.play('aa');
    this.aa.phase = 'back'; this.aa.t = 0; this.aa.dur = cfg.backRatio / this.as;
  }

  // ---------- 매 스텝 ----------
  update(dt) {
    this.tickStatus(dt);
    for (const k in this.skills) { const s = this.skills[k]; s.cd = Math.max(0, s.cd - dt); }
    this.aaCd -= dt;
    this.st = Math.min(this.maxSt, this.st + CONFIG.staminaRegen * dt);
    if (this.enhanced > 0) this.enhanced = Math.max(0, this.enhanced - dt);
    if (this.instantAA > 0) this.instantAA = Math.max(0, this.instantAA - dt);
    // 쌍검 2타: 대상이 살아 있고 사거리 근처면 적중 (치명 별도 판정)
    for (const h of this.pendingHits) {
      if ((h.t -= dt) > 0) continue; h.done = true;
      const t = h.target, cfg = this.aaCfg();
      if (!t || t.dead || this.dead || V.dist(this.pos, t.pos) - t.r - this.r > cfg.range + 0.6) continue;
      const crit = Math.random() < this.critChance;
      Combat.damage(this, t, this.ad * cfg.hitRatio * (crit ? cfg.critMul : 1), { type: 'normal', source: 'AA', crit, noShake: true });
      FX.burst(t.pos, '#ffffff', 4, 3); Sfx.play('aa');
    }
    this.pendingHits = this.pendingHits.filter(h => !h.done);
    if (this.daggerReady > 0) {
      this.daggerReady -= dt;
      if (this.daggerReady <= 0 && !(this.cast && this.cast.impl === Impl.Ddagger)) { this.daggerReady = 0; this.startCd('D'); this.msBuffs = this.msBuffs.filter(m => m.tag !== 'dagger'); }
    }
    if (this.dualRecast > 0) {
      this.dualRecast -= dt;
      if (this.dualRecast <= 0 && !(this.cast && this.cast.impl === Impl.Ddual2)) { this.dualRecast = 0; this.startCd('D'); }
    }
    if (this.dead) return;
    Stats.trackWaste(this, dt);
    this.passiveMoveBoost();
    if (this.forced) return;
    if (this.stun > 0) { if (this.cast && this.cast.phase === 'windup') this.cancelCast(false); this.aa.phase = 'none'; return; }
    if (this.fear > 0) {   // 공포: 시전 취소, 시전자 반대로 걸어감
      if (this.cast && this.cast.phase === 'windup') this.cancelCast(false);
      this.aa.phase = 'none'; this.attackTarget = null; this.buffer = null;
      if (this.fearFrom) this.moveTarget = Geo.pushOut(V.add(this.pos, V.mul(V.norm(V.sub(this.pos, this.fearFrom)), 2)), this.r);
      this.moveStep(dt); return;
    }
    if (this.cast) { this.updateCast(dt); if (this.cast) return; }
    if (this.buffer) {   // 선입력 처리
      const b = this.buffer; this.buffer = null;
      if (performance.now() - b.time <= CONFIG.input.bufferMs) this.tryCast(b.k, b.aim);
      else Stats.mistake('너무 이른 선입력 (입력 씹힘)');
      if (this.cast) return;
    }
    if (this.updateAA()) return;
    this.moveStep(dt);
    if (this.attackMove && !this.moveTarget && !this.attackTarget) this.attackMove = null;
  }
  // 패시브: 보호막 보유 중 외상 대상에게 이동하면 이동 속도 증가 후 감소
  passiveMoveBoost() {
    const P = CONFIG.passive;
    if (this.shield <= 0) return;
    if (this.shieldBoostUsed || !this.moveTarget) return;
    const md = V.norm(V.sub(this.moveTarget, this.pos)), cosA = Math.cos(P.moveBoostAngle * Math.PI / 180);
    for (const e of Game.enemies()) {
      if ((e.trauma > 0 || e.crit > 0) && V.dist(e.pos, this.pos) < 10 && V.dot(md, V.norm(V.sub(e.pos, this.pos))) > cosA) {
        this.addMsBuff(lv(P.moveBoost, Passive.lvl()), P.moveBoostDur, true, 'pboost'); this.shieldBoostUsed = true;
        FX.text(this.pos, '이속↑', CONFIG.theme.accent2, 12); break;
      }
    }
  }
}

// ============================== 스킬 적중 공통 처리 ==============================
function skillHit(p, c, e, amount, o = {}) {
  if (e.dead) return;
  c.hitAny = true;
  const first = Stats.hit(c.k, c.id);
  // 예측샷 판정: 움직이는 대상에게 '현재 위치가 아닌 곳'을 노려 맞췄는가
  if (first && c.data.snap && V.len(e.vel) > 0.6) {
    Stats.movingHits++;
    const s0 = c.data.snap[e.id];
    if (s0 && V.dist(s0, c.origin) > 1.5 && Math.abs(angDiff(V.ang(V.sub(s0, c.origin)), c.ang)) > 0.1) Stats.leadHits++;
  }
  const trauma = o.trauma !== false && !c.traumaSet.has(e.id);   // 외상은 시전당 대상 1회
  if (trauma) c.traumaSet.add(e.id);
  Combat.damage(p, e, amount, { type: 'skill', source: o.source || c.k, trauma });
  Events.emit('skillHit', { k: c.k, target: e });
}

// ============================== 스킬 구현 (선딜 → 발동 → 후딜) ==============================
const S = CONFIG.skills;
const Impl = {
  Q: {
    windup: () => S.Q.windup, recovery: () => S.Q.recovery,
    fire(p, c) {
      const s = p.skills.Q;
      if (s.reduced) { Events.emit('qReset'); FX.text(p.pos, 'Q 재사용!', CONFIG.theme.accent2, 14, { bold: true }); }
      p.startCd('Q');
      const len = S.Q.passWalls ? Geo.passLanding(p.pos, c.dir, S.Q.dashDist, p.r) : Geo.clampDash(p.pos, c.dir, S.Q.dashDist, p.r);
      Object.assign(c.data, { from: V.copy(p.pos), to: V.add(p.pos, V.mul(c.dir, len)), dur: Math.max(0.03, S.Q.dashTime * len / S.Q.dashDist), t: 0, hit: new Set() });
      Sfx.play('dash');
    },
    tick(p, c, dt) {
      const d = c.data; d.t += dt; const k = Math.min(1, d.t / d.dur), prev = V.copy(p.pos);
      p.pos = V.lerp(d.from, d.to, k); FX.trail(prev, p.pos, CONFIG.theme.accent, 0.42, 0.6); FX.trail(prev, p.pos, '#ffe0e6', 0.08, 0.35);
      for (const e of Game.enemies()) {
        if (d.hit.has(e.id)) continue;
        if (Geo.segDist(e.pos, d.from, p.pos) <= e.r + S.Q.hitWidth / 2) {
          d.hit.add(e.id);
          skillHit(p, c, e, lv(S.Q.dmg, p.skills.Q.lv) + p.sp * S.Q.sp);
          FX.burst(e.pos, '#7f9bff', 12, 5); FX.ring(e.pos, 0.1, 0.9, '#9fb4ff', 0.25, 0.08);
        }
      }
      return k >= 1;
    },
    end(p, c) { Stats.resolveShot('Q', c.hitAny); },
  },
  W: {
    windup: () => S.W.windup, recovery: () => S.W.recovery,
    fire(p, c) {
      p.startCd('W'); Sfx.play('slash');
      const half = S.W.angle / 2 * Math.PI / 180, l = p.skills.W.lv;
      FX.slash(p.pos, c.ang, S.W.range, half, CONFIG.theme.accent, 0.6, S.W.innerRange);
      FX.slash(p.pos, c.ang, S.W.innerRange, half * 0.9, '#e8edf5', 0.22, 0.6);
      let inner = 0, outer = 0;
      for (const e of Game.enemies()) {
        if (!Geo.inSector(p.pos, c.ang, S.W.range, half, e.pos, e.r)) continue;
        if (V.dist(p.pos, e.pos) + e.r <= S.W.innerRange) { /* 완전히 안쪽일 때만 안쪽 판정 */ skillHit(p, c, e, lv(S.W.innerDmg, l) + p.sp * S.W.innerSp, { trauma: false }); inner++; FX.trail(V.add(e.pos, V.fromAng(c.ang + 2.2)), V.add(e.pos, V.fromAng(c.ang - 0.9)), '#9fb4ff', 0.08, 0.3); }
        else { skillHit(p, c, e, lv(S.W.outerDmg, l) + p.sp * S.W.outerSp); e.addSlow(S.W.slow, S.W.slowDur); outer++; FX.text(e.pos, '바깥 적중', CONFIG.theme.accent2, 12, { bold: true }); }
      }
      if (inner > 0 && outer === 0) Stats.mistake('W 안쪽 범위만 적중 (외상·둔화 미적용)');
      Stats.resolveShot('W', inner + outer > 0);
    },
  },
  E: {
    windup: () => S.E.windup, recovery: () => S.E.recovery,
    fire(p, c) {
      p.startCd('E'); Sfx.play('throw');
      const l = p.skills.E.lv, dmg = lv(S.E.dmg, l) + p.sp * S.E.sp;
      const near = Game.pickEnemyAt(c.aim, 1.6), oor = near && V.dist(p.pos, near.pos) - near.r > S.E.range;
      Game.projectiles.push(new Projectile({
        team: 0, owner: p, kind: 'needle', pos: V.copy(p.pos), dir: c.dir, speed: S.E.speed, range: S.E.range, width: S.E.width, assist: S.E.hitAssist,
        onUnit: (pr, u) => {
          if (!pr.first) {
            pr.first = u; skillHit(p, c, u, dmg); u.applyCC('root', S.E.root); FX.burst(u.pos, CONFIG.theme.accent2, 8, 4);
            pr.assist = S.E.pierceAssist; pr.wallPad = S.E.wallAssist * 0.5; pr.range += S.E.wallAssist;   // 관통 후 판정은 널널
            // 유도: 진행 방향 기준 각도·거리 안의 가장 가까운 적을 두 번째 대상으로
            const left = pr.range - pr.traveled; let best = null, bd = Infinity;
            for (const e2 of Game.enemies()) {
              if (e2 === u) continue;
              const d2 = V.dist(u.pos, e2.pos); if (d2 > S.E.homingRange || d2 > left + e2.r + 0.5) continue;
              if (Math.abs(angDiff(V.ang(V.sub(e2.pos, u.pos)), V.ang(pr.dir))) > S.E.homingAngle * Math.PI / 180) continue;
              if (d2 < bd) { bd = d2; best = e2; }
            }
            if (best) { pr.homeTarget = best; pr.homeTurn = S.E.homingTurn; pr.range = Math.max(pr.range, pr.traveled + bd + 0.5); }
            return 'continue';
          }
          skillHit(p, c, u, dmg); Impl.E.pull(p, pr.first, u.pos, u, pr.dir); return 'stop';   // 관통: 최대 1명 추가
        },
        onWall: (pr, pt) => { if (pr.first) Impl.E.pull(p, pr.first, pt, null, pr.dir); },
        onDone: pr => { Stats.resolveShot('E', !!pr.first); if (!pr.first && oor) Stats.mistake('E 사거리 밖 시전'); },
      }));
    },
    // 먼저 맞은 적을 나중에 맞은 쪽(적/벽)으로 끌어 충돌 → 추가 피해 + 기절 (외상 없음)
    pull(p, first, point, second, dir) {
      if (first.dead) return;
      const to = second ? V.sub(second.pos, V.mul(V.norm(V.sub(second.pos, first.pos)), first.r + second.r)) : V.sub(point, V.mul(dir, first.r + 0.03));
      const bonus = lv(S.E.bonus, p.skills.E.lv) + p.sp * S.E.bonusSp;
      const impact = () => {
        for (const u of [first, second]) { if (!u || u.dead) continue; Combat.damage(p, u, bonus, { type: 'skill', source: 'E충돌' }); u.applyCC('stun', S.E.stun); }
        FX.blood(first.pos); FX.addShake(9); Sfx.play('stun');
        if (second) { Stats.eDouble++; Events.emit('eDouble'); FX.text(first.pos, '2인 수쳐!', CONFIG.theme.gold, 19, { bold: true }); }
        else { Stats.eWall++; Events.emit('eWall'); FX.text(first.pos, '벽 충돌!', CONFIG.theme.gold, 17, { bold: true }); }
      };
      if (first.unstoppable > 0) { impact(); return; }
      first.root = 0;
      if (second && second.unstoppable <= 0 && !second.forced) {   // 두 번째 대상도 첫 대상 쪽으로 약간 끌려감
        const gap = V.dist(first.pos, second.pos) - first.r - second.r;
        if (gap > 0.05) { const d2 = V.mul(V.norm(V.sub(first.pos, second.pos)), gap * S.E.secondPull); second.forced = { from: V.copy(second.pos), to: Geo.pushOut(V.add(second.pos, d2), second.r), t: 0, dur: S.E.pullTime }; }
      }
      first.forced = { from: V.copy(first.pos), to, t: 0, dur: S.E.pullTime, onEnd: impact };
    },
  },
  R: {
    windup: () => S.R.windup, recovery: () => S.R.recovery,
    start(p, c) { c.data.len = clamp(V.dist(p.pos, c.aim), S.R.minDist, S.R.maxDist); },
    fire(p, c) {

// ============================== 투사체 ==============================
class Projectile {
  constructor(o) { Object.assign(this, o); this.traveled = 0; this.hit = new Set(); this.seen = new Set(); this.dead = false; this.start = V.copy(o.pos); }
  finish() { if (!this.dead) { this.dead = true; if (this.onDone) this.onDone(this); } }
  update(dt) {
    if (this.homeTarget && !this.homeTarget.dead) {   // 유도: 목표 방향으로 회전
      const want = V.ang(V.sub(this.homeTarget.pos, this.pos)), cur = V.ang(this.dir), d = angDiff(want, cur), mx = (this.homeTurn || 10) * dt;
      this.dir = V.fromAng(cur + clamp(d, -mx, mx));
    }
    const prev = V.copy(this.pos), move = Math.min(this.speed * dt, this.range - this.traveled);
    const tw = this.homeTarget && this.owner && this.owner.team === 1 ? Infinity : Geo.rayHit(prev, this.dir, move, this.width / 2 + (this.wallPad || 0)), segEnd = tw < Infinity ? tw : move;
    // 이번 스텝 경로 위의 유닛을 진행 순서대로 판정
    const cands = [];
    for (const u of Game.units) {
      if (u.dead || u.team === this.team || this.hit.has(u.id) || u.untargetable > 0) continue;
      const rel = V.sub(u.pos, prev), along = V.dot(rel, this.dir), perp = Math.abs(rel.x * this.dir.y - rel.y * this.dir.x);
      if (along >= -u.r && along <= segEnd + u.r && perp <= u.r + this.width / 2 + (this.assist || 0)) cands.push({ u, along });
    }
    cands.sort((a, b) => a.along - b.along);
    for (const { u, along } of cands) {
      this.hit.add(u.id);
      if (this.onUnit(this, u) === 'stop') { this.pos = V.add(prev, V.mul(this.dir, Math.max(0, along))); this.finish(); return; }
    }
    this.pos = V.add(prev, V.mul(this.dir, segEnd)); this.traveled += segEnd;
    if (tw < Infinity) { if (this.onWall) this.onWall(this, V.copy(this.pos)); this.finish(); return; }
    if (this.traveled >= this.range - 1e-6) this.finish();
  }
}

// ============================== AI: 표적 이동 패턴 ==============================
function threatens(u, pr, range) {
  const rel = V.sub(u.pos, pr.pos), along = V.dot(rel, pr.dir);
  if (along < 0 || along > range) return false;
  return Math.abs(rel.x * pr.dir.y - rel.y * pr.dir.x) < u.r + pr.width / 2 + 0.35;
}
const AI = {
  line(u) { const a = u.ai; if (!u.moveTarget) { a.dir = -(a.dir || 1); u.moveTarget = { x: a.dir > 0 ? a.x1 : a.x0, y: a.y }; } },
  zigzag(u, dt) { const a = u.ai; a.t = (a.t || 0) - dt; if (a.t <= 0 || !u.moveTarget) { a.t = rand(0.5, 1.0); u.moveTarget = { x: rand(a.x0, a.x1), y: rand(a.y0, a.y1) }; } },
  strafe(u, dt) { const a = u.ai; a.ang = (a.ang || 0) + dt * a.speed / a.R; u.moveTarget = { x: a.cx + Math.cos(a.ang) * a.R, y: a.cy + Math.sin(a.ang) * a.R }; },
  wander(u, dt) { const a = u.ai; a.t = (a.t || 0) - dt; if (a.t <= 0) { a.t = rand(0.8, 1.6); u.moveTarget = Geo.pushOut({ x: u.spawn.x + rand(-1.3, 1.3), y: u.spawn.y + rand(-1.3, 1.3) }, u.r); } },
  // 투사체를 보고 일정 확률로 옆으로 피하는 표적
  dodger(u, dt) {
    const a = u.ai;
    for (const pr of Game.projectiles) {
      if (pr.team === u.team || pr.dead || pr.seen.has(u.id)) continue;
      if (threatens(u, pr, 6)) { pr.seen.add(u.id); if (Math.random() < a.dodge) { a.dodgeT = a.react; a.dodgePr = pr; } }
    }
    if (a.dodgeT > 0) {
      a.dodgeT -= dt;
      if (a.dodgeT <= 0 && a.dodgePr) {
        const pr = a.dodgePr, rel = V.sub(u.pos, pr.pos), side = (pr.dir.x * rel.y - pr.dir.y * rel.x) >= 0 ? 1 : -1;
        u.moveTarget = Geo.pushOut(V.add(u.pos, V.mul(V.perp(pr.dir), 1.8 * side)), u.r); a.t = 0.6; a.dodgePr = null;
        return;
      }
    }
    AI.zigzag(u, dt);
  },
};

// ============================== AI: 1:1 결투 상대 ==============================
class Duelist extends Unit {
  constructor(x, y, diffKey) {
    const E = CONFIG.enemy, p = Game.player;
    super({ team: 1, x, y, r: E.r, hp: Math.round(p.maxHp * E.hpMul), def: p.build.def * E.defMul, ms: E.ms, color: E.color, name: E.name, kind: 'duelist', facing: Math.PI });
    this.diff = E.difficulty[diffKey]; this.diffKey = diffKey; this.ad = p.ad * E.adMul; this.as = E.as;
    this.cds = { s1: 2, s2: 4, s3: 0 }; this.aaCd = 0; this.act = null; this.thinkT = 0.5; this.dodgeQ = null;
    this.healing = null; this.healAcc = 0; this.healTxtT = 0; this.attacking = false;
    this.stats = { dodges: 0, s1Hits: 0, s1Casts: 0 };
  }
  update(dt) {
    this.tickStatus(dt); if (this.dead) return;
    for (const k in this.cds) this.cds[k] = Math.max(0, this.cds[k] - dt);
    this.aaCd -= dt;
    if (this.healing) {   // 재생 — 치명적 외상의 치유 감소 적용
      const h = Math.min(dt, this.healing.t); this.healing.t -= dt;
      this.healAcc += this.heal(this.healing.rate * h, true);
      if (this.healing.t <= 0) this.healing = null;
    }
    this.healTxtT -= dt;
    if (this.healTxtT <= 0 && this.healAcc > 1) { FX.text(this.pos, '+' + Math.round(this.healAcc) + (this.healRed > 0 ? ' (치유감소)' : ''), '#5dff9a', 12); this.healAcc = 0; this.healTxtT = 0.5; }
    if (this.forced || this.stun > 0) { this.act = null; this.vel = { x: 0, y: 0 }; return; }
    if (this.act) { this.updateAct(dt); return; }
    this.watchThreats(dt);
    this.thinkT -= dt;
    if (this.thinkT <= 0) { this.thinkT = this.diff.react * (0.7 + Math.random() * 0.6); this.think(); if (this.act) return; }
    const p = Game.player;
    if (this.attacking && p && !p.dead) {
      const d = V.dist(this.pos, p.pos) - p.r - this.r;
      if (d <= CONFIG.enemy.range) { this.moveTarget = null; if (this.aaCd <= 0) { this.act = { type: 'aa', t: 0, dur: CONFIG.enemy.aaWindup }; return; } }
      else if (this.canMove()) this.moveTarget = V.copy(p.pos);
    }
    this.moveStep(dt);
  }
  // 날아오는 수쳐를 감지 → 반응 시간 후 회피
  watchThreats(dt) {
    for (const pr of Game.projectiles) {
      if (pr.team === this.team || pr.dead || pr.seen.has(this.id)) continue;
      if (threatens(this, pr, 9)) { pr.seen.add(this.id); if (!this.dodgeQ && Math.random() < this.diff.dodge) this.dodgeQ = { t: this.diff.react * 0.9, pr }; }
    }
    if (!this.dodgeQ) return;
    this.dodgeQ.t -= dt;
    if (this.dodgeQ.t > 0) return;
    const pr = this.dodgeQ.pr; this.dodgeQ = null;
    if (pr.dead || !this.canMove()) return;
    const rel = V.sub(this.pos, pr.pos), side = (pr.dir.x * rel.y - pr.dir.y * rel.x) >= 0 ? 1 : -1, pd = V.mul(V.perp(pr.dir), side);
    this.stats.dodges++; this.attacking = false;
    if (this.cds.s2 <= 0 && (this.diffKey === 'hard' || Math.random() < 0.3)) this.startDash(pd, 3);
    else { this.moveTarget = Geo.pushOut(V.add(this.pos, V.mul(pd, 2.2)), this.r); this.thinkT = 0.5; }
  }
  think() {
    const p = Game.player; if (!p || p.dead) return;
    const E = CONFIG.enemy, d = V.dist(this.pos, p.pos), hpR = this.hp / this.maxHp, pR = p.hp / p.maxHp;
    if (hpR < 0.4 && this.cds.s3 <= 0 && !this.healing) {
      this.healing = { t: E.s3.dur, rate: this.maxHp * E.s3.healPct / E.s3.dur }; this.cds.s3 = E.s3.cd; FX.text(this.pos, E.s3.name, '#5dff9a', 14, { bold: true });
    }
    // 어려움: 캐시의 이동기(Q/점멸)·E 쿨타임을 보고 진입 여부 결정
    let engage = true;
    if (this.diff.kite) {
      engage = p.skills.Q.cd > 1.5 || p.skills.F.cd > 1.5 || p.skills.E.cd > 2 || pR < 0.4 || hpR > pR + 0.3;
      this.kiteT = (this.kiteT || 0) + this.diff.react;   // 너무 오래 견제만 하면 4초간 진입
      if (this.kiteT > 8) { this.commitT = 4; this.kiteT = 0; }
      if (this.commitT > 0) { this.commitT -= this.diff.react; engage = true; }
      if (engage) this.kiteT = 0;
    }
    if (this.diffKey === 'hard' && hpR < 0.25 && pR > 0.5 && this.cds.s2 <= 0 && this.canMove()) { this.startDash(V.norm(V.sub(this.pos, p.pos)), E.s2.dist); return; }
    if (this.cds.s1 <= 0 && d < E.s1.range && Math.random() < 0.85) { this.startS1(p); return; }
    if (engage) {
      if (d > E.range + this.r + p.r + 0.1) {
        if (this.cds.s2 <= 0 && d > 3 && d < E.s2.dist + 1.5 && this.canMove() && (this.diffKey !== 'easy' || Math.random() < 0.4)) { this.startDash(V.norm(V.sub(p.pos, this.pos)), Math.min(E.s2.dist, d - 1.2)); return; }
        this.moveTarget = V.copy(p.pos);
      }
      this.attacking = true;
    } else {   // 카이팅: 수쳐 사거리 바깥 유지
      this.attacking = false;
      const want = CONFIG.skills.E.range + 1.0, away = V.norm(V.sub(this.pos, p.pos)), side = Math.random() < 0.5 ? 1 : -1;
      if (d < want - 0.4) this.moveTarget = Geo.pushOut(V.add(this.pos, V.add(V.mul(away, 2), V.mul(V.perp(away), side * 1.2))), this.r);
      else if (d > want + 1.5) this.moveTarget = Geo.pushOut(V.add(p.pos, V.mul(away, want)), this.r);
      else this.moveTarget = Geo.pushOut(V.add(this.pos, V.mul(V.perp(away), side * 1.5)), this.r);
    }
  }
  startS1(p) {
    const E = CONFIG.enemy.s1, tt = E.windup + V.dist(this.pos, p.pos) / E.speed;
    const pred = V.add(p.pos, V.mul(p.vel, tt * this.diff.lead));
    const ang = V.ang(V.sub(pred, this.pos)) + (Math.random() - 0.5) * 2 * this.diff.aimErr;
    this.act = { type: 's1', t: 0, dur: E.windup, dir: V.fromAng(ang) }; this.cds.s1 = E.cd; this.stats.s1Casts++; this.moveTarget = null;
  }
  startDash(dir, dist) {
    const len = Geo.clampDash(this.pos, dir, dist, this.r);
    this.act = { type: 'dash', t: 0, dur: CONFIG.enemy.s2.time, from: V.copy(this.pos), to: V.add(this.pos, V.mul(dir, len)) };
    this.cds.s2 = CONFIG.enemy.s2.cd; this.moveTarget = null;
  }
  updateAct(dt) {
    const a = this.act, p = Game.player, E = CONFIG.enemy; a.t += dt;
    if (a.type === 'aa') {
      if (p && !p.dead) this.facing = V.ang(V.sub(p.pos, this.pos));
      if (a.t >= a.dur) {
        this.act = null; this.aaCd = 1 / this.as;
        if (p && !p.dead && V.dist(this.pos, p.pos) - p.r - this.r <= E.range + 0.4) { Combat.damage(this, p, this.ad * this.diff.dmgMul, { type: 'normal', source: '적 평타' }); FX.burst(p.pos, '#b56cff', 6, 3); }
      }
    } else if (a.type === 's1') {
      this.facing = V.ang(a.dir);
      if (a.t >= a.dur) { this.act = null; this.fireS1(a.dir); }
    } else if (a.type === 'dash') {
      const k = Math.min(1, a.t / a.dur), prev = V.copy(this.pos);
      this.pos = V.lerp(a.from, a.to, k); FX.trail(prev, this.pos, '#9b6bff', 0.4, 0.25);
      if (k >= 1) this.act = null;
    }
  }
  fireS1(dir) {
    const E = CONFIG.enemy.s1; Sfx.play('throw');
    Game.projectiles.push(new Projectile({
      team: 1, owner: this, kind: 'spear', pos: V.copy(this.pos), dir, speed: E.speed, range: E.range, width: E.width,
      onUnit: (pr, u) => { Combat.damage(this, u, (this.ad * E.adRatio + E.flat) * this.diff.dmgMul, { type: 'skill', source: '적 스킬' }); u.addSlow(E.slow, E.slowDur); this.stats.s1Hits++; FX.burst(u.pos, '#b56cff', 10, 5); return 'stop'; },
    }));
  }
}

// ============================== AI: 원거리 딜러 결투 상대 (공통 움직임 + 캐릭터별 키트) ==============================
// 움직임은 유튜브 원딜 강의 반영: ① 쏘고 움직이기 ② 좌우 무빙(캐시 E 예고선) ③ 앞뒤 무빙(E 사거리 밖으로) ④ 압박 후 뒤로
//                              ⑤ 벽·좁은 곳 회피(벽꿍 수쳐) ⑥ 위험 스킬이 남아 있으면 이동기 아끼기
// 스킬 사용은 Kits[캐릭터]가 담당 (src/4b_kits.js, 수치는 CONFIG.rangedKits)

  input() { this.inputs++; },
  cast(k) { this.casts[k] = (this.casts[k] || 0) + 1; },
  hit(k, id) { const key = k + ':' + id; if (this.hitKeys.has(key)) return false; this.hitKeys.add(key); this.hits[k] = (this.hits[k] || 0) + 1; return true; },
  dealt(src, d) { this.dmgBy[src] = (this.dmgBy[src] || 0) + d; this.dealtTotal += d; const i = Math.floor(this.t); this.timeline[i] = (this.timeline[i] || 0) + d; },
  mistake(txt) { this.mistakes[txt] = (this.mistakes[txt] || 0) + 1; FX.toast('⚠ ' + txt, '#ffb347'); },
  // 스킬샷 연속 명중 (Q/W/E)
  resolveShot(k, hit) {
    if (!['Q', 'W', 'E'].includes(k)) return;
    this.shots++;
    if (hit) { this.shotHits++; this.streak++; this.bestStreak = Math.max(this.bestStreak, this.streak); Events.emit('streak', { n: this.streak }); }
    else this.streak = 0;
  },
  // 교전 중(적 8m 이내)인데 쿨이 돌아 있는 스킬을 안 쓴 시간
  trackWaste(p, dt) {
    if (!Game.nearestEnemy(p.pos, 8)) return;
    for (const k of SKILL_KEYS) {
      const s = p.skills[k];
      if (s.lv <= 0 || s.cd > 0 || (p.cast && p.cast.k === k)) continue;
      if (k === 'D' && (p.daggerReady > 0 || p.dualRecast > 0)) continue;
      this.waste[k] = (this.waste[k] || 0) + dt;
    }
  },
  recentDps(sec = 5) { const i1 = Math.floor(this.t); let s = 0; for (let i = Math.max(0, i1 - sec + 1); i <= i1; i++) s += this.timeline[i] || 0; return s / Math.min(sec, Math.max(1, this.t)); },
  totalCasts() { let c = 0, h = 0; for (const k of SKILL_KEYS) { c += this.casts[k] || 0; h += this.hits[k] || 0; } return { c, h }; },
  apm() { return this.inputs / Math.max(1 / 60, this.t / 60); },
  snapshot() { return JSON.parse(JSON.stringify({ casts: this.casts, hits: this.hits, dealt: this.dealtTotal, taken: this.takenTotal, mistakes: this.mistakes })); },
};
Stats.reset();

// ============================== 원딜 캐릭터 키트 (실제 스킬, 수치는 CONFIG.rangedKits) ==============================
// 각 키트: init / update / think(스킬 판단) / escape(위협 시 이탈) / dodge(투사체 회피) / aaRange / aaDamage / fireAA / onAAHit / onHit / draw
const KU = {
  inCone(ai, dir, range, angleDeg, u) { return Geo.inSector(ai.pos, V.ang(dir), range, angleDeg / 2 * Math.PI / 180, u.pos, u.r); },
  // 캐시를 dir 방향으로 밀어냄 — 벽에 닿으면 onWall 호출 (리오 연사 넉백)
  knock(u, dir, dist, time, onWall) {
    if (u.dead || u.unstoppable > 0) return;
    const t = Geo.rayHit(u.pos, dir, dist, u.r), len = t === Infinity ? dist : Math.max(0, t - 0.02);
    u.forced = { from: V.copy(u.pos), to: V.add(u.pos, V.mul(dir, len)), t: 0, dur: time * len / Math.max(0.1, dist) + 0.01, onEnd: t === Infinity ? null : onWall };
  },
  segCross(a1, a2, b1, b2) {   // 선분 교차
    const d = (a2.x - a1.x) * (b2.y - b1.y) - (a2.y - a1.y) * (b2.x - b1.x); if (Math.abs(d) < 1e-9) return false;
    const u = ((b1.x - a1.x) * (b2.y - b1.y) - (b1.y - a1.y) * (b2.x - b1.x)) / d, v = ((b1.x - a1.x) * (a2.y - a1.y) - (b1.y - a1.y) * (a2.x - a1.x)) / d;
    return u >= 0 && u <= 1 && v >= 0 && v <= 1;
  },
  ring(ctx, pos, r, col, alpha, dash) { ctx.save(); ctx.globalAlpha = alpha; ctx.strokeStyle = col; ctx.lineWidth = 0.06; if (dash) ctx.setLineDash([0.2, 0.12]); Draw.circle(ctx, pos.x, pos.y, r); ctx.stroke(); ctx.restore(); },
  fill(ctx, pos, r, col, alpha) { ctx.save(); ctx.globalAlpha = alpha; ctx.fillStyle = col; Draw.circle(ctx, pos.x, pos.y, r); ctx.fill(); ctx.restore(); },
};

// 부쉬 체크용: 추정 지점 방향(약간의 오차)
KU.aimAt = (ai, pt) => V.fromAng(V.ang(V.sub(pt, ai.pos)) + (Math.random() - 0.5) * 2 * ai.diff.aimErr);

const Kits = {
  // ---------------- 카티야 (저격총) ----------------
  katja: {
    init(ai) { ai.psT = 0; },
    update(ai, dt) { if (ai.psT > 0) ai.psT -= dt; },
    // P 잿빛 사신: Q·E 후 5초 안의 다음 평타에 추가 스킬 피해
    onAAHit(ai, u) {
      if (ai.psT <= 0) return; ai.psT = 0; const P = ai.kitCfg.P;
      ai.hitP(u, (ai.pick(P.base, 'P') + ai.ad * ai.pick(P.ad, 'P')) * ai.diff.dmgMul, { name: P.name, noPassive: true });
    },
    think(ai, p, d) {
      const K = ai.kitCfg;
      // R 정밀 조준: 캐시가 멀고 진입이 어려울 때 — 0.8초 스캔(제자리 고정) 후 회피 불가 탄
      if (ai.cds.R <= 0 && d > 7.5 && d < K.R.range && (p.skills.Q.cd > 1 || d > 9.5)) {
        const pos = Geo.pushOut(ai.predict(p, K.R.scan), 0.3);
        ai.cds.R = ai.pick(K.R.cd, 'R');
        ai.startChannel(K.R.scan, { tele: { kind: 'circle', pos, r: K.R.radius, color: '#ff4d4d' }, cancelIfClose: 3.5,
          onEnd: (a, cancelled) => {
            if (cancelled || V.dist(p.pos, pos) > K.R.radius + p.r) { ai.cds.R = ai.pick(K.R.cd, 'R') * (1 - K.R.refund); FX.text(ai.pos, '스캔 실패', '#8a93a6', 12); return; }
            Sfx.play('ult');
            ai.shoot({ dir: V.norm(V.sub(p.pos, ai.pos)), speed: K.R.speed, range: 99, width: 0.5, len: 1.8, color: '#ff4d4d', home: p,
              onHit: u => { ai.hitP(u, (ai.pick(K.R.base, 'R') + ai.ad * K.R.ad) * ai.diff.dmgMul, { name: K.R.name }); FX.burst(u.pos, '#ff4d4d', 18, 7); FX.addShake(6); } });
          } });
        FX.text(ai.pos, K.R.name, ai.motif.color, 13, { bold: true });
        return true;
      }
      // 무기 스킬 저격: 멀리서 제자리 고정 저격 모드 (저지 사격 2발 → 데드아이)
      if (ai.cds.D <= 0 && d > 7.5 && d < K.D.range - 1 && (p.skills.Q.cd > 1 || d > 9)) { this.snipe(ai, p); return true; }
      // Q 조준 사격
      if (ai.cds.Q <= 0 && d <= K.Q.range - 0.5) {
        const dir = ai.aimDir(p, K.Q.windup, K.Q.speed); ai.cds.Q = ai.pick(K.Q.cd, 'Q');
        ai.startCast(K.Q.windup, () => {
          Sfx.play('throw'); ai.psT = ai.kitCfg.P.window;
          ai.shoot({ dir, speed: K.Q.speed, range: K.Q.range, width: K.Q.width, len: 1.1, onHit: (u, pr) => {
            const k = clamp(pr.traveled / K.Q.range, 0, 1), amt = lerp(ai.pick(K.Q.min, 'Q') + ai.ad * K.Q.minAd, ai.pick(K.Q.max, 'Q') + ai.ad * K.Q.maxAd, k) * ai.diff.dmgMul;
            ai.hitP(u, amt, { name: K.Q.name }); ai.addAs(ai.pick(K.Q.asBuff, 'Q'), K.Q.asDur, 'katjaQ'); FX.burst(u.pos, ai.motif.color, 10, 5);
          } });
        }, { kind: 'line', dir, len: K.Q.range, width: K.Q.width });
        return true;
      }
      return false;
    },
    snipe(ai, p) {
      const K = ai.kitCfg.D; let fired = 0, phase = 'aim', t = 0, dir = ai.aimDir(p, K.aim, K.speed);
      ai.cds.D = ai.pick(K.cd, 'D'); FX.text(ai.pos, K.name, ai.motif.color, 13, { bold: true });
      ai.startChannel(K.shots * (K.aim + K.gap) + 0.1, { cancelIfClose: 4.5, tele: { kind: 'line', dir, len: K.range, width: K.width, color: '#ff4d4d' },
        onTick: (dt, a) => {
          t += dt;
          if (phase === 'aim') { dir = V.norm(V.lerp(dir, ai.aimDir(p, K.aim - t, K.speed), 0.15)); a.tele.dir = dir; a.tele.width = K.width * (1.6 - t / K.aim); }
          if (phase === 'aim' && t >= K.aim) {
            const dead = fired === K.shots - 1, S = dead ? K.dead : K.shot; fired++; phase = 'gap'; t = 0; Sfx.play(dead ? 'ult' : 'throw');
            ai.shoot({ dir, speed: K.speed, range: K.range, width: K.width, len: 1.6, color: dead ? '#ff4d4d' : ai.motif.color, onHit: u => {
              let amt = ai.calc(S, 'D'); if (dead) amt *= 1 + clamp(1 - u.hp / u.maxHp, 0, 1) * (K.dead.missMax - 1);   // 데드아이: 잃은 체력 비례 최대 2배
              ai.hitP(u, amt, { name: dead ? '데드아이' : '저지 사격' }); if (!dead) u.addSlow(K.shot.slow, K.shot.slowDur);
            } });
          }
          if (phase === 'gap' && t >= K.gap) { phase = 'aim'; t = 0; if (fired >= K.shots) a.stop = true; }
        },
        onEnd: (a, cancelled) => { if (cancelled && fired === 0) ai.cds.D *= 0.5; } });   // 한 발도 못 쏘고 풀리면 쿨 50% 반환
    },
    checkBush(ai, est) {
      const K = ai.kitCfg, d = V.dist(ai.pos, est);
      if (ai.cds.W <= 0 && d <= K.W.range) {   // 정찰 다트: 착탄 지점 반경 4.5m 시야 3초
        const W = K.W, to = V.copy(est); ai.cds.W = ai.pick(W.cd, 'W');
        ai.startCast(0.2, () => {
          Sfx.play('throw'); FX.trail(ai.pos, to, '#9fd8ff', 0.12, d / W.speed + 0.2);
          ai.pendingShots.push({ t: d / W.speed, fn: () => { Vision.reveals.push({ team: ai.team, pos: to, r: W.radius, t: W.dur }); FX.ring(to, 0.5, W.radius, '#9fd8ff', 0.5, 0.08); } });
        }, { kind: 'line', dir: V.norm(V.sub(to, ai.pos)), len: d, width: 0.3, color: '#9fd8ff' });
        FX.text(ai.pos, W.name, ai.motif.color, 12, { bold: true }); return true;
      }
      if (ai.cds.Q <= 0 && d <= K.Q.range - 0.5) {   // 조준 사격으로 부쉬 찌르기
        const dir = KU.aimAt(ai, est); ai.cds.Q = ai.pick(K.Q.cd, 'Q');
        ai.startCast(K.Q.windup, () => { Sfx.play('throw'); ai.psT = K.P.window;
          ai.shoot({ dir, speed: K.Q.speed, range: K.Q.range, width: K.Q.width, len: 1.1, onHit: (u, pr) => {
            const k = clamp(pr.traveled / K.Q.range, 0, 1); ai.hitP(u, lerp(ai.pick(K.Q.min, 'Q') + ai.ad * K.Q.minAd, ai.pick(K.Q.max, 'Q') + ai.ad * K.Q.maxAd, k) * ai.diff.dmgMul, { name: K.Q.name }); } });
        }, { kind: 'line', dir, len: K.Q.range, width: K.Q.width });
        return true;
      }
      return false;
    },
    // E 접근 금지: 전방 부채꼴 사격(둔화) 후 뒤로 4m 도약(벽 넘기 가능, 시전 후 CC 무시)
    escape(ai, p, dir) {
      const K = ai.kitCfg.E; if (ai.cds.E > 0) return false;
      const fwd = V.norm(V.sub(p.pos, ai.pos)); ai.cds.E = ai.pick(K.cd, 'E'); ai.unstoppable = K.windup + K.leapTime;
      ai.startCast(K.windup, () => {
        Sfx.play('throw'); ai.psT = ai.kitCfg.P.window;
        if (KU.inCone(ai, fwd, K.range, K.angle, p)) { ai.hitP(p, (ai.pick(K.base, 'E') + ai.ad * K.ad) * ai.diff.dmgMul, { name: K.name }); p.addSlow(ai.pick(K.slow, 'E'), K.slowDur); ai.addMsBuff(K.msBuff, K.msDur, false, 'katjaE'); }
        FX.slash(ai.pos, V.ang(fwd), K.range, K.angle / 2 * Math.PI / 180, ai.motif.color, 0.25);
        ai.dashTo(V.mul(fwd, -1), K.leap, K.leapTime, true, K.name);
      }, { kind: 'cone', dir: fwd, len: K.range, angle: K.angle });
      return true;
    },
  },

  // ---------------- 리오 (활) ----------------
  rio: {
    init(ai) { ai.stance = 'long'; ai.kc = 0; ai.kcReady = false; ai.zones = []; },
    // P 카이: 방관 = 기본 + 치명확률×10%
    pen(ai) { const P = ai.kitCfg.P; return ai.pick(P.pen, 'P') + ai.critChance * P.penPerCrit; },
    asFlat(ai) { return ai.stance === 'long' ? -ai.kitCfg.Q.long.asPenalty : 0; },
    aaRange(ai) { const Q = ai.kitCfg.Q; return ai.stance === 'short' ? Q.short.range : Q.long.range + (ai.kcReady ? Q.longRange : 0); },
    gainKc(ai) { if (ai.kcReady) return; if (++ai.kc >= ai.kitCfg.Q.stacks) { ai.kcReady = true; ai.kc = 0; FX.text(ai.pos, '카이츄', ai.motif.color, 11, { bold: true }); } },
    // 평타: 치명 없음, ×(1.02 + 치명확률×0.75) × 활 계수 — 단궁은 3발(36% + 35%×2), 화궁은 1발(102%)
    fireAA(ai, p, dir) {
      const Q = ai.kitCfg.Q, M = (1.02 + ai.critChance * 0.75) * ai.diff.dmgMul, ready = ai.kcReady;
      if (ready) {   // 카이츄 발동
        ai.kcReady = false;
        if (ai.stance === 'short') { ai.addMsBuff(ai.pick(Q.shortMs, 'Q'), Q.buffDur, true, 'rioQ'); ai.addAs(ai.pick(Q.shortAs, 'Q'), Q.buffDur, 'rioQ'); }
      }
      const land = (u, ratio, main) => {
        let amt = ai.ad * ratio * M;
        if (main && ready && ai.stance === 'long') amt *= 1 + clamp(1 - u.hp / u.maxHp, 0, 1) * 100 * Q.longMissing / 100;   // 잃은 체력 1%당 0.3%
        Combat.damage(ai, u, amt, { type: 'normal', source: '적 평타', pen: this.pen(ai) });
        if (main) this.gainKc(ai);
      };
      if (ai.stance === 'short') {
        ai.shoot({ dir, speed: 26, range: Q.short.range + 1.5, width: 0.3, len: 0.5, onHit: u => land(u, Q.short.ratio, true) });
        for (const s of [-1, 1]) ai.shoot({ dir: V.fromAng(V.ang(dir) + s * 0.06), speed: 26, range: Q.short.range + 1.5, width: 0.3, len: 0.4, onHit: u => land(u, Q.short.extraRatio, false) });
      } else ai.shoot({ dir, speed: 24, range: this.aaRange(ai) + 1.5, width: 0.3, len: 0.8, onHit: u => land(u, Q.long.ratio, true) });
      return true;
    },
    onHit(ai, u, o) { if (o.kc !== false) this.gainKc(ai); if (o.hanare) for (const k of ['Q', 'E', 'R', 'D']) ai.cds[k] = Math.max(0, ai.cds[k] - ai.kitCfg.W.cdReduce); },
    update(ai, dt) {
      const p = Game.player;
      for (const z of ai.zones) {   // 단궁 하나레 둔화 바람 / 곡사 착탄
        z.t += dt;
        if (z.type === 'wind' && p && !p.dead && V.dist(p.pos, z.pos) <= z.r + p.r * 0.5) p.addSlow(z.slow, 0.1);
        if (z.type === 'arc' && !z.hit && z.t >= z.delay) {
          z.hit = true; const D = ai.kitCfg.D, dd = p ? V.dist(p.pos, z.pos) : 99;
          if (p && !p.dead && dd <= D.radius + p.r * 0.5) { const inner = dd <= D.innerR; ai.hitP(p, ai.calc(inner ? { base: D.inner, bad: D.innerBad, sp: D.innerSp } : D, 'D'), { name: D.name }); p.addSlow(D.slow, D.slowDur); }
          FX.ring(z.pos, 0.5, D.radius, ai.motif.color, 0.35, 0.12); FX.burst(z.pos, ai.motif.color, 16, 5);
        }
      }
      ai.zones = ai.zones.filter(z => z.type === 'wind' ? z.t < z.dur : !z.hit);
    },
    think(ai, p, d) {
      const K = ai.kitCfg;
      // Q 활 교체: 가까우면 단궁(지속 딜·카이팅), 멀면 화궁(긴 사거리 견제)
      const want = d <= 5.0 ? 'short' : 'long';
      if (ai.stance !== want && ai.cds.Q <= 0) { ai.stance = want; ai.cds.Q = K.Q.cd; FX.text(ai.pos, want === 'short' ? '단궁' : '화궁', ai.motif.color, 12, { bold: true }); }
      // R: 단궁 연사(붙은 캐시를 밀쳐냄, 벽꿍 기절) / 화궁 정사필중(장거리 둔화)
      if (ai.cds.R <= 0 && ai.stance === 'long' && d > 7 && (p.skills.Q.cd > 1 || d > 9)) { this.rLong(ai, p); return true; }
      // 무기 스킬 곡사
      if (ai.cds.D <= 0 && d > 6 && d < K.D.range) {
        const pos = Geo.pushOut(ai.predict(p, K.D.windup + K.D.delay), 0.2); ai.cds.D = ai.pick(K.D.cd, 'D');
        ai.startCast(K.D.windup, () => { ai.zones.push({ type: 'arc', pos, t: 0, delay: K.D.delay }); Sfx.play('throw'); }, { kind: 'circle', pos, r: K.D.radius });
        return true;
      }
      // W 하나레
      if (ai.cds.W <= 0) {
        const W = K.W, S = ai.stance === 'short' ? W.short : W.long;
        if (d <= S.range - 0.5) {
          const dir = ai.aimDir(p, 0.2, ai.stance === 'short' ? 30 : W.long.speed); ai.cds.W = ai.pick(W.cd, 'W');
          ai.startCast(0.2, () => {
            Sfx.play('throw');
            if (ai.stance === 'long') {
              ai.shoot({ dir, speed: W.long.speed, range: W.long.range, width: W.long.width, len: 1.4, onHit: u => { ai.hitP(u, (ai.pick(W.long.base, 'W') + ai.ad * W.long.ad) * ai.diff.dmgMul, { name: W.name, hanare: true }); u.addSlow(W.long.slow, W.long.slowDur); } });
            } else {
              let landed = 0;
              for (let i = 0; i < W.short.arrows; i++) {
                const a = V.ang(dir) + ((i / (W.short.arrows - 1)) - 0.5) * W.short.spread * Math.PI / 180;
                ai.pendingShots.push({ t: i * 0.06, fn: () => ai.shoot({ dir: V.fromAng(a), speed: 30, range: W.short.range, width: W.short.width, len: 0.6, onHit: u => {
                  const first = landed++ === 0, amt = (ai.pick(W.short.base, 'W') + ai.ad * W.short.ad) * ai.diff.dmgMul * (first ? 1 : W.short.repeat);
                  ai.hitP(u, amt, { name: W.name, hanare: first, kc: first }); if (first) ai.zones.push({ type: 'wind', pos: V.copy(u.pos), r: W.short.zoneR, t: 0, dur: W.short.zoneDur, slow: W.short.slow });
                } }) });
              }
            }
          }, { kind: ai.stance === 'long' ? 'line' : 'cone', dir, len: S.range, width: W.long.width, angle: W.short.spread });
          return true;
        }
      }
      return false;
    },
    checkBush(ai, est) {
      const K = ai.kitCfg, d = V.dist(ai.pos, est);
      if (ai.cds.D <= 0 && d < K.D.range) {
        const pos = V.copy(est); ai.cds.D = ai.pick(K.D.cd, 'D');
        ai.startCast(K.D.windup, () => { ai.zones.push({ type: 'arc', pos, t: 0, delay: K.D.delay }); Sfx.play('throw'); }, { kind: 'circle', pos, r: K.D.radius });
        return true;
      }
      if (ai.cds.W <= 0 && d <= K.W.long.range - 0.5) {
        if (ai.stance !== 'long') { ai.stance = 'long'; ai.cds.Q = K.Q.cd; }
        const W = K.W, dir = KU.aimAt(ai, est); ai.cds.W = ai.pick(W.cd, 'W');
        ai.startCast(0.2, () => { Sfx.play('throw');
          ai.shoot({ dir, speed: W.long.speed, range: W.long.range, width: W.long.width, len: 1.4, onHit: u => { ai.hitP(u, (ai.pick(W.long.base, 'W') + ai.ad * W.long.ad) * ai.diff.dmgMul, { name: W.name, hanare: true }); u.addSlow(W.long.slow, W.long.slowDur); } });
        }, { kind: 'line', dir, len: W.long.range, width: W.long.width });
        return true;
      }
      return false;
    },
    rLong(ai, p) {
      const R = ai.kitCfg.R.long, dir = ai.aimDir(p, R.windup, R.speed); ai.cds.R = ai.pick(ai.kitCfg.R.cd, 'R'); ai.kc = 0; ai.kcReady = true;
      ai.startCast(R.windup, () => {
        Sfx.play('ult');
        ai.shoot({ dir, speed: R.speed, range: 60, width: R.width, len: 2, color: '#ffffff', onHit: (u, pr) => {
          const boosted = pr.traveled > R.speed * R.boostAfter;   // 0.8초 비행 후 강화

  // ---------------- 아야 (권총) ----------------
  aya: {
    init(ai) { ai.pCd = 0; ai.reload = 0; },
    update(ai, dt) { if (ai.pCd > 0) ai.pCd -= dt; },
    // P 아야의 정의: 피격 시 보호막, 공격할 때마다 쿨 1초 감소
    onDamaged(ai) {
      if (ai.pCd > 0) return; const P = ai.kitCfg.P;
      ai.shield = Math.max(ai.shield, ai.calc(P, 'P') / ai.diff.dmgMul); ai.shieldT = P.dur; ai.pCd = P.cd; FX.text(ai.pos, P.name, ai.motif.color, 12, { bold: true });
    },
    onHit(ai) { ai.pCd = Math.max(0, ai.pCd - ai.kitCfg.P.perHit); },
    onAAHit(ai) {
      ai.pCd = Math.max(0, ai.pCd - ai.kitCfg.P.perHit);
      if (ai.reload > 0 && --ai.reload === 0) ai.asBuffs = ai.asBuffs.filter(a => a.tag !== 'reload');   // 무빙 리로드: 평타 2회 공속 +70%
    },
    think(ai, p, d) {
      const K = ai.kitCfg;
      // R 공포탄: 붙은 캐시를 공포로 떼어냄
      if (ai.cds.R <= 0 && d < K.R.radius - 0.8) { this.fear(ai, p); return true; }
      // Q 2연발: 대상 지정, 1발 평타(110%) + 2발 스킬
      if (ai.cds.Q <= 0 && d <= K.Q.range) {
        const Q = K.Q; ai.cds.Q = ai.pick(Q.cd, 'Q');
        ai.startCast(Q.windup / Math.max(1, ai.curAs()), () => {
          Sfx.play('throw');
          ai.shoot({ dir: V.norm(V.sub(p.pos, ai.pos)), speed: 30, range: 99, width: 0.3, len: 0.5, home: p, onHit: u => { ai.aaLand(u, Q.first); } });
          ai.pendingShots.push({ t: Q.gap, fn: () => ai.shoot({ dir: V.norm(V.sub(p.pos, ai.pos)), speed: 30, range: 99, width: 0.3, len: 0.6, home: p, onHit: u => ai.hitP(u, ai.calc(Q, 'Q'), { name: Q.name }) }) });
          ai.addAs(ai.pick(Q.asBuff, 'Q'), Q.asDur, 'ayaQ');
        }, null);
        return true;
      }
      // W 고정 사격: 한 방향으로 연사하며 이동 가능
      if (ai.cds.W <= 0 && d <= K.W.range - 0.5) {
        const W = K.W, dir = ai.aimDir(p, 0.3, W.speed), n = clamp(Math.round(W.shots + (ai.curAs() - 1) * 5), W.shots, W.maxShots);
        ai.cds.W = ai.pick(W.cd, 'W'); ai.noAA = W.dur; let fired = 0; FX.text(ai.pos, W.name, ai.motif.color, 12, { bold: true });
        ai.chans.push({ t: 0, dur: W.dur, dir, onTick: (dt, c) => {
          while (fired < n && c.t >= (fired / n) * W.dur) { fired++; Sfx.play('aa');
            ai.shoot({ dir: c.dir, speed: W.speed, range: W.range, width: W.width, len: 0.45, onHit: u => ai.hitP(u, ai.calc(W, 'W'), { name: W.name }) }); }
        } });
        return false;   // 이동은 계속(카이팅)
      }
      return false;
    },
    checkBush(ai, est) {
      const W = ai.kitCfg.W, d = V.dist(ai.pos, est);
      if (ai.cds.W > 0 || d > W.range + 0.5) return false;
      const dir = KU.aimAt(ai, est), n = clamp(Math.round(W.shots + (ai.curAs() - 1) * 5), W.shots, W.maxShots); let fired = 0;
      ai.cds.W = ai.pick(W.cd, 'W'); ai.noAA = W.dur; FX.text(ai.pos, W.name, ai.motif.color, 12, { bold: true });
      ai.chans.push({ t: 0, dur: W.dur, onTick: (dt, c) => {   // 부쉬를 좌우로 훑으며 연사
        while (fired < n && c.t >= (fired / n) * W.dur) { fired++; Sfx.play('aa');
          const sweep = V.fromAng(V.ang(dir) + Math.sin(fired * 1.3) * 0.18);
          ai.shoot({ dir: sweep, speed: W.speed, range: W.range, width: W.width, len: 0.45, onHit: u => ai.hitP(u, ai.calc(W, 'W'), { name: W.name }) }); }
      } });
      return true;
    },
    fear(ai, p) {
      const R = ai.kitCfg.R; ai.cds.R = ai.pick(R.cd, 'R'); FX.text(ai.pos, R.name, ai.motif.color, 13, { bold: true });
      ai.startCast(R.delay, () => {
        Sfx.play('ult'); FX.ring(ai.pos, 0.5, R.radius, '#ffffff', 0.4, 0.12); FX.addShake(6);
        if (V.dist(ai.pos, p.pos) <= R.radius + p.r) { ai.hitP(p, ai.calc(R, 'R'), { name: R.name }); if (p.applyFear(R.fear, ai.pos)) FX.text(p.pos, '공포!', '#b18cff', 16, { bold: true }); }
      }, { kind: 'circle', pos: ai.pos, r: R.radius, color: '#ffffff' });
    },
    escape(ai, p, dir, d) {
      const K = ai.kitCfg;
      if (ai.cds.R <= 0 && d < K.R.radius - 0.6) { this.fear(ai, p); return true; }
      if (ai.cds.E <= 0) { this.dash(ai, dir); return true; }
      if (ai.cds.D <= 0) {   // 무빙 리로드: 1초 이속(평타 불가) → 다음 평타 2회 공속 +70%
        const D = K.D; ai.cds.D = ai.pick(D.cd, 'D'); ai.addMsBuff(ai.pick(D.ms, 'D'), D.dur, false, 'reload'); ai.noAA = D.dur;
        ai.moveTarget = Geo.pushOut(V.add(ai.pos, V.mul(dir, 4)), ai.r); ai.kiteT = D.dur;
        ai.pendingShots.push({ t: D.dur, fn: () => { ai.reload = D.asShots; ai.addAs(D.asBuff, 5, 'reload'); } });
        FX.text(ai.pos, D.name, ai.motif.color, 12, { bold: true }); return true;
      }

    },
    dodge(ai, pd) { if (ai.cds.E > 0) return false; this.dash(ai, pd); return true; },
    // E 무빙턴: 즉시 4m 대시(벽 통과), Q·W 쿨 감소
    dash(ai, dir) {
      const E = ai.kitCfg.E; ai.cds.E = ai.pick(E.cd, 'E'); ai.dashTo(dir, E.dist, E.time, true, E.name);
