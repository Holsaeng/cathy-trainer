<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>캐시 수련장</title>
<style>
:root{--bg:#0b0d12;--panel:#141821f2;--line:#2a3140;--text:#e6e9ef;--muted:#8a93a6;--accent:#ff3b5c;--accent2:#3fd0c9;--gold:#ffc857}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;user-select:none}
canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
canvas#game3d{position:fixed;inset:0;width:100%;height:100%;display:none}
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,6,10,.78);backdrop-filter:blur(3px);z-index:10;padding:16px}
.overlay.show{display:flex}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 26px;width:min(940px,100%);max-height:94vh;overflow:auto;box-shadow:0 20px 60px #000a}
h1{font-size:30px;letter-spacing:2px}h1 span{color:var(--accent)}
h2{font-size:20px;margin-bottom:10px}h3{font-size:14px;margin:16px 0 8px;color:var(--accent2)}
.sub{color:var(--muted);font-size:13px;margin:6px 0 16px;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.mode{background:#1b2030;border:1px solid var(--line);border-radius:10px;padding:14px;cursor:pointer;transition:.15s}
.mode:hover{border-color:var(--accent);transform:translateY(-2px)}
.mode b{display:block;font-size:16px;margin-bottom:5px}.mode small{display:block;color:var(--muted);font-size:12px;line-height:1.5}
.btn kbd{margin-left:4px;font-size:10px;padding:0 4px;background:rgba(0,0,0,.25);border-color:rgba(255,255,255,.2)}
.grid{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:640px){.grid{grid-template-columns:1fr}}
.grid .mode{display:flex;flex-direction:column}
.btn{background:#222a3b;border:1px solid var(--line);color:var(--text);padding:7px 13px;border-radius:8px;cursor:pointer;font-size:13px;font-family:inherit}
.btn:hover{border-color:var(--accent)}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.btn.sel{border-color:var(--accent2);color:var(--accent2);background:#16302f}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:7px 0}
label{font-size:13px;color:var(--muted)}
input[type=number],select,textarea{background:#0f131b;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-family:inherit;width:100px}
select{width:auto;min-width:190px}
textarea{width:100%;height:80px;font-family:Consolas,monospace;font-size:12px}
table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--muted);font-weight:400}
.combo{padding:9px 12px;border:1px solid var(--line);border-radius:8px;margin:5px 0;cursor:pointer;background:#181d2a}
.combo.sel{border-color:var(--accent2)}.combo small{display:block;color:var(--muted);margin-top:4px;line-height:1.5}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:10px 0}
.stat{background:#1b2030;border-radius:8px;padding:9px 11px}.stat span{display:block;color:var(--muted);font-size:11px}.stat b{font-size:18px}
.grade{font-size:70px;font-weight:900;line-height:1}
.mist li{margin:3px 0 3px 18px;font-size:13px}
canvas.chart{width:100%;display:block;background:#0f131b;border-radius:8px;margin:6px 0}
#side{position:fixed;top:12px;right:12px;width:240px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:12px;z-index:5;display:none;pointer-events:none}
#side.show{display:block}#side h4{font-size:13px;margin-bottom:6px;color:var(--accent2)}#side h5{font-size:11px;color:var(--muted);margin:8px 0 4px;font-weight:400}
.kv{display:flex;justify-content:space-between;margin:2px 0}.kv span{color:var(--muted)}
.sbar{height:13px;background:#0f131b;border-radius:3px;margin:2px 0;position:relative;overflow:hidden}
.sbar i{position:absolute;left:0;top:0;bottom:0}.sbar em{position:relative;font-style:normal;font-size:10px;padding-left:4px;line-height:13px}
.stars{color:var(--gold);letter-spacing:2px}.lock{color:var(--muted)}
kbd{background:#222a3b;border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:12px}
</style>
<!-- 3D 그래픽(설정에서 선택): Three.js r128. 불러오지 못하면 2D로만 동작 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" onerror="window.__noThree=true"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>
</head>
<body>
<canvas id="game3d"></canvas>
<canvas id="game"></canvas>
<div id="side"></div>
<div id="overlay" class="overlay show"><div class="card" id="card"></div></div>
<script>
'use strict';
/* =====================================================================
 * 캐시(Cathy) 수련 시뮬레이터
 * 구조: CONFIG → 유틸/기하 → 저장/설정 → 사운드 → 이벤트 → 이펙트(FX)
 *       → 전투(Combat/Passive) → 엔티티(Unit/Cathy) → 스킬(Impl) → 투사체
 *       → AI(표적/결투) → 통계(Stats) → 모드(Modes) → 게임(Game) → 입력(Input)
 *       → 렌더(Render/HUD) → UI(메뉴/결과/차트)
 * 단위: 거리 m, 시간 s, 속도 m/s.  스킬 상태: 대기 → 선딜 → 발동 → 후딜 → 쿨타임
 * ===================================================================== */

// ============================== CONFIG ==============================

    { x: 10.8, y: 12.0, w: 1.2, h: 3.4 },
    { x: 21.4, y: 7.6, w: 1.4, h: 2.8 },

  bushes: [],                              // 현재 맵의 부쉬(수풀)
  // 맵: 가이드 영상 "부쉬와 암시야 이해", "벽으로 유도 후 벽 수쳐", "좁은 길목은 위험" 연습용
  maps: {
    // 벽 kind: 없음 = 높은 벽(이동·시야 차단) / 'low' = 낮은 턱·화단(이동만 차단, 시야 통과) / 'glass' = 창문 벽(이동 차단, 너머가 보임 — "병원 창문 벽은 함정")
    basic: { name: '기본 아레나', walls: [{ x: 10.8, y: 2.6, w: 1.2, h: 3.4 }, { x: 10.8, y: 12.0, w: 1.2, h: 3.4 }, { x: 21.4, y: 7.6, w: 1.4, h: 2.8 },
             { x: 14.6, y: 2.2, w: 3, h: 0.6, kind: 'low' }, { x: 14.6, y: 15.2, w: 3, h: 0.6, kind: 'low' }, { x: 26.5, y: 3.2, w: 0.5, h: 3.2, kind: 'glass' }, { x: 26.5, y: 11.6, w: 0.5, h: 3.2, kind: 'glass' }], bushes: [],
             spawns: { p: { x: 7, y: 9 }, e: { x: 25, y: 9 } }, animals: [{ x: 16, y: 5 }, { x: 16, y: 13 }, { x: 18.5, y: 9 }] },

      walls: [

    let t = l2 ? ((p.x - a.x) * abx + (p.y - a.y) * aby) / l2 : 0; t = clamp(t, 0, 1);

    else { let a = (x0 - o.x) / d.x, b = (x1 - o.x) / d.x; if (a > b) [a, b] = [b, a]; tmin = Math.max(tmin, a); tmax = Math.min(tmax, b); }
    if (Math.abs(d.y) < 1e-9) { if (o.y < y0 || o.y > y1) return Infinity; }
    else { let a = (y0 - o.y) / d.y, b = (y1 - o.y) / d.y; if (a > b) [a, b] = [b, a]; tmin = Math.max(tmin, a); tmax = Math.min(tmax, b); }
    if (tmax < tmin || tmax < 0) return Infinity;
    return tmin >= 0 ? tmin : Infinity;
  },
  // 광선이 벽/경계에 처음 닿는 거리 (dist 이내가 아니면 Infinity)
  rayHit(o, d, dist, pad) {
    let best = Infinity;
    for (const w of CONFIG.walls) { const t = Geo._slab(o, d, w.x - pad, w.y - pad, w.x + w.w + pad, w.y + w.h + pad); if (t < best) best = t; }
    const W = CONFIG.world.w, H = CONFIG.world.h;
    if (d.x > 1e-9) best = Math.min(best, (W - pad - o.x) / d.x); else if (d.x < -1e-9) best = Math.min(best, (pad - o.x) / d.x);
    if (d.y > 1e-9) best = Math.min(best, (H - pad - o.y) / d.y); else if (d.y < -1e-9) best = Math.min(best, (pad - o.y) / d.y);
    best = Math.max(0, best);
    return best <= dist ? best : Infinity;
  },
  // 간단한 길찾기: 목표까지 직선이 벽에 막히면 그 벽의 모서리를 경유
  detour(pos, target, r) {
    const dist = V.dist(pos, target); if (dist < 0.05) return target;
    const dir = V.norm(V.sub(target, pos)), pad = r - 0.05;
    let wall = null, bt = Infinity;
    for (const w of CONFIG.walls) { const t = Geo._slab(pos, dir, w.x - pad, w.y - pad, w.x + w.w + pad, w.y + w.h + pad); if (t < bt && t <= dist) { bt = t; wall = w; } }
    if (!wall) return target;
    const cp = r + 0.2, W = wall, corners = [{ x: W.x - cp, y: W.y - cp }, { x: W.x + W.w + cp, y: W.y - cp }, { x: W.x - cp, y: W.y + W.h + cp }, { x: W.x + W.w + cp, y: W.y + W.h + cp }];
    let best = null, bc = Infinity;
    for (const c of corners) {
      const cd = V.dist(pos, c); if (cd < 0.35) continue;   // 방금 도착한 모서리는 제외
      const t = Geo._slab(pos, V.norm(V.sub(c, pos)), W.x - pad, W.y - pad, W.x + W.w + pad, W.y + W.h + pad);
      if (t < cd - 0.05) continue;   // 모서리까지도 막힘
      const cost = cd + V.dist(c, target); if (cost < bc) { bc = cost; best = c; }
    }
    return best ? Geo.pushOut(V.copy(best), r) : target;
  },
  inWall(p, r) { return CONFIG.walls.some(w => p.x > w.x - r && p.x < w.x + w.w + r && p.y > w.y - r && p.y < w.y + w.h + r); },
  // 지형 통과 돌진의 착지점: 벽 안이면 진행 방향으로 빠져나간 지점, 그래도 안 되면 뒤로
  // 광선이 사각형을 지나는 구간 [진입, 이탈] (없으면 null)
  _span(o, d, x0, y0, x1, y1) {
    let tmin = -Infinity, tmax = Infinity;
    if (Math.abs(d.x) < 1e-9) { if (o.x < x0 || o.x > x1) return null; } else { let a = (x0 - o.x) / d.x, b = (x1 - o.x) / d.x; if (a > b) [a, b] = [b, a]; tmin = Math.max(tmin, a); tmax = Math.min(tmax, b); }
    if (Math.abs(d.y) < 1e-9) { if (o.y < y0 || o.y > y1) return null; } else { let a = (y0 - o.y) / d.y, b = (y1 - o.y) / d.y; if (a > b) [a, b] = [b, a]; tmin = Math.max(tmin, a); tmax = Math.min(tmax, b); }
    return tmax >= tmin && tmax > 0 ? [tmin, tmax] : null;
  },
  // 벽 넘는 돌진: 돌진 끝이 벽 안이면, 벽 두께의 thresh 비율 이상 지났으면 벽 너머로, 아니면 벽 앞에서 멈춤
  //  캐시 Q = 0.85 (벽 85%를 지나면 넘음) / 캐시 R = 0.8 / 다니엘 E·AI 도약 = 0.5 (벽 중심 안쪽에서 끝나면 못 넘음)
  passDash(o, d, dist, r, thresh = 0.5) {
    const W = CONFIG.world.w, H = CONFIG.world.h, inB = p => p.x >= r && p.x <= W - r && p.y >= r && p.y <= H - r;
    let L = dist; const end = q => V.add(o, V.mul(d, q));
    while (!inB(end(L)) && L > 0) L -= 0.05;   // 아레나 경계
    for (const w of CONFIG.walls) {
      const e = Geo._span(o, d, w.x - r, w.y - r, w.x + w.w + r, w.y + w.h + r);   // 몸 반경만큼 넓힌 벽
      if (!e || e[0] <= 0 || !(e[0] < L && L < e[1])) continue;                     // 돌진 끝이 이 벽 안일 때만
      const raw = Geo._span(o, d, w.x, w.y, w.x + w.w, w.y + w.h);
      const f = raw ? (L - raw[0]) / Math.max(1e-6, raw[1] - raw[0]) : 0;
      if (f >= thresh && inB(end(e[1] + 0.03)) && !Geo.inWall(end(e[1] + 0.03), r)) return e[1] + 0.03;   // 넘어감
      return Math.max(0, e[0] - 0.03);                                                                        // 벽 앞에서 멈춤
    }
    if (Geo.inWall(end(L), r)) return Geo.clampDash(o, d, L, r);
    return L;
  },
  passLanding(o, d, dist, r) { return Geo.passDash(o, d, dist, r, 0.5); },   // AI 도약(카티야 E 등): 벽 중심 규칙
  clampDash(o, d, dist, pad) { const t = Geo.rayHit(o, d, dist, pad); return t === Infinity ? dist : Math.max(0, t - 0.02); },
  // 벽 밖으로 밀어내기
  pushOut(pos, r) {
    for (const w of CONFIG.walls) {
      const cx = clamp(pos.x, w.x, w.x + w.w), cy = clamp(pos.y, w.y, w.y + w.h);
      const dx = pos.x - cx, dy = pos.y - cy, d = Math.hypot(dx, dy);
      if (d < 1e-6) {
        const l = pos.x - w.x, rr = w.x + w.w - pos.x, t = pos.y - w.y, b = w.y + w.h - pos.y, m = Math.min(l, rr, t, b);
        if (m === l) pos.x = w.x - r; else if (m === rr) pos.x = w.x + w.w + r; else if (m === t) pos.y = w.y - r; else pos.y = w.y + w.h + r;
      } else if (d < r) { pos.x = cx + dx / d * r; pos.y = cy + dy / d * r; }
    }
    pos.x = clamp(pos.x, r, CONFIG.world.w - r); pos.y = clamp(pos.y, r, CONFIG.world.h - r);
    return pos;
  },
};

// ============================== 시야(부쉬) ==============================
const Vision = {
  // 이터널 리턴 시야 규칙 (공식 패치 노트·나무위키·유튜브 시야 강의)
  //  · 기본 시야 낮 8.5m / 밤 3.4m → 서서히 6.4m. 높은 벽은 시야를 막고(암시야), 낮은 턱·화단은 이동만 막고 시야는 통과, 창문 벽은 너머가 보임
  //  · 부쉬: 안에서는 밖이 보이고 밖에서는 안이 안 보임(2.2m 이내·같은 부쉬 제외). 시야 안의 부쉬에 들어가면 흔들림이 보임
  //  · 시야 밖 행동은 소음(스킬·평타 '!' 핑, 발소리 — 부쉬 안에선 발소리 없음)으로 대략적인 위치가 드러남
  //  · 망원 카메라(13m, 벽에 가려짐, 은신 감지) · 정찰 드론(목표 지점 원형 5초, 벽 무시)
  reveals: [],   // 원형 시야 구역 {team, pos, r, t, drone} — 정찰 드론·카티야 정찰 다트 등 (벽 무시)
  fogOn: false,  // 시야 시스템 사용 여부 — 1:1 결투
  ghosts: {},    // 시야에서 사라진 적의 마지막 위치 {id: {pos, r, color, t}}
  noises: [],    // 소음 {pos, team, kind, r, t, max, src, born}
  rustles: [],   // 부쉬 흔들림 {b, pt, t, team}
  night: false, nightT: 0, cycleT: 0, timeMode: 'day',
  isBlocker(w) { return !w.kind || w.kind === 'wall'; },   // 시야를 막는 벽(높은 벽)
  // 시야 차단 벽까지의 거리 (없으면 Infinity)
  rayBlock(o, d, dist) {
    let best = Infinity;
    for (const w of CONFIG.walls) { if (!Vision.isBlocker(w)) continue; const t = Geo._slab(o, d, w.x, w.y, w.x + w.w, w.y + w.h); if (t < best) best = t; }
    return best <= dist ? Math.max(0, best) : Infinity;
  },
  baseSight() {
    const V0 = CONFIG.vision; if (!Vision.night) return V0.sight;
    return lerp(V0.night.start, V0.night.end, clamp(Vision.nightT / V0.night.ramp, 0, 1));
  },
  sightOf(u) { const rest = u.rest ? (Vision.night ? CONFIG.rest.sightNight : CONFIG.rest.sightDay) : 0; return ((u.sight || Vision.baseSight()) - rest) * (u.sightMul || 1); },   // 휴식 중 시야 감소
  // a→b 사이에 시야를 막는 벽이 없는가 (시야선)
  los(a, b) { const d = V.dist(a, b); if (d < 1e-6) return true; return Vision.rayBlock(a, V.mul(V.sub(b, a), 1 / d), d) === Infinity; },
  inSight(viewer, pt, r = 0) { return V.dist(viewer.pos, pt) - r <= Vision.sightOf(viewer) && Vision.los(viewer.pos, pt); },
  // 팀의 설치물(카메라)·원형 시야 구역이 이 지점을 보는가
  wards(team) { return Game.units.filter(u => u.kind === 'ward' && !u.dead && u.team === team); },
  zoneSees(team, pt, r = 0) {
    if (Vision.reveals.some(z => z.team === team && V.dist(z.pos, pt) - r <= z.r)) return true;
    return Vision.wards(team).some(w => V.dist(w.pos, pt) - r <= w.sightR() && Vision.los(w.pos, pt));
  },
  detects(team, pt) { return Vision.wards(team).some(w => w.detect && V.dist(w.pos, pt) <= w.sightR() && Vision.los(w.pos, pt)); },   // 은신 감지(망원 카메라)
  // 플레이어 기준으로 이 지점이 보이는가 (투사체·잔상·흔들림 표시용)
  pointVisible(pt) { const p = Game.player; return !Vision.fogOn || !p || (!p.dead && Vision.inSight(p, pt)) || Vision.zoneSees(p.team, pt); },
  // 시야 다각형: 반경까지 광선을 쏴서 시야 차단 벽에 막히는 지점들
  polyFrom(pos, R) {
    const N = CONFIG.vision.rays, pts = [];
    for (let i = 0; i < N; i++) { const a = i / N * Math.PI * 2, d = { x: Math.cos(a), y: Math.sin(a) }, t = Vision.rayBlock(pos, d, R); pts.push(V.add(pos, V.mul(d, t === Infinity ? R : t))); }
    return pts;
  },
  poly(viewer) { return Vision.polyFrom(viewer.pos, Vision.sightOf(viewer)); },
  bushAt(p) { return (CONFIG.bushes || []).findIndex(b => p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h); },
  // 점에서 부쉬 사각형까지 거리
  rectDist(p, b) { const dx = Math.max(b.x - p.x, 0, p.x - (b.x + b.w)), dy = Math.max(b.y - p.y, 0, p.y - (b.y + b.h)); return Math.hypot(dx, dy); },
  // viewer가 target을 볼 수 있는가
  visible(viewer, target) {
    if (!viewer || !target) return true;
    if (viewer.team === target.team) return true;
    const pt = target.pos, zone = () => Vision.zoneSees(viewer.team, pt, target.r);
    if (target.stealthT > 0) return Vision.detects(viewer.team, pt);                                     // 은신: 카메라만 감지
    if (viewer.blindT > 0 && V.dist(viewer.pos, pt) > (viewer.blindR || 4.5)) return zone();             // 시야 감소(다니엘 W) — 설치물 시야는 그대로
    if (Vision.fogOn && !Vision.inSight(viewer, pt, target.r)) return zone();                             // 시야 반경 밖·벽 뒤(암시야)
    if (target.revealT > 0) return true;                                                                   // 행동·피격 노출
    const b = Vision.bushAt(pt); if (b < 0) return true;
    if (Vision.bushAt(viewer.pos) === b || V.dist(viewer.pos, pt) <= CONFIG.vision.bushReveal) return true;
    return zone();                                                                                         // 부쉬 속: 카메라·드론 시야로만
  },
  // ---------- 소음 ----------
  // 시야 밖에서 난 소리: 스킬·평타는 '!' 핑, 이동은 발소리(부쉬 안에서는 발소리 없음)
  noise(u, kind) {
    if (!Vision.fogOn || !u || u.dead) return;
    const N = CONFIG.vision.noise, r = N[kind] || N.skill;
    if (kind === 'step' && Vision.bushAt(u.pos) >= 0) return;
    const j = kind === 'step' ? 0.2 : N.jitter, pos = { x: u.pos.x + (Math.random() - 0.5) * 2 * j, y: u.pos.y + (Math.random() - 0.5) * 2 * j };
    const life = kind === 'step' ? N.stepLife : N.ping;
    Vision.noises.push({ pos, team: u.team, kind, r, t: life, max: life, src: u, born: Game.time });
  },
  // 행동(스킬·평타) = 부쉬 속이면 잠깐 노출 + 소음
  act(u, kind = 'skill') { if (!u) return; u.revealT = Math.max(u.revealT || 0, CONFIG.vision.actionReveal); Vision.noise(u, kind); },
  // 이 유닛(듣는 쪽) 기준, since 이후 들린 상대 소음 중 가장 최근 것
  heard(listener, since = 0) {
    let best = null;
    for (const n of Vision.noises) if (n.team !== listener.team && n.team !== 2 && n.born > since && V.dist(n.pos, listener.pos) <= n.r && (!best || n.born > best.born)) best = n;
    return best;
  },
  // ---------- 부쉬 흔들림 ----------
  rustle(b, pt, team, skill) { if (b < 0) return; const R = Vision.rustles.find(r => r.b === b && r.team === team); if (R) { R.t = CONFIG.vision.rustle; R.pt = V.copy(pt); R.born = Game.time; R.skill = !!skill; } else Vision.rustles.push({ b, pt: V.copy(pt), t: CONFIG.vision.rustle, team, born: Game.time, skill: !!skill }); },
  // ---------- 낮/밤 ----------
  setTime(mode) { Vision.timeMode = mode || 'day'; Vision.night = mode === 'night'; Vision.nightT = 0; Vision.cycleT = 0; },
  updateTime(dt) {
    const V0 = CONFIG.vision;
    if (Vision.night) Vision.nightT += dt;
    if (Vision.timeMode !== 'cycle') return;
    Vision.cycleT += dt;
    const len = Vision.night ? V0.cycle.night : V0.cycle.day;
    if (Vision.cycleT >= len) {
      Vision.cycleT = 0; Vision.night = !Vision.night; Vision.nightT = 0;
      FX.toast(Vision.night ? '🌙 밤이 되었습니다 — 시야 3.4m에서 서서히 회복' : '☀ 낮이 되었습니다 — 시야 8.5m', Vision.night ? '#8fa8ff' : CONFIG.theme.gold);
    }
  },
  update(dt) {
    Vision.reveals = Vision.reveals.filter(z => (z.t -= dt) > 0);
    Vision.noises = Vision.noises.filter(n => (n.t -= dt) > 0);
    Vision.rustles = Vision.rustles.filter(r => (r.t -= dt) > 0);
    if (!Vision.fogOn || !Game.player) return;
    Vision.updateTime(dt);
    const N = CONFIG.vision.noise;
    for (const u of Game.units) {
      if (u.dead || u.kind === 'ward') continue;
      // 발소리
      const moving = V.len(u.vel || { x: 0, y: 0 }) > 0.6 || (u.act && u.act.type === 'dash');
      if (moving && (u.stepT = (u.stepT || 0) - dt) <= 0) { u.stepT = N.stepEvery; if (u.team !== 2) Vision.noise(u, 'step'); }
      // 부쉬 진입 흔들림
      const b = Vision.bushAt(u.pos);
      if (b >= 0 && u._bush !== b) Vision.rustle(b, u.pos, u.team);
      u._bush = b;
      // 마지막으로 본 위치 잔상(플레이어 시점)
      if (u.team === 0) continue;
      if (Vision.visible(Game.player, u)) Vision.ghosts[u.id] = { pos: V.copy(u.pos), r: u.r, color: u.color, t: CONFIG.vision.ghost, kind: u.kind };
      else if (Vision.ghosts[u.id]) { const g = Vision.ghosts[u.id]; if ((g.t -= dt) <= 0) delete Vision.ghosts[u.id]; }
    }
    for (const id in Vision.ghosts) { const u = Game.units.find(x => x.id === +id); if (!u || u.dead) delete Vision.ghosts[id]; }
  },
};

// ============================== 저장/설정 ==============================
const Store = {
  get(k, def) { try { const v = localStorage.getItem('cathySim.' + k); return v ? JSON.parse(v) : def; } catch (e) { return def; } },
  set(k, v) { try { localStorage.setItem('cathySim.' + k, JSON.stringify(v)); } catch (e) { /* 저장 불가 환경 */ } },
};
const DEFAULT_KEYS = { Q: 'q', W: 'w', E: 'e', R: 'r', D: 'd', F: 'f', S: 's', A: 'a', C: 'c', V: 'v', X: 'x' };   // C 망원 카메라 · V 정찰 드론
const DEFAULT_SETTINGS = { gfx: '2d', models3d: true, tactical: 'blink', character: 'cathy', fog: true, duelTime: 'day', duelMap: 'basic', duelAnimals: false, enemyBuild: 'same', castMode: 'normal', castModes: {}, smartCast: false, showRange: true, gameSpeed: 1, showHitbox: false, pointerLock: false, moveButton: 'right', sound: true, volume: 0.5, side: true, weapon: 'dagger', build: 'late' };
const Settings = Object.assign({}, DEFAULT_SETTINGS, Store.get('settings', {}));
Settings.keys = Object.assign({}, DEFAULT_KEYS, Settings.keys || {});
// 시전 방식: normal(키 → 좌클릭) / smart(키를 누르면 즉시) / release(누르는 동안 범위 표시, 떼면 시전)
if (!['normal', 'smart', 'release'].includes(Settings.castMode)) Settings.castMode = Settings.smartCast ? 'smart' : 'normal';
Settings.castModes = Object.assign({}, Settings.castModes || {});
const CAST_MODES = { normal: '일반 (키 → 좌클릭)', smart: '스마트 (누르면 즉시 발동)', release: '범위 표시 후 떼면 발동' };
const castModeOf = k => Settings.castModes[k] || Settings.castMode;
const saveSettings = () => Store.set('settings', Settings);

// ============================== 사운드 (Web Audio 합성) ==============================
const Sfx = {
  ctx: null, master: null, last: {},
  init() {
    if (this.ctx) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      this.ctx = new AC(); this.master = this.ctx.createGain(); this.master.connect(this.ctx.destination);
      const len = this.ctx.sampleRate * 0.5; this.nb = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const ch = this.nb.getChannelData(0); for (let i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
    } catch (e) { this.ctx = null; }
  },
  ok() {
    if (!this.ctx || !Settings.sound) return false;
    if (this.ctx.state === 'suspended') this.ctx.resume();
    this.master.gain.value = Settings.volume; return true;
  },
  tone(f, dur, type, vol, f2, delay = 0) {
    const t = this.ctx.currentTime + delay, o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.05);
  },
  noise(dur, vol, freq, type = 'bandpass', delay = 0) {
    const t = this.ctx.currentTime + delay, s = this.ctx.createBufferSource(), f = this.ctx.createBiquadFilter(), g = this.ctx.createGain();
    s.buffer = this.nb; f.type = type; f.frequency.value = freq;

  play(n) {
    if (!this.ok()) return;
    const now = performance.now(); if (this.last[n] && now - this.last[n] < 35) return; this.last[n] = now;
    switch (n) {
      case 'hit': this.noise(0.08, 0.25, 1800); this.tone(220, 0.07, 'square', 0.04, 110); break;
      case 'aa': this.noise(0.06, 0.2, 2600, 'highpass'); break;
      case 'dash': this.noise(0.18, 0.18, 900, 'lowpass'); this.tone(500, 0.15, 'sawtooth', 0.04, 1400); break;
      case 'slash': this.noise(0.2, 0.3, 3000); this.tone(900, 0.12, 'triangle', 0.06, 300); break;
      case 'throw': this.tone(1400, 0.12, 'triangle', 0.07, 2400); break;
      case 'stun': this.tone(180, 0.25, 'square', 0.1, 90); this.noise(0.15, 0.3, 600); break;
      case 'crit': this.tone(660, 0.12, 'sawtooth', 0.08, 990); this.tone(990, 0.18, 'sine', 0.08, 1320, 0.06); break;
      case 'ult': this.noise(0.45, 0.35, 700, 'lowpass'); this.tone(120, 0.45, 'sawtooth', 0.1, 60); break;
      case 'blink': this.tone(1200, 0.15, 'sine', 0.08, 400); break;
      case 'combo': [523, 659, 784, 1046].forEach((f, i) => this.tone(f, 0.16, 'triangle', 0.09, null, i * 0.07)); break;
      case 'win': [392, 523, 659, 784, 1046].forEach((f, i) => this.tone(f, 0.2, 'triangle', 0.09, null, i * 0.09)); break;
      case 'fail': this.tone(300, 0.25, 'square', 0.07, 150); break;
      case 'error': this.tone(200, 0.08, 'square', 0.05); break;
      case 'hurt': this.noise(0.2, 0.35, 400, 'lowpass'); this.tone(150, 0.2, 'sawtooth', 0.08, 80); break;

// ============================== 이벤트 버스 ==============================
const Events = {
  h: {},
  on(n, f) { (this.h[n] = this.h[n] || []).push(f); },
  emit(n, d) { const a = this.h[n]; if (a) for (const f of a.slice()) f(d || {}); },
  clear() { this.h = {}; },
};

// ============================== 이펙트 ==============================
const FX = {
  reset() { this.parts = []; this.texts = []; this.rings = []; this.slashes = []; this.trails = []; this.marks = []; this.arcs = []; this.toasts = []; this.shake = 0; this.toastLast = {}; },
  // 휘어진 큰 베기 궤적 (강화 평타의 내려찍기)
  arc(from, dir, len, bend, color, life = 0.4, width = 0.28) { this.arcs.push({ a: V.copy(from), dir: V.copy(dir), len, bend, color, life, max: life, width }); },
  // 대상 위에 교차하는 X자 베기 (R)
  xslash(pos, color = '#ff3b5c', n = 4) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI, d = V.fromAng(a), L = rand(1.6, 2.4);
      this.trail(V.sub(pos, V.mul(d, L / 2)), V.add(pos, V.mul(d, L / 2)), color, 0.14, 0.55);
      this.trail(V.sub(pos, V.mul(d, L / 2.4)), V.add(pos, V.mul(d, L / 2.4)), '#ffffff', 0.04, 0.4);
    }
  },
  // 피 튀김 (E 충돌)
  blood(pos) {
    this.burst(pos, '#ff2a3d', 34, 8, 0.7, 0.14); this.burst(pos, '#7a0010', 16, 5, 0.9, 0.18);
    this.ring(pos, 0.2, 2.0, '#ff2a3d', 0.4, 0.18);
  },
  burst(pos, color, n = 10, spd = 4, life = 0.5, size = 0.08) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = spd * (0.3 + Math.random() * 0.7);
      this.parts.push({ x: pos.x, y: pos.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life, max: life, color, size });
    }
  },
  text(pos, str, color = '#fff', size = 14, opt = {}) {
    const life = opt.life || 0.9;
    this.texts.push({ x: pos.x + (Math.random() - 0.5) * 0.5, y: pos.y - 0.6, vy: -1.3, str, color, size, life, max: life, bold: opt.bold });
  },
  ring(pos, r0, r1, color, life = 0.35, width = 0.06) { this.rings.push({ x: pos.x, y: pos.y, r0, r1, color, life, max: life, width }); },
  slash(pos, ang, R, half, color, life = 0.25, inner = 0) { this.slashes.push({ x: pos.x, y: pos.y, ang, R, half, color, life, max: life, inner }); },
  trail(a, b, color, width = 0.3, life = 0.25) { this.trails.push({ a: V.copy(a), b: V.copy(b), color, width, life, max: life }); },
  mark(pos, color) { this.marks.push({ x: pos.x, y: pos.y, color, life: 0.4, max: 0.4 }); },
  addShake(px) { this.shake = Math.min(14, Math.max(this.shake, px)); },
  toast(str, color = '#e6e9ef') {
    const now = performance.now(); if (this.toastLast[str] && now - this.toastLast[str] < 1200) return; this.toastLast[str] = now;
    this.toasts.push({ str, color, life: 1.8 }); if (this.toasts.length > 4) this.toasts.shift();
  },
  update(dt) {
    const dec = arr => arr.filter(o => (o.life -= dt) > 0);
    for (const p of this.parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.92; p.vy *= 0.92; }
    for (const t of this.texts) { t.y += t.vy * dt; t.vy *= 0.96; }
    this.parts = dec(this.parts); this.texts = dec(this.texts); this.rings = dec(this.rings); this.slashes = dec(this.slashes);
    this.trails = dec(this.trails); this.marks = dec(this.marks); this.toasts = dec(this.toasts); this.arcs = dec(this.arcs);
    this.shake = Math.max(0, this.shake - dt * 45);
  },

FX.reset();

// ============================== 전투 ==============================
const Combat = {
  // type: 'skill' | 'normal' | 'true'(고정 피해)
  damage(src, tgt, amount, o = {}) {
    if (!tgt || tgt.dead || tgt.invuln > 0) return 0;
    const type = o.type || 'skill';
    let dmg = amount;
    if (type !== 'true') dmg *= 100 / (100 + Math.max(0, tgt.def * (1 - (o.pen || 0))));   // 방어 관통(%) 반영
    if (o.min) dmg = Math.max(o.min, dmg);
    dmg = Math.max(0, dmg);
    let absorbed = 0;
    if (tgt.shield > 0) { absorbed = Math.min(tgt.shield, dmg); tgt.shield -= absorbed; }
    tgt.hp -= dmg - absorbed;
    tgt.flash = 0.12;
    const col = type === 'true' ? '#ffd1dc' : type === 'normal' ? (o.crit ? '#ff5d5d' : '#ffffff') : '#ffb347';
    if (o.tick) FX.text(tgt.pos, String(Math.max(1, Math.round(dmg))), '#ff8fa8', 10); else FX.text(tgt.pos, (o.crit ? '✦' : '') + Math.round(dmg), col, o.crit ? 20 : type === 'true' ? 12 : 15, { bold: o.crit || type === 'skill' });
    if (src === Game.player) Stats.dealt(o.source || '?', dmg);
    if (tgt === Game.player) { Stats.takenTotal += dmg; Stats.playerHits++; Events.emit('playerHit', { dmg }); Sfx.play('hurt'); tgt.revealT = Math.max(tgt.revealT || 0, CONFIG.vision.hitReveal); }   // 피격 시 위치 노출
    else if (!o.tick) Sfx.play('hit');
    Rest.onDamage(src, tgt, o);   // 직접 피해: 전투 상태 + 휴식 취소
    if (!o.noShake) FX.addShake(o.crit ? 6 : type === 'true' ? 0 : 2.5);
    if (tgt.onDamaged && !tgt.dead) tgt.onDamaged(dmg, src);   // 피격 반응(예: 아야 패시브 보호막)
    if (tgt.hp <= 0) this.kill(src, tgt);
    if (src && src.onDealt && dmg > 0) src.onDealt(tgt, dmg, o);   // 다니엘: 영감 축적·최근 피해
    if (o.trauma && src === Game.player && src.usesTrauma !== false && !tgt.dead) Passive.applyTrauma(tgt, o.source);
    return dmg;
  },
  kill(src, tgt) {
    if (tgt.kind === 'ward') { tgt.hp = 0; tgt.dead = true; FX.burst(tgt.pos, '#c9cfdb', 10, 3, 0.4); FX.text(tgt.pos, '카메라 파괴', '#c9cfdb', 11, { bold: true }); return; }   // 시야 아이템
    if (tgt.infinite) { tgt.hp = tgt.maxHp; FX.text(tgt.pos, '체력 리셋', '#8a93a6', 11); return; }
    tgt.hp = 0; tgt.dead = true; tgt.deathT = 0;
    FX.burst(tgt.pos, tgt.color, 26, 7, 0.8, 0.12); FX.ring(tgt.pos, 0.3, 2, '#ffffff', 0.5);
    if (src === Game.player) Stats.kills++;
    Events.emit('kill', { unit: tgt });
    if (Game.time - (tgt.rMaxMark ?? -99) < 0.3) { Events.emit('rKillMax'); FX.toast('응급 OP 최대 피해 처치!', CONFIG.theme.gold); }
  },
};

// ============================== 패시브: 외과 전문의 ==============================
const Passive = {
  lvl() { return Game.player.build.passiveLv + 1; },
  applyTrauma(t, src) {
    const p = Game.player, P = CONFIG.passive;
    if (!t || t.dead || t.crit > 0 || t.kind === 'ward') return;
    if (P.traumaPerSkill) {   // 같은 스킬로는 한 번만 쌓임 — 지속시간만 갱신
      if (t.traumaT <= 0 || !t.traumaSrc) t.traumaSrc = new Set();
      if (src && t.traumaSrc.has(src)) { t.traumaT = P.traumaDur; return; }
      if (src) t.traumaSrc.add(src);
    }
    t.trauma = Math.min(P.stacks, t.trauma + 1); t.traumaT = P.traumaDur;
    this.bleed(t, 'trauma', Math.max(P.traumaMin || 0, p.sp * P.traumaSp), P.traumaDur, true);
    if (!t.dead && t.trauma >= P.stacks) this.critical(t, 'stack');
  },
  critical(t, by) {
    const p = Game.player, P = CONFIG.passive;
    if (!t || t.dead) return;
    if (t.crit > 0) {   // 이미 치명적 외상: 갱신. R로 다시 부여하면 Q 쿨 감소도 적용 (영상: R 직후 Q 재사용)
      t.crit = P.critDur; t.healRed = P.critDur;
      this.bleed(t, 'crit', t.maxHp * P.critMaxHp + p.sp * P.critSp, P.critDur);
      if (by === 'R' && CONFIG.passive.rReapplyQcdr) this.reduceQ(p);
      return;
    }
    t.trauma = 0; t.traumaT = 0; t.traumaSrc = null; t.crit = P.critDur; t.healRed = P.critDur;
    FX.ring(t.pos, 0.3, 1.8, CONFIG.theme.accent, 0.45, 0.12); FX.text(t.pos, '치명적 외상!', CONFIG.theme.accent, 17, { bold: true });
    Sfx.play('crit');
    t.bleeds = (t.bleeds || []).filter(b => b.kind !== 'trauma');   // 외상 → 치명적 외상으로 바뀜
    this.bleed(t, 'crit', t.maxHp * P.critMaxHp + p.sp * P.critSp, P.critDur);
    // 보호막 + 이동 속도 증가 준비
    p.shield = Math.max(p.shield, lv(P.shield, this.lvl()) + p.sp * P.shieldSp); p.shieldT = P.shieldDur; p.shieldBoostUsed = false;
    if (CONFIG.skills.Q.cdrOnAnyCritical || by === 'Q') this.reduceQ(p);
    Stats.criticals++; Events.emit('critical', { target: t });
  },
  // 출혈(고정 피해 지속): total을 dur초 동안 tick 간격으로 나눠 입힘. stack=true면 부여마다 따로 쌓이고, 아니면 같은 종류를 새로 갱신
  bleed(t, kind, total, dur, stack) {
    const P = CONFIG.passive, n = Math.max(1, Math.round(dur / P.tick));
    t.bleeds = t.bleeds || [];
    if (!stack) t.bleeds = t.bleeds.filter(b => b.kind !== kind);
    t.bleeds.push({ kind, src: Game.player, per: total / n, n, acc: 0 });
  },
  tickBleeds(u, dt) {
    if (!u.bleeds || !u.bleeds.length || u.dead) return;
    const P = CONFIG.passive;
    for (const b of u.bleeds) {
      b.acc += dt;
      while (b.acc >= P.tick && b.n > 0 && !u.dead) { b.acc -= P.tick; b.n--; Combat.damage(b.src, u, b.per, { type: 'true', source: 'P', noShake: true, tick: true }); }
    }
    u.bleeds = u.bleeds.filter(b => b.n > 0);
  },
  // Q 쿨다운 감소
  reduceQ(p) {
    const q = p.skills.Q; if (q.cd <= 0) return;
    q.cd *= 1 - lv(CONFIG.skills.Q.critCdr, q.lv); q.reduced = true; FX.text(p.pos, 'Q 쿨감', CONFIG.theme.accent2, 13, { bold: true });
  },
};

// ============================== 엔티티: 기본 유닛 ==============================
let UID = 0;
class Unit {
  constructor(o) {
    this.id = ++UID; this.team = o.team ?? 1; this.name = o.name || ''; this.kind = o.kind || 'unit';
    this.pos = { x: o.x, y: o.y }; this.spawn = { x: o.x, y: o.y }; this.r = o.r || 0.5;
    this.maxHp = o.hp || 1000; this.hp = this.maxHp; this.def = o.def || 0; this.baseMs = o.ms ?? 3.5;
    this.color = o.color || '#888'; this.facing = o.facing ?? Math.PI; this.infinite = !!o.infinite; this.respawn = !!o.respawn;
    this.brain = o.brain || null; this.ai = o.ai || {};
    this.resetState();
  }
  resetState() {
    this.hp = this.maxHp; this.dead = false; this.deathT = 0;
    this.moveTarget = null; this.vel = { x: 0, y: 0 }; this.root = 0; this.stun = 0; this.slows = []; this.msBuffs = [];
    this.unstoppable = 0; this.forced = null; this.shield = 0; this.shieldT = 0; this.trauma = 0; this.traumaT = 0;
    this.crit = 0; this.healRed = 0; this.flash = 0; this.invuln = 0; this.rMaxMark = -99; this.fear = 0; this.fearFrom = null; this.revealT = 0; this.bleeds = []; this.stealthT = 0; this.silence = 0; this.blindT = 0; this.untargetable = 0;
  }
  revive() { this.resetState(); this.pos = V.copy(this.spawn); FX.ring(this.pos, 0.2, 1.2, '#8a93a6', 0.4); }
  msMul() {
    let s = 0; for (const sl of this.slows) s = Math.max(s, sl.p);
    let b = 0; for (const m of this.msBuffs) b += m.p * (m.decay ? m.t / m.dur : 1);
    return Math.max(0.1, (1 - s) * (1 + b));
  }
  speed() { return this.baseMs * this.msMul(); }
  applyCC(type, dur) {
    if (this.dead || this.unstoppable > 0) return false;
    this[type] = Math.max(this[type], dur);
    if (type === 'stun') this.moveTarget = null;
    return true;
  }
  addSlow(p, dur) { if (this.unstoppable > 0) return; this.slows.push({ p, t: dur }); }
  addMsBuff(p, dur, decay, tag) { if (tag) this.msBuffs = this.msBuffs.filter(m => m.tag !== tag); this.msBuffs.push({ p, t: dur, dur, decay, tag }); }
  canMove() { return !this.dead && this.stun <= 0 && this.root <= 0 && !this.forced && this.baseMs > 0; }
  canAct() { return !this.dead && this.stun <= 0 && this.fear <= 0 && !this.forced; }
  // 공포: 시전자 반대 방향으로 걸어서 도망, 평타·스킬 불가
  applyFear(dur, from) { if (this.dead || this.unstoppable > 0) return false; this.fear = Math.max(this.fear, dur); this.fearFrom = V.copy(from); return true; }
  heal(a, silent) {
    if (this.dead) return 0;
    if (this.healRed > 0) a *= 1 - CONFIG.passive.healReduction;
    const before = this.hp; this.hp = Math.min(this.maxHp, this.hp + a);
    const h = this.hp - before; if (!silent && h > 0.5) FX.text(this.pos, '+' + Math.round(h), '#5dff9a', 12);
    return h;
  }
  tickStatus(dt) {
    const dec = k => { if (this[k] > 0) this[k] = Math.max(0, this[k] - dt); };
    ['root', 'stun', 'unstoppable', 'invuln', 'flash', 'healRed', 'crit', 'fear', 'revealT', 'stealthT', 'silence', 'blindT', 'untargetable'].forEach(dec);
    Passive.tickBleeds(this, dt);   // 외상·치명적 외상 출혈
    Rest.update(this, dt);   // 휴식(X)
    if (this.traumaT > 0) { this.traumaT -= dt; if (this.traumaT <= 0) this.trauma = 0; }
    if (this.shieldT > 0) { this.shieldT -= dt; if (this.shieldT <= 0) this.shield = 0; }
    this.slows = this.slows.filter(s => (s.t -= dt) > 0);
    this.msBuffs = this.msBuffs.filter(m => (m.t -= dt) > 0);
    if (this.forced) {   // 강제 이동(끌려감)
      const f = this.forced; f.t += dt; const k = Math.min(1, f.t / f.dur);
      this.pos = V.lerp(f.from, f.to, k);
      if (k >= 1) { Geo.pushOut(this.pos, this.r); const cb = f.onEnd; this.forced = null; if (cb) cb(); }
    }
  }
  moveStep(dt) {
    if (!this.moveTarget || !this.canMove()) { this.vel = { x: 0, y: 0 }; return; }
    // 경유점(벽 모서리)은 도착할 때까지 유지 → 진동 방지
    if (this.wp && (!this.wpFor || V.dist(this.wpFor, this.moveTarget) > 0.8)) this.wp = null;
    if (!this.wp) { const g = Geo.detour(this.pos, this.moveTarget, this.r); if (g !== this.moveTarget) { this.wp = g; this.wpFor = V.copy(this.moveTarget); } }
    const goal = this.wp || this.moveTarget;
    const to = V.sub(goal, this.pos), d = V.len(to), sp = this.speed() * dt;
    if (d <= sp || d < 0.01) {
      this.pos = V.copy(goal); this.vel = { x: 0, y: 0 };
      if (this.wp) this.wp = null; else this.moveTarget = null;
    }
    else { const dir = V.mul(to, 1 / d); this.pos = V.add(this.pos, V.mul(dir, sp)); this.vel = V.mul(dir, this.speed()); this.facing = V.ang(dir); }
    Geo.pushOut(this.pos, this.r);
  }
  update(dt) {
    this.tickStatus(dt); if (this.dead) return;
    if (this.brain && this.canAct()) this.brain(this, dt);
    this.moveStep(dt);
  }
}

// ============================== 플레이어: 캐시 ==============================
class Cathy extends Unit {
  constructor(x, y) {
    const b = CONFIG.builds[Game.buildId];
    super({ team: 0, x, y, r: 0.5, hp: b.hp, def: b.def, ms: b.ms, color: CONFIG.theme.accent, name: '캐시', kind: 'player', facing: 0 });
    this.build = b; this.weapon = Settings.weapon;
    this.ad = b.ad; this.bonusAd = b.bonusAd; this.sp = b.sp; this.critChance = b.crit; this.cdr = b.cdr;
    this.as = +(b.as * (CONFIG.basicAttack[this.weapon].asMul || 1)).toFixed(2);   // 무기별 공속 보정(쌍검은 느림)
    this.pendingHits = []; this.baseHpAtLv = 970 + 88 * (b.level - 1);   // 레벨 기본 체력(나무위키) — 추가 체력 계산용
    this.maxSt = b.stamina; this.st = b.stamina;
    this.skills = {};
    for (const k of ['Q', 'W', 'E', 'R', 'D', 'F']) this.skills[k] = { lv: k === 'F' ? (CONFIG.skills.F.lvByBuild[Game.buildId] || 1) : b.skill[k], cd: 0, cdMax: 1, reduced: false };
    this.cast = null; this.aa = { phase: 'none', t: 0, dur: 0 }; this.aaCd = 0;
    this.attackTarget = null; this.attackMove = null; this.enhanced = 0; this.buffer = null;
    this.daggerReady = 0; this.dualRecast = 0; this.lastAA = null; this.shieldBoostUsed = false; this.castSeq = 0; this.pendingMove = null;
  }
  skillDef(k) { if (k === 'F') return Object.assign({}, CONFIG.skills.F, Tactical.def(Tactical.key())); return k === 'D' ? CONFIG.skills[this.weapon === 'dagger' ? 'D_dagger' : 'D_dual'] : CONFIG.skills[k]; }
  skillLabel(k) { return k + ' ' + this.skillDef(k).name; }
  startCd(k) {
    const def = this.skillDef(k), s = this.skills[k];
    // 쿨감 공식(8.0 패치~, 상한 없음): 최종 쿨 = 기본 쿨 × 100 / (100 + 쿨감) — 쿨감 30이면 약 23% 감소. 무기·전술 스킬은 쿨 고정
    s.cd = s.cdMax = lv(def.cd, s.lv) * (def.fixedCd ? 1 : 100 / (100 + this.cdr * 100)) * Game.cdMul; s.reduced = false;
  }
  baseAaCfg() { return CONFIG.basicAttack[this.weapon]; }
  aaCfg() { const c = this.baseAaCfg(); return this.rangeBuff ? Object.assign({}, c, { range: c.range * (1 + this.rangeBuff.pct) }) : c; }   // 붉은 폭풍: 사거리 증가
  atkSpd() { return this.as * (this.lightWing ? 1 + CONFIG.tactical.lightwing.as : 1); }                                                     // 라이트 윙: 공속 20%
  aaWindupTime() { return this.enhanced > 0 ? CONFIG.basicAttack.enhanced.windup / Math.max(1, this.atkSpd()) : this.aaCfg().windupRatio / this.atkSpd(); }
  validTarget(t) { return t && !t.dead && Game.units.includes(t) && !(t.untargetable > 0) && (t.team === 0 || Vision.visible(this, t)); }   // 은신·대상 지정 불가면 평타 대상 해제

  // ---------- 명령 (Input에서 호출) ----------
  cmdMove(pt) {
    Stats.input(); FX.mark(pt, '#5dff9a'); if (this.rest) Rest.stop(this, null, true);
    this.attackTarget = null; this.attackMove = null;
    const dest = Geo.pushOut(V.copy(pt), this.r);
    if (this.cast) {
      const c = this.cast;
      if (c.phase === 'windup') {
        const def = this.skillDef(c.k);
        if (def.channel) { FX.toast('정신집중 중에는 움직일 수 없습니다', '#8a93a6'); return; }   // R: 이동 입력 무시
        const canCancel = CONFIG.input.moveCancelsWindup && def.moveCancel !== false;
        if (canCancel) { this.cancelCast(true); this.moveTarget = dest; } else this.pendingMove = dest;   // 수쳐 등 발사형은 끊기지 않고 발사 후 이동
        return;
      }
      if (c.phase === 'active') { this.pendingMove = dest; return; }
      if (c.phase === 'recovery') this.endCast();
    }
    this.breakAA(true);
    this.moveTarget = dest;
  }
  cmdAttack(t) {
    Stats.input(); FX.mark(t.pos, '#ff5d5d'); if (this.rest) Rest.stop(this, null, true);
    if (this.cast && this.cast.phase === 'recovery') this.endCast();
    if (this.attackTarget !== t && this.aa.phase === 'windup') this.aa.phase = 'none';
    this.attackTarget = t; this.attackMove = null; this.moveTarget = null;
  }
  cmdAttackMove(pt) {
    Stats.input(); FX.mark(pt, '#ffb347'); if (this.rest) Rest.stop(this, null, true);
    if (this.cast && this.cast.phase === 'recovery') this.endCast();
    this.breakAA(false);
    this.attackTarget = null; this.attackMove = Geo.pushOut(V.copy(pt), this.r); this.moveTarget = V.copy(this.attackMove);
  }
  cmdStop() {
    Stats.input();
    this.moveTarget = null; this.attackTarget = null; this.attackMove = null;
    this.breakAA(false);
    if (this.cast && this.cast.phase === 'recovery') this.endCast();
  }
  cmdSkill(k, aim) {
    Stats.input();
    if (this.dead) return;
    if (this.rest) Rest.stop(this, null, true);
    const busy = (this.cast && this.cast.phase !== 'recovery') || this.forced || this.stun > 0;
    if (busy) { this.buffer = { k, aim: V.copy(aim), time: performance.now() }; return; }
    this.tryCast(k, aim);
  }
  // 평타 모션 중단: 선딜(windup) 중 이동하면 평타가 취소됨
  breakAA(countMistake) {
    if (this.aa.phase === 'windup' && countMistake && this.aa.t > this.aa.dur * 0.35) Stats.mistake('평타 선딜 중 이동 → 평타 취소');
    this.aa.phase = 'none';
  }

  // ---------- 시전 ----------
  tryCast(k, aim) {
    const s = this.skills[k], def = this.skillDef(k);
    if (!s || s.lv <= 0) { FX.toast(`${def.name}: 아직 배우지 않았습니다`, '#aaa'); return false; }
    if (!this.canAct()) return false;
    if (k === 'F') { if (s.cd > 0) { this.cdError(k); return false; } return Tactical.use(this, aim); }   // 전술 스킬 (메뉴에서 선택)
    if (this.silence > 0) { FX.toast('침묵 — 스킬 사용 불가', '#b07cff'); Sfx.play('error'); return false; }
    if (k === 'D') return this.tryWeapon(aim);
    if (s.cd > 0) { this.cdError(k); return false; }
    if ((k === 'Q' || k === 'R') && this.root > 0) { FX.toast('속박 중에는 돌진할 수 없습니다'); return false; }
    const cost = def.stamina || 0; if (this.st < cost) { FX.toast('스태미나 부족', '#4aa3ff'); return false; }
    this.st -= cost;
    this.beginCast(k, aim, Impl[k], { cost });
    return true;
  }
  cdError(k) { Sfx.play('error'); HUD.flash(k); }
  tryWeapon(aim) {
    const s = this.skills.D, def = this.skillDef('D');
    if (this.weapon === 'dagger') {
      if (this.daggerReady > 0) {   // 2차: 대상 지정 이동
        const t = Game.pickEnemyAt(aim, CONFIG.input.pickRadius);
        if (!t) { Stats.mistake('단검 D: 대상 지정 실패 (커서 위에 적 없음)'); Sfx.play('error'); return false; }
        if (V.dist(this.pos, t.pos) - t.r > def.range) { Stats.mistake('단검 D: 사거리 밖 시전'); Sfx.play('error'); FX.toast('사거리 밖 (2.5m)'); return false; }
        this.beginCast('D', t.pos, Impl.Ddagger, { target: t }); return true;
      }
      if (s.cd > 0) { this.cdError('D'); return false; }
      // 1차: 유틸 — 이동 속도 증가 + 3초 내 재사용 가능 (TODO: 실제 1차 효과 확인)
      this.daggerReady = def.duration; this.addMsBuff(lv(def.msBoost, s.lv), def.msDur || def.duration, false, 'dagger');   // 망토: 1초 이속 증가
      this.enhanced = CONFIG.basicAttack.enhanced.timeout;   // 무기 스킬 사용 → 강화 평타
      FX.ring(this.pos, 0.3, 1.5, '#5ff0e6', 0.45, 0.1);
      for (let i = 0; i < 4; i++) { const a = i * Math.PI / 2 + Math.random(); FX.slash(this.pos, a, 1.3, 0.7, '#5ff0e6', 0.4, 0.7); }
      FX.burst(this.pos, '#7fb2ff', 14, 3); Sfx.play('blink'); Events.emit('action', { k: 'D1' });
      return true;
    }
    if (this.dualRecast > 0) { this.beginCast('D', aim, Impl.Ddual2, {}); return true; }
    if (s.cd > 0) { this.cdError('D'); return false; }
    this.beginCast('D', aim, Impl.Ddual1, {}); return true;
  }
  blink(aim) {
    const def = CONFIG.skills.F, dir = V.norm(V.sub(aim, this.pos)), dist = Math.min(def.dist, V.dist(this.pos, aim));
    const from = V.copy(this.pos); this.pos = Geo.pushOut(V.add(this.pos, V.mul(dir, Geo.passDash(this.pos, dir, dist, this.r, 0.5))), this.r);   // 벽 넘기 가능(벽 중심 규칙)
    if (this.skills.F.lv >= 2) this.addMsBuff(def.lv2Ms, def.lv2MsDur, false, 'blink');
    FX.burst(from, '#ffffff', 12, 3); FX.ring(this.pos, 0.2, 1, '#ffffff', 0.3); Sfx.play('blink');
    this.moveTarget = null; this.startCd('F'); Events.emit('action', { k: 'F' });
  }
  interruptForCast() {
    if (this.cast && this.cast.phase === 'recovery') this.endCast();
    this.aa.phase = 'none';
  }
  beginCast(k, aim, impl, extra) {
    this.interruptForCast();
    const dir = V.dist(aim, this.pos) > 0.05 ? V.norm(V.sub(aim, this.pos)) : V.fromAng(this.facing);
    const c = { k, impl, phase: 'windup', t: 0, aim: V.copy(aim), dir, ang: V.ang(dir), windup: impl.windup(this), recovery: impl.recovery(this),
      id: ++this.castSeq, hitAny: false, traumaSet: new Set(), data: Object.assign({}, extra), cost: extra.cost || 0 };
    this.cast = c; this.facing = c.ang; this.moveTarget = null; this.pendingMove = null;
    if (impl.start) impl.start(this, c);
    if (c.windup <= 0) this.fireCast();
  }
  fireCast() {
    const c = this.cast; c.phase = 'active'; c.t = 0; c.origin = V.copy(this.pos);
    c.data.snap = {}; for (const e of Game.enemies()) c.data.snap[e.id] = V.copy(e.pos);
    Stats.cast(c.k); Vision.act(this, 'skill');   // 부쉬 노출 + 시야 밖 상대에겐 '!' 소음
    const qwer = 'QWERD'.includes(c.k);   // 시즌 12: 무기 스킬 사용 후에도 강화 평타 발동
    if (qwer && this.enhanced > 0) Stats.mistake('강화 평타를 쓰지 않고 다음 스킬 연계');
    c.impl.fire(this, c);
    if (qwer) this.enhanced = CONFIG.basicAttack.enhanced.timeout;   // Q 지속 효과: 스킬 사용 후 다음 평타 강화
    Events.emit('action', { k: c.impl.action || c.k });
  }
  cancelCast(mistake) {
    const c = this.cast; if (!c) return;
    if (mistake) Stats.mistake(`${this.skillLabel(c.k)} 선딜 중 이동 입력으로 캔슬됨`);
    this.st = Math.min(this.maxSt, this.st + c.cost); this.cast = null;
  }
  endCast() {
    const c = this.cast; this.cast = null;
    if (c && c.impl.end && !c.ended) { c.ended = true; c.impl.end(this, c); }
    if (this.pendingMove) { this.moveTarget = this.pendingMove; this.pendingMove = null; }
  }
  updateCast(dt) {
    const c = this.cast; c.t += dt;
    if (c.phase === 'windup') { if (c.t >= c.windup) this.fireCast(); return; }
    if (c.phase === 'active') {
      const done = c.impl.tick ? c.impl.tick(this, c, dt) : true;
      if (done) { c.phase = 'recovery'; c.t = 0; if (c.impl.end) { c.ended = true; c.impl.end(this, c); } if (c.recovery <= 0 || this.pendingMove) this.endCast(); }   // 이동 입력이 대기 중이면 후딜 없이 바로 이동
      return;
    }
    if (c.phase === 'recovery' && c.t >= c.recovery) this.endCast();
  }

  // ---------- 기본 공격 ----------
  updateAA() {
    const a = this.aa, dt = CONFIG.sim.step;
    if (a.phase === 'windup') {
      if (!this.validTarget(this.attackTarget)) { a.phase = 'none'; return false; }
      this.facing = V.ang(V.sub(this.attackTarget.pos, this.pos)); a.t += dt;
      if (a.t >= a.dur) this.aaHit(this.attackTarget);
      return true;
    }
    if (a.phase === 'back') { a.t += dt; if (a.t >= a.dur) a.phase = 'none'; else return true; }
    if (this.attackMove && !this.validTarget(this.attackTarget)) {
      const e = Game.nearestEnemy(this.pos, CONFIG.input.attackMoveAcquire); if (e) this.attackTarget = e;
    }
    const t = this.attackTarget;
    if (this.validTarget(t)) {
      const d = V.dist(this.pos, t.pos) - t.r - this.r;
      if (d <= this.aaCfg().range) {
        this.moveTarget = null;
        if (this.aaCd <= 0 && this.canAct()) { a.phase = 'windup'; a.t = 0; a.dur = this.instantAA > 0 && this.enhanced > 0 ? 0.02 : this.aaWindupTime(); this.instantAA = 0; this.aaCd = 1 / this.atkSpd(); }
        return true;
      }
      if (this.canMove()) this.moveTarget = V.copy(t.pos);
      return false;
    } else if (this.attackTarget) this.attackTarget = null;
    if (this.attackMove && !this.moveTarget) this.attackMove = null;
    return false;
  }
  aaHit(t) {
    const cfg = this.aaCfg(), crit = Math.random() < this.critChance, enh = this.enhanced > 0, Q = CONFIG.skills.Q;
    if (enh) {   // 강화 평타: 1회 (쌍검은 공격력 110%)
      Combat.damage(this, t, this.ad * (this.weapon === 'dual' ? Q.dualEnhAd : 1) * (crit ? cfg.critMul : 1), { type: 'normal', source: 'AA', crit });
    } else {     // 일반 평타: 쌍검은 공격력 80% × 2회 (2타는 잠시 뒤)
      Combat.damage(this, t, this.ad * cfg.hitRatio * (crit ? cfg.critMul : 1), { type: 'normal', source: 'AA', crit });
      for (let i = 1; i < (cfg.hits || 1); i++) this.pendingHits.push({ t: cfg.hitGap * i, target: t });
    }
    if (enh) {
      this.enhanced = 0;
      if (!t.dead) Combat.damage(this, t, Math.max(Q.enhMin, this.sp * Q.enhSp), { type: 'skill', source: 'AA+', trauma: true, min: Q.enhMin });
      Stats.enhAA++; Events.emit('enhAA');
      { const d = V.fromAng(this.facing); FX.arc(V.sub(this.pos, V.mul(d, 0.3)), d, 3.4, 0.7, CONFIG.theme.accent, 0.45); FX.burst(t.pos, '#ffffff', 10, 5); FX.addShake(4); }
    }
    Stats.aaHits++; this.lastAA = { time: Game.time }; Vision.act(this, 'attack');
    Events.emit('action', { k: 'AA', enh });
    FX.burst(t.pos, enh ? '#ff9fb2' : '#ffffff', 6, 3); Sfx.play('aa');
    Tactical.onAA(this, t);
    this.aa.phase = 'back'; this.aa.t = 0; this.aa.dur = cfg.backRatio / this.atkSpd();
  }

  // ---------- 매 스텝 ----------
  update(dt) {
    this.tickStatus(dt); Tactical.update(this, dt);
    for (const k in this.skills) { const s = this.skills[k]; s.cd = Math.max(0, s.cd - dt); }
    this.aaCd -= dt;
    this.st = Math.min(this.maxSt, this.st + CONFIG.staminaRegen * dt);
    if (this.enhanced > 0) this.enhanced = Math.max(0, this.enhanced - dt);
    if (this.instantAA > 0) this.instantAA = Math.max(0, this.instantAA - dt);
    // 쌍검 2타: 대상이 살아 있고 사거리 근처면 적중 (치명 별도 판정)
    for (const h of this.pendingHits) {
      if ((h.t -= dt) > 0) continue; h.done = true;
      const t = h.target, cfg = this.aaCfg();
      if (!t || t.dead || this.dead || V.dist(this.pos, t.pos) - t.r - this.r > cfg.range + 0.6) continue;
      const crit = Math.random() < this.critChance;
      Combat.damage(this, t, this.ad * cfg.hitRatio * (crit ? cfg.critMul : 1), { type: 'normal', source: 'AA', crit, noShake: true });
      FX.burst(t.pos, '#ffffff', 4, 3); Sfx.play('aa');
    }
    this.pendingHits = this.pendingHits.filter(h => !h.done);
    if (this.daggerReady > 0) {
      this.daggerReady -= dt;
      if (this.daggerReady <= 0 && !(this.cast && this.cast.impl === Impl.Ddagger)) { this.daggerReady = 0; this.startCd('D'); this.msBuffs = this.msBuffs.filter(m => m.tag !== 'dagger'); }
    }
    if (this.dualRecast > 0) {
      this.dualRecast -= dt;
      if (this.dualRecast <= 0 && !(this.cast && this.cast.impl === Impl.Ddual2)) { this.dualRecast = 0; this.startCd('D'); }
    }
    if (this.dead) return;
    Stats.trackWaste(this, dt);
    this.passiveMoveBoost();
    if (this.forced) return;
    if (this.stasis) { this.vel = { x: 0, y: 0 }; return; }   // 아티팩트 경직: 행동 불가
    if (this.stun > 0) { if (this.cast && this.cast.phase === 'windup') this.cancelCast(false); this.aa.phase = 'none'; return; }
    if (this.fear > 0) {   // 공포: 시전 취소, 시전자 반대로 걸어감
      if (this.cast && this.cast.phase === 'windup') this.cancelCast(false);
      this.aa.phase = 'none'; this.attackTarget = null; this.buffer = null;
      if (this.fearFrom) this.moveTarget = Geo.pushOut(V.add(this.pos, V.mul(V.norm(V.sub(this.pos, this.fearFrom)), 2)), this.r);
      this.moveStep(dt); return;
    }
    if (this.cast) { this.updateCast(dt); if (this.cast) return; }
    if (this.buffer) {   // 선입력 처리
      const b = this.buffer; this.buffer = null;
      if (performance.now() - b.time <= CONFIG.input.bufferMs) this.tryCast(b.k, b.aim);
      else Stats.mistake('너무 이른 선입력 (입력 씹힘)');
      if (this.cast) return;
    }
    if (this.updateAA()) return;
    this.moveStep(dt);
    if (this.attackMove && !this.moveTarget && !this.attackTarget) this.attackMove = null;
  }
  // 패시브: 보호막 보유 중 외상 대상에게 이동하면 이동 속도 증가 후 감소
  passiveMoveBoost() {
    const P = CONFIG.passive;
    if (this.shield <= 0) return;
    if (this.shieldBoostUsed || !this.moveTarget) return;
    const md = V.norm(V.sub(this.moveTarget, this.pos)), cosA = Math.cos(P.moveBoostAngle * Math.PI / 180);
    for (const e of Game.enemies()) {
      if ((e.trauma > 0 || e.crit > 0) && V.dist(e.pos, this.pos) < 10 && V.dot(md, V.norm(V.sub(e.pos, this.pos))) > cosA) {
        this.addMsBuff(lv(P.moveBoost, Passive.lvl()), P.moveBoostDur, true, 'pboost'); this.shieldBoostUsed = true;
        FX.text(this.pos, '이속↑', CONFIG.theme.accent2, 12); break;
      }
    }
  }
}

// ============================== 스킬 적중 공통 처리 ==============================
function skillHit(p, c, e, amount, o = {}) {
  if (e.dead) return;
  c.hitAny = true;
  const first = Stats.hit(c.k, c.id);
  // 예측샷 판정: 움직이는 대상에게 '현재 위치가 아닌 곳'을 노려 맞췄는가
  if (first && c.data.snap && V.len(e.vel) > 0.6) {
    Stats.movingHits++;
    const s0 = c.data.snap[e.id];
    if (s0 && V.dist(s0, c.origin) > 1.5 && Math.abs(angDiff(V.ang(V.sub(s0, c.origin)), c.ang)) > 0.1) Stats.leadHits++;
  }
  const trauma = o.trauma !== false && !c.traumaSet.has(e.id);   // 외상은 시전당 대상 1회
  if (trauma) c.traumaSet.add(e.id);
  Combat.damage(p, e, amount, { type: 'skill', source: o.source || c.k, trauma });
  Events.emit('skillHit', { k: c.k, target: e });
}

// ============================== 스킬 구현 (선딜 → 발동 → 후딜) ==============================
const S = CONFIG.skills;
const Impl = {
  Q: {
    windup: () => S.Q.windup, recovery: () => S.Q.recovery,
    fire(p, c) {
      const s = p.skills.Q;
      if (s.reduced) { Events.emit('qReset'); FX.text(p.pos, 'Q 재사용!', CONFIG.theme.accent2, 14, { bold: true }); }
      p.startCd('Q');
      const len = S.Q.passWalls ? Geo.passDash(p.pos, c.dir, S.Q.dashDist, p.r, S.Q.wallPass) : Geo.clampDash(p.pos, c.dir, S.Q.dashDist, p.r);   // 벽 85% 이상 지나면 넘음
      Object.assign(c.data, { from: V.copy(p.pos), to: V.add(p.pos, V.mul(c.dir, len)), dur: Math.max(0.03, S.Q.dashTime * len / S.Q.dashDist), t: 0, hit: new Set() });
      Sfx.play('dash');
    },
    tick(p, c, dt) {
      const d = c.data; d.t += dt; const k = Math.min(1, d.t / d.dur), prev = V.copy(p.pos);
      p.pos = V.lerp(d.from, d.to, k); FX.trail(prev, p.pos, CONFIG.theme.accent, 0.42, 0.6); FX.trail(prev, p.pos, '#ffe0e6', 0.08, 0.35);
      for (const e of Game.enemies()) {
        if (d.hit.has(e.id)) continue;
        if (Geo.segDist(e.pos, d.from, p.pos) <= e.r + S.Q.hitWidth / 2) {
          d.hit.add(e.id);
          skillHit(p, c, e, lv(S.Q.dmg, p.skills.Q.lv) + p.sp * S.Q.sp);
          FX.burst(e.pos, '#7f9bff', 12, 5); FX.ring(e.pos, 0.1, 0.9, '#9fb4ff', 0.25, 0.08);
        }
      }
      return k >= 1;
    },
    end(p, c) { Stats.resolveShot('Q', c.hitAny); },
  },
  W: {
    windup: () => S.W.windup, recovery: () => S.W.recovery,
    fire(p, c) {
      p.startCd('W'); Sfx.play('slash');
      const half = S.W.angle / 2 * Math.PI / 180, l = p.skills.W.lv;
      FX.slash(p.pos, c.ang, S.W.range, half, CONFIG.theme.accent, 0.6, S.W.innerRange);
      FX.slash(p.pos, c.ang, S.W.innerRange, half * 0.9, '#e8edf5', 0.22, 0.6);
      let inner = 0, outer = 0;
      for (const e of Game.enemies()) {
        if (!Geo.inSector(p.pos, c.ang, S.W.range, half, e.pos, e.r)) continue;
        if (V.dist(p.pos, e.pos) + e.r <= S.W.innerRange) { /* 완전히 안쪽일 때만 안쪽 판정 */ skillHit(p, c, e, lv(S.W.innerDmg, l) + p.sp * S.W.innerSp, { trauma: false }); inner++; FX.trail(V.add(e.pos, V.fromAng(c.ang + 2.2)), V.add(e.pos, V.fromAng(c.ang - 0.9)), '#9fb4ff', 0.08, 0.3); }
        else { skillHit(p, c, e, lv(S.W.outerDmg, l) + p.sp * S.W.outerSp); e.addSlow(S.W.slow, S.W.slowDur); outer++; FX.text(e.pos, '바깥 적중', CONFIG.theme.accent2, 12, { bold: true }); }
      }
      if (inner > 0 && outer === 0) Stats.mistake('W 안쪽 범위만 적중 (외상·둔화 미적용)');
      Stats.resolveShot('W', inner + outer > 0);
    },
  },
  E: {

// ============================== 투사체 ==============================
class Projectile {
  constructor(o) { Object.assign(this, o); this.traveled = 0; this.hit = new Set(); this.seen = new Set(); this.dead = false; this.start = V.copy(o.pos); }
  finish() { if (!this.dead) { this.dead = true; if (this.onDone) this.onDone(this); } }
  update(dt) {
    if (this.homeTarget && !this.homeTarget.dead) {   // 유도: 목표 방향으로 회전
      const want = V.ang(V.sub(this.homeTarget.pos, this.pos)), cur = V.ang(this.dir), d = angDiff(want, cur), mx = (this.homeTurn || 10) * dt;
      this.dir = V.fromAng(cur + clamp(d, -mx, mx));
    }
    const prev = V.copy(this.pos), move = Math.min(this.speed * dt, this.range - this.traveled);
    const tw = this.homeTarget && this.owner && this.owner.team === 1 ? Infinity : Geo.rayHit(prev, this.dir, move, this.width / 2 + (this.wallPad || 0)), segEnd = tw < Infinity ? tw : move;
    // 이번 스텝 경로 위의 유닛을 진행 순서대로 판정
    const cands = [];
    for (const u of Game.units) {
      if (u.dead || u.team === this.team || this.hit.has(u.id) || u.untargetable > 0 || u.kind === 'ward') continue;
      const rel = V.sub(u.pos, prev), along = V.dot(rel, this.dir), perp = Math.abs(rel.x * this.dir.y - rel.y * this.dir.x);
      if (along >= -u.r && along <= segEnd + u.r && perp <= u.r + this.width / 2 + (this.assist || 0)) cands.push({ u, along });
    }
    cands.sort((a, b) => a.along - b.along);
    for (const { u, along } of cands) {
      this.hit.add(u.id);
      if (this.onUnit(this, u) === 'stop') { this.pos = V.add(prev, V.mul(this.dir, Math.max(0, along))); this.finish(); return; }
    }
    this.pos = V.add(prev, V.mul(this.dir, segEnd)); this.traveled += segEnd;
    const rb = Vision.bushAt(this.pos); if (rb >= 0 && rb !== this._rb) Vision.rustle(rb, this.pos, this.team, true); this._rb = rb;   // 스킬이 지나가면 부쉬가 흔들림
    if (tw < Infinity) { if (this.onWall) this.onWall(this, V.copy(this.pos)); this.finish(); return; }
    if (this.traveled >= this.range - 1e-6) this.finish();
  }
}

// ============================== 플레이어블: 다니엘 (단검) ==============================
// 캐시의 조작·시전·평타 흐름(Cathy)을 그대로 쓰고, 스킬 Q·W·E·R과 평타만 다니엘 것으로 교체
// 수치: CONFIG.rangedKits.daniel (나무위키) / 능력치: CONFIG.rangedMotifs.daniel (랭크 영상 HUD 실측, Lv6/12/18)

//  W 영감: 대상 지정(7m) 표식 — 4초 뒤 활성, 2.5초 안에 공격하면 축적 피해(고정) + 스킬 피해 폭발. 대상 시야 감소, 대상 주변 2m 시야
//  E 그림자 이동: 앞으로 3m 은신 돌진 → 3초간 평타 사거리 3m, 평타 시 대상 건너편으로 순간이동 + 추가 스킬 피해
//  R 걸작: 4초 안에 피해를 준 적(3m) 그림자 속으로 — 0.5초 침묵, 최대 2초 대상 지정 불가 + 지속 피해 4회, 끝나거나 R 재사용 시 커서 쪽으로 빠져나오며 마무리 피해
//  D 망토와 단검: 캐시와 같은 단검 무기 스킬 / P 고독한 예술가: 밤에 시야·이동 속도 증가
const DANIEL_SHORT = { Q: '가위', W: '영감', E: '그림자', R: '걸작' };
class DanielPlayer extends Cathy {
  constructor(x, y) {
    super(x, y);
    const M = CONFIG.rangedMotifs.daniel, st = ['early', 'mid', 'late'].includes(Game.buildId) ? Game.buildId : 'mid', si = ['early', 'mid', 'late'].indexOf(st);
    this.charKey = 'daniel'; this.name = '다니엘'; this.color = M.color; this.weapon = 'dagger'; this.usesTrauma = false;
    this.maxHp = this.hp = M.hp[si]; this.def = M.def[si]; this.baseMs = M.ms[si]; this.baseHpAtLv = 920 + 90 * (CONFIG.rangedAI.stages[st].level - 1);
    this.ad = M.ad[si]; this.bonusAd = Math.max(0, M.ad[si] - M.baseAd[si]); this.sp = 0; this.critChance = M.crit[si]; this.pen = M.pen[si]; this.aaAmp = M.aaAmp[si];
    this.baseAs = M.as[si]; this.as = this.baseAs; this.cdr = [0.15, 0.25, 0.25][si];   // 쿨감: HUD 실측 Lv11~20 25%
    this.build = Object.assign({}, this.build, { level: CONFIG.rangedAI.stages[st].level });
    const L = M.skillLv[si]; this.plv = L.P;
    for (const k of ['Q', 'W', 'E', 'R', 'D']) this.skills[k].lv = L[k];
    this.K = CONFIG.rangedKits.daniel;

  }

  calc(o, k) { return lv(o.base, this.L(k)) + this.ad * lv(o.ad || 0, this.L(k)) + this.bonusAd * lv(o.bad || 0, this.L(k)); }
  skillDef(k) {
    if (k === 'D') return CONFIG.skills.D_dagger;
    if (k === 'F') return super.skillDef('F');   // 선택한 전술 스킬
    const d = this.K[k]; return Object.assign({ short: DANIEL_SHORT[k] }, d);
  }
  baseAaCfg() { const b = CONFIG.basicAttack.dagger; return this.shadowT > 0 ? Object.assign({}, b, { range: this.K.E.aaRange }) : b; }
  aaWindupTime() { return CONFIG.basicAttack.dagger.windupRatio / this.atkSpd(); }

  // ---------- 시전 ----------
  tryCast(k, aim) {
    if (k === 'F' || k === 'D') return super.tryCast(k, aim);

    if (k === 'R' && this.shadow) { this.shadow.exit = true; return true; }   // R 재사용: 그림자에서 빠져나옴
    if (!s || s.lv <= 0) { FX.toast(`${def.name}: 아직 배우지 않았습니다`, '#aaa'); return false; }

    if (this.silence > 0) { FX.toast('침묵 — 스킬 사용 불가', '#b07cff'); Sfx.play('error'); return false; }
    if (s.cd > 0) { this.cdError(k); return false; }
    if (k === 'Q') return this.castQ(aim);
    if (k === 'W') return this.castW(aim);

    if (k === 'R') {
      const t = this.rTarget(aim);
      if (!t) { Stats.mistake('걸작: 4초 안에 피해를 준 적이 3m 안에 없음'); Sfx.play('error'); FX.toast('걸작: 최근 4초 안에 피해를 준 적에게만 (3m)'); return false; }
      this.beginCast('R', aim, DImpl.R, { target: t }); return true;

  }
  // 걸작 중 R 재사용 = 즉시 탈출 (시전 중이라 선입력으로 미루지 않음)
  cmdSkill(k, aim) {

  castQ(aim) {
    const K = this.K.Q, d = Math.min(K.range, V.dist(this.pos, aim)), dir = V.dist(aim, this.pos) > 0.05 ? V.norm(V.sub(aim, this.pos)) : V.fromAng(this.facing);
