// ============================== 투사체 ==============================
class Projectile {
  constructor(o) { Object.assign(this, o); this.pid = ++Projectile.seq; this.traveled = 0; this.hit = new Set(); this.seen = new Set(); this.dead = false; this.start = V.copy(o.pos); }   // pid: 스냅샷에서 같은 투사체 찾기용
  finish() { if (!this.dead) { this.dead = true; if (this.onDone) this.onDone(this); } }
  update(dt) {
    if (this.homeTarget && !this.homeTarget.dead) {   // 유도: 목표 방향으로 회전
      const want = V.ang(V.sub(this.homeTarget.pos, this.pos)), cur = V.ang(this.dir), d = angDiff(want, cur), mx = (this.homeTurn || 10) * dt;
      this.dir = V.fromAng(cur + clamp(d, -mx, mx));
    }
    const prev = V.copy(this.pos), move = Math.min(this.speed * dt, this.range - this.traveled);
    const tw = this.homeTarget && this.ignoreWalls ? Infinity : Geo.rayHit(prev, this.dir, move, this.width / 2 + (this.wallPad || 0), true), segEnd = tw < Infinity ? tw : move;
    // 이번 스텝 경로 위의 유닛을 진행 순서대로 판정
    const cands = [];
    for (const u of Game.units) {
      if (u.dead || u.team === this.team || this.hit.has(u.id) || u.untargetable > 0 || u.kind === 'ward') continue;
      const rel = V.sub(u.pos, prev), along = V.dot(rel, this.dir), perp = Math.abs(rel.x * this.dir.y - rel.y * this.dir.x);
      if (along >= -u.r && along <= segEnd + u.r && perp <= u.r + this.width / 2 + (this.assist || 0)) cands.push({ u, along });
    }
    cands.sort((a, b) => a.along - b.along);
    for (const { u, along } of cands) {
      this.hit.add(u.id);
      if (this.onUnit(this, u) === 'stop') { this.pos = V.add(prev, V.mul(this.dir, Math.max(0, along))); this.finish(); return; }
    }
    this.pos = V.add(prev, V.mul(this.dir, segEnd)); this.traveled += segEnd;
    const rb = Vision.bushAt(this.pos); if (rb >= 0 && rb !== this._rb) Vision.rustle(rb, this.pos, this.team, true); this._rb = rb;   // 스킬이 지나가면 부쉬가 흔들림
    if (tw < Infinity) { if (this.onWall) this.onWall(this, V.copy(this.pos)); this.finish(); return; }
    if (this.traveled >= this.range - 1e-6) this.finish();
  }
}
Projectile.seq = 0;

//   의념(월식·호루스의 눈): 스킬 사용 → 3초 충전: 공속 +40%, 다음 평타가 스증 비례 추가 스킬 피해 (쿨 2초)

//   집행자(악의·비색 단검-새벽): 대상 체력 40% 이하면 스킬 피해 +15%
//   치유 감소: 피해를 주면 대상 치유 4초간 감소 (전설 20%·초월 30%, 캐시 패시브의 치유 감소와 중첩 없이 큰 값)
//   「적 실험체에게」 효과는 연습용으로 허수아비에도 적용
const ItemFx = {
  NIAN: { dur: 3, as: 0.4, cd: 2 }, ROT: { dur: 3 }, RUPTURE: { delay: 0.8, cd: 8, base: 60, perLv: 3, sp: 0.25, r: 2.5 }, EXEC: { hp: 0.4, mul: 1.15 }, TASER: { range: 8, need: 3, base: 30, sp: 0.2, mark: 5, mul: 1.1, cd: 10 }, CURSE: { dur: 4, base: 25, sp: 0.1, imm: 8, aaCut: 1, cd: 2 }, HEALCUT: { dur: 4 },
  isChar(u) { return u && ['player', 'ranged', 'melee', 'dummy'].includes(u.kind); },
  k(u) { return (u && u.pasK) || {}; },
  // 스킬 사용(QWERD) 직후
  onCast(p, k) { if (this.k(p).nianSp && !(p.nianCd > 0)) p.nianT = this.NIAN.dur; this.onCast2(p, k); },
  asMul(p) { return (p.nianT > 0 && this.k(p).nianSp ? 1 + this.NIAN.as : 1) * this.asMul2(p); },
  // 평타 적중 직후
  onAA(p, t) {
    if (t && t.curseImm > 0) t.curseImm = Math.max(0, t.curseImm - this.CURSE.aaCut);   // 저주: 평타 맞을 때마다 재저주 대기 1초 감소
    this.onAATaser(p, t);
    this.onAA2(p, t);   // 섬광·발걸음·포톤·열정·개시·현란함·신속·돌풍 (3_y_itemfx2.js)
    const K = this.k(p); if (!K.nianSp || !(p.nianT > 0) || !t || t.dead) return;
    p.nianT = 0; p.nianCd = this.NIAN.cd;
    Combat.damage(p, t, p.sp * K.nianSp, { type: 'skill', source: '의념', noShake: true });
    FX.burst(t.pos, '#c9a4ff', 8, 4); FX.ring(t.pos, 0.2, 0.9, '#c9a4ff', 0.25, 0.06);
  },
  onAATaser(p, t) {
    const K = this.k(p), T = this.TASER; if (!K.taser || !t || t.dead || p.taserCd > 0 || !this.isChar(t)) return;
    if (((p.taserNear || {})[t.id] || 0) < T.need) return;
    p.taserCd = T.cd;
    Combat.damage(p, t, T.base + p.sp * T.sp, { type: 'skill', source: '테이저 건', noShake: true });
    if (!t.dead) t.taserMark = { by: p.id, t: T.mark };   // 적중한 뒤 표식 (이 추가 피해에는 +10% 안 붙음)
    FX.burst(t.pos, '#9fd8ff', 10, 5); FX.ring(t.pos, 0.2, 1.0, '#9fd8ff', 0.25, 0.06);
  },
  // 캐시 개별 스킬 피해 직후 (skillHit)
  onSkillDamage(p, e, k) {
    const K = this.k(p); if (!e || e.dead) return;
    this.onSkill2(p, e, k);   // 예열·차원 균열·응집·순풍·현란함·신속·돌풍
    if (K.rotHp) e.rot = { t: this.ROT.dur, per: e.maxHp * (K.rotHp + p.sp * K.rotSp), src: p, acc: 0 };
    if (K.curse && !(p.curseCd > 0) && !e.curse && !(e.curseImm > 0)) { p.curseCd = this.CURSE.cd; e.curse = { t: this.CURSE.dur, src: p, dmg: this.CURSE.base + p.sp * this.CURSE.sp }; }
    if (K.rupture && !(p.ruptCd > 0) && this.isChar(e)) { p.ruptCd = this.RUPTURE.cd; (p.itemPending = p.itemPending || []).push({ kind: 'rupture', t: this.RUPTURE.delay, target: e, pos: V.copy(e.pos) }); }
  },
  // 모든 피해: 집행자 배율
  damageMul(src, tgt, type) {
    const K = this.k(src);
    let m = K.executor && type === 'skill' && tgt.maxHp > 0 && tgt.hp / tgt.maxHp <= this.EXEC.hp ? this.EXEC.mul : 1;
    if (type === 'skill' && tgt.taserMark && tgt.taserMark.t > 0 && src && tgt.taserMark.by === src.id) m *= this.TASER.mul;   // 테이저 건 표식
    return m * this.damageMul2(src, tgt, type);
  },
  // 모든 피해 뒤: 치유 감소
  onDamage(src, tgt) {
    tgt.lastHurtT = Game.time;   // 명경지수: 마지막으로 맞은 시각
    const K = this.k(src); if (!K.healCut || tgt.dead) return;
    tgt.healCutT = this.HEALCUT.dur; tgt.healCutPct = Math.max(tgt.healCutT > 0 && tgt.healCutPct || 0, K.healCut);
  },
  healMul(u) { const a = u.healRed > 0 ? CONFIG.passive.healReduction : 0, b = u.healCutT > 0 ? (u.healCutPct || 0) : 0; return 1 - Math.max(a, b); },
  // 매 스텝 (tickStatus): 타이머·부패 틱·파열 폭발
  tick(u, dt) {
    for (const k of ['nianT', 'nianCd', 'ruptCd', 'healCutT', 'taserCd', 'curseCd', 'curseImm']) if (u[k] > 0) u[k] = Math.max(0, u[k] - dt);
    if (u.taserMark && (u.taserMark.t -= dt) <= 0) u.taserMark = null;
    if (this.k(u).taser) {   // 테이저 건: 8m 안에 머문 시간(대상별)
      const N = u.taserNear = u.taserNear || {}, seen = {};
      for (const e of Game.enemies(u)) if (this.isChar(e) && V.dist(e.pos, u.pos) <= this.TASER.range) { seen[e.id] = (N[e.id] || 0) + dt; }
      u.taserNear = seen;
    }
    if (u.curse && (u.curse.t -= dt) <= 0) { const C = u.curse; u.curse = null; u.curseImm = this.CURSE.imm; if (!u.dead) Combat.damage(C.src, u, C.dmg, { type: 'true', source: '저주', noShake: true }); }
    if (u.rot) {
      const R = u.rot; R.acc += dt; R.t -= dt;
      while (R.acc >= 1 && !u.dead) { R.acc -= 1; Combat.damage(R.src, u, R.per, { type: 'skill', source: '부패', tick: true, noShake: true }); }
      if (R.t <= 1e-9 || u.dead) u.rot = null;
    }
    this.tick2(u, dt);
    if (u.itemPending && u.itemPending.length) {
      for (const P of u.itemPending) {
        if ((P.t -= dt) > 0) continue;
        P.done = true;
        if (this.pending2(u, P)) continue;
        if (P.kind === 'rupture') {
          const at = P.target && !P.target.dead ? V.copy(P.target.pos) : P.pos, R = this.RUPTURE, lvl = (u.build && u.build.level) || 1;
          FX.ring(at, 0.3, R.r, '#ff7b3b', 0.35, 0.14); FX.burst(at, '#ff7b3b', 18, 6);
          for (const e of Game.enemies(u)) if (V.dist(e.pos, at) <= R.r + e.r) Combat.damage(u, e, R.base + R.perLv * lvl + u.sp * R.sp, { type: 'skill', source: '파열', aoe: true });
        }
      }
      u.itemPending = u.itemPending.filter(P => !P.done);
    }
  },
};

// ============================== 장비 고유 효과 (추가 16종) ==============================
// 3_y_itemfx.js(ItemFx)에 붙이는 나머지 효과. 수치: 12.5 툴팁(근거리 값). 범위가 툴팁에 없는 것은 ⚠ 가정(RANGE)
//   충전-섬광 · 가벼운 발걸음 · 신속(루드라) · 현란함 · 포톤 런처 · 예열 · 열정-순환 · 돌풍 · 차원 균열 · 명경지수 · 응집 · 개시 · 달인 · 격동 · 각성 · 순풍
Object.assign(ItemFx, {
  RANGE: { gale: 2.5, master: 3, turbulence: 2.5 },   // ⚠ 돌풍·달인 반경은 툴팁에 없음(가정). 격동 2.5m는 툴팁
  FLASH: { slow: 0.25, dur: 1, cd: 5 }, STEP: { max: 100, slowAt: 100, slow: 0.2, slowDur: 2 },
  RUDRA: { need: 3, win: 4, dur: 3, ms: 0.2, ad: 0.12, cd: 10 }, DAZZLE: { ms: 0.03, max: 8, dur: 3 },
  WARMUP: { per: 0.025, max: 6, dur: 5, ms: 0.06 }, PASSION: { dur: 8 },
  GALE: { need: 3, win: 5, dur: 5, tick: 0.5, base: 20, sp: 0.15, hp: 0.005, cd: 10 },
  RIFT: { dur: 5, taken: 0.06, base: 12, sp: 0.04, cd: 20 }, CALM: { wait: 5, per: 30, perLv: 5, max: 50, maxLv: 10, maxSp: 0.4 },
  COHESION: { need: 2, win: 3, delay: 2, slow: 0.5, dur: 1, cd: 12 }, ONSET: { every: 20, dur: 5, sp: 16, as: 0.15, aaCut: 1 },
  MASTER: { delay: 0.5, base: 40, sp: 0.25, perLv: 2, slow: 0.35, dur: 1, cd: 10 }, TURB: { need: 2, base: 10, bonusHp: 0.12, perLv: 2 },
  AWAKEN: { dur: 8, pen: 0.1, cd: 20 }, BREEZE: { ms: 0.05, dur: 3 },
  lvl(u) { return (u.build && u.build.level) || 1; },
  // 개별 적중 기록(신속·돌풍·응집): 최근 시각 목록
  mark(u, key, win) { const a = (u[key] = (u[key] || []).filter(t => Game.time - t < win)); a.push(Game.time); return a.length; },
  // 평타 적중 직후 (onAA에서 부름)
  onAA2(p, t) {
    const K = this.k(p); if (!t || t.dead) return;
    const ch = this.isChar(t);
    if (K.flash && !(p.flashCd > 0)) { p.flashCd = this.FLASH.cd; t.addSlow(this.FLASH.slow, this.FLASH.dur); }
    if (K.stepDmg && p.steps > 0) {   // 가벼운 발걸음: 중첩 모두 소모 → 추가 피해, 최대 중첩이면 둔화
      const n = p.steps; p.steps = 0;
      Combat.damage(p, t, K.stepDmg * n / this.STEP.max, { type: 'skill', source: '가벼운 발걸음', noShake: true });
      if (n >= this.STEP.slowAt && !t.dead) t.addSlow(this.STEP.slow, this.STEP.slowDur);
    }
    if (K.photon) { p.photonN = (p.photonN || 0) + 1; if (p.photonN >= 3) { p.photonN = 0; const d = Combat.damage(p, t, K.photon + p.sp * K.photonSp, { type: 'skill', source: '포톤 런처', noShake: true }); if (K.photonHeal && d > 0) p.heal(d * K.photonHeal, true); } }
    if (K.passion && !t.dead) { Combat.damage(p, t, K.passion + p.sp * K.passionSp, { type: 'skill', source: '열정 - 순환', noShake: true }); p.passionT = this.PASSION.dur; }
    if (K.onset && ch) {
      if (!(p.onsetCd > 0)) { p.onsetCd = this.ONSET.every; p.onsetT = this.ONSET.dur; if (!p.onsetSp) { p.onsetSp = this.ONSET.sp; p.sp += p.onsetSp; } }
      else p.onsetCd = Math.max(0, p.onsetCd - this.ONSET.aaCut);
    }
    this.onHitAny(p, t);
  },
  // 개별 스킬 피해 직후 (onSkillDamage에서 부름) — k: 스킬 키
  onSkill2(p, e, k) {
    const K = this.k(p); if (!e || e.dead) return;
    const ch = this.isChar(e);
    if (K.warmup && ch) { p.warmN = Math.min(this.WARMUP.max, (p.warmN || 0) + 1); p.warmT = this.WARMUP.dur; if (p.warmN >= this.WARMUP.max) p.addMsBuff(this.WARMUP.ms, this.WARMUP.dur, false, 'warmup'); }
    if (K.rift && k === 'R' && ch && !(e.riftCd && e.riftCd[p.id] > Game.time)) { (e.riftCd = e.riftCd || {})[p.id] = Game.time + this.RIFT.cd; e.rift = { t: this.RIFT.dur, src: p, acc: 0 }; }
    if (K.cohesion && ch && !(p.cohCd > 0) && this.mark(p, '_coh', this.COHESION.win) >= this.COHESION.need) { p._coh = []; p.cohCd = this.COHESION.cd; (p.itemPending = p.itemPending || []).push({ kind: 'cohesion', t: this.COHESION.delay, target: e }); }
    if (K.breeze && ch) p.addMsBuff(this.BREEZE.ms, this.BREEZE.dur, false, 'breeze');
    this.onHitAny(p, e);
  },
  // 평타·개별 스킬 공통 (적 실험체)
  onHitAny(p, e) {
    const K = this.k(p); if (!this.isChar(e)) return;
    if (K.dazzle) { p.dazzleN = Math.min(this.DAZZLE.max, (p.dazzleN || 0) + 1); p.addMsBuff(this.DAZZLE.ms * p.dazzleN, this.DAZZLE.dur, false, 'dazzle'); p.dazzleT = this.DAZZLE.dur; }
    if (K.rudra && !(p.rudraCd > 0) && this.mark(p, '_rudra', this.RUDRA.win) >= this.RUDRA.need) {
      p._rudra = []; p.rudraCd = this.RUDRA.cd; p.rudraT = this.RUDRA.dur; p.addMsBuff(this.RUDRA.ms, this.RUDRA.dur, false, 'rudra');
      if (!p.rudraAd) { p.rudraAd = p.ad * this.RUDRA.ad; p.ad += p.rudraAd; }
    }
    if (K.gale && !(p.galeCd > 0) && this.mark(p, '_gale', this.GALE.win) >= this.GALE.need) { p._gale = []; p.galeCd = this.GALE.cd; p.galeT = this.GALE.dur; p.galeAcc = 0; }
  },
  // 스킬 사용(onCast에서 부름)
  onCast2(p, k) {
    const K = this.k(p);
    if (K.awaken && k === 'R' && !(p.awakeCd > 0)) { p.awakeCd = this.AWAKEN.cd; p.awakeT = this.AWAKEN.dur; if (!p.awakePen) { p.awakePen = this.AWAKEN.pen; p.penPct += p.awakePen; } }
    if (K.master && k === 'D' && !(p.masterCd > 0)) { p.masterCd = this.MASTER.cd; (p.itemPending = p.itemPending || []).push({ kind: 'master', t: this.MASTER.delay }); }
  },
  asMul2(p) { return (p.passionT > 0 ? 1 + this.k(p).passionAs : 1) * (p.onsetT > 0 ? 1 + this.ONSET.as : 1); },
  msFlat(u) { const K = this.k(u); return K.stepMs && u.steps > 0 ? K.stepMs * u.steps / this.STEP.max : 0; },
  damageMul2(src, tgt, type) {
    let m = 1;
    if (type === 'skill' && src && src.warmN > 0 && this.k(src).warmup && this.isChar(tgt)) m *= 1 + this.WARMUP.per * src.warmN;
    if (tgt.rift && tgt.rift.t > 0) m *= 1 + this.RIFT.taken;   // 차원 불안정: 받는 피해 증가
    return m;
  },
  // 매 스텝
  tick2(u, dt) {
    const K = this.k(u);
    for (const k of ['flashCd', 'rudraCd', 'rudraT', 'dazzleT', 'warmT', 'passionT', 'galeCd', 'cohCd', 'onsetCd', 'onsetT', 'masterCd', 'awakeCd', 'awakeT']) if (u[k] > 0) u[k] = Math.max(0, u[k] - dt);
    if (u.rudraAd && !(u.rudraT > 0)) { u.ad -= u.rudraAd; u.rudraAd = 0; }
    if (u.dazzleN && !(u.dazzleT > 0)) u.dazzleN = 0;
    if (u.warmN && !(u.warmT > 0)) u.warmN = 0;
    if (u.onsetSp && !(u.onsetT > 0)) { u.sp -= u.onsetSp; u.onsetSp = 0; }
    if (u.awakePen && !(u.awakeT > 0)) { u.penPct -= u.awakePen; u.awakePen = 0; }
    // 가벼운 발걸음: 이동 거리만큼 중첩
    if (K.step) { const last = u._stepPos || u.pos, d = V.dist(last, u.pos); u._stepPos = V.copy(u.pos); if (d > 0 && d < 3) { u.stepAcc = (u.stepAcc || 0) + d; while (u.stepAcc >= K.step) { u.stepAcc -= K.step; u.steps = Math.min(this.STEP.max, (u.steps || 0) + 1); } } }
    // 돌풍: 0.5초마다 주변
    if (u.galeT > 0) { u.galeAcc = (u.galeAcc || 0) + dt; while (u.galeAcc >= this.GALE.tick) { u.galeAcc -= this.GALE.tick; for (const e of Game.enemies(u)) if (V.dist(e.pos, u.pos) <= this.RANGE.gale + e.r) Combat.damage(u, e, this.GALE.base + u.sp * this.GALE.sp + e.maxHp * this.GALE.hp, { type: 'skill', source: '돌풍', aoe: true, noShake: true, tick: true }); } }
    // 차원 불안정: 매초 피해 (대상 쪽)
    if (u.rift) { const R = u.rift; R.t -= dt; R.acc += dt; while (R.acc >= 1 && !u.dead) { R.acc -= 1; Combat.damage(R.src, u, this.RIFT.base + R.src.sp * this.RIFT.sp, { type: 'skill', source: '차원 균열', tick: true, noShake: true }); } if (R.t <= 1e-9 || u.dead) u.rift = null; }
    // 명경지수: 5초간 안 맞으면 매초 보호막
    if (K.calm && !u.dead) {
      const C = this.CALM, lv = this.lvl(u), max = C.max + C.maxLv * lv + u.sp * C.maxSp;
      if (Game.time - (u.lastHurtT ?? -99) >= C.wait) { u.calmAcc = (u.calmAcc || 0) + dt; while (u.calmAcc >= 1) { u.calmAcc -= 1; u.shield = Math.min(max, (u.shield || 0) + C.per + C.perLv * lv); u.shieldT = Math.max(u.shieldT || 0, 1.5); } }
      else u.calmAcc = 0;
    }
    // 격동: 전투 중 2.5m 안에 적이 2초 있으면 주위 피해
    if (K.turbulence && !u.dead && Rest.inCombat(u)) {
      const near = Game.enemies(u).some(e => this.isChar(e) && V.dist(e.pos, u.pos) <= this.RANGE.turbulence + e.r);
      u.turbT = near ? (u.turbT || 0) + dt : 0;
      if (u.turbT >= this.TURB.need) {
        u.turbT = 0; const bonus = Math.max(0, u.maxHp - (u.baseHpAtLv || u.maxHp)), dmg = this.TURB.base + bonus * this.TURB.bonusHp + this.TURB.perLv * this.lvl(u);
        FX.ring(u.pos, 0.3, this.RANGE.turbulence, '#ffd166', 0.3, 0.1);
        for (const e of Game.enemies(u)) if (V.dist(e.pos, u.pos) <= this.RANGE.turbulence + e.r) Combat.damage(u, e, dmg, { type: 'skill', source: '격동', aoe: true, noShake: true });
      }
    }
  },
  // 예약 효과 (tick의 itemPending에서 부름)
  pending2(u, P) {
    if (P.kind === 'cohesion') { if (P.target && !P.target.dead) { P.target.addSlow(this.COHESION.slow, this.COHESION.dur); FX.ring(P.target.pos, 0.2, 1.2, '#ff8fd8', 0.3, 0.08); } return true; }
    if (P.kind === 'master') {
      const M = this.MASTER, dmg = M.base + u.sp * M.sp + M.perLv * this.lvl(u);
      FX.ring(u.pos, 0.3, this.RANGE.master, '#9fd8ff', 0.35, 0.12);
      for (const e of Game.enemies(u)) if (V.dist(e.pos, u.pos) <= this.RANGE.master + e.r) { Combat.damage(u, e, dmg, { type: 'skill', source: '달인', aoe: true }); e.addSlow(M.slow, M.dur); }
      return true;
    }
    return false;
  },
});

// ============================== 플레이어블: 다니엘 (단검) ==============================
// 캐시의 조작·시전·평타 흐름(Cathy)을 그대로 쓰고, 스킬 Q·W·E·R과 평타만 다니엘 것으로 교체
// 수치: CONFIG.rangedKits.daniel (나무위키) / 능력치: CONFIG.rangedMotifs.daniel (랭크 영상 HUD 실측, Lv6/12/18)
//  Q 그림자 가위: 지정 위치(7m) 부채꼴, 0.53초 뒤 적중 — 시전 중 이동 가능. 중앙은 강화 피해 + 둔화, 적중 시 다음 평타 3번 공속 증가
//  W 영감: 대상 지정(7m) 표식 — 4초 뒤 활성, 2.5초 안에 공격하면 축적 피해(고정) + 스킬 피해 폭발. 대상 시야 감소, 대상 주변 2m 시야
//  E 그림자 이동: 앞으로 3m 은신 돌진 → 3초간 평타 사거리 3m, 평타 시 대상 건너편으로 순간이동 + 추가 스킬 피해

//  D 망토와 단검: 캐시와 같은 단검 무기 스킬 / P 고독한 예술가: 밤에 시야·이동 속도 증가

  constructor(x, y) {

    const M = CONFIG.rangedMotifs.daniel, st = ['early', 'mid', 'late'].includes(Game.buildId) ? Game.buildId : 'mid', si = ['early', 'mid', 'late'].indexOf(st);
    this.charKey = 'daniel'; this.name = '다니엘'; this.color = M.color; this.weapon = 'dagger'; this.usesTrauma = false;

    this.ad = M.ad[si]; this.bonusAd = Math.max(0, M.ad[si] - M.baseAd[si]); this.sp = 0; this.critChance = M.crit[si]; this.pen = M.pen[si]; this.aaAmp = M.aaAmp[si];
    this.baseAs = M.as[si]; this.as = this.baseAs; this.cdr = M.cdr ? M.cdr[si] : 0;   // 쿨감 수치(CONFIG.rangedMotifs.daniel.cdr)
    this.build = Object.assign({}, this.build, { level: CONFIG.rangedAI.stages[st].level }); this.regen = Builds.regen('daniel', this.build.level);
    const L = M.skillLv[si]; this.plv = L.P;
    for (const k of ['Q', 'W', 'E', 'R', 'D']) this.skills[k].lv = L[k];
    this.K = CONFIG.rangedKits.daniel;
    Object.assign(this, { qShots: 0, qT: 0, shadowT: 0, mark: null, lastHitOn: {}, pendingQ: [], shadow: null, qSeq: 0 });
    const g = Game.opts && Game.opts.gear; if (g && g.char === 'daniel') Builds.applyToPlayer(this, 'daniel', Builds.resolveGear('daniel', st, g));   // 장비(인기 빌드 아이템)
  }
  // ---------- 수치 ----------
  L(k) { return k === 'P' ? this.plv : this.skills[k].lv; }
  calc(o, k) { return lv(o.base, this.L(k)) + this.ad * lv(o.ad || 0, this.L(k)) + this.bonusAd * lv(o.bad || 0, this.L(k)); }
  skillDef(k) {
    if (k === 'D') return CONFIG.skills.D_dagger;
    if (k === 'F') return super.skillDef('F');   // 선택한 전술 스킬
    const d = this.K[k]; return Object.assign({ short: DANIEL_SHORT[k] }, d);
  }
  baseAaCfg() { const b = CONFIG.basicAttack.dagger; return this.shadowT > 0 ? Object.assign({}, b, { range: this.K.E.aaRange }) : b; }
  aaWindupTime() { return CONFIG.basicAttack.dagger.windupRatio / this.atkSpd(); }

  // ---------- 시전 ----------
  tryCast(k, aim) {
    if (k === 'F' || k === 'D') return super.tryCast(k, aim);
    const s = this.skills[k], def = this.skillDef(k);

    if (!s || s.lv <= 0) { FX.toastFor(this, `${def.name}: 아직 배우지 않았습니다`, '#aaa'); return false; }
    if (!this.canAct()) return false;
    if (this.silence > 0) { FX.toastFor(this, '침묵 — 스킬 사용 불가', '#b07cff'); Sfx.playFor(this, 'error'); return false; }
    if (s.cd > 0) { this.cdError(k); return false; }
    if (k === 'Q') return this.castQ(aim);
    if (k === 'W') return this.castW(aim);

    if (k === 'R') {
      const t = this.rTarget(aim);
      if (!t) { this.S.mistake('걸작: 4초 안에 피해를 준 적이 3m 안에 없음'); Sfx.playFor(this, 'error'); FX.toastFor(this, '걸작: 최근 4초 안에 피해를 준 적에게만 (3m)'); return false; }
      this.beginCast('R', aim, DImpl.R, { target: t }); return true;
    }
    return false;
  }
  // 걸작 중 R 재사용 = 즉시 탈출 (시전 중이라 선입력으로 미루지 않음)
  cmdSkill(k, aim) {
    if (k === 'R' && this.shadow && this.shadow.phase !== 'out') { this.S.input(); this.shadow.exit = true; return; }
    super.cmdSkill(k, aim);
  }
  // 캐시의 강화 평타 처리는 쓰지 않음
  fireCast() {
    const c = this.cast; c.phase = 'active'; c.t = 0; c.origin = V.copy(this.pos);
    c.data.snap = {}; for (const e of Game.enemies(this)) c.data.snap[e.id] = V.copy(e.pos);
    this.S.cast(c.k); if (c.k !== 'E') Vision.act(this, 'skill');
    c.impl.fire(this, c);
    Events.emit('action', { k: c.k });
  }
  breakStealth() { this.stealthT = 0; }
  // Q: 지정 위치에 가위 — 즉시 시전, 0.53초 뒤 적중 (시전 중 이동 가능)
  castQ(aim) {
    const K = this.K.Q, d = Math.min(K.range, V.dist(this.pos, aim)), dir = V.dist(aim, this.pos) > 0.05 ? V.norm(V.sub(aim, this.pos)) : V.fromAng(this.facing);
    this.pendingQ.push({ pos: V.add(this.pos, V.mul(dir, d)), dir, t: 0, dur: K.windup, id: ++this.qSeq });
    this.startCd('Q'); this.S.cast('Q'); Vision.act(this, 'skill'); this.breakStealth();
    FX.text(this.pos, K.name, this.color, 12, { bold: true }); Sfx.play('throw'); Events.emit('action', { k: 'Q' });
    return true;
  }
  qLand(o) {
    const K = this.K.Q, apex = V.sub(o.pos, V.mul(o.dir, K.front)); let hit = false;
    for (const u of Game.enemies(this).concat(Game.units.filter(x => x.kind === 'animal' && !x.dead))) {
      if (u.dead || u.untargetable > 0 || !Geo.inSector(apex, V.ang(o.dir), K.len, K.angle / 2 * Math.PI / 180, u.pos, u.r)) continue;
      const center = V.dist(u.pos, o.pos) <= K.centerR + u.r;
      if (u.kind !== 'animal') { hit = true; this.S.hitCast('Q'); }
      Combat.damage(this, u, this.calc(center ? K.center : K, 'Q'), { type: 'skill', source: center ? 'Q 중앙' : 'Q' });
      if (center) u.addSlow(K.slow, K.slowDur);
      Events.emit('skillHit', { k: 'Q', target: u });
    }
    this.S.resolveShot('Q', hit);
    FX.slash(apex, V.ang(o.dir), K.len, K.angle / 2 * Math.PI / 180, '#9d6bff', 0.3);
    const rb = Vision.bushAt(o.pos); if (rb >= 0) Vision.rustle(rb, o.pos, 0, true);
    if (hit) { this.qShots = K.asShots; this.qT = K.asDur; this.as = +(this.baseAs * (1 + lv(K.asBuff, this.L('Q')))).toFixed(2); FX.text(this.pos, '공속↑', '#d9a8ff', 12, { bold: true }); }
  }
  // W: 대상 지정 표식
  castW(aim) {

    if (V.dist(this.pos, t.pos) - t.r > K.range) { FX.toastFor(this, `사거리 밖 (${K.range}m)`); Sfx.playFor(this, 'error'); return false; }
    this.mark = { target: t, t: 0, acc: 0 }; this.S.count('markOn'); t.blindT = K.blind; t.blindR = K.blindR;
    this.startCd('W'); this.S.cast('W'); Vision.act(this, 'skill'); this.breakStealth();
    FX.text(t.pos, '영감 표식', '#d9a8ff', 13, { bold: true }); FX.ring(t.pos, 1.2, 0.4, '#d9a8ff', 0.4); Sfx.play('throw'); Events.emit('action', { k: 'W' });
    this.S.resolveShot('W', true);
    return true;
  }
  rTarget(aim) {
    const K = this.K.R, ok = e => !e.dead && e.kind !== 'ward' && Game.time - (this.lastHitOn[e.id] ?? -99) <= K.recent && V.dist(this.pos, e.pos) - e.r - this.r <= K.range;
    const at = Game.pickEnemyAt(aim, CONFIG.input.pickRadius, this); if (at && ok(at)) return at;

  }
  // ---------- 피해 훅: 최근 피해(궁 조건)·영감 축적/폭발 ----------
  onDealt(tgt, dmg, o) {

  // ---------- 평타: 단검 / 그림자 돌진 중이면 대상 건너편으로 순간이동 + 추가 스킬 피해 ----------

      const dir = V.norm(V.sub(t.pos, this.pos)), from = V.copy(this.pos);
      this.pos = Geo.pushOut(V.add(t.pos, V.mul(dir, t.r + this.r + 0.15)), this.r); this.facing = V.ang(V.mul(dir, -1));

      this.shadowT = 0; this.breakStealth();

    } else Combat.damage(this, t, this.ad * (crit ? cfg.critMul : 1) * (1 + this.aaAmp), { type: 'normal', source: 'AA', crit });
    if (this.qShots > 0 && --this.qShots <= 0) this.as = this.baseAs;

  passiveMoveBoost() {}   // 캐시 패시브 없음
  // ---------- 매 스텝 ----------
  update(dt) {
    this.S.trackRanged(this, dt);   // 코칭: 평타 공백
    if (this.qT > 0 && (this.qT -= dt) <= 0) { this.qShots = 0; this.as = this.baseAs; }
    if (this.shadowT > 0 && (this.shadowT -= dt) <= 0) this.breakStealth();

      else Vision.reveals.push({ team: this.team, pos: V.copy(M.target.pos), r: 2, t: 0.05 });   // 표식 대상 주변 2m 시야
    }

    const P = this.K.P; this.sightMul = Vision.night ? 1 + lv(P.sight, this.plv) : 1;
    if (Vision.night) this.addMsBuff(lv(P.ms, this.plv), 0.25, false, 'danP');

  }
  // ---------- 그리기 (월드) ----------
  drawExtra(ctx) {
    const K = this.K.Q;
    for (const o of this.pendingQ) {   // 가위 예고
      if (o.done) continue;
      const apex = V.sub(o.pos, V.mul(o.dir, K.front)), an = V.ang(o.dir), h = K.angle / 2 * Math.PI / 180, k = clamp(o.t / o.dur, 0, 1);
      ctx.save(); ctx.globalAlpha = 0.15 + 0.3 * k; ctx.fillStyle = '#9d6bff';
      ctx.beginPath(); ctx.moveTo(apex.x, apex.y); ctx.arc(apex.x, apex.y, K.len, an - h, an + h); ctx.closePath(); ctx.fill();
      ctx.globalAlpha = 0.6; ctx.fillStyle = '#d9a8ff'; Draw.circle(ctx, o.pos.x, o.pos.y, K.centerR * k); ctx.fill(); ctx.restore();
    }

    if (this.shadow && this.shadow.phase !== 'out') DanFx.shadow(ctx, this.shadow.target, this.shadow.t / this.K.R.dur, this.color);

  }
  // 조준 미리보기

    ctx.save(); ctx.globalAlpha = alpha; ctx.fillStyle = this.color; ctx.strokeStyle = this.color; ctx.lineWidth = 0.05;
    const ring = r => { ctx.save(); ctx.globalAlpha = 0.5; Draw.circle(ctx, this.pos.x, this.pos.y, r); ctx.stroke(); ctx.restore(); };
    const mark = t => { if (t) { ctx.save(); ctx.globalAlpha = 0.85; ctx.strokeStyle = '#d9a8ff'; Draw.circle(ctx, t.pos.x, t.pos.y, t.r + 0.25); ctx.stroke(); ctx.restore(); } };
    if (k === 'Q') {
      ring(K.Q.range); const d = Math.min(K.Q.range, V.dist(this.pos, aim)), c = V.add(this.pos, V.mul(dir, d)), apex = V.sub(c, V.mul(dir, K.Q.front)), h = K.Q.angle / 2 * Math.PI / 180;
      ctx.beginPath(); ctx.moveTo(apex.x, apex.y); ctx.arc(apex.x, apex.y, K.Q.len, ang - h, ang + h); ctx.closePath(); ctx.fill(); Draw.circle(ctx, c.x, c.y, K.Q.centerR); ctx.stroke();
    } else if (k === 'W') { ring(K.W.range); mark(Game.pickEnemyAt(aim, CONFIG.input.pickRadius, this)); }
    else if (k === 'E') { Draw.oRect(ctx, this.pos, ang, K.E.dist, 0.6); }
    else if (k === 'R') { ring(K.R.range + this.r); mark(this.rTarget(aim)); }
    else { ctx.restore(); return false; }
    ctx.restore(); return true;
  }
}

// 다니엘 보이는 효과 (플레이어·AI 공통 — 판정과 무관)
const DanFx = {
  // 영감 표식: 준비(4초) 동안 차오르는 굵은 시간 고리 → 준비되면 밝게 맥동 + 터뜨릴 수 있는 남은 시간
  mark(ctx, M, W) {
    const u = M.target, ready = M.t >= W.ready, T = Game.time, top = -Math.PI / 2;
    ctx.save(); ctx.lineCap = 'round';
    if (!ready) {
      ctx.strokeStyle = '#b07cff'; ctx.globalAlpha = 0.35; ctx.lineWidth = 0.06; Draw.circle(ctx, u.pos.x, u.pos.y, u.r + 0.4); ctx.stroke();
      ctx.strokeStyle = '#d9a8ff'; ctx.globalAlpha = 0.95; ctx.lineWidth = 0.13; ctx.beginPath(); ctx.arc(u.pos.x, u.pos.y, u.r + 0.4, top, top + Math.PI * 2 * M.t / W.ready); ctx.stroke();
    } else {
      ctx.fillStyle = '#ffd1ff'; ctx.globalAlpha = 0.14 + 0.1 * Math.sin(T * 12); Draw.circle(ctx, u.pos.x, u.pos.y, u.r + 0.4); ctx.fill();
      ctx.strokeStyle = '#ffd1ff'; ctx.globalAlpha = 0.95; ctx.lineWidth = 0.14; ctx.beginPath(); ctx.arc(u.pos.x, u.pos.y, u.r + 0.4, top, top + Math.PI * 2 * clamp(1 - (M.t - W.ready) / W.popWindow, 0, 1)); ctx.stroke();
      ctx.globalAlpha = 0.5 * (1 - (T * 1.5) % 1); ctx.lineWidth = 0.06; Draw.circle(ctx, u.pos.x, u.pos.y, u.r + 0.4 + 0.5 * ((T * 1.5) % 1)); ctx.stroke();
    }
    ctx.restore();
  },
  markReady(u) { FX.text(u.pos, '영감 준비 — 공격!', '#ffd1ff', 12, { bold: true }); FX.ring(u.pos, u.r + 0.2, u.r + 1.2, '#ffd1ff', 0.35, 0.1); },
  // 걸작 지속 피해: 그림자 속에서 베는 칼자국 (번갈아 방향)
  rTick(u, n, color) { FX.slash(u.pos, n * 2.4, u.r + 0.9, 0.5, color, 0.14, u.r * 0.3); FX.burst(u.pos, '#d9a8ff', 4, 3); },
  // 걸작: 그림자(어두운 원) + 남은 시간 고리
  shadow(ctx, u, k, color) {
    KU.fill(ctx, u.pos, u.r + 0.3, '#2a1840', 0.55); KU.ring(ctx, u.pos, u.r + 0.3 + 0.1 * Math.sin(Game.time * 20), color, 0.9);
    ctx.save(); ctx.strokeStyle = color; ctx.globalAlpha = 0.95; ctx.lineWidth = 0.12; ctx.lineCap = 'round'; ctx.beginPath(); ctx.arc(u.pos.x, u.pos.y, u.r + 0.6, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * clamp(1 - k, 0, 1)); ctx.stroke(); ctx.restore();
  },
};

// 다니엘 시전 구현 (E·R은 캐시와 같은 시전 상태 기계를 사용)
const DImpl = {
  E: {
    windup: () => 0, recovery: () => 0.05,
    fire(p, c) {
      const K = p.K.E, len = Geo.passDash(p.pos, c.dir, K.dist, p.r, K.wallPass);   // 앞으로 3m, 돌진 거리로 닿는 벽은 넘음(벽 중심 규칙)
      c.data.from = V.copy(p.pos); c.data.to = V.add(p.pos, V.mul(c.dir, len));
      p.startCd('E'); p.stealthT = lv(K.stealth, p.L('E')); p.shadowT = K.shadowDur; p.revealT = 0;
      FX.burst(p.pos, '#4b3a66', 18, 2.5, 0.7, 0.16); Vision.noise(p, 'skill'); Sfx.play('blink');
      FX.text(p.pos, K.name, p.color, 12, { bold: true });
    },
    tick(p, c) { const k = Math.min(1, c.t / p.K.E.time); p.pos = V.lerp(c.data.from, c.data.to, k); return k >= 1; },
  },
  R: {
    windup: () => 0, recovery: () => 0,
    fire(p, c) {
      const K = p.K.R, t = c.data.target;
      p.startCd('R'); p.shadow = { target: t, t: 0, n: 0, exit: false }; p.shadowT = 0;
      t.silence = Math.max(t.silence || 0, K.silence);
      if (t.act && t.act.type === 'cast') t.act = null;   // 침묵: AI 시전 취소
      FX.text(t.pos, K.name + ' — 침묵', p.color, 15, { bold: true }); FX.ring(t.pos, 1.5, 0.3, '#2a1840', 0.4); Sfx.play('ult');

  def: { E: { dash: true }, R: { moveCancel: false } },
  init(p) { p.pCd = 0; p.reload = 0; p.ayaW = null; },
  update(p, dt) { if (p.pCd > 0) p.pCd -= dt; },
  // P 아야의 정의: 피격 시 보호막(25초, 쿨감 무시) · 공격(평타·스킬)이 맞을 때마다 쿨 1초 감소
  onDamaged(p) {
    if (p.pCd > 0 || p.dead) return; const P = p.K.P;
    p.shield = Math.max(p.shield, p.calc(P, 'P')); p.shieldT = P.dur; p.pCd = P.cd; FX.text(p.pos, P.name, p.color, 12, { bold: true });
  },
  onHit(p) { p.pCd = Math.max(0, p.pCd - p.K.P.perHit); },
  onAAHit(p) {
    p.pCd = Math.max(0, p.pCd - p.K.P.perHit);
    if (p.reload > 0 && --p.reload === 0) p.asBuffs = p.asBuffs.filter(a => a.tag !== 'reload');   // 무빙 리로드: 평타 2회 공속 +70%
  },
  recast(p, k) { return k === 'W' && !!p.ayaW; },
  empowered(p) { return p.reload > 0 ? '#ffd166' : null; },   // 무빙 리로드: 다음 평타 공속↑
  cast: {
    // Q 2연발: 대상 지정 6.5m(밖이면 다가감) — 1발 = 기본 공격(공 110%, 치명 가능) · 2발 = 스킬 피해, 1발이 나가면 2발은 반드시 발사. 시전 중 이동 불가, 공속 1 이상이면 빨라짐
    Q(p, aim) {
      const t = p.targetAt(aim, 'Q'); if (!t) return false;
      return p.chaseCast('Q', t, p.K.Q.range, () => {
        const Q = p.K.Q;
        p.beginCast('Q', t.pos, { windup: q => Q.windup / Math.max(1, q.atkSpd()), recovery: () => 0.06,
          fire(q) {
            q.startCd('Q'); q.facing = V.ang(V.sub(t.pos, q.pos)); Sfx.play('throw');
            const go = (r, onHit) => q.shot({ dir: V.norm(V.sub(t.pos, q.pos)), speed: 30, home: t, only: t, width: 0.3, len: 0.5, onHit });
            go(1, u => q.aaLand(u, Q.first));
            q.after(Q.gap, () => go(2, u => q.hitS(u, q.calc(Q, 'Q'), 'Q')));
            q.addAs(lv(Q.asBuff, q.L('Q')), Q.asDur, 'ayaQ');
            FX.text(q.pos, Q.name, q.color, 12, { bold: true });
          } }, {});
      });
    },
    // W 고정 사격: 누른 순간의 방향으로 2.2초 연사, 이동 가능 · W 재입력 = 중단 · 기본 6발, 추가 공속 20%마다 +1(최대 10)
    W(p, aim) {
      if (p.ayaW) { p.ayaW.stop = true; FX.text(p.pos, '사격 중단', '#aaa', 11); return true; }
      const W = p.K.W, dir = p.dirTo(aim), n = clamp(Math.round(W.shots + (p.atkSpd() - 1) * 5), W.shots, W.maxShots); let fired = 0;
      p.startCd('W'); p.noAA = W.dur; p.instantUsed('W');
      FX.text(p.pos, W.name, p.color, 12, { bold: true });
      p.ayaW = { t: 0, dur: W.dur, dir, onTick: (dt, c) => { while (fired < n && c.t >= (fired / n) * W.dur) { fired++; Sfx.play('aa');
        p.shot({ dir: c.dir, speed: W.speed, range: W.range, width: W.width, len: 0.45, onHit: u => { p.hitS(u, p.calc(W, 'W'), 'W'); } }); } },
        onEnd: () => { p.ayaW = null; p.noAA = 0; } };
      p.chans.push(p.ayaW); return true;
    },
    // E 무빙턴: 커서 방향 4m 대시(벽 넘기 가능), Q·W 남은 쿨 감소
    E(p, aim) {
      const E = p.K.E, r = lv(E.qwReduce, p.L('E'));
      p.dash('E', p.dirTo(aim), E.dist, E.time, 0.5); p.startCd('E');
      for (const k of ['Q', 'W']) p.skills[k].cd *= 1 - r;
      FX.text(p.pos, E.name, p.color, 12, { bold: true }); Sfx.play('blink'); return true;
    },
    // R 공포탄: 0.66초 뒤 주변 4.5m 피해 + 공포 (시전 중 이동 불가)
    R(p, aim) {
      const R = p.K.R;
      p.beginCast('R', aim, { windup: () => R.delay, recovery: () => 0.05,
        start(q) { FX.text(q.pos, R.name, q.color, 13, { bold: true }); },
        fire(q) {
          q.startCd('R'); Sfx.play('ult'); FX.ring(q.pos, 0.5, R.radius, '#ffffff', 0.4, 0.12); FX.addShake(6);
          for (const u of q.foes()) if (V.dist(u.pos, q.pos) <= R.radius + u.r) { q.hitS(u, q.calc(R, 'R'), 'R', { aoe: true }); if (u.applyFear && u.applyFear(R.fear, q.pos)) FX.text(u.pos, '공포!', '#b18cff', 16, { bold: true }); }
        } }, {});
      return true;
    },
    // D 무빙 리로드: 1초 이속(평타 불가, 스킬 가능) → 다음 평타 2회 공속 +70%
    D(p) {
      const D = p.K.D; p.startCd('D'); p.addMsBuff(lv(D.ms, p.L('D')), D.dur, false, 'reload'); p.noAA = D.dur; p.instantUsed('D');
      p.after(D.dur, () => { p.reload = D.asShots; p.addAs(D.asBuff, 5, 'reload'); });
      FX.text(p.pos, D.name, p.color, 12, { bold: true }); Sfx.play('blink'); return true;
    },
  },
  shape(p, k) {
    const K = p.K;
    return { Q: { kind: 'target', range: K.Q.range + p.r }, W: { kind: 'line', len: K.W.range, width: K.W.width }, E: { kind: 'dash', len: K.E.dist }, R: { kind: 'self', r: K.R.radius } }[k] || null;
  },
  draw(p, ctx) { if (p.ayaW) { const W = p.K.W, a = V.ang(p.ayaW.dir); ctx.save(); ctx.globalAlpha = 0.18; ctx.fillStyle = p.color; ctx.strokeStyle = p.color; ctx.lineWidth = 0.06; Draw.oRect(ctx, p.pos, a, W.range, W.width); ctx.globalAlpha = 0.85; ctx.fillStyle = 'rgba(0,0,0,0)'; Draw.oRect(ctx, p.pos, a, W.range * clamp(1 - p.ayaW.t / p.ayaW.dur, 0, 1), 0.08); ctx.restore(); } },   // 고정 사격: 범위 + 남은 시간 줄
  hud(p) {
    const b = []; if (p.pCd > 0) b.push([`정의 ${Math.ceil(p.pCd)}`, '#8a93a6']); else b.push(['정의 준비', '#5aa9ff']);
    if (p.ayaW) b.push(['고정 사격 (W: 중단)', p.color]); if (p.reload > 0) b.push([`리로드 ×${p.reload}`, '#ffd166']);
    if (p.asBuffs.some(a => a.tag === 'ayaQ')) b.push(['2연발 공속↑', '#9fd8ff']); return b;
  },
};

// ---------------- 리오 (활) ----------------
PKits.rio = {
  short: { Q: '활 교체', W: '하나레', E: '비상', R: '연사', D: '곡사' },
  noAim: ['Q'],
  def: { Q: { fixedCd: true }, R: { moveCancel: false } },
  label(p, k) { if (k === 'Q') return p.stance === 'short' ? '→화궁' : '→단궁'; if (k === 'R') return p.rRecast ? '강화살!' : p.stance === 'short' ? '연사' : '정사필중'; return this.short[k]; },
  init(p) { p.stance = 'long'; p.kc = 0; p.kcReady = false; p.rRecast = null; },
  noCrit: true,
  // P 카이: 평타 치명 없음 — 항상 ×(1.02 + 치명확률 × (0.75 + 치명 피해)) · 방관 = 2/5/8% + 치명확률 × 10%
  aaMul(p) { return 1.02 + p.critChance * (0.75 + (p.critDmg || 0)); },
  pen(p) { const P = p.K.P; return lv(P.pen, p.plv) + p.critChance * P.penPerCrit; },
  asFlat(p) { return p.stance === 'long' ? -p.K.Q.long.asPenalty : 0; },
  aaRange(p) { const Q = p.K.Q; return p.stance === 'short' ? Q.short.range : 6.3 + 0.05 * (p.L('Q') - 1) + (p.kcReady ? Q.longRange : 0); },   // 화궁 6.3~6.5m(Q 레벨)
  gainKc(p) { if (p.kcReady) return; if (++p.kc >= p.K.Q.stacks) { p.kcReady = true; p.kc = 0; FX.text(p.pos, '카이츄', p.color, 11, { bold: true }); } },
  fullKc(p) { p.kc = 0; p.kcReady = true; },
  // 평타: 단궁 = 주 화살 36% + 추가 2발 35% / 화궁 = 102% 1발 — 카이츄 강화(단궁 이속·공속, 화궁 사거리+0.4·잃은 체력 1%당 0.3%)
  fireAA(p, t) {
    const Q = p.K.Q, ready = p.kcReady, dir = V.norm(V.sub(t.pos, p.pos));
    if (ready) { p.kcReady = false; if (p.stance === 'short') { p.addMsBuff(lv(Q.shortMs, p.L('Q')), Q.buffDur, true, 'rioQ'); p.addAs(lv(Q.shortAs, p.L('Q')), Q.buffDur, 'rioQ'); } }
    const land = (u, ratio, main) => {
      const miss = main && ready && p.stance === 'long' ? 1 + clamp(1 - u.hp / u.maxHp, 0, 1) * 100 * Q.longMissing / 100 : 1;
      p.aaLand(u, ratio * miss); if (main) this.gainKc(p);
    };
    if (p.stance === 'short') {
      p.shot({ dir, speed: 26, home: t, only: t, len: 0.5, onHit: u => land(u, Q.short.ratio, true) });
      for (const s of [-1, 1]) p.shot({ dir: V.fromAng(V.ang(dir) + s * 0.06), speed: 26, home: t, only: t, len: 0.4, onHit: u => land(u, Q.short.extraRatio, false) });
    } else p.shot({ dir, speed: 24, home: t, only: t, len: 0.8, onHit: u => land(u, Q.long.ratio, true) });
    return true;
  },
  onAAHit() {},
  empowered(p) { return p.kcReady ? '#ffd166' : null; },   // 카이츄: 다음 평타 강화
  onHit(p, u, o) {
    if (o.kc !== false && isHero(u)) this.gainKc(p);
    if (o.hanare) for (const k of ['Q', 'E', 'R', 'D']) p.skills[k].cd = Math.max(0, p.skills[k].cd - p.K.W.cdReduce);   // 하나레 적중: 다른 스킬 쿨 1초 감소
  },
  update(p, dt) {
    const foes = p.foes();
    for (const z of p.zones) {   // 단궁 하나레 바람(이속 감소) · 곡사 착탄
      z.t += dt;
      if (z.type === 'wind') for (const u of foes) if (V.dist(u.pos, z.pos) <= z.r + u.r * 0.5) u.addSlow(z.slow, 0.1);
      if (z.type === 'arc' && !z.hit && z.t >= z.delay) {
        z.hit = true; const D = p.K.D;
        for (const u of foes) { const dd = V.dist(u.pos, z.pos); if (dd <= D.radius + u.r * 0.5) { const inner = dd <= D.innerR; p.hitS(u, p.calc(inner ? { base: D.inner, bad: D.innerBad, sp: D.innerSp } : D, 'D'), 'D', { aoe: true }); u.addSlow(D.slow, D.slowDur); } }
        Vision.reveals.push({ team: p.team, pos: V.copy(z.pos), r: D.radius, t: 1 });   // 착탄 지점 시야
        FX.ring(z.pos, 0.5, D.radius, p.color, 0.35, 0.12); FX.burst(z.pos, p.color, 16, 5);
      }
    }
    p.zones = p.zones.filter(z => z.type === 'wind' ? z.t < z.dur : !z.hit);
    if (p.rRecast && (p.rRecast.t -= dt) <= 0) this.strong(p, null);   // 연사 강한 화살: 유예가 끝나면 자동 발사
  },
  recast(p, k) { return k === 'R' && !!p.rRecast; },
  cast: {
    // Q 카에유미: 단궁 ↔ 화궁 전환 (0.8초, 쿨감 무시) — 연사 재사용 대기 중이면 취소
    Q(p) {
      const Q = p.K.Q; p.stance = p.stance === 'short' ? 'long' : 'short'; p.startCd('Q'); p.instantUsed('Q');
      if (p.rRecast) { p.rRecast = null; FX.text(p.pos, '연사 취소', '#aaa', 11); }
      FX.text(p.pos, p.stance === 'short' ? '단궁' : '화궁', p.color, 12, { bold: true }); Sfx.play('click'); return true;
    },
    // W 하나레: 단궁 = 7.5m 부채꼴 5발(같은 대상 반복 20%, 바람 장판) / 화궁 = 10.5m 직선 관통(첫 대상 + 뒤 대상 추가 피해, 둔화)
    W(p, aim) {
      const W = p.K.W, short = p.stance === 'short';
      p.beginCast('W', aim, { windup: () => 0.2, recovery: () => 0.05,
        fire(q, c) {
          q.startCd('W'); Sfx.play('throw'); const dir = c.dir;
          if (!short) {
            let first = null;
            q.shot({ dir, speed: W.long.speed, range: W.long.range, width: W.long.width, len: 1.4, pierce: true, onHit: u => {
              if (!first) { first = u; q.hitS(u, q.calc(W.long, 'W'), 'W', { hanare: true }); }
              else q.hitS(u, q.calc(W.long.behind, 'W'), 'W', { kc: false });
              u.addSlow(W.long.slow, W.long.slowDur);
            } });
          } else {
            const landed = {};
            for (let i = 0; i < W.short.arrows; i++) {
              const a = V.ang(dir) + ((i / (W.short.arrows - 1)) - 0.5) * W.short.spread * Math.PI / 180;
              q.after(i * 0.06, () => q.shot({ dir: V.fromAng(a), speed: 30, range: W.short.range, width: W.short.width, len: 0.6, onHit: u => {
                const n = landed[u.id] = (landed[u.id] || 0) + 1, first = n === 1;
                q.hitS(u, q.calc(W.short, 'W') * (first ? 1 : W.short.repeat), 'W', { hanare: first && Object.keys(landed).length === 1, kc: first && Object.keys(landed).length === 1 });
                if (first) q.zones.push({ type: 'wind', pos: V.copy(u.pos), r: W.short.zoneR, t: 0, dur: W.short.zoneDur, slow: W.short.slow });
              } }));
            }
          }
        } }, {});
      return true;
    },
    // E 비상: 커서 방향 5m 도약 → 착지 때 평타 사거리 안 적(최대 3, 커서에 가까운 순)에게 화살, 카이츄 최대
    E(p, aim) {
      const E = p.K.E; p.startCd('E'); FX.text(p.pos, E.name, p.color, 12, { bold: true }); Sfx.play('blink');
      p.dash('E', p.dirTo(aim), E.leap, E.leapTime, 0, q => {
        const S = q.stance === 'short' ? E.short : E.long, n = q.stance === 'short' ? E.short.arrows : 1;
        const ts = q.foes().filter(u => isHero(u) || u.kind === 'dummy').filter(u => V.dist(q.pos, u.pos) - u.r <= PKits.rio.aaRange(q) + 0.5 && Vision.visible(q, u)).sort((a, b) => V.dist(a.pos, aim) - V.dist(b.pos, aim)).slice(0, 3);
        for (const t of ts) for (let i = 0; i < n; i++) q.shot({ dir: V.fromAng(V.ang(V.sub(t.pos, q.pos)) + (i - (n - 1) / 2) * 0.05), speed: 28, home: t, only: t, len: 0.6, onHit: u => {
          q.hitS(u, q.calc(S, 'E'), 'E', { kc: false });
          if (q.stance === 'long') for (const v of q.foes()) if (V.dist(v.pos, u.pos) <= 2 + v.r) q.hitS(v, q.calc({ base: E.long.aoe, ad: E.long.aoeAd }, 'E'), 'E', { kc: false, aoe: true });
        } });
        PKits.rio.fullKc(q);
      });
      return true;
    },
    // R: 단궁 연사(8.5m 3연발 + 재입력 강한 화살 4m 넉백·벽꿍 기절, 3초 지나면 자동) / 화궁 정사필중(0.6초 고정 → 무제한 직선, 실험체만, 0.8초 뒤 강화)
    R(p, aim) {
      if (p.rRecast) { PKits.rio.strong(p, aim); return true; }
      const R = p.K.R;
      if (p.stance === 'short') {
        const S = R.short;
        p.beginCast('R', aim, { windup: () => 0.15, recovery: () => 0.05,
          fire(q, c) {
            q.startCd('R'); PKits.rio.fullKc(q); FX.text(q.pos, '연사', q.color, 13, { bold: true }); const dir = c.dir;
            for (let i = 0; i < S.arrows; i++) q.after(i * 0.1, () => q.shot({ dir, speed: 32, range: S.range, width: S.width, len: 0.8, onHit: u => { q.hitS(u, q.calc(S, 'R'), 'R'); KU.knock(u, dir, S.push, 0.08); } }));
            q.rRecast = { t: S.recast.grace, dir, ready: Game.time + 0.15 + S.arrows * 0.1 + 0.1 };   // 3연발이 다 나간 뒤부터 강한 화살
          } }, {});
      } else {
        const L = R.long;
        p.beginCast('R', aim, { windup: () => L.windup, recovery: () => 0.1,
          start(q) { FX.text(q.pos, '정사필중', q.color, 13, { bold: true }); },
          fire(q, c) {
            q.startCd('R'); PKits.rio.fullKc(q); Sfx.play('ult');
            q.shot({ dir: c.dir, speed: L.speed, range: 60, width: L.width, len: 2, color: '#ffffff', heroOnly: true, onHit: (u, pr) => {
              const boosted = pr.traveled > L.speed * L.boostAfter;
              q.hitS(u, q.calc(L, 'R') * (boosted ? 1 + L.boost : 1), 'R'); u.addSlow(L.slow, L.slowDur * (boosted ? 2 : 1));
              if (boosted) FX.text(u.pos, '강화!', '#ffffff', 13, { bold: true });
            } });
          } }, {});
      }
      return true;
    },
    // D 곡사: 지면 지정 28m, 0.3초 시전 → 1.5초 뒤 화살비 (상대에게도 범위가 보임)
    D(p, aim) {
      const D = p.K.D, pos = p.ptIn(aim, D.range);
      p.beginCast('D', pos, { windup: () => D.windup, recovery: () => 0.1,
        fire(q, c) { q.startCd('D'); q.zones.push({ type: 'arc', pos, t: 0, delay: D.delay, id: c.id }); Sfx.play('throw'); FX.text(q.pos, D.name, q.color, 12, { bold: true }); } }, {});
      return true;
    },
  },
  // 연사 강한 화살: 4m 넉백, 벽에 부딪히면 추가 피해 + 기절 1초
  strong(p, aim) {
    const RC = p.K.R.short.recast, rr = p.rRecast; if (!rr) return;
    if (Game.time < rr.ready) { if (!rr.queued) { rr.queued = true; p.after(rr.ready - Game.time, () => { rr.ready = 0; this.strong(p, aim); }); } return; }   // 3연발 중 재입력 → 다 쏜 뒤 발사
    p.rRecast = null;
    const t = Game.nearestEnemy(p.pos, p.K.R.short.range + 1, p), dir = aim ? p.dirTo(aim) : t ? V.norm(V.sub(t.pos, p.pos)) : rr.dir;
    Sfx.play('ult'); FX.text(p.pos, '강한 화살', '#ffffff', 12, { bold: true });
    p.shot({ dir, speed: 34, range: p.K.R.short.range, width: p.K.R.short.width, len: 1.3, color: '#ffffff', onHit: u => {
      p.hitS(u, p.calc(RC, 'R'), 'R');
      KU.knock(u, dir, RC.knock, 0.25, () => { p.hitS(u, p.calc({ base: RC.wallBase, ad: RC.wallAd }, 'R'), 'R'); u.applyCC('stun', RC.stun); FX.text(u.pos, '벽꿍 기절!', '#ffffff', 16, { bold: true }); FX.addShake(8); });
    } });
  },
  shape(p, k) {
    const K = p.K, s = p.stance === 'short';
    if (k === 'W') return s ? { kind: 'cone', len: K.W.short.range, angle: K.W.short.spread } : { kind: 'line', len: K.W.long.range, width: K.W.long.width };
    if (k === 'E') return { kind: 'dash', len: K.E.leap };
    if (k === 'R') return s ? { kind: 'line', len: K.R.short.range, width: K.R.short.width } : { kind: 'line', len: 30, width: K.R.long.width };
    if (k === 'D') return { kind: 'circle', range: K.D.range, r: K.D.radius };
    return null;
  },
  draw(p, ctx) {

// ---------------- 나딘 (석궁) ----------------
PKits.nadine = {
  short: { Q: '황소의 눈', W: '덫', E: '와이어', R: '늑대', D: '강노' },
  noAim: ['Q', 'R'],
  def: { D: { moveCancel: false } },
  label(p, k) { if (k === 'Q' && p.charge) return '발사!'; if (k === 'W' && p.trapA) return '덫 2'; if (k === 'E' && p.wire) return '이동!'; return this.short[k]; },
  init(p) { Object.assign(p, { charge: null, traps: [], trapA: null, wire: null, wolfT: 0, wolfN: 0, mark: null, lastP: {} }); },
  recast(p, k) { return (k === 'Q' && !!p.charge) || (k === 'W' && !!p.trapA) || (k === 'E' && !!p.wire); },
  wireAs(p, dur) { const E = p.K.E; p.addAs(lv(E.as, p.L('E')) + p.sp * 0.0005, dur, 'wire'); },
  // R 늑대: 평타 3번마다 대상에게 늑대 (시작 즉시 2중첩 → 첫 평타에도) + 야성
  onAAHit(p, u) {

  },
  onHit(p, u, o) { if (!o.mark) this.markHit(p, u); },
  // 강노 표식: 대상에게 평타·스킬이 맞을 때마다 폭발 0.5초 앞당김 + 피해 증가
  markHit(p, u) { const m = p.mark; if (!m || m.u !== u) return; const M = p.K.D.mark; m.t -= M.cut; m.bonus += lv(M.inc, p.L('D')) + p.bonusAd * lv(M.incBad, p.L('D')) + p.sp * (M.incSp || 0); },
  update(p, dt) {
    const K = p.K, foes = p.foes().filter(u => u.kind !== 'animal');
    if (p.wolfT > 0) p.wolfT -= dt;
    // Q 충전: 이속 서서히 −20%, 평타 불가, CC를 받으면 취소(쿨 50% 반환), 2초 충전이 다 차면 바로 발사(나무위키 「2초에 걸쳐 힘을 모은 뒤 화살을 발사」)
    const C = p.charge;
    if (C) {
      C.t += dt; const Q = K.Q; p.noAA = 0.15; p.addMsBuff(-Q.chargeSlow * Math.min(1, C.t / Q.charge), 0.1, false, 'charge');
      if (p.stun > 0 || p.fear > 0 || p.forced || p.silence > 0 || p.dead) { p.charge = null; p.skills.Q.cd = p.skills.Q.cdMax = Q.cd * Q.refund; FX.text(p.pos, '충전 취소', '#aaa', 11); }
      else if (C.t >= Q.charge) this.fireQ(p, p.cursor || V.add(p.pos, V.fromAng(p.facing)));

    // W 첫 덫: 5초 안에 두 번째를 못 던지면 사라짐(영문 위키 「5초 안에 재설치」) — 쿨 시작
    if (p.trapA && (p.trapA.t -= dt) <= 0) { p.trapA = null; p.startCd('W'); }
    // 덫 연결선을 지나간 적: 피해 + 이속 감소 + 5초 노출 (이미 이 덫에 둔화 중이면 30%)
    for (const u of foes) { const lp = p.lastP[u.id]; if (lp) for (const tr of p.traps) {
      if (tr.used || !(KU.segCross(lp, u.pos, tr.a, tr.b) || Geo.segDist(u.pos, tr.a, tr.b) < u.r * 0.5)) continue;
      tr.used = true; const W = K.W, again = u.trapSlowT > Game.time;

    for (const u of foes) p.lastP[u.id] = V.copy(u.pos);
    // E 와이어: 7초 · 11m 넘게 멀어지거나 CC를 받으면 끊김

  },
  fireQ(p, aim) {

  cast: {

    // E 원숭이 와이어: 1단계 = 커서 위치(7m)에 와이어, 걸려 있는 동안 공속 / 재입력 = 와이어로 이동(이후 3초 공속 유지)

        const to = Geo.pushOut(V.copy(p.wire.pos), p.r), dir = V.norm(V.sub(to, p.pos)), dist = V.dist(p.pos, to); p.wire = null; PKits.nadine.wireAs(p, E.after);

    // D 강노: 0.3초 → 7.5m·45° 부채꼴 관통 — 피해 + 40% 둔화 + 4초 뒤 폭발 표식(첫 대상)

  },

// ---------------- 카티야 (저격총) ----------------
PKits.katja = {
  short: { Q: '조준 사격', W: '포착', E: '접근 금지', R: '정밀 조준', D: '저격' },

  init(p) { p.psT = 0; p.snipe = null; },
  update(p, dt) { if (p.psT > 0) p.psT -= dt; },

  onAAHit(p, u) { if (p.psT <= 0) return; p.psT = 0; const P = p.K.P; p.hitS(u, lv(P.base, p.plv) + p.ad * lv(P.ad, p.plv), 'P'); FX.text(u.pos, P.name, p.color, 11, { bold: true }); },
  recast(p, k) { return k === 'D' && !!p.snipe; },
  // 저격 모드 중 D = 즉시 발사(시전 중이라도)

  snipeShot(p, aim) {

    const dead = S.fired === K.shots - 1, SS = dead ? K.dead : K.shot, dir = p.dirTo(aim); S.fired++; S.last = Game.time; p.facing = V.ang(dir);

      hit = true; let amt = p.calc(SS, 'D'); if (dead) amt *= 1 + clamp(1 - u.hp / u.maxHp, 0, 1) * (K.dead.missMax - 1);   // 데드아이: 잃은 체력 비례 최대 2배
      p.hitS(u, amt, 'D'); if (!dead) u.addSlow(K.shot.slow, K.shot.slowDur);

    } });

  },
  cast: {
    // Q 조준 사격: 11m 직선, 첫 대상만, 날아간 거리에 비례해 피해(최대 +50%), 적중 시 4초 공속 / P 창 켜짐
    Q(p, aim) {
      const Q = p.K.Q;
      p.beginCast('Q', aim, { windup: () => Q.windup, recovery: () => 0.05,
        fire(q, c) {
          q.startCd('Q'); q.psT = q.K.P.window; Sfx.play('throw'); let hit = false;
          const pr = q.shot({ dir: c.dir, speed: Q.speed, range: Q.range, width: Q.width, len: 1.1, onHit: (u, pr) => {
            hit = true; const k = clamp(pr.traveled / Q.range, 0, 1), L = q.L('Q'), amt = lerp(lv(Q.min, L) + q.ad * Q.minAd, lv(Q.max, L) + q.ad * Q.maxAd, k);
            q.hitS(u, amt, 'Q'); q.addAs(lv(Q.asBuff, L), Q.asDur, 'katjaQ'); FX.burst(u.pos, q.color, 10, 5);
          } });

    },
    // W 목표물 포착: 지면 지정 23m — 날아가는 동안 근처 적 1초 노출, 도착하면 반경 4.5m 3초 시야
    W(p, aim) {

      p.startCd('W'); p.instantUsed('W'); Sfx.play('throw'); FX.text(p.pos, W.name, p.color, 12, { bold: true }); FX.trail(from, to, '#9fd8ff', 0.12, dur + 0.2);
      for (let s = 0.1; s < dur; s += 0.1) { const at = V.lerp(from, to, s / dur); p.after(s, () => { Vision.reveals.push({ team: p.team, pos: at, r: 1.5, t: 0.1 }); for (const u of p.foes()) if (isHero(u) && V.dist(u.pos, at) <= 1.5 + u.r) u.revealT = Math.max(u.revealT || 0, 1); }); }
      p.after(dur, () => { Vision.reveals.push({ team: p.team, pos: to, r: W.radius, t: W.dur }); FX.ring(to, 0.5, W.radius, '#9fd8ff', 0.5, 0.08);

        fire(q, c) {

          for (const u of q.foes()) if (Geo.inSector(q.pos, c.ang, E.range, E.angle / 2 * Math.PI / 180, u.pos, u.r)) { hit = true; q.hitS(u, q.calc(E, 'E'), 'E'); u.addSlow(lv(E.slow, q.L('E')), E.slowDur); }

          const back = V.mul(c.dir, -1), len = Geo.passDash(q.pos, back, E.leap, q.r, 0.5); c.data.from = V.copy(q.pos); c.data.to = Geo.pushOut(V.add(q.pos, V.mul(back, len)), q.r);
          FX.text(q.pos, E.name, q.color, 12, { bold: true });
        },
        tick(q, c) { const k = Math.min(1, c.t / E.leapTime); q.pos = V.lerp(c.data.from, c.data.to, k); return k >= 1; } }, {});
      return true;
    },
    // R 정밀 조준: 지면 지정 23m, 0.8초 스캔(제자리 고정 · CC면 끊김) → 사다리꼴 안 적 실험체(최대 3)에게 가까운 순서로 회피 불가 탄, 대상 없으면 쿨 35% 반환
    R(p, aim) {
      const R = p.K.R, pos = p.ptIn(aim, R.range);
      p.beginCast('R', pos, { windup: () => R.scan, recovery: () => 0.1,
        start(q, c) { c.data.pos = pos; c.data.axis = q.dirTo(pos); FX.text(q.pos, R.name, q.color, 13, { bold: true }); q.revealT = Math.max(q.revealT || 0, R.scan + 0.3); },
        fire(q, c) {
          const ts = KU.inTrap(c.data.pos, c.data.axis, R, q.foes().filter(u => isHero(u) || u.kind === 'dummy')).slice(0, R.max);   // 실험체(연습용 허수아비 포함)
          q.startCd('R');
          if (!ts.length) { q.skills.R.cd *= 1 - R.refund; FX.text(q.pos, '스캔 실패', '#8a93a6', 12); return; }
          Sfx.play('ult');
          ts.forEach((u, i) => q.after(i * 0.15, () => { const S = R.shots[i] || R.shots[0];
            q.shot({ dir: V.norm(V.sub(u.pos, q.pos)), speed: R.speed, home: u, only: u, width: 0.5, len: 1.8, color: '#ff4d4d', onHit: v => { q.hitS(v, q.calc(S, 'R'), 'R'); FX.burst(v.pos, '#ff4d4d', 18, 7); FX.addShake(6); } }); }));
        } }, {});
      return true;
    },
    // D 저격: 제자리 고정 10초 모드 — 정신 집중(0.55초 ⚠) 뒤 D를 누를 때마다 커서 방향 발사(간격 0.25초), 3발째 데드아이 · 이동하면 해제, 0발이면 쿨 50% 반환
    D(p, aim) {
      const K = p.K.D;
      p.beginCast('D', aim, { windup: () => 0, recovery: () => 0.05,
        fire(q, c) { c.data.noStat = true; q.snipe = { t: 0, fired: 0, last: -99 }; FX.text(q.pos, K.name, q.color, 13, { bold: true }); q.noAA = K.mode; },
        tick(q, c, dt) {
          const S = q.snipe; if (!S) return true; S.t += dt; q.noAA = 0.2;
          if (S.end || S.t >= K.mode || q.pendingMove || q.stun > 0 || q.silence > 0) {
            q.snipe = null; q.noAA = 0; q.startCd('D'); if (S.fired === 0) q.skills.D.cd *= 0.5;
            return true;
          }
          return false;
        } }, {});
      return true;
    },
  },
  shape(p, k) {
    const K = p.K;
    if (k === 'Q') return { kind: 'line', len: K.Q.range, width: K.Q.width };
    if (k === 'W') return { kind: 'circle', range: K.W.range, r: K.W.radius };
    if (k === 'E') return { kind: 'back', len: K.E.leap, cone: { len: K.E.range, angle: K.E.angle } };
    if (k === 'R') return { kind: 'trap', range: K.R.range, len: K.R.len, w0: K.R.w0, w1: K.R.w1 };
    if (k === 'D') return { kind: 'line', len: K.D.range, width: K.D.width };
    return null;
  },
  draw(p, ctx) {
    if (p.snipe) { const K = p.K.D, dir = p.dirTo(p.aimPt()), ready = p.snipe.t >= K.aim; ctx.save(); ctx.globalAlpha = ready ? 0.45 : 0.2; ctx.fillStyle = p.snipe.fired === K.shots - 1 ? '#ff4d4d' : p.color; Draw.oRect(ctx, p.pos, V.ang(dir), K.range, K.width); ctx.restore(); }
    if (p.cast && p.cast.k === 'R' && p.cast.data.pos) { const R = p.K.R, q = KU.trapPts(p.cast.data.pos, p.cast.data.axis, R), k = clamp(p.cast.t / R.scan, 0, 1); ctx.save(); ctx.globalAlpha = 0.15 + 0.35 * k; ctx.fillStyle = '#ff4d4d'; ctx.beginPath(); ctx.moveTo(q[0].x, q[0].y); for (const v of q) ctx.lineTo(v.x, v.y); ctx.closePath(); ctx.fill(); ctx.restore(); }
  },
  hud(p) {
    const b = []; if (p.psT > 0) b.push([`잿빛 사신 ${fmt(p.psT, 1)}`, p.color]);
    if (p.snipe) b.push([p.snipe.t < p.K.D.aim ? '저격 집중…' : `저격 모드 ${fmt(p.K.D.mode - p.snipe.t, 1)} · D 발사 ${p.snipe.fired}/3`, '#ff4d4d']);
    if (p.asBuffs.some(a => a.tag === 'katjaQ')) b.push(['조준 공속↑', '#c58bff']); return b;
  },
};

// ============================== 플레이어블: 알론소 (글러브 · 퓨어 탱커) ==============================
// 플레이어 = 실험체 키트 틀(RangedPlayer + PKits.alonso, 근접 평타) · AI = RangedDuelist + Kits.alonso(4_d_alonso_ai.js)
// 스킬 효과는 AlonsoCore를 플레이어·AI가 함께 씀 (주인 o의 어댑터 o.al: K · L · hit · foes · cdStart · cdSet · level · color · S)
// 수치: CONFIG.rangedKits.alonso (나무위키 + 공식 영상) · 근거 docs/er_notes_playables.md 11장 · ⚠ = 출처 없는 추정값
//   P 플라즈마 배리어: 이동 불가 효과(기절·속박·공포·에어본) 1회 무효 + 0.1초 면역 · 피해를 안 받고 일정 시간 지나면 다시 준비 · 스킬로 적 실험체를 이동 불가로 만들면 1명당 회복
//   Q 마그네틱 펀치: 직선 투사체 → 적중한 적과 연결(표식) · 연결 대상을 바라보면 이속 증가(가까울수록 더) · 그 적을 평타·무기 스킬로 치면 추가 피해 + 0.9초 기절
//   W 바운싱 실드: 2.5초 전방 피해 60% 감소 · 파동 5회(점점 빠르게) · 재사용·종료 시 마무리 피해 (추가 체력 비례)
//   E 어트랙션 슬램!: 대상 지정(4.75m) → 0.8초 뒤 돌진(그 사이 8.25m 밖으로 나가면 취소·쿨 30% 반환) → 피해 + 속박
//   R 게더링 필드: 정신 집중 3.5초 — 주변 4.75m 당기기 + 피해 → 0.5초마다 회복·지속 피해·밖으로 가려는 적 60% 둔화 → 재사용·종료 시 유지 시간 비례 마무리 피해

const AlonsoCore = {
  attach(o) {
    Object.assign(o, { alMark: null, alW: null, alR: null, alE: null, alUpper: 0, alWaves: [], alBar: { ready: true, quiet: 0, immune: 0 } });
    o.ccGuard = type => this.guard(o, type);
    o.dmgMulFrom = src => this.shieldMul(o, src);
  },
  bonusHp(o) { const lvl = o.al.level(); return Math.max(0, o.maxHp - (1000 + 94 * (lvl - 1))); },
  // ---------- P 플라즈마 배리어 ----------
  guard(o, type) {
    if (!['stun', 'root', 'fear'].includes(type)) return false;
    const B = o.alBar; if (B.immune > 0) return true;
    if (!B.ready) return false;
    B.ready = false; B.immune = o.al.K.P.immune; B.quiet = 0; FX.text(o.pos, '플라즈마 배리어', '#7fd7ff', 12, { bold: true }); FX.ring(o.pos, o.r, o.r + 0.6, '#7fd7ff', 0.3);
    return true;
  },
  onDamaged(o) { o.alBar.quiet = 0; },
  // 이동 불가 CC + 패시브 회복 (적 실험체 1명당)
  cc(o, u, type, dur) {
    if (!u || u.dead) return false;
    const ok = u.applyCC(type, dur);
    if (ok && isHero(u)) { const P = o.al.K.P, l = o.al.L('P'); o.heal(lv(P.heal, l) + o.maxHp * lv(P.healPct, l)); }
    return ok;
  },
  // ---------- 보이는 효과 (판정과 무관) ----------
  // 주먹 타격: 맞은 자리에 작은 충격파 · 기절(연결 터뜨리기)·어퍼컷은 크게 + 화면 흔들림(내가 치거나 맞을 때)
  punchFx(o, u, big) {
    const to = V.norm(V.sub(u.pos, o.pos)), at = V.sub(u.pos, V.mul(to, u.r * 0.5));
    FX.ring(at, 0.1, big ? 1.4 : 0.75, big ? '#ffd166' : '#9fe3ff', big ? 0.32 : 0.18, big ? 0.14 : 0.08);
    FX.burst(at, big ? '#ffd166' : '#9fe3ff', big ? 14 : 7, big ? 6 : 4.5);
    if (o === Game.player || u === Game.player) FX.addShake(big ? 7 : 2);
  },
  // 평타 적중 (플레이어·AI 공통): 연결된 적이면 큰 타격 + 기절
  aaHit(o, u) { this.punchFx(o, u, !!(o.alMark && o.alMark.u === u)); this.pop(o, u); },
  // ---------- Q 마그네틱 펀치 ----------
  qHit(o, u) {
    const Q = o.al.K.Q, l = o.al.L('Q'); o.al.hit(u, lv(Q.base, l) + (o.sp || 0) * Q.sp, 'Q');
    if (isHero(u) || u.kind === 'dummy') { o.al.S.count('linkOn'); o.alMark = { u, t: Q.markDur }; FX.text(u.pos, '자력 연결', o.al.color, 12, { bold: true }); }
  },
  // 연결된 적을 평타·무기 스킬로 치면: 최대 체력 비례 추가 피해 + 기절
  pop(o, u) {
    const M = o.alMark; if (!M || M.u !== u) return;
    const Q = o.al.K.Q, l = o.al.L('Q'); o.alMark = null; o.al.S.count('linkPop');
    o.al.hit(u, u.maxHp * lv(Q.popPct, l) + o.al.level() * Q.popLv, 'Q');
    if (this.cc(o, u, 'stun', Q.stun)) FX.text(u.pos, '기절', '#ffd166', 12, { bold: true });
  },
  // ---------- W 바운싱 실드 ----------
  wStart(o, dir) { const W = o.al.K.W; o.alW = { t: 0, dir: V.copy(dir), next: 0 }; o.al.cdStart('W'); FX.text(o.pos, W.name, o.al.color, 12, { bold: true }); },
  // 전방(방패 쪽) 피해 60% 감소
  shieldMul(o, src) {
    const S = o.alW; if (!S || !src || !src.pos) return 1;
    const to = V.sub(src.pos, o.pos); return V.len(to) < 0.01 || V.dot(to, S.dir) > 0 ? 1 - o.al.K.W.reduce : 1;
  },
  wBox(o, u) { const S = o.alW, W = o.al.K.W, rel = V.sub(u.pos, o.pos), a = V.dot(rel, S.dir), s = Math.abs(rel.x * S.dir.y - rel.y * S.dir.x); return a >= W.near - u.r && a <= W.len + u.r && s <= W.width / 2 + u.r; },
  wWave(o, fin) {
    const W = o.al.K.W, l = o.al.L('W'), bh = this.bonusHp(o), amt = fin ? lv(W.fin, l) + (o.sp || 0) * W.finSp + bh * W.finHp : lv(W.base, l) + (o.sp || 0) * W.sp + bh * W.bhp;
    FX.slash(o.pos, V.ang(o.alW.dir), o.r + (fin ? 1.4 : 0.9), fin ? 1.0 : 0.7, fin ? '#ffb347' : '#7fd7ff', fin ? 0.3 : 0.18, o.r + 0.2);   // 방패를 미는 순간 앞쪽 섬광 (파동 자체는 draw에서 앞으로 나아감)
    o.alWaves.push({ from: V.copy(o.pos), dir: V.copy(o.alW.dir), d: W.near, amt, fin, hit: new Set() });   // 파동 = 14m/s 투사체(나무위키) — 앞으로 나아가며 닿은 적에게 1번씩
  },
  // 파동 진행: 이번 스텝에 지난 구간(앞 0.5~5m · 폭 3m) 안의 적
  wTick(o, dt) {
    const W = o.al.K.W;
    for (const w of o.alWaves) {
      const d0 = w.d; w.d = Math.min(W.len, w.d + W.speed * dt);
      for (const u of o.al.foes()) {
        if (w.hit.has(u.id)) continue; const rel = V.sub(u.pos, w.from), a = V.dot(rel, w.dir), s = Math.abs(rel.x * w.dir.y - rel.y * w.dir.x);
        if (a >= d0 - u.r && a <= w.d + u.r && s <= W.width / 2 + u.r) { w.hit.add(u.id); o.al.hit(u, w.amt, 'W'); }
      }
    }
    o.alWaves = o.alWaves.filter(w => w.d < W.len);
  },
  wEnd(o) { if (!o.alW) return; this.wWave(o, true); o.alW = null; },
  // ---------- E 어트랙션 슬램! (0.8초 뒤 돌진) ----------
  eLand(o, u) {
    const E = o.al.K.E, l = o.al.L('E');
    o.al.hit(u, lv(E.base, l) + o.def * E.defR + o.maxHp * E.hpR, 'E');
    this.cc(o, u, 'root', lv(E.root, l)); FX.text(u.pos, '속박', '#ffd166', 12, { bold: true });
    o.alE = null; FX.ring(u.pos, 0.2, 1.6, o.al.color, 0.35, 0.16); FX.burst(u.pos, o.al.color, 12, 5); if (o === Game.player || u === Game.player) FX.addShake(6);
  },
  // 0.8초 준비: 대상과 이어진 선이 차오름 · 8.25m 취소 거리 표시
  eAim(o, u) { o.alE = { u, t: 0 }; },
  eGo(o, from, to) { o.alE = null; FX.trail(from, to, o.al.color, 0.9, 0.35); },
  eValid(o, u) { return u && !u.dead && !(u.untargetable > 0) && V.dist(o.pos, u.pos) <= o.al.K.E.cancel && Vision.visible(o, u); },
  // ---------- R 게더링 필드 ----------
  rStart(o) {
    const R = o.al.K.R, l = o.al.L('R'); o.alR = { t: 0, acc: 0, c: V.copy(o.pos) };
    FX.ring(o.pos, 0.5, R.r, o.al.color, 0.4); FX.text(o.pos, R.name, o.al.color, 14, { bold: true }); Sfx.play('ult');
    for (const u of o.al.foes()) {
      if (V.dist(u.pos, o.pos) > R.r + u.r) continue;
      o.al.hit(u, lv(R.base, l) + (o.sp || 0) * R.sp, 'R');
      if (u.dead || u.unstoppable > 0) continue;
      const dir = V.norm(V.sub(o.pos, u.pos)), dd = Math.max(0, Math.min(R.pull, V.dist(u.pos, o.pos) - o.r - u.r - 0.1));
      if (dd > 0.05) u.forced = { from: V.copy(u.pos), to: Geo.pushOut(V.add(u.pos, V.mul(dir, dd)), u.r), t: 0, dur: R.pullTime };
      if (isHero(u)) { const P = o.al.K.P, lp = o.al.L('P'); o.heal(lv(P.heal, lp) + o.maxHp * lv(P.healPct, lp)); }   // 당기기 = 이동 불가 판정 → 패시브 회복
    }
  },
  rTick(o, dt) {
    const S = o.alR, R = o.al.K.R, l = o.al.L('R'); S.t += dt; S.acc += dt;
    for (const u of o.al.foes()) {   // 영역 밖으로 가려는 적 둔화
      if (V.dist(u.pos, S.c) > R.r + u.r) continue;
      if (u.vel && V.dot(u.vel, V.sub(u.pos, S.c)) > 0.1) u.addSlow(R.slow, 0.15);
    }
    if (S.acc >= R.tick) {
      S.acc -= R.tick; o.heal(R.heal + o.maxHp * lv(R.healPct, l), true); FX.ring(S.c, R.r, R.r * 0.55, o.al.color, 0.3, 0.1);   // 안으로 모이는 고리
      for (const u of o.al.foes()) if (V.dist(u.pos, S.c) <= R.r + u.r) o.al.hit(u, lv(R.dot, l) + (o.sp || 0) * R.dotSp, 'R', { tick: true });
    }
    return S.t >= R.dur;
  },
  rEnd(o, interrupted) {
    const S = o.alR; if (!S) return; o.alR = null; if (interrupted) { FX.text(o.pos, '게더링 필드 끊김', '#aaa', 11); return; }
    const R = o.al.K.R, l = o.al.L('R'), k = clamp(S.t / R.dur, 0, 1), bh = this.bonusHp(o);
    const amt = lerp(lv(R.minF, l) + (o.sp || 0) * R.minSp + bh * R.minHp, lv(R.maxF, l) + (o.sp || 0) * R.maxSp + bh * R.maxHp, k);
    FX.ring(S.c, 0.5, R.r, '#ffb347', 0.45, 0.2); FX.ring(S.c, 0.3, R.r * 0.6, '#ffd166', 0.3, 0.12); FX.text(S.c, `마무리 ${Math.round(k * 100)}%`, '#ffb347', 13, { bold: true });
    let any = false; for (const u of o.al.foes()) if (V.dist(u.pos, S.c) <= R.r + u.r) { o.al.hit(u, amt, 'R'); FX.burst(u.pos, '#ffb347', 10, 5); any = true; }
    if (o === Game.player || any) FX.addShake(5 + 5 * k);
  },
  // ---------- D 어퍼컷 (무기 스킬) ----------
  dHit(o, u) {
    const D = o.al.K.D, l = o.al.L('D'), base = (o.bonusAd || 0) * D.bad * (1 + (o.aaAmp || 0)) + (o.sp || 0) * D.sp;
    o.al.hit(u, base, 'D', { type: 'normal' }); o.al.hit(u, base * lv(D.extra, l), 'D'); o.al.hit(u, lv(D.fixed, l), 'D', { type: 'true' });
    o.alUpper++; this.punchFx(o, u, true); FX.text(u.pos, '어퍼컷', '#ffb347', 12, { bold: true }); this.pop(o, u);
  },
  // ---------- 매 스텝 ----------
  update(o, dt) {
    const K = o.al.K, B = o.alBar;
    if (o.alWaves.length) this.wTick(o, dt);
    if (B.immune > 0) B.immune -= dt;
    if (o.alE && ((o.alE.t += dt) > K.E.windup + 0.2 || o.alE.u.dead)) o.alE = null;
    if (!B.ready && (B.quiet += dt) >= lv(K.P.cd, o.al.L('P'))) { B.ready = true; FX.ring(o.pos, o.r, o.r + 0.4, '#7fd7ff', 0.25); }
    // Q 연결: 시간·거리 · 연결 대상을 바라보며 움직이면 이속(가까울수록 더 — 최대 2배 ⚠)
    const M = o.alMark;
    if (M) {
      M.t -= dt; const u = M.u, d = V.dist(o.pos, u.pos);
      if (M.t <= 0 || u.dead || d > K.Q.breakDist) o.alMark = null;
      else {
        const to = V.norm(V.sub(u.pos, o.pos)), face = o.alW ? o.alW.dir : V.fromAng(o.facing);
        if (V.dot(face, to) > 0.5) o.addMsBuff(lv(K.Q.ms, o.al.L('Q')) * (1 + clamp(1 - d / K.Q.range, 0, 1)), 0.12, false, 'alQ');
      }
    }
    // W 방패: 파동 · 이속 감소 · 끝나면 마무리
    const S = o.alW;
    if (S) {
      S.t += dt; o.addMsBuff(-K.W.slow, 0.12, false, 'alW');
      while (S.next < K.W.waves.length && S.t >= K.W.waves[S.next]) { this.wWave(o, false); S.next++; }
      if (S.t >= K.W.dur || o.dead) this.wEnd(o);
    }
  },
  draw(o, ctx) {
    const K = o.al.K, col = o.al.color, T = Game.time, BLUE = '#7fd7ff';
    // W 방패: 막는 쪽(앞) 범위 + 두꺼운 방패 호(남은 시간만큼) + 앞으로 나아가는 파동
    if (o.alW) {
      const S = o.alW, W = K.W, a = V.ang(S.dir), n = V.perp(S.dir), rest = 1 - S.t / W.dur;
      ctx.save(); ctx.globalAlpha = 0.1; ctx.fillStyle = BLUE; ctx.strokeStyle = BLUE; ctx.lineWidth = 0.05; Draw.oRect(ctx, V.add(o.pos, V.mul(S.dir, W.near)), a, W.len - W.near, W.width);
      ctx.globalAlpha = 0.45; ctx.setLineDash([0.25, 0.15]); ctx.beginPath(); const e0 = V.add(o.pos, V.mul(S.dir, W.near)), e1 = V.add(o.pos, V.mul(S.dir, W.len));
      for (const sg of [-1, 1]) { const off = V.mul(n, sg * W.width / 2); ctx.moveTo(e0.x + off.x, e0.y + off.y); ctx.lineTo(e1.x + off.x, e1.y + off.y); } ctx.stroke(); ctx.restore();
      ctx.save(); ctx.strokeStyle = BLUE; ctx.lineCap = 'round'; ctx.globalAlpha = 0.85; ctx.lineWidth = 0.16; ctx.beginPath(); ctx.arc(o.pos.x, o.pos.y, o.r + 0.4, a - 1.15, a + 1.15); ctx.stroke();
      ctx.globalAlpha = 0.35; ctx.lineWidth = 0.32; ctx.beginPath(); ctx.arc(o.pos.x, o.pos.y, o.r + 0.4, a - 1.15 * rest, a + 1.15 * rest); ctx.stroke(); ctx.restore();
    }
    for (const w of o.alWaves) {
      const W = K.W, c = V.add(w.from, V.mul(w.dir, w.d)), n = V.mul(V.perp(w.dir), W.width / 2), f = 1 - w.d / W.len;
      ctx.save(); ctx.strokeStyle = w.fin ? '#ffb347' : BLUE; ctx.globalAlpha = 0.35 + 0.55 * f; ctx.lineWidth = w.fin ? 0.3 : 0.2; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(c.x - n.x, c.y - n.y); ctx.quadraticCurveTo(c.x + w.dir.x * 0.6, c.y + w.dir.y * 0.6, c.x + n.x, c.y + n.y); ctx.stroke(); ctx.restore();
    }
    // R 게더링 필드: 굵은 경계 + 안으로 모이는 고리 + 알론소 둘레의 마무리 피해 충전(유지할수록 강함)
    if (o.alR) {
      const S = o.alR, R = K.R, k = clamp(S.t / R.dur, 0, 1);
      KU.fill(ctx, S.c, R.r, col, 0.1 + 0.05 * Math.sin(T * 8));
      ctx.save(); ctx.strokeStyle = col; ctx.globalAlpha = 0.85; ctx.lineWidth = 0.14; Draw.circle(ctx, S.c.x, S.c.y, R.r); ctx.stroke();
      for (let i = 0; i < 3; i++) { const f = (T * 0.9 + i / 3) % 1; ctx.globalAlpha = 0.45 * f; ctx.lineWidth = 0.08; Draw.circle(ctx, S.c.x, S.c.y, Math.max(0.3, R.r * (1 - f))); ctx.stroke(); }
      ctx.globalAlpha = 0.3; ctx.lineWidth = 0.18; Draw.circle(ctx, o.pos.x, o.pos.y, o.r + 0.55); ctx.stroke();
      ctx.globalAlpha = 0.95; ctx.strokeStyle = k > 0.99 ? '#ffd166' : '#ffb347'; ctx.lineCap = 'round'; ctx.beginPath(); ctx.arc(o.pos.x, o.pos.y, o.r + 0.55, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * k); ctx.stroke(); ctx.restore();
    }
    // E 준비(0.8초): 대상까지 선이 차오름 · 대상 둘레 시간 · 취소 거리(8.25m)
    if (o.alE && !o.alE.u.dead) {
      const u = o.alE.u, k = clamp(o.alE.t / K.E.windup, 0, 1), tip = V.add(o.pos, V.mul(V.sub(u.pos, o.pos), k));
      ctx.save(); ctx.strokeStyle = col; ctx.lineCap = 'round';
      ctx.globalAlpha = 0.3; ctx.lineWidth = 0.08; ctx.setLineDash([0.2, 0.14]); ctx.beginPath(); ctx.moveTo(o.pos.x, o.pos.y); ctx.lineTo(u.pos.x, u.pos.y); ctx.stroke(); ctx.setLineDash([]);
      ctx.globalAlpha = 0.9; ctx.lineWidth = 0.2; ctx.beginPath(); ctx.moveTo(o.pos.x, o.pos.y); ctx.lineTo(tip.x, tip.y); ctx.stroke();
      ctx.lineWidth = 0.12; ctx.beginPath(); ctx.arc(u.pos.x, u.pos.y, u.r + 0.35, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * k); ctx.stroke();
      ctx.globalAlpha = 0.25; ctx.lineWidth = 0.05; ctx.setLineDash([0.3, 0.2]); Draw.circle(ctx, o.pos.x, o.pos.y, K.E.cancel); ctx.stroke(); ctx.restore();

    if (o.alMark && !o.alMark.u.dead) {
      const u = o.alMark.u, k = clamp(o.alMark.t / K.Q.markDur, 0, 1), rng = typeof o.aaRange === 'function' ? o.aaRange() : (o.aaRange || 1.2);
      const c2 = V.dist(o.pos, u.pos) <= rng + o.r + u.r + 0.1 ? '#ffd166' : BLUE;
      ctx.save(); ctx.strokeStyle = c2; ctx.globalAlpha = 0.6 + 0.3 * Math.sin(T * 12); ctx.lineWidth = 0.13; ctx.setLineDash([0.22, 0.12]); ctx.lineDashOffset = -T * 2;
      ctx.beginPath(); ctx.moveTo(o.pos.x, o.pos.y); ctx.lineTo(u.pos.x, u.pos.y); ctx.stroke(); ctx.setLineDash([]);
      ctx.globalAlpha = 0.9; ctx.lineWidth = 0.12; ctx.lineCap = 'round'; ctx.beginPath(); ctx.arc(u.pos.x, u.pos.y, u.r + 0.3, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * k); ctx.stroke();
      ctx.globalAlpha = 0.3; ctx.lineWidth = 0.05; Draw.circle(ctx, u.pos.x, u.pos.y, u.r + 0.3); ctx.stroke(); ctx.restore();
    }
    // P 배리어 준비: 몸 둘레 고리(천천히 깜빡) · 막은 직후 밝게
    if (o.alBar.immune > 0) KU.ring(ctx, o.pos, o.r + 0.2, BLUE, 1, false);
    else if (o.alBar.ready) KU.ring(ctx, o.pos, o.r + 0.12, BLUE, 0.4 + 0.15 * Math.sin(T * 3), false);
  },
};

// ============================== 플레이어 키트 ==============================
PKits.alonso = {
  short: { Q: '펀치', W: '실드', E: '슬램', R: '필드', D: '어퍼컷' },
  noAim: ['W', 'R'],   // W: 커서 방향으로 방패(재입력 = 마무리) · R: 제자리(재입력 = 마무리)
  def: { E: { moveCancel: false }, R: { channel: true, moveCancel: false }, D: { moveCancel: false } },
  label(p, k) { if (k === 'W' && p.alW) return '터뜨리기'; if (k === 'R' && p.alR) return '마무리'; return this.short[k]; },
  noCrit: true,
  init(p) {
    p.melee = true;   // 근접(팀 AI·상대 AI 판단) — 조작 틀은 실험체 키트 그대로
    p.al = { K: p.K, color: p.color, S: p.S, L: k => p.L(k), hit: (u, amt, k, o) => p.hitS(u, amt, k, o), foes: () => p.foes(), level: () => p.build.level || 1,
      cdStart: k => p.startCd(k), cdSet: (k, v) => { p.skills[k].cd = v; } };
    Object.defineProperty(p.al, 'S', { get: () => p.S });
    AlonsoCore.attach(p);
  },
  // 근접 평타: 투사체 없이 즉시 (연결된 적이면 기절)
  fireAA(p, t) { p.aaLand(t); return true; },
  onAAHit(p, u) { AlonsoCore.aaHit(p, u); },
  onDamaged(p) { AlonsoCore.onDamaged(p); },
  reset(p) { Object.assign(p, { alMark: null, alW: null, alR: null, alE: null, alWaves: [], alBar: { ready: true, quiet: 0, immune: 0 } }); },
  recast(p, k) { return (k === 'W' && !!p.alW) || (k === 'R' && !!p.alR); },
  // R 정신 집중 중 재입력 = 바로 마무리 (시전 중에도)
  instant(p, k) {
    if (k === 'R' && p.alR && p.cast && p.cast.k === 'R') { p.cast.data.finish = true; return true; }
    if (k === 'W' && p.alW) { AlonsoCore.wEnd(p); return true; }
    return false;
  },
  update(p, dt) {
    AlonsoCore.update(p, dt);
    // R 정신 집중이 CC로 끊김(배리어가 막으면 계속)
    if (p.alR && (p.stun > 0 || p.fear > 0 || p.silence > 0 || p.dead || !p.cast || p.cast.k !== 'R')) { AlonsoCore.rEnd(p, true); if (p.cast && p.cast.k === 'R') p.cast = null; }
  },
  cast: {
    // Q: 커서 방향 직선 투사체 (선딜 0.25초)
    Q(p, aim) {
      const Q = p.K.Q;
      p.beginCast('Q', aim, { windup: () => Q.windup, recovery: () => 0.05,
        fire(q, c) { q.startCd('Q'); Sfx.play('throw'); let hit = false;
          const pr = q.shot({ dir: c.dir, speed: Q.speed, range: Q.range, width: Q.width, len: 0.8, color: '#7fd7ff', onHit: u => { hit = true; AlonsoCore.qHit(q, u); } }); pr.look = 'fist'; pr.onDone = () => q.S.resolveShot('Q', hit); } }, {});
      return true;
    },
    // W: 커서 방향으로 방패 2.5초 (움직일 수 있음, 방향 고정)
    W(p, aim) { if (p.alW) { AlonsoCore.wEnd(p); return true; } AlonsoCore.wStart(p, p.dirTo(aim)); p.instantUsed('W'); return true; },
    // E: 대상 지정 4.75m(밖이면 다가감) → 0.8초 뒤 돌진 + 속박 (그 사이 8.25m 밖이면 취소·쿨 30% 반환)
    E(p, aim) {
      const t = p.targetAt(aim, 'E'); if (!t) return false; const E = p.K.E;
      return p.chaseCast('E', t, E.range, () => {
        p.startCd('E'); AlonsoCore.eAim(p, t); FX.ring(t.pos, t.r, t.r + 0.5, p.color, 0.8); FX.text(t.pos, E.name, p.color, 13, { bold: true });
        p.beginCast('E', t.pos, { windup: () => E.windup, recovery: () => 0.05,
          fire(q, c) {
            if (!AlonsoCore.eValid(q, t)) { q.skills.E.cd *= 1 - E.refund; q.skills.E.cdMax = q.skills.E.cd; FX.text(q.pos, '슬램 취소', '#aaa', 11); q.alE = null; c.data.cancel = true; return; }
            c.data.from = V.copy(q.pos); q.unstoppable = Math.max(q.unstoppable, 0.4);
          },
          tick(q, c, dt) {
            if (c.data.cancel) return true;
            const to = V.sub(t.pos, q.pos), d = V.len(to), step = E.dashSpeed * dt, reach = q.r + t.r + 0.05;
            if (t.dead || d <= reach + step) { if (!t.dead) { q.pos = Geo.pushOut(V.sub(t.pos, V.mul(V.norm(to), reach)), q.r); AlonsoCore.eGo(q, c.data.from, q.pos); AlonsoCore.eLand(q, t); } else q.alE = null; q.unstoppable = 0; return true; }
            q.pos = V.add(q.pos, V.mul(to, step / d)); q.facing = V.ang(to); return c.t > 1.2;
          } }, {});
      });
    },
    // R: 정신 집중 3.5초 (재입력 = 마무리)
    R(p) {
      const R = p.K.R;
      p.beginCast('R', p.pos, { windup: () => 0, recovery: () => 0.1,
        fire(q, c) { q.startCd('R'); AlonsoCore.rStart(q); },
        tick(q, c, dt) { if (!q.alR) return true; const done = AlonsoCore.rTick(q, dt) || c.data.finish; if (done) AlonsoCore.rEnd(q, false); return done; } }, {});
      return true;
    },
    // D 어퍼컷: 대상 지정(1.35m + 짧게 다가감)
    D(p, aim) {
      const t = p.targetAt(aim, 'D'); if (!t) return false; const D = p.K.D;
      return p.chaseCast('D', t, D.range + D.hop, () => {
        p.startCd('D'); const to = V.sub(t.pos, p.pos), d = V.len(to);
        if (d > p.r + t.r + D.range) p.pos = Geo.pushOut(V.add(p.pos, V.mul(to, (d - p.r - t.r - 0.2) / d)), p.r);
        p.facing = V.ang(to); AlonsoCore.dHit(p, t); p.instantUsed('D'); Sfx.play('aa');
      });
    },
  },
  shape(p, k) {
    const K = p.K;
    if (k === 'Q') return { kind: 'line', len: K.Q.range, width: K.Q.width };
    if (k === 'W') return { kind: 'line', len: K.W.len, width: K.W.width };
    if (k === 'E') return { kind: 'target', range: K.E.range };
    if (k === 'R') return { kind: 'self', r: K.R.r };
    if (k === 'D') return { kind: 'target', range: K.D.range + K.D.hop };
    return null;
  },
  draw(p, ctx) { AlonsoCore.draw(p, ctx); },
  hud(p) {
    const b = [[p.alBar.ready ? '배리어 준비' : `배리어 ${fmt(Math.max(0, lv(p.K.P.cd, p.L('P')) - p.alBar.quiet), 1)}`, p.alBar.ready ? '#7fd7ff' : '#8a93a6']];
    if (p.alMark) b.push([`자력 연결 ${fmt(p.alMark.t, 1)} (평타 = 기절)`, '#7fd7ff']);
    if (p.alW) b.push([`실드 ${fmt(p.K.W.dur - p.alW.t, 1)} (W: 터뜨리기)`, p.color]);
    if (p.alR) b.push([`게더링 필드 ${fmt(p.K.R.dur - p.alR.t, 1)} (R: 마무리)`, p.color]);
    return b;
  },
};

// ============================== 플레이어블: 비형 (방망이 · 브루저) ==============================
// 플레이어 = 실험체 키트 틀(RangedPlayer + PKits.bihyung, 근접 평타) · AI = RangedDuelist + Kits.bihyung(4_d_bihyung_ai.js)
// 스킬 효과는 BihyungCore를 플레이어·AI가 함께 씀 (주인 o의 어댑터 o.bh: K · L · hit · foes · cdStart · cdSet · level · color · S)
// 수치: CONFIG.rangedKits.bihyung (나무위키 + 공식 영상) · 근거 docs/er_notes_playables.md 14장 · ⚠ = 출처 없는 추정값
//   P 도깨비 불: 평타 10 · 스킬 30씩 신력 → 100이면 4초 장판(반경 3m, 초당 피해 + 대상 최대 체력 %) + 둔화 저항 · 적 실험체를 치면 시간 초기화
//   Q 뚝딱!: 다음 평타 강화(추가 피해 + 회복) → 1.5초 뒤 4초 안에 재사용 = 강화 평타 + 0.2초 간격 2회 추가(25% 평타 + 추가 피해, 70%는 주변 2m)
//   W 천벌 받아라!: 7m 안 지점에 1.5초 뒤 폭발(반경 2.75m, 피해 + 둔화) · 비형이 범위 안이면 보호막 · 이속 · 신력
//   E 내기 한판!: 2.5~5.3m 돌진(10m/s) — 처음 부딪힌 적에게 피해 + 도발
//   R 신명나게 놀아보자!: 5m 안 지점으로 약 1.2초 도약(오를 때 면역 → 공중 저지 불가) · 받는 피해 30% 감소 · 15초 추가 체력 · 착지 반경 4.5m 피해·둔화(중앙 2m는 30% 더)
//   D 풀스윙(방망이): 0.42초 뒤 앞 180° 2m — 피해 + 바라보는 방향으로 밀침 → 벽에 부딪히면 추가 피해 + 기절

const BihyungCore = {
  attach(o) {
    Object.assign(o, { bhG: 0, bhAura: 0, bhAuraAcc: 0, bhQ: null, bhQ2: null, bhW: [], bhR: null, bhHp: null, bhT: [], bhD: null, lift: 0, slowRes: 0 });
    o.ccGuard = type => !!(o.bhR && o.bhR.t < o.bh.K.R.immune);   // R 오르는 동안 방해 효과 면역
    o.dmgMulFrom = () => o.bhR ? 1 - o.bh.K.R.reduce : 1;          // R 쓰는 동안 받는 피해 30% 감소
  },
  later(o, t, fn) { o.bhT.push({ t, fn }); },
  isFoeUnit(u) { return isHero(u) || u.kind === 'dummy'; },
  // ---------- P 도깨비 불 ----------
  gain(o, n) {
    if (o.bhAura > 0) return;
    o.bhG = Math.min(o.bh.K.P.max, o.bhG + n);
    if (o.bhG >= o.bh.K.P.max) { o.bh.S.count('bhAura'); o.bhG = 0; o.bhAura = o.bh.K.P.dur; o.bhAuraAcc = 0; FX.ring(o.pos, 0.5, o.bh.K.P.r, '#3fd0c9', 0.4); FX.text(o.pos, o.bh.K.P.name, '#3fd0c9', 13, { bold: true }); Sfx.play('blink', o.pos); }
  },
  refresh(o, u) { if (o.bhAura > 0 && u && this.isFoeUnit(u)) o.bhAura = o.bh.K.P.dur; },   // 적 실험체를 치면 장판 시간 초기화 (일반 야생 동물은 X)
  // 스킬 피해 + 신력 30 + 장판 초기화
  skillHit(o, u, amt, k, opt) { if (!u || u.dead) return; o.bh.hit(u, amt, k, opt); this.gain(o, o.bh.K.P.gainSkill); this.refresh(o, u); },
  // ---------- 평타 적중: 신력 10 · Q 강화 ----------
  // ---------- 보이는 효과 (판정과 무관) ----------
  // 방망이 타격: 휘두른 호 + 맞은 자리 불꽃 · 뚝딱!(Q 강화)은 분홍으로 크게 + 화면 흔들림
  batFx(o, u, big) {
    const to = V.sub(u.pos, o.pos), a = V.ang(to), col = big ? '#ff6b9d' : '#ffe2a8';
    FX.slash(o.pos, a, o.r + (big ? 1.6 : 1.15), big ? 1.0 : 0.6, col, big ? 0.22 : 0.12, o.r + (big ? 0.3 : 0.5));
    const at = V.sub(u.pos, V.mul(V.norm(to), u.r * 0.5)); FX.burst(at, col, big ? 14 : 6, big ? 6 : 4);
    if (big) { FX.ring(at, 0.1, 1.2, col, 0.3, 0.12); if (o === Game.player || u === Game.player) FX.addShake(6); }
  },
  onAA(o, u) {
    if (!u || u.dead) return;
    this.batFx(o, u, !!o.bhQ);
    this.gain(o, o.bh.K.P.gainAA); this.refresh(o, u);
    const st = o.bhQ; if (!st) return;
    o.bhQ = null; const Q = o.bh.K.Q, l = o.bh.L('Q');
    this.skillHit(o, u, lv(Q.base, l) + o.ad * lv(Q.ad, l), 'Q');
    if (st.stage === 1) {
      o.heal(o.maxHp * lv(Q.heal, l)); o.bhQ2 = { t: 0 }; FX.text(o.pos, '뚝딱!', o.bh.color, 12, { bold: true });   // 1.5초 뒤부터 4초 안에 재사용
    } else {
      o.heal(o.maxHp * lv(Q.heal2, l)); FX.text(o.pos, '뚝딱! 뚝딱!', o.bh.color, 13, { bold: true });
      for (let i = 1; i <= 2; i++) this.later(o, Q.gap * i, () => {   // 0.2초 간격 2회 추가 (평타 판정 25% + 추가 피해, 그 70%는 주변 2m)
        if (u.dead || o.dead) return;
        const ex = lv(Q.extra, l) + o.ad * lv(Q.extraAd, l);
        o.bh.hit(u, o.ad * (1 + (o.aaAmp || 0)) * Q.extraAA, 'Q', { type: 'normal' }); this.gain(o, o.bh.K.P.gainAA);
        this.skillHit(o, u, ex, 'Q');
        for (const v of o.bh.foes()) if (v !== u && V.dist(v.pos, u.pos) <= Q.aoeR + v.r) o.bh.hit(v, ex * Q.aoe, 'Q');
        FX.burst(u.pos, '#ff6b9d', 8, 4); FX.ring(u.pos, 0.3, Q.aoeR, '#ff6b9d', 0.25, 0.08); FX.slash(o.pos, V.ang(V.sub(u.pos, o.pos)) + (i % 2 ? 0.5 : -0.5), o.r + 1.5, 0.8, '#ff6b9d', 0.15, o.r + 0.3); o.bhSwing = (o.bhSwing || 0) + 1;   // 추가 타격: 주변 2m 표시 · 한 번 더 휘두름
      });
      o.bh.cdStart('Q');
    }
  },
  // Q 사용: 강화 평타 준비 (재사용 가능하면 2단계)
  qReady2(o) { return !!(o.bhQ2 && o.bhQ2.t >= o.bh.K.Q.recastAfter); },
  qCast(o) {
    const Q = o.bh.K.Q;
    if (this.qReady2(o)) { o.bhQ2 = null; o.bhQ = { stage: 2, t: Q.buffDur }; o.bh.S.count('bhQ2'); return true; }   // 코칭: 뚝딱! 2단계 사용
    if (o.bhQ || o.bhQ2) return false;
    o.bhQ = { stage: 1, t: Q.buffDur }; o.bh.cdSet('Q', 999); o.bh.S.count('bhQ1');   // 다 쓸 때까지 쿨 잠금
    return true;
  },
  // ---------- W 천벌 받아라! ----------
  wCast(o, pt) { const W = o.bh.K.W; o.bhW.push({ pos: V.copy(pt), t: W.delay }); FX.ring(pt, 0.3, W.r, '#3fd0c9', W.delay, 0.08); o.bh.cdStart('W'); },
  wBlow(o, w) {
    const W = o.bh.K.W, l = o.bh.L('W');
    FX.ring(w.pos, 0.4, W.r, '#5ff0e6', 0.4); FX.burst(w.pos, '#5ff0e6', 16, 6); Sfx.play('slam', w.pos);
    for (const u of o.bh.foes()) if (V.dist(u.pos, w.pos) <= W.r + u.r) { this.skillHit(o, u, lv(W.base, l) + o.ad * W.ad + u.maxHp * lv(W.hpPct, l), 'W'); u.addSlow(W.slow, W.slowDur); }
    if (V.dist(o.pos, w.pos) <= W.r + o.r) {   // 비형이 범위 안: 보호막 · 이속 · 신력
      o.shield = Math.max(o.shield, lv(W.shield, l) + o.maxHp * W.shieldHp); o.shieldT = W.shieldDur;
      o.addMsBuff(W.ms, W.msDur, false, 'bhW'); this.gain(o, o.bh.K.P.gainSkill); FX.text(o.pos, '보호막', '#5ff0e6', 12, { bold: true });
    }
  },
  // ---------- E 내기 한판! — 돌진 한 스텝 (처음 부딪힌 적: 피해 + 도발) ----------
  eStart(o, dir, aimDist) { const E = o.bh.K.E; return { dir: V.copy(dir), left: clamp(aimDist, E.min, E.max), done: false }; },
  eStep(o, st, dt) {
    const E = o.bh.K.E; if (st.done) return true;
    const step = Math.min(st.left, E.speed * dt), from = V.copy(o.pos), to = Geo.pushOut(V.add(o.pos, V.mul(st.dir, step)), o.r);
    for (const u of o.bh.foes()) if (Geo.segDist(u.pos, from, V.add(from, V.mul(st.dir, step + o.r))) <= u.r + E.width / 2) {
      const l = o.bh.L('E'); this.skillHit(o, u, lv(E.base, l) + o.ad * E.ad, 'E');
      if (u.applyTaunt && u.applyTaunt(lv(E.taunt, l), o)) { FX.text(u.pos, '도발', '#ffd166', 12, { bold: true }); if (isHero(u) || u.kind === 'dummy') o.bh.S.count('bhTaunt'); }   // 코칭: 도발 성공
      FX.ring(u.pos, 0.2, 1.5, '#ffd166', 0.35, 0.14); FX.burst(u.pos, '#ffd166', 12, 5); if (o === Game.player || u === Game.player) FX.addShake(5);
      st.done = true; return true;
    }
    FX.trail(from, to, o.bh.color, 0.7, 0.3); o.pos = to; o.facing = V.ang(st.dir); st.left -= step;
    if (st.left <= 0.001 || V.dist(from, to) < step * 0.3) { st.done = true; return true; }   // 끝까지 · 벽에 막힘
    return false;
  },
  // ---------- R 신명나게 놀아보자! ----------
  rStart(o, pt) {
    const R = o.bh.K.R, l = o.bh.L('R'), to = Geo.pushOut(V.add(o.pos, V.mul(V.norm(V.sub(pt, o.pos)), Math.min(R.range, V.dist(o.pos, pt)))), o.r);
    o.bhR = { t: 0, from: V.copy(o.pos), to }; o.unstoppable = Math.max(o.unstoppable, R.unstop);
    const add = lv(R.bonusHp, l); if (o.bhHp) { o.maxHp -= o.bhHp.amt; o.hp = Math.min(o.hp, o.maxHp); }
    o.bhHp = { amt: add, t: R.bonusDur }; o.maxHp += add; o.hp += add;   // 도깨비 감투: 15초 추가 체력
    FX.text(o.pos, R.name, o.bh.color, 14, { bold: true }); Sfx.play('ult'); o.bh.cdStart('R');
  },
  rStep(o, dt) {
