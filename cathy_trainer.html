  }
  qLand(o) {
    const K = this.K.Q, apex = V.sub(o.pos, V.mul(o.dir, K.front)); let hit = false;
    for (const u of Game.enemies().concat(Game.units.filter(x => x.kind === 'animal' && !x.dead))) {
      if (u.dead || u.untargetable > 0 || !Geo.inSector(apex, V.ang(o.dir), K.len, K.angle / 2 * Math.PI / 180, u.pos, u.r)) continue;
      const center = V.dist(u.pos, o.pos) <= K.centerR + u.r;
      if (u.kind !== 'animal') { hit = true; Stats.hit('Q', 'dq' + o.id); }
      Combat.damage(this, u, this.calc(center ? K.center : K, 'Q'), { type: 'skill', source: center ? 'Q 중앙' : 'Q' });
      if (center) u.addSlow(K.slow, K.slowDur);
      Events.emit('skillHit', { k: 'Q', target: u });
    }
    Stats.resolveShot('Q', hit);
    FX.slash(apex, V.ang(o.dir), K.len, K.angle / 2 * Math.PI / 180, '#9d6bff', 0.3);
    const rb = Vision.bushAt(o.pos); if (rb >= 0) Vision.rustle(rb, o.pos, 0, true);
    if (hit) { this.qShots = K.asShots; this.qT = K.asDur; this.as = +(this.baseAs * (1 + lv(K.asBuff, this.L('Q')))).toFixed(2); FX.text(this.pos, '공속↑', '#d9a8ff', 12, { bold: true }); }
  }
  // W: 대상 지정 표식
  castW(aim) {
    const K = this.K.W, t = Game.pickEnemyAt(aim, CONFIG.input.pickRadius);
    if (!t || t.kind === 'ward') { Stats.mistake('영감: 대상 지정 실패 (커서 위에 적 없음)'); Sfx.play('error'); return false; }
    if (V.dist(this.pos, t.pos) - t.r > K.range) { FX.toast(`사거리 밖 (${K.range}m)`); Sfx.play('error'); return false; }
    this.mark = { target: t, t: 0, acc: 0 }; t.blindT = K.blind; t.blindR = K.blindR;
    this.startCd('W'); Stats.cast('W'); Vision.act(this, 'skill'); this.breakStealth();
    FX.text(t.pos, '영감 표식', '#d9a8ff', 13, { bold: true }); FX.ring(t.pos, 1.2, 0.4, '#d9a8ff', 0.4); Sfx.play('throw'); Events.emit('action', { k: 'W' });
    Stats.resolveShot('W', true);
    return true;
  }
  rTarget(aim) {
    const K = this.K.R, ok = e => !e.dead && e.kind !== 'ward' && Game.time - (this.lastHitOn[e.id] ?? -99) <= K.recent && V.dist(this.pos, e.pos) - e.r - this.r <= K.range;
    const at = Game.pickEnemyAt(aim, CONFIG.input.pickRadius); if (at && ok(at)) return at;
    return Game.visibleEnemies().filter(ok).sort((a, b) => V.dist(a.pos, this.pos) - V.dist(b.pos, this.pos))[0] || null;
  }
  // ---------- 피해 훅: 최근 피해(궁 조건)·영감 축적/폭발 ----------
  onDealt(tgt, dmg, o) {
    if (!tgt || tgt.kind === 'ward' || tgt.team === this.team) return;
    this.lastHitOn[tgt.id] = Game.time; tgt.blindT = 0;
    const M = this.mark, W = this.K.W; if (!M || M.target !== tgt || o.markPop || o.tick) return;
    if (M.t >= W.ready) {
      this.mark = null; const acc = M.acc;
      Combat.damage(this, tgt, acc, { type: 'true', source: 'W 축적', markPop: true });
      if (!tgt.dead) Combat.damage(this, tgt, this.calc(W, 'W'), { type: 'skill', source: 'W 폭발', markPop: true });
      tgt.addSlow(W.slow, W.slowDur);
      FX.burst(tgt.pos, '#d9a8ff', 24, 7, 0.6); FX.ring(tgt.pos, 0.3, 1.8, '#d9a8ff', 0.4); FX.text(tgt.pos, '영감 폭발 ' + Math.round(acc), '#d9a8ff', 14, { bold: true });
      Stats.hit('W', 'pop' + Game.time);
    } else M.acc += dmg * (lv(W.acc, this.L('W')) + this.bonusAd * W.accBad) / 100;
  }
  // ---------- 평타: 단검 / 그림자 돌진 중이면 대상 건너편으로 순간이동 + 추가 스킬 피해 ----------
  aaHit(t) {
    const crit = Math.random() < this.critChance, cfg = CONFIG.basicAttack.dagger;
    if (this.shadowT > 0) {
      const dir = V.norm(V.sub(t.pos, this.pos)), from = V.copy(this.pos);
      this.pos = Geo.pushOut(V.add(t.pos, V.mul(dir, t.r + this.r + 0.15)), this.r); this.facing = V.ang(V.mul(dir, -1));
      FX.burst(from, '#4b3a66', 14, 2.5, 0.6, 0.14); FX.trail(from, this.pos, '#7d5cb8', 0.25, 0.25);
      this.shadowT = 0; this.breakStealth();
      Combat.damage(this, t, this.ad * (crit ? cfg.critMul : 1) * (1 + this.aaAmp), { type: 'normal', source: 'AA', crit });
      if (!t.dead) Combat.damage(this, t, this.calc(this.K.E, 'E'), { type: 'skill', source: 'E 그림자 평타' });
      Stats.hit('E', 'aa' + Game.time);
    } else Combat.damage(this, t, this.ad * (crit ? cfg.critMul : 1) * (1 + this.aaAmp), { type: 'normal', source: 'AA', crit });
    if (this.qShots > 0 && --this.qShots <= 0) this.as = this.baseAs;
    Stats.aaHits++; this.lastAA = { time: Game.time }; Vision.act(this, 'attack');
    Events.emit('action', { k: 'AA' });
    FX.slash(this.pos, V.ang(V.sub(t.pos, this.pos)), 1.3, 0.6, this.color, 0.15); FX.burst(t.pos, '#ffffff', 6, 3); Sfx.play('aa');
    Tactical.onAA(this, t);
    this.aa.phase = 'back'; this.aa.t = 0; this.aa.dur = cfg.backRatio / this.atkSpd();
  }
  passiveMoveBoost() {}   // 캐시 패시브 없음
  // ---------- 매 스텝 ----------
  update(dt) {
    if (this.qT > 0 && (this.qT -= dt) <= 0) { this.qShots = 0; this.as = this.baseAs; }
    if (this.shadowT > 0 && (this.shadowT -= dt) <= 0) this.breakStealth();
    for (const o of this.pendingQ) { o.t += dt; if (!o.done && o.t >= o.dur) { o.done = true; if (!this.dead) this.qLand(o); } }
    this.pendingQ = this.pendingQ.filter(o => o.t < o.dur + 0.25);
    if (this.mark) {
      const M = this.mark; M.t += dt;
      if (M.target.dead || M.t > this.K.W.ready + this.K.W.popWindow) this.mark = null;
      else Vision.reveals.push({ team: this.team, pos: V.copy(M.target.pos), r: 2, t: 0.05 });   // 표식 대상 주변 2m 시야
    }
    // P 고독한 예술가: 밤에 시야·이동 속도 증가
    const P = this.K.P; this.sightMul = Vision.night ? 1 + lv(P.sight, this.plv) : 1;
    if (Vision.night) this.addMsBuff(lv(P.ms, this.plv), 0.25, false, 'danP');
    super.update(dt);
  }
  // ---------- 그리기 (월드) ----------
  drawExtra(ctx) {
    const K = this.K.Q;
    for (const o of this.pendingQ) {   // 가위 예고
      if (o.done) continue;
      const apex = V.sub(o.pos, V.mul(o.dir, K.front)), an = V.ang(o.dir), h = K.angle / 2 * Math.PI / 180, k = clamp(o.t / o.dur, 0, 1);
      ctx.save(); ctx.globalAlpha = 0.15 + 0.3 * k; ctx.fillStyle = '#9d6bff';
      ctx.beginPath(); ctx.moveTo(apex.x, apex.y); ctx.arc(apex.x, apex.y, K.len, an - h, an + h); ctx.closePath(); ctx.fill();
      ctx.globalAlpha = 0.6; ctx.fillStyle = '#d9a8ff'; Draw.circle(ctx, o.pos.x, o.pos.y, K.centerR * k); ctx.fill(); ctx.restore();
    }
    if (this.mark && !this.mark.target.dead) {
      const M = this.mark, ready = M.t >= this.K.W.ready, u = M.target;
      KU.ring(ctx, u.pos, u.r + 0.35, ready ? '#ffd1ff' : '#b07cff', ready ? 0.95 : 0.55, !ready);
      if (!ready) { ctx.save(); ctx.strokeStyle = '#d9a8ff'; ctx.lineWidth = 0.08; ctx.beginPath(); ctx.arc(u.pos.x, u.pos.y, u.r + 0.5, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * M.t / this.K.W.ready); ctx.stroke(); ctx.restore(); }
    }
    if (this.shadow) { const u = this.shadow.target; KU.fill(ctx, u.pos, u.r + 0.3, '#2a1840', 0.55); KU.ring(ctx, u.pos, u.r + 0.3 + 0.1 * Math.sin(Game.time * 20), this.color, 0.9); }
    if (this.shadowT > 0 && Settings.showRange) KU.ring(ctx, this.pos, this.K.E.aaRange + this.r, '#7d5cb8', 0.5, true);
  }
  // 조준 미리보기
  drawShape(ctx, k, aim, alpha) {
    const dir = V.norm(V.sub(aim, this.pos)), ang = V.ang(dir), K = this.K;
    ctx.save(); ctx.globalAlpha = alpha; ctx.fillStyle = this.color; ctx.strokeStyle = this.color; ctx.lineWidth = 0.05;
    const ring = r => { ctx.save(); ctx.globalAlpha = 0.5; Draw.circle(ctx, this.pos.x, this.pos.y, r); ctx.stroke(); ctx.restore(); };
    const mark = t => { if (t) { ctx.save(); ctx.globalAlpha = 0.85; ctx.strokeStyle = '#d9a8ff'; Draw.circle(ctx, t.pos.x, t.pos.y, t.r + 0.25); ctx.stroke(); ctx.restore(); } };
    if (k === 'Q') {
      ring(K.Q.range); const d = Math.min(K.Q.range, V.dist(this.pos, aim)), c = V.add(this.pos, V.mul(dir, d)), apex = V.sub(c, V.mul(dir, K.Q.front)), h = K.Q.angle / 2 * Math.PI / 180;
      ctx.beginPath(); ctx.moveTo(apex.x, apex.y); ctx.arc(apex.x, apex.y, K.Q.len, ang - h, ang + h); ctx.closePath(); ctx.fill(); Draw.circle(ctx, c.x, c.y, K.Q.centerR); ctx.stroke();
    } else if (k === 'W') { ring(K.W.range); mark(Game.pickEnemyAt(aim, CONFIG.input.pickRadius)); }
    else if (k === 'E') { Draw.oRect(ctx, this.pos, ang, K.E.dist, 0.6); }
    else if (k === 'R') { ring(K.R.range + this.r); mark(this.rTarget(aim)); }
    else { ctx.restore(); return false; }
    ctx.restore(); return true;
  }
}

// 다니엘 시전 구현 (E·R은 캐시와 같은 시전 상태 기계를 사용)
const DImpl = {
  E: {
    windup: () => 0, recovery: () => 0.05,
    fire(p, c) {
      const K = p.K.E, len = Geo.passDash(p.pos, c.dir, K.dist, p.r, K.wallPass);   // 앞으로 3m, 돌진 거리로 닿는 벽은 넘음(벽 중심 규칙)
      c.data.from = V.copy(p.pos); c.data.to = V.add(p.pos, V.mul(c.dir, len));
      p.startCd('E'); p.stealthT = lv(K.stealth, p.L('E')); p.shadowT = K.shadowDur; p.revealT = 0;
      FX.burst(p.pos, '#4b3a66', 18, 2.5, 0.7, 0.16); Vision.noise(p, 'skill'); Sfx.play('blink');
      FX.text(p.pos, K.name, p.color, 12, { bold: true });
    },
    tick(p, c) { const k = Math.min(1, c.t / p.K.E.time); p.pos = V.lerp(c.data.from, c.data.to, k); return k >= 1; },
  },
  R: {
    windup: () => 0, recovery: () => 0,
    fire(p, c) {
      const K = p.K.R, t = c.data.target;
      p.startCd('R'); p.shadow = { target: t, t: 0, n: 0, exit: false }; p.shadowT = 0;
      t.silence = Math.max(t.silence || 0, K.silence);
      if (t.act && t.act.type === 'cast') t.act = null;   // 침묵: AI 시전 취소
      FX.text(t.pos, K.name + ' — 침묵', p.color, 15, { bold: true }); FX.ring(t.pos, 1.5, 0.3, '#2a1840', 0.4); Sfx.play('ult');
    },
    tick(p, c, dt) {
      const S = p.shadow, K = p.K.R; if (!S) return true;
      const u = S.target; S.t += dt;
      if (S.phase === 'out') {   // 빠져나오는 중
        const k = Math.min(1, (S.t - S.outT) / K.exitTime); p.pos = V.lerp(S.from, S.to, k);
        if (k >= 1) { p.shadow = null; return true; }
        return false;
      }
      if (!u.dead) p.pos = V.copy(u.pos);
      p.untargetable = p.invuln = p.unstoppable = 0.1; p.vel = { x: 0, y: 0 };
      const every = K.dur / K.ticks;
      while (S.n < K.ticks && S.t >= every * (S.n + 1) - 1e-6) { S.n++; if (!u.dead) Combat.damage(p, u, p.calc(K.tick, 'R'), { type: 'skill', source: 'R 지속', noShake: true }); }
      if (S.t >= K.dur || S.exit || u.dead) {
        if (!u.dead) { Combat.damage(p, u, p.calc(K.last, 'R'), { type: 'skill', source: 'R 마무리' }); FX.xslash(u.pos, p.color, 3); Sfx.play('ult'); Stats.hit('R', 'r' + Game.time); }
        const dir = V.dist(Input.world, u.pos) > 0.1 ? V.norm(V.sub(Input.world, u.pos)) : V.fromAng(p.facing);   // 커서 쪽으로 빠져나옴
        S.phase = 'out'; S.outT = S.t; S.from = V.copy(p.pos); S.to = V.add(p.pos, V.mul(dir, Geo.clampDash(p.pos, dir, K.exit, p.r)));
        p.untargetable = p.invuln = K.exitTime;
      }
      return false;
    },
  },
};

// ============================== 휴식 (X) — 시즌 12 규칙 ==============================
// 공식 12.0 패치노트(2026-08-06) "휴식 시스템 개편":
//  · 전투 상태와 무관하게 언제든 시작 · 3단계 캐스팅 — 각 단계가 끝날 때 회복량이 한 번에 적용, 도중 취소 시 진행 중 단계는 회복 없음
//    1단계 3초: 최대 체력 15% / 2단계 3초: 15% / 3단계 4초: 50%  · 모든 단계가 끝나도 휴식 모션은 유지(추가 회복 없음)
//  · 단계가 끝나기 0.25초 이내에 이동을 입력하면 그 단계 회복을 마친 뒤 이동
//  · 취소: X 재입력·이동 명령·피해·군중 제어 → 1초 재사용 대기
//  · 휴식 중 체력바에 캐스팅 바·예상 회복량 표시(적에게도 보임) / 시야 감소: 낮 8.5→7.5m, 밤 0.4m (공식 1.0.0)
const Rest = {
  stageOf(u) { return Math.min(u.rest.stage, CONFIG.rest.stages.length - 1); },
  done(u) { return u.rest && u.rest.stage >= CONFIG.rest.stages.length; },
  inCombat(u) { return Game.time - (u.combatT ?? -99) < CONFIG.rest.combatDur; },
  can(u) { return !u.dead && !u.rest && (u.restCd || 0) <= 0 && u.canAct() && u.canMove() && !u.cast && !(u.act && u.act.type !== 'aa'); },
  // 다음 단계 완료 시 회복량(예상)
  nextHeal(u) { if (!u.rest || Rest.done(u)) return 0; return Math.min(u.maxHp - u.hp, u.maxHp * CONFIG.rest.stages[Rest.stageOf(u)].hp); },
  start(u, quiet) {
    if (!Rest.can(u)) { if (!quiet && u === Game.player && (u.restCd || 0) > 0) FX.toast(`휴식 재사용 대기 ${fmt(u.restCd, 1)}초`, '#aaa'); return false; }
    u.rest = { stage: 0, t: 0 };
    u.moveTarget = null; u.vel = { x: 0, y: 0 }; if (u.act) u.act = null;
    if (u.attackTarget !== undefined) u.attackTarget = null; if (u.attackMove !== undefined) u.attackMove = null; if (u.aa) u.aa.phase = 'none';
    if (!quiet || u === Game.player) FX.text(u.pos, '휴식', '#9fe0ff', 12, { bold: true });
    return true;
  },
  // 단계 완료: 그 단계 회복량을 한 번에
  complete(u) {
    const S = CONFIG.rest.stages[u.rest.stage], h = u.heal(u.maxHp * S.hp, true);
    if (h > 0.5 && (u === Game.player || Vision.visible(Game.player, u))) FX.text(u.pos, `+${Math.round(h)} (휴식 ${u.rest.stage + 1}단계)`, '#5dff9a', 12, { bold: true });
    u.rest.stage++; u.rest.t = 0;
  },
  // voluntary = 본인이 이동·공격·스킬·X로 끝냄 (0.25초 유예 적용)
  stop(u, why, voluntary) {
    const R = u.rest; if (!R) return;
    if (voluntary && !Rest.done(u) && CONFIG.rest.stages[R.stage].dur - R.t <= CONFIG.rest.grace) Rest.complete(u);   // 단계 끝나기 직전 입력 → 회복 후 이동
    u.rest = null; u.restCd = CONFIG.rest.cd;
    if (why && (u === Game.player || Vision.visible(Game.player, u))) FX.text(u.pos, '휴식 취소 · ' + why, '#ffb347', 11);
  },
  // 피해를 받으면 전투 상태 + 휴식 취소 (패치노트: "피해를 받으면 휴식이 취소")
  onDamage(src, tgt, o) {
    if (!o.tick) { tgt.combatT = Game.time; if (src) src.combatT = Game.time; }
    if (tgt.rest) Rest.stop(tgt, '피격');
  },
  update(u, dt) {
    if (u.restCd > 0) u.restCd = Math.max(0, u.restCd - dt);
    const R = u.rest; if (!R) return;
    if (u.dead) { u.rest = null; return; }
    if (u.stun > 0 || u.root > 0 || u.fear > 0 || u.forced || u.silence > 0 || (u.slows && u.slows.length)) { Rest.stop(u, '군중 제어'); return; }
    if (Rest.done(u)) return;   // 모든 단계 완료 — 모션만 유지
    R.t += dt;
    if (R.t >= CONFIG.rest.stages[R.stage].dur) Rest.complete(u);
  },
  // 체력바 아래 캐스팅 바 + 예상 회복량 (아군·적 모두 보임)
  draw(ctx, u) {
    const R = u.rest; if (!R) return;
    const done = Rest.done(u), S = done ? null : CONFIG.rest.stages[R.stage], k = done ? 1 : clamp(R.t / S.dur, 0, 1);
    const w = 1.5, x = u.pos.x - w / 2, y = u.pos.y + u.r + 0.22;
    ctx.save();
    ctx.strokeStyle = 'rgba(159,224,255,.35)'; ctx.lineWidth = 0.06; Draw.circle(ctx, u.pos.x, u.pos.y, u.r + 0.18); ctx.stroke();
    ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(x - 0.03, y - 0.03, w + 0.06, 0.2);
    ctx.fillStyle = done ? '#5d7d8c' : '#9fe0ff'; ctx.fillRect(x, y, w * k, 0.14);
    ctx.font = 'bold 0.3px sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#9fe0ff';
    ctx.fillText(done ? '휴식 완료' : `휴식 ${R.stage + 1}단계  +${Math.round(Rest.nextHeal(u))}`, u.pos.x, y + 0.48);
    ctx.restore();
  },
};

// ============================== 전술 스킬 (F) ==============================
// 수치: 나무위키 「이터널 리턴/전술 스킬」 (2026-10, 시즌 12). 모두 쿨다운 고정. 레벨 = 빌드별 전술 스킬 레벨(CONFIG.skills.F.lvByBuild)
// 'L' = 캐릭터 레벨, '추가 체력' = 현재 최대 체력 − 레벨 기본 체력
const TACTICAL_ORDER = ['blink', 'repulser', 'redstorm', 'lightwing', 'truthblade', 'plasmadash', 'quake', 'transcend', 'artifact', 'nullify'];
const Tactical = {
  def(key) { return CONFIG.tactical[key] || CONFIG.tactical.blink; },
  key() { return CONFIG.tactical[Settings.tactical] ? Settings.tactical : 'blink'; },
  L(p) { return (p.build && p.build.level) || 12; },
  bonusHp(p) { return Math.max(0, p.maxHp - (p.baseHpAtLv || p.maxHp)); },
  foes(p, pos, r) { return Game.enemies().concat(Game.units.filter(u => u.kind === 'animal' && !u.dead)).filter(u => !u.dead && !(u.untargetable > 0) && V.dist(u.pos, pos) - u.r <= r); },
  hit(p, u, amt) { Combat.damage(p, u, amt, { type: 'skill', source: 'F', trauma: true }); Events.emit('skillHit', { k: 'F', target: u }); },
  // 짧은 돌진 (벽 못 넘음)
  dash(p, aim, dist, speed, onEnd) {
    const dir = V.dist(aim, p.pos) > 0.05 ? V.norm(V.sub(aim, p.pos)) : V.fromAng(p.facing), len = Geo.clampDash(p.pos, dir, dist, p.r);
    p.facing = V.ang(dir); p.moveTarget = null;
    p.forced = { from: V.copy(p.pos), to: V.add(p.pos, V.mul(dir, len)), t: 0, dur: Math.max(0.05, len / speed), onEnd: () => onEnd && onEnd(dir) };
    FX.trail(p.pos, V.add(p.pos, V.mul(dir, len)), '#9fd8ff', 0.25, 0.25);
    return dir;
  },
  use(p, aim) {
    const k = this.key(), D = this.def(k), lv = p.skills.F.lv, L = this.L(p), at = i => (Array.isArray(i) ? i[clamp(lv - 1, 0, i.length - 1)] : i);
    p.interruptForCast(); Stats.cast('F'); Vision.act(p, 'skill'); if (p.breakStealth) p.breakStealth();
    FX.text(p.pos, D.name, '#9fd8ff', 12, { bold: true });
    switch (k) {
      case 'blink': p.blink(aim); return true;
      case 'repulser': {   // 3m 이동 후 가장 가까운 적 실험체에게 미사일 5발(2레벨 8발), 발당 10+L+최대 체력 0.6% 고정 피해
        this.dash(p, aim, D.dist, D.speed, () => {
          const t = Game.enemies().filter(u => u.kind !== 'animal' && Vision.visible(p, u) && V.dist(u.pos, p.pos) <= D.range).sort((a, b) => V.dist(a.pos, p.pos) - V.dist(b.pos, p.pos))[0];
          if (!t) return;
          const n = at(D.missiles);
          for (let i = 0; i < n; i++) {
            const pr = new Projectile({ team: 0, owner: p, kind: 'shot', color: '#9fd8ff', len: 0.35, pos: V.copy(p.pos), dir: V.fromAng(V.ang(V.sub(t.pos, p.pos)) + (i - (n - 1) / 2) * 0.22), speed: D.mSpeed, range: 99, width: 0.2,
              onUnit: (pr2, u) => { if (u !== t) return 'continue'; Combat.damage(p, u, D.mBase + L * D.mLv + u.maxHp * D.mHp, { type: 'true', source: 'F', noShake: true }); return 'stop'; } });
            pr.homeTarget = t; pr.homeTurn = 14; Game.projectiles.push(pr);
          }
        });
        break;
      }
      case 'redstorm':   // 0.1초 2.5m 이동 + 기본 공격 사거리 10%(15%) 증가 10(12)초
        this.dash(p, aim, D.dist, D.dist / D.time); p.rangeBuff = { pct: at(D.range), t: at(D.dur) }; break;
      case 'lightwing':  // 둔화 제거, 7초 이속 15/20%+L%·공속 20% / 2레벨: 적 실험체 평타 시 +0.5초
        p.slows = []; p.addMsBuff(at(D.ms) + L * D.msLv, D.dur, false, 'lightwing'); p.lightWing = { t: D.dur }; break;
      case 'truthblade': {   // 주변 2.5m 140+L×20 스킬 피해, 2.5초 이속 20% + 추가 대상당 5/10%(최대 30/40%) / 2레벨: 칼날 하나 더 50+L×10
        const hit = this.foes(p, p.pos, D.r);
        for (const u of hit) { this.hit(p, u, D.base + L * D.lv); if (lv >= 2 && !u.dead) this.hit(p, u, D.base2 + L * D.lv2); }
        const cnt = hit.length * (lv >= 2 ? 2 : 1);
        p.addMsBuff(Math.min(at(D.msMax), D.ms + Math.max(0, cnt - 1) * at(D.msPer)), D.msDur, false, 'truthblade');
        FX.ring(p.pos, 0.3, D.r, '#ffe08a', 0.35, 0.1); for (let i = 0; i < 6; i++) FX.slash(p.pos, i * Math.PI / 3, D.r, 0.4, '#ffe08a', 0.25);
        break;
      }
      case 'plasmadash': {   // 2.5m 이동 + 전방 60° 투사체(사거리 7m·17m/s), 대상당 1회 120/150+L×5/10 피해 + 1초 30% 둔화
        const done = new Set();
        this.dash(p, aim, D.dist, D.speed, dir => {
          for (let i = 0; i < D.shots; i++) {
            const a = V.ang(dir) + (i / (D.shots - 1) - 0.5) * D.angle * Math.PI / 180;
            Game.projectiles.push(new Projectile({ team: 0, owner: p, kind: 'shot', color: '#c79bff', len: 0.5, pos: V.copy(p.pos), dir: V.fromAng(a), speed: D.pSpeed, range: D.pRange, width: 0.35,
              onUnit: (pr, u) => { if (done.has(u.id)) return 'stop'; done.add(u.id); this.hit(p, u, at(D.base) + L * at(D.lv)); u.addSlow(D.slow, D.slowDur); return 'stop'; } }));
          }
        });
        break;
      }
      case 'quake': {   // 주변 4m 50/100+L×10+추가 체력 10% 스킬 피해 + 2초 40/50% 둔화 / 2레벨: 6초간 0.5초마다 3.5m 10+L×2+추가 체력 2.5%
        for (const u of this.foes(p, p.pos, D.r)) { this.hit(p, u, at(D.base) + L * D.lv + this.bonusHp(p) * D.hp); u.addSlow(at(D.slow), D.slowDur); }
        FX.ring(p.pos, 0.3, D.r, '#d9a066', 0.45, 0.14); FX.addShake(5);
        if (lv >= 2) p.quakeAura = { t: D.auraDur, tick: 0 };
        break;
      }
      case 'transcend':   // 3초 보호막 150/200 + 추가 체력 80/100%
        p.shield = Math.max(p.shield, at(D.base) + this.bonusHp(p) * at(D.hp)); p.shieldT = D.dur; FX.ring(p.pos, 0.5, 1.2, '#e9eef7', 0.4); break;
      case 'artifact':   // 2.5초 경직: 무적·대상 지정 불가, 행동 불가 / 2레벨: 경직 중 쿨다운 150% 빠르게
        p.stasis = { t: D.dur, fast: lv >= 2 }; p.invuln = p.untargetable = D.dur; p.moveTarget = null; p.attackTarget = null; p.vel = { x: 0, y: 0 };
        if (p.rest) Rest.stop(p, null, true);
        FX.ring(p.pos, 1, 0.4, '#ffd27a', 0.6); break;
      case 'nullify': {   // 해로운 상태 해제(에어본·넉백·붙잡힘·경직 제외) + 1초 이속 20/30%, 해제했다면 1초 30% 추가
        const had = p.stun > 0 || p.root > 0 || p.fear > 0 || p.silence > 0 || p.blindT > 0 || p.slows.length > 0;
        p.stun = p.root = p.fear = p.silence = p.blindT = 0; p.slows = [];
        p.addMsBuff(at(D.ms) + (had ? D.bonus : 0), D.msDur, false, 'nullify');
        FX.ring(p.pos, 0.3, 1.6, '#a6ffcf', 0.4); break;
      }
    }
    p.startCd('F'); Events.emit('action', { k: 'F' });
    return true;
  },
  // 매 스텝: 붉은 폭풍·라이트 윙·퀘이크 2레벨·아티팩트
  update(p, dt) {
    if (p.rangeBuff && (p.rangeBuff.t -= dt) <= 0) p.rangeBuff = null;
    if (p.lightWing && (p.lightWing.t -= dt) <= 0) p.lightWing = null;
    if (p.quakeAura) {
      const A = p.quakeAura, D = CONFIG.tactical.quake; A.t -= dt; A.tick += dt;
      while (A.tick >= D.auraEvery) { A.tick -= D.auraEvery; for (const u of this.foes(p, p.pos, D.auraR)) Combat.damage(p, u, D.auraBase + this.L(p) * D.auraLv + this.bonusHp(p) * D.auraHp, { type: 'skill', source: 'F', noShake: true, trauma: true }); }
      if (A.t <= 0) p.quakeAura = null;
    }
    if (p.stasis) {
      const S = p.stasis; S.t -= dt;
      if (S.fast) for (const k in p.skills) if (k !== 'F') p.skills[k].cd = Math.max(0, p.skills[k].cd - dt * 1.5);   // 2레벨: 쿨다운 2.5배 속도
      if (S.t <= 0) p.stasis = null;
    }
  },
  // 라이트 윙 2레벨: 적 실험체 평타 적중 시 지속 +0.5초
  onAA(p, t) { if (p.lightWing && p.skills.F.lv >= 2 && t && t.kind !== 'animal' && t.kind !== 'dummy' && t.team !== p.team) { p.lightWing.t += CONFIG.tactical.lightwing.extend; const m = p.msBuffs.find(x => x.tag === 'lightwing'); if (m) m.t += CONFIG.tactical.lightwing.extend; } },
  draw(ctx, p) {
    if (p.quakeAura) KU.ring(ctx, p.pos, CONFIG.tactical.quake.auraR, '#d9a066', 0.35 + 0.15 * Math.sin(Game.time * 12));
    if (p.stasis) { KU.fill(ctx, p.pos, p.r + 0.25, '#ffd27a', 0.35); KU.ring(ctx, p.pos, p.r + 0.3, '#ffe9b0', 0.9); }
    if (p.rangeBuff && Settings.showRange) KU.ring(ctx, p.pos, p.aaCfg().range + p.r, '#ff6b6b', 0.35, true);
  },
};

// ============================== 시야 아이템: 망원 카메라 · 정찰 드론 ==============================
// 나무위키: 망원 카메라 = 반경 13m 시야(벽에 가려짐), 60초, 최대 2개 설치(초과 시 가장 먼저 설치한 것 파괴), 재사용 3초, 은신 감지,
//          상대가 기본 공격 한 번으로 파괴 / 정찰 드론 = 목표 지점 5초 시야(벽 무시), 상대는 드론이 자기 시야 안에 있어야 범위가 보임
class Ward extends Unit {
  constructor(x, y, owner) {
    const C = CONFIG.vision.camera;
    super({ x, y, team: owner.team, kind: 'ward', name: C.name, hp: 1, def: 0, ms: 0, r: 0.28, color: owner.team === 0 ? '#7fd1ff' : '#ff8a8a' });
    this.owner = owner; this.life = C.dur; this.detect = true; this.born = Game.time;
  }
  sightR() { return CONFIG.vision.camera.r * (Vision.night ? CONFIG.vision.cameraNightMul : 1); }
  update(dt) { this.tickStatus(dt); if ((this.life -= dt) <= 0 && !this.dead) { this.dead = true; } }
}

const VisionItems = {
  give(u) { const V0 = CONFIG.vision; u.items = { camera: V0.camera.stock, drone: V0.drone.stock }; u.itemCd = { camera: 0, drone: 0 }; },
  tick(u, dt) { if (!u.itemCd) return; for (const k in u.itemCd) u.itemCd[k] = Math.max(0, u.itemCd[k] - dt); },
  can(u, k) { return Vision.fogOn && u.items && u.items[k] > 0 && u.itemCd[k] <= 0 && !u.dead; },
  // 망원 카메라 설치: 커서 방향 설치 거리 안
  camera(u, pt, quiet) {
    const C = CONFIG.vision.camera;
    if (!this.can(u, 'camera')) { if (!quiet) this.fail(u, 'camera'); return false; }
    const d = Math.min(C.range, V.dist(u.pos, pt)), dir = d > 1e-3 ? V.norm(V.sub(pt, u.pos)) : V.fromAng(u.facing || 0);
    const pos = Geo.pushOut(V.add(u.pos, V.mul(dir, Geo.clampDash(u.pos, dir, d, 0.3))), 0.3);
    const mine = Game.units.filter(w => w.kind === 'ward' && !w.dead && w.owner === u).sort((a, b) => a.born - b.born);
    if (mine.length >= C.max) { mine[0].dead = true; FX.ring(mine[0].pos, 0.2, 0.8, '#8a93a6', 0.3); }   // 최대 2개: 가장 먼저 설치한 것 파괴
    const w = new Ward(pos.x, pos.y, u); Game.units.push(w);
    u.items.camera--; u.itemCd.camera = C.cd;
    FX.ring(pos, 0.3, 1.2, w.color, 0.4); FX.text(pos, C.name, w.color, 11, { bold: true }); Sfx.play('throw');
    return w;
  },
  // 정찰 드론: 목표 지점으로 날아가 5초간 원형 시야(벽 무시)
  drone(u, pt, quiet) {
    const D = CONFIG.vision.drone;
    if (!this.can(u, 'drone')) { if (!quiet) this.fail(u, 'drone'); return false; }
    const d = Math.min(D.range, V.dist(u.pos, pt)), dir = d > 1e-3 ? V.norm(V.sub(pt, u.pos)) : V.fromAng(u.facing || 0);
    const to = V.add(u.pos, V.mul(dir, d)); to.x = clamp(to.x, 0.3, CONFIG.world.w - 0.3); to.y = clamp(to.y, 0.3, CONFIG.world.h - 0.3);
    u.items.drone--; u.itemCd.drone = D.cd; Sfx.play('throw');
    const fly = { from: V.copy(u.pos), to, t: 0, dur: d / D.speed + 0.05, team: u.team };
    (Game.drones = Game.drones || []).push(fly);
    if (!quiet || u === Game.player) FX.text(u.pos, D.name, u.team === 0 ? '#7fd1ff' : '#ff8a8a', 11, { bold: true });
    return true;
  },
  fail(u, k) {
    if (!Vision.fogOn) { FX.toast('시야 아이템은 1:1 결투(시야 시스템)에서만 쓸 수 있습니다', '#aaa'); return; }
    if (!u.items || u.items[k] <= 0) FX.toast(`${CONFIG.vision[k].name}: 이번 라운드 보유량을 다 썼습니다`, '#aaa');
    else { FX.toast(`${CONFIG.vision[k].name}: 재사용 대기 ${fmt(u.itemCd[k], 1)}초`, '#aaa'); Sfx.play('error'); }
  },
  update(dt) {
    const D = CONFIG.vision.drone;
    for (const f of Game.drones || []) {
      f.t += dt;
      if (!f.done && f.t >= f.dur) {
        f.done = true; Vision.reveals.push({ team: f.team, pos: f.to, r: D.r, t: D.dur, drone: true });
        const b = Vision.bushAt(f.to); if (b >= 0) Vision.rustle(b, f.to, f.team);
      }
    }
    Game.drones = (Game.drones || []).filter(f => !f.done);
  },
};

// ============================== AI: 공통 (투사체 위협 판정 · 배회) ==============================
function threatens(u, pr, range) {
  const rel = V.sub(u.pos, pr.pos), along = V.dot(rel, pr.dir);
  if (along < 0 || along > range) return false;
  return Math.abs(rel.x * pr.dir.y - rel.y * pr.dir.x) < u.r + pr.width / 2 + 0.35;
}
const AI = {
  wander(u, dt) { const a = u.ai; a.t = (a.t || 0) - dt; if (a.t <= 0) { a.t = rand(0.8, 1.6); u.moveTarget = Geo.pushOut({ x: u.spawn.x + rand(-1.3, 1.3), y: u.spawn.y + rand(-1.3, 1.3) }, u.r); } },
};

// ============================== AI: 1:1 결투 상대 ==============================
class Duelist extends Unit {
  constructor(x, y, diffKey) {
    const E = CONFIG.enemy, p = Game.player;
    super({ team: 1, x, y, r: E.r, hp: Math.round(p.maxHp * E.hpMul), def: p.build.def * E.defMul, ms: E.ms, color: E.color, name: E.name, kind: 'duelist', facing: Math.PI });
    this.diff = E.difficulty[diffKey]; this.diffKey = diffKey; this.ad = p.ad * E.adMul; this.as = E.as;
    this.cds = { s1: 2, s2: 4, s3: 0 }; this.aaCd = 0; this.act = null; this.thinkT = 0.5; this.dodgeQ = null;
    this.healing = null; this.healAcc = 0; this.healTxtT = 0; this.attacking = false;
    this.stats = { dodges: 0, s1Hits: 0, s1Casts: 0 };
  }
  update(dt) {
    this.tickStatus(dt); if (this.dead) return;
    for (const k in this.cds) this.cds[k] = Math.max(0, this.cds[k] - dt);
    this.aaCd -= dt;
    if (this.healing) {   // 재생 — 치명적 외상의 치유 감소 적용
      const h = Math.min(dt, this.healing.t); this.healing.t -= dt;
      this.healAcc += this.heal(this.healing.rate * h, true);
      if (this.healing.t <= 0) this.healing = null;
    }
    this.healTxtT -= dt;
    if (this.healTxtT <= 0 && this.healAcc > 1) { FX.text(this.pos, '+' + Math.round(this.healAcc) + (this.healRed > 0 ? ' (치유감소)' : ''), '#5dff9a', 12); this.healAcc = 0; this.healTxtT = 0.5; }
    if (this.forced || this.stun > 0) { this.act = null; this.vel = { x: 0, y: 0 }; return; }
    if (this.act) { this.updateAct(dt); return; }
    this.watchThreats(dt);
    this.thinkT -= dt;
    if (this.thinkT <= 0) { this.thinkT = this.diff.react * (0.7 + Math.random() * 0.6); this.think(); if (this.act) return; }
    const p = Game.player;
    if (this.attacking && p && !p.dead) {
      const d = V.dist(this.pos, p.pos) - p.r - this.r;
      if (d <= CONFIG.enemy.range) { this.moveTarget = null; if (this.aaCd <= 0) { this.act = { type: 'aa', t: 0, dur: CONFIG.enemy.aaWindup }; return; } }
      else if (this.canMove()) this.moveTarget = V.copy(p.pos);
    }
    this.moveStep(dt);
  }
  // 날아오는 수쳐를 감지 → 반응 시간 후 회피
  watchThreats(dt) {
    for (const pr of Game.projectiles) {
      if (pr.team === this.team || pr.dead || pr.seen.has(this.id)) continue;
      if (threatens(this, pr, 9)) { pr.seen.add(this.id); if (!this.dodgeQ && Math.random() < this.diff.dodge) this.dodgeQ = { t: this.diff.react * 0.9, pr }; }
    }
    if (!this.dodgeQ) return;
    this.dodgeQ.t -= dt;
    if (this.dodgeQ.t > 0) return;
    const pr = this.dodgeQ.pr; this.dodgeQ = null;
    if (pr.dead || !this.canMove()) return;
    const rel = V.sub(this.pos, pr.pos), side = (pr.dir.x * rel.y - pr.dir.y * rel.x) >= 0 ? 1 : -1, pd = V.mul(V.perp(pr.dir), side);
    this.stats.dodges++; this.attacking = false;
    if (this.cds.s2 <= 0 && (this.diffKey === 'hard' || Math.random() < 0.3)) this.startDash(pd, 3);
    else { this.moveTarget = Geo.pushOut(V.add(this.pos, V.mul(pd, 2.2)), this.r); this.thinkT = 0.5; }
  }
  think() {
    const p = Game.player; if (!p || p.dead) return;
    const E = CONFIG.enemy, d = V.dist(this.pos, p.pos), hpR = this.hp / this.maxHp, pR = p.hp / p.maxHp;
    if (hpR < 0.4 && this.cds.s3 <= 0 && !this.healing) {
      this.healing = { t: E.s3.dur, rate: this.maxHp * E.s3.healPct / E.s3.dur }; this.cds.s3 = E.s3.cd; FX.text(this.pos, E.s3.name, '#5dff9a', 14, { bold: true });
    }
    // 어려움: 캐시의 이동기(Q/블링크)·E 쿨타임을 보고 진입 여부 결정
    let engage = true;
    if (this.diff.kite) {
      engage = p.skills.Q.cd > 1.5 || p.skills.F.cd > 1.5 || p.skills.E.cd > 2 || pR < 0.4 || hpR > pR + 0.3;
      this.kiteT = (this.kiteT || 0) + this.diff.react;   // 너무 오래 견제만 하면 4초간 진입
      if (this.kiteT > 8) { this.commitT = 4; this.kiteT = 0; }
      if (this.commitT > 0) { this.commitT -= this.diff.react; engage = true; }
      if (engage) this.kiteT = 0;
    }
    if (this.diffKey === 'hard' && hpR < 0.25 && pR > 0.5 && this.cds.s2 <= 0 && this.canMove()) { this.startDash(V.norm(V.sub(this.pos, p.pos)), E.s2.dist); return; }
    if (this.cds.s1 <= 0 && d < E.s1.range && Math.random() < 0.85) { this.startS1(p); return; }
    if (engage) {
      if (d > E.range + this.r + p.r + 0.1) {
        if (this.cds.s2 <= 0 && d > 3 && d < E.s2.dist + 1.5 && this.canMove() && (this.diffKey !== 'easy' || Math.random() < 0.4)) { this.startDash(V.norm(V.sub(p.pos, this.pos)), Math.min(E.s2.dist, d - 1.2)); return; }
        this.moveTarget = V.copy(p.pos);
      }
      this.attacking = true;
    } else {   // 카이팅: 수쳐 사거리 바깥 유지
      this.attacking = false;
      const want = CONFIG.skills.E.range + 1.0, away = V.norm(V.sub(this.pos, p.pos)), side = Math.random() < 0.5 ? 1 : -1;
      if (d < want - 0.4) this.moveTarget = Geo.pushOut(V.add(this.pos, V.add(V.mul(away, 2), V.mul(V.perp(away), side * 1.2))), this.r);
      else if (d > want + 1.5) this.moveTarget = Geo.pushOut(V.add(p.pos, V.mul(away, want)), this.r);
      else this.moveTarget = Geo.pushOut(V.add(this.pos, V.mul(V.perp(away), side * 1.5)), this.r);
    }
  }
  startS1(p) {
    const E = CONFIG.enemy.s1, tt = E.windup + V.dist(this.pos, p.pos) / E.speed;
    const pred = V.add(p.pos, V.mul(p.vel, tt * this.diff.lead));
    const ang = V.ang(V.sub(pred, this.pos)) + (Math.random() - 0.5) * 2 * this.diff.aimErr;
    this.act = { type: 's1', t: 0, dur: E.windup, dir: V.fromAng(ang) }; this.cds.s1 = E.cd; this.stats.s1Casts++; this.moveTarget = null;
  }
